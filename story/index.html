<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<style id="no-zoom-style">*{touch-action:manipulation}canvas{touch-action:none}</style>
<script id="no-zoom-guard">/* 게임 중 화면이 갑자기 확대되는 것 방지: 핀치·더블탭 줌 차단 */
(function(){var s=function(e){e.preventDefault()};
document.addEventListener('gesturestart',s,{passive:false});
document.addEventListener('gesturechange',s,{passive:false});
document.addEventListener('gestureend',s,{passive:false});
document.addEventListener('dblclick',s,{passive:false});})();</script>
<meta name="theme-color" content="#1d1636">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="이야기 극장">
<link rel="apple-touch-icon" href="../icon.png">
<link rel="icon" type="image/png" href="../icon.png">
<link rel="manifest" href="../manifest.json">
<title>이야기 극장</title>
<style>
  /* 잠들기 전 이불 속 극장 — 의도된 단일 테마 (허브와 같은 밤하늘 계열) */
  :root {
    --night: #1d1636;
    --night-deep: #120d26;
    --star: #ffd93d;
    --paper: #fff6e6;
    --ink: #2b2350;
    --cloud: rgba(255, 246, 230, 0.72);
    --mint: #6bcb77;
    --rose: #f79ac0;
  }
  * { box-sizing: border-box; margin: 0; }
  html {
    height: 100%;
    background: var(--night-deep);
    overscroll-behavior: none;
    -webkit-text-size-adjust: 100%;
  }
  body {
    min-height: 100%;
    background: linear-gradient(180deg, var(--night-deep) 0%, var(--night) 50%, #2a2050 100%);
    background-attachment: fixed;
    color: var(--paper);
    font-family: "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
    -webkit-tap-highlight-color: transparent;
    overflow-x: hidden;
    -webkit-user-select: none;
    user-select: none;
    -webkit-touch-callout: none;
  }
  .wrap {
    position: relative;
    max-width: 760px;
    margin: 0 auto;
    padding:
      calc(clamp(20px, 4vw, 40px) + env(safe-area-inset-top, 0px))
      calc(clamp(16px, 4vw, 28px) + env(safe-area-inset-right, 0px))
      calc(140px + env(safe-area-inset-bottom, 0px))
      calc(clamp(16px, 4vw, 28px) + env(safe-area-inset-left, 0px));
    display: flex;
    flex-direction: column;
    gap: clamp(18px, 3.5vw, 28px);
  }
  header { text-align: center; display: flex; flex-direction: column; gap: 8px; }
  .home {
    align-self: flex-start;
    text-decoration: none;
    color: var(--cloud);
    font-weight: 900;
    font-size: clamp(14px, 3.2vw, 16px);
    background: rgba(255, 246, 230, 0.1);
    border: 2px solid rgba(255, 246, 230, 0.28);
    border-radius: 999px;
    padding: 8px 16px;
  }
  h1 {
    font-size: clamp(30px, 8vw, 46px);
    font-weight: 900;
    letter-spacing: 0.04em;
    color: var(--star);
    text-shadow: 0 4px 0 rgba(0, 0, 0, 0.35);
  }
  .sub { font-size: clamp(14px, 3.2vw, 17px); font-weight: 700; color: var(--cloud); }
  .offline-panel {
    display: grid;
    grid-template-columns: minmax(0, 1fr) auto;
    align-items: center;
    gap: 10px 14px;
    padding: 16px;
    border: 2px solid rgba(255, 217, 61, 0.38);
    border-radius: 22px;
    background: rgba(255, 246, 230, 0.1);
  }
  .offline-copy { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
  .offline-copy strong { color: var(--star); font-size: clamp(15px, 3.5vw, 18px); }
  .offline-copy span, #offlineStatus {
    color: var(--cloud);
    font-size: clamp(12px, 2.8vw, 14px);
    font-weight: 700;
    line-height: 1.45;
  }
  #saveAllAudio {
    min-width: 132px;
    min-height: 60px;
    padding: 10px 16px;
    border: 3px solid rgba(20, 12, 40, 0.7);
    border-radius: 18px;
    background: var(--star);
    color: var(--ink);
    box-shadow: 0 5px 0 rgba(10, 6, 24, 0.5);
    font: inherit;
    font-weight: 900;
    cursor: pointer;
    touch-action: manipulation;
  }
  #saveAllAudio:active:not(:disabled) { transform: translateY(3px); box-shadow: 0 2px 0 rgba(10, 6, 24, 0.5); }
  #saveAllAudio:focus-visible { outline: 4px solid var(--paper); outline-offset: 3px; }
  #saveAllAudio:disabled { cursor: wait; opacity: 0.68; }
  #offlineProgress, #offlineStatus { grid-column: 1 / -1; width: 100%; }
  #offlineProgress {
    height: 14px;
    overflow: hidden;
    border: 0;
    border-radius: 999px;
    accent-color: var(--mint);
  }
  #offlineStatus { min-height: 1.45em; }
  .offline-panel.is-complete { border-color: rgba(107, 203, 119, 0.85); background: rgba(107, 203, 119, 0.13); }
  .offline-panel.is-error { border-color: rgba(247, 154, 192, 0.88); }
  @media (max-width: 480px) {
    .offline-panel { grid-template-columns: 1fr; }
    #saveAllAudio { width: 100%; }
  }
  .shelf { display: flex; flex-direction: column; gap: clamp(12px, 2.5vw, 18px); }
  .book {
    display: flex;
    align-items: center;
    gap: 16px;
    width: 100%;
    text-align: left;
    padding: clamp(14px, 3vw, 20px);
    border-radius: 24px;
    border: 3px solid rgba(20, 12, 40, 0.55);
    box-shadow: 0 6px 0 rgba(10, 6, 24, 0.5);
    color: var(--ink);
    cursor: pointer;
    font-family: inherit;
    transition: transform 0.12s ease-out, box-shadow 0.12s ease-out;
    touch-action: pan-y;
  }
  .book:active { transform: translateY(4px); box-shadow: 0 2px 0 rgba(10, 6, 24, 0.5); }
  .book:focus-visible { outline: 4px solid var(--star); outline-offset: 3px; }
  .book.sea  { background: linear-gradient(135deg, #ffd9a0, #7fb4e8); }
  .book.rose { background: linear-gradient(135deg, #ffd3e2, #cdb7f6); }
  .book .cover {
    flex: 0 0 auto;
    width: clamp(58px, 11vw, 76px);
    height: clamp(58px, 11vw, 76px);
    border-radius: 20px;
    background: rgba(255, 252, 244, 0.85);
    border: 3px solid rgba(20, 12, 40, 0.45);
    display: grid;
    place-items: center;
    font-size: clamp(30px, 6.5vw, 42px);
  }
  .book .meta { display: flex; flex-direction: column; gap: 4px; min-width: 0; flex: 1; }
  .book .name { font-size: clamp(17px, 4vw, 22px); font-weight: 900; line-height: 1.25; }
  .book .desc { font-size: clamp(12.5px, 2.9vw, 15px); font-weight: 700; opacity: 0.82; }
  .book .state {
    flex: 0 0 auto;
    font-size: clamp(22px, 5vw, 28px);
    min-width: 1.4em;
    text-align: center;
  }
  .book.playing { outline: 4px solid var(--star); outline-offset: 2px; }
  /* ── 플레이어 바 ── */
  #bar {
    position: fixed;
    left: 0; right: 0; bottom: 0;
    background: rgba(18, 13, 38, 0.97);
    border-top: 3px solid rgba(255, 217, 61, 0.5);
    padding: 12px calc(clamp(16px, 4vw, 28px) + env(safe-area-inset-right, 0px))
             calc(12px + env(safe-area-inset-bottom, 0px))
             calc(clamp(16px, 4vw, 28px) + env(safe-area-inset-left, 0px));
    display: none;
    flex-direction: column;
    gap: 8px;
  }
  #bar.on { display: flex; }
  #barTitle {
    text-align: center;
    font-weight: 900;
    font-size: clamp(14px, 3.4vw, 17px);
    color: var(--star);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  #seekRow { display: flex; align-items: center; gap: 10px; }
  #seek {
    flex: 1;
    -webkit-appearance: none;
    appearance: none;
    height: 12px;
    border-radius: 999px;
    background: rgba(255, 246, 230, 0.22);
    outline: none;
  }
  #seek::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 26px; height: 26px;
    border-radius: 50%;
    background: var(--star);
    border: 3px solid rgba(20, 12, 40, 0.7);
  }
  .time { font-size: clamp(11px, 2.6vw, 13px); font-weight: 700; color: var(--cloud); font-variant-numeric: tabular-nums; min-width: 3.4em; text-align: center; }
  #ctrls { display: flex; justify-content: center; align-items: center; gap: clamp(14px, 4vw, 26px); }
  #ctrls button {
    font-family: inherit;
    cursor: pointer;
    border: 3px solid rgba(20, 12, 40, 0.7);
    border-radius: 50%;
    background: rgba(255, 246, 230, 0.92);
    color: var(--ink);
    font-weight: 900;
    box-shadow: 0 4px 0 rgba(10, 6, 24, 0.5);
    transition: transform 0.1s ease-out, box-shadow 0.1s ease-out;
    display: grid;
    place-items: center;
    touch-action: manipulation;
  }
  #ctrls button:active { transform: translateY(3px); box-shadow: 0 1px 0 rgba(10, 6, 24, 0.5); }
  #ctrls button:focus-visible { outline: 4px solid var(--star); outline-offset: 2px; }
  .small { width: clamp(52px, 12vw, 62px); height: clamp(52px, 12vw, 62px); font-size: clamp(13px, 3vw, 15px); }
  #playBtn { width: clamp(72px, 16vw, 86px); height: clamp(72px, 16vw, 86px); font-size: clamp(30px, 7vw, 38px); background: var(--star); }
  footer { text-align: center; color: var(--cloud); font-size: clamp(12px, 2.8vw, 14px); font-weight: 700; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <a class="home" href="../">◀ 모험 상자</a>
    <h1>이야기 극장 🌙</h1>
    <p class="sub">세계의 옛이야기를 귀로 떠나는 여행</p>
  </header>

  <section class="offline-panel" id="offlinePanel" aria-labelledby="offlineTitle">
    <div class="offline-copy">
      <strong id="offlineTitle">여행 전에 이야기 저장</strong>
      <span>재생한 편은 자동 저장돼요. 모두 저장하면 비행기 모드에서도 들어요.</span>
    </div>
    <button id="saveAllAudio" type="button" disabled>📥 모두 저장</button>
    <progress id="offlineProgress" max="20" value="0" hidden aria-label="이야기 저장 진행률"></progress>
    <p id="offlineStatus" role="status" aria-live="polite">오프라인 기능을 준비하는 중…</p>
  </section>

  <div class="shelf" id="shelf"></div>

  <footer>다 들은 이야기에는 ⭐ 이 붙어요</footer>
</div>

<div id="bar">
  <div id="barTitle"></div>
  <div id="seekRow">
    <span class="time" id="tCur">0:00</span>
    <input type="range" id="seek" min="0" max="100" step="0.1" value="0" aria-label="재생 위치">
    <span class="time" id="tDur">0:00</span>
  </div>
  <div id="ctrls">
    <button class="small" id="back10" aria-label="10초 뒤로">◀ 10</button>
    <button id="playBtn" aria-label="재생">▶</button>
    <button class="small" id="fwd10" aria-label="10초 앞으로">10 ▶</button>
  </div>
</div>

<audio id="player" preload="metadata"></audio>

<script>
"use strict";
const EPISODES = [
  { id: "cinderella", cls: "rose", emoji: "👠",
    title: "신데렐라",
    desc: "유리 구두와 호박 마차 · 세계에서 가장 사랑받는 이야기",
    src: "audio/cinderella.mp3" },
  { id: "odyssey_cyclops", cls: "sea", emoji: "⛵",
    title: "오디세이 1화 · 외눈박이 거인",
    desc: "꾀 많은 오디세우스와 거인 폴리페모스의 대결",
    src: "audio/odyssey_cyclops.mp3" },
  { id: "jack_story", cls: "sea", emoji: "🫘",
    title: "잭과 콩나무",
    desc: "구름 위 거인의 성과 황금 거위",
    src: "audio/jack_story.mp3" },
  { id: "redhood_story", cls: "rose", emoji: "🧢",
    title: "빨간 모자",
    desc: "할머니 귀가 왜 이렇게 커요?",
    src: "audio/redhood_story.mp3" },
  { id: "threepigs", cls: "sea", emoji: "🐷",
    title: "아기돼지 삼형제",
    desc: "후우 불어도 끄떡없는 벽돌집",
    src: "audio/threepigs.mp3" },
  { id: "tortoisehare", cls: "rose", emoji: "🐢",
    title: "토끼와 거북",
    desc: "느려도 멈추지 않으면 이긴다",
    src: "audio/tortoisehare.mp3" },
  { id: "pinocchio", cls: "sea", emoji: "🤥",
    title: "피노키오",
    desc: "거짓말하면 코가 쑥! 고래 배 속 대모험",
    src: "audio/pinocchio.mp3" },
  { id: "witch", cls: "rose", emoji: "🍭",
    title: "헨젤과 그레텔",
    desc: "과자로 만든 집과 그레텔의 꾀",
    src: "audio/witch.mp3" },
  { id: "bremen", cls: "sea", emoji: "🎺",
    title: "브레멘 음악대",
    desc: "히힝 멍멍 야옹 꼬끼오, 네 친구의 합창",
    src: "audio/bremen.mp3" },
  { id: "snowqueen", cls: "rose", emoji: "❄️",
    title: "눈의 여왕",
    desc: "얼음 궁전에 갇힌 친구를 찾아서",
    src: "audio/snowqueen.mp3" },
  { id: "mermaid", cls: "sea", emoji: "🧜‍♀️",
    title: "인어공주",
    desc: "목소리를 잃은 공주의 용감한 노래",
    src: "audio/mermaid.mp3" },
  { id: "genie", cls: "rose", emoji: "🪔",
    title: "알라딘과 요술 램프",
    desc: "펑! 세 가지 소원을 들어드립니다",
    src: "audio/genie.mp3" },
  { id: "heracles", cls: "sea", emoji: "💪",
    title: "영웅 헤라클레스",
    desc: "열두 가지 과업에 도전하는 최강 영웅",
    src: "audio/heracles.mp3" },
  { id: "perseus", cls: "rose", emoji: "🛡️",
    title: "페르세우스와 메두사",
    desc: "거울 방패로 맞서는 지혜의 모험",
    src: "audio/perseus.mp3" },
  { id: "midas", cls: "sea", emoji: "👑",
    title: "미다스 왕의 황금 손",
    desc: "만지면 뭐든 황금! 좋기만 할까?",
    src: "audio/midas.mp3" },
  { id: "sunwukong", cls: "rose", emoji: "🐒",
    title: "손오공",
    desc: "분신술과 여의봉, 하늘을 나는 원숭이 영웅",
    src: "audio/sunwukong.mp3" },
  { id: "honggildong", cls: "sea", emoji: "🏹",
    title: "홍길동전",
    desc: "동에 번쩍 서에 번쩍, 의로운 도적",
    src: "audio/honggildong.mp3" },
  { id: "sunmoon", cls: "rose", emoji: "🐯",
    title: "해와 달이 된 오누이",
    desc: "떡 하나 주면 안 잡아먹지!",
    src: "audio/sunmoon.mp3" },
  { id: "arthur", cls: "sea", emoji: "🗡️",
    title: "아서왕과 전설의 검",
    desc: "바위에 꽂힌 검을 뽑는 자가 왕이 되리라",
    src: "audio/arthur.mp3" },
  { id: "bongi", cls: "rose", emoji: "💧",
    title: "봉이 김선달",
    desc: "대동강 물을 팔아넘긴 조선 최고의 꾀보 · 아빠의 인생 이야기",
    src: "audio/bongi.mp3" },
];

const store = {
  get(k) { try { return localStorage.getItem("story_" + k); } catch (e) { return null; } },
  set(k, v) { try { localStorage.setItem("story_" + k, v); } catch (e) {} },
};

const shelf = document.getElementById("shelf");
const bar = document.getElementById("bar");
const barTitle = document.getElementById("barTitle");
const seek = document.getElementById("seek");
const tCur = document.getElementById("tCur");
const tDur = document.getElementById("tDur");
const playBtn = document.getElementById("playBtn");
const player = document.getElementById("player");
const offlinePanel = document.getElementById("offlinePanel");
const saveAllAudio = document.getElementById("saveAllAudio");
const offlineProgress = document.getElementById("offlineProgress");
const offlineStatus = document.getElementById("offlineStatus");
let current = null;
let seeking = false;
let workerRegistrationPromise = null;
let audioSaveRequestId = "";
let audioSaveChannel = null;
let audioSaveWatchdog = null;
const SERVICE_WORKER_READY_TIMEOUT_MS = 12000;
const AUDIO_SAVE_WATCHDOG_MS = 55000;

function fmt(sec) {
  if (!isFinite(sec)) return "0:00";
  const m = Math.floor(sec / 60), s = Math.floor(sec % 60);
  return m + ":" + String(s).padStart(2, "0");
}

function stateIcon(ep) {
  if (current && current.id === ep.id && !player.paused) return "🔊";
  if (store.get("done_" + ep.id) === "1") return "⭐";
  return "▶️";
}

function renderShelf() {
  shelf.innerHTML = "";
  EPISODES.forEach(ep => {
    const b = document.createElement("button");
    b.className = "book " + ep.cls + (current && current.id === ep.id ? " playing" : "");
    b.innerHTML =
      '<span class="cover">' + ep.emoji + '</span>' +
      '<span class="meta"><span class="name">' + ep.title + '</span>' +
      '<span class="desc">' + ep.desc + '</span></span>' +
      '<span class="state">' + stateIcon(ep) + '</span>';
    b.addEventListener("click", () => tap(ep));
    shelf.appendChild(b);
  });
}

function tap(ep) {
  if (current && current.id === ep.id) { toggle(); return; }
  current = ep;
  cachePlayedEpisode(ep);
  player.src = ep.src;
  const saved = parseFloat(store.get("pos_" + ep.id));
  player.currentTime = 0;
  player.addEventListener("loadedmetadata", function once() {
    player.removeEventListener("loadedmetadata", once);
    if (isFinite(saved) && saved > 3 && saved < player.duration - 5) player.currentTime = saved;
    tDur.textContent = fmt(player.duration);
  });
  barTitle.textContent = ep.emoji + " " + ep.title;
  bar.classList.add("on");
  player.play();
  setMediaSession(ep);
  renderShelf();
}

function toggle() {
  if (player.paused) player.play(); else player.pause();
}

playBtn.addEventListener("click", toggle);
document.getElementById("back10").addEventListener("click", () => { player.currentTime = Math.max(0, player.currentTime - 10); });
document.getElementById("fwd10").addEventListener("click", () => { player.currentTime = Math.min(player.duration || 0, player.currentTime + 10); });

player.addEventListener("play",  () => { playBtn.textContent = "❚❚"; renderShelf(); });
player.addEventListener("pause", () => { playBtn.textContent = "▶"; renderShelf(); });
player.addEventListener("timeupdate", () => {
  if (!current) return;
  if (!seeking && player.duration) {
    seek.value = (player.currentTime / player.duration) * 100;
    tCur.textContent = fmt(player.currentTime);
  }
  if (Math.floor(player.currentTime) % 5 === 0) store.set("pos_" + current.id, String(player.currentTime));
});
player.addEventListener("ended", () => {
  if (!current) return;
  store.set("done_" + current.id, "1");
  store.set("pos_" + current.id, "0");
  const idx = EPISODES.findIndex(e => e.id === current.id);
  const next = EPISODES[idx + 1];
  if (next) { tap(next); } else { playBtn.textContent = "▶"; renderShelf(); }
});

seek.addEventListener("input", () => {
  seeking = true;
  if (player.duration) tCur.textContent = fmt((seek.value / 100) * player.duration);
});
seek.addEventListener("change", () => {
  if (player.duration) player.currentTime = (seek.value / 100) * player.duration;
  seeking = false;
});

function setMediaSession(ep) {
  if (!("mediaSession" in navigator)) return;
  navigator.mediaSession.metadata = new MediaMetadata({
    title: ep.title, artist: "이야기 극장", album: "세계 명작 오디오북",
  });
  navigator.mediaSession.setActionHandler("play", () => player.play());
  navigator.mediaSession.setActionHandler("pause", () => player.pause());
  navigator.mediaSession.setActionHandler("seekbackward", () => { player.currentTime -= 10; });
  navigator.mediaSession.setActionHandler("seekforward", () => { player.currentTime += 10; });
}

function offlineEpisodes(episodes) {
  return (episodes || EPISODES).map(ep => ({
    id: ep.id,
    title: ep.title,
    url: new URL(ep.src, window.location.href).href,
  }));
}

function setOfflineState(message, kind) {
  offlineStatus.textContent = message;
  offlinePanel.classList.toggle("is-error", kind === "error");
  offlinePanel.classList.toggle("is-complete", kind === "complete");
}

function withTimeout(promise, timeoutMs, message) {
  let timeoutId;
  const timeout = new Promise((resolve, reject) => {
    timeoutId = setTimeout(() => reject(new Error(message)), timeoutMs);
  });
  return Promise.race([Promise.resolve(promise), timeout])
    .finally(() => clearTimeout(timeoutId));
}

function registerOfflineWorker() {
  if (workerRegistrationPromise) return workerRegistrationPromise;
  if (!("serviceWorker" in navigator)) {
    saveAllAudio.disabled = true;
    setOfflineState("이 브라우저에서는 오프라인 저장을 사용할 수 없어요.", "error");
    return Promise.reject(new Error("Service Worker unavailable"));
  }
  const scriptUrl = new URL("../sw.js", window.location.href);
  const scopeUrl = new URL("../", window.location.href);
  workerRegistrationPromise = navigator.serviceWorker
    .getRegistration(scopeUrl.href)
    .then(registration => registration || navigator.serviceWorker.register(
      scriptUrl,
      { scope: scopeUrl.href }
    ))
    .then(registration => registration.active
      ? registration
      : withTimeout(
        navigator.serviceWorker.ready,
        SERVICE_WORKER_READY_TIMEOUT_MS,
        "오프라인 준비 시간이 초과됐어요."
      ))
    .then(registration => {
      saveAllAudio.disabled = false;
      return registration;
    })
    .catch(error => {
      workerRegistrationPromise = null;
      saveAllAudio.disabled = true;
      const timedOut = /시간|초과/.test(error && error.message || "");
      setOfflineState(
        timedOut
          ? "오프라인 준비가 오래 걸려요. 인터넷 연결 후 페이지를 다시 열어 주세요."
          : "오프라인 준비에 실패했어요. 인터넷 연결을 확인해 주세요.",
        "error"
      );
      throw error;
    });
  return workerRegistrationPromise;
}

async function sendOfflineMessage(type, requestId, episodes, onMessage) {
  const registration = await registerOfflineWorker();
  const worker = registration.active || registration.waiting || registration.installing;
  if (!worker) throw new Error("활성 서비스 워커가 없어요");
  const channel = new MessageChannel();
  channel.port1.onmessage = event => onMessage(event.data || {}, channel.port1);
  try {
    worker.postMessage({ type, requestId, episodes: offlineEpisodes(episodes) }, [channel.port2]);
  } catch (error) {
    channel.port1.close();
    throw error;
  }
  return channel;
}

function showAudioCacheStatus() {
  const requestId = "status-" + Date.now();
  const timeoutId = setTimeout(() => {
    setOfflineState("저장 상태를 확인하지 못했어요. 저장 버튼은 그대로 사용할 수 있어요.", "error");
  }, 10000);
  sendOfflineMessage("GET_AUDIO_CACHE_STATUS", requestId, EPISODES, (data, port) => {
    if (data.type !== "AUDIO_CACHE_STATUS" || data.requestId !== requestId) return;
    clearTimeout(timeoutId);
    offlineProgress.max = data.total || EPISODES.length;
    offlineProgress.value = data.saved || 0;
    offlineProgress.hidden = !(data.saved > 0 && data.saved < data.total);
    if (data.saved === data.total && data.total > 0) {
      setOfflineState("✅ 이야기 " + data.total + "편이 모두 저장됐어요.", "complete");
      saveAllAudio.textContent = "✅ 저장 완료";
    } else if (data.saved > 0) {
      setOfflineState("현재 " + data.saved + "/" + data.total + "편이 기기에 저장되어 있어요.");
    } else {
      setOfflineState("재생한 이야기는 자동으로 기기에 저장돼요.");
    }
    port.close();
  }).catch(() => clearTimeout(timeoutId));
}

function cachePlayedEpisode(ep) {
  registerOfflineWorker().then(registration => {
    const worker = registration.active || registration.waiting || registration.installing;
    if (worker) worker.postMessage({
      type: "CACHE_AUDIO",
      episodes: offlineEpisodes([ep]),
    });
  }).catch(() => {});
}

function clearAudioSaveWatchdog() {
  if (audioSaveWatchdog) clearTimeout(audioSaveWatchdog);
  audioSaveWatchdog = null;
}

function armAudioSaveWatchdog() {
  clearAudioSaveWatchdog();
  audioSaveWatchdog = setTimeout(() => {
    if (audioSaveChannel) audioSaveChannel.port1.close();
    audioSaveChannel = null;
    saveAllAudio.disabled = false;
    saveAllAudio.textContent = "다시 저장";
    setOfflineState("저장 응답이 오래 걸려 멈췄어요. 연결을 확인하고 다시 눌러 주세요.", "error");
  }, AUDIO_SAVE_WATCHDOG_MS);
}

saveAllAudio.addEventListener("click", () => {
  audioSaveRequestId = "all-" + Date.now();
  offlineProgress.hidden = false;
  offlineProgress.max = EPISODES.length;
  offlineProgress.value = 0;
  saveAllAudio.disabled = true;
  saveAllAudio.textContent = "저장 중…";
  setOfflineState("0/" + EPISODES.length + "편 · 저장을 시작해요.");
  if (audioSaveChannel) audioSaveChannel.port1.close();
  armAudioSaveWatchdog();

  sendOfflineMessage("CACHE_ALL_AUDIO", audioSaveRequestId, EPISODES, (data, port) => {
    if (data.requestId !== audioSaveRequestId) return;
    armAudioSaveWatchdog();
    if (data.type === "AUDIO_CACHE_START" || data.type === "AUDIO_CACHE_PROGRESS") {
      const total = data.total || EPISODES.length;
      const saved = Math.min(data.saved || 0, total);
      offlineProgress.max = total;
      offlineProgress.value = saved;
      const title = data.title ? " · " + data.title : "";
      setOfflineState(saved + "/" + total + "편 저장됨" + title);
    } else if (data.type === "AUDIO_CACHE_ERROR") {
      setOfflineState("「" + (data.title || "이야기") + "」 저장에 실패했어요. 계속 시도할게요.", "error");
    } else if (data.type === "AUDIO_CACHE_COMPLETE") {
      clearAudioSaveWatchdog();
      const total = data.total || EPISODES.length;
      const saved = Math.min(data.saved || 0, total);
      offlineProgress.max = total;
      offlineProgress.value = saved;
      saveAllAudio.disabled = false;
      if (saved === total) {
        saveAllAudio.textContent = "✅ 저장 완료";
        setOfflineState("✅ 이야기 " + total + "편이 모두 저장됐어요. 이제 인터넷 없이도 들어요!", "complete");
      } else {
        saveAllAudio.textContent = "다시 저장";
        setOfflineState((total - saved) + "편을 저장하지 못했어요. 인터넷 연결 후 다시 눌러 주세요.", "error");
      }
      port.close();
      audioSaveChannel = null;
    }
  }).then(channel => {
    audioSaveChannel = channel;
  }).catch(() => {
    clearAudioSaveWatchdog();
    saveAllAudio.disabled = false;
    saveAllAudio.textContent = "다시 저장";
    setOfflineState("저장을 시작하지 못했어요. 인터넷 연결을 확인해 주세요.", "error");
  });
});

registerOfflineWorker().then(showAudioCacheStatus).catch(() => {});
renderShelf();
</script>
