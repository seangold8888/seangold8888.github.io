<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#1d1636">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="영어 그림책">
<link rel="apple-touch-icon" href="../../icon.png">
<link rel="icon" type="image/png" href="../../icon.png">
<link rel="manifest" href="../../manifest.json">
<title>영어 그림책</title>
<style>
  :root { --night:#1d1636; --deep:#120d26; --star:#ffd93d; --paper:#fff6e6; --ink:#2b2350; --soft:#c6cee6; --mint:#6bcb77; }
  * { box-sizing:border-box; margin:0; }
  html { background:var(--deep); -webkit-text-size-adjust:100%; }
  body { min-height:100vh; background:linear-gradient(180deg,var(--deep),var(--night) 55%,#2a2050); color:var(--paper);
    font-family:"Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif; -webkit-tap-highlight-color:transparent; }
  button { font:inherit; cursor:pointer; }
  .wrap { max-width:820px; margin:0 auto; padding:calc(18px + env(safe-area-inset-top,0px)) 16px calc(40px + env(safe-area-inset-bottom,0px)); }
  .top { display:flex; align-items:center; gap:12px; margin-bottom:18px; }
  .back { color:var(--paper); text-decoration:none; font-weight:800; padding:10px 14px; border-radius:12px; background:rgba(255,255,255,.08); border:0; }
  .top h1 { font-size:clamp(22px,4vw,30px); }
  .lead { color:var(--soft); margin:-6px 0 18px; line-height:1.5; }
  .shelf { display:grid; grid-template-columns:repeat(auto-fill,minmax(230px,1fr)); gap:14px; }
  .book { position:relative; display:flex; flex-direction:column; text-align:left; padding:0; border:0; border-radius:18px; overflow:hidden;
    background:#2f2560; color:var(--paper); box-shadow:0 10px 26px rgba(0,0,0,.35); }
  .book img { width:100%; aspect-ratio:4/3; object-fit:cover; object-position:50% 25%; display:block; }
  .book .meta { padding:12px 14px 14px; display:grid; gap:4px; }
  .book .en { font-size:18px; font-weight:900; line-height:1.25; }
  .book .ko { color:var(--soft); font-size:14px; }
  .book .stars { color:var(--star); font-size:14px; letter-spacing:.1em; }
  .book .done { position:absolute; top:10px; right:10px; background:var(--mint); color:#10321a; font-weight:900; font-size:13px;
    padding:5px 9px; border-radius:999px; }
  .reader[hidden], .shelf-view[hidden] { display:none; }
  .page { background:var(--paper); color:var(--ink); border-radius:22px; overflow:hidden; box-shadow:0 16px 40px rgba(0,0,0,.4); }
  .page img { width:100%; aspect-ratio:4/3; max-height:52vh; object-fit:cover; object-position:50% 40%; display:block; background:#e9dfc9; }
  .page .body { padding:18px 18px 20px; display:grid; gap:14px; }
  .count { color:#8a7fb0; font-weight:800; font-size:14px; }
  .text { font-size:clamp(28px,5vw,42px); font-weight:900; line-height:1.35; }
  .text.playing { color:#7a3fd1; }
  .original-text.playing { color:#7a3fd1; }
  .meaning { font-size:18px; color:#5d547e; }
  .meaning[hidden] { display:none; }
  .row { display:flex; flex-wrap:wrap; gap:10px; }
  .row button { flex:1; min-width:120px; min-height:52px; border:0; border-radius:14px; font-weight:900; font-size:17px; }
  .listen { background:#ffd93d; color:#3a2a00; box-shadow:0 4px 0 #c9a21a; }
  .nav { display:flex; align-items:center; gap:10px; margin-top:16px; }
  .nav button { min-height:54px; padding:0 20px; border:0; border-radius:14px; font-weight:900; font-size:18px; background:rgba(255,255,255,.12); color:var(--paper); }
  .nav button:disabled { opacity:.35; }
  .nav .next { margin-left:auto; background:#ffd93d; color:#3a2a00; }
  .dots { display:flex; gap:6px; flex-wrap:wrap; justify-content:center; flex:1; }
  .dots span { width:9px; height:9px; border-radius:50%; background:rgba(255,255,255,.25); }
  .dots span.on { background:var(--star); }
  .finish { text-align:center; padding:26px 18px; display:grid; gap:12px; }
  .finish .big { font-size:48px; }
  .finish h2 { font-size:26px; }
  .study-return { display:block; padding:14px 16px; border-radius:14px; background:#ffe08a; color:#17213b; text-decoration:none; font-weight:800; }
  .study-return[hidden] { display:none; }
  /* 듣기 전용 그림책(2026-11-15): 그림 · 문장 · 🔊 듣기 · 뜻(듣고 나면) · 앞/다음만. 스크롤 없이 한 화면. */
  body.book-open .top { margin-bottom:8px; }
  body.book-open .top h1 { font-size:20px; }
  body.book-open .back { padding:8px 12px; }
  body.book-open .wrap { max-width:1100px; height:100vh; height:100dvh; display:flex; flex-direction:column;
    padding:calc(10px + env(safe-area-inset-top,0px)) 12px calc(10px + env(safe-area-inset-bottom,0px)); }
  body.book-open .reader { flex:1; min-height:0; display:flex; flex-direction:column; justify-content:center; }
  body.book-open .page { min-height:0; max-height:100%; display:flex; flex-direction:column; }
  body.book-open .page img { flex:0 1 auto; width:100%; height:auto; aspect-ratio:4/3; max-height:none; min-height:0; object-fit:cover; }
  body.book-open .page .body { flex:none; padding:12px 16px 14px; gap:10px; align-content:center; }
  body.book-open .text { font-size:clamp(24px, min(5.6vw, 5.2vh), 44px); line-height:1.3; text-align:center; }
  body.book-open .meaning { font-size:clamp(18px, min(3.4vw, 3vh), 21px); text-align:center; line-height:1.35; }
  body.book-open .row .listen { min-height:clamp(56px, 8.5vh, 72px); font-size:clamp(22px, min(4.5vw, 4.2vh), 28px); border-radius:18px; }
  body.book-open .nav { margin-top:0; }
  body.book-open .nav button { min-height:56px; background:#ebe2f7; color:var(--ink); }
  body.book-open .nav .next { background:#ffd93d; color:#3a2a00; }
  body.book-open .dots span { background:#d6cce6; }
  body.book-open .dots span.on { background:#7a3fd1; }
  body.book-open .finish { padding:18px; }
  .listen.pulse { animation:listen-pulse 1.1s ease-in-out infinite; }
  @keyframes listen-pulse { 0%,100% { transform:scale(1); box-shadow:0 4px 0 #c9a21a, 0 0 0 0 rgba(255,217,61,.7); }
    50% { transform:scale(1.03); box-shadow:0 4px 0 #c9a21a, 0 0 0 12px rgba(255,217,61,0); } }
  @media (prefers-reduced-motion: reduce) { .listen.pulse { animation:none; outline:4px solid #ffd93d; } }
  /* 가로로 넓은 화면(아이패드 가로·휴대폰 가로): 그림 왼쪽, 문장·버튼·앞뒤 오른쪽 */
  @media (min-aspect-ratio: 5/4) {
    body.book-open .reader { justify-content:stretch; }
    body.book-open .page { flex:1; display:grid; grid-template-rows:minmax(0,1fr); grid-template-columns:minmax(0,1.2fr) minmax(0,1fr); }
    body.book-open .page img { height:100%; max-height:none; aspect-ratio:auto; }
    body.book-open .text { font-size:clamp(22px, min(3.6vw, 6.4vh), 44px); }
  }
  @media (max-height: 420px) { body.book-open .top { display:none; } }
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <a class="back" id="backLink" href="../">← 이야기 극장</a>
    <h1>📚 영어 그림책</h1>
  </div>

  <a id="studyReturn" class="study-return" href="../../game/#study" hidden>← 오늘의 공부로</a>
  <section class="shelf-view" id="shelfView">
    <p class="lead">그림을 보며 영어 이야기를 들어요. 쪽을 열면 읽어 주고, 🔊를 누르면 다시 들려줘요. 별이 적은 책부터 들어 봐요.</p>
    <div class="shelf" id="shelf"></div>
  </section>

  <section class="reader" id="reader" hidden>
    <article class="page" id="page"></article>
    <div class="nav">
      <button type="button" id="prevBtn">← 앞</button>
      <div class="dots" id="dots" aria-hidden="true"></div>
      <button type="button" class="next" id="nextBtn">다음 →</button>
    </div>
  </section>
</div>

<script src="books.js?v=7"></script>
<script>
(function () {
  "use strict";
  // 영어 그림책 = 듣기 전용(2026-11-15). 읽기(마이크)는 허브의 회화 문장 읽기에서 한다.
  var BOOKS = window.EnglishBooks.books;
  var DONE_KEY = "story_english_done";
  var shelfView = document.getElementById("shelfView");
  var shelf = document.getElementById("shelf");
  var reader = document.getElementById("reader");
  var pageEl = document.getElementById("page");
  var nav = reader.querySelector(".nav");
  var dots = document.getElementById("dots");
  var prevBtn = document.getElementById("prevBtn");
  var nextBtn = document.getElementById("nextBtn");
  var backLink = document.getElementById("backLink");
  var book = null, index = 0, audio = null;
  var startParams = new URLSearchParams(location.search);
  // 예전 '먼저 듣기' 링크(?book=…&page=…&listen=1&from=study)로 와도 그 쪽을 열고, 공부로 돌아가는 링크만 더 보인다.
  var fromStudy = startParams.get("from") === "study";
  document.getElementById("studyReturn").hidden = !fromStudy;

  function art(id) { return "../../cards/art/" + id + ".webp"; }
  function readDone() {
    try { return JSON.parse(localStorage.getItem(DONE_KEY) || "{}") || {}; } catch (error) { return {}; }
  }
  function markDone(id) {
    var done = readDone(); done[id] = true;
    try { localStorage.setItem(DONE_KEY, JSON.stringify(done)); } catch (error) {}
  }
  function el(tag, cls, text) {
    var node = document.createElement(tag);
    if (cls) node.className = cls;
    if (text !== undefined) node.textContent = text;
    return node;
  }
  function stopAudio() {
    // audio = { ctx, node }. 컨텍스트를 close 해서 오디오 장치를 완전히 놓는다(아이패드).
    if (audio) {
      var old = audio; audio = null;
      if (old.node) { try { old.node.onended = null; old.node.stop(0); } catch (error) {} }
      if (old.ctx && old.ctx.close) { try { old.ctx.close(); } catch (error) {} }
    }
    pageEl.querySelectorAll(".playing").forEach(function (text) { text.classList.remove("playing"); });
  }

  function renderShelf() {
    shelf.textContent = "";
    var done = readDone();
    BOOKS.forEach(function (item) {
      var card = el("button", "book");
      card.type = "button";
      var img = el("img"); img.alt = ""; img.loading = "lazy";
      img.addEventListener("error", function () { if (img.src.indexOf("/cards/art/") < 0) img.src = art(item.cover); });
      img.src = item.pages[0].image;
      var meta = el("span", "meta");
      meta.append(el("span", "en", item.title), el("span", "ko", item.titleKo + " · " + item.pages.length + "쪽"),
        el("span", "stars", "★".repeat(item.stars) + "☆".repeat(3 - item.stars)));
      card.append(img, meta);
      if (done[item.id]) card.appendChild(el("span", "done", "다 들었어요 ⭐"));
      card.addEventListener("click", function () { openBook(item); });
      shelf.appendChild(card);
    });
  }

  function openBook(item, startIndex) {
    book = item; index = startIndex || 0;
    shelfView.hidden = true; reader.hidden = false;
    document.body.classList.add("book-open");
    backLink.textContent = "← 책장";
    backLink.setAttribute("href", "#");
    renderPage();
    scrollTo(0, 0);
  }
  function closeBook() {
    stopAudio();
    book = null;
    reader.hidden = true; shelfView.hidden = false;
    document.body.classList.remove("book-open");
    reader.appendChild(nav);
    backLink.textContent = "← 이야기 극장";
    backLink.setAttribute("href", "../");
    renderShelf();
  }
  backLink.addEventListener("click", function (event) {
    if (book) { event.preventDefault(); closeBook(); }
  });

  function renderDots() {
    dots.textContent = "";
    for (var i = 0; i <= book.pages.length; i++) {
      var dot = el("span"); if (i === index) dot.className = "on"; dots.appendChild(dot);
    }
  }

  function renderPage() {
    stopAudio();
    pageEl.textContent = "";
    renderDots();
    prevBtn.disabled = index === 0;
    if (index >= book.pages.length) {
      markDone(book.id);
      var finish = el("div", "finish body");
      finish.append(el("div", "big", "🌟"), el("h2", "", "The End"), el("p", "", "「" + book.titleKo + "」을 다 들었어요! 멋져요!"));
      var again = el("button", "listen", "처음부터 다시 듣기");
      again.type = "button";
      again.addEventListener("click", function () { index = 0; renderPage(); });
      finish.append(again, nav);
      pageEl.appendChild(finish);
      nextBtn.textContent = "책장으로";
      return;
    }
    nextBtn.textContent = index === book.pages.length - 1 ? "끝 →" : "다음 →";
    var page = book.pages[index];
    var img = el("img"); img.alt = "";
    // 쪽 전용 삽화가 없으면 카드 원화로 대신한다.
    img.addEventListener("error", function () { if (img.src.indexOf("/cards/art/") < 0) img.src = art(page.art); });
    img.src = page.image;
    var body = el("div", "body");
    var text = el("p", "text", page.text); text.lang = "en";
    // 뜻은 다 듣고 난 뒤 문장 아래에 작게 한 줄로 보인다.
    var meaning = el("p", "meaning", page.meaning); meaning.hidden = true;
    var row = el("div", "row");
    var listen = el("button", "listen", "🔊 듣기"); listen.type = "button";
    listen.setAttribute("aria-label", "이 쪽 듣기");
    row.append(listen);
    body.append(text, meaning, row, nav);
    pageEl.append(img, body);
    listen.addEventListener("click", function () {
      listen.classList.remove("pulse");
      playNarration(page.audio, text, listen, meaning, false);
    });
    // 쪽을 열면 한 번 저절로 읽어 준다. 브라우저가 막으면 듣기 버튼이 깜빡인다.
    playNarration(page.audio, text, listen, meaning, true);
  }

  // <audio> 대신 Web Audio 로만 튼다(iPad Safari 소리·음성 인식 충돌 방지). 끝나면 컨텍스트를 닫는다.
  function playNarration(file, playingText, button, meaning, auto) {
    stopAudio();
    var AC = window.AudioContext || window.webkitAudioContext;
    if (!AC || !window.fetch) { if (auto) button.classList.add("pulse"); else button.textContent = "🔊 소리를 낼 수 없어요"; return; }
    var ctx;
    try { ctx = new AC(); } catch (error) { button.classList.add("pulse"); return; }
    var mine = audio = { ctx: ctx, node: null };
    playingText.classList.add("playing");
    var blocked = function () { if (audio === mine) stopAudio(); button.classList.add("pulse"); };
    var missing = function () { if (audio !== mine) return; stopAudio(); button.textContent = "🔊 소리를 못 찾았어요 · 다시 누르기"; };
    var ready = null;
    if (ctx.state === "suspended" && ctx.resume) { ready = ctx.resume(); if (ready && ready.catch) ready.catch(function () {}); }
    var unlocked = !auto ? Promise.resolve(true) : new Promise(function (resolve) {
      if (ctx.state === "running") { resolve(true); return; }
      var settle = function () { resolve(ctx.state === "running"); };
      if (ready && ready.then) ready.then(settle, settle);
      setTimeout(settle, 500);
    });
    unlocked.then(function (ok) {
      if (audio !== mine) throw new Error("stale");
      if (!ok) { blocked(); throw new Error("blocked"); }
      return fetch(file);
    }).then(function (response) {
      if (!response || !response.ok) throw new Error("narration");
      return response.arrayBuffer();
    }).then(function (data) {
      return new Promise(function (resolve, reject) {
        var decoded = ctx.decodeAudioData(data, resolve, reject);
        if (decoded && decoded.then) decoded.then(resolve, reject);
      });
    }).then(function (sound) {
      if (audio !== mine) return;
      var node = ctx.createBufferSource();
      node.buffer = sound; node.connect(ctx.destination);
      node.onended = function () { if (audio === mine) { stopAudio(); meaning.hidden = false; } };
      mine.node = node; node.start(0);
    }).catch(function (error) { if (error && (error.message === "blocked" || error.message === "stale")) return; missing(); });
  }

  prevBtn.addEventListener("click", function () { if (index > 0) { index -= 1; renderPage(); } });
  nextBtn.addEventListener("click", function () {
    if (index >= book.pages.length) { closeBook(); return; }
    index += 1; renderPage();
  });
  document.addEventListener("visibilitychange", function () { if (document.hidden) stopAudio(); });
  window.addEventListener("pagehide", function () { stopAudio(); });

  var start = startParams.get("book");
  renderShelf();
  var first = BOOKS.find(function (item) { return item.id === start; });
  if (first) openBook(first, Math.max(0, Math.min(first.pages.length - 1, parseInt(startParams.get("page"), 10) || 0)));
})();
</script>
</body>
</html>
