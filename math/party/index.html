<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#fff4e7"><title>재이의 가족 생일파티 모험</title><link rel="icon" href="../../icon.png"><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Jua&family=Nunito:wght@800;900&display=swap" rel="stylesheet"><link rel="stylesheet" href="party.css?v=2"></head>
<body data-theme="peach"><main class="party-shell">
<header class="top"><a href="../../" class="back">← 모험보드</a><span class="brand">재이의 생일파티</span><button id="sound" class="sound" type="button" aria-pressed="false">소리 켜기</button></header>
<section class="scene" aria-label="준비한 만큼 달라지는 생일파티"><div class="sun" aria-hidden="true"></div><div class="bunting" aria-hidden="true"></div><div id="sceneLights" class="scene-lights" aria-hidden="true"></div><div id="sceneBalloons" class="scene-balloons" aria-hidden="true"></div><div class="family-row"><img class="family" src="../assets/jaei-family-v4.webp" width="1024" height="683" alt="왼쪽부터 아빠, 태오, 긴 머리의 여자아이 재이, 엄마"><img class="friends" src="../assets/jaei-sanrio-friends.webp" width="768" height="512" alt="폼폼푸린과 헬로키티"></div><div class="party-table"><div id="sceneGift" class="scene-gift" hidden aria-hidden="true">🎁</div><div class="cake" id="cake" aria-label="생일 케이크"><div class="candles" id="candles" aria-hidden="true"></div><div class="icing"></div><span class="cake-decoration" aria-hidden="true">♥</span></div></div><div id="sparks" class="sparks" aria-hidden="true"></div></section>
<section id="welcome" class="welcome panel"><p class="eyebrow">재이가 파티 대장이야!</p><h1>우리 가족을 위한<br>생일파티를 열어볼까?</h1><p>불빛을 켜고, 선물을 만들고, 풍선을 달자.<br>다 준비하면 신나게 놀 수 있어!</p><div class="choices-label">어떤 파티로 꾸밀까?</div><div class="theme-choices" id="themes"><button data-theme="peach" aria-pressed="true">🍑 복숭아빛</button><button data-theme="sky" aria-pressed="false">☁ 하늘빛</button><button data-theme="mint" aria-pressed="false">🍀 초록빛</button></div><button class="primary" id="start">내 파티 만들기 →</button><button class="parity-entry" data-open-parity>🍪 쿠키 짝꿍 놀이 · 짝수와 홀수</button><p class="tiny">천천히 해도 좋아. 언제든 쉬었다 이어서 놀자.</p></section>
<section id="play" class="play panel" hidden><nav class="mission-path" aria-label="파티 준비"><span data-stop="0">① 불빛</span><span data-stop="1">② 선물</span><span data-stop="2">③ 풍선</span><span data-stop="3">파티!</span></nav><div class="mission-head"><div><p class="eyebrow" id="speaker"></p><h1 id="title"></h1></div><button id="help" class="help">같이 해요</button></div><p id="instruction" class="instruction"></p><div id="activity" class="activity"></div><button id="parityInPlay" class="parity-entry" data-open-parity hidden>🍪 쿠키 짝꿍 놀이 · 짝수와 홀수</button><p id="feedback" class="feedback" role="status" aria-live="polite"></p><div id="finishActions" hidden><button id="next" class="primary">다음 준비하러 가자 →</button></div><div id="partyActions" class="party-actions" hidden><button id="blow" class="primary">후~ 촛불 끄기</button><button id="dance">가족과 춤추기 ♪</button><button id="pop">풍선 띄우기!</button><div class="cake-choices"><button data-cake="strawberry" aria-pressed="true">딸기 케이크</button><button data-cake="chocolate" aria-pressed="false">초코 케이크</button></div><button id="replay" class="quiet">새 파티 준비하기</button></div></section>
<dialog id="parityDialog" class="parity-dialog" aria-labelledby="parityTitle">
  <div class="parity-heading"><div><p class="eyebrow">태오와 쿠키 짝꿍 놀이</p><h2 id="parityTitle">짝수랑 홀수는 뭘까?</h2></div><button id="parityClose" aria-label="짝꿍 놀이 닫기" autofocus>닫기</button></div>
  <p class="parity-rule">쿠키를 <strong>두 개씩</strong> 짝지어 보자.<br>남는 게 없으면 <strong>짝수</strong>,<br>한 개가 남으면 <strong>홀수</strong>야!</p>
  <div class="parity-examples">
    <button data-parity-example="4"><span class="example-pairs" aria-hidden="true"><i>● ●</i><i>● ●</i></span><strong>4는 짝수</strong><small>두 개씩, 딱 맞아!</small></button>
    <button data-parity-example="5"><span class="example-pairs" aria-hidden="true"><i>● ●</i><i>● ●</i><b>●</b></span><strong>5는 홀수</strong><small>한 개가 남았네!</small></button>
  </div>
  <div class="parity-counter"><button id="parityLess" aria-label="쿠키 한 개 빼기">−</button><strong id="parityCount">쿠키 4개</strong><button id="parityMore" aria-label="쿠키 한 개 더하기">+</button></div>
  <div id="parityBoard" class="parity-board" aria-label="두 개씩 짝짓는 쿠키"></div>
  <p id="parityResult" class="parity-result" role="status" aria-live="polite"></p>
  <button id="parityPair" class="primary">두 개씩 짝짓기</button>
  <p class="parity-tip">+를 눌러 한 개 더 놓으면 어떻게 될까?</p>
</dialog>
<footer><span id="saveNote">놀던 곳은 이 기기에 기억해 둘게.</span><a href="../parent.html">부모님 보기</a><a href="../">수학놀이터</a></footer></main><script src="../curriculum.js?v=20"></script><script src="engine.js?v=1"></script><script src="party.js?v=2"></script><script src="parity.js?v=1"></script></body></html>
