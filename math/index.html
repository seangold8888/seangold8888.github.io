<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#fde7f0">
<title>매일 수학 10분</title>
<link rel="icon" href="../icon.png">
<link rel="apple-touch-icon" href="../icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&family=Nunito:wght@800;900&display=swap">
<link rel="stylesheet" href="style.css?v=5">
</head>
<body>
<div class="sky" aria-hidden="true"><i></i><i></i><i></i><i></i><b>★</b><b>★</b><b>★</b></div>
<div class="wrap" id="app">
  <header class="top">
    <h1>매일 수학 10분</h1>
    <span class="who" id="who"></span>
  </header>

  <section id="home">
    <div class="card guide">
      <div class="guide-badge" id="guideBadge"></div>
      <div>
        <p class="eyebrow" id="homeUnit">1학년 1학기 · 1단계</p>
        <p class="level-name" id="homeLevel">5까지 모으기와 가르기</p>
        <p class="hint speech" id="guideSay"></p>
      </div>
    </div>

    <div class="row tight">
      <div class="card mini flame">
        <svg class="ico" viewBox="0 0 48 48" aria-hidden="true"><path d="M24 4c2 8 10 11 10 22a10 10 0 0 1-20 0c0-5 3-7 4-11 2 3 3 5 3 8 3-3 3-9 3-19z" fill="#ff7a59"/><path d="M24 44a6 6 0 0 1-6-6c0-4 4-5 6-10 2 5 6 6 6 10a6 6 0 0 1-6 6z" fill="#ffd166"/></svg>
        <b id="streakNum">0</b><span>연속 <em>일</em></span>
        <p class="tiny" id="streakNote"></p>
      </div>
      <div class="card mini chest" id="chestCard">
        <img class="ico3d" id="chestImg" src="assets/3d/chest_closed.png" alt="" draggable="false">
        <b id="chestNum">0/6</b><span>이번 주 보물상자</span>
        <p class="tiny" id="chestNote"></p>
      </div>
    </div>
    <button class="btn gold" id="chestBtn" hidden>보물상자 열기</button>

    <div class="card">
      <p class="eyebrow">오늘 함께할 친구</p>
      <div class="buddies" id="buddies"></div>
    </div>

    <div class="card">
      <button class="btn big" id="startBtn">오늘 문제 풀기</button>
      <p class="hint center" id="homeReview"></p>
      <p class="hint center" id="teaser"></p>
    </div>

    <div class="card">
      <div class="plan-line"><span class="eyebrow">오늘의 진도</span><span class="plan-tag" id="planTag"></span></div>
      <p class="plan-text" id="planText"></p>
      <div class="track" id="track"></div>
    </div>

    <div class="card">
      <div class="plan-line"><span class="eyebrow">친구 앨범</span><span class="small" id="albumCount"></span></div>
      <div class="album" id="album"></div>
      <p class="tiny center" id="albumNote"></p>
    </div>
    <p class="foot"><a href="parent.html">부모님 보기</a></p>
  </section>

  <section id="quiz" hidden>
    <p class="count" id="count"></p>
    <div class="progress"><i id="bar"></i></div>
    <div class="card">
      <p class="problem" id="problem"></p>
      <div class="visual" id="visual"></div>
      <p class="feedback" id="feedback"></p>
      <p class="explain" id="explain" hidden></p>
      <button class="btn secondary retry" id="retryBtn" hidden>다시 풀어 보기</button>
      <div class="keypad" id="keypad">
        <button data-k="1">1</button><button data-k="2">2</button><button data-k="3">3</button>
        <button data-k="4">4</button><button data-k="5">5</button><button data-k="6">6</button>
        <button data-k="7">7</button><button data-k="8">8</button><button data-k="9">9</button>
        <button class="back" data-k="back" aria-label="지우기">←</button><button data-k="0">0</button><button class="go" data-k="go">확인</button>
      </div>
    </div>
    <button class="btn ghost" id="quitBtn">그만하기</button>
  </section>

  <section id="capsule" hidden>
    <div class="card center">
      <p class="level-name">오늘의 스티커 뽑기</p>
      <p class="small">캡슐 하나를 골라요. 어떤 친구가 나올까?</p>
      <div class="capsules" id="capsules"></div>
    </div>
  </section>

  <section id="result" hidden>
    <div class="card center">
      <div class="sticker-big" id="stickerBig"></div>
      <p class="sticker-name" id="stickerName"></p>
      <p class="result-big" id="resultBig"></p>
      <p class="small" id="resultText"></p>
      <p class="small" id="resultLevel"></p>
      <div class="story" id="story" hidden></div>
    </div>
    <div class="card">
      <button class="btn secondary" id="showBtn">엄마 아빠에게 보여주기</button>
      <div class="row" style="margin-top:10px">
        <button class="btn secondary" id="againBtn">한 번 더</button>
        <button class="btn" id="doneBtn">끝내기</button>
      </div>
    </div>
  </section>

  <section id="showcard" hidden>
    <div class="card center showcard">
      <p class="eyebrow" id="showDate"></p>
      <div class="sticker-big" id="showBadge"></div>
      <p class="level-name" id="showTitle"></p>
      <p class="small" id="showText"></p>
      <button class="btn heart" id="heartBtn">♥ 칭찬 도장 꾹</button>
      <p class="tiny" id="heartNote">엄마나 아빠가 눌러 주세요</p>
    </div>
    <button class="btn ghost" id="showBack">돌아가기</button>
  </section>
</div>
<div class="burst" id="burst" aria-hidden="true"></div>
<script src="curriculum.js?v=5"></script>
<script src="visual.js?v=5"></script>
<script src="store.js?v=5"></script>
<script src="schedule.js?v=5"></script>
<script src="characters.js?v=5"></script>
<script src="app.js?v=5"></script>
</body>
</html>
