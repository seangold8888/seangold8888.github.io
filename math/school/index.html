<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>학교 유형 연습 · 재이의 수학놀이터</title><link rel="icon" href="../../icon.png"><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Jua&family=Nunito:wght@800;900&display=swap" rel="stylesheet"><link rel="stylesheet" href="../style.css?v=20"><link rel="stylesheet" href="../playground.css?v=26"><link rel="stylesheet" href="school.css?v=1"></head>
<body><main class="wrap school"><header class="school-top"><a href="../">← 수학놀이터</a><span>학교 유형 연습</span><button id="pause" class="btn secondary" hidden>잠깐 쉬기</button></header>
<section id="menu" class="card school-menu"><p class="eyebrow">1학년 · 100까지의 수</p><h1>학교에서 만난 수,<br>놀이터에서 한 번 더!</h1><p class="intro">묶어 세고, 같은 수를 연결하고, 짝수·홀수를 찾아요.<br>새 연습을 시작하면 숫자도 달라져요.</p>
<a class="school-link" href="weekly.html">이번 주 진도 시험 →</a><div id="resumeBox" hidden><p id="resumeText"></p><button id="resume" class="btn big">하던 연습 이어가기 →</button><button id="finishEarly" class="btn ghost">지금까지 한 만큼 마치기</button></div>
<div id="newOptions"><label class="field">어떤 유형을 만나볼까?<select id="group"><option value="all">골고루 만나기</option><option value="bundles">10개씩 묶음·수 읽기</option><option value="order">수의 순서·비교·빈칸 추론</option><option value="parity">짝수·홀수</option></select></label><div class="school-start"><button id="startShort" class="btn big">가볍게 5문제 →</button><button id="startFull" class="btn secondary">전체 유형 20문제</button></div><p class="tiny">짝수·홀수만 고르면 4문제예요. 20문제는 모든 유형을 순서대로 만나요.</p></div>
<p class="note">기존 놀이터 단계와 별도로 연습해요. 시간 제한 없이 천천히 해도 좋아요.</p><button id="lastResult" class="btn secondary" hidden>지난 연습 풀이 보기</button><p id="historySummary" class="tiny"></p></section>
<section id="exercise" class="card" hidden><div class="school-progress"><span id="progress"></span><span id="typeName" class="chapter-pill"></span></div><progress id="progressBar" value="0" max="5" aria-label="학교 연습 진행"></progress><h1 id="questionTitle" tabindex="-1"></h1><div id="visual" class="school-visual"></div><form id="answerForm"><div id="answers"></div><label id="reasonField" class="field" hidden>어떻게 생각했나요? (써도 좋고 말로 설명해도 좋아요)<textarea id="reason" maxlength="500" rows="3" placeholder="내 생각을 적어 보세요."></textarea><span class="tiny">글은 자동 채점하지 않아요. 풀이 예시와 함께 비교해요.</span></label><div class="school-actions"><button id="check" class="btn big" type="submit">확인하기</button><button id="hint" class="btn secondary" type="button">생각 힌트</button><button id="reveal" class="btn ghost" type="button">풀이 함께 보기</button></div></form><p id="hintText" class="school-hint" hidden></p><p id="feedback" class="school-feedback" role="status" aria-live="polite"></p><div id="solution" class="school-solution" hidden></div><button id="next" class="btn big" hidden>다음으로 →</button></section>
<section id="result" class="card" hidden><p class="eyebrow">오늘도 생각하는 힘이 자랐어</p><h1>여기까지 잘 만났어!</h1><p id="resultSummary" class="intro"></p><div id="review"></div><div class="school-start"><button id="backMenu" class="btn big">유형 고르기로</button><a href="../party/" class="btn secondary">가족 파티 놀러 가기</a></div></section>
<footer><span id="storageNote">이 기기에 하던 연습을 기억해 둘게요.</span><a href="../parent.html">부모님 보기</a></footer></main><script src="questions.js?v=1"></script><script src="view.js?v=1"></script><script src="school.js?v=2"></script></body></html>
