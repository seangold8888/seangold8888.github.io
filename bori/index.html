}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{font-size:16px}
@media (min-width:744px){html{font-size:18px}}
body{
  font-family:var(--body);color:var(--ink);
  background:
    radial-gradient(circle at 18% 8%, #fff5c8 0 6%, #0000 6.4%),
    radial-gradient(circle at 85% 20%, #ffd7e8 0 5%, #0000 5.5%),
    linear-gradient(150deg,#cfc1f2,#f6d9e7);
  min-height:100svh;
  -webkit-user-select:none;user-select:none;
  -webkit-touch-callout:none;
  touch-action:manipulation;
  padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;touch-action:manipulation}
button:focus-visible,summary:focus-visible{outline:4px solid var(--gold);outline-offset:3px;border-radius:8px}
button:disabled{opacity:.45;cursor:not-allowed}
#fx{position:fixed;inset:0;pointer-events:none;z-index:60}
.game{
  width:min(100%,30rem);margin:auto;min-height:100svh;position:relative;overflow:hidden;
  background:linear-gradient(#7e66bc 0 22%,#f7f1ff 22%);
  box-shadow:0 0 3.5rem #2d195740;
}
@media (min-width:744px){
  body{padding-top:calc(env(safe-area-inset-top) + 1.2rem);padding-bottom:calc(env(safe-area-inset-bottom) + 1.2rem)}
  .game{width:min(100%,36rem);border-radius:2rem;min-height:calc(100svh - 2.4rem)}
}
h1,h2,.disp,.primary,.chips span,.puzzle-head h1,.stage-num{font-family:var(--disp);font-weight:400}

/* ---------- start / result ---------- */
.start,.result{
  display:grid;place-items:center;padding:1.8rem 1.1rem;
  background:
    radial-gradient(circle at 20% 18%, #ffeb917a, #0000 16%),
    radial-gradient(circle at 82% 29%, #ffa0c480, #0000 20%),
    linear-gradient(165deg,#604a9d,#a484cd 58%,#f3bad1);
}
.start::before,.result::before{
  content:"✦ · ★ · ✦ · ♥ · ✦";color:#ffebaa;letter-spacing:1rem;opacity:.8;
  font-size:1.3rem;position:absolute;top:4%;left:8%;right:8%;text-align:center;
}
.start-card,.result-card{
  position:relative;z-index:1;text-align:center;width:100%;
  background:#fffafff2;border:2px solid #fffc;border-radius:2rem;
  padding:1.4rem 1.4rem 1.5rem;
  box-shadow:0 1.5rem 3.6rem #2b165a52, inset 0 0 0 .35rem #ffffff73;
}
.kicker{color:#8064b7;letter-spacing:.12em;font-size:.8rem;font-weight:800;margin-bottom:.6rem}
.start h1,.result h1{font-size:2.3rem;line-height:1.14;color:var(--deep);letter-spacing:-.02em;margin:.7rem 0}
.start h1 span{color:var(--rose)}
.start-card>p:not(.kicker),.result-card>p:not(.kicker){font-size:1.1rem;font-weight:700;line-height:1.6}
.start-card small{display:block;margin-top:.9rem;color:#80758b;font-size:.72rem}
.hero-art{
  aspect-ratio:2.05;width:100%;border-radius:1.4rem;border:3px solid #fff;
  background-image:var(--hero);background-size:cover;background-position:center 70%;
  box-shadow:0 .5rem 1.4rem #502e6f38;
}
.chips{display:flex;flex-wrap:wrap;justify-content:center;gap:.45rem;margin:1.1rem 0}
.chips span{color:#654f91;background:#f1e9ff;border-radius:99px;padding:.42rem .7rem;font-size:.8rem}
.primary{
  width:100%;min-height:3.4rem;padding:.8rem 1.1rem;border-radius:1.1rem;
  color:#fff;font-size:1.15rem;letter-spacing:.02em;
  background:linear-gradient(135deg,#765bb7,var(--rose));

const SAVE_KEY='bori-gems:v2:progress', MUTE_KEY='bori-gems:v2:muted';
function freshState(status, prevVariant){
  const variant = prevVariant==null ? Math.floor(Math.random()*3) : (prevVariant+1)%3;
  return {version:2,status,stageIndex:0,completed:[],pendingReward:null,
    hints:{room:0,cafe:0,garden:0,party:0,finale:0},variant,decorations:[],
    drafts:{patternStep:0,cafeStep:0,mazePath:[MAZES[variant].start],partySeats:[],finaleOrder:[]},
    noteOpen:false,modal:null};
}

  const m=localStorage.getItem(MUTE_KEY); if(m!==null) muted=m==='true';
}catch(e){}
function persist(){try{localStorage.setItem(SAVE_KEY,JSON.stringify(state));localStorage.setItem(MUTE_KEY,String(muted));}catch(e){}}
function set(patch){Object.assign(state,patch);persist();render();}

const reduceMotion=matchMedia('(prefers-reduced-motion: reduce)').matches;

/* ============ 사운드 (공유 AudioContext — iOS 다중 컨텍스트 버그 방지) ============ */
const SFX=(()=>{
  let ctx=null;
  const ac=()=>{ if(!ctx){try{ctx=new (window.AudioContext||window.webkitAudioContext)();}catch(e){}}
    if(ctx&&ctx.state==='suspended') ctx.resume(); return ctx; };
  function tone(f0,f1,delay,dur,type,peak){
    if(muted) return; const c=ac(); if(!c) return;
    const t=c.currentTime+delay, o=c.createOscillator(), g=c.createGain();
    o.type=type||'sine';
    o.frequency.setValueAtTime(f0,t);
    if(f1&&f1!==f0) o.frequency.exponentialRampToValueAtTime(f1,t+dur*.8);
    g.gain.setValueAtTime(.0001,t);
    g.gain.exponentialRampToValueAtTime(peak||.08,t+.02);
    g.gain.exponentialRampToValueAtTime(.0001,t+dur);
    o.connect(g).connect(c.destination); o.start(t); o.stop(t+dur+.05);
  }
  return {
    unlock:()=>ac(),
    tap:()=>tone(660,660,0,.08,'triangle',.04),
    ok:()=>{tone(523,523,0,.12,'triangle',.07);tone(784,784,.09,.16,'triangle',.07);},
    no:()=>tone(230,180,0,.2,'sine',.05),
    gem:()=>{[523,659,784,1047].forEach((f,i)=>tone(f,f,i*.09,.22,'triangle',.08));},
    win:()=>{[523,659,784,880,1047,1319].forEach((f,i)=>tone(f,f,i*.11,.3,'triangle',.09));}
  };
})();
document.addEventListener('pointerdown',()=>SFX.unlock(),{once:true,capture:true});

/* ============ 색종이 ============ */
const FX=(()=>{
  const cv=document.getElementById('fx'), cx=cv.getContext('2d');
  let parts=[],raf=null,DPR=Math.min(devicePixelRatio||1,2);
  function size(){cv.width=innerWidth*DPR;cv.height=innerHeight*DPR;}
  addEventListener('resize',size);size();
  const COLORS=['#ff7da9','#ffca57','#59c9a5','#8a78dc','#fff','#e8669a'];
  function loop(){
    cx.clearRect(0,0,cv.width,cv.height);
    parts=parts.filter(p=>p.y<cv.height+40&&p.life>0);
    for(const p of parts){
      p.x+=p.vx;p.y+=p.vy;p.vy+=.12*DPR;p.rot+=p.vr;p.life--;
      cx.save();cx.translate(p.x,p.y);cx.rotate(p.rot);cx.fillStyle=p.c;
      cx.globalAlpha=Math.min(1,p.life/30);
      p.shape?cx.fillRect(-p.s/2,-p.s/2,p.s,p.s):(cx.beginPath(),cx.arc(0,0,p.s/2,0,7),cx.fill());
      p.shape&&cx.fill();cx.restore();
    }
    if(parts.length) raf=requestAnimationFrame(loop); else {raf=null;cx.clearRect(0,0,cv.width,cv.height);}
  }
  function burst(n,yRatio){
    if(reduceMotion) return;
    for(let i=0;i<n;i++){
      parts.push({x:cv.width*(.15+Math.random()*.7),y:cv.height*(yRatio??.35),
        vx:(Math.random()-.5)*7*DPR,vy:(-4-Math.random()*5)*DPR,
        s:(5+Math.random()*6)*DPR,rot:Math.random()*6.3,vr:(Math.random()-.5)*.3,
        c:COLORS[i%COLORS.length],shape:Math.random()>.4,life:90+Math.random()*40});
    }
    if(!raf) raf=requestAnimationFrame(loop);
  }
  return {burst};
})();

/* ============ 읽어주기 ============ */
function speak(){
  if(!('speechSynthesis' in window)){setFeedback('이 기기에서는 읽어주기를 쓸 수 없어요.');return;}
  const M=curStage(), v=state.variant%3, c=COPY[M];
  let extra='';
  if(M==='room'){
    const p=PATTERNS[v][state.drafts.patternStep];
    extra='그림 순서. '+p.sequence.map(t=>t?TOKENS[t][0]:'빈칸').join(', ')+'.';
  }else if(M==='cafe') extra='주문은 '+ORDERS[v].order.replace(/→/g,'다음')+'.';
  else if(M==='party') extra=PARTY[v].clues.join(' ');
  else if(M==='finale') extra=FINALE[v].captions.join(' ');
  const text=[c[2],extra,feedback].filter(Boolean).join(' ');
  speechSynthesis.cancel();
  const u=new SpeechSynthesisUtterance(text); u.lang='ko-KR'; u.rate=.86;
  speechSynthesis.speak(u);
}

/* ============ 헬퍼 ============ */
function curStage(){return state.stageIndex<4?STAGES[state.stageIndex]:'finale';}
function setFeedback(msg,shake){feedback=msg;feedbackShake=!!shake;render();}
function getAssist(){
  const M=curStage(); if(state.hints[M]<3) return null;
  const v=state.variant%3,d=state.drafts;
  if(M==='room') return PATTERNS[v][d.patternStep]?.answer;
  if(M==='cafe') return ORDERS[v].answers[d.cafeStep];
  if(M==='garden') return MAZES[v].solution[d.mazePath.length-1];
  if(M==='party') return PARTY[v].solution[d.partySeats.length];
  return FINALE[v].solution[d.finaleOrder.length];
}
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}

/* ============ 진행 로직 (원작 유지) ============ */
function winStage(stage){
  SFX.gem(); FX.burst(90,.3);
  feedback=GEMS[STAGE_GEM[stage]][0]+' 보석을 찾았어요!';
  if(!state.completed.includes(stage)) state.completed.push(stage);
  state.pendingReward=stage; set({});
}
function pickDecor(id){
  state.pendingReward=null;
  state.stageIndex=Math.min(state.stageIndex+1,4);
  state.decorations.push(id);
  feedback=''; set({noteOpen:state.stageIndex===4});
}
function useHint(){
  const M=curStage(); const n=Math.min(3,state.hints[M]+1);
  state.hints[M]=n; SFX.tap(); setFeedback(HINTS[M][n-1]); persist();
}
function retryPuzzle(){
  const M=curStage(),v=state.variant%3;
  state.hints[M]=0;
  if(M==='room') state.drafts.patternStep=0;
  if(M==='cafe') state.drafts.cafeStep=0;
  if(M==='garden') state.drafts.mazePath=[MAZES[v].start];
  if(M==='party') state.drafts.partySeats=[];
  if(M==='finale') state.drafts.finaleOrder=[];
  setFeedback('처음부터 천천히 다시 해봐요.'); persist();
}
function restartAll(){feedback='';set(freshState('playing',state.variant));}
function pickPattern(id){
  const v=state.variant%3,r=state.drafts.patternStep,p=PATTERNS[v][r];
  if(id!==p.answer){SFX.no();return setFeedback(p.wrong,true);}
  if(r===2) return winStage('room');
  SFX.ok(); state.hints.room=0; state.drafts.patternStep=r+1;
  setFeedback('맞아요! 다음 규칙도 찾아봐요.'); persist();
}
function pickCafe(id){
  const v=state.variant%3,r=state.drafts.cafeStep,F=ORDERS[v];
  if(id!==F.answers[r]){SFX.no();return setFeedback(F.wrong[r],true);}
  if(r===3) return winStage('cafe');
  SFX.ok(); state.hints.cafe=0; state.drafts.cafeStep=r+1;
  setFeedback(r===0?'하나 놓았어요. 하나 더!':'순서도 수량도 좋아요!'); persist();
}
function pickMaze(id,ch){
  const v=state.variant%3,I=MAZES[v],path=state.drafts.mazePath;
  const [ci,cj]=(path.at(-1)??I.start).split('-').map(Number);
  const [ni,nj]=id.split('-').map(Number);
  if(Math.abs(ci-ni)+Math.abs(cj-nj)!==1){SFX.no();return setFeedback('마이멜로디와 바로 붙은 칸부터 눌러요.',true);}
  if(ch==='#'){SFX.no();return setFeedback('이쪽은 울타리예요. 열린 길을 찾아요.',true);}
  if(id!==I.solution[path.length-1]){SFX.no();return setFeedback(ch==='D'?'막다른 길이에요. 다른 꽃길을 봐요.':'꽃잎 발자국을 다시 살펴봐요.',true);}
  path.push(id); state.hints.garden=0;
  if(path.length===5) return winStage('garden');
  SFX.ok();
  setFeedback(['첫 꽃길을 찾았어요!','절반쯤 왔어요!','보석이 가까워요!'][path.length-2]); persist();
}
function pickSeat(id){
  const v=state.variant%3,L=PARTY[v],r=state.drafts.partySeats.length;
  if(id!==L.solution[r]){SFX.no();return setFeedback(L.wrong[r],true);}
  state.drafts.partySeats.push(id); state.hints.party=0;
  if(state.drafts.partySeats.length===3) return winStage('party');
  SFX.ok(); setFeedback('좋아요! 다음 자리를 찾아봐요.'); persist();
}
function pickFinaleGem(id){
  if(state.drafts.finaleOrder.includes(id)) return;
  SFX.tap(); state.hints.finale=0; state.drafts.finaleOrder.push(id);
  feedback=''; set({});
}
function undoFinale(){SFX.tap();state.drafts.finaleOrder.pop();set({});}
function openBox(){
  const v=state.variant%3,R=FINALE[v],order=state.drafts.finaleOrder;
  if(!R.solution.every((g,i)=>order[i]===g)){
    const n=order.findIndex((g,i)=>g!==R.solution[i]);
    state.hints.finale=Math.max(2,state.hints.finale);
    state.drafts.finaleOrder=order.slice(0,n);
    SFX.no();
    return setFeedback((n+1)+'번째 칸으로 돌아왔어요. '+(n===0?'맨 앞 단서를 확인해요.':n===3?'맨 뒤 단서를 확인해요.':'화살표로 붙은 보석을 살펴봐요.'),true);
  }
  SFX.win(); FX.burst(150,.25); setTimeout(()=>FX.burst(120,.15),400);
  feedback=''; set({status:'finished'});
}

  return `<span class="gem ${earned?'':'empty'} ${small?'small':''} ${pop?'pop':''}" style="--gem:${g[2]}" role="img" aria-label="${g[0]} 보석${earned?'':' 미획득'}"><i>${earned?g[1]:'·'}</i></span>`;
}
function tokenHtml(id){const t=TOKENS[id];return `<span class="token" style="--token:${t[2]}" role="img" aria-label="${t[0]}">${t[1]}</span>`;}
function portraitHtml(id,tiny){return `<span class="portrait ${id} ${tiny?'tiny':''}" role="img" aria-label="${CHARS[id]}"></span>`;}
function clueVisualHtml(pack,idx){
  const sol=pack.solution;
  const gems=idx===0?[sol[0]]:idx===1?sol.slice(0,2):idx===2?sol.slice(2,4):[sol[3]];
  return `<span class="clue-visual" aria-hidden="true">${idx===0?'<i class="cap">맨 앞</i>':''}${
    gems.map((g,i)=>`<span class="clue-part">${gemHtml(g,true,true)}${i<gems.length-1?'<b>→</b>':''}</span>`).join('')
  }${idx===3?'<i class="cap">맨 뒤</i>':''}</span>`;
}

    board=`<div class="maze-box">
      <div class="maze board" role="grid" aria-label="꽃길 미로">${I.grid.flatMap((row,i)=>[...row].map((ch,j)=>{
        const id=i+'-'+j, visited=d.mazePath.includes(id), cur=d.mazePath.at(-1)===id;
        const next=I.solution[d.mazePath.length-1]===id;
        const cls=(ch==='#'?'fence':ch==='G'?'goal':ch==='D'?'dead':'path')
          +(visited?' visited':'')+(cur?' current':'')
          +(state.hints.garden>=2&&next?' hint-next':'')+(assist===id?' assisted':'');
        const icon=cur?'🐾':(state.hints.garden>=2&&next)?'👣':ch==='#'?'╳':ch==='G'?'✦':visited?'·':'✿';
        const lab=ch==='#'?'울타리':ch==='G'?'보석 꽃':ch==='D'?'막다른 꽃길':'꽃길';
        return `<button role="gridcell" aria-label="${lab}" class="${cls}" data-a="maze" data-v="${id}" data-c="${ch}">${icon}</button>`;
      })).join('')}</div>
      <div class="legend"><span>🐾 마이멜로디</span><span>✿ 꽃길</span><span>✦ 보석</span></div></div>`;
  }
  if(M==='party'){
    const L=PARTY[v];
    board=`<div class="party-box">
      <div class="picture-clues board">${L.clues.map((cl,i)=>`<span><b class="badge-num">${i+1}</b>${cl}</span>`).join('')}</div>
      <div class="seats">${['왼쪽','가운데','오른쪽'].map((nm,i)=>{
        const who=d.partySeats[i];
        return `<div class="${i===d.partySeats.length?'current':''}">
          ${who?portraitHtml(who,true):'<span class="seat-empty">?</span>'}<small>${nm}</small></div>`;
      }).join('')}</div>
      <p class="label">${['왼쪽','가운데','오른쪽'][d.partySeats.length]??''} 자리에 앉을 친구는?</p>
      <div class="choices">${Object.keys(FRIENDS).filter(f=>!d.partySeats.includes(f)).map(f=>`
        <button class="${assist===f?'assisted':''}" data-a="seat" data-v="${f}">
          ${portraitHtml(f,true)}<span>${FRIENDS[f][0]}<small>${FRIENDS[f][2]}</small></span>
        </button>`).join('')}</div></div>`;
  }
  if(M==='finale'){
    board=`<div class="finale-box">
      <div class="final-slots board">${[0,1,2,3].map(i=>`
        <span class="${i===d.finaleOrder.length?'current':''}">${d.finaleOrder[i]?gemHtml(d.finaleOrder[i]):i+1}</span>`).join('')}</div>
      <div class="gem-choices">${Object.keys(GEMS).filter(g=>!d.finaleOrder.includes(g)).map(g=>`
        <button class="${assist===g?'assisted':''}" data-a="finale-gem" data-v="${g}">
          ${gemHtml(g)}<span>${GEMS[g][0]}</span>
        </button>`).join('')}</div>
      <div class="final-actions">
        <button data-a="undo-finale" ${d.finaleOrder.length?'':'disabled'}>한 칸 되돌리기</button>
        <button class="primary" data-a="open-box" ${d.finaleOrder.length<4?'disabled':''}>상자 열기 ✦</button>
      </div></div>`;
  }
  const notebook = state.completed.length>0?`
    <details class="notebook" ${state.noteOpen||M==='finale'?'open':''} id="notebook">
      <summary>단서 수첩 <span class="count">${state.completed.length}/4</span></summary>
      <div class="clues">${state.completed.map((s,i)=>`
        <p class="clue"><b class="badge-num">${i+1}</b>${clueVisualHtml(R,i)}<span>${R.captions[i]}</span></p>`).join('')}</div>
    </details>`:'';
  const rewardModal = state.pendingReward?rewardView():'';
  const confirmModal = state.modal==='confirmReset'?`
    <div class="backdrop" data-a="close-modal">
      <section class="dialog" role="dialog" aria-modal="true" aria-labelledby="dlg-title">
        <p class="kicker">다시 시작</p>
        <h2 id="dlg-title">처음부터 새로 할까요?</h2>
        <p>찾은 보석과 장식이 모두 지워지고<br>새로운 길로 다시 시작해요.</p>
        <div class="dialog-actions">
          <button class="ghost" data-a="close-modal">계속 할래요</button>
          <button class="primary" data-a="confirm-reset">새로 시작</button>
        </div>
      </section>
    </div>`:'';
  return `<main class="game play scene-${M}">
    <header>
      <div><span class="stage-num">${M==='finale'?'마지막 상자':`${state.stageIndex+1} / 4`}</span><strong>${c[1]}</strong></div>
      <nav>
        <button aria-label="${muted?'효과음 켜기':'효과음 끄기'}" aria-pressed="${muted}" data-a="mute">${muted?'🔇':'🔔'}</button>
        <button data-a="speak" aria-label="문제 읽어주기">🔊 읽기</button>
      </nav>
    </header>
    <div class="gem-tray">${Object.keys(GEMS).map(g=>gemHtml(g,earned.includes(g),true)).join('')}</div>
    <section class="story">
      ${portraitHtml(STAGE_CHAR[M],true)}
      <div><span class="tag">${c[0]}</span><p>${c[2]}</p></div>
    </section>
    ${notebook}
    <section class="puzzle hint-${state.hints[M]}" aria-labelledby="puzzle-title">
      <div class="puzzle-head">
        <div><p class="tag">${c[0]}</p><h1 id="puzzle-title">${c[1]}</h1></div>
        ${step?`<span class="step">${step}</span>`:''}
      </div>
      ${board}
      <div class="feedback ${feedback?'active':''} ${feedbackShake?'shake':''}" aria-live="polite">${feedback||'천천히 살펴보고 골라요.'}</div>
      <div class="support">
        <button class="hint" data-a="hint" ${state.hints[M]>=3?'disabled':''}>
          <span>💡</span>${state.hints[M]>=3?'마지막 힌트 사용 중':`힌트 보기 ${state.hints[M]}/3`}
        </button>
        <button data-a="retry">이 문제 다시 하기</button>
      </div>
    </section>
    <footer>
      <button data-a="ask-reset">처음부터 새로 시작</button>
      <span>진행은 이 기기에만 저장돼요.</span>
    </footer>
    ${rewardModal}${confirmModal}
  </main>`;
}
function rewardView(){
  const Q=state.pendingReward, gem=STAGE_GEM[Q], R=FINALE[state.variant%3];
  const n=state.completed.length;
  return `<div class="backdrop">
    <section class="reward" role="dialog" aria-modal="true" aria-labelledby="reward-title">
      <p class="kicker">보석과 단서 발견!</p>
      <h2 id="reward-title">${GEMS[gem][0]} 보석을 찾았어요</h2>
      <div class="reward-gem">${gemHtml(gem)}</div>
      <div class="new-clue">
        <b>새 단서 ${n}</b>
        ${clueVisualHtml(R,n-1)}
        <span>${R.captions[n-1]}</span>
      </div>
      <p>파티 장식도 하나 골라요.</p>
      <div class="decor-choices">${DECOR[Q].map(dc=>`
        <button data-a="decor" data-v="${dc.id}">
          <span class="emoji">${dc.symbol}</span><strong>${esc(dc.name)}</strong><small>이 장식 고르기</small>
        </button>`).join('')}</div>
    </section>
  </div>`;
}

/* ============ 이벤트 ============ */
document.addEventListener('click',e=>{
  const b=e.target.closest('[data-a]');
  if(!b) return;
  const a=b.dataset.a, v=b.dataset.v;
  if(a==='close-modal'&&e.target!==b&&b.classList.contains('backdrop')) return;
  switch(a){
    case 'start': SFX.ok(); feedback=''; set({status:'playing'}); break;
    case 'restart': restartAll(); break;
    case 'mute': muted=!muted; persist(); render(); break;
    case 'speak': speak(); break;
    case 'hint': useHint(); break;
    case 'retry': retryPuzzle(); break;
    case 'ask-reset': set({modal:'confirmReset'}); break;
    case 'close-modal': set({modal:null}); break;
    case 'confirm-reset': state.modal=null; restartAll(); break;
    case 'pattern': pickPattern(v); break;
    case 'cafe': pickCafe(v); break;
    case 'maze': pickMaze(v,b.dataset.c); break;
    case 'seat': pickSeat(v); break;
    case 'finale-gem': pickFinaleGem(v); break;
    case 'undo-finale': undoFinale(); break;
    case 'open-box': openBox(); break;
    case 'decor': SFX.ok(); pickDecor(v); break;
  }
});
document.addEventListener('toggle',e=>{
  if(e.target.id==='notebook'){state.noteOpen=e.target.open;persist();}
},true);
/* 보상 모달 포커스 트랩 */
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'&&state.modal){set({modal:null});return;}
  if(e.key!=='Tab'||!state.pendingReward) return;
  const btns=[...document.querySelectorAll('.reward button:not(:disabled)')];
  if(!btns.length) return;
  const first=btns[0],last=btns.at(-1);
  if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus();}
  else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus();}
});
render();
</script>
