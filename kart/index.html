<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#2b2038">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="산리오 카트">
<meta name="format-detection" content="telephone=no">
<title>산리오 카트</title>
<style>
  html, body {
    width: 100%; height: 100%; margin: 0; overflow: hidden;
    background: #2b2038;
    font-family: "Malgun Gothic", "Apple SD Gothic Neo", sans-serif;
    overscroll-behavior: none; touch-action: none;
    -webkit-user-select: none; user-select: none; -webkit-touch-callout: none;
    -webkit-text-size-adjust: 100%;
  }
  body { position: fixed; inset: 0; }
  canvas {
    display: block; width: 100%; height: 100%;
    touch-action: none; -webkit-tap-highlight-color: transparent; outline: none;
  }
  #rotate {
    display: none; position: fixed; inset: 0; z-index: 10;
    align-items: center; justify-content: center; flex-direction: column; gap: 16px;
    padding: 32px; background: linear-gradient(#5b4270, #2b2038);
    color: #fff3e0; text-align: center; font-size: clamp(22px, 7vw, 34px); font-weight: 900;
  }
  #rotate .phone {
    width: 64px; height: 96px; border: 5px solid #ffd34d; border-radius: 13px;
    transform: rotate(90deg);
  }
  @media (orientation: portrait) and (pointer: coarse) { #rotate { display: flex; } }
  @media (orientation: portrait) and (max-width: 760px) { #rotate { display: flex; } }
</style>
</head>
<body>
<canvas id="game" role="application" aria-label="산리오 친구들과 딸기 초원을 달리는 카트 경주"></canvas>
<div id="rotate" role="status">
  <div class="phone"></div>
  <div>화면을 옆으로 돌려 주세요.</div>
</div>
<noscript>이 게임은 자바스크립트가 필요해요.</noscript>
<script src="src/mode7.js"></script>
<script src="src/track.js"></script>
<script src="src/track-art.js"></script>
<script src="src/sprites.js"></script>
<script src="src/kart.js"></script>
<script src="src/main.js"></script>
</body>
</html>
