<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#2b2038">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="산리오 카트">
<meta name="format-detection" content="telephone=no">
<title>산리오 카트</title>
<style>
  html, body {
    width: 100%; height: 100%; margin: 0; overflow: hidden;
    background: #2b2038;
    font-family: "Malgun Gothic", "Apple SD Gothic Neo", sans-serif;
    overscroll-behavior: none; touch-action: none;
    -webkit-user-select: none; user-select: none; -webkit-touch-callout: none;
    -webkit-text-size-adjust: 100%;
  }
  body { position: fixed; inset: 0; }
  canvas {
    display: block; width: 100%; height: 100%;
    touch-action: none; -webkit-tap-highlight-color: transparent; outline: none;
  }
  /* 소리 켜기/끄기 — 항상 보인다 */
  #sound {
    position: fixed; z-index: 8; pointer-events: auto; cursor: pointer;
    top: calc(12px + env(safe-area-inset-top)); right: calc(12px + env(safe-area-inset-right));
    width: 46px; height: 46px; border-radius: 50%;
    display: grid; place-items: center; font-size: 22px; line-height: 1;
    background: rgba(255,255,255,0.82); border: 3px solid rgba(140,74,99,0.28);
  }
  #sound:active { transform: scale(0.92); }

  /* 내 음악 넣기 — 선택 화면에서만 */
  #bgm {
    display: none; position: fixed; z-index: 8; pointer-events: auto;
    left: 50%; transform: translateX(-50%);
    bottom: calc(10px + env(safe-area-inset-bottom));
    flex-direction: column; align-items: center; gap: 5px;
    font-family: inherit; text-align: center; max-width: min(520px, 92vw);
  }
  #bgm.on { display: flex; }
  #bgm .row { display: flex; gap: 8px; }
  .bgmbtn {
    font: inherit; font-weight: 900; cursor: pointer;
    padding: 7px 15px; border-radius: 999px; border: 3px solid rgba(140,74,99,0.28);
    background: rgba(255,255,255,0.9); color: #8c4a63; font-size: 14px;
  }
  .bgmbtn:active { transform: translateY(2px); }
  #bgm-name { font-weight: 800; color: #8c4a63; font-size: 13px; }
  #bgm-note { font-weight: 700; color: #a98fb0; font-size: 11px; }

  #rotate {
    display: none; position: fixed; inset: 0; z-index: 10;
    align-items: center; justify-content: center; flex-direction: column; gap: 16px;
    padding: 32px; background: linear-gradient(#5b4270, #2b2038);
    color: #fff3e0; text-align: center; font-size: clamp(22px, 7vw, 34px); font-weight: 900;
  }
  #rotate .phone {
    width: 64px; height: 96px; border: 5px solid #ffd34d; border-radius: 13px;
    transform: rotate(90deg);
  }
  @media (orientation: portrait) and (pointer: coarse) { #rotate { display: flex; } }
  @media (orientation: portrait) and (max-width: 760px) { #rotate { display: flex; } }
</style>
</head>
<body>
<canvas id="game" role="application" aria-label="산리오 친구들과 딸기 초원을 달리는 카트 경주"></canvas>
<div id="rotate" role="status">
  <div class="phone"></div>
  <div>화면을 옆으로 돌려 주세요.</div>
</div>
<noscript>이 게임은 자바스크립트가 필요해요.</noscript>
<button id="sound" type="button" aria-label="소리 끄기">🔊</button>

<div id="bgm">
  <div class="row">
    <label class="bgmbtn" for="bgm-file">🎵 내 음악 넣기</label>
    <input id="bgm-file" type="file" accept="audio/*" hidden>
    <button class="bgmbtn" id="bgm-clear" type="button" hidden>기본 음악으로</button>
  </div>
  <div id="bgm-name">지금은 게임 기본 음악이에요</div>
  <div id="bgm-note">고른 파일은 이 기기에만 저장돼요. 인터넷으로 올라가지 않아요.</div>
</div>

<script src="src/music.js"></script>
<script src="src/mode7.js"></script>
<script src="src/track.js"></script>
<script src="src/track-art.js"></script>
<script src="src/sprites.js"></script>
<script src="src/kart.js"></script>
<script src="src/main.js"></script>
</body>
</html>
