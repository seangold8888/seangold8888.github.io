<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#fff4e4">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="오늘도 우리 집">
<meta property="og:title" content="오늘도 우리 집 — 가족 웹툰">
<meta property="og:description" content="재이네 가족의 소소하고 따뜻한 하루. 웃음도, 감동도, 한 줄의 배움도.">
<link rel="apple-touch-icon" href="../icon.png">
<link rel="icon" type="image/png" href="../icon.png">
<link rel="manifest" href="../manifest.json">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&display=swap">
<link rel="stylesheet" href="style.css?v=3">
<title>오늘도 우리 집</title>
</head>
<body>
<div class="progress" aria-hidden="true"><span id="progressBar"></span></div>

<header class="topbar">
  <a class="back" id="backLink" href="../game/">◀ 모험 상자</a>
  <div class="topbar-title" id="topTitle">오늘도 우리 집</div>
  <span class="topbar-spacer"></span>
</header>

<main id="home" class="home" hidden>
  <section class="hero">
    <div class="hero-art" id="heroArt"></div>
    <div class="hero-text">
      <p class="kicker">가족 에피소드 웹툰</p>
      <h1>오늘도 우리 집</h1>
      <p class="tagline">재이네 여섯 식구의 소소하고 따뜻한 하루.<br>웃음 한 스푼, 감동 한 스푼, 배움 한 줄.</p>
    </div>
  </section>

  <section class="section">
    <h2>등장인물</h2>
    <div class="cast" id="cast"></div>
  </section>

  <section class="section">
    <h2>태오어 사전 <small class="count" id="wordCount"></small></h2>
    <p class="section-lead">태오는 태오만의 말로 세상을 불러요. 틀린 말이 아니라, 지금만 들을 수 있는 보물 같은 말.</p>
    <ul class="words" id="taeoWords"></ul>
  </section>

  <section class="section">
    <h2>우리 집 말 모음</h2>
    <p class="section-lead">태오가 매일 하는 말</p>
    <ul class="words" id="taeoSayings"></ul>
    <p class="section-lead sub">재이가 요즘 하는 말</p>
    <ul class="words" id="jaeiSayings"></ul>
    <p class="section-lead sub">재이가 아기 때 한 말</p>
    <ul class="words" id="jaeiWords"></ul>
  </section>

  <section class="section">
    <h2>에피소드</h2>
    <ol class="episodes" id="episodeList"></ol>
  </section>

  <p class="foot">가족 얼굴은 아이가 연필로 그린 그림을 고치지 않고 그대로 옮겼어요.</p>
</main>

<main id="reader" class="reader" hidden>
  <header class="ep-head" id="epHead"></header>
  <div class="strip" id="strip"></div>
  <footer class="ep-end" id="epEnd"></footer>
</main>

<button class="to-top" id="toTop" type="button" aria-label="맨 위로" hidden>▲</button>

<script src="art.js?v=5"></script>
<script src="words.js?v=3"></script>
<script src="episodes.js?v=6"></script>
<script src="app.js?v=5"></script>
</body>
</html>
