<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#201a40">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="별빛 카트 배틀">
<link rel="apple-touch-icon" href="../icon.png">
<link rel="icon" type="image/png" href="../icon.png">
<link rel="manifest" href="../manifest.json">
<title>별빛 카트 배틀</title>
<style>
  :root { --night:#201a40; --night-deep:#14102b; --star:#ffd93d; --paper:#fff6e6; --ink:#2b2350; --mint:#6bcb77; }
  * { box-sizing: border-box; margin: 0; touch-action: manipulation; }
  html, body { height: 100%; background: var(--night-deep); overflow: hidden; overscroll-behavior: none; -webkit-text-size-adjust: 100%; }
  body { font-family: "Apple SD Gothic Neo", "Malgun Gothic", sans-serif; color: var(--paper); -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; }
  #stage { position: fixed; inset: 0; }
  #stage canvas { display: block; width: 100%; height: 100%; touch-action: none; }
  #hud { position: fixed; inset: 0; pointer-events: none; }
  #hud > * { pointer-events: auto; }
  /* 메뉴 */
  #menu { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px;
    background: radial-gradient(ellipse at 50% 30%, #2c2456 0%, var(--night-deep) 70%); padding: max(16px, env(safe-area-inset-top)) 16px max(16px, env(safe-area-inset-bottom)); z-index: 20; }
  #menu[hidden] { display: none; }
  #menu h1 { font-size: clamp(30px, 6vw, 52px); font-weight: 900; color: var(--star); text-shadow: 0 4px 0 rgba(0,0,0,.35); letter-spacing: .04em; }
  #menu .sub { font-size: clamp(14px, 2.4vw, 18px); font-weight: 700; color: rgba(255,246,230,.75); }
  .row { display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; max-width: 900px; }
  .pick { min-width: 118px; min-height: 64px; padding: 8px 12px; border-radius: 18px; border: 3px solid rgba(20,12,40,.6); background: rgba(255,246,230,.94); color: var(--ink);
    font: inherit; font-weight: 900; font-size: 16px; box-shadow: 0 5px 0 rgba(10,6,24,.5); cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 2px; }
  .pick .em { font-size: 28px; line-height: 1; }
  .pick.on { background: var(--star); outline: 4px solid rgba(255,255,255,.8); }
  .pick:active { transform: translateY(3px); box-shadow: 0 2px 0 rgba(10,6,24,.5); }
  #go { min-width: 240px; min-height: 72px; font-size: 24px; background: linear-gradient(180deg, #ffe9a8, var(--star)); border-radius: 24px; }
  #home { position: absolute; top: max(12px, env(safe-area-inset-top)); left: max(12px, env(safe-area-inset-left)); color: rgba(255,246,230,.8); text-decoration: none; font-weight: 900; padding: 10px 14px; border: 2px solid rgba(255,246,230,.3); border-radius: 999px; }
  .label { font-size: 13px; letter-spacing: .12em; font-weight: 900; color: #b0a0d8; }
  #menu .hint { font-size: 12.5px; color: rgba(255,246,230,.55); font-weight: 700; text-align: center; line-height: 1.5; }
</style>
</head>
<body>
<div id="stage"></div>
<div id="hud" class="sk-hud"></div>

<section id="menu">
  <a id="home" href="../">← 모험 상자</a>
  <h1>별빛 카트 배틀</h1>
  <p class="sub">달리면서 이야기 카드를 던져라 · 3바퀴 · 6명 레이스</p>
  <div class="label">누구로 달릴까?</div>
  <div class="row" id="heroRow"></div>
  <div class="label">어느 길?</div>
  <div class="row" id="trackRow"></div>
  <button class="pick" id="go" type="button">출발! 🏁</button>
  <p class="hint">키보드: 방향키 달리기 · 스페이스 드리프트/점프 · 1·2·3 카드<br>아이패드: 양쪽 화살 버튼 · 드리프트 버튼 · 카드 탭</p>
</section>

<script type="module" src="./src/main.js?v=1"></script>
</body>
</html>
