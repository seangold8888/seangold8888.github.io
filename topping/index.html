<style>
  html,body{margin:0;height:100%;background:#1b0f0a;overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none;font-family:"Jua","Apple SD Gothic Neo","Malgun Gothic",sans-serif;font-weight:400}
  #wrap{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%)}
  canvas{display:block;width:100%;height:100%}
  .ov{position:absolute;left:0;top:0;width:540px;height:960px;transform:scale(var(--s,1));transform-origin:0 0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;color:#fff;text-align:center}

  /* 첫 화면: 뒤에서 실제 게임이 시연으로 달림 (game.js newGame(7,true), 카메라 230px 위로) */

  .logo h1{margin:0;display:flex;gap:2px;font-size:84px;line-height:1;font-weight:400;letter-spacing:0;font-family:"Black Han Sans","Jua",sans-serif}
  .logo h1 span{display:inline-block;background:linear-gradient(#fff7ad 0%,#ffd31a 45%,#ff8a00 100%);-webkit-background-clip:text;background-clip:text;color:transparent;
    filter:drop-shadow(0 3px 0 #b33a00) drop-shadow(0 3px 0 #8a2500) drop-shadow(0 3px 0 #5c1800) drop-shadow(0 10px 12px rgba(0,0,0,.55));
    animation:drop .7s cubic-bezier(.2,1.6,.4,1) both,hop 1.4s ease-in-out infinite}
  .logo h1 span.sp{width:18px}
  .logo h1 span:nth-child(1){animation-delay:.05s,.8s}.logo h1 span:nth-child(2){animation-delay:.12s,.9s}.logo h1 span:nth-child(4){animation-delay:.2s,1s}
  .logo h1 span:nth-child(5){animation-delay:.28s,1.1s}.logo h1 span:nth-child(6){animation-delay:.36s,1.2s}
  /* 케첩으로 쓴 글씨 */
  .ketchup{position:relative;font-size:36px;font-family:"Black Han Sans","Jua",sans-serif;font-weight:400;color:#dc2626;letter-spacing:1px;
    text-shadow:0 2px 0 #991b1b,0 4px 0 #7f1d1d,0 0 2px #fff,0 6px 10px rgba(0,0,0,.4);-webkit-text-stroke:1.5px #fecaca;transform:rotate(3deg);animation:drop .6s .5s cubic-bezier(.2,1.6,.4,1) both}
  .ketchup::after{content:"";position:absolute;left:62%;top:78%;width:7px;height:16px;border-radius:0 0 6px 6px;background:#dc2626;box-shadow:-118px -4px 0 -1px #dc2626;animation:drip 2.4s 1.2s ease-in infinite}
  .bottom{display:flex;flex-direction:column;align-items:center;gap:8px;width:100%}
  .ask{font-size:32px;color:#fff;-webkit-text-stroke:2px #2a1050;paint-order:stroke fill;text-shadow:0 4px 0 rgba(0,0,0,.5)}
  /* 나이 버튼 = 접시 */
  .ages{display:grid;grid-template-columns:repeat(3,112px);gap:10px 26px}
  .ages button{width:112px;height:104px;padding:0;border-radius:50%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:0;color:#fff;
    background:radial-gradient(circle at 50% 46%,var(--c1) 0 52%,var(--c2) 53% 58%,#fff 59% 70%,#e7e5e4 71% 100%);
    box-shadow:0 7px 0 #a8a29e,0 12px 16px rgba(0,0,0,.45);animation:pop .5s cubic-bezier(.2,1.8,.4,1) both,float 2.2s ease-in-out infinite}
  .ages button b{font-size:30px;line-height:1;text-shadow:0 2px 0 rgba(0,0,0,.35)}.ages button small{font-size:13px;opacity:.95;margin-top:1px}
  .ages button:nth-child(1){--c1:#fb7185;--c2:#be123c;animation-delay:1s,0s}
  .ages button:nth-child(2){--c1:#fb923c;--c2:#c2410c;animation-delay:1.06s,.3s}
  .ages button:nth-child(3){--c1:#facc15;--c2:#a16207;animation-delay:1.12s,.6s}
  .ages button:nth-child(4){--c1:#4ade80;--c2:#15803d;animation-delay:1.18s,.9s}
  .ages button:nth-child(5){--c1:#60a5fa;--c2:#1d4ed8;animation-delay:1.24s,1.2s}
  .ages button:nth-child(6){--c1:#c084fc;--c2:#7e22ce;animation-delay:1.3s,1.5s}
  .ages.kids{grid-template-columns:repeat(4,112px);gap:10px}
  .ages.kids .kidbtn{width:112px;height:132px;border-radius:24px;padding:6px 0 4px;justify-content:flex-end;background:linear-gradient(#fffbeb,#fcd34d);box-shadow:0 6px 0 #b45309,0 10px 14px rgba(0,0,0,.4)}
  .ages.kids .kidbtn b{color:#7c2d12;text-shadow:none}
  .ages.kids .kidbtn img{width:92px;height:92px;object-fit:contain;filter:drop-shadow(0 3px 0 rgba(0,0,0,.3))}
  .ages.kids .kidbtn b{font-size:22px}
  .ages.kids .kidbtn.sel{box-shadow:0 0 0 5px #fff,0 0 26px #fde047,0 7px 0 #a8a29e}
  .ages.kids .gobtn{grid-column:1/-1;width:auto;height:auto;border-radius:28px;padding:16px 0;font-size:40px;background:linear-gradient(#4ade80,#16a34a);box-shadow:0 8px 0 #14532d;animation:pop .5s 1.3s cubic-bezier(.2,1.8,.4,1) both,float 2.2s ease-in-out infinite}
  .ages button:active{animation:squash .28s ease-out;box-shadow:0 2px 0 #a8a29e,0 4px 8px rgba(0,0,0,.4)}
  /* 손가락 안내 (글 못 읽는 아이용) */
  .hint{font-size:18px;opacity:.9}
  .swipe{display:flex;align-items:center;gap:6px;font-size:16px;font-weight:400;color:#fde68a}
  .swipe .hand{display:inline-block;font-size:34px;animation:swipe 1.4s ease-in-out infinite}
  button{font:inherit;font-weight:400;border:0;border-radius:22px;padding:18px 26px;font-size:28px;color:#fff;text-shadow:0 2px 0 rgba(0,0,0,.35);background:linear-gradient(#22c55e,#15803d);box-shadow:0 7px 0 #14532d;cursor:pointer}
  button:active{transform:translateY(5px);box-shadow:0 2px 0 #14532d}
  #result{background:rgba(20,8,4,.72)}
  .hubback{position:fixed;left:12px;top:12px;z-index:20;width:44px;height:44px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:rgba(20,10,40,.7);color:#fff;font-size:24px;text-decoration:none;border:2px solid #f6c544}
  body:not(.title) .hubback{display:none}
  .map{display:flex;align-items:center;margin-top:10px;padding:6px 10px 4px;border-radius:999px;background:rgba(20,6,2,.55);animation:drop .6s .7s cubic-bezier(.2,1.6,.4,1) both}
  .map .st{display:flex;flex-direction:column;align-items:center;width:58px;padding:0;background:none;box-shadow:none;border-radius:0;text-shadow:none;color:#fff}
  .map .st:active{transform:none}
  .map .st.shake{animation:nope .4s}
  @keyframes nope{20%,60%{translate:-6px 0}40%,80%{translate:6px 0}}
  .row2{display:flex;gap:10px}
  .shopbtn{background:linear-gradient(#fb923c,#c2410c);box-shadow:0 5px 0 #7c2d12}
  #shop{background:rgba(40,16,4,.97);gap:14px;z-index:5}
  #shop h2{margin:0;font-size:44px}
  .coinbig{font-size:30px;color:#fde047;text-shadow:0 3px 0 #7c2d12}
  .shoplist{display:flex;flex-direction:column;gap:10px;width:470px}
  .up{display:flex;align-items:center;gap:12px;background:rgba(255,255,255,.1);border-radius:20px;padding:10px 12px;text-align:left}
  .up i{font-style:normal;font-size:40px;width:52px;text-align:center}
  .up .ut{flex:1;display:flex;flex-direction:column}
  .up .ut b{font-size:24px;font-weight:400}
  .up .ut span{color:#fde047;letter-spacing:2px;font-size:16px}
  .up .ut small{font-size:14px;opacity:.85}
  .up button{padding:10px 14px;font-size:20px;border-radius:16px;min-width:96px}
  .up button:disabled{filter:grayscale(1);opacity:.5}
  .coingain{font-size:32px;color:#fde047;text-shadow:0 3px 0 #7c2d12;min-height:40px}
  .coingain small{font-size:16px;color:#fff;opacity:.85}
  .unlock{font-size:26px;color:#86efac;margin-top:4px;animation:slam .5s 2.6s cubic-bezier(.2,1.8,.4,1) both}
  .unlock.dim{color:#fde68a;font-size:18px;animation:none}
  .nextbtn{background:linear-gradient(#60a5fa,#1d4ed8);box-shadow:0 7px 0 #1e3a8a;font-size:30px}
  .map .st i{font-style:normal;font-size:26px;width:46px;height:46px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:#fff;box-shadow:0 4px 0 rgba(0,0,0,.35)}
  .map .st small{font-size:12px;font-weight:400;margin-top:3px;text-shadow:0 2px 0 #000a}
  .map .st.lock i{filter:grayscale(1);opacity:.55;background:#d6d3d1}
  .map .st.now i{background:#fde047;box-shadow:0 0 0 4px #fff,0 0 22px #fde047;animation:hop 1s ease-in-out infinite}
  .map b{width:16px;border-top:4px dotted rgba(255,255,255,.7);margin-bottom:16px}
  .bookbtn{margin-top:8px;padding:8px 18px;font-size:18px;border-radius:999px;background:linear-gradient(#a78bfa,#6d28d9);box-shadow:0 5px 0 #4c1d95;animation:drop .6s .9s cubic-bezier(.2,1.6,.4,1) both}
  #book{background:rgba(20,8,40,.97);gap:12px;z-index:5}
  #book h2{margin:0;font-size:44px}
  .grid{display:grid;grid-template-columns:repeat(4,108px);gap:10px}
  .stk{background:rgba(255,255,255,.08);border-radius:18px;padding:8px 4px;display:flex;flex-direction:column;align-items:center;gap:4px}
  .stk img{width:76px;height:76px;object-fit:contain;filter:brightness(0) opacity(.35)}
  .stk.own{background:rgba(255,255,255,.18);box-shadow:0 0 0 3px #fde047 inset}
  .stk.own img{filter:none}
  .stk span{font-size:12px;font-weight:400}
  .newstk{display:flex;align-items:center;gap:12px;min-height:110px}
  .newstk .nlab{font-size:24px;font-weight:400;color:#fde047;text-shadow:0 3px 0 #7c2d12}
  .nst{display:flex;flex-direction:column;align-items:center;transform:scale(0);animation:slam .5s cubic-bezier(.2,1.8,.4,1) forwards}
  .nst img{width:84px;height:84px;object-fit:contain;filter:drop-shadow(0 0 12px #fde047)}
  .nst span{font-size:13px;font-weight:400}
  #result h2{margin:0;font-size:58px;font-family:"Black Han Sans","Jua",sans-serif;color:#ffe066;-webkit-text-stroke:3px #3b0a00;paint-order:stroke fill;text-shadow:0 6px 0 #7c2d12,0 10px 18px rgba(0,0,0,.5)}
  .stars{display:flex;gap:10px;height:120px;align-items:center}
  .star{font-size:96px;line-height:1;color:#57534e;transform:scale(0)}
  .star.on{color:#facc15;text-shadow:0 0 24px #fde047,0 6px 0 #a16207}
  .star.slam{animation:slam .45s cubic-bezier(.2,1.8,.4,1) forwards}
  #score{font-size:52px;font-family:"Black Han Sans","Jua",sans-serif;color:#fff;-webkit-text-stroke:3px #2a1050;paint-order:stroke fill;text-shadow:0 5px 0 rgba(0,0,0,.4)}
  .row{display:flex;gap:14px}
  @keyframes bob{50%{transform:translateY(-8px)}}
  @keyframes hop{0%,100%{transform:translateY(0)}50%{transform:translateY(-9px)}}
  @keyframes drop{0%{transform:translateY(-140px) scale(.4);opacity:0}100%{transform:none;opacity:1}}
  @keyframes pop{0%{transform:scale(0)}100%{transform:scale(1)}}
  @keyframes float{0%,100%{translate:0 0}50%{translate:0 -5px}}
  @keyframes squash{0%{scale:1}35%{scale:1.18 .8}65%{scale:.92 1.1}100%{scale:1}}
  @keyframes swipe{0%,100%{transform:translateX(-26px) rotate(-12deg)}50%{transform:translateX(26px) rotate(12deg)}}
  @keyframes drip{0%,30%{height:6px;opacity:1}80%{height:22px;opacity:1}100%{height:22px;opacity:0}}
  @keyframes slam{0%{transform:scale(3) rotate(-30deg);opacity:0}100%{transform:scale(1) rotate(0);opacity:1}}

      <div class="ketchup" id="stTitle">거품 욕실 대모험</div>
      <div class="map" id="map"></div>
      <div class="row2"><button id="bookBtn" class="bookbtn">📒 스티커북 <span id="bookBtnN">0/13</span></button><button id="shopBtn" class="bookbtn shopbtn">💪 강해지기 <span id="shopBtnN"></span></button></div>
    </div>
    <div class="bottom">
      <div class="ask">몇 살이에요?</div>
      <div class="ages">
        <button data-age="5"><b>5살</b><small>유치원</small></button>
        <button data-age="6"><b>6살</b><small>유치원</small></button>
        <button data-age="7"><b>7살</b><small>1학년</small></button>
        <button data-age="8"><b>8살</b><small>2학년</small></button>
        <button data-age="9"><b>9살</b><small>3학년</small></button>
        <button data-age="10"><b>10살</b><small>4학년</small></button>
      </div>
      <div class="swipe">◀ <span class="hand">👆</span> ▶ 밀어서 더 큰 문으로!</div>
    </div>
  </div>
  <div id="book" class="ov hide">
    <h2>📒 스티커북</h2>
    <div id="bookCount" class="hint">0 / 13</div>
    <div id="bookGrid" class="grid"></div>
    <div class="hint">별 1개 = 새 스티커 1장!</div>
    <button id="bookClose">닫기</button>
  </div>
  <div id="shop" class="ov hide">
    <h2>💪 강해지기</h2>
    <div id="shopCoin" class="coinbig"></div>
    <div id="shopList" class="shoplist"></div>
    <div class="hint">판을 끝내면 코인을 받아요. 맞힐수록 많이!</div>
    <button id="shopClose">닫기</button>
  </div>
  <div id="result" class="ov hide">
    <h2 id="rtitle">야채 피자 잔치!</h2>
    <div class="stars"><span class="star">★</span><span class="star">★</span><span class="star">★</span></div>
    <div id="score">0</div>
    <div id="rinfo" class="hint"></div>
    <div id="coinGain" class="coingain"></div>
    <div id="newStk" class="newstk"></div>
    <button id="next" class="hide nextbtn">다음 ▶</button>
    <div class="row"><button id="again">한 번 더!</button><button id="toMenu" style="background:linear-gradient(#f59e0b,#b45309);box-shadow:0 7px 0 #78350f">처음 화면</button></div>
  </div>
</div>
<script src="edition-hub.js?v=4"></script>
<script src="game.js?v=4"></script>
</body>
</html>
