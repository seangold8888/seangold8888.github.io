<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#0d3b66">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Deep Dive · PLAYGROUND</title>
<link rel="preload" href="../sanguo/fonts/pretendard/PretendardVariable.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="style.css?v=5">
<script src="../assets/study/play-timer.js?v=4"></script>
<script src="../assets/touch-guard.js?v=1"></script>
<script src="../math/curriculum.js?v=21"></script>
<script src="../math/learning.js?v=30"></script>
<script src="../math/store.js?v=34"></script>
<script src="../assets/study/math-bridge.js?v=3"></script>
<script src="../assets/study/kid-voices.js?v=1"></script>
<script src="../assets/study/game-quiz.js?v=4"></script>
</head>
<body>
<canvas id="sea" aria-label="딥 다이브. 화면을 누르고 끌면 잠수정이 그쪽으로 가요. 물방울은 저절로 나가요."></canvas>

<header class="hud" id="hud" hidden>
  <a class="back" href="../game/" aria-label="PLAYGROUND로 돌아가기">←</a>
  <div class="chip" id="hearts" aria-label="남은 하트">♥♥♥</div>
  <div class="chip grow xpchip" aria-label="? 진주까지"><span class="xpbar"><i id="xpfill"></i></span><b id="qcount"></b></div>
  <div class="chip" id="clock">3:30</div>
  <button class="chip icon" id="pauseBtn" type="button" aria-label="잠깐 멈춤">⏸</button>
  <button class="chip icon" id="sound" type="button" aria-pressed="true" aria-label="소리">♪</button>
</header>
<div class="fever" id="fever" hidden aria-label="무지개 터보 게이지"><span class="fever-label">터보</span><span class="fever-bar"><i id="feverFill"></i></span></div>
<button class="dash ready" id="dashBtn" type="button" hidden aria-label="슈웅! 앞으로 쭉 나가요"><span>슈웅!</span></button>

<section class="panel" id="start">
  <h1>Deep Dive</h1>
  <p class="lead">바다 친구를 씻어 주러 가요!</p>
  <div class="pilots" id="pilots" role="group" aria-label="누가 잠수할까요?"></div>
  <!-- 목표는 늘 보이게, 자세한 것은 작은 칩 뒤로 -->
  <div class="goals" id="goals">
    <button class="gchip zonechip" id="zoneChip" type="button" aria-expanded="false" aria-controls="zoneSheet" aria-label="바다 고르기">
      <span class="gname" id="zoneName">산호 숲</span><span class="zdots" id="zoneDots" aria-hidden="true"></span>
    </button>
    <button class="gchip pearlchip" id="pearlChip" type="button" aria-expanded="false" aria-controls="zoneSheet" aria-label="가족 진주함">
      <i class="gpearl" aria-hidden="true"></i><span class="gbar"><i id="pearlFill"></i></span><b id="pearlNum">0</b>
    </button>
    <button class="gchip" id="dexBtn" type="button" aria-label="바다 친구 도감">
      <span aria-hidden="true">📖</span><b id="dexNum">0</b>
    </button>
    <button class="gchip icon" id="giftChip" type="button" aria-expanded="false" aria-controls="giftSheet" aria-label="출발 선물과 기록">
      <span aria-hidden="true">🎁</span>
    </button>
  </div>
  <div class="sheet" id="zoneSheet" hidden>
    <div class="zones" id="zones"></div>
    <p class="small" id="nextSea"></p>
  </div>
  <div class="sheet" id="giftSheet" hidden>
    <p class="small" id="chest">가족 진주함 0</p>
    <p class="small" id="giftLine"></p>
    <p class="small" id="bestLine"></p>
  </div>
  <button class="go" id="startBtn" type="button">출발!</button>
</section>

<section class="panel" id="dex" hidden>
  <h2>바다 친구 도감</h2>
  <div class="dexgrid" id="dexGrid"></div>
  <p class="small" id="dexNote"></p>
  <button class="go" id="dexClose" type="button">닫기</button>
</section>

<section class="panel" id="cards" hidden aria-live="polite">
  <p class="kicker" id="cardKicker">장비를 골라요!</p>
  <p class="cards-title" id="cardTitle">어떤 장비가 좋아요?</p>
  <div class="cardrow" id="cardRow"></div>
</section>

<section class="panel" id="pause" hidden>
  <h2>잠깐 쉬어요</h2>
  <button class="go" id="resumeBtn" type="button">계속 잠수하기</button>
  <button class="ghost wide" id="quitBtn" type="button">그만하고 처음 화면으로</button>
</section>

<section class="panel" id="over" hidden>
  <h2 id="overTitle">잘 다녀왔어요!</h2>
  <div id="overText"></div>
  <button class="go" id="againBtn" type="button">다시 잠수하기</button>
  <button class="ghost wide" id="menuBtn" type="button">처음 화면으로</button>
  <a class="home" href="../game/">← PLAYGROUND</a>
</section>

<script type="module" src="src/main.js?v=9"></script>
</body>
</html>
