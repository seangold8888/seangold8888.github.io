<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <meta name="theme-color" content="#211a3a">
  <!-- 아이패드: 홈 화면에 추가하면 사파리 막대 없는 전체 화면 앱이 된다 -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="오디세이아">
  <link rel="apple-touch-icon" href="icon.png">
  <link rel="icon" type="image/png" href="icon.png">
  <title>오디세이아: 집으로 가는 길</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #151126;
      font-family: "Malgun Gothic", "Apple SD Gothic Neo", sans-serif;
      /* 아이패드 사파리: 고무줄 스크롤·핀치줌·꾹 눌러 선택 전부 차단 */
      overscroll-behavior: none;
      touch-action: none;
      -webkit-user-select: none;
      user-select: none;
      -webkit-touch-callout: none;
    }
    body {
      position: fixed;
      inset: 0;
    }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
      touch-action: none;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
      outline: none;
    }
    canvas:focus-visible {
      box-shadow: inset 0 0 0 4px #ffe47f;
    }
    .sr-only {
      position: fixed;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }
    #rotate {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 10;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      gap: 16px;
      padding: 32px;
      background: linear-gradient(#433b70, #211a3a);
      color: #fff8df;
      text-align: center;
      font-size: clamp(22px, 7vw, 34px);
      font-weight: 900;
    }
    #rotate .phone {
      width: 64px;
      height: 96px;
      border: 5px solid #ffe47f;
      border-radius: 13px;
      transform: rotate(90deg);
      animation: breathe 1.6s ease-in-out infinite;
    }
    #rotate small {
      font-size: 0.62em;
      color: #d9cdf1;
    }
    @keyframes breathe {
      0%, 100% { transform: rotate(90deg) scale(1); }
      50% { transform: rotate(90deg) scale(1.06); }
    }
    /* 터치 기기는 크기와 상관없이(아이패드 포함) 세로일 때 회전 안내 */
    @media (orientation: portrait) and (pointer: coarse) {
      #rotate { display: flex; }
    }
    @media (orientation: portrait) and (max-width: 760px) {
      #rotate { display: flex; }
    }
    @media (prefers-reduced-motion: reduce) {
      #rotate .phone { animation: none; }
    }
  </style>
</head>
<body>
  <canvas
    id="game"
    tabindex="0"
    role="application"
    aria-describedby="game-help"
    aria-label="오디세우스가 이타카로 돌아가는 세 개의 액션 모험"></canvas>
  <p id="game-help" class="sr-only">화살표와 스페이스바로 움직여요. 키르케의 섬에서는 화살표로 걷고 스페이스바로 약초를 뿌려요. 엔터로 선택해요. P 또는 Esc로 쉬고, M으로 소리를 켜고 꺼요. 화면 내용은 아래 상태 안내로 읽어 드려요.</p>
  <p id="game-status" class="sr-only" aria-live="polite"></p>
  <div id="rotate" role="status" aria-live="polite">
    <div class="phone"></div>
    <div>화면을 옆으로 돌려 주세요.</div>
    <small>걱정 마세요. 모험은 잠시 멈춰요.</small>
  </div>
  <noscript>이 게임은 자바스크립트가 필요해요.</noscript>
  <script>
/* src/audio.js */
// 오디세이아 — 외부 파일 없이 합성하는 오리지널 그리스풍 OST
// 고대 리라·아울로스·프레임드럼·청동 공의 질감을 Web Audio로 재해석한다.
(function () {
  'use strict';
  window.ODY = window.ODY || {};
  const S = {};

  let ctx = null;
  let master = null;
  let sfxBus = null;
  let ambienceBus = null;
  let musicBuses = [];
  let activeMusicBus = 0;
  let musicBus = null;
  let aulosWave = null;
  let noiseBuffers = { white: null, brown: null };
  let pluckBuffers = new Map();
  let muted = false;
  let musicWanted = false;
  let musicMode = 'title';
  let musicState = 'play';
  let musicIntensity = 0.28;
  let scheduler = null;
  let nextNoteTime = 0;
  let musicStep = 0;
  let pauseWanted = false;
  let userUnlocked = false;
  let resumeEpoch = 0;
  const voices = { music: [], sfx: [] };
  let busVoices = [[], []];
  const VOICE_CAP = { music: 28, sfx: 36 };

  try { muted = localStorage.getItem('ody_muted') === '1'; } catch (_) {}

  function clamp(value, a, b) {
    return Math.max(a, Math.min(b, value));
  }

  function mtof(midi) {
    return 440 * Math.pow(2, (midi - 69) / 12);
  }

  function seeded(seed) {
    let value = seed >>> 0;
    return function () {
      value = (value * 1664525 + 1013904223) >>> 0;
      return value / 4294967296;
    };
  }

  function clearVoiceLists() {
    voices.music.length = 0;
    voices.sfx.length = 0;
  }

  function resetClosedGraph() {
    resumeEpoch++;
    stopScheduler();
    ctx = null;
    master = null;
    sfxBus = null;
    ambienceBus = null;
    musicBuses = [];
    musicBus = null;
    busVoices = [[], []];
    aulosWave = null;
    noiseBuffers = { white: null, brown: null };
    pluckBuffers = new Map();
    clearVoiceLists();
  }

  function ensure() {
    if (ctx && ctx.state !== 'closed') return true;
    if (ctx && ctx.state === 'closed') resetClosedGraph();
    try {
      ctx = new (window.AudioContext || window.webkitAudioContext)();
    } catch (_) {
      return false;
    }

    master = ctx.createGain();
    master.gain.value = muted ? 0.0001 : 0.7;
    const limiter = ctx.createDynamicsCompressor();
    limiter.threshold.value = -12;
    limiter.knee.value = 4;
    limiter.ratio.value = 12;
    limiter.attack.value = 0.003;
    limiter.release.value = 0.16;
    master.connect(limiter);
    limiter.connect(ctx.destination);

    sfxBus = ctx.createGain();
    sfxBus.gain.value = 0.56;
    ambienceBus = ctx.createGain();
    ambienceBus.gain.value = 0.055;
    sfxBus.connect(master);
    ambienceBus.connect(master);

    musicBuses = [ctx.createGain(), ctx.createGain()];
    musicBuses.forEach(bus => {
      bus.gain.value = 0.0001;
      bus.connect(master);
    });
    // 짧고 어두운 청동 방 울림. 외부 임펄스 파일 없이 장대한 공간감만 더한다.
    if (ctx.createDelay) {
      const echo = ctx.createDelay(0.8);
      const echoFilter = ctx.createBiquadFilter();
      const echoFeedback = ctx.createGain();
      const echoWet = ctx.createGain();
      echo.delayTime.value = 0.23;
      echoFilter.type = 'lowpass'; echoFilter.frequency.value = 1650; echoFilter.Q.value = 0.55;
      echoFeedback.gain.value = 0.16;
      echoWet.gain.value = 0.11;
      musicBuses.forEach(bus => bus.connect(echo));
      echo.connect(echoFilter); echoFilter.connect(echoWet); echoWet.connect(master);
      echoFilter.connect(echoFeedback); echoFeedback.connect(echo);
    }
    activeMusicBus = 0;
    musicBus = musicBuses[activeMusicBus];

    // startBgm()이 자동재생 제한 때문에 처음엔 컨텍스트를 만들지 못했거나,
    // 모바일 브라우저가 컨텍스트를 닫은 뒤 새 그래프를 만든 경우에도 현재 곡을 복원한다.
    if (musicWanted) {
      musicBus.gain.setValueAtTime(0.0001, ctx.currentTime);
      fadeParam(musicBus.gain, musicGainTarget(), 0.34);
      nextNoteTime = ctx.currentTime + 0.06;
    }

    const graphContext = ctx;
    ctx.onstatechange = function () {
      if (ctx !== graphContext) return;
      if (graphContext.state === 'running' && !pauseWanted && !muted) {
        startScheduler();
      } else {
        stopScheduler();
        if (graphContext.state === 'running' && pauseWanted) {
          graphContext.suspend().catch(() => {});
        }
      }
    };
    if (pauseWanted && ctx.state === 'running') ctx.suspend().catch(() => {});
    return true;
  }

  function voiceKind(dest, explicit) {
    if (explicit) return explicit;
    return dest === sfxBus ? 'sfx' : 'music';
  }

  function trackVoice(source, kind, dest) {
    kind = kind === 'sfx' ? 'sfx' : 'music';
    const list = voices[kind];
    while (list.length >= VOICE_CAP[kind]) {
      const old = list.shift();
      try { old.stop(ctx.currentTime + 0.005); } catch (_) {}
    }
    list.push(source);
    const busIndex = musicBuses.indexOf(dest);
    if (busIndex >= 0) busVoices[busIndex].push(source);
    const remove = function () {
      const index = list.indexOf(source);
      if (index >= 0) list.splice(index, 1);
      if (busIndex >= 0) {
        const busIndexOfSource = busVoices[busIndex].indexOf(source);
        if (busIndexOfSource >= 0) busVoices[busIndex].splice(busIndexOfSource, 1);
      }
    };
    source.addEventListener ? source.addEventListener('ended', remove, { once: true }) : source.onended = remove;
  }

  function tone(o) {
    if (muted || !ensure()) return null;
    const start = o.abs !== undefined ? Math.max(ctx.currentTime, o.abs) : ctx.currentTime + (o.at || 0);
    const duration = Math.max(0.03, o.dur || 0.16);
    const attack = Math.min(duration * 0.28, o.attack === undefined ? 0.008 : o.attack);
    const releaseAt = start + Math.max(attack + 0.01, duration * (o.sustain === undefined ? 0.62 : o.sustain));
    const osc = ctx.createOscillator();
    const filter = ctx.createBiquadFilter();
    const gain = ctx.createGain();
    const dest = o.dest || sfxBus;

    osc.type = o.type || 'triangle';
    osc.frequency.setValueAtTime(Math.max(20, o.f || 440), start);
    if (o.f2) osc.frequency.exponentialRampToValueAtTime(Math.max(20, o.f2), start + duration);
    if (o.detune) osc.detune.value = o.detune;
    filter.type = o.filterType || 'lowpass';
    filter.frequency.setValueAtTime(o.filter || 4200, start);
    if (o.filter2) filter.frequency.exponentialRampToValueAtTime(Math.max(80, o.filter2), start + duration);
    filter.Q.value = o.q || 0.7;

    const volume = o.vol === undefined ? 0.14 : Math.max(0.0001, o.vol);
    gain.gain.setValueAtTime(0.0001, start);
    gain.gain.exponentialRampToValueAtTime(volume, start + Math.max(0.002, attack));
    gain.gain.setValueAtTime(volume * (o.body === undefined ? 0.7 : o.body), releaseAt);
    gain.gain.exponentialRampToValueAtTime(0.0001, start + duration);
    osc.connect(filter); filter.connect(gain); gain.connect(dest);
    trackVoice(osc, voiceKind(dest, o.kind), dest);
    osc.start(start); osc.stop(start + duration + 0.035);
    return osc;
  }

  function getNoiseBuffer(brown) {
    const key = brown ? 'brown' : 'white';
    if (noiseBuffers[key]) return noiseBuffers[key];
    const buffer = ctx.createBuffer(1, Math.floor(ctx.sampleRate), ctx.sampleRate);
    const data = buffer.getChannelData(0);
    const random = seeded(brown ? 0x0d155ea5 : 0x51a7e123);
    let last = 0;
    for (let i = 0; i < data.length; i++) {
      const white = random() * 2 - 1;
      last = last * 0.75 + white * 0.25;
      data[i] = brown ? last * 1.45 : white;
    }
    noiseBuffers[key] = buffer;
    return buffer;
  }

  function noise(o) {
    if (muted || !ensure()) return null;
    const start = o.abs !== undefined ? Math.max(ctx.currentTime, o.abs) : ctx.currentTime + (o.at || 0);
    const duration = Math.max(0.025, o.dur || 0.1);
    const source = ctx.createBufferSource();
    const filter = ctx.createBiquadFilter();
    const gain = ctx.createGain();
    const dest = o.dest || sfxBus;
    source.buffer = getNoiseBuffer(!!o.brown);
    source.loop = duration > 0.96;
    filter.type = o.filterType || 'lowpass';
    filter.frequency.value = o.filter || 1200;
    filter.Q.value = o.q || 0.7;
    const volume = o.vol === undefined ? 0.08 : Math.max(0.0001, o.vol);
    gain.gain.setValueAtTime(volume, start);
    gain.gain.exponentialRampToValueAtTime(0.0001, start + duration);
    source.connect(filter); filter.connect(gain); gain.connect(dest);
    trackVoice(source, voiceKind(dest, o.kind), dest);
    source.start(start); source.stop(start + duration + 0.03);
    return source;
  }

  function getPluckBuffer(midi) {
    if (pluckBuffers.has(midi)) return pluckBuffers.get(midi);
    const frequency = mtof(midi);
    const length = Math.floor(ctx.sampleRate * 0.92);
    const period = Math.max(2, Math.round(ctx.sampleRate / frequency));
    const buffer = ctx.createBuffer(1, length, ctx.sampleRate);
    const data = buffer.getChannelData(0);
    const random = seeded(0x6c797265 + midi * 7919);
    for (let i = 0; i < period && i < length; i++) data[i] = (random() * 2 - 1) * 0.72;
    for (let i = period; i < length; i++) {
      const previous = data[i - period];
      const neighbor = data[Math.max(0, i - period + 1)];
      data[i] = (previous + neighbor) * 0.4972;
    }
    pluckBuffers.set(midi, buffer);
    return buffer;
  }

  // 리라: Karplus–Strong 현 모델에 작은 손가락 잡음을 더한다.
  function lyre(midi, at, volume, dest, kind) {
    if (muted || !ensure()) return;
    const start = at === undefined ? ctx.currentTime : Math.max(ctx.currentTime, at);
    const output = dest || musicBus || sfxBus;
    const source = ctx.createBufferSource();
    const filter = ctx.createBiquadFilter();
    const gain = ctx.createGain();
    source.buffer = getPluckBuffer(midi);
    filter.type = 'lowpass'; filter.frequency.value = 3600; filter.Q.value = 0.55;
    const vol = volume === undefined ? 0.08 : volume;
    gain.gain.setValueAtTime(Math.max(0.0001, vol), start);
    gain.gain.exponentialRampToValueAtTime(0.0001, start + 0.88);
    source.connect(filter); filter.connect(gain); gain.connect(output);
    trackVoice(source, voiceKind(output, kind), output);
    source.start(start); source.stop(start + 0.9);
    tone({ f: mtof(midi + 12), dur: 0.11, type: 'sine', vol: vol * 0.18,
      attack: 0.002, sustain: 0.22, filter: 4800, abs: start, dest: output, kind });
  }

  // 아울로스: 홀수 배음과 숨결, 5Hz 비브라토를 섞은 부드러운 이중관 질감.
  function aulos(midi, at, duration, volume, dest) {
    if (muted || !ensure()) return;
    const start = at === undefined ? ctx.currentTime : Math.max(ctx.currentTime, at);
    const dur = Math.max(0.22, duration || 0.7);
    const output = dest || musicBus;
    if (!aulosWave) {
      aulosWave = ctx.createPeriodicWave(
        new Float32Array([0, 0, 0, 0, 0, 0]),
        new Float32Array([0, 1, 0.34, 0.17, 0.08, 0.035]),
        { disableNormalization: false }
      );
    }
    const osc = ctx.createOscillator();
    const vibrato = ctx.createOscillator();
    const vibratoGain = ctx.createGain();
    const filter = ctx.createBiquadFilter();
    const gain = ctx.createGain();
    osc.setPeriodicWave(aulosWave);
    osc.frequency.setValueAtTime(mtof(midi), start);
    vibrato.frequency.value = 5.1;
    vibratoGain.gain.value = 5.5;
    vibrato.connect(vibratoGain); vibratoGain.connect(osc.detune);
    filter.type = 'lowpass'; filter.frequency.value = 2600; filter.Q.value = 1.1;
    const vol = volume === undefined ? 0.045 : volume;
    gain.gain.setValueAtTime(0.0001, start);
    gain.gain.exponentialRampToValueAtTime(vol, start + Math.min(0.14, dur * 0.22));
    gain.gain.setValueAtTime(vol * 0.82, start + dur * 0.68);
    gain.gain.exponentialRampToValueAtTime(0.0001, start + dur);
    osc.connect(filter); filter.connect(gain); gain.connect(output);
    trackVoice(osc, voiceKind(output, output === sfxBus ? 'sfx' : 'music'), output);
    osc.start(start); vibrato.start(start);
    osc.stop(start + dur + 0.03); vibrato.stop(start + dur + 0.03);
    noise({ abs: start, dur: Math.min(dur, 0.92), vol: vol * 0.16,
      filterType: 'bandpass', filter: 1750, q: 1.4, dest: output, kind: 'music' });
  }

  function frameDrum(type, at, volume, dest) {
    const output = dest || musicBus;
    const vol = volume === undefined ? 0.06 : volume;
    if (type === 'dum') {
      tone({ f: 126, f2: 64, dur: 0.23, type: 'sine', vol,
        attack: 0.002, sustain: 0.28, filter: 520, abs: at, dest: output, kind: 'music' });
      noise({ dur: 0.12, vol: vol * 0.32, filter: 520, brown: true,
        abs: at, dest: output, kind: 'music' });
    } else {
      tone({ f: 410, f2: 235, dur: 0.085, type: 'triangle', vol: vol * 0.48,
        attack: 0.002, sustain: 0.2, filter: 1800, abs: at, dest: output, kind: 'music' });
      noise({ dur: 0.065, vol: vol * 0.3, filterType: 'bandpass', filter: 2300,
        q: 1.2, abs: at, dest: output, kind: 'music' });
    }
  }

  function bronzeGong(midi, at, volume, dest) {
    const output = dest || musicBus;
    const partials = [1, 1.39, 1.83, 2.74];
    const weights = [1, 0.5, 0.32, 0.18];
    partials.forEach((partial, index) => {
      tone({ f: mtof(midi) * partial, dur: 2.4 - index * 0.18, type: 'sine',
        vol: (volume || 0.035) * weights[index], attack: 0.008, sustain: 0.18,
        filter: 3100, abs: at, dest: output, kind: output === sfxBus ? 'sfx' : 'music' });
    });
  }

  function drone(midi, at, duration, volume, dest) {
    const output = dest || musicBus;
    const dur = Math.max(0.5, duration);
    tone({ f: mtof(midi), dur, type: 'sine', vol: volume,
      attack: 0.32, sustain: 0.78, body: 0.76, filter: 520,
      abs: at, dest: output, kind: 'music' });
    tone({ f: mtof(midi + 7), dur, type: 'triangle', vol: volume * 0.36,
      attack: 0.4, sustain: 0.76, body: 0.68, filter: 720,
      abs: at, dest: output, kind: 'music' });
  }

  function duckMusic(depth, duration) {
    if (!ctx || !musicBus || !musicWanted) return;
    const now = ctx.currentTime;
    const target = musicGainTarget();
    musicBus.gain.cancelScheduledValues(now);
    musicBus.gain.setTargetAtTime(Math.max(0.0001, target * depth), now, 0.025);
    musicBus.gain.setTargetAtTime(target, now + duration * 0.45, Math.max(0.04, duration * 0.25));
  }

  // ---- 효과음 -------------------------------------------------------------
  S.jump = function () {
    tone({ f: 310, f2: 690, dur: 0.17, type: 'triangle', vol: 0.16, filter: 3100, filter2: 5200 });
    tone({ f: 155, f2: 260, dur: 0.12, type: 'sine', vol: 0.075 });
  };
  S.land = function (strength) {
    const k = strength || 1;
    tone({ f: 145, f2: 82, dur: 0.1, type: 'sine', vol: 0.15 * k, filter: 900 });
    noise({ dur: 0.075, vol: 0.05 * k, filter: 820, brown: true });
  };
  S.step = function () { noise({ dur: 0.035, vol: 0.02, filter: 1050, brown: true }); };

  const PICKUP_PAIRS = {
    cave: [[76,83], [80,86], [83,89], [88,95]],
    dorian: [[74,81], [77,84], [81,88], [86,93]],
    circe: [[72,79], [76,83], [78,84], [83,90]]
  };

  function pickupPair(combo) {
    let family = 'dorian';
    if (musicMode === 'cave' || musicMode === 'storyCave') family = 'cave';
    else if (musicMode === 'storyCirce' || musicMode === 'circe' || musicMode === 'rewardCirce') family = 'circe';
    return PICKUP_PAIRS[family][Math.min(3, Math.max(0, combo || 0))];
  }

  S.pickup = function (combo) {
    if (muted || !ensure()) return;
    const pair = pickupPair(combo);
    const now = ctx.currentTime;
    lyre(pair[0], now, 0.13, sfxBus, 'sfx');
    lyre(pair[1], now + 0.055, 0.09, sfxBus, 'sfx');
  };
  S.hit = function () {
    duckMusic(0.58, 0.3);
    noise({ dur: 0.14, vol: 0.16, filter: 620, brown: true });
    tone({ f: 235, f2: 76, dur: 0.22, type: 'triangle', vol: 0.17, filter: 1400, filter2: 420 });
  };
  S.thud = function () {
    duckMusic(0.68, 0.25);
    tone({ f: 92, f2: 48, dur: 0.22, type: 'sine', vol: 0.21, filter: 500 });
    noise({ dur: 0.12, vol: 0.1, filter: 410, brown: true });
  };
  S.warning = function (step) {
    const notes = [69, 74, 81]; lyre(notes[Math.min(2, step || 0)], undefined, 0.09, sfxBus, 'sfx');
  };
  S.whoosh = function () { noise({ dur: 0.18, vol: 0.06, filterType: 'bandpass', filter: 1800, q: 0.9 }); };
  S.nearMiss = function () { tone({ f: 690, f2: 970, dur: 0.11, type: 'sine', vol: 0.065, filter: 4200 }); };
  S.click = function () { tone({ f: 530, f2: 760, dur: 0.07, type: 'sine', vol: 0.09, filter: 5000 }); };
  S.page = function () {

    // 잠금이 풀리는 즉시 들리며 다음 그림책 음악으로 자연스럽게 이어진다.

    tone({ f: mtof(55), f2: mtof(52), dur: 0.11, type: 'sine', vol: 0.065,

  // ---- 장면별 오리지널 악보 ---------------------------------------------
  // 공통 귀향 동기 D-F-A-G-E-D를 각 선법과 박자에 맞게 새로 변주한다.
  function sparse(length, entries) {
    const result = new Array(length).fill(0);
    Object.keys(entries).forEach(key => { result[Number(key)] = entries[key]; });
    return result;
  }

  const TRACKS = {
    title: {

    },
    storyCave: {

    },
    cave: {
      name: '거인의 잠든 동굴', tempo: 104, meter: 7, root: 40,
      scale: [62,64,65,68,69,71,72,74], defaultIntensity: 0.28,
      drums: ['dum',0,0,'tek',0,'tek',0], bassRoots: [40,40,45,40,47,45,40,40],
      melody: [
        64,0,65,68,0,65,0, 64,0,71,69,68,65,0,
        64,65,68,69,0,68,65, 64,0,62,64,65,0,0,
        71,0,72,74,72,69,0, 68,69,71,0,68,65,0,
        64,65,68,71,69,68,65, 64,0,62,64,0,0,0
      ],

    },
    storySea: {

      defaultIntensity: 0.21, aulosMin: 0.19, drums: null, bassRoots: [38,43,45,38],
      melody: [62,0,65,0,69,0, 67,0,65,64,62,0, 69,0,71,0,67,0, 65,0,64,0,62,0],

      drums: ['dum',0,0,'tek',0,'tek'], bassRoots: [38,45,43,45,38,41,43,38],
      melody: [

      aulosMin: 0.42, drums: ['dum',0,'tek',0,'tek'], bassRoots: [36,43,42,36,45,40,43,36],

      melody: [62,65,69, 74,72,69, 67,69,65, 62,0,0, 65,69,72, 71,67,65, 64,65,62, 57,0,0],
      aulos: sparse(24, { 3: 74, 12: 72, 18: 67 })
    },
    rewardCirce: {

      scale: [60,62,64,66,67,69,71,72,74,76,78,79], defaultIntensity: 0.38,
      aulosMin: 0.31, drums: ['dum',0,'tek'], bassRoots: [36,43,45,42,40,45,43,36],
      melody: [

      melody: [62,65,0,69,67,0, 64,0,62,0,57,0, 60,62,65,0,64,0, 67,65,64,0,62,0],

  function currentTrack() { return TRACKS[musicMode] || TRACKS.title; }
  function stepDuration() { return 60 / currentTrack().tempo / 2; }
  function effectiveIntensity() { return musicState === 'rescue' ? Math.min(0.16, musicIntensity) : musicIntensity; }
  function musicGainTarget() {
    return musicState === 'rescue' ? 0.115 : 0.16 + effectiveIntensity() * 0.11;
  }

  function fadeParam(param, target, seconds) {
    if (!ctx || ctx.state === 'closed' || !param) return;
    const now = ctx.currentTime;
    param.cancelScheduledValues(now);
    param.setTargetAtTime(Math.max(0.0001, target), now, Math.max(0.025, seconds / 3));
  }

  function scheduleMusic() {
    if (!musicWanted || muted || !ctx || ctx.state !== 'running') return;
    const track = currentTrack();
    const step = stepDuration();
    if (nextNoteTime < ctx.currentTime - step * 2) {
      const missed = Math.floor((ctx.currentTime - nextNoteTime) / step);
      musicStep = (musicStep + missed) % track.melody.length;
      nextNoteTime = ctx.currentTime + 0.06;
    }

    let guard = 0;
    while (nextNoteTime < ctx.currentTime + 0.18 && guard++ < 10) {
      const local = musicStep % track.melody.length;
      const barPos = local % track.meter;
      const bar = Math.floor(local / track.meter);
      const intensity = effectiveIntensity();
      const bus = musicBus;
      const note = track.melody[local];
      const windNote = track.aulos[local];

      if (note && (musicState !== 'rescue' || barPos === 0 || barPos === track.meter - 1)) {
        lyre(note, nextNoteTime, 0.052 + intensity * 0.025, bus, 'music');
      }
      if (barPos === 0) {
        const bass = track.bassRoots[bar % track.bassRoots.length];
        drone(bass, nextNoteTime, step * track.meter * 1.04, 0.026 + intensity * 0.018, bus);
      }
      if (track.drums && musicState === 'play' && intensity >= 0.34 && track.drums[barPos]) {
        frameDrum(track.drums[barPos], nextNoteTime, 0.038 + intensity * 0.035, bus);
      }
      if (windNote && musicState === 'play' && intensity >= (track.aulosMin || 0.47)) {
        aulos(windNote, nextNoteTime, step * Math.max(2.2, track.meter - barPos - 0.4), 0.025 + intensity * 0.025, bus);
      }
      if (barPos === 0 && bar % 4 === 0 && musicState === 'play' && intensity >= 0.6) {
        bronzeGong(track.root, nextNoteTime, 0.023 + intensity * 0.014, bus);
      }

      nextNoteTime += step;
      musicStep = (musicStep + 1) % track.melody.length;
    }
  }

  function startScheduler() {
    if (!ctx || ctx.state !== 'running' || muted || !musicWanted || scheduler) return;
    if (nextNoteTime < ctx.currentTime) nextNoteTime = ctx.currentTime + 0.06;
    scheduler = setInterval(scheduleMusic, 40);
    scheduleMusic();
  }

  function stopScheduler() {
    if (!scheduler) return;
    clearInterval(scheduler);
    scheduler = null;
  }

  function requestContextResume() {
    if (!ctx || ctx.state === 'closed' || pauseWanted) return;
    const targetContext = ctx;
    const epoch = ++resumeEpoch;
    const afterResume = function () {
      if (ctx !== targetContext || epoch !== resumeEpoch) return;
      if (pauseWanted) {
        stopScheduler();
        if (targetContext.state === 'running') targetContext.suspend().catch(() => {});
        return;
      }
      if (!muted) startScheduler();
    };
    if (targetContext.state === 'running') {
      afterResume();
      return;
    }
    targetContext.resume().then(afterResume).catch(() => {});
  }

  function activateMusicBus(fadeSeconds) {
    if (!ctx || musicBuses.length < 2) return;
    const oldBus = musicBuses[activeMusicBus];
    activeMusicBus = 1 - activeMusicBus;
    // 두 전환 전의 긴 드론·공이 새 곡에 되살아나지 않게 재사용 버스를 비운다.
    busVoices[activeMusicBus].splice(0).forEach(source => {
      try { source.stop(ctx.currentTime + 0.012); } catch (_) {}
    });
    musicBus = musicBuses[activeMusicBus];
    fadeParam(oldBus.gain, 0.0001, fadeSeconds);
    musicBus.gain.cancelScheduledValues(ctx.currentTime);
    musicBus.gain.setValueAtTime(0.0001, ctx.currentTime);
    fadeParam(musicBus.gain, musicGainTarget(), fadeSeconds);
  }

  S.unlock = function () {
    userUnlocked = true;
    if (!ensure()) return;
    requestContextResume();
  };

  S.pause = function () {
    if (!ctx) return false;
    const wasActive = !pauseWanted && (userUnlocked || ctx.state === 'running');
    // 아직 한 번도 사용자 제스처로 열린 적 없는 suspended 컨텍스트는
    // 원래 무음이므로, 탭 전환만으로 수동 일시정지 상태를 만들지 않는다.
    if (!wasActive && !pauseWanted) {
      stopScheduler();
      return false;
    }
    pauseWanted = true;
    resumeEpoch++;
    stopScheduler();
    if (ctx && ctx.state === 'running') ctx.suspend().catch(() => {});
    return wasActive;
  };

  S.resume = function () {
    const hadContext = !!ctx;
    pauseWanted = false;
    resumeEpoch++;
    if (!hadContext || muted) return;
    if (ctx.state === 'closed') {
      resetClosedGraph();
      if (!ensure()) return;
    }
    requestContextResume();
  };

  S.startBgm = function (mode, options) {
    const nextMode = TRACKS[mode] ? mode : 'title';
    const opts = typeof options === 'number' ? { intensity: options } : (options || {});
    const sameTrack = musicWanted && musicMode === nextMode;
    musicMode = nextMode;
    musicState = 'play';
    musicWanted = true;
    musicIntensity = clamp(opts.intensity === undefined ? TRACKS[nextMode].defaultIntensity : opts.intensity, 0, 1);
    const fade = clamp(opts.fade === undefined ? 0.72 : opts.fade, 0.08, 2);
    if (!ensure()) return;
    if (sameTrack) {
      fadeParam(musicBus.gain, musicGainTarget(), fade);
    } else {
      musicStep = 0;
      nextNoteTime = ctx.currentTime + 0.07;
      activateMusicBus(fade);
    }
    startScheduler();
  };

  S.setMusicIntensity = function (value, fadeSeconds) {
    musicIntensity = clamp(Number(value) || 0, 0, 1);
    if (ctx && musicBus) fadeParam(musicBus.gain, musicGainTarget(), fadeSeconds || 0.75);
  };

  S.setMusicState = function (state) {
    musicState = state === 'rescue' ? 'rescue' : 'play';
    if (ctx && musicBus) fadeParam(musicBus.gain, musicGainTarget(), musicState === 'rescue' ? 0.3 : 0.85);
  };

  S.stopBgm = function () {
    musicWanted = false;
    stopScheduler();
    if (ctx) musicBuses.forEach(bus => fadeParam(bus.gain, 0.0001, 0.42));
  };

  S.muted = function () { return muted; };
  S.toggleMute = function () {
    muted = !muted;
    try { localStorage.setItem('ody_muted', muted ? '1' : '0'); } catch (_) {}
    if (ensure()) {
      fadeParam(master.gain, muted ? 0.0001 : 0.7, 0.09);
      if (muted) stopScheduler();
      else if (ctx.state === 'running' && !pauseWanted) startScheduler();
    }
    return muted;
  };

  S.debug = function () {
    const tracks = {};
    Object.keys(TRACKS).forEach(key => {
      const track = TRACKS[key];
      tracks[key] = {
        name: track.name, tempo: track.tempo, meter: track.meter,
        length: track.melody.length, aulosLength: track.aulos.length,
        bars: track.melody.length / track.meter,
        scale: track.scale.slice(), bassBars: track.bassRoots.length,
        inScale: track.melody.every(note => !note || track.scale.some(scaleNote => scaleNote % 12 === note % 12))
      };
    });
    return {
      wanted: musicWanted, mode: musicMode, state: musicState,
      intensity: musicIntensity, muted, schedulerCount: scheduler ? 1 : 0,
      contextState: ctx ? ctx.state : 'none', pausedIntent: pauseWanted,
      musicGain: musicBus ? musicBus.gain.value : 0,
      voices: { music: voices.music.length, sfx: voices.sfx.length },
      caps: { music: VOICE_CAP.music, sfx: VOICE_CAP.sfx },
      noiseKinds: ['white', 'brown'],
      noiseReady: { white: !!noiseBuffers.white, brown: !!noiseBuffers.brown },
      noiseSeparated: !noiseBuffers.white || !noiseBuffers.brown || noiseBuffers.white !== noiseBuffers.brown,
      pickupPairs: {
        cave: PICKUP_PAIRS.cave.map(pair => pair.slice()),
        dorian: PICKUP_PAIRS.dorian.map(pair => pair.slice()),
        circe: PICKUP_PAIRS.circe.map(pair => pair.slice())
      },
      tracks
    };
  };

  ODY.Snd = S;
})();

/* src/gamefeel.js */
// 오디세이아 — 반응과 손맛을 한곳에서 관리한다.
(function () {
  'use strict';
  window.ODY = window.ODY || {};
  const F = {};

  const TAU = Math.PI * 2;
  const reducedMotion = window.matchMedia &&
    window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  F.ease = {
    outQuad: t => 1 - (1 - t) * (1 - t),
    outCubic: t => 1 - Math.pow(1 - t, 3),
    outQuart: t => 1 - Math.pow(1 - t, 4),
    inQuad: t => t * t,
    inCubic: t => t * t * t,
    inOutSine: t => -(Math.cos(Math.PI * t) - 1) * 0.5,
    outBack(t) {
      const c = 1.70158;
      return 1 + (c + 1) * Math.pow(t - 1, 3) + c * Math.pow(t - 1, 2);
    },
    outElastic(t) {
      if (t <= 0 || t >= 1) return t;
      return Math.pow(2, -10 * t) * Math.sin((t * 10 - 0.75) * TAU / 3) + 1;
    },
    outBounce(t) {
      const n = 7.5625, d = 2.75;
      if (t < 1 / d) return n * t * t;
      if (t < 2 / d) { t -= 1.5 / d; return n * t * t + 0.75; }
      if (t < 2.5 / d) { t -= 2.25 / d; return n * t * t + 0.9375; }
      t -= 2.625 / d;
      return n * t * t + 0.984375;
    }
  };

  F.clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  F.clamp01 = v => F.clamp(v, 0, 1);
  F.lerp = (a, b, t) => a + (b - a) * t;
  F.damp = (a, b, lambda, dt) => F.lerp(a, b, 1 - Math.exp(-lambda * dt));

  // ---- 시간·카메라 충격 --------------------------------------------------
  F.hitstop = 0;
  F.timescale = 1;
  let slow = null;
  let trauma = 0;
  let shakeDirX = 0;
  let shakeDirY = 0;
  let shakeClock = 0;
  let flash = 0;

    flash = Math.max(flash, amount === undefined ? 0.22 : amount);

    const waveA = Math.sin(shakeClock * 47);
    const waveB = Math.sin(shakeClock * 71 + 1.9);

        vy: -28 - Math.random() * 58,
        g: 95,
        drag: 1.5,
        life: 0.34 + Math.random() * 0.22,
        size: 5 + Math.random() * 7,

  };

    F.spawn({
      x, y, color: color || '#fff', size: size || 12,
      endSize: 3.5, life: life || 0.34, shape: 'ring',

    });
  };

    for (let i = 0; i < count; i++) {
      const a = i / count * TAU + Math.random() * 0.15;
      const speed = 85 + Math.random() * 150;
      F.spawn({
        x, y,
        vx: Math.cos(a) * speed,
        vy: Math.sin(a) * speed - 35,
        g: 180,
        drag: 2.3,
        life: 0.42 + Math.random() * 0.32,
        size: 3 + Math.random() * 4.5,
        endSize: 0.12,

  };

    for (let i = 0; i < count; i++) {
      const a = -Math.PI * (0.08 + Math.random() * 0.84);
      const speed = 120 + Math.random() * 230;
      F.spawn({
        x, y,
        vx: Math.cos(a) * speed + (direction || 0) * 70,
        vy: Math.sin(a) * speed,
        g: 850,
        drag: 0.7,
        life: 0.45 + Math.random() * 0.3,
        size: 4 + Math.random() * 6,

        x, y,
        vx: Math.cos(a) * speed,
        vy: Math.sin(a) * speed,
        g: 490,
        drag: 0.75,
        life: 1.05 + Math.random() * 0.85,
        size: 5 + Math.random() * 6,

  F.pop = function (x, y, text, color, size) {

      x, y, text,
      color: color || '#fff',
      size: size || 24,

  F.update = function (dt, dtReal) {

    trauma = Math.max(0, trauma - dtReal * 2.6);

      slow.age += dtReal;
      if (slow.age <= slow.hold) {

      } else {
        const p = F.clamp01((slow.age - slow.hold) / slow.recover);
        F.timescale = F.lerp(slow.scale, 1, F.ease.outCubic(p));

      p.age += dt;

        p.vx *= drag;
        p.vy *= drag;
      }
      p.x += p.vx * dt;
      p.y += p.vy * dt;
      p.rot += p.vrot * dt;

    for (let i = pops.length - 1; i >= 0; i--) {
      pops[i].age += dt;
      if (pops[i].age >= pops[i].life) pops.splice(i, 1);
    }
  };

  function starPath(ctx, outer, inner, points) {
    ctx.beginPath();
    for (let i = 0; i < points * 2; i++) {
      const r = i % 2 ? inner : outer;
      const a = -Math.PI * 0.5 + i * Math.PI / points;
      if (i === 0) ctx.moveTo(Math.cos(a) * r, Math.sin(a) * r);
      else ctx.lineTo(Math.cos(a) * r, Math.sin(a) * r);
    }
    ctx.closePath();
  }

  F.drawParticles = function (ctx, layer) {
    layer = layer || 0;
    for (const p of particles) {
      if ((p.layer || 0) !== layer) continue;
      const n = F.clamp01(p.age / p.life);
      const fade = Math.min(1, (1 - n) * 2.4) * p.alpha;
      const scale = F.lerp(1, p.endSize, F.ease.outQuad(n));
      const s = p.size * scale;
      ctx.save();
      ctx.globalAlpha = fade;
      ctx.translate(p.x, p.y);
      ctx.rotate(p.rot);
      ctx.fillStyle = p.color2 && n < 0.25 ? p.color2 : p.color;
      ctx.strokeStyle = p.color;

      if (p.shape === 'puff') {
        ctx.beginPath();
        ctx.arc(-s * 0.35, 0, s * 0.7, 0, TAU);
        ctx.arc(s * 0.35, -s * 0.12, s * 0.62, 0, TAU);
        ctx.arc(0, -s * 0.38, s * 0.58, 0, TAU);
        ctx.fill();
      } else if (p.shape === 'ring') {
        ctx.globalAlpha = fade * 0.8;
        ctx.lineWidth = Math.max(1.5, 3.5 * (1 - n));
        ctx.beginPath();
        ctx.arc(0, 0, s, 0, TAU);
        ctx.stroke();
      } else if (p.shape === 'star') {
        starPath(ctx, s * 1.5, s * 0.52, 4);
        ctx.fill();
      } else if (p.shape === 'diamond') {
        ctx.beginPath();
        ctx.moveTo(0, -s * 1.6);
        ctx.lineTo(s * 0.55, 0);
        ctx.lineTo(0, s * 1.6);
        ctx.lineTo(-s * 0.55, 0);
        ctx.closePath();
        ctx.fill();
      } else if (p.shape === 'shard') {
        ctx.beginPath();
        ctx.moveTo(-s, s * 0.6);
        ctx.lineTo(-s * 0.25, -s);
        ctx.lineTo(s, -s * 0.15);
        ctx.lineTo(s * 0.35, s);
        ctx.closePath();
        ctx.fill();
      } else if (p.shape === 'confetti') {
        ctx.fillRect(-s, -s * 0.42, s * 2, s * 0.84);
      } else if (p.shape === 'streak') {
        ctx.fillRect(-s * 8, -s * 0.5, s * 8, s);
      } else {
        ctx.beginPath();
        ctx.arc(0, 0, s, 0, TAU);
        ctx.fill();
      }
      ctx.restore();
    }

    if (layer !== 0) return;
    for (const p of pops) {
      const n = F.clamp01(p.age / p.life);
      const rise = F.ease.outCubic(n) * 52;
      const pop = 0.78 + Math.sin(Math.min(1, n * 3) * Math.PI) * 0.25;
      ctx.save();
      ctx.translate(p.x, p.y - rise);
      ctx.scale(pop, pop);
      ctx.globalAlpha = 1 - F.ease.inQuad(n);
      ctx.font = '900 ' + p.size + 'px "Malgun Gothic", sans-serif';
      ctx.textAlign = 'center';
      ctx.lineWidth = 5;
      ctx.strokeStyle = 'rgba(44,30,67,0.72)';
      ctx.strokeText(p.text, 0, 0);
      ctx.fillStyle = p.color;
      ctx.fillText(p.text, 0, 0);
      ctx.restore();
    }
  };

  F.onSceneChange = function () {
    particles.length = 0;
    pops.length = 0;
    F.hitstop = 0;
    F.timescale = 1;
    slow = null;
    trauma = 0;
    flash = 0;
  };

  ODY.Feel = F;
})();

// 오디세이아 — 작은 캔버스 게임 엔진
// 고정 논리 해상도, 델타타임, 장면 수명주기, 키보드·터치 입력을 맡는다.
(function () {

    if (blocked === E.viewportBlocked) return;
    E.viewportBlocked = blocked;

    } else if (!document.hidden && (resumeAudioAfterViewport || resumeAudioAfterHidden) && ODY.Snd.resume) {
      // 이미 사용자가 소리를 시작한 적이 있을 때만 음악을 되살린다.

    cssH = Math.max(1, window.innerHeight);

    dpr = Math.min(2, window.devicePixelRatio || 1);

    canvas.height = Math.round(cssH * dpr);
    canvas.style.width = cssW + 'px';
    canvas.style.height = cssH + 'px';
    scale = Math.min(cssW / W, cssH / H);
    offX = (cssW - W * scale) * 0.5;
    offY = (cssH - H * scale) * 0.5;
    E.viewport = { cssW, cssH, dpr, scale, offX, offY };

    ArrowDown: ['down'], KeyS: ['down'],

    E.shake = shake;
    ctx.setTransform(
      scale * dpr, 0, 0, scale * dpr,
      offX * dpr,
      offY * dpr
    );
    ctx.imageSmoothingEnabled = true;
    ctx.save();
    ctx.beginPath();
    ctx.rect(-16, -16, W + 32, H + 32);
    ctx.clip();
    if (E.scene && E.scene.draw) E.scene.draw(ctx);
    F.drawFlash(ctx, W, H);
    ctx.restore();
  }

  ODY.E = E;
})();

</script>
  <script>
/* src/ui.js */
// 오디세이아 — 큰 글씨, 큰 버튼, 그림책처럼 따뜻한 공용 화면
(function () {
  'use strict';
  window.ODY = window.ODY || {};
  const UI = {};
  const TAU = Math.PI * 2;
  const INK = '#342442';
  const PAPER = '#fff8e8';
  const GOLD = '#f4bd4f';
  let announceFlip = false;

  UI.announce = function (text) {
    if (typeof document === 'undefined') return;
    const live = document.getElementById('game-status');
    if (!live) return;
    announceFlip = !announceFlip;
    live.textContent = String(text || '') + (announceFlip ? '\u200b' : '');
  };

  UI.rr = function (ctx, x, y, w, h, r) {
    r = Math.min(r, w * 0.5, h * 0.5);
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  };

  UI.panel = function (ctx, x, y, w, h, r, color) {
    ctx.save();
    ctx.fillStyle = 'rgba(31,20,49,0.23)';
    UI.rr(ctx, x + 5, y + 8, w, h, r);
    ctx.fill();
    ctx.fillStyle = color || PAPER;
    UI.rr(ctx, x, y, w, h, r);
    ctx.fill();
    ctx.strokeStyle = 'rgba(89,58,86,0.26)';
    ctx.lineWidth = 2;
    UI.rr(ctx, x + 2, y + 2, w - 4, h - 4, Math.max(2, r - 2));
    ctx.stroke();
    ctx.restore();
  };

  UI.drawGreekBand = function (ctx, x, y, w, color, alpha) {
    ctx.save();
    ctx.globalAlpha = alpha === undefined ? 0.45 : alpha;
    ctx.strokeStyle = color || GOLD;
    ctx.lineWidth = 3;
    ctx.lineJoin = 'miter';
    const size = 18;
    for (let px = x; px < x + w; px += size * 2) {
      ctx.beginPath();
      ctx.moveTo(px, y);
      ctx.lineTo(px + size, y);
      ctx.lineTo(px + size, y + size * 0.55);
      ctx.lineTo(px + size * 0.45, y + size * 0.55);
      ctx.lineTo(px + size * 0.45, y + size * 0.2);
      ctx.lineTo(px + size * 0.8, y + size * 0.2);
      ctx.stroke();
    }
    ctx.restore();
  };

  // ---- 큰 버튼 ------------------------------------------------------------
  UI.Button = class {
    constructor(options) {
      Object.assign(this, {
        x: 0, y: 0, w: 240, h: 70,
        label: '', size: 27, color: '#ffad61',
        ink: INK, onTap: null
      }, options);
      this.sq = ODY.Feel.makeSquash();
      this.pressed = false;
      this.hovered = false;
      this.glow = 0;
    }

    contains(x, y) {
      return x >= this.x - this.w * 0.5 && x <= this.x + this.w * 0.5 &&
        y >= this.y - this.h * 0.5 && y <= this.y + this.h * 0.5;
    }

    activate() {
      ODY.Feel.squash(this.sq, 1.13, 1.1);
      ODY.Feel.ring(this.x, this.y, '#fff2b1', 18, 0.26);
      ODY.Snd.click();
      if (this.onTap) this.onTap();
    }

    pointer(type, x, y) {
      if (type === 'move') {
        this.hovered = this.contains(x, y);
        return false;
      }
      if (type === 'down' && this.contains(x, y)) {
        this.pressed = true;
        ODY.Feel.squash(this.sq, 0.94, 0.89);
        return true;
      }
      if ((type === 'up' || type === 'cancel') && this.pressed) {
        const inside = this.contains(x, y);
        this.pressed = false;
        if (inside && type === 'up') {
          this.activate();
          return true;
        }
      }
      return false;
    }

    update(dt) {
      ODY.Feel.updSquash(this.sq, dt);
      this.glow = ODY.Feel.damp(this.glow, this.hovered ? 1 : 0, 12, dt);
    }

    draw(ctx, focus) {
      const pulse = 1 + Math.sin(ODY.E.time * 3.2) * 0.012 * (focus ? 1 : 0);
      ctx.save();
      ctx.translate(this.x, this.y);
      ctx.scale(this.sq.sx * pulse, this.sq.sy * pulse);

      if (focus || this.glow > 0.02) {
        ctx.globalAlpha = 0.3 + this.glow * 0.2;
        ctx.fillStyle = '#fff2ac';
        UI.rr(ctx, -this.w * 0.5 - 8, -this.h * 0.5 - 8, this.w + 16, this.h + 16, this.h * 0.5);
        ctx.fill();
        ctx.globalAlpha = 1;
      }

      ctx.fillStyle = 'rgba(39,25,55,0.32)';
      UI.rr(ctx, -this.w * 0.5, -this.h * 0.5 + 8, this.w, this.h, this.h * 0.43);
      ctx.fill();

      const grad = ctx.createLinearGradient(0, -this.h * 0.5, 0, this.h * 0.5);
      grad.addColorStop(0, '#fff0ad');
      grad.addColorStop(0.12, this.color);
      grad.addColorStop(1, this.color);
      ctx.fillStyle = grad;
      UI.rr(ctx, -this.w * 0.5, -this.h * 0.5, this.w, this.h, this.h * 0.43);
      ctx.fill();
      ctx.strokeStyle = INK;
      ctx.lineWidth = 3.5;
      UI.rr(ctx, -this.w * 0.5, -this.h * 0.5, this.w, this.h, this.h * 0.43);
      ctx.stroke();

      ctx.globalAlpha = 0.38;
      ctx.fillStyle = '#fff';
      UI.rr(ctx, -this.w * 0.5 + 12, -this.h * 0.5 + 8, this.w - 24, 12, 7);
      ctx.fill();
      ctx.globalAlpha = 1;

      ctx.fillStyle = this.ink;
      ctx.font = '900 ' + this.size + 'px "Malgun Gothic", sans-serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText(this.label, 0, 1);
      ctx.restore();
      ctx.textBaseline = 'alphabetic';
    }
  };

  // ---- 공용 아이콘 --------------------------------------------------------
  UI.drawStar = function (ctx, x, y, r, rotation, color) {
    ctx.save();
    ctx.translate(x, y);
    ctx.rotate(rotation || 0);
    ctx.beginPath();
    for (let i = 0; i < 10; i++) {
      const rr = i % 2 ? r * 0.46 : r;
      const a = -Math.PI * 0.5 + i * Math.PI / 5;
      if (i === 0) ctx.moveTo(Math.cos(a) * rr, Math.sin(a) * rr);
      else ctx.lineTo(Math.cos(a) * rr, Math.sin(a) * rr);
    }
    ctx.closePath();
    ctx.fillStyle = color || '#ffd85c';
    ctx.fill();
    ctx.strokeStyle = '#8d5b35';
    ctx.lineWidth = Math.max(1.5, r * 0.09);
    ctx.stroke();
    ctx.globalAlpha = 0.72;
    ctx.fillStyle = '#fff7bd';
    ctx.beginPath();
    ctx.arc(-r * 0.22, -r * 0.27, r * 0.13, 0, TAU);
    ctx.fill();
    ctx.restore();
  };

  UI.drawHeart = function (ctx, x, y, size, filled) {
    ctx.save();
    ctx.translate(x, y);
    ctx.beginPath();
    ctx.moveTo(0, size * 0.45);
    ctx.bezierCurveTo(-size * 1.08, -size * 0.25, -size * 0.58, -size, 0, -size * 0.38);
    ctx.bezierCurveTo(size * 0.58, -size, size * 1.08, -size * 0.25, 0, size * 0.45);
    ctx.closePath();
    ctx.fillStyle = filled ? '#ff718d' : 'rgba(255,255,255,0.17)';
    ctx.fill();
    ctx.strokeStyle = filled ? '#7b385d' : 'rgba(255,255,255,0.55)';
    ctx.lineWidth = 2.2;
    ctx.stroke();
    if (filled) {
      ctx.fillStyle = 'rgba(255,255,255,0.65)';
      ctx.beginPath();
      ctx.arc(-size * 0.34, -size * 0.32, size * 0.16, 0, TAU);
      ctx.fill();
    }
    ctx.restore();
  };

  UI.drawHearts = function (ctx, x, y, current, max) {
    ctx.save();
    ctx.fillStyle = 'rgba(28,18,49,0.56)';
    UI.rr(ctx, x - 22, y - 25, max * 35 + 28, 47, 23);
    ctx.fill();
    for (let i = 0; i < max; i++) {
      UI.drawHeart(ctx, x + i * 35, y, 13.5, i < current);
    }
    ctx.restore();
  };

  UI.drawProgress = function (ctx, x, y, width, value) {
    value = ODY.Feel.clamp01(value);
    ctx.save();
    ctx.fillStyle = 'rgba(28,18,49,0.58)';
    UI.rr(ctx, x - 10, y - 10, width + 20, 30, 15);
    ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,0.18)';
    UI.rr(ctx, x, y, width, 10, 5);
    ctx.fill();
    if (value > 0.01) {
      const grad = ctx.createLinearGradient(x, y, x + width, y);
      grad.addColorStop(0, '#77d9be');
      grad.addColorStop(1, '#ffd85c');
      ctx.fillStyle = grad;
      UI.rr(ctx, x, y, Math.max(10, width * value), 10, 5);
      ctx.fill();
    }
    UI.drawStar(ctx, x + width * value, y + 5, 9, ODY.E.time * 1.7, '#fff0a0');
    // 이타카의 작은 집
    ctx.translate(x + width + 13, y + 3);
    ctx.fillStyle = '#fff3c9';
    ctx.beginPath();
    ctx.moveTo(-8, 1); ctx.lineTo(0, -8); ctx.lineTo(8, 1); ctx.closePath();
    ctx.fill();
    ctx.fillRect(-6, 1, 12, 9);
    ctx.restore();
  };

  UI.makeMuteBtn = function () {
    const button = {
      x: ODY.E.W - 42, y: 40, r: 27,
      sq: ODY.Feel.makeSquash(),
      pressed: false,
      toggle() {
        const muted = ODY.Snd.toggleMute();
        ODY.Feel.squash(this.sq, 1.16, 1.16);
        UI.announce(muted ? '소리를 껐어요.' : '소리를 켰어요.');
      },
      pointer(type, x, y) {
        const inside = (x - this.x) ** 2 + (y - this.y) ** 2 <= (this.r + 10) ** 2;
        if (type === 'down' && inside) {
          this.pressed = true;
          ODY.Feel.squash(this.sq, 0.88, 0.88);
          this.toggle();
          return true;
        }
        if (type === 'up' || type === 'cancel') this.pressed = false;
        return false;
      },
      update(dt) { ODY.Feel.updSquash(this.sq, dt); },
      draw(ctx) {
        ctx.save();
        ctx.translate(this.x, this.y);
        ctx.scale(this.sq.sx, this.sq.sy);
        ctx.fillStyle = 'rgba(28,18,49,0.64)';
        ctx.beginPath();
        ctx.arc(0, 0, this.r, 0, TAU);
        ctx.fill();
        ctx.strokeStyle = 'rgba(255,255,255,0.42)';
        ctx.lineWidth = 2;
        ctx.stroke();
        ctx.fillStyle = '#fff6dc';
        ctx.beginPath();
        ctx.moveTo(-12, -6); ctx.lineTo(-5, -6); ctx.lineTo(4, -14);
        ctx.lineTo(4, 14); ctx.lineTo(-5, 6); ctx.lineTo(-12, 6);
        ctx.closePath();
        ctx.fill();
        ctx.strokeStyle = '#fff6dc';
        ctx.lineWidth = 3;
        ctx.lineCap = 'round';
        if (ODY.Snd.muted()) {
          ctx.beginPath(); ctx.moveTo(9, -8); ctx.lineTo(20, 8); ctx.stroke();
          ctx.beginPath(); ctx.moveTo(20, -8); ctx.lineTo(9, 8); ctx.stroke();
        } else {
          ctx.beginPath(); ctx.arc(5, 0, 9, -0.8, 0.8); ctx.stroke();
          ctx.beginPath(); ctx.arc(5, 0, 15, -0.7, 0.7); ctx.stroke();
        }
        ctx.restore();
      }
    };
    return button;
  };

  UI.handleMuteKey = function (muteButton) {
    if (ODY.E.input.buffered('mute', 0.16)) {
      ODY.E.input.consume('mute');
      muteButton.toggle();
      return true;
    }
    return false;
  };

  // ---- 그림책용 캐릭터 조각 ----------------------------------------------
  UI.drawOwl = function (ctx, x, y, scale, time, lookRight) {
    ctx.save();
    ctx.translate(x, y);
    ctx.scale((lookRight === false ? -1 : 1) * scale, scale);
    const flap = Math.sin((time || 0) * 7) * 0.18;
    ctx.fillStyle = '#b8c9ee';
    ctx.strokeStyle = INK;
    ctx.lineWidth = 3;
    ctx.save();
    ctx.rotate(-0.42 + flap);
    ctx.beginPath(); ctx.ellipse(-25, 2, 27, 12, -0.3, 0, TAU); ctx.fill(); ctx.stroke();
    ctx.restore();
    ctx.save();
    ctx.rotate(0.42 - flap);
    ctx.beginPath(); ctx.ellipse(25, 2, 27, 12, 0.3, 0, TAU); ctx.fill(); ctx.stroke();
    ctx.restore();
    const body = ctx.createLinearGradient(0, -30, 0, 28);
    body.addColorStop(0, '#f8f1de');
    body.addColorStop(1, '#d8c7ef');
    ctx.fillStyle = body;
    ctx.beginPath(); ctx.ellipse(0, 0, 27, 32, 0, 0, TAU); ctx.fill(); ctx.stroke();
    ctx.fillStyle = '#6e78ae';
    ctx.beginPath();
    ctx.moveTo(-20, -23); ctx.lineTo(-8, -38); ctx.lineTo(-3, -22);
    ctx.moveTo(20, -23); ctx.lineTo(8, -38); ctx.lineTo(3, -22);
    ctx.fill();
    ctx.fillStyle = '#fff';
    ctx.beginPath(); ctx.arc(-9, -7, 10, 0, TAU); ctx.arc(9, -7, 10, 0, TAU); ctx.fill();
    ctx.fillStyle = INK;
    ctx.beginPath(); ctx.arc(-7, -6, 4, 0, TAU); ctx.arc(11, -6, 4, 0, TAU); ctx.fill();
    ctx.fillStyle = GOLD;
    ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(7, 7); ctx.lineTo(-2, 8); ctx.closePath(); ctx.fill();
    ctx.fillStyle = '#fff0be';
    ctx.beginPath(); ctx.ellipse(0, 13, 15, 13, 0, 0, TAU); ctx.fill();
    ctx.restore();
  };

  UI.drawShip = function (ctx, x, y, scale, time) {
    ctx.save();
    ctx.translate(x, y);
    ctx.scale(scale, scale);
    ctx.rotate(Math.sin((time || 0) * 1.8) * 0.025);
    // 물결과 뱃머리 물보라
    ctx.strokeStyle = 'rgba(255,255,255,0.68)';
    ctx.lineWidth = 4;
    ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(-96, 25); ctx.quadraticCurveTo(-46, 15, 2, 25);
    ctx.moveTo(30, 26); ctx.quadraticCurveTo(80, 15, 116, 25);
    ctx.stroke();
    // 선체
    const hull = ctx.createLinearGradient(0, 2, 0, 42);
    hull.addColorStop(0, '#c57a43');
    hull.addColorStop(1, '#76462f');
    ctx.fillStyle = hull;
    ctx.strokeStyle = INK;
    ctx.lineWidth = 4;
    ctx.beginPath();
    ctx.moveTo(-95, 0); ctx.quadraticCurveTo(-65, 39, -12, 42);
    ctx.quadraticCurveTo(55, 43, 96, -1);
    ctx.quadraticCurveTo(48, 11, -95, 0);
    ctx.closePath();
    ctx.fill(); ctx.stroke();
    // 방패
    for (let i = -2; i <= 2; i++) {
      ctx.fillStyle = i % 2 ? '#7cc9c1' : '#f4bd4f';
      ctx.beginPath(); ctx.arc(i * 28, 14, 10, 0, TAU); ctx.fill();
      ctx.strokeStyle = INK; ctx.lineWidth = 2; ctx.stroke();
      ctx.beginPath(); ctx.arc(i * 28, 14, 3, 0, TAU); ctx.stroke();
    }
    // 돛대와 돛
    ctx.fillStyle = '#64422f';
    ctx.fillRect(-2.5, -105, 5, 108);
    ctx.fillStyle = '#fff5d8';
    ctx.strokeStyle = INK;
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.moveTo(3, -99);
    ctx.quadraticCurveTo(83, -72, 8, -18);
    ctx.closePath();
    ctx.fill(); ctx.stroke();
    ctx.fillStyle = '#e96f72';
    ctx.beginPath();
    ctx.moveTo(11, -83); ctx.quadraticCurveTo(60, -67, 12, -48);
    ctx.lineTo(9, -36); ctx.quadraticCurveTo(55, -51, 10, -65);
    ctx.closePath(); ctx.fill();
    // 깃발
    ctx.fillStyle = '#e96f72';
    ctx.beginPath();
    ctx.moveTo(-1, -104); ctx.lineTo(-38, -96 + Math.sin((time || 0) * 6) * 3);
    ctx.lineTo(-2, -84); ctx.closePath(); ctx.fill();
    ctx.strokeStyle = INK; ctx.lineWidth = 2; ctx.stroke();
    ctx.restore();
  };

  UI.drawCyclopsPortrait = function (ctx, x, y, scale, time) {
    ctx.save();
    ctx.translate(x, y);
    ctx.scale(scale, scale);
    ctx.fillStyle = '#927cb5';
    ctx.strokeStyle = INK;
    ctx.lineWidth = 4;
    ctx.beginPath(); ctx.ellipse(0, 4, 56, 65, 0, 0, TAU); ctx.fill(); ctx.stroke();
    ctx.fillStyle = '#6f5a98';
    ctx.beginPath();
    ctx.moveTo(-42, -40); ctx.quadraticCurveTo(-22, -77, 0, -55);
    ctx.quadraticCurveTo(27, -77, 44, -37);
    ctx.quadraticCurveTo(0, -56, -42, -40);
    ctx.fill(); ctx.stroke();
    ctx.fillStyle = '#fff9dc';
    ctx.beginPath(); ctx.ellipse(5, -7, 24, 19, 0, 0, TAU); ctx.fill(); ctx.stroke();
    ctx.fillStyle = '#5da9b8';
    ctx.beginPath(); ctx.arc(8, -6, 9, 0, TAU); ctx.fill();
    ctx.fillStyle = INK;
    ctx.beginPath(); ctx.arc(10, -6, 4, 0, TAU); ctx.fill();
    ctx.fillStyle = 'rgba(255,126,142,0.35)';
    ctx.beginPath(); ctx.arc(-30, 18, 9, 0, TAU); ctx.arc(36, 18, 9, 0, TAU); ctx.fill();
    ctx.strokeStyle = INK; ctx.lineWidth = 4; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.arc(6, 23, 14, 0.12 * Math.PI, 0.88 * Math.PI); ctx.stroke();
    // 졸린 숨방울
    const b = ((time || 0) * 0.7) % 1;
    ctx.globalAlpha = (1 - b) * 0.55;
    ctx.fillStyle = '#d8efff';
    ctx.beginPath(); ctx.arc(43 + b * 12, -1 - b * 20, 4 + b * 7, 0, TAU); ctx.fill();
    ctx.restore();
  };

  UI.drawWindBag = function (ctx, x, y, scale, time, open) {
    ctx.save();
    ctx.translate(x, y + Math.sin((time || 0) * 2.1) * 3);
    ctx.scale(scale, scale);
    const puff = open ? 1 + Math.sin((time || 0) * 7) * 0.08 : 1;
    ctx.scale(puff, 2 - puff);
    ctx.fillStyle = 'rgba(52,36,66,0.18)';
    ctx.beginPath(); ctx.ellipse(2, 61, 53, 12, 0, 0, TAU); ctx.fill();
    const bag = ctx.createLinearGradient(-40, -58, 44, 58);
    bag.addColorStop(0, '#ffe8b7');
    bag.addColorStop(0.55, '#e9bd7f');
    bag.addColorStop(1, '#bd7d61');
    ctx.fillStyle = bag; ctx.strokeStyle = INK; ctx.lineWidth = 4;
    ctx.beginPath();
    ctx.moveTo(-31, -47);
    ctx.quadraticCurveTo(-61, -9, -44, 42);
    ctx.quadraticCurveTo(0, 77, 47, 41);
    ctx.quadraticCurveTo(62, -8, 31, -47);
    ctx.closePath(); ctx.fill(); ctx.stroke();
    // 묶인 끈과 매듭
    ctx.strokeStyle = '#cf5f63'; ctx.lineWidth = 9; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(-31, -45); ctx.quadraticCurveTo(0, -38, 32, -45); ctx.stroke();
    ctx.fillStyle = '#e66d72'; ctx.strokeStyle = INK; ctx.lineWidth = 2.5;
    ctx.beginPath(); ctx.ellipse(-13, -54, 17, 9, -0.35, 0, TAU); ctx.fill(); ctx.stroke();
    ctx.beginPath(); ctx.ellipse(14, -54, 17, 9, 0.35, 0, TAU); ctx.fill(); ctx.stroke();
    // 바람 무늬
    ctx.strokeStyle = 'rgba(255,248,213,0.82)'; ctx.lineWidth = 5;
    ctx.beginPath(); ctx.arc(-2, 13, 21, -0.8, 1.3); ctx.stroke();
    ctx.beginPath(); ctx.arc(6, 18, 10, 1.2, 3.7); ctx.stroke();
    if (open) {
      ctx.strokeStyle = '#8ee4cf'; ctx.lineWidth = 7;
      for (let i = 0; i < 3; i++) {
        const wave = Math.sin((time || 0) * 6 + i) * 8;
        ctx.beginPath();
        ctx.moveTo(-18 + i * 18, -55);
        ctx.bezierCurveTo(-35 + i * 25 + wave, -86, 20 + i * 13 - wave, -103, 3 + i * 23, -133);
        ctx.stroke();
      }
    }
    ctx.restore();
  };

  // ---- 타이틀 -------------------------------------------------------------
  UI.TitleScene = function (onStart) {
    let time = 0;
    let started = false;
    let launchDelay = -1;
    const W = ODY.E.W, H = ODY.E.H;
    const start = new UI.Button({
      x: W * 0.5, y: 442, w: 294, h: 72,
      label: '모험 시작', size: 30, color: '#ffad61',
      onTap() {
        if (started) return;
        started = true;
        launchDelay = 0.72;
        start.label = '출발!';
        ODY.Snd.depart();
        ODY.Feel.flash('#fff1b0', 0.16);
        UI.announce('별빛 귀향 노래와 함께 출발해요.');
      }
    });
    const mute = UI.makeMuteBtn();
    let totalStars = 0;
    try { totalStars = parseInt(localStorage.getItem('ody_total_stars') || '0', 10); } catch (_) {}

    return {
      enter() { ODY.Snd.startBgm('title', { intensity: 0.28, fade: 0.9 }); },
      exit() { ODY.Snd.stopBgm(); },
      update(dt, dtReal) {
        time += dtReal;
        start.update(dtReal);
        mute.update(dtReal);
        UI.handleMuteKey(mute);
        if (started && launchDelay >= 0) {
          launchDelay -= dtReal;
          if (launchDelay <= 0) {
            launchDelay = -1;
            onStart();
          }
        }
        if (!started && time > 0.45 &&
            (ODY.E.input.buffered('jump', 0.16) || ODY.E.input.buffered('ok', 0.16))) {
          ODY.E.input.consume('jump');
          ODY.E.input.consume('ok');
          start.activate();
        }
      },
      pointer(type, x, y) {
        if (mute.pointer(type, x, y)) return;
        if (!started) start.pointer(type, x, y);
      },
      draw(ctx) {
        // 파스텔 노을
        const sky = ctx.createLinearGradient(0, 0, 0, H);
        sky.addColorStop(0, '#766db9');
        sky.addColorStop(0.46, '#f1a7aa');
        sky.addColorStop(0.73, '#ffd3a0');
        sky.addColorStop(1, '#79b9d3');
        ctx.fillStyle = sky;
        ctx.fillRect(0, 0, W, H);

        const sunGlow = ctx.createRadialGradient(655, 202, 20, 655, 202, 155);
        sunGlow.addColorStop(0, 'rgba(255,247,196,0.75)');
        sunGlow.addColorStop(1, 'rgba(255,247,196,0)');
        ctx.fillStyle = sunGlow;
        ctx.fillRect(490, 38, 330, 330);
        ctx.fillStyle = '#fff0b6';
        ctx.beginPath(); ctx.arc(655, 202, 61 + Math.sin(time * 1.2) * 2, 0, TAU); ctx.fill();

        // 먼 섬 2겹
        ctx.fillStyle = '#74699a';
        ctx.beginPath();
        ctx.moveTo(0, 324);
        for (let x = 0; x <= W; x += 55) {
          ctx.lineTo(x, 286 + Math.sin(x * 0.012 + 0.8) * 20 + Math.sin(x * 0.026) * 9);
        }
        ctx.lineTo(W, H); ctx.lineTo(0, H); ctx.closePath(); ctx.fill();
        ctx.fillStyle = '#4f6f99';
        ctx.beginPath();
        ctx.moveTo(0, 365);
        for (let x = 0; x <= W; x += 45) {
          ctx.lineTo(x, 340 + Math.sin(x * 0.017 + 2) * 15);
        }
        ctx.lineTo(W, H); ctx.lineTo(0, H); ctx.closePath(); ctx.fill();

        // 바다 3겹
        const colors = ['#62a9c9', '#4d93bb', '#3e79aa'];
        for (let layer = 0; layer < 3; layer++) {
          const base = 346 + layer * 43;
          ctx.beginPath();
          ctx.moveTo(0, H);
          for (let x = 0; x <= W + 20; x += 20) {
            ctx.lineTo(x, base + Math.sin(x * 0.018 + time * (0.7 + layer * 0.42) + layer) * (8 - layer));
          }
          ctx.lineTo(W, H); ctx.closePath();
          ctx.fillStyle = colors[layer]; ctx.fill();
        }

        // 항로의 일곱 불빛
        for (let i = 0; i < 7; i++) {
          const x = 156 + i * 104;
          const y = 330 + Math.sin(i * 1.7) * 12;
          ctx.globalAlpha = 0.35 + 0.28 * Math.sin(time * 2 + i);
          UI.drawStar(ctx, x, y, 5, time + i, '#ffe7a0');
        }
        ctx.globalAlpha = 1;

        UI.drawShip(ctx, 668 + Math.sin(time * 0.7) * 9, 338 + Math.sin(time * 1.7) * 4, 0.78, time);
        UI.drawOwl(ctx, 825, 198 + Math.sin(time * 2) * 7, 0.55, time, false);

        // 종이 띠 위 제목
        const appear = ODY.Feel.ease.outBack(ODY.Feel.clamp01(time / 0.62));
        ctx.save();
        ctx.translate(300, 178);
        ctx.scale(appear, appear);
        ctx.rotate(-0.025);
        ctx.fillStyle = 'rgba(48,31,62,0.25)';
        UI.rr(ctx, -244, -103, 492, 190, 30); ctx.fill();
        const paper = ctx.createLinearGradient(0, -90, 0, 80);
        paper.addColorStop(0, '#fff9e9');
        paper.addColorStop(1, '#f4ddbd');
        ctx.fillStyle = paper;
        UI.rr(ctx, -250, -110, 492, 190, 30); ctx.fill();
        ctx.strokeStyle = INK; ctx.lineWidth = 4;
        UI.rr(ctx, -250, -110, 492, 190, 30); ctx.stroke();
        UI.drawGreekBand(ctx, -218, -84, 430, '#d79c45', 0.55);
        ctx.textAlign = 'center';
        ctx.font = '900 66px "Malgun Gothic", sans-serif';
        ctx.lineWidth = 9; ctx.lineJoin = 'round';
        ctx.strokeStyle = '#fff6da';
        ctx.strokeText('오디세이아', 0, 8);
        ctx.fillStyle = INK;
        ctx.fillText('오디세이아', 0, 8);
        ctx.font = '900 26px "Malgun Gothic", sans-serif';
        ctx.fillStyle = '#a35751';
        ctx.fillText('집으로 가는 길', 0, 52);
        ctx.restore();

        // 짧은 약속
        ctx.textAlign = 'center';
        ctx.font = '800 20px "Malgun Gothic", sans-serif';
        ctx.fillStyle = '#fff9e6';
        ctx.globalAlpha = 0.9;
        ctx.fillText('힘보다 지혜로, 이타카까지!', W * 0.5, 398);
        ctx.globalAlpha = 1;

        start.draw(ctx, true);
        if (totalStars > 0) {
          ctx.fillStyle = 'rgba(28,18,49,0.58)';
          UI.rr(ctx, 28, 26, 145, 45, 22); ctx.fill();
          UI.drawStar(ctx, 54, 48, 13, time, '#ffd85c');
          ctx.font = '900 20px "Malgun Gothic", sans-serif';
          ctx.textAlign = 'left';
          ctx.fillStyle = '#fff7dd';
          ctx.fillText('지혜의 별 ' + totalStars, 76, 56);
        }
        mute.draw(ctx);
        ODY.Feel.drawParticles(ctx);
      }
    };
  };

  // ---- 클리어와 신화 카드 -------------------------------------------------
  UI.ClearScene = function (options, onDone) {
    options = options || {};
    let time = 0;
    let burstA = false;
    let burstB = false;
    let done = false;
    const W = ODY.E.W, H = ODY.E.H;
    const clearTitle = options.title || '동굴 탈출 성공!';
    const rewardText = options.rewardText || '지혜의 별을 찾았어요!';
    const cardTitle = options.cardTitle || '신화 카드 · 키클롭스';
    const facts = options.facts || ['눈은 하나, 힘은 아주 세요.', '하지만 지혜에는 졌답니다!'];
    const button = new UI.Button({
      x: W * 0.5, y: 487, w: 235, h: 64,
      label: '다음으로', size: 27, color: '#7ed9aa',
      onTap() {
        if (done) return;
        done = true;
        onDone();
      }
    });
    const mute = UI.makeMuteBtn();

    return {
      enter() {
        // 출구에서 이미 승리 화음이 울렸다. 카드는 짧은 별 종으로 시작한다.
        ODY.Snd.startBgm(options.music || 'reward', {
          intensity: options.musicIntensity === undefined ? 0.36 : options.musicIntensity,
          fade: 0.7
        });
        ODY.Snd.pickup(3);
        ODY.Feel.flash('#fff3b5', 0.24);
        UI.announce(clearTitle + '. ' + rewardText + ' ' + cardTitle + '. ' +
          facts.join(' ') + ' ' + (options.countLabel || '이번에 모은 작은 별') + ' ' +
          options.starsGained + '개. 다음으로 버튼이 있어요.');
      },
      exit() { ODY.Snd.stopBgm(); },
      update(dt, dtReal) {
        time += dtReal;
        button.update(dtReal);
        mute.update(dtReal);
        UI.handleMuteKey(mute);
        if (!burstA && time > 0.2) {
          burstA = true;
          ODY.Feel.confetti(W * 0.28, 170, 34);
          ODY.Feel.confetti(W * 0.72, 170, 34);
        }
        if (!burstB && time > 1.05) {
          burstB = true;
          ODY.Feel.sparkle(W * 0.5, 137, '#ffe27a', 22);
        }
        if (!done && time > 1.25 &&
            (ODY.E.input.buffered('jump', 0.16) || ODY.E.input.buffered('ok', 0.16))) {
          ODY.E.input.consume('jump');
          ODY.E.input.consume('ok');
          button.activate();
        }
      },
      pointer(type, x, y) {
        if (mute.pointer(type, x, y)) return;
        if (time > 1.1) button.pointer(type, x, y);
      },
      draw(ctx) {
        const night = ctx.createLinearGradient(0, 0, 0, H);
        night.addColorStop(0, '#4d467f');
        night.addColorStop(0.62, '#272344');
        night.addColorStop(1, '#17142b');
        ctx.fillStyle = night; ctx.fillRect(0, 0, W, H);

        // 부드러운 광선
        ctx.save();
        ctx.translate(W * 0.5, 150);
        for (let i = 0; i < 18; i++) {
          ctx.rotate(TAU / 18);
          ctx.fillStyle = i % 2 ? 'rgba(255,225,122,0.055)' : 'rgba(255,255,255,0.035)';
          ctx.beginPath();
          ctx.moveTo(0, 0); ctx.lineTo(-18, -440); ctx.lineTo(18, -440); ctx.closePath(); ctx.fill();
        }
        ctx.restore();

        const titlePop = ODY.Feel.ease.outBack(ODY.Feel.clamp01((time - 0.05) / 0.48));
        ctx.save();
        ctx.translate(W * 0.5, 71);
        ctx.scale(titlePop, titlePop);
        ctx.textAlign = 'center';
        ctx.font = '900 ' + (options.titleSize || 49) + 'px "Malgun Gothic", sans-serif';
        ctx.lineWidth = 9; ctx.strokeStyle = INK; ctx.lineJoin = 'round';
        ctx.strokeText(clearTitle, 0, 0);
        ctx.fillStyle = options.accent || '#ffe47f'; ctx.fillText(clearTitle, 0, 0);
        ctx.restore();

        const starPop = ODY.Feel.ease.outElastic(ODY.Feel.clamp01((time - 0.42) / 0.78));
        if (starPop > 0) {
          UI.drawStar(ctx, W * 0.5, 145, 37 * starPop, Math.sin(time * 1.3) * 0.11, '#ffd85c');
          ctx.globalAlpha = ODY.Feel.clamp01((time - 0.88) / 0.35);
          ctx.font = '900 22px "Malgun Gothic", sans-serif';
          ctx.textAlign = 'center'; ctx.fillStyle = '#fff8de';
          ctx.fillText(rewardText, W * 0.5, 203);
          ctx.globalAlpha = 1;
        }

        // 카드가 아래에서 통통 올라온다.
        const cardT = ODY.Feel.clamp01((time - 0.92) / 0.62);
        if (cardT > 0) {
          const cy = 235 + (1 - ODY.Feel.ease.outBack(cardT)) * 230;
          UI.panel(ctx, 214, cy, 532, 188, 25, PAPER);
          UI.drawGreekBand(ctx, 240, cy + 18, 480, '#d59a49', 0.42);
          if (typeof options.drawArt === 'function') options.drawArt(ctx, 310, cy + 105, time);
          else if (options.portrait === 'windBag') UI.drawWindBag(ctx, 310, cy + 111, 0.68, time, true);
          else UI.drawCyclopsPortrait(ctx, 310, cy + 105, 0.72, time);
          ctx.textAlign = 'left';
          ctx.fillStyle = '#a45850';
          ctx.font = '900 21px "Malgun Gothic", sans-serif';
          ctx.fillText(cardTitle, 390, cy + 65);
          ctx.fillStyle = INK;
          ctx.font = '800 23px "Malgun Gothic", sans-serif';
          ctx.fillText(facts[0], 390, cy + 105);
          ctx.fillText(facts[1], 390, cy + 139);
          ctx.font = '700 17px "Malgun Gothic", sans-serif';
          ctx.fillStyle = '#796476';
          ctx.fillText((options.countLabel || '이번에 모은 작은 별') + '  ' + options.starsGained + '개', 390, cy + 169);
        }

        ODY.Feel.drawParticles(ctx);
        if (time > 1.1) button.draw(ctx, true);
        mute.draw(ctx);
      }
    };
  };

  ODY.UI = UI;
})();

</script>
  <script>
/* src/story.js */
// 오디세이아 — 이모지 대신 캔버스 그림으로 펼치는 짧은 그림책
(function () {
  'use strict';
  window.ODY = window.ODY || {};
  const TAU = Math.PI * 2;
  const INK = '#342442';

  function drawLittleHero(ctx, x, y, scale, time, running) {
    ctx.save();
    ctx.translate(x, y);
    ctx.scale(scale, scale);
    const step = running ? Math.sin(time * 10) : 0;
    const bob = running ? Math.abs(Math.sin(time * 10)) * -3 : Math.sin(time * 2) * 2;
    ctx.translate(0, bob);
    ctx.strokeStyle = INK;
    ctx.lineCap = 'round';
    // 망토
    ctx.fillStyle = '#e66d72';
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.moveTo(-9, -47);
    ctx.quadraticCurveTo(-35 - step * 3, -30, -25, -7);
    ctx.quadraticCurveTo(-12, -15, -5, -25);
    ctx.closePath(); ctx.fill(); ctx.stroke();
    // 다리
    ctx.lineWidth = 9;
    ctx.beginPath(); ctx.moveTo(-5, -15); ctx.lineTo(-7 + step * 10, 0); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(6, -15); ctx.lineTo(8 - step * 10, 0); ctx.stroke();
    ctx.strokeStyle = '#e7aa82'; ctx.lineWidth = 5;
    ctx.beginPath(); ctx.moveTo(-5, -15); ctx.lineTo(-7 + step * 10, 0); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(6, -15); ctx.lineTo(8 - step * 10, 0); ctx.stroke();
    // 몸
    const tunic = ctx.createLinearGradient(0, -49, 0, -13);
    tunic.addColorStop(0, '#79b9da'); tunic.addColorStop(1, '#477eae');
    ctx.fillStyle = tunic; ctx.strokeStyle = INK; ctx.lineWidth = 3;
    ODY.UI.rr(ctx, -16, -48, 32, 36, 10); ctx.fill(); ctx.stroke();
    ctx.fillStyle = '#f2bd4d'; ctx.fillRect(-16, -24, 32, 6);
    // 팔
    ctx.strokeStyle = INK; ctx.lineWidth = 9;
    ctx.beginPath(); ctx.moveTo(9, -40); ctx.lineTo(20 + step * 4, -29); ctx.stroke();
    ctx.strokeStyle = '#f5c59e'; ctx.lineWidth = 5;
    ctx.beginPath(); ctx.moveTo(9, -40); ctx.lineTo(20 + step * 4, -29); ctx.stroke();
    // 머리
    ctx.fillStyle = '#f5c59e'; ctx.strokeStyle = INK; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.arc(2, -65, 18, 0, TAU); ctx.fill(); ctx.stroke();
    ctx.fillStyle = '#75482e';
    ctx.beginPath(); ctx.arc(2, -69, 18, Math.PI, TAU); ctx.fill();
    ctx.strokeStyle = '#d85b66'; ctx.lineWidth = 5;
    ctx.beginPath(); ctx.arc(2, -65, 16, Math.PI * 1.05, Math.PI * 1.92); ctx.stroke();
    ctx.fillStyle = INK;
    ctx.beginPath(); ctx.arc(7, -63, 2.3, 0, TAU); ctx.arc(15, -63, 2.3, 0, TAU); ctx.fill();
    ctx.strokeStyle = '#70432e'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(11, -56, 4, 0.15 * Math.PI, 0.78 * Math.PI); ctx.stroke();
    ctx.restore();
  }

  function drawTroy(ctx, time) {
    const x = 78, y = 76, w = 804, h = 260;
    const sky = ctx.createLinearGradient(0, y, 0, y + h);
    sky.addColorStop(0, '#8777ba');
    sky.addColorStop(0.55, '#f3a8a5');
    sky.addColorStop(1, '#ffd4a0');
    ctx.fillStyle = sky;
    ODY.UI.rr(ctx, x, y, w, h, 22); ctx.fill();
    ctx.save();
    ODY.UI.rr(ctx, x, y, w, h, 22); ctx.clip();
    // 해
    ctx.fillStyle = '#fff0b0';
    ctx.beginPath(); ctx.arc(690, 175, 49, 0, TAU); ctx.fill();
    // 트로이 성
    ctx.fillStyle = '#71678e';
    ctx.fillRect(78, 228, 205, 108);
    for (let i = 0; i < 5; i++) {
      ctx.fillRect(83 + i * 42, 203 + (i % 2) * 10, 30, 33);
      ctx.fillRect(83 + i * 42, 194 + (i % 2) * 10, 7, 12);
      ctx.fillRect(106 + i * 42, 194 + (i % 2) * 10, 7, 12);
    }
    ctx.fillStyle = '#352d52';
    ctx.beginPath(); ctx.arc(181, 295, 27, Math.PI, TAU); ctx.lineTo(208, 336); ctx.lineTo(154, 336); ctx.closePath(); ctx.fill();
    // 바다
    ctx.fillStyle = '#5ea9c6'; ctx.fillRect(x, 278, w, 70);
    ctx.strokeStyle = 'rgba(255,255,255,0.5)'; ctx.lineWidth = 3;
    for (let j = 0; j < 3; j++) {
      ctx.beginPath();
      for (let px = x - 20; px < x + w + 30; px += 22) {
        const py = 294 + j * 20 + Math.sin(px * 0.025 + time * (1.2 + j * 0.25)) * 4;
        if (px === x - 20) ctx.moveTo(px, py); else ctx.lineTo(px, py);
      }
      ctx.stroke();
    }
    ODY.UI.drawShip(ctx, 585, 281 + Math.sin(time * 1.7) * 3, 0.62, time);
    // 집 쪽으로 이어지는 황금빛 별
    for (let i = 0; i < 6; i++) {
      ODY.UI.drawStar(ctx, 500 + i * 48, 128 + Math.sin(i * 1.4) * 18, 5, time + i, '#ffe39a');
    }
    ctx.restore();
  }

  function drawCave(ctx, time) {
    const x = 78, y = 76, w = 804, h = 260;
    const cave = ctx.createLinearGradient(0, y, 0, y + h);
    cave.addColorStop(0, '#211a3b');
    cave.addColorStop(1, '#49375e');
    ctx.fillStyle = cave;
    ODY.UI.rr(ctx, x, y, w, h, 22); ctx.fill();
    ctx.save();
    ODY.UI.rr(ctx, x, y, w, h, 22); ctx.clip();
    // 동굴 테두리
    ctx.fillStyle = '#18132d';
    for (let i = 0; i < 9; i++) {
      const px = 96 + i * 100;
      const ph = 35 + (i * 37) % 60;
      ctx.beginPath(); ctx.moveTo(px - 38, 76); ctx.lineTo(px + 40, 76); ctx.lineTo(px, 76 + ph); ctx.closePath(); ctx.fill();
    }
    // 횃불
    for (const tx of [310, 775]) {
      const flick = 1 + Math.sin(time * 11 + tx) * 0.08;
      const glow = ctx.createRadialGradient(tx, 188, 4, tx, 188, 82);
      glow.addColorStop(0, 'rgba(255,186,91,0.38)');
      glow.addColorStop(1, 'rgba(255,186,91,0)');
      ctx.fillStyle = glow; ctx.fillRect(tx - 85, 103, 170, 170);
      ctx.fillStyle = '#ffae57';
      ctx.beginPath(); ctx.ellipse(tx, 188, 8, 15 * flick, 0, 0, TAU); ctx.fill();
      ctx.fillStyle = '#ffe079';
      ctx.beginPath(); ctx.ellipse(tx, 192, 4, 8 * flick, 0, 0, TAU); ctx.fill();
    }
    // 귀여운 키클롭스
    ODY.UI.drawCyclopsPortrait(ctx, 570, 226 + Math.sin(time * 1.5) * 3, 1.32, time);
    ctx.font = '800 23px "Malgun Gothic", sans-serif';
    ctx.fillStyle = 'rgba(255,255,255,0.72)';
    ctx.fillText('쿨…', 668, 141 + Math.sin(time * 2) * 5);
    // 돌문
    ctx.fillStyle = '#655578'; ctx.strokeStyle = INK; ctx.lineWidth = 4;
    ctx.beginPath(); ctx.ellipse(820, 256, 67, 96, 0, 0, TAU); ctx.fill(); ctx.stroke();
    // 숨어 있는 작은 영웅들
    for (let i = 0; i < 3; i++) {
      drawLittleHero(ctx, 178 + i * 62, 314, 0.52, time + i * 0.2, false);
    }
    ctx.restore();
  }

  function drawEscape(ctx, time) {
    const x = 78, y = 76, w = 804, h = 260;
    const cave = ctx.createLinearGradient(0, y, 0, y + h);
    cave.addColorStop(0, '#292043');
    cave.addColorStop(1, '#59436b');
    ctx.fillStyle = cave;
    ODY.UI.rr(ctx, x, y, w, h, 22); ctx.fill();
    ctx.save();
    ODY.UI.rr(ctx, x, y, w, h, 22); ctx.clip();
    // 출구에서 들어오는 빛
    const light = ctx.createRadialGradient(814, 216, 6, 814, 216, 250);
    light.addColorStop(0, 'rgba(255,248,198,1)');
    light.addColorStop(0.33, 'rgba(255,218,132,0.58)');
    light.addColorStop(1, 'rgba(255,218,132,0)');
    ctx.fillStyle = light; ctx.fillRect(560, 76, 330, 260);
    ctx.fillStyle = '#fff1b5';
    ctx.beginPath(); ctx.ellipse(842, 228, 78, 120, 0, 0, TAU); ctx.fill();
    // 바닥 선
    ctx.strokeStyle = 'rgba(211,185,225,0.28)'; ctx.lineWidth = 3;
    for (let i = 0; i < 8; i++) {
      ctx.beginPath(); ctx.moveTo(80 + i * 120 - (time * 80) % 120, 323);
      ctx.lineTo(120 + i * 120 - (time * 80) % 120, 309); ctx.stroke();
    }
    drawLittleHero(ctx, 450, 318, 1.05, time, true);
    drawLittleHero(ctx, 340, 322, 0.78, time + 0.15, true);
    ODY.UI.drawOwl(ctx, 610, 170 + Math.sin(time * 4) * 9, 0.58, time, true);
    // 점프를 말없이 보여 주는 별 아치
    for (let i = 0; i < 6; i++) {
      const k = i / 5;
      const sx = 505 + k * 190;
      const sy = 276 - Math.sin(k * Math.PI) * 92;
      ODY.UI.drawStar(ctx, sx, sy, 7, time * 1.6 + i, '#ffe285');
