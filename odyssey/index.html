    ctx.restore();
  }

  function windFrame(ctx, top, bottom) {
    const x = 78, y = 76, w = 804, h = 260;
    const sky = ctx.createLinearGradient(0, y, 0, y + h);
    sky.addColorStop(0, top || '#8583c3');
    sky.addColorStop(0.55, '#f3b6ba');
    sky.addColorStop(1, bottom || '#ffd7aa');
    ctx.fillStyle = sky;
    ODY.UI.rr(ctx, x, y, w, h, 22); ctx.fill();
    ctx.save(); ODY.UI.rr(ctx, x, y, w, h, 22); ctx.clip();
  }

  function drawStoryCloud(ctx, x, y, scale, color) {
    ctx.save(); ctx.translate(x, y); ctx.scale(scale, scale);
    ctx.fillStyle = color || '#fff0e9';
    ctx.beginPath();
    ctx.arc(-37, 8, 25, 0, TAU); ctx.arc(-10, -8, 34, 0, TAU);
    ctx.arc(24, 0, 29, 0, TAU); ctx.arc(48, 13, 21, 0, TAU);
    ctx.rect(-39, 7, 88, 31); ctx.fill(); ctx.restore();
  }

  function drawWindFriend(ctx, x, y, scale, time, phase) {
    ctx.save(); ctx.translate(x, y + Math.sin(time * 5 + phase) * 5); ctx.scale(scale, scale);
    ctx.strokeStyle = '#6cd5c2'; ctx.lineWidth = 6; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(-42, 4); ctx.bezierCurveTo(-18, -21, 27, -20, 27, 0);
    ctx.bezierCurveTo(27, 17, 2, 20, -9, 8); ctx.stroke();
    ctx.fillStyle = '#d9fff2'; ctx.strokeStyle = INK; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.arc(28, 0, 18, 0, TAU); ctx.fill(); ctx.stroke();
    ctx.fillStyle = INK; ctx.beginPath(); ctx.arc(23, -3, 2.5, 0, TAU); ctx.fill();
    ctx.strokeStyle = '#6a5167'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(31, 4, 5, 0.15 * Math.PI, 0.8 * Math.PI); ctx.stroke();
    ctx.fillStyle = 'rgba(255,132,148,0.38)'; ctx.beginPath(); ctx.arc(38, 4, 4, 0, TAU); ctx.fill();
    ctx.restore();
  }

  function drawAeolus(ctx, time) {
    windFrame(ctx, '#8583c3', '#ffd7aa');
    // 구름 섬
    drawStoryCloud(ctx, 190, 295, 1.65, '#f5e8e4');
    drawStoryCloud(ctx, 378, 310, 1.42, '#fff1e7');
    drawStoryCloud(ctx, 745, 306, 1.65, '#f5e8e4');
    // 바람 왕 아이올로스: 둥글고 친절한 모습
    ctx.save(); ctx.translate(265, 282 + Math.sin(time * 2) * 2);
    ctx.fillStyle = '#7667a0'; ctx.strokeStyle = INK; ctx.lineWidth = 4;
    ctx.beginPath(); ctx.ellipse(0, 0, 52, 63, 0, 0, TAU); ctx.fill(); ctx.stroke();
    ctx.fillStyle = '#f4c7a4'; ctx.beginPath(); ctx.arc(0, -68, 35, 0, TAU); ctx.fill(); ctx.stroke();
    // 구름 같은 머리카락과 수염
    ctx.fillStyle = '#f5eee6';
    for (const p of [[-24,-89,15],[-3,-99,17],[22,-88,15],[-27,-56,12],[27,-56,12],[0,-44,17]]) {
      ctx.beginPath(); ctx.arc(p[0], p[1], p[2], 0, TAU); ctx.fill(); ctx.stroke();
    }
    ctx.fillStyle = INK; ctx.beginPath(); ctx.arc(-10, -70, 3, 0, TAU); ctx.arc(10, -70, 3, 0, TAU); ctx.fill();
    ctx.strokeStyle = '#744f4f'; ctx.lineWidth = 2.5;
    ctx.beginPath(); ctx.arc(0, -59, 8, 0.1 * Math.PI, 0.9 * Math.PI); ctx.stroke();
    // 주머니를 건네는 팔
    ctx.strokeStyle = INK; ctx.lineWidth = 13; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(32, -12); ctx.lineTo(83, 6); ctx.stroke();
    ctx.strokeStyle = '#f4c7a4'; ctx.lineWidth = 8; ctx.beginPath(); ctx.moveTo(32, -12); ctx.lineTo(83, 6); ctx.stroke();
    ctx.restore();
    ODY.UI.drawWindBag(ctx, 482, 246, 0.72, time, false);
    drawLittleHero(ctx, 655, 313, 0.88, time, false);
    drawWindFriend(ctx, 526, 130, 0.72, time, 0);
    drawWindFriend(ctx, 696, 163, 0.55, time, 2);
    ctx.restore();
  }

  function drawFairWind(ctx, time) {
    windFrame(ctx, '#7779bd', '#ffd7aa');
    ctx.fillStyle = '#fff0a9'; ctx.beginPath(); ctx.arc(754, 145, 42, 0, TAU); ctx.fill();
    // 먼 이타카와 따뜻한 집 불빛
    ctx.fillStyle = '#70658e';
    ctx.beginPath(); ctx.ellipse(804, 257, 115, 31, 0, 0, TAU); ctx.fill();
    ctx.fillStyle = '#51466c'; ctx.fillRect(789, 218, 33, 28);
    ctx.beginPath(); ctx.moveTo(782, 220); ctx.lineTo(806, 199); ctx.lineTo(829, 220); ctx.closePath(); ctx.fill();
    ctx.fillStyle = '#ffe488'; ctx.fillRect(798, 224, 8, 10);
    // 잔잔한 바다
    ctx.fillStyle = '#5fb2ca'; ctx.fillRect(78, 260, 804, 92);
    ctx.strokeStyle = 'rgba(255,255,255,0.5)'; ctx.lineWidth = 3;
    for (let j = 0; j < 3; j++) {
      ctx.beginPath();
      for (let px = 58; px <= 900; px += 24) {
        const py = 276 + j * 24 + Math.sin(px * 0.025 + time * (1.2 + j * 0.2)) * 4;
        if (px === 58) ctx.moveTo(px, py); else ctx.lineTo(px, py);
      }
      ctx.stroke();
    }
    ODY.UI.drawShip(ctx, 438, 267 + Math.sin(time * 1.7) * 3, 0.73, time);
    // 금빛 순풍길
    for (let i = 0; i < 7; i++) {
      const k = i / 6;
      const x = 514 + k * 225;
      const y = 198 - Math.sin(k * Math.PI) * 43;
      ODY.UI.drawStar(ctx, x, y, 6, time + i, '#ffe493');
    }
    drawWindFriend(ctx, 270, 166, 0.72, time, 1);
    drawWindFriend(ctx, 364, 129, 0.55, time, 3);
    // 꾸벅꾸벅 조는 말풍선
    ctx.fillStyle = 'rgba(255,248,224,0.84)'; ctx.font = '900 22px "Malgun Gothic", sans-serif';
    ctx.fillText('꾸벅…', 322, 225 + Math.sin(time * 2) * 3);
    ctx.restore();
  }

  function drawOpenBag(ctx, time) {
    windFrame(ctx, '#6f6ca8', '#efb1b5');
    // 기울어진 바다와 배. 흔들리지만 무섭지 않다.
    ctx.save(); ctx.translate(0, 10); ctx.rotate(-0.018);
    ctx.fillStyle = '#4f9fc0'; ctx.fillRect(65, 264, 835, 102);
    ctx.strokeStyle = 'rgba(255,255,255,0.55)'; ctx.lineWidth = 4;
    for (let j = 0; j < 3; j++) {
      ctx.beginPath();
      for (let px = 48; px <= 920; px += 24) {
        const py = 280 + j * 25 + Math.sin(px * 0.03 + time * 2.2 + j) * 7;
        if (px === 48) ctx.moveTo(px, py); else ctx.lineTo(px, py);
      }
      ctx.stroke();
    }
    ODY.UI.drawShip(ctx, 426, 274, 0.72, time);
    ctx.restore();
    ODY.UI.drawWindBag(ctx, 256, 242, 0.74, time, true);
    // 튀어나온 바람 친구들이 배 주변을 둥글게 돈다.
    const friends = [[348,139,0.67,0],[463,119,0.54,1.4],[590,155,0.7,2.8],[690,118,0.5,4.2]];
    friends.forEach(f => drawWindFriend(ctx, f[0], f[1], f[2], time, f[3]));
    // 침착하게 키를 잡는 오디세우스를 강조하는 황금 원
    ctx.strokeStyle = 'rgba(255,232,130,0.75)'; ctx.lineWidth = 4;
    ctx.beginPath(); ctx.arc(393, 242, 27 + Math.sin(time * 4) * 2, 0, TAU); ctx.stroke();
    ODY.UI.drawOwl(ctx, 765, 218 + Math.sin(time * 4) * 7, 0.52, time, false);
    ctx.restore();
  }

  function drawStoryPig(ctx, x, y, scale, time, phase) {
    const bounce = Math.abs(Math.sin(time * 4.4 + (phase || 0))) * -4;
    ctx.save(); ctx.translate(x, y + bounce); ctx.scale(scale, scale);
    ctx.fillStyle = '#f3a9b4'; ctx.strokeStyle = INK; ctx.lineWidth = 3.5;
    ctx.beginPath(); ctx.ellipse(0, 0, 38, 27, 0, 0, TAU); ctx.fill(); ctx.stroke();
    ctx.beginPath(); ctx.arc(30, -7, 23, 0, TAU); ctx.fill(); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(17, -24); ctx.lineTo(22, -43); ctx.lineTo(34, -27); ctx.closePath(); ctx.fill(); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(37, -27); ctx.lineTo(48, -42); ctx.lineTo(51, -20); ctx.closePath(); ctx.fill(); ctx.stroke();
    ctx.fillStyle = '#f6cad0'; ctx.beginPath(); ctx.ellipse(48, -2, 15, 11, 0, 0, TAU); ctx.fill(); ctx.stroke();
    ctx.fillStyle = INK; ctx.beginPath(); ctx.arc(43, -4, 2.2, 0, TAU); ctx.arc(52, -4, 2.2, 0, TAU); ctx.fill();
    ctx.beginPath(); ctx.arc(30, -11, 2.8, 0, TAU); ctx.fill();
    ctx.strokeStyle = '#8f526b'; ctx.lineWidth = 2.3;
    ctx.beginPath(); ctx.arc(-37, -3, 13, -1.5, 1.4); ctx.arc(-43, -3, 7, -1.4, 1.5); ctx.stroke();
    ctx.strokeStyle = INK; ctx.lineWidth = 4; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(-18, 20); ctx.lineTo(-20, 34); ctx.moveTo(18, 20); ctx.lineTo(20, 34); ctx.stroke();
    ctx.restore();
  }

  function drawStoryCirce(ctx, x, y, scale, time) {
    ctx.save(); ctx.translate(x, y + Math.sin(time * 2.1) * 2); ctx.scale(scale, scale);
    ctx.fillStyle = '#8d6fc3'; ctx.strokeStyle = INK; ctx.lineWidth = 4;
    ctx.beginPath(); ctx.moveTo(-46, 54); ctx.quadraticCurveTo(0, -10, 46, 54); ctx.closePath(); ctx.fill(); ctx.stroke();
    ctx.fillStyle = '#f3c3a2'; ctx.beginPath(); ctx.arc(0, -30, 29, 0, TAU); ctx.fill(); ctx.stroke();
    ctx.fillStyle = '#5a3e68';
    for (let i = -2; i <= 2; i++) {
      ctx.beginPath(); ctx.arc(i * 12, -49 + Math.abs(i) * 4, 13, 0, TAU); ctx.fill(); ctx.stroke();
    }
    ctx.fillStyle = INK; ctx.beginPath(); ctx.arc(-9, -31, 2.4, 0, TAU); ctx.arc(9, -31, 2.4, 0, TAU); ctx.fill();
    ctx.strokeStyle = '#9e5264'; ctx.lineWidth = 2.2; ctx.beginPath(); ctx.arc(0, -20, 8, 0.15, Math.PI - 0.15); ctx.stroke();
    ctx.strokeStyle = '#e8c76b'; ctx.lineWidth = 6; ctx.beginPath(); ctx.moveTo(28, 6); ctx.lineTo(60, -35); ctx.stroke();
    ctx.fillStyle = '#ffe783'; ctx.beginPath();
    for (let i = 0; i < 10; i++) {
      const r = i % 2 ? 6 : 12; const a = -Math.PI * 0.5 + i * Math.PI / 5;
      if (!i) ctx.moveTo(60 + Math.cos(a) * r, -35 + Math.sin(a) * r);
      else ctx.lineTo(60 + Math.cos(a) * r, -35 + Math.sin(a) * r);
    }
    ctx.closePath(); ctx.fill(); ctx.strokeStyle = '#8d5b35'; ctx.lineWidth = 2; ctx.stroke();
    ctx.restore();
  }

  function drawMoly(ctx, x, y, scale, time) {
    ctx.save(); ctx.translate(x, y); ctx.scale(scale, scale);
    ctx.strokeStyle = '#5d824f'; ctx.lineWidth = 5; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(0, 38); ctx.quadraticCurveTo(-3, 4, 0, -28); ctx.stroke();
    const leaves = [[-15,18,-0.6],[15,8,0.55],[-14,-2,-0.55],[13,-15,0.5]];
    leaves.forEach((leaf, i) => {
      ctx.save(); ctx.translate(leaf[0], leaf[1]); ctx.rotate(leaf[2] + Math.sin(time * 3 + i) * 0.05);
      ctx.fillStyle = '#7ed89e'; ctx.strokeStyle = '#426c50'; ctx.lineWidth = 2.5;
      ctx.beginPath(); ctx.ellipse(0, 0, 16, 7, 0, 0, TAU); ctx.fill(); ctx.stroke(); ctx.restore();
    });
    ctx.fillStyle = '#fff8dc'; ctx.strokeStyle = '#8f704f'; ctx.lineWidth = 2;
    for (let i = 0; i < 6; i++) {
      const a = i * TAU / 6 + time * 0.04;
      ctx.beginPath(); ctx.ellipse(Math.cos(a) * 9, -37 + Math.sin(a) * 9, 8, 4.5, a, 0, TAU); ctx.fill(); ctx.stroke();
    }
    ctx.fillStyle = '#f4c65e'; ctx.beginPath(); ctx.arc(0, -37, 5, 0, TAU); ctx.fill();
    ctx.restore();
  }

  function drawCirceGarden(ctx, time, scene) {
    const x = 78, y = 76, w = 804, h = 260;
    const sky = ctx.createLinearGradient(0, y, 0, y + h);
    sky.addColorStop(0, scene === 'circeIsland' ? '#89a9ca' : '#9d90c9');
    sky.addColorStop(1, '#ffd0a7');
    ctx.fillStyle = sky; ODY.UI.rr(ctx, x, y, w, h, 22); ctx.fill();
    ctx.save(); ODY.UI.rr(ctx, x, y, w, h, 22); ctx.clip();

    ctx.fillStyle = '#7fb88a';
    ctx.beginPath(); ctx.moveTo(x, 260);
    for (let px = x; px <= x + w; px += 48) ctx.lineTo(px, 232 + Math.sin(px * 0.018) * 14);
    ctx.lineTo(x + w, y + h); ctx.lineTo(x, y + h); ctx.closePath(); ctx.fill();
    ctx.fillStyle = '#5f9771'; ctx.fillRect(x, 291, w, 65);

    // 궁전은 둥근 탑과 따뜻한 창으로 보여 무섭지 않게 한다.
    ctx.fillStyle = '#efe0c4'; ctx.strokeStyle = '#6d5870'; ctx.lineWidth = 3;
    ctx.fillRect(650, 164, 146, 132); ctx.strokeRect(650, 164, 146, 132);
    [665,716,767].forEach((tx, i) => {
      ctx.fillStyle = i === 1 ? '#d8c1a9' : '#ead5ba';
      ODY.UI.rr(ctx, tx, 131 - (i === 1 ? 18 : 0), 32, 165 + (i === 1 ? 18 : 0), 14); ctx.fill(); ctx.stroke();
      ctx.fillStyle = '#ffe889'; ODY.UI.rr(ctx, tx + 10, 188, 12, 20, 5); ctx.fill();
    });

    // 올리브 나무와 꽃밭
    for (let i = 0; i < 5; i++) {
      const tx = 125 + i * 124;
      ctx.strokeStyle = '#6e5a48'; ctx.lineWidth = 9; ctx.beginPath(); ctx.moveTo(tx, 304); ctx.lineTo(tx + 4, 241); ctx.stroke();
      ctx.fillStyle = i % 2 ? '#6eaa77' : '#78b481';
      ctx.beginPath(); ctx.arc(tx - 17, 235, 24, 0, TAU); ctx.arc(tx + 13, 226, 29, 0, TAU); ctx.arc(tx + 31, 246, 22, 0, TAU); ctx.fill();
    }
    for (let i = 0; i < 20; i++) {
      ctx.fillStyle = i % 2 ? '#fff2a8' : '#f6b6ca';
      ctx.beginPath(); ctx.arc(105 + (i * 79) % 735, 316 + (i % 3) * 9, 3.5, 0, TAU); ctx.fill();
    }

    if (scene === 'circeIsland') {
      ctx.fillStyle = '#58a8bf'; ctx.fillRect(78, 304, 300, 52);
      ODY.UI.drawShip(ctx, 210, 307 + Math.sin(time * 2) * 2, 0.42, time);
      drawLittleHero(ctx, 430, 294, 0.62, time, true);
      drawStoryCirce(ctx, 735, 270, 0.7, time);
    } else if (scene === 'pigFriends') {
      drawStoryPig(ctx, 258, 287, 0.82, time, 0);
      drawStoryPig(ctx, 420, 300, 0.72, time, 1.2);
      drawStoryPig(ctx, 563, 281, 0.78, time, 2.3);
      drawStoryCirce(ctx, 742, 271, 0.72, time);
      for (let i = 0; i < 7; i++) {
        const a = time * 0.8 + i * TAU / 7;
        ctx.fillStyle = '#ead7ff'; ctx.beginPath(); ctx.arc(636 + Math.cos(a) * 34, 193 + Math.sin(a) * 22, 4, 0, TAU); ctx.fill();
      }
    } else {
      drawLittleHero(ctx, 264, 294, 0.72, time, false);
      drawMoly(ctx, 425, 235, 1.15, time);
      drawStoryPig(ctx, 590, 296, 0.72, time, 0.8);
      drawStoryPig(ctx, 710, 286, 0.68, time, 2.0);
      // 헤르메스의 날개 달린 모자
      ctx.fillStyle = '#f2c28f'; ctx.strokeStyle = INK; ctx.lineWidth = 3;
      ctx.beginPath(); ctx.arc(158, 191, 25, 0, TAU); ctx.fill(); ctx.stroke();
      ctx.fillStyle = '#f7eee0'; ctx.beginPath(); ctx.moveTo(133,181); ctx.lineTo(109,166); ctx.lineTo(125,196); ctx.closePath(); ctx.fill(); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(183,181); ctx.lineTo(207,166); ctx.lineTo(191,196); ctx.closePath(); ctx.fill(); ctx.stroke();
      ctx.fillStyle = '#69a8b7'; ctx.beginPath(); ctx.moveTo(126,292); ctx.quadraticCurveTo(158,208,190,292); ctx.closePath(); ctx.fill(); ctx.stroke();
    }

    ctx.strokeStyle = 'rgba(255,255,220,0.55)'; ctx.lineWidth = 4;
    ctx.beginPath(); ctx.moveTo(95, 329); ctx.bezierCurveTo(300, 303, 555, 348, 855, 315); ctx.stroke();
    ctx.restore();
  }

  function drawIllustration(ctx, scene, time) {
    if (scene === 'aeolus') drawAeolus(ctx, time);
    else if (scene === 'fairWind') drawFairWind(ctx, time);
    else if (scene === 'openBag') drawOpenBag(ctx, time);
    else if (scene === 'circeIsland' || scene === 'pigFriends' || scene === 'moly') drawCirceGarden(ctx, time, scene);
    else if (scene === 'cave') drawCave(ctx, time);
    else if (scene === 'escape') drawEscape(ctx, time);
    else drawTroy(ctx, time);
  }

  ODY.Story = {
    Cutscene(pages, onDone, options) {
      options = options || {};
      let page = 0;
      let shownChars = 0;
      let time = 0;
      let pageTime = 0;
      let turning = 0;
      let pendingPage = -1;
      let done = false;
      const CPS = 28;
      const mute = ODY.UI.makeMuteBtn();

      function length() {
        return pages[page].lines.join('').length;
      }

      function typingDone() {
        return shownChars >= length();
      }

      function announcePage() {
        const item = pages[page];
        ODY.UI.announce('그림책 ' + (page + 1) + '쪽, ' + (pages.length) + '쪽 중. ' +
          (item.chapter || '집으로 가는 길') + '. ' + item.lines.join(' ') +
          ' 스페이스바나 화면으로 다음 장이에요.');
      }

      function finish() {
        if (done) return;
        done = true;
        onDone();
      }

      function next() {
        if (done || turning > 0) return;
        if (!typingDone()) {
          shownChars = length();
          ODY.Snd.click();
          return;
        }
        if (page >= pages.length - 1) {
          ODY.Snd.page();
          finish();
          return;
        }
        pendingPage = page + 1;
        turning = 0.001;
        ODY.Snd.page();
      }

      return {
        enter() {
          ODY.Snd.unlock();
          ODY.Snd.startBgm(options.music || 'storySea', {
            intensity: options.pageIntensities ? options.pageIntensities[0] :
              (options.intensity === undefined ? 0.21 : options.intensity),
            fade: 0.8
          });
          announcePage();
        },
        exit() { ODY.Snd.stopBgm(); },
        update(dt, dtReal) {
          time += dtReal;
          pageTime += dtReal;
          mute.update(dtReal);
          ODY.UI.handleMuteKey(mute);
          if (turning > 0) {
            turning += dtReal;
            if (pendingPage >= 0 && turning >= 0.22) {
              page = pendingPage;
              pendingPage = -1;
              shownChars = 0;
              pageTime = 0;
              if (options.pageIntensities && options.pageIntensities[page] !== undefined) {
                ODY.Snd.setMusicIntensity(options.pageIntensities[page], 0.7);
              }
              announcePage();
            }
            if (turning >= 0.44) turning = 0;
          } else {
            shownChars = Math.min(length(), shownChars + CPS * dtReal);
          }

          if (ODY.E.input.buffered('jump', 0.16) || ODY.E.input.buffered('ok', 0.16)) {
            ODY.E.input.consume('jump');
            ODY.E.input.consume('ok');
            next();
          }
        },
        pointer(type, x, y) {
          if (mute.pointer(type, x, y)) return;
          if (type !== 'down') return;
          if (x > 728 && x < 912 && y > 18 && y < 67) {
            ODY.Snd.click();
            finish();
            return;
          }
          next();
        },
        draw(ctx) {
          const W = ODY.E.W, H = ODY.E.H;
          const bg = ctx.createLinearGradient(0, 0, 0, H);
          bg.addColorStop(0, '#433b70');
          bg.addColorStop(1, '#1d1933');
          ctx.fillStyle = bg; ctx.fillRect(0, 0, W, H);

          // 밤하늘의 종이별
          for (let i = 0; i < 32; i++) {
            const sx = (i * 157) % W;
            const sy = 18 + (i * 83) % 190;
            ctx.globalAlpha = 0.18 + 0.22 * Math.sin(time * 1.7 + i);
            ctx.fillStyle = '#fff2c6';
            ctx.beginPath(); ctx.arc(sx, sy, 1.4 + (i % 3) * 0.55, 0, TAU); ctx.fill();
          }
          ctx.globalAlpha = 1;

          // 책장
          const open = ODY.Feel.ease.outBack(ODY.Feel.clamp01(time / 0.48));
          const turnScale = turning > 0 ? Math.max(0.08, Math.abs(Math.cos(turning / 0.44 * Math.PI))) : 1;
          ctx.save();
          ctx.translate(W * 0.5, H * 0.5 + 8);
          ctx.scale(open * turnScale, open);
          ctx.translate(-W * 0.5, -(H * 0.5 + 8));
          ODY.UI.panel(ctx, 50, 54, 860, 446, 28, '#fff8e8');
          ctx.fillStyle = 'rgba(203,154,91,0.12)';
          ctx.fillRect(477, 66, 6, 420);
          ODY.UI.drawGreekBand(ctx, 82, 68, 794, '#d39a4c', 0.44);

          drawIllustration(ctx, pages[page].scene, pageTime);

          // 삽화 아래 캡션
          ctx.textAlign = 'center';
          ctx.fillStyle = '#9e554e';
          ctx.font = '900 18px "Malgun Gothic", sans-serif';
          ctx.fillText(pages[page].chapter || '집으로 가는 길', W * 0.5, 367);

          ctx.fillStyle = INK;
          ctx.font = '800 25px "Malgun Gothic", sans-serif';
          let remain = Math.floor(shownChars);
          pages[page].lines.forEach((line, index) => {
            const visible = line.slice(0, Math.max(0, remain));
            remain -= line.length;
            ctx.fillText(visible, W * 0.5, 404 + index * 34);
          });

          // 페이지 점과 넘김 표시
          for (let i = 0; i < pages.length; i++) {
            ctx.beginPath();
            ctx.arc(W * 0.5 + (i - (pages.length - 1) * 0.5) * 24, 480, i === page ? 6.5 : 4, 0, TAU);
            ctx.fillStyle = i === page ? '#cc765a' : '#d9c7a5';
            ctx.fill();
          }
          if (typingDone() && turning === 0) {
            ctx.globalAlpha = 0.58 + Math.sin(time * 5) * 0.25;
            ctx.fillStyle = '#9e554e';
            ctx.font = '900 19px "Malgun Gothic", sans-serif';
            ctx.textAlign = 'right';
            ctx.fillText(page === pages.length - 1 ? '모험 시작  ›' : '다음 장  ›', 872, 479);
            ctx.globalAlpha = 1;
          }
          ctx.restore();

          // 충분히 큰 건너뛰기 버튼
          ctx.fillStyle = 'rgba(26,19,45,0.58)';
          ODY.UI.rr(ctx, 728, 18, 184, 49, 24); ctx.fill();
          ctx.strokeStyle = 'rgba(255,255,255,0.35)'; ctx.lineWidth = 2;
          ODY.UI.rr(ctx, 728, 18, 184, 49, 24); ctx.stroke();
          ctx.fillStyle = '#fff7df';
          ctx.font = '800 17px "Malgun Gothic", sans-serif';
          ctx.textAlign = 'center';
          ctx.fillText('이야기 건너뛰기', 820, 49);
          mute.draw(ctx);
        }
      };
    }
  };
})();

</script>
  <script>
/* src/stages/cyclops-level.js */
// 키클롭스 동굴 — 무작위가 아닌 수제 리듬 코스
(function () {
  'use strict';
  window.ODY = window.ODY || {};
  ODY.Levels = ODY.Levels || {};

  const GROUND = 430;
  const TOTAL = 13000;
  const checkpoints = [0, 5200, 9600];

  function starArc(list, center, options) {
    const o = Object.assign({ count: 5, span: 260, height: 112, base: 52 }, options);
    for (let i = 0; i < o.count; i++) {
      const k = o.count === 1 ? 0.5 : i / (o.count - 1);
      list.push({
        x: center + (k - 0.5) * o.span,
        y: GROUND - o.base - Math.sin(k * Math.PI) * o.height,
        got: false,
        phase: i * 0.7
      });
    }
  }

  function starLine(list, start, count, gap, y) {
    for (let i = 0; i < count; i++) {
      list.push({
        x: start + i * (gap || 58),
        y: y || GROUND - 55,
        got: false,
        phase: i * 0.8
      });
    }
  }

  function build() {
    const hazards = [
      // 소개 뒤 첫 연습: 한 번에 하나씩, 넉넉한 간격
      { x: 3300, type: 'small', w: 28, h: 38, group: '첫 바위' },
      { x: 4080, type: 'small', w: 30, h: 43, group: '첫 바위' },
      { x: 4820, type: 'tall',  w: 34, h: 62, group: '큰 바위' },

      // 낙하 바위를 본 뒤 응용
      { x: 7140, type: 'wide',  w: 43, h: 44, group: '낙하 바위' },
      { x: 7880, type: 'small', w: 28, h: 40, group: '두 바위' },
      { x: 8175, type: 'small', w: 28, h: 43, group: '두 바위' },
      { x: 8840, type: 'tall',  w: 34, h: 65, group: '큰 바위' },

      // 휴식 뒤 절정: 이미 배운 리듬만 짧게 연결
      { x: 10440, type: 'small', w: 29, h: 42, group: '마지막 길' },
      { x: 11010, type: 'wide', w: 46, h: 46, group: '마지막 길' },
      { x: 11720, type: 'small', w: 29, h: 42, group: '마지막 길' },
      { x: 12030, type: 'tall', w: 34, h: 61, group: '마지막 길' }
    ];

    const drops = [
      // 첫 낙하는 앞에서 시범만 보이고 곧 부서진다.
      { x: 6100, demo: true, trigger: 1180, warn: 1.85, fall: 0.52, state: 'waiting', age: 0 },
      { x: 7420, demo: false, trigger: 1050, warn: 1.55, fall: 0.5, state: 'waiting', age: 0 },
      { x: 9160, demo: false, trigger: 1020, warn: 1.5, fall: 0.48, state: 'waiting', age: 0 },
      { x: 11340, demo: false, trigger: 1080, warn: 1.42, fall: 0.46, state: 'waiting', age: 0 }
    ];

    const stars = [];
    // 0~12초: 실패 없는 구간. 낮은 줄 → 완만한 아치 → 높은 아치.
    starLine(stars, 620, 5, 62, GROUND - 54);
    starArc(stars, 1510, { count: 6, span: 330, height: 88, base: 48 });
    starArc(stars, 2490, { count: 7, span: 360, height: 126, base: 50 });

    starArc(stars, 3300, { count: 5, span: 255, height: 104 });
    starArc(stars, 4080, { count: 5, span: 250, height: 108 });
    starArc(stars, 4820, { count: 6, span: 285, height: 132 });

    // 첫 체크포인트: 숨 돌리고 낮은 별을 줍는다.
    starLine(stars, 5350, 7, 60, GROUND - 53);
    starArc(stars, 6100, { count: 6, span: 290, height: 114 });
    starArc(stars, 7140, { count: 5, span: 275, height: 108 });
    starArc(stars, 8025, { count: 7, span: 490, height: 122 });
    starArc(stars, 8840, { count: 6, span: 290, height: 132 });

    // 두 번째 체크포인트와 피날레 직전의 쉼.
    starLine(stars, 9700, 7, 60, GROUND - 54);
    starArc(stars, 10440, { count: 5, span: 250, height: 105 });
    starArc(stars, 11010, { count: 5, span: 275, height: 114 });
    starArc(stars, 11870, { count: 8, span: 560, height: 132 });
    starLine(stars, 12430, 6, 62, GROUND - 58);

    return {
      ground: GROUND,
      total: TOTAL,
      checkpoints: checkpoints.slice(),
      hazards: hazards.map(h => Object.assign({ hit: false, near: false, dead: false }, h)),
      drops: drops.map(d => Object.assign({}, d)),
      stars,
      safeUntil: 3150,
      restZones: [
        { from: 5200, to: 5850 },
        { from: 9600, to: 10200 }
      ]
    };
  }

  ODY.Levels.cyclops = { build, GROUND, TOTAL };
})();

/* src/stages/runner-controller.js */
// 공용 러너 조작 — 빠른 반응, 코요테 타임, 입력 버퍼, 가변 점프
(function () {
  'use strict';
  window.ODY = window.ODY || {};

  class RunnerController {
    constructor(options) {
      const o = Object.assign({
        x: 245,
        ground: 430,
        jumpVelocity: -780,
        riseGravity: 1850,
        releaseGravity: 4800,
        fallGravity: 2700
      }, options);
      this.baseX = o.x;
      this.ground = o.ground;
      this.jumpVelocity = o.jumpVelocity;
      this.riseGravity = o.riseGravity;
      this.releaseGravity = o.releaseGravity;
      this.fallGravity = o.fallGravity;
      this.sq = ODY.Feel.makeSquash();
      this.onJump = null;
      this.onLand = null;
      this.onStep = null;
      this.reset();
    }

    reset() {
      this.x = this.baseX;
      this.xOffset = 0;
      this.xKick = 0;
      this.y = this.ground;
      this.vy = 0;
      this.grounded = true;
      this.coyote = 0.11;
      this.runPhase = 0;
      this.lastStep = -1;
      this.invin = 0;
      this.hurtTime = 0;
      this.blinkTime = 1.4;
      this.blink = 0;
      this.landTime = 0;
      this.airTime = 0;
      this.sq.sx = 1;
      this.sq.sy = 1;
      this.sq.vx = 0;
      this.sq.vy = 0;
    }

    hurt() {
      this.invin = 1.45;
      this.hurtTime = 0.52;
      this.xKick = -25;
      ODY.Feel.squash(this.sq, 1.28, 0.72);
    }

    update(dt, speed, canControl) {
      const E = ODY.E;
      const F = ODY.Feel;
      canControl = canControl !== false;

      this.invin = Math.max(0, this.invin - dt);
      this.hurtTime = Math.max(0, this.hurtTime - dt);
      this.landTime = Math.max(0, this.landTime - dt);

      // 좌우는 필수가 아닌 작은 위치 보정이다. 누르자마자 반응하고 놓으면 돌아온다.
      let targetOffset = 0;
      if (canControl && E.input.held('left')) targetOffset -= 48;
      if (canControl && E.input.held('right')) targetOffset += 58;
      this.xOffset = F.damp(this.xOffset, targetOffset, 14, dt);
      this.xKick = F.damp(this.xKick, 0, 9, dt);
      this.x = this.baseX + this.xOffset + this.xKick;

      if (this.grounded) {
        this.coyote = 0.11;
        this.airTime = 0;
      } else {
        this.coyote = Math.max(0, this.coyote - dt);
        this.airTime += dt;
      }

      if (canControl && E.input.buffered('jump', 0.16) && this.coyote > 0) {
        E.input.consume('jump');
        this.vy = this.jumpVelocity;
        this.grounded = false;
        this.coyote = 0;
        this.airTime = 0;
        F.squash(this.sq, 0.76, 1.29);
        if (this.onJump) this.onJump();
      }

      let gravity = this.fallGravity;
      if (this.vy < 0) {
        gravity = E.input.held('jump') ? this.riseGravity : this.releaseGravity;
      }
      if (!this.grounded && E.input.held('down')) gravity *= 1.18;

      const beforeVy = this.vy;
      this.vy += gravity * dt;
      this.y += this.vy * dt;

      if (this.y >= this.ground) {
        this.y = this.ground;
        this.vy = 0;
        if (!this.grounded) {
          const strength = ODY.Feel.clamp(Math.abs(beforeVy) / 760, 0.55, 1.25);
          this.grounded = true;
          this.landTime = 0.13;
          F.squash(this.sq, 1.27, 0.73);
          if (this.onLand) this.onLand(strength);
        }
        this.grounded = true;
      }

      if (this.grounded) {
        this.runPhase += dt * (7.2 + speed * 0.012);
        const stepIndex = Math.floor(this.runPhase / Math.PI);
        if (stepIndex !== this.lastStep) {
          this.lastStep = stepIndex;
          if (this.onStep) this.onStep(stepIndex & 1);
        }
      }

      this.blinkTime -= dt;
      if (this.blinkTime <= 0 && this.blink <= 0) {
        this.blink = 0.11;
        this.blinkTime = 1.8 + (Math.sin(ODY.E.time * 7.31) + 1) * 0.7;
      }
      this.blink = Math.max(0, this.blink - dt);
      F.updSquash(this.sq, dt);
    }
  }

  ODY.RunnerController = RunnerController;
})();

  <script>
/* src/stages/cyclops-art.js */
// 키클롭스 동굴 — 순수 Canvas 그림과 애니메이션
(function () {
  'use strict';
  window.ODY = window.ODY || {};
  ODY.Art = ODY.Art || {};
  const A = {};
  const TAU = Math.PI * 2;
  const INK = '#342442';
  let paperTexture = null;
  let backgroundGradient = null;
  let groundGradient = null;

  function wrap(value, span) {
    return ((value % span) + span) % span;
  }

  function makeTexture() {
    if (paperTexture) return;
    paperTexture = document.createElement('canvas');
    paperTexture.width = 480;
    paperTexture.height = 270;
    const tx = paperTexture.getContext('2d');
    let seed = 8231;
    function rnd() {
      seed = (seed * 1664525 + 1013904223) >>> 0;
      return seed / 4294967296;
    }
    tx.clearRect(0, 0, 480, 270);
    for (let i = 0; i < 560; i++) {
      const light = rnd() > 0.48;
      tx.fillStyle = light ? 'rgba(255,255,255,0.04)' : 'rgba(24,15,44,0.035)';
      tx.beginPath();
      tx.arc(rnd() * 480, rnd() * 270, 0.4 + rnd() * 1.25, 0, TAU);
      tx.fill();
    }
  }

  A.drawBackground = function (ctx, view) {
    const W = 960, H = 540;
    const d = view.dist;
    const t = view.time;
    if (!backgroundGradient) {
      backgroundGradient = ctx.createLinearGradient(0, 0, 0, H);
      backgroundGradient.addColorStop(0, '#211a3a');
      backgroundGradient.addColorStop(0.55, '#35284e');
      backgroundGradient.addColorStop(1, '#59405f');
    }
    ctx.fillStyle = backgroundGradient;
    ctx.fillRect(0, 0, W, H);

    // 먼 벽의 넓은 색면
    ctx.fillStyle = '#2b2244';
    ctx.beginPath();
    ctx.moveTo(0, 356);
    for (let x = -80; x <= W + 80; x += 90) {
      const wx = x + wrap(-d * 0.12, 180);
      const y = 255 + Math.sin((x + d * 0.12) * 0.012) * 45;
      ctx.quadraticCurveTo(wx + 45, y - 36, wx + 90, 354);
    }
    ctx.lineTo(W, H); ctx.lineTo(0, H); ctx.closePath(); ctx.fill();

    // 먼 돌기둥 — 플레이 길과 다른 속도로 움직인다.
    for (let i = 0; i < 7; i++) {
      const sx = wrap(i * 260 - d * 0.2, 1820) - 180;
      const height = 150 + (i * 43) % 90;
      ctx.fillStyle = i % 2 ? '#312748' : '#2d2345';
      ctx.beginPath();
      ctx.moveTo(sx - 72, view.ground + 8);
      ctx.quadraticCurveTo(sx - 66, view.ground - height * 0.66, sx - 36, view.ground - height);
      ctx.lineTo(sx + 38, view.ground - height + 12);
      ctx.quadraticCurveTo(sx + 68, view.ground - height * 0.5, sx + 82, view.ground + 8);
      ctx.closePath(); ctx.fill();
    }

    // 수정 무리
    for (let i = 0; i < 9; i++) {
      const sx = wrap(i * 330 + 120 - d * 0.28, 2970) - 160;
      const sy = 156 + (i * 73) % 160;
      const pulse = 0.52 + Math.sin(t * 2 + i) * 0.12;
      const color = i % 2 ? '#a998e1' : '#82d4d2';
      ctx.save();
      ctx.translate(sx, sy);
      ctx.globalAlpha = pulse;
      ctx.fillStyle = color;
      for (let j = 0; j < 3; j++) {
        ctx.rotate(0.55);
        ctx.beginPath();
        ctx.moveTo(0, -18 - j * 3);
        ctx.lineTo(8, 0);
        ctx.lineTo(0, 16 + j * 2);
        ctx.lineTo(-8, 0);
        ctx.closePath(); ctx.fill();
      }
      ctx.globalAlpha = 0.34;
      ctx.fillStyle = '#fff';
      ctx.beginPath(); ctx.moveTo(-2, -14); ctx.lineTo(2, -9); ctx.lineTo(0, 2); ctx.lineTo(-5, 0); ctx.closePath(); ctx.fill();
      ctx.restore();
    }

    // 중경 바위 아치
    ctx.strokeStyle = '#3b2d54';
    ctx.lineWidth = 48;
    ctx.lineCap = 'round';
    for (let i = 0; i < 5; i++) {
      const sx = wrap(i * 520 - d * 0.45, 2600) - 260;
      ctx.beginPath();
      ctx.arc(sx, view.ground + 40, 165 + (i % 2) * 35, Math.PI * 1.08, Math.PI * 1.92);
      ctx.stroke();
    }

    // 횃불은 가까운 벽에 붙어 빠르게 흐른다.
    for (let i = 0; i < 6; i++) {
      const sx = wrap(i * 560 + 260 - d * 0.56, 3360) - 240;
      if (sx < -80 || sx > W + 80) continue;
      const sy = 205 + (i % 2) * 38;
      const flicker = 1 + Math.sin(t * 12 + i * 3.7) * 0.08;
      const glow = ctx.createRadialGradient(sx, sy, 3, sx, sy, 112);
      glow.addColorStop(0, 'rgba(255,179,91,0.27)');
      glow.addColorStop(1, 'rgba(255,179,91,0)');
      ctx.fillStyle = glow;
      ctx.fillRect(sx - 115, sy - 115, 230, 230);
      ctx.strokeStyle = '#231a38'; ctx.lineWidth = 8; ctx.lineCap = 'round';
      ctx.beginPath(); ctx.moveTo(sx, sy + 8); ctx.lineTo(sx, sy + 42); ctx.stroke();
      ctx.fillStyle = '#ff965b';
      ctx.beginPath(); ctx.ellipse(sx, sy, 10, 18 * flicker, 0, 0, TAU); ctx.fill();
      ctx.fillStyle = '#ffe071';
      ctx.beginPath(); ctx.ellipse(sx, sy + 4, 5, 9 * flicker, 0, 0, TAU); ctx.fill();
    }

    // 출구 빛은 마지막 1,400px에서 화면을 실제로 바꾼다.
    const exitX = view.total + 280 - d;
    if (exitX < W + 520) {
      const radius = 520;
      const light = ctx.createRadialGradient(exitX, view.ground - 105, 18, exitX, view.ground - 105, radius);
      light.addColorStop(0, 'rgba(255,250,208,0.98)');
      light.addColorStop(0.24, 'rgba(255,225,150,0.68)');
      light.addColorStop(1, 'rgba(255,214,136,0)');
      ctx.fillStyle = light;
      ctx.fillRect(Math.max(0, exitX - radius), 0, radius * 1.3, H);
      ctx.fillStyle = '#fff5c9';
      ctx.beginPath(); ctx.ellipse(exitX, view.ground - 90, 92, 150, 0, 0, TAU); ctx.fill();
      // 출구 너머 이타카색 바다
      ctx.fillStyle = 'rgba(98,177,199,0.62)';
      ctx.beginPath(); ctx.ellipse(exitX + 28, view.ground - 18, 74, 35, 0, 0, TAU); ctx.fill();
    }

    makeTexture();
    ctx.save();
    ctx.globalAlpha = 0.5;
    ctx.drawImage(paperTexture, 0, 0, W, H);
    ctx.restore();
  };

  A.drawCyclops = function (ctx, view) {
    const climax = ODY.Feel.clamp01((view.dist - 10150) / 1700);
    const x = 30 - view.dist * 0.002 + climax * 22;
    const y = view.ground + 18;
    const scale = 0.83 + climax * 0.1;
    const wind = view.windup || 0;
    const t = view.time;
    ctx.save();
    ctx.translate(x, y);
    ctx.scale(scale, scale);
    ctx.globalAlpha = 0.72 + climax * 0.13;
    // 그림자
    ctx.fillStyle = 'rgba(19,12,33,0.34)';
    ctx.beginPath(); ctx.ellipse(0, 2, 105, 18, 0, 0, TAU); ctx.fill();
    ctx.translate(0, Math.sin(t * 2.1) * 3 - wind * 12);

    const body = ctx.createLinearGradient(-50, -235, 60, 0);
    body.addColorStop(0, '#a592bf');
    body.addColorStop(1, '#70608e');
    ctx.fillStyle = body; ctx.strokeStyle = INK; ctx.lineWidth = 5;
    ctx.beginPath(); ctx.ellipse(0, -112, 101, 133, 0, 0, TAU); ctx.fill(); ctx.stroke();
    ctx.fillStyle = 'rgba(236,216,236,0.28)';
    ctx.beginPath(); ctx.ellipse(7, -72, 58, 64, 0, 0, TAU); ctx.fill();

    // 뒤쪽 팔과 바위
    const armAngle = 0.82 - wind * 2.15;
    const handX = 63 + Math.cos(armAngle) * 86;
    const handY = -144 + Math.sin(armAngle) * 86;
    ctx.lineCap = 'round';
    ctx.strokeStyle = INK; ctx.lineWidth = 36;
    ctx.beginPath(); ctx.moveTo(58, -146); ctx.lineTo(handX, handY); ctx.stroke();
    ctx.strokeStyle = '#8977a8'; ctx.lineWidth = 27;
    ctx.beginPath(); ctx.moveTo(58, -146); ctx.lineTo(handX, handY); ctx.stroke();
    if (wind > 0.08) {
      ctx.fillStyle = '#bc8f87'; ctx.strokeStyle = INK; ctx.lineWidth = 4;
      ctx.beginPath(); ctx.arc(handX + Math.cos(armAngle) * 19, handY + Math.sin(armAngle) * 19, 25, 0, TAU);
      ctx.fill(); ctx.stroke();
    }

    // 귀와 머리카락
    ctx.fillStyle = '#8977a8'; ctx.strokeStyle = INK; ctx.lineWidth = 4;
    ctx.beginPath(); ctx.ellipse(-92, -164, 15, 21, -0.25, 0, TAU); ctx.fill(); ctx.stroke();
    ctx.fillStyle = '#5e4f80';
    ctx.beginPath();
    ctx.moveTo(-62, -222);
    ctx.quadraticCurveTo(-47, -257, -20, -239);
    ctx.quadraticCurveTo(3, -263, 24, -240);
    ctx.quadraticCurveTo(49, -253, 61, -218);
    ctx.quadraticCurveTo(0, -239, -62, -222);
    ctx.closePath(); ctx.fill(); ctx.stroke();

    // 하나뿐인 눈. 던질 때만 살짝 뜬다.
    ctx.fillStyle = '#fff8df'; ctx.strokeStyle = INK; ctx.lineWidth = 5;
    if (wind > 0.42) {
      ctx.beginPath(); ctx.ellipse(8, -178, 29, 21 * wind, 0, 0, TAU); ctx.fill(); ctx.stroke();
      ctx.fillStyle = '#65a8b6';
      ctx.beginPath(); ctx.arc(11, -177, 10, 0, TAU); ctx.fill();
      ctx.fillStyle = INK; ctx.beginPath(); ctx.arc(13, -177, 5, 0, TAU); ctx.fill();
    } else {
      ctx.beginPath(); ctx.arc(8, -181, 28, 0.12 * Math.PI, 0.88 * Math.PI); ctx.stroke();
      ctx.lineWidth = 3.5;
      for (const lx of [-12, 8, 28]) {
        ctx.beginPath(); ctx.moveTo(lx, -161); ctx.lineTo(lx, -150); ctx.stroke();
      }
    }

    ctx.fillStyle = 'rgba(255,133,153,0.28)';
    ctx.beginPath(); ctx.arc(-43, -139, 12, 0, TAU); ctx.arc(59, -139, 12, 0, TAU); ctx.fill();
    ctx.strokeStyle = INK; ctx.lineWidth = 5; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.arc(18, -121, 12, 0.08 * Math.PI, 0.92 * Math.PI); ctx.stroke();
    if (wind < 0.25) {
      const bubble = (t * 0.72) % 1;
      ctx.globalAlpha = (1 - bubble) * 0.55;
      ctx.fillStyle = '#d9ecff';
      ctx.beginPath(); ctx.arc(53 + bubble * 15, -154 - bubble * 26, 5 + bubble * 8, 0, TAU); ctx.fill();
    }
    ctx.restore();
  };

  A.drawGround = function (ctx, view) {
    const W = 960, H = 540, y = view.ground;
    if (!groundGradient) {
      groundGradient = ctx.createLinearGradient(0, y, 0, H);
      groundGradient.addColorStop(0, '#6f5275');
      groundGradient.addColorStop(0.22, '#4c395d');
      groundGradient.addColorStop(1, '#2d243f');
    }
    ctx.fillStyle = groundGradient;
    ctx.fillRect(0, y, W, H - y);
    ctx.fillStyle = '#9d7893';
    ctx.fillRect(0, y, W, 5);
    ctx.fillStyle = 'rgba(27,17,42,0.38)';
    ctx.fillRect(0, y + 5, W, 8);

    // 큰 판석은 빠르게 흐르며 발의 속도를 보여 준다.
    for (let i = 0; i < 8; i++) {
      const sx = wrap(i * 170 - view.dist, 1360) - 170;
      ctx.strokeStyle = 'rgba(31,21,48,0.46)';
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.moveTo(sx, y + 8);
      ctx.quadraticCurveTo(sx + 14, y + 46, sx - 8, H);
      ctx.stroke();
      ctx.fillStyle = 'rgba(213,183,207,0.08)';
      ctx.beginPath(); ctx.ellipse(sx + 65, y + 43 + (i % 3) * 15, 17, 6, -0.2, 0, TAU); ctx.fill();
    }
  };

  A.drawForeground = function (ctx, view) {
    const t = view.time;
    // 천장 가까운 바위가 가장 빠른 패럴랙스를 만든다.
    ctx.fillStyle = '#181329';
    for (let i = 0; i < 9; i++) {
      const sx = wrap(i * 290 - view.dist * 0.82, 2610) - 145;
      const h = 33 + (i * 31) % 70;
      ctx.beginPath();
      ctx.moveTo(sx - 35, -8); ctx.lineTo(sx + 38, -8);
      ctx.quadraticCurveTo(sx + 16, h * 0.55, sx, h);
      ctx.quadraticCurveTo(sx - 13, h * 0.52, sx - 35, -8);
      ctx.closePath(); ctx.fill();
    }
    // 먼지 빛알
    ctx.fillStyle = '#dccbff';
    for (let i = 0; i < 14; i++) {
      const x = wrap(i * 197 - view.dist * 0.65 - t * 7, 1080) - 60;
      const y = 80 + (i * 79) % 300 + Math.sin(t + i) * 9;
      ctx.globalAlpha = 0.08 + (i % 3) * 0.035;
      ctx.beginPath(); ctx.arc(x, y, 1.5 + (i % 2), 0, TAU); ctx.fill();
    }
    ctx.globalAlpha = 1;
  };

  A.drawHazard = function (ctx, hazard, sx, ground, time) {
    if (hazard.dead) return;
    const pulse = hazard.near && !hazard.hit ? 1 + Math.sin(time * 9) * 0.025 : 1;
    const wobble = hazard.wobble || 0;
    ctx.save();
    ctx.translate(sx, ground);
    ctx.rotate(Math.sin(time * 23 + hazard.x) * wobble * 0.035);
    ctx.scale(pulse, pulse);
    // 위험물은 배경 보라색과 반대인 산호빛 테두리다.
    ctx.fillStyle = 'rgba(23,15,37,0.38)';
    ctx.beginPath(); ctx.ellipse(0, 5, hazard.w + 11, 9, 0, 0, TAU); ctx.fill();
    const rock = ctx.createLinearGradient(-hazard.w, -hazard.h, hazard.w, 0);
    rock.addColorStop(0, '#d99a91');
    rock.addColorStop(0.48, '#b98091');
    rock.addColorStop(1, '#755b7d');
    ctx.fillStyle = rock;
    ctx.strokeStyle = '#4b304f';
    ctx.lineWidth = 4;
    ctx.beginPath();
    ctx.moveTo(-hazard.w, 0);
    ctx.quadraticCurveTo(-hazard.w - 5, -hazard.h * 0.66, -hazard.w * 0.43, -hazard.h);
    ctx.quadraticCurveTo(0, -hazard.h - 8, hazard.w * 0.52, -hazard.h * 0.93);
    ctx.quadraticCurveTo(hazard.w + 7, -hazard.h * 0.62, hazard.w, 0);
    ctx.closePath(); ctx.fill(); ctx.stroke();
    // 따뜻한 가장자리와 귀여운 졸린 얼굴
    ctx.strokeStyle = 'rgba(255,218,180,0.58)';
    ctx.lineWidth = 4; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.arc(-hazard.w * 0.16, -hazard.h * 0.56, hazard.h * 0.39, Math.PI * 1.14, Math.PI * 1.58); ctx.stroke();
    ctx.strokeStyle = '#5b3c57'; ctx.lineWidth = 2.5;
    const faceY = -hazard.h * 0.45;
    ctx.beginPath(); ctx.arc(-9, faceY, 5, 0.12 * Math.PI, 0.88 * Math.PI); ctx.stroke();
    ctx.beginPath(); ctx.arc(9, faceY, 5, 0.12 * Math.PI, 0.88 * Math.PI); ctx.stroke();
    ctx.beginPath(); ctx.arc(0, faceY + 9, 5, Math.PI * 1.15, Math.PI * 1.85); ctx.stroke();
    ctx.restore();
  };

  A.drawDrop = function (ctx, drop, sx, ground, time) {
    if (drop.state === 'waiting' || drop.state === 'gone') return;
    const warnP = drop.state === 'warning'
      ? ODY.Feel.clamp01(drop.age / (drop.activeWarn || drop.warn))
      : 1;
    // 산호빛 착지 링 + 세 번의 박자 표시. 별과 다른 색으로 위험을 즉시 읽게 한다.
    ctx.save();
    ctx.translate(sx, ground + 3);
    const beam = ctx.createLinearGradient(0, -185, 0, 0);
    beam.addColorStop(0, 'rgba(255,132,129,0)');
    beam.addColorStop(0.55, 'rgba(255,132,129,0.16)');
    beam.addColorStop(1, 'rgba(255,196,153,0.52)');
    ctx.globalAlpha = 0.55 + warnP * 0.38;
    ctx.fillStyle = beam;
    ctx.fillRect(-31 - warnP * 8, -190, 62 + warnP * 16, 190);
    ctx.strokeStyle = '#ff9b83';
    ctx.lineWidth = 6;
    ctx.globalAlpha = 0.68 + warnP * 0.3;
    ctx.beginPath(); ctx.ellipse(0, 0, 36 + warnP * 28, 12 + warnP * 7, 0, 0, TAU); ctx.stroke();
    ctx.globalAlpha = 0.27 + 0.2 * Math.sin(time * 14);
    ctx.fillStyle = '#ffc6a2';
    ctx.beginPath(); ctx.ellipse(0, 0, 54 + warnP * 12, 15 + warnP * 5, 0, 0, TAU); ctx.fill();
    ctx.restore();

    if (drop.state === 'warning') {
      const tick = Math.min(2, Math.floor(warnP * 3));
      for (let i = 0; i < 3; i++) {
        ctx.globalAlpha = i <= tick ? 0.9 : 0.24;
        ctx.fillStyle = '#ffe17a';
        ctx.beginPath();
        ctx.moveTo(sx + (i - 1) * 22, ground - 52);
        ctx.lineTo(sx - 7 + (i - 1) * 22, ground - 65);
        ctx.lineTo(sx + 7 + (i - 1) * 22, ground - 65);
        ctx.closePath(); ctx.fill();
      }
      ctx.globalAlpha = 1;
    }

    if (drop.state === 'falling') {
      const k = ODY.Feel.clamp01(drop.age / drop.fall);
      const y = -52 + ODY.Feel.ease.inCubic(k) * (ground - 55 + 52);
      ctx.strokeStyle = 'rgba(255,224,151,0.52)';
      ctx.lineWidth = 4; ctx.lineCap = 'round';
      for (let i = -1; i <= 1; i++) {
        ctx.beginPath(); ctx.moveTo(sx + i * 15, y - 65); ctx.lineTo(sx + i * 10, y - 34); ctx.stroke();
      }
      ctx.fillStyle = '#c58d8e'; ctx.strokeStyle = '#4b304f'; ctx.lineWidth = 4;
      ctx.beginPath(); ctx.arc(sx, y, 28, 0, TAU); ctx.fill(); ctx.stroke();
      ctx.fillStyle = 'rgba(255,222,190,0.5)';
      ctx.beginPath(); ctx.arc(sx - 9, y - 10, 7, 0, TAU); ctx.fill();
    }
  };

  A.drawWisdomStar = function (ctx, star, sx, time, magnet) {
    const bob = Math.sin(time * 3.5 + star.phase) * 5;
    const x = magnet ? star.drawX : sx;
    const y = (magnet ? star.drawY : star.y) + bob;
    const glow = ctx.createRadialGradient(x, y, 2, x, y, 29);
    glow.addColorStop(0, 'rgba(255,229,117,0.5)');
    glow.addColorStop(1, 'rgba(255,229,117,0)');
    ctx.fillStyle = glow; ctx.fillRect(x - 30, y - 30, 60, 60);
    ODY.UI.drawStar(ctx, x, y, 13 + Math.sin(time * 4 + star.phase) * 1.2, time * 1.5 + star.phase, '#ffe06b');
  };

  A.drawHero = function (ctx, player, time) {
    const F = ODY.Feel;
    const height = player.ground - player.y;
    const shadow = Math.max(0.34, 1 - height / 230);
    ctx.fillStyle = 'rgba(20,13,34,' + (0.34 * shadow) + ')';
    ctx.beginPath(); ctx.ellipse(player.x, player.ground + 7, 34 * shadow, 9 * shadow, 0, 0, TAU); ctx.fill();

    const phase = player.runPhase;
    const stride = player.grounded ? Math.sin(phase) : 0;
    const push = player.grounded ? Math.cos(phase) : 0;
    const bob = player.grounded ? -Math.abs(Math.sin(phase)) * 4 : 0;
    const hurt = player.hurtTime > 0;
    let poseScaleX = player.sq.sx;
    let poseScaleY = player.sq.sy;
    if (!player.grounded) {
      const stretch = F.clamp(Math.abs(player.vy) / 900, 0, 1) * 0.07;
      poseScaleX *= 1 - stretch * 0.55;
      poseScaleY *= 1 + stretch;
    }

    ctx.save();
    ctx.translate(player.x, player.y + bob);
    ctx.scale(poseScaleX, poseScaleY);
    if (hurt) ctx.rotate(-0.16);
    else if (!player.grounded) ctx.rotate(player.vy < -80 ? -0.08 : 0.08);
    else ctx.rotate(0.035 + push * 0.018);

    const blinkAlpha = player.invin > 0 ? 0.62 + Math.sin(time * 18) * 0.24 : 1;
    ctx.globalAlpha = blinkAlpha;
    // 망토 후행
    const capeLag = player.grounded ? stride * 6 : F.clamp(player.vy / 90, -8, 8);
    ctx.fillStyle = '#e65d70'; ctx.strokeStyle = INK; ctx.lineWidth = 4; ctx.lineJoin = 'round';
    ctx.beginPath();
    ctx.moveTo(-9, -64);
    ctx.quadraticCurveTo(-44 - capeLag, -49, -38 - capeLag, -14 + Math.sin(time * 9) * 4);
    ctx.quadraticCurveTo(-19, -24, -6, -32);
    ctx.closePath(); ctx.fill(); ctx.stroke();

    function limb(x1, y1, x2, y2, width, skin) {
      ctx.strokeStyle = INK; ctx.lineWidth = width + 5; ctx.lineCap = 'round';
      ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke();
      ctx.strokeStyle = skin; ctx.lineWidth = width;
      ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke();
    }

    // 다리는 키 포즈를 지나며 접지와 공중 모양이 분명하다.
    if (player.grounded) {
      limb(-7, -23, -8 + stride * 20, -2, 8, '#e7a77e');
      limb(8, -23, 8 - stride * 20, -2, 8, '#e7a77e');
    } else if (player.vy < 20) {
      limb(-7, -23, -17, -7, 8, '#e7a77e');
      limb(8, -23, 17, -12, 8, '#e7a77e');
    } else {
      limb(-7, -23, -13, -3, 8, '#e7a77e');
      limb(8, -23, 15, -1, 8, '#e7a77e');
    }

    // 튜닉
    const tunic = ctx.createLinearGradient(0, -67, 0, -21);
    tunic.addColorStop(0, '#7bc2df'); tunic.addColorStop(1, '#457eae');
    ctx.fillStyle = tunic; ctx.strokeStyle = INK; ctx.lineWidth = 4;
    ODY.UI.rr(ctx, -22, -69, 44, 48, 13); ctx.fill(); ctx.stroke();
    ctx.fillStyle = '#f5bd4d'; ctx.fillRect(-22, -39, 44, 8);
    ctx.strokeStyle = INK; ctx.lineWidth = 2.5; ctx.strokeRect(-22, -39, 44, 8);

    // 팔
    if (hurt) {
      limb(-13, -61, -33, -75, 7, '#f3c299');
      limb(13, -61, 31, -78, 7, '#f3c299');
    } else if (player.grounded) {
      limb(-13, -61, -25 - stride * 12, -40, 7, '#f3c299');
      limb(13, -61, 27 + stride * 12, -46, 7, '#f3c299');
    } else {
      limb(-13, -61, -28, -73, 7, '#f3c299');
      limb(13, -61, 30, -75, 7, '#f3c299');
    }

    // 머리와 머리띠
    ctx.fillStyle = '#f5c59e'; ctx.strokeStyle = INK; ctx.lineWidth = 4;
    ctx.beginPath(); ctx.arc(3, -91, 25, 0, TAU); ctx.fill(); ctx.stroke();
    ctx.fillStyle = '#75472d';
    ctx.beginPath(); ctx.arc(3, -96, 25, Math.PI * 0.97, Math.PI * 2.03); ctx.fill();
    ctx.strokeStyle = '#d85865'; ctx.lineWidth = 7; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.arc(3, -92, 22, Math.PI * 1.04, Math.PI * 1.91); ctx.stroke();
    // 리본은 몸보다 한 박자 늦게 흔들린다.
    ctx.fillStyle = '#d85865'; ctx.strokeStyle = INK; ctx.lineWidth = 2.5;
    ctx.beginPath();
    ctx.moveTo(-18, -105); ctx.lineTo(-35 - stride * 5, -112 + Math.sin(time * 7) * 3);
    ctx.lineTo(-27, -96); ctx.closePath(); ctx.fill(); ctx.stroke();
    // 볼과 얼굴
    ctx.fillStyle = 'rgba(255,122,137,0.4)';
    ctx.beginPath(); ctx.arc(-6, -83, 4, 0, TAU); ctx.arc(17, -83, 4, 0, TAU); ctx.fill();
    ctx.strokeStyle = '#553647'; ctx.fillStyle = '#39263d'; ctx.lineWidth = 2.5;
    if (hurt) {
      ctx.beginPath(); ctx.moveTo(3, -92); ctx.lineTo(10, -87); ctx.moveTo(18, -92); ctx.lineTo(11, -87); ctx.stroke();
      ctx.beginPath(); ctx.arc(11, -79, 4, 0, TAU); ctx.fill();
    } else if (player.blink > 0) {
      ctx.beginPath(); ctx.moveTo(2, -89); ctx.lineTo(8, -89); ctx.moveTo(15, -89); ctx.lineTo(21, -89); ctx.stroke();
    } else {
      ctx.beginPath(); ctx.arc(6, -90, 3, 0, TAU); ctx.arc(17, -90, 3, 0, TAU); ctx.fill();
      ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(7, -91, 1, 0, TAU); ctx.arc(18, -91, 1, 0, TAU); ctx.fill();
      ctx.beginPath(); ctx.arc(12, -82, 5, 0.15 * Math.PI, 0.82 * Math.PI); ctx.stroke();
    }
    ctx.restore();
  };

  A.drawSilentJumpHint = function (ctx, view, player) {
    if (view.hasJumped || view.dist < 1080 || view.dist > 2780) return;
    const alpha = ODY.Feel.clamp01((view.dist - 1080) / 240) *
      ODY.Feel.clamp01((2780 - view.dist) / 260);
    const x = player.x + 120;
    const y = player.ground - 92 - Math.sin(view.time * 3) * 6;
    ctx.save();
    ctx.globalAlpha = alpha * (0.66 + Math.sin(view.time * 5) * 0.16);
    ctx.fillStyle = 'rgba(255,244,190,0.19)';
    ctx.beginPath(); ctx.arc(x, y, 35, 0, TAU); ctx.fill();
    ctx.strokeStyle = '#ffe58d'; ctx.lineWidth = 4;
    ctx.beginPath(); ctx.arc(x, y, 31, 0, TAU); ctx.stroke();
    ctx.fillStyle = '#fff5c8';
    ctx.font = '900 38px "Malgun Gothic", sans-serif';
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText('↑', x, y - 1);
    ctx.restore();
    ctx.textBaseline = 'alphabetic';
    ODY.UI.drawOwl(ctx, x + 72, y - 54, 0.44, view.time, true);
  };

  ODY.Art.cyclops = A;
})();

</script>
  <script>
/* src/stages/cyclops.js */
// 스테이지 1 — 키클롭스 동굴 탈출
// 소개 → 안전한 별길 → 바위 연습 → 낙하 바위 응용 → 쉼 → 짧은 절정 → 빛
(function () {
  'use strict';
  window.ODY = window.ODY || {};
  ODY.Stages = ODY.Stages || {};

  ODY.Stages.cyclops = function (options) {
    const E = ODY.E;
    const F = ODY.Feel;
    const S = ODY.Snd;
    const UI = ODY.UI;
    const Art = ODY.Art.cyclops;
    const W = E.W, H = E.H;
    const level = ODY.Levels.cyclops.build();
    const player = new ODY.RunnerController({ x: 245, ground: level.ground });

    let simTime = 0;
    let uiTime = 0;
    let state = 'intro';
    let stateTime = 0;
    let stateBeforePause = 'run';
    let dist = 0;
    let currentSpeed = 0;
    let assist = 1;
    let assistTarget = 1;
    let hitSlow = 1;
    let hearts = 5;
    let starsGot = 0;
    let combo = 0;
    let comboTime = 0;
    let rescues = 0;
    let checkpointIndex = 0;
    let hasJumped = false;
    let hintTime = 0;
    let hintText = '';
    let finishSent = false;
    let clearBurst = false;
    let camY = 0;
    let pauseInputLock = 0;
    let musicBand = -1;
    const failures = Object.create(null);
    const warnedGroups = Object.create(null);

    const mute = UI.makeMuteBtn();
    const rescueButton = new UI.Button({
      x: W * 0.5, y: 411, w: 260, h: 68,
      label: '다시 가자', size: 28, color: '#77c8ee',
      onTap: resumeFromRescue
    });
    const resumeButton = new UI.Button({
      x: W * 0.5, y: 357, w: 244, h: 66,
      label: '계속하기', size: 27, color: '#7ed9aa',
      onTap: resumeFromPause
    });

    const pauseButton = {
      x: W - 106, y: 40, r: 25,
      sq: F.makeSquash(),
      pointer(type, x, y) {
        if (type !== 'down') return false;
        if ((x - this.x) ** 2 + (y - this.y) ** 2 <= (this.r + 9) ** 2) {
          F.squash(this.sq, 0.86, 0.86);
          if (state === 'paused') resumeFromPause();
          else pauseGame();
          S.click();
          return true;
        }
        return false;
      },
      update(dt) { F.updSquash(this.sq, dt); },
      draw(ctx) {
        ctx.save();
        ctx.translate(this.x, this.y);
        ctx.scale(this.sq.sx, this.sq.sy);
        ctx.fillStyle = 'rgba(28,18,49,0.64)';
        ctx.beginPath(); ctx.arc(0, 0, this.r, 0, Math.PI * 2); ctx.fill();
        ctx.strokeStyle = 'rgba(255,255,255,0.42)'; ctx.lineWidth = 2; ctx.stroke();
        ctx.fillStyle = '#fff6dc';
        ctx.fillRect(-8, -10, 5, 20);
        ctx.fillRect(3, -10, 5, 20);
        ctx.restore();
      }
    };

    const jumpButton = {
      x: W - 88, y: H - 86, r: 58,
      pointerId: null,
      down: false,
      contains(x, y) {
        return (x - this.x) ** 2 + (y - this.y) ** 2 <= (this.r + 10) ** 2;
      },
      pointer(type, x, y, pointerId) {
        if (type === 'down' && this.contains(x, y)) {
          this.pointerId = pointerId;
          this.down = true;
          E.input.setHeld('jump', true);
          return true;
        }
        if ((type === 'up' || type === 'cancel') &&
            (this.pointerId === pointerId || this.pointerId === null)) {
          this.pointerId = null;
          this.down = false;
          E.input.setHeld('jump', false);
          return true;
        }
        return false;
      },
      release() {
        this.pointerId = null;
        this.down = false;
        E.input.setHeld('jump', false);
      },
      draw(ctx) {
        const pulse = this.down ? 0.91 : 1 + Math.sin(uiTime * 3) * 0.018;
        ctx.save();
        ctx.translate(this.x, this.y);
        ctx.scale(pulse, pulse);
        ctx.fillStyle = 'rgba(25,17,43,0.36)';
        ctx.beginPath(); ctx.arc(0, 7, this.r + 3, 0, Math.PI * 2); ctx.fill();
        const grad = ctx.createRadialGradient(-14, -18, 4, 0, 0, this.r);
        grad.addColorStop(0, '#fff2a5');
        grad.addColorStop(0.34, '#ffd76b');
        grad.addColorStop(1, '#f0a95a');
        ctx.fillStyle = grad;
        ctx.beginPath(); ctx.arc(0, 0, this.r, 0, Math.PI * 2); ctx.fill();
        ctx.strokeStyle = '#49304d'; ctx.lineWidth = 4; ctx.stroke();
        ctx.fillStyle = '#3a2945';
        ctx.font = '900 31px "Malgun Gothic", sans-serif';
        ctx.textAlign = 'center'; ctx.fillText('↑', 0, -5);
        ctx.font = '900 17px "Malgun Gothic", sans-serif';
        ctx.fillText('점프', 0, 24);
        ctx.restore();
      }
    };

    function targetSpeed() {
      const ramp = F.ease.inOutSine(F.clamp01(dist / level.total));
      return (268 + ramp * 78) * assist * hitSlow;
    }

    function updateMusic(force) {
      let intensity = 0.28;
      if (dist >= 3150 && dist < 6500) intensity = 0.4;
      else if (dist >= 6500 && dist < 9600) intensity = 0.53;
      else if (dist >= 9600) intensity = 0.65;
      if ((dist >= 5200 && dist <= 5850) || (dist >= 9600 && dist <= 10200)) intensity = 0.3;
      const band = Math.round(intensity * 100);
      if (force || band !== musicBand) {
        musicBand = band;
        S.setMusicIntensity(intensity, 0.85);
      }
    }

    function showHint(text) {
      hintText = text;
      hintTime = 4.1;
      S.athena();
      F.sparkle(W * 0.5 - 188, 92, '#d7c8ff', 12);
    }

    function registerFailure(group) {
      failures[group] = (failures[group] || 0) + 1;
      if (failures[group] >= 3 && !warnedGroups[group]) {
        warnedGroups[group] = true;
        assistTarget = Math.max(0.78, assistTarget - 0.08);
        showHint(group === '낙하 바위'
          ? '빛나는 원을 보면 조금 일찍 점프해!'
          : '별이 그린 둥근 길을 따라가 봐!');
      }
    }

    function hit(hazard) {
      if (player.invin > 0 || state !== 'run' || hazard.hit) return;
      hazard.hit = true;
      hearts--;
      hitSlow = 0.7;
      player.hurt();
      registerFailure(hazard.group || '바위');
      F.doHitstop(0.075);
      F.addShake(0.38, -1, -0.2);
      F.flash('#ffb6b3', 0.16);
      F.debris(player.x + 14, player.y - 45, '#d99a91', 9, -1);
      F.pop(player.x, player.y - 118, '괜찮아!', '#fff0a4', 24);
      S.hit();
      if (hearts <= 0) {
        jumpButton.release();
        state = 'rescue';
        stateTime = 0;
        F.pulseSlowmo(0.28, 0.12, 0.25);
        S.setMusicState('rescue');
        S.athena();
        UI.announce('아테나가 도와주러 왔어요. 다시 가자 버튼으로 안전한 곳에서 시작해요.');
      }
    }

    function resumeFromRescue() {
      rescues++;
      if (rescues >= 3) {
        assistTarget = Math.min(assistTarget, 0.8);
        showHint('서두르지 않아도 돼. 별길만 바라봐!');
      }
      let checkpoint = level.checkpoints[checkpointIndex] || 0;
      if (checkpoint > dist) checkpoint = 0;
      dist = checkpoint;
      hearts = 5;
      currentSpeed = 120;
      hitSlow = 1;
      player.reset();
      player.invin = 2;
      UI.announce('하트 다섯 개로 다시 출발해요.');
      jumpButton.release();

      for (let i = level.hazards.length - 1; i >= 0; i--) {
        const hazard = level.hazards[i];
        if (hazard.fromDrop && hazard.x >= checkpoint - 180) {
          level.hazards.splice(i, 1);
        } else if (hazard.x >= checkpoint - 180) {
          hazard.hit = false;
          hazard.dead = false;
          hazard.near = false;
          hazard.wobble = 0;
        }
      }
      for (const drop of level.drops) {
        if (drop.x < checkpoint - 120) {
          drop.state = 'gone';
        } else {
          drop.state = 'waiting';
          drop.age = 0;
          drop.tick = -1;
          delete drop.activeWarn;
        }
      }
      state = 'return';
      stateTime = 0;
      S.setMusicState('play');
      updateMusic(true);
    }

    function pauseGame() {
      if (state === 'paused' || state === 'rescue' || state === 'clear') return;
      stateBeforePause = state;
      state = 'paused';
      jumpButton.release();
      E.input.consume('jump');
      E.input.consume('ok');
      pauseInputLock = 0.2;
      S.pause();
      UI.announce('잠깐 쉬어요. P, Esc, 스페이스바로 계속해요.');
    }

    function resumeFromPause() {
      if (state !== 'paused') return;
      state = stateBeforePause;
      E.input.clearAll();
      S.resume();
      UI.announce('모험을 계속해요.');
    }

    function triggerClear() {
      if (state === 'clear') return;
      state = 'clear';
      stateTime = 0;
      clearBurst = false;
      jumpButton.release();
      S.startBgm('reward', { intensity: 0.36, fade: 0.48 });
      S.clear();
      F.pulseSlowmo(0.3, 0.22, 0.48);
      F.flash('#fff1a8', 0.24);
      F.addShake(0.28, 0.3, -1);
    }

    function updateDrops(dt) {
      for (const drop of level.drops) {
        const sx = drop.x - dist;
        if (drop.state === 'waiting' && sx < drop.trigger && sx > player.x + 170) {
          drop.state = 'warning';
          drop.age = 0;
          drop.tick = 0;
          drop.activeWarn = drop.warn + (1 - assist) * 1.2;
          S.warning(0);
        } else if (drop.state === 'warning') {
          drop.age += dt;
          const warn = drop.activeWarn || drop.warn;
          const nextTick = Math.min(2, Math.floor(drop.age / warn * 3));
          if (nextTick > drop.tick) {
            drop.tick = nextTick;
            S.warning(nextTick);
          }
          if (drop.age >= warn) {
            drop.state = 'falling';
            drop.age = 0;
            S.whoosh();
          }
        } else if (drop.state === 'falling') {
          drop.age += dt;
          if (drop.age >= drop.fall) {
            drop.state = 'landed';
            drop.age = 0;
            const dynamic = {
              x: drop.x,
              type: 'drop',
              w: 31,
              h: 56,
              group: '낙하 바위',
              fromDrop: true,
              solid: !drop.demo,
              crumble: drop.demo ? 0.86 : 3.15,
              hit: false,
              near: false,
              dead: false
            };
            level.hazards.push(dynamic);
            const landX = drop.x - dist;
            F.debris(landX, level.ground - 4, '#c39191', 12);
            F.ring(landX, level.ground - 2, '#ffd96a', 23, 0.35);
            F.addShake(drop.demo ? 0.18 : 0.3, 0, 1);
            S.thud();
          }
        } else if (drop.state === 'landed') {
          drop.age += dt;
          if (drop.age > (drop.demo ? 0.9 : 3.2)) drop.state = 'gone';
        }
      }
    }

    function updateHazards(dt) {
      const pLeft = player.x - 15;
      const pRight = player.x + 16;
      const pTop = player.y - 91;
      const pBottom = player.y - 5;

      for (const hazard of level.hazards) {
        if (hazard.dead) continue;
        if (hazard.crumble !== undefined) {
          hazard.crumble -= dt;
          hazard.wobble = hazard.crumble < 0.48 ? 1 - hazard.crumble / 0.48 : 0;
          if (hazard.crumble <= 0) {
            hazard.dead = true;
            F.debris(hazard.x - dist, level.ground - 8, '#bf8e91', 7);
            continue;
          }
        }

        const sx = hazard.x - dist;
        if (sx < -100 || sx > W + 130) continue;
        hazard.wobble = Math.max(hazard.wobble || 0, F.clamp01((360 - (sx - player.x)) / 280) * 0.2);

        if (hazard.solid !== false && player.invin <= 0 &&
            pRight > sx - hazard.w + 10 &&
            pLeft < sx + hazard.w - 10 &&
            pBottom > level.ground - hazard.h + 11 &&
            pTop < level.ground - 3) {
          hit(hazard);
        }

        if (!hazard.near && !hazard.hit && sx < player.x - hazard.w - 18) {
          hazard.near = true;
          failures[hazard.group || '바위'] = 0;
          if (!player.grounded && player.y > level.ground - hazard.h - 58) {
            F.speedLine(player.x + 28, player.y - 43, '#fff1a3', 360);
            F.pop(player.x + 8, player.y - 105, '멋져!', '#fff0a4', 20);
            S.nearMiss();
          }
        }
      }
    }

    function collectStar(star) {
      star.got = true;
      starsGot++;
      combo = comboTime > 0 ? Math.min(3, combo + 1) : 0;
      comboTime = 0.78;
      F.sparkle(star.drawX, star.drawY, '#ffe06b', 11);
      F.ring(star.drawX, star.drawY, '#fff4ae', 11, 0.24);
      S.pickup(combo);
    }

    function updateStars(dt) {
      for (const star of level.stars) {
        if (star.got) continue;
        const sx = star.x - dist;
        if (sx < -90 || sx > W + 100) continue;
        const targetY = player.y - 53;
        const dx = sx - player.x;
        const dy = star.y - targetY;
        // 처음에는 별이 점프 길을 또렷하게 가르치고, 한 번 뛴 뒤에만 살짝 돕는다.
        const magnetRadius = hasJumped ? 66 : 0;
        if (!star.magnet && magnetRadius > 0 && dx * dx + dy * dy < magnetRadius * magnetRadius) {
          star.magnet = true;
          star.drawX = sx;
          star.drawY = star.y;
        }
        if (star.magnet) {
          // 월드가 흐르는 만큼 먼저 보정한 뒤 플레이어로 부드럽게 당긴다.
          star.drawX -= currentSpeed * dt;
          star.drawX = F.damp(star.drawX, player.x, 13, dt);
          star.drawY = F.damp(star.drawY, targetY, 13, dt);
          if ((star.drawX - player.x) ** 2 + (star.drawY - targetY) ** 2 < 24 * 24) {
            collectStar(star);
          }
        } else if (dx * dx + dy * dy < 39 * 39) {
          star.drawX = sx;
          star.drawY = star.y;
          collectStar(star);
        }
      }
    }

    function updateCheckpoints() {
      const next = checkpointIndex + 1;
      if (next < level.checkpoints.length && dist >= level.checkpoints[next]) {
        checkpointIndex = next;
        hearts = Math.min(5, hearts + 1);
        F.pop(player.x + 15, player.y - 122, '숨 돌리자!', '#bff6dc', 21);
        F.sparkle(player.x, player.y - 65, '#bcefdc', 13);
        S.athena();
      }
    }

    function updateWorld(dt) {
      assist = F.damp(assist, assistTarget, 1.8, dt);
      hitSlow = F.damp(hitSlow, 1, 4.2, dt);
      currentSpeed = F.damp(currentSpeed, targetSpeed(), 2.8, dt);
      dist += currentSpeed * dt;
      updateDrops(dt);
      updateHazards(dt);
      updateStars(dt);
      updateCheckpoints();
      updateMusic(false);

      if (dist > level.total) triggerClear();
    }

    player.onJump = function () {
      hasJumped = true;
      F.dust(player.x - 8, level.ground + 2, 5, 'rgba(225,199,220,0.74)', currentSpeed);
      F.ring(player.x, level.ground, '#e5c9dc', 12, 0.24);
      S.jump();
    };

    player.onLand = function (strength) {
      F.dust(player.x, level.ground + 2, 7, 'rgba(225,199,220,0.78)', currentSpeed);
      F.ring(player.x, level.ground + 1, '#d7b9d1', 13, 0.25);
      F.addShake(0.18 * strength, 0, 1);
      S.land(strength);
    };

    player.onStep = function () {
      if (currentSpeed < 90 || state === 'paused' || state === 'rescue') return;
      F.dust(player.x - 16, level.ground + 1, 1, 'rgba(211,188,211,0.56)', currentSpeed);
      S.step();
    };

    function togglePauseKey() {
      if (!E.input.buffered('pause', 0.16)) return;
      E.input.consume('pause');
      if (state === 'paused') resumeFromPause();
      else pauseGame();
    }

    function update(dt, dtReal) {
      uiTime += dtReal;
      pauseInputLock = Math.max(0, pauseInputLock - dtReal);
      mute.update(dtReal);
      pauseButton.update(dtReal);
      const muteChanged = UI.handleMuteKey(mute);
      if (muteChanged && state === 'paused') S.pause();
      togglePauseKey();

      if (state === 'paused') {
        resumeButton.update(dtReal);
        if (pauseInputLock <= 0 &&
            (E.input.buffered('jump', 0.16) || E.input.buffered('ok', 0.16))) {
          E.input.consume('jump'); E.input.consume('ok');
          resumeButton.activate();
        }
        return;
      }

      if (state === 'rescue') {
        stateTime += dtReal;
        rescueButton.update(dtReal);
        if (stateTime > 0.55 &&
            (E.input.buffered('jump', 0.16) || E.input.buffered('ok', 0.16))) {
          E.input.consume('jump'); E.input.consume('ok');
          rescueButton.activate();
        }
        return;
      }

      simTime += dt;
      stateTime += dt;
      hintTime = Math.max(0, hintTime - dt);
      comboTime = Math.max(0, comboTime - dt);
      if (comboTime <= 0) combo = 0;

      if (state === 'intro') {
        const begin = F.clamp01((stateTime - 0.65) / 1.05);
        currentSpeed = F.damp(currentSpeed, 250 * begin, 3.2, dt);
        if (stateTime > 0.92) dist += currentSpeed * dt;
        player.update(dt, currentSpeed, stateTime > 1.05);
        if (stateTime > 2.15) {
          state = 'run';
          stateTime = 0;
        }
      } else if (state === 'return') {
        currentSpeed = F.damp(currentSpeed, targetSpeed(), 2.3, dt);
        dist += currentSpeed * dt;
        player.update(dt, currentSpeed, stateTime > 0.55);
        if (stateTime > 1.05) {
          state = 'run';
          stateTime = 0;
        }
      } else if (state === 'run') {
        player.update(dt, currentSpeed, true);
        updateWorld(dt);
      } else if (state === 'clear') {
        currentSpeed = F.damp(currentSpeed, 115, 2.6, dt);
        dist += currentSpeed * dt * 0.36;
        player.update(dt, currentSpeed, false);
        if (!clearBurst && stateTime > 0.34) {
          clearBurst = true;
          F.confetti(player.x + 85, 190, 42);
          F.sparkle(player.x, player.y - 70, '#ffe06b', 18);
        }
        if (stateTime > 1.78 && !finishSent) {
          finishSent = true;
          options.onClear({ stars: starsGot });
        }
      }

      const desiredCam = (level.ground - player.y) * 0.055;
      camY = F.damp(camY, desiredCam, 5.5, dt);
      if (Math.random() < dt * currentSpeed / 260 && state === 'run') {
        F.speedLine(W + 10, 110 + Math.random() * 250, 'rgba(233,215,255,0.22)', currentSpeed + 130);
      }
    }

    function makeView() {
      let windup = 0;
      for (const drop of level.drops) {
        if (drop.state === 'warning') {
          windup = Math.max(windup, F.clamp01(drop.age / (drop.activeWarn || drop.warn)));
        }
      }
      return {
        time: simTime,
        dist,
        speed: currentSpeed,
        ground: level.ground,
        total: level.total,
        windup,
        hasJumped
      };
    }

    function drawHUD(ctx) {
      UI.drawHearts(ctx, 39, 40, hearts, 5);
      ctx.fillStyle = 'rgba(28,18,49,0.58)';
      UI.rr(ctx, 28, 69, 120, 44, 22); ctx.fill();
      UI.drawStar(ctx, 54, 91, 13, simTime * 1.3, '#ffe06b');
      ctx.fillStyle = '#fff7df';
      ctx.font = '900 21px "Malgun Gothic", sans-serif';
      ctx.textAlign = 'left';
      ctx.fillText('× ' + starsGot, 75, 99);
      UI.drawProgress(ctx, W * 0.5 - 160, 27, 320, dist / level.total);
      pauseButton.draw(ctx);
      mute.draw(ctx);
      if (E.isTouch && state !== 'paused' && state !== 'rescue') jumpButton.draw(ctx);
    }

    function drawIntro(ctx) {
      if (state !== 'intro') return;
      const enter = F.ease.outBack(F.clamp01((stateTime - 0.05) / 0.46));
      const leave = 1 - F.ease.inQuad(F.clamp01((stateTime - 1.38) / 0.62));
      ctx.save();
      ctx.globalAlpha = leave;
      ctx.translate(W * 0.5, 120);
      ctx.scale(enter, enter);
      UI.panel(ctx, -248, -55, 496, 110, 24, '#fff8e8');
      ctx.textAlign = 'center';
      ctx.fillStyle = '#a45850';
      ctx.font = '900 18px "Malgun Gothic", sans-serif';
      ctx.fillText('첫 번째 모험', 0, -15);
      ctx.fillStyle = '#342442';
      ctx.font = '900 31px "Malgun Gothic", sans-serif';
      ctx.fillText('외눈 거인의 동굴', 0, 27);
      ctx.restore();
    }

    function drawHint(ctx) {
      if (hintTime <= 0 || state === 'rescue') return;
      const appear = F.ease.outBack(F.clamp01((4.1 - hintTime) / 0.35));
      const vanish = F.clamp01(hintTime / 0.4);
      ctx.save();
      ctx.globalAlpha = vanish;
      ctx.translate(W * 0.5, 105);
      ctx.scale(appear, appear);
      UI.panel(ctx, -270, -41, 540, 82, 22, '#fff8e8');
      UI.drawOwl(ctx, -226, 0, 0.46, uiTime, true);
      ctx.fillStyle = '#342442';
      ctx.font = '900 20px "Malgun Gothic", sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText(hintText, 32, 8);
      ctx.restore();
    }

    function drawRescue(ctx) {
      ctx.fillStyle = 'rgba(24,17,42,0.72)';
      ctx.fillRect(0, 0, W, H);
      const pop = F.ease.outBack(F.clamp01(stateTime / 0.48));
      ctx.save();
      ctx.translate(W * 0.5, 258);
      ctx.scale(pop, pop);
      UI.panel(ctx, -300, -155, 600, 270, 28, '#fff8e8');
      UI.drawOwl(ctx, -205, -66, 0.82, uiTime, true);
      ctx.textAlign = 'center';
      ctx.fillStyle = '#a45850';
      ctx.font = '900 22px "Malgun Gothic", sans-serif';
      ctx.fillText('아테나가 살며시 잡아 주었어요.', 55, -76);
      ctx.fillStyle = '#342442';
      ctx.font = '900 29px "Malgun Gothic", sans-serif';
      ctx.fillText('괜찮아. 다시 해 보자!', 55, -32);
      ctx.font = '800 20px "Malgun Gothic", sans-serif';
      ctx.fillStyle = '#796476';
      ctx.fillText(rescues >= 2 ? '별이 그린 길을 천천히 따라가 봐.' : '조금 전 안전한 곳에서 시작할게.', 55, 10);
      ctx.restore();
      if (stateTime > 0.35) rescueButton.draw(ctx, true);
      mute.draw(ctx);
    }

    function drawPause(ctx) {
      ctx.fillStyle = 'rgba(22,16,39,0.72)';
      ctx.fillRect(0, 0, W, H);
      UI.panel(ctx, W * 0.5 - 240, 160, 480, 238, 28, '#fff8e8');
      UI.drawOwl(ctx, W * 0.5, 222, 0.72, uiTime, true);
      ctx.textAlign = 'center';
      ctx.fillStyle = '#342442';
      ctx.font = '900 31px "Malgun Gothic", sans-serif';
      ctx.fillText('잠깐 쉬어 가요', W * 0.5, 292);
      resumeButton.draw(ctx, true);
      mute.draw(ctx);
    }

    function drawClear(ctx) {
      if (state !== 'clear' || stateTime < 0.26) return;
      const pop = F.ease.outBack(F.clamp01((stateTime - 0.26) / 0.48));
      ctx.save();
      ctx.translate(W * 0.5, 144);
      ctx.scale(pop, pop);
      ctx.textAlign = 'center';
      ctx.font = '900 53px "Malgun Gothic", sans-serif';
      ctx.lineWidth = 10; ctx.strokeStyle = '#342442'; ctx.lineJoin = 'round';
      ctx.strokeText('빛이다!', 0, 0);
      ctx.fillStyle = '#ffe47f'; ctx.fillText('빛이다!', 0, 0);
      ctx.font = '900 23px "Malgun Gothic", sans-serif';
      ctx.lineWidth = 6; ctx.strokeText('포기하지 않아서 길을 찾았어요.', 0, 42);
      ctx.fillStyle = '#fff8dc'; ctx.fillText('포기하지 않아서 길을 찾았어요.', 0, 42);
      ctx.restore();
    }

    function draw(ctx) {
      const view = makeView();
      const shake = E.shake || { x: 0, y: 0 };
      ctx.save();
      ctx.translate(shake.x, camY + shake.y);
      Art.drawBackground(ctx, view);
      Art.drawCyclops(ctx, view);
      Art.drawGround(ctx, view);
      F.drawParticles(ctx, -1);

      for (const drop of level.drops) {
        Art.drawDrop(ctx, drop, drop.x - dist, level.ground, simTime);
      }
      for (const hazard of level.hazards) {
        const sx = hazard.x - dist;
        if (sx > -100 && sx < W + 120) Art.drawHazard(ctx, hazard, sx, level.ground, simTime);
      }
      for (const star of level.stars) {
        if (star.got) continue;
        const sx = star.x - dist;
        if (sx > -80 && sx < W + 90) Art.drawWisdomStar(ctx, star, sx, simTime, star.magnet);
      }
      Art.drawSilentJumpHint(ctx, view, player);
      Art.drawHero(ctx, player, simTime);
      F.drawParticles(ctx, 0);
      Art.drawForeground(ctx, view);
      ctx.restore();

      // 가장자리만 아주 살짝 어둡혀 중앙의 주인공과 별을 돋보이게 한다.
      const vignette = ctx.createRadialGradient(W * 0.5, H * 0.47, 220, W * 0.5, H * 0.47, 580);
      vignette.addColorStop(0, 'rgba(16,10,29,0)');
      vignette.addColorStop(1, 'rgba(16,10,29,0.34)');
      ctx.fillStyle = vignette; ctx.fillRect(0, 0, W, H);

      drawHUD(ctx);
      drawIntro(ctx);
      drawHint(ctx);
      drawClear(ctx);
      if (state === 'rescue') drawRescue(ctx);
      if (state === 'paused') drawPause(ctx);
    }

    return {
      debug: {
        get state() { return state; },
        get dist() { return dist; },
        get hearts() { return hearts; },
        get rescues() { return rescues; },
        get speed() { return currentSpeed; },
        get assist() { return assist; },
        get grounded() { return player.grounded; },
        get playerY() { return player.y; },
        hazards: level.hazards,
        drops: level.drops,
        total: level.total
      },
      enter() {
        S.unlock();
        S.startBgm('cave', { intensity: 0.28, fade: 0.75 });
        updateMusic(true);
      },
      exit() {
        jumpButton.release();
        if (state !== 'clear') S.stopBgm();
      },
      update,
      pointer(type, x, y, pointerId) {
        if (mute.pointer(type, x, y)) {
          if (state === 'paused') S.pause();
          return;
        }
        if (pauseButton.pointer(type, x, y)) return;
        if (state === 'rescue') {
          rescueButton.pointer(type, x, y);
          return;
        }
        if (state === 'paused') {
          resumeButton.pointer(type, x, y);
          return;
        }
        if (E.isTouch) jumpButton.pointer(type, x, y, pointerId);
      },
      draw
    };
  };
})();

/* src/stages/wind-level.js */
// 바람 주머니 항해 — 약 52초짜리 수제 상하 조종 코스
(function () {
  'use strict';

  window.ODY = window.ODY || {};
  ODY.Levels = ODY.Levels || {};

  const TOP = 135;
  const BOTTOM = 420;
  const TOTAL = 13800;

  function smooth(t) {
    return (1 - Math.cos(Math.PI * t)) * 0.5;
  }

  function addTrail(list, start, end, count, fromY, toY, phase) {
    const n = Math.max(1, count | 0);
    for (let i = 0; i < n; i++) {
      const k = n === 1 ? 0.5 : i / (n - 1);
      list.push({
        x: start + (end - start) * k,
        y: fromY + (toY - fromY) * smooth(k),
        phase: (phase || 0) + i * 0.73,
        got: false
      });
    }
  }

  function build() {
    const currents = [];

    // 0~2,850px: 첫 10초가 넘는 완전 안전 구간.
    // 중앙 직선 뒤 위·아래 순풍 길을 따라가며 조작을 자연스럽게 익힌다.
    addTrail(currents, 620, 1180, 5, 275, 275, 0.0);
    addTrail(currents, 1390, 2050, 5, 275, 185, 1.1);
    addTrail(currents, 2220, 2780, 5, 195, 365, 2.2);

    // 소개: 한 구름씩, 반대쪽의 순풍이 안전한 길을 보여 준다.
    addTrail(currents, 2920, 3400, 3, 335, 335, 3.4);
    addTrail(currents, 3650, 4140, 3, 205, 205, 4.2);

    // 연습: 넓은 구름문 두 개.
    addTrail(currents, 4440, 4930, 3, 270, 270, 5.0);
    addTrail(currents, 5280, 5780, 3, 340, 340, 5.8);

    // 응용: 움직이는 폭풍과 조금 좁은 문, 위·아래 연속 회피.
    addTrail(currents, 6750, 7150, 3, 340, 340, 6.7);
    addTrail(currents, 7420, 7870, 3, 205, 205, 7.5);
    addTrail(currents, 8000, 8330, 2, 330, 205, 8.3);

    // 휴식: 장애물 없이 중앙에서 순풍을 넉넉히 받는다.
    addTrail(currents, 8700, 9300, 5, 275, 275, 9.0);

    // 절정: 앞에서 배운 높이만 짧고 읽기 좋은 리듬으로 연결한다.
    addTrail(currents, 9570, 10050, 3, 350, 350, 10.0);
    addTrail(currents, 10310, 10750, 3, 330, 330, 10.8);
    addTrail(currents, 11020, 11460, 3, 190, 190, 11.6);
    addTrail(currents, 11750, 12210, 3, 335, 335, 12.4);
    addTrail(currents, 12440, 12780, 2, 330, 330, 13.2);
    addTrail(currents, 12820, 13140, 2, 200, 200, 13.9);
    addTrail(currents, 13120, 13520, 4, 265, 265, 14.6);

    const obstacles = [
      // 소개 — 첫 충돌 가능 시점은 약 11.5초 뒤다.
      { type: 'cloud', x: 3150, y: 175, rx: 55, ry: 36, group: '한 구름' },
      { type: 'cloud', x: 3900, y: 365, rx: 55, ry: 36, group: '한 구름' },

      // 연습 — 넓고 정지한 구름문.
      { type: 'gate', x: 4700, gapY: 270, gap: 190, w: 58, group: '구름문' },
      { type: 'gate', x: 5550, gapY: 340, gap: 175, w: 60, group: '구름문' },

      // 응용 — 느린 상하 이동과 연속 방향 전환.
      { type: 'cloud', x: 6900, y: 205, rx: 57, ry: 37, amp: 42, period: 4.4, group: '움직이는 폭풍' },
      { type: 'gate', x: 7650, gapY: 205, gap: 155, w: 64, group: '좁은 구름문' },
      { type: 'cloud', x: 8150, y: 175, rx: 57, ry: 37, group: '두 폭풍' },
      { type: 'cloud', x: 8430, y: 365, rx: 57, ry: 37, group: '두 폭풍' },

      // 8,500~9,550px는 의도적으로 비워 둔 휴식 구간이다.

      // 절정 — 이전에 본 요소만 간격과 높이를 조금씩 좁혀 연결한다.
      { type: 'gate', x: 9800, gapY: 350, gap: 150, w: 68, group: '마지막 바람길' },
      { type: 'cloud', x: 10550, y: 180, rx: 59, ry: 39, amp: 38, period: 4.4, group: '움직이는 폭풍' },
      { type: 'gate', x: 11250, gapY: 190, gap: 145, w: 70, group: '마지막 바람길' },
