// 바람 주머니 항해 — 파스텔 바다, 순풍, 둥근 폭풍의 캔버스 그림
(function () {
  'use strict';
  window.ODY = window.ODY || {};
  ODY.Art = ODY.Art || {};

  const A = {};
  const TAU = Math.PI * 2;
  const INK = '#342442';
  let paperTexture = null;

  function wrap(value, span) {
    return ((value % span) + span) % span;
  }

  function makeTexture() {
    if (paperTexture) return;
    const c = document.createElement('canvas');
    c.width = 160; c.height = 90;
    const x = c.getContext('2d');
    x.clearRect(0, 0, c.width, c.height);
    for (let i = 0; i < 220; i++) {
      const px = (i * 47) % c.width;
      const py = (i * 83) % c.height;
      x.fillStyle = i % 3 === 0 ? 'rgba(255,255,255,0.035)' : 'rgba(54,72,111,0.025)';
      x.fillRect(px, py, 1 + (i % 2), 1);
    }
    paperTexture = c;
  }

  function cloudPuff(ctx, x, y, scale, color, alpha) {
    ctx.save();
    ctx.translate(x, y);
    ctx.scale(scale, scale);
    ctx.globalAlpha = alpha === undefined ? 1 : alpha;
    ctx.fillStyle = color;
    ctx.beginPath();
    ctx.arc(-35, 8, 26, 0, TAU);
    ctx.arc(-9, -6, 34, 0, TAU);
    ctx.arc(25, 1, 29, 0, TAU);
    ctx.arc(46, 13, 20, 0, TAU);
    ctx.rect(-38, 7, 83, 30);
    ctx.fill();
    ctx.restore();
  }

  A.drawBackground = function (ctx, view) {
    const W = 960, H = 540;
    const t = view.time;
    const d = view.dist;
    const sky = ctx.createLinearGradient(0, 0, 0, H);
    sky.addColorStop(0, '#8d8bc9');
    sky.addColorStop(0.28, '#f4b7bc');
    sky.addColorStop(0.5, '#ffd9aa');
    sky.addColorStop(1, '#65b7d0');
    ctx.fillStyle = sky; ctx.fillRect(0, 0, W, H);

    // 멀리 있는 햇빛과 구름은 가장 천천히 흐른다.
    const sunX = 745 - d * 0.012;
    const glow = ctx.createRadialGradient(sunX, 103, 12, sunX, 103, 128);
    glow.addColorStop(0, 'rgba(255,249,200,0.78)');
    glow.addColorStop(1, 'rgba(255,249,200,0)');
    ctx.fillStyle = glow; ctx.fillRect(sunX - 130, -25, 260, 260);
    ctx.fillStyle = '#fff2b7';
    ctx.beginPath(); ctx.arc(sunX, 103, 48, 0, TAU); ctx.fill();

    for (let i = 0; i < 7; i++) {
      const x = wrap(i * 245 - d * 0.055, 1800) - 180;
      const y = 48 + (i % 3) * 34 + Math.sin(t * 0.35 + i) * 3;
      cloudPuff(ctx, x, y, 0.68 + (i % 2) * 0.16, '#f8e7e2', 0.48);
    }

    // 먼 섬과 집 불빛. 길의 목적지를 계속 기억하게 한다.
    ctx.fillStyle = '#786e9c';
    for (let i = 0; i < 5; i++) {
      const x = wrap(i * 390 - d * 0.11, 2100) - 220;
      const base = 176 + (i % 2) * 16;
      ctx.beginPath();
      ctx.moveTo(x - 120, base + 23);
      ctx.quadraticCurveTo(x - 48, base - 48, x + 12, base + 5);
      ctx.quadraticCurveTo(x + 67, base - 35, x + 135, base + 24);
      ctx.closePath(); ctx.fill();
      if (i === 3) {
        ctx.fillStyle = '#ffe48c'; ctx.fillRect(x + 8, base - 5, 6, 8); ctx.fillStyle = '#786e9c';
      }
    }

    // 중간·가까운 파도 세 겹 패럴랙스.
    const bands = [
      { y: 190, color: '#69bfd2', amp: 9, speed: 0.18, phase: 0.018 },
      { y: 278, color: '#4fa5c6', amp: 13, speed: 0.34, phase: 0.021 },
      { y: 385, color: '#397fad', amp: 16, speed: 0.58, phase: 0.025 }
    ];
    for (let b = 0; b < bands.length; b++) {
      const band = bands[b];
      ctx.fillStyle = band.color;
      ctx.beginPath(); ctx.moveTo(0, band.y);
      for (let x = 0; x <= W + 24; x += 24) {
        const y = band.y + Math.sin((x + d * band.speed) * band.phase + t * (0.55 + b * 0.18)) * band.amp;
        ctx.lineTo(x, y);
      }
      ctx.lineTo(W, H); ctx.lineTo(0, H); ctx.closePath(); ctx.fill();
    }

    // 항로의 얇은 물결선은 속도를 보여 주되 상호작용 요소보다 흐리다.
    ctx.strokeStyle = 'rgba(232,252,249,0.24)'; ctx.lineWidth = 3; ctx.lineCap = 'round';
    for (let i = 0; i < 13; i++) {
      const x = wrap(i * 118 - d * 0.75, 1540) - 110;
      const y = 225 + (i * 61) % 270 + Math.sin(t * 1.4 + i) * 5;
      ctx.beginPath(); ctx.moveTo(x, y); ctx.quadraticCurveTo(x + 24, y - 5, x + 50, y); ctx.stroke();
    }

    // 마지막 구간의 이타카 빛.
    const exitX = view.total + 300 - d;
    if (exitX < W + 620) {
      const light = ctx.createRadialGradient(exitX, 226, 8, exitX, 226, 360);
      light.addColorStop(0, 'rgba(255,248,186,0.95)');
      light.addColorStop(0.25, 'rgba(255,222,135,0.48)');
      light.addColorStop(1, 'rgba(255,222,135,0)');
      ctx.fillStyle = light; ctx.fillRect(exitX - 370, 0, 740, H);
      ctx.fillStyle = '#78658e';
      ctx.beginPath(); ctx.ellipse(exitX + 35, 197, 134, 35, 0, 0, TAU); ctx.fill();
      ctx.fillStyle = '#fff0a5'; ctx.fillRect(exitX + 24, 159, 9, 13);
    }

    makeTexture();
    ctx.save(); ctx.globalAlpha = 0.42; ctx.drawImage(paperTexture, 0, 0, W, H); ctx.restore();
  };

  A.drawCurrent = function (ctx, current, sx, time) {
    const x = current.drawX === undefined ? sx : current.drawX;
    const y = current.drawY === undefined ? current.y : current.drawY;
    const pulse = 1 + Math.sin(time * 5 + current.phase) * 0.08;
    ctx.save(); ctx.translate(x, y); ctx.scale(pulse, pulse);
    const glow = ctx.createRadialGradient(0, 0, 2, 0, 0, 34);
    glow.addColorStop(0, 'rgba(255,244,150,0.75)');
    glow.addColorStop(0.38, 'rgba(116,231,204,0.44)');
    glow.addColorStop(1, 'rgba(116,231,204,0)');
    ctx.fillStyle = glow; ctx.fillRect(-38, -38, 76, 76);
    ctx.strokeStyle = '#8ff0d1'; ctx.lineWidth = 6; ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(-27, -7);
    ctx.bezierCurveTo(-7, -25, 24, -22, 24, -5);
    ctx.bezierCurveTo(24, 7, 7, 12, -3, 5);
    ctx.stroke();
    ctx.strokeStyle = '#fff3a7'; ctx.lineWidth = 4;
    ctx.beginPath(); ctx.moveTo(-20, 12); ctx.quadraticCurveTo(0, 24, 21, 11); ctx.stroke();
    ctx.fillStyle = '#ffe16f';
    ctx.beginPath(); ctx.arc(25, -5, 5, 0, TAU); ctx.fill();
    ctx.restore();
  };

  function drawStormFace(ctx, rx, ry, time, phase) {
    ctx.strokeStyle = '#554767'; ctx.lineWidth = 3; ctx.lineCap = 'round';
    const blink = Math.sin(time * 1.7 + phase) > 0.93;
    if (blink) {
      ctx.beginPath(); ctx.moveTo(-15, -2); ctx.lineTo(-5, -2); ctx.moveTo(8, -2); ctx.lineTo(18, -2); ctx.stroke();
    } else {
      ctx.fillStyle = '#4a3c60';
      ctx.beginPath(); ctx.arc(-9, -3, 3.5, 0, TAU); ctx.arc(12, -3, 3.5, 0, TAU); ctx.fill();
    }
    ctx.fillStyle = 'rgba(255,139,152,0.34)';
    ctx.beginPath(); ctx.arc(-26, 11, 7, 0, TAU); ctx.arc(28, 11, 7, 0, TAU); ctx.fill();
    ctx.strokeStyle = '#554767';
    ctx.beginPath(); ctx.arc(2, 12, 8, 1.12 * Math.PI, 1.88 * Math.PI); ctx.stroke();
  }

  function drawCloudBody(ctx, x, y, rx, ry, time, phase) {
    ctx.save(); ctx.translate(x, y);
    const wiggle = Math.sin(time * 2.2 + phase) * 0.025;
    ctx.rotate(wiggle);
    const grad = ctx.createLinearGradient(-rx, -ry, rx, ry);
    grad.addColorStop(0, '#aa9fc3');
    grad.addColorStop(0.55, '#82779e');
    grad.addColorStop(1, '#655d83');
    ctx.fillStyle = grad; ctx.strokeStyle = '#493a60'; ctx.lineWidth = 4;
    ctx.beginPath();
    ctx.ellipse(-rx * 0.42, ry * 0.05, rx * 0.48, ry * 0.65, 0, 0, TAU);
    ctx.ellipse(-rx * 0.05, -ry * 0.18, rx * 0.5, ry * 0.78, 0, 0, TAU);
    ctx.ellipse(rx * 0.42, ry * 0.08, rx * 0.46, ry * 0.62, 0, 0, TAU);
    ctx.fill(); ctx.stroke();
    ctx.fillStyle = 'rgba(226,218,242,0.2)';
    ctx.beginPath(); ctx.ellipse(-rx * 0.22, -ry * 0.35, rx * 0.3, ry * 0.18, -0.2, 0, TAU); ctx.fill();
    drawStormFace(ctx, rx, ry, time, phase);
    // 비 대신 둥근 물방울 두 개만 떨어져 무섭지 않게 보인다.
    ctx.fillStyle = '#8bd6df';
    for (let i = -1; i <= 1; i++) {
      const drop = wrap(time * 36 + i * 19 + phase * 7, 42);
      ctx.globalAlpha = 0.5 * (1 - drop / 48);
      ctx.beginPath(); ctx.ellipse(i * rx * 0.35, ry * 0.48 + drop, 3, 6, 0.2, 0, TAU); ctx.fill();
    }
    ctx.restore();
  }

  function drawGateBank(ctx, x, edgeY, halfWidth, side, time, phase) {
    // 여러 얼굴을 반복하지 않고, 하나의 큰 실루엣으로 빈 통로를 읽게 한다.
    ctx.save();
    ctx.translate(x, edgeY);
    if (side > 0) ctx.scale(1, -1);
    const grad = ctx.createLinearGradient(0, -82, 0, 14);
    grad.addColorStop(0, '#aaa0c5');
    grad.addColorStop(0.58, '#82789e');
    grad.addColorStop(1, '#665d83');
    ctx.fillStyle = grad; ctx.strokeStyle = '#493a60'; ctx.lineWidth = 5; ctx.lineJoin = 'round';
    ctx.beginPath();
    ctx.moveTo(-halfWidth, 6);
    ctx.quadraticCurveTo(-halfWidth - 8, -20, -halfWidth * 0.72, -31);
    ctx.quadraticCurveTo(-halfWidth * 0.56, -68, -halfWidth * 0.26, -47);
    ctx.quadraticCurveTo(0, -86, halfWidth * 0.27, -48);
    ctx.quadraticCurveTo(halfWidth * 0.58, -70, halfWidth * 0.72, -30);
    ctx.quadraticCurveTo(halfWidth + 9, -18, halfWidth, 6);
    ctx.closePath(); ctx.fill(); ctx.stroke();
    ctx.fillStyle = 'rgba(231,223,244,0.2)';
    ctx.beginPath(); ctx.ellipse(-halfWidth * 0.24, -51, halfWidth * 0.27, 11, -0.14, 0, TAU); ctx.fill();
    ctx.restore();

    const faceY = edgeY + (side > 0 ? 35 : -35);
    ctx.save(); ctx.translate(x, faceY);
    const bob = Math.sin(time * 2.1 + phase) * 1.5;
    ctx.translate(0, bob);
    ctx.fillStyle = '#4a3c60';
    ctx.beginPath(); ctx.arc(-10, -3, 3.5, 0, TAU); ctx.arc(11, -3, 3.5, 0, TAU); ctx.fill();
    ctx.fillStyle = 'rgba(255,139,152,0.3)';
    ctx.beginPath(); ctx.arc(-25, 9, 6, 0, TAU); ctx.arc(26, 9, 6, 0, TAU); ctx.fill();
    ctx.strokeStyle = '#554767'; ctx.lineWidth = 2.5; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.arc(1, 10, 7, 1.1 * Math.PI, 1.9 * Math.PI); ctx.stroke();
    ctx.restore();
  }

  A.drawObstacle = function (ctx, obstacle, sx, actualY, gapBonus, time) {
    if (obstacle.dead) return;
    if (obstacle.type === 'gate') {
      const gap = obstacle.gap + (gapBonus || 0);
      const topEdge = obstacle.gapY - gap * 0.5;
      const bottomEdge = obstacle.gapY + gap * 0.5;
      const width = obstacle.w || 72;
      // 안전한 문 가장자리를 산호빛 점으로 또렷하게 표시한다.
      ctx.strokeStyle = 'rgba(255,218,165,0.62)'; ctx.lineWidth = 5; ctx.setLineDash([8, 11]);
      ctx.beginPath(); ctx.moveTo(sx - width, topEdge); ctx.lineTo(sx + width, topEdge); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(sx - width, bottomEdge); ctx.lineTo(sx + width, bottomEdge); ctx.stroke();
      ctx.setLineDash([]);
      drawGateBank(ctx, sx, topEdge, width + 38, -1, time, obstacle.x * 0.01);
      drawGateBank(ctx, sx, bottomEdge, width + 38, 1, time, obstacle.x * 0.01 + 2);
      return;
    }
    drawCloudBody(ctx, sx, actualY, obstacle.rx, obstacle.ry, time, obstacle.x * 0.01);
    if (obstacle.amp) {
      ctx.strokeStyle = 'rgba(255,239,187,0.36)'; ctx.lineWidth = 3; ctx.setLineDash([5, 9]);
      ctx.beginPath(); ctx.moveTo(sx, obstacle.y - obstacle.amp); ctx.lineTo(sx, obstacle.y + obstacle.amp); ctx.stroke();
      ctx.setLineDash([]);
    }
  };

  A.drawShip = function (ctx, ship, time, boost, shield) {
    const F = ODY.Feel;
    ctx.save();
    ctx.translate(ship.x, ship.y);
    ctx.rotate(ship.tilt || 0);
    ctx.scale(ship.sq.sx, ship.sq.sy);
    // 선미 물살은 입력과 별개로 계속 살아 있어 자동 항해 속도가 느껴진다.
    ctx.strokeStyle = boost > 0 ? 'rgba(177,255,222,0.88)' : 'rgba(255,255,255,0.68)';
    ctx.lineWidth = boost > 0 ? 7 : 5; ctx.lineCap = 'round';
    for (let i = 0; i < 3; i++) {
      ctx.beginPath();
      ctx.moveTo(-75 - i * 9, 13 + i * 9);
      ctx.quadraticCurveTo(-112 - i * 13, 5 + Math.sin(time * 6 + i) * 5, -151 - i * 12, 15 + i * 10);
      ctx.stroke();
    }
    ODY.UI.drawShip(ctx, 0, 0, 0.61, time);
    // 키를 잡은 작은 오디세우스.
    ctx.fillStyle = '#f5c59e'; ctx.strokeStyle = INK; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.arc(-24, -19, 11, 0, TAU); ctx.fill(); ctx.stroke();
    ctx.fillStyle = '#75482e'; ctx.beginPath(); ctx.arc(-24, -23, 11, Math.PI, TAU); ctx.fill();
    ctx.strokeStyle = '#d85b66'; ctx.lineWidth = 4;
    ctx.beginPath(); ctx.arc(-24, -20, 9, Math.PI * 1.02, Math.PI * 1.9); ctx.stroke();
    if (shield) {
      const pulse = 1 + Math.sin(time * 8) * 0.035;
      ctx.strokeStyle = 'rgba(255,232,116,0.88)'; ctx.lineWidth = 5;
      ctx.fillStyle = 'rgba(255,244,157,0.12)';
      ctx.beginPath(); ctx.ellipse(0, -23, 94 * pulse, 71 * pulse, 0, 0, TAU); ctx.fill(); ctx.stroke();
    }
    ctx.restore();
  };

  A.drawSilentGuide = function (ctx, view, ship) {
    if (view.hasSteered || view.dist < 760 || view.dist > 2550) return;
    const a = ODY.Feel.clamp01((view.dist - 760) / 240) * ODY.Feel.clamp01((2550 - view.dist) / 260);
    const target = view.dist < 1700 ? 190 : 365;
    ctx.save(); ctx.globalAlpha = a * (0.5 + Math.sin(view.time * 4) * 0.14);
    ctx.strokeStyle = '#fff0a3'; ctx.lineWidth = 4; ctx.setLineDash([7, 10]);
    ctx.beginPath(); ctx.moveTo(ship.x + 74, ship.y); ctx.quadraticCurveTo(ship.x + 125, (ship.y + target) * 0.5, ship.x + 170, target); ctx.stroke();
    ctx.setLineDash([]);
    ctx.fillStyle = '#fff5c8';
    ctx.font = '900 36px "Malgun Gothic", sans-serif'; ctx.textAlign = 'center';
    ctx.fillText(target < ship.y ? '↑' : '↓', ship.x + 183, target + 10);
    ODY.UI.drawOwl(ctx, ship.x + 225, target - 28, 0.38, view.time, true);
    ctx.restore();
  };

  A.drawForeground = function (ctx, view) {
    const W = 960, H = 540;
    ctx.strokeStyle = 'rgba(220,248,246,0.28)'; ctx.lineWidth = 5; ctx.lineCap = 'round';
    for (let i = 0; i < 9; i++) {
      const x = wrap(i * 155 - view.dist * 1.08, 1395) - 130;
      const y = 430 + (i % 3) * 43 + Math.sin(view.time * 2 + i) * 7;
      ctx.beginPath(); ctx.moveTo(x, y); ctx.quadraticCurveTo(x + 32, y - 8, x + 68, y); ctx.stroke();
    }
    const vignette = ctx.createRadialGradient(W * 0.5, H * 0.48, 220, W * 0.5, H * 0.48, 590);
    vignette.addColorStop(0, 'rgba(39,43,86,0)');
    vignette.addColorStop(1, 'rgba(39,43,86,0.24)');
    ctx.fillStyle = vignette; ctx.fillRect(0, 0, W, H);
  };

  ODY.Art.windVoyage = A;
})();

</script>
  <script>
/* src/stages/wind-voyage.js */
// 스테이지 2 — 바람 주머니 항해
// 안전한 순풍길 → 한 구름 → 구름문 → 응용 → 휴식 → 짧은 폭풍 절정
(function () {
  'use strict';
  window.ODY = window.ODY || {};
  ODY.Stages = ODY.Stages || {};

  ODY.Stages.windVoyage = function (options) {
    const E = ODY.E;
    const F = ODY.Feel;
    const S = ODY.Snd;
    const UI = ODY.UI;
    const Art = ODY.Art.windVoyage;
    const W = E.W, H = E.H;
    const level = ODY.Levels.windVoyage.build();
    const ship = new ODY.ShipController({ x: 245, y: 275, top: level.top, bottom: level.bottom });

    let simTime = 0;
    let uiTime = 0;
    let state = 'intro';
    let stateTime = 0;
    let stateBeforePause = 'run';
    let pauseInputLock = 0;
    let dist = 0;
    let currentSpeed = 0;
    let assist = 1;
    let assistTarget = 1;
    let gapBonus = 0;
    let hitSlow = 1;
    let hearts = 5;
    let currentsGot = 0;
    let combo = 0;
    let comboTime = 0;
    let boostTime = 0;
    let shieldHits = 0;
    let rescues = 0;
    let checkpointIndex = 0;
    let hintText = '';
    let hintTime = 0;
    let finishSent = false;
    let clearBurst = false;
    let calmGiven = false;
    let sprayClock = 0;
    let musicBand = -1;
    const failures = Object.create(null);
    const assistedGroups = Object.create(null);
    const warnedObstacles = new Set();

    const mute = UI.makeMuteBtn();
    const resumeButton = new UI.Button({
      x: W * 0.5, y: 357, w: 244, h: 66,
      label: '계속 항해', size: 27, color: '#7ed9aa',
      onTap: resumeFromPause
    });
    const rescueButton = new UI.Button({
      x: W * 0.5, y: 411, w: 260, h: 68,
      label: '다시 가자', size: 28, color: '#77c8ee',
      onTap: resumeFromRescue
    });

    const pauseButton = {
      x: W - 106, y: 40, r: 25, sq: F.makeSquash(),
      pointer(type, x, y) {
        if (type !== 'down') return false;
        if ((x - this.x) ** 2 + (y - this.y) ** 2 <= (this.r + 9) ** 2) {
          F.squash(this.sq, 0.86, 0.86);
          if (state === 'paused') resumeFromPause(); else pauseGame();
          S.click();
          return true;
        }
        return false;
      },
      update(dt) { F.updSquash(this.sq, dt); },
      draw(ctx) {
        ctx.save(); ctx.translate(this.x, this.y); ctx.scale(this.sq.sx, this.sq.sy);
        ctx.fillStyle = 'rgba(40,36,82,0.58)';
        ctx.beginPath(); ctx.arc(0, 0, this.r, 0, Math.PI * 2); ctx.fill();
        ctx.strokeStyle = 'rgba(255,255,255,0.48)'; ctx.lineWidth = 2; ctx.stroke();
        ctx.fillStyle = '#fff6dc'; ctx.fillRect(-8, -10, 5, 20); ctx.fillRect(3, -10, 5, 20);
        ctx.restore();
      }
    };

    function makeSteerButton(action, x, y, label) {
      return {
        action, x, y, label, r: 48, pointerId: null, down: false,
        contains(px, py) { return (px - this.x) ** 2 + (py - this.y) ** 2 <= (this.r + 9) ** 2; },
        pointer(type, px, py, pointerId) {
          if (type === 'down' && this.contains(px, py)) {
            this.pointerId = pointerId;
            this.down = true;
            E.input.setHeld(this.action, true);
            return true;
          }
          if ((type === 'up' || type === 'cancel') && this.pointerId === pointerId) {
            this.release();
            return true;
          }
          return false;
        },
        release() {
          this.pointerId = null;
          this.down = false;
          E.input.setHeld(this.action, false);
        },
        draw(ctx) {
          const pulse = this.down ? 0.91 : 1 + Math.sin(uiTime * 3 + this.y) * 0.018;
          ctx.save(); ctx.translate(this.x, this.y); ctx.scale(pulse, pulse);
          ctx.fillStyle = 'rgba(43,37,83,0.3)';
          ctx.beginPath(); ctx.arc(0, 6, this.r + 3, 0, Math.PI * 2); ctx.fill();
          const grad = ctx.createRadialGradient(-12, -14, 3, 0, 0, this.r);
          grad.addColorStop(0, '#d8fff1'); grad.addColorStop(0.35, '#8ee7d1'); grad.addColorStop(1, '#5fb7c8');
          ctx.fillStyle = grad; ctx.beginPath(); ctx.arc(0, 0, this.r, 0, Math.PI * 2); ctx.fill();
          ctx.strokeStyle = '#3f3558'; ctx.lineWidth = 4; ctx.stroke();
          ctx.fillStyle = '#342442'; ctx.font = '900 31px "Malgun Gothic", sans-serif';
          ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText(this.label, 0, -2);
          ctx.restore(); ctx.textBaseline = 'alphabetic';
        }
      };
    }

    const upButton = makeSteerButton('jump', W - 78, H - 158, '↑');
    const downButton = makeSteerButton('down', W - 78, H - 54, '↓');

    function releaseSteering() {
      upButton.release();
      downButton.release();
    }

    function targetSpeed() {
      const ramp = F.ease.inOutSine(F.clamp01(dist / level.total));
      return (245 + ramp * 40) * assist * hitSlow;
    }

    function updateMusic(force) {
      let intensity = 0.28;
      if (dist >= 3150 && dist < 6000) intensity = 0.4;
      else if (dist >= 6000 && dist < 8500) intensity = 0.52;
      else if (dist >= 9550) intensity = 0.64;
      if (dist >= 8500 && dist < 9550) intensity = 0.3;
      const band = Math.round(intensity * 100);
      if (force || band !== musicBand) {
        musicBand = band;
        S.setMusicIntensity(intensity, 0.85);
      }
    }

    function obstacleY(obstacle) {
      if (!obstacle.amp) return obstacle.y;
      const amp = Math.max(12, obstacle.amp - (1 - assistTarget) * 120);
      return obstacle.y + Math.sin(simTime * Math.PI * 2 / obstacle.period + obstacle.x * 0.001) * amp;
    }

    function showHint(text) {
      hintText = text;
      hintTime = 4.2;
      S.athena();
      F.sparkle(W * 0.5 - 188, 91, '#d7c8ff', 12);
    }

    function shipPopY() {
      // 배가 위 항로에 있어도 하트·진행도와 문구가 겹치지 않는다.
      return F.clamp(ship.y - 76, 128, H - 86);
    }

    function registerFailure(group) {
      failures[group] = (failures[group] || 0) + 1;
      if (failures[group] >= 3 && !assistedGroups[group]) {
        assistedGroups[group] = true;
        assistTarget = Math.max(0.8, assistTarget - 0.1);
        gapBonus = Math.min(42, gapBonus + 24);
        showHint('먹구름이 빙글 돌면 빈 길로 천천히 가자.');
      }
    }

    function triggerShield() {
      shieldHits = 1;
      boostTime = Math.max(boostTime, 2.2);
      F.sparkle(ship.x + 12, ship.y - 18, '#ffe67c', 18);
      F.ring(ship.x, ship.y, '#ffe67c', 24, 0.42);
      F.pop(ship.x + 8, shipPopY(), '황금 돛!', '#fff1a0', 22);
      S.shield();
    }

    function hit(obstacle, pushY) {
      if (ship.invin > 0 || state !== 'run' || obstacle.hit) return;
      obstacle.hit = true;
      if (shieldHits > 0) {
        shieldHits = 0;
        ship.invin = 0.72;
        F.doHitstop(0.045);
        F.flash('#fff3a0', 0.13);
        F.sparkle(ship.x + 14, ship.y, '#ffe875', 15);
        F.pop(ship.x, shipPopY(), '지켰다!', '#fff3a8', 21);
        S.shield();
        return;
      }
      hearts--;
      hitSlow = 0.72;
      ship.hurt(pushY);
      registerFailure(obstacle.group || '먹구름');
      F.doHitstop(0.07);
      F.addShake(0.38, -1, pushY < 0 ? -0.4 : 0.4);
      F.flash('#ffb6b3', 0.14);
      F.debris(ship.x + 22, ship.y, '#a7e5e7', 11, -1);
      F.pop(ship.x, shipPopY(), '괜찮아!', '#fff0a4', 23);
      S.splash();
      if (hearts <= 0) {
        releaseSteering();
        state = 'rescue';
        stateTime = 0;
        F.pulseSlowmo(0.28, 0.12, 0.25);
        S.setMusicState('rescue');
        S.athena();
        UI.announce('아테나가 바람을 묶었어요. 다시 가자 버튼으로 잔잔한 곳에서 시작해요.');
      }
    }

    function resetObjects(checkpoint) {
      for (const current of level.currents) {
        if (current.x >= checkpoint - 140) {
          current.got = false;
          delete current.magnet;
          delete current.drawX;
          delete current.drawY;
        }
      }
      for (const obstacle of level.obstacles) {
        if (obstacle.x >= checkpoint - 160) {
          obstacle.hit = false;
          obstacle.near = false;
        }
      }
    }

    function resumeFromRescue() {
      if (state !== 'rescue') return;
      rescues++;
      if (rescues >= 3) {
        assistTarget = Math.min(assistTarget, 0.8);
        gapBonus = Math.max(gapBonus, 42);
        showHint('서두르지 않아도 돼. 반짝이는 바람만 보자!');
      }
      hearts = 5;
      const checkpoint = level.checkpoints[checkpointIndex];
      dist = Math.max(0, checkpoint - 120);
      currentSpeed = 120;
      hitSlow = 1;
      resetObjects(checkpoint);
      ship.reset(checkpointIndex === 1 ? 285 : 275);
      ship.invin = 2;
      UI.announce('하트 다섯 개로 다시 항해해요.');
      releaseSteering();
      state = 'return';
      stateTime = 0;
      S.setMusicState('play');
      updateMusic(true);
    }

    function pauseGame() {
      if (state === 'paused' || state === 'rescue' || state === 'clear') return;
      stateBeforePause = state;
      state = 'paused';
      releaseSteering();
      E.input.consume('jump'); E.input.consume('down'); E.input.consume('ok');
      pauseInputLock = 0.2;
      S.pause();
      UI.announce('잠깐 쉬어요. P, Esc, 스페이스바로 계속해요.');
    }

    function resumeFromPause() {
      if (state !== 'paused') return;
      state = stateBeforePause;
      E.input.clearAll();
      S.resume();
      UI.announce('항해를 계속해요.');
    }

    function triggerClear() {
      if (state === 'clear') return;
      state = 'clear'; stateTime = 0; clearBurst = false;
      releaseSteering();
      S.startBgm('reward', { intensity: 0.36, fade: 0.48 }); S.clear();
      F.pulseSlowmo(0.3, 0.22, 0.48);
      F.flash('#fff2a7', 0.24);
      F.addShake(0.28, 0.4, -1);
    }

    function collectCurrent(current) {
      current.got = true;
      currentsGot++;
      combo = comboTime > 0 ? Math.min(3, combo + 1) : 0;
      comboTime = 0.82;
      boostTime = Math.max(boostTime, 1.1);
      F.sparkle(current.drawX, current.drawY, '#8ff0d1', 12);
      F.ring(current.drawX, current.drawY, '#fff2a1', 12, 0.28);
      F.speedLine(ship.x + 58, ship.y - 10, '#baffdf', 440);
      S.current(combo);
      if (currentsGot % 8 === 0) triggerShield();
    }

    function updateCurrents(dt) {
      for (const current of level.currents) {
        if (current.got) continue;
        const sx = current.x - dist;
        if (sx < -90 || sx > W + 100) continue;
        const dx = sx - ship.x;
        const dy = current.y - ship.y;
        if (!current.magnet && dx * dx + dy * dy < 52 * 52) {
          current.magnet = true;
          current.drawX = sx; current.drawY = current.y;
        }
        if (current.magnet) {
          current.drawX -= currentSpeed * dt;
          current.drawX = F.damp(current.drawX, ship.x, 15, dt);
          current.drawY = F.damp(current.drawY, ship.y, 15, dt);
          if ((current.drawX - ship.x) ** 2 + (current.drawY - ship.y) ** 2 < 21 * 21) collectCurrent(current);
        } else if (dx * dx + dy * dy < 22 * 22) {
          current.drawX = sx; current.drawY = current.y;
          collectCurrent(current);
        }
      }
    }

    function collidesCloud(bounds, sx, y, obstacle) {
      const cx = F.clamp(sx, bounds.left, bounds.right);
      const cy = F.clamp(y, bounds.top, bounds.bottom);
      const dx = (cx - sx) / obstacle.rx;
      const dy = (cy - y) / obstacle.ry;
      return dx * dx + dy * dy < 0.76;
    }

    function updateObstacles(previousDist, dt) {
      const samples = dt >= 0.028 ? 5 : 2;
      for (const obstacle of level.obstacles) {
        const sx = obstacle.x - dist;
        const previousSx = obstacle.x - previousDist;
        if (sx < -140 || sx > W + 150) continue;
        if (!warnedObstacles.has(obstacle.x) && sx < W - 30 && sx > ship.x + 300) {
          warnedObstacles.add(obstacle.x);
          S.storm();
        }
        let collided = false;
        let pushY = ship.y < 275 ? 1 : -1;
        for (let sample = 0; sample < samples && !collided; sample++) {
          const k = samples === 1 ? 1 : sample / (samples - 1);
          const sampleX = previousSx + (sx - previousSx) * k;
          const sampleY = ship.prevY + (ship.y - ship.prevY) * k;
          const bounds = {
            left: ship.x - 42, right: ship.x + 44,
            top: sampleY - 38, bottom: sampleY + 20
          };
          if (obstacle.type === 'gate') {
            const halfGap = (obstacle.gap + gapBonus) * 0.5;
            const withinX = bounds.right > sampleX - obstacle.w && bounds.left < sampleX + obstacle.w;
            if (withinX) {
              if (bounds.top < obstacle.gapY - halfGap) { collided = true; pushY = 1; }
              else if (bounds.bottom > obstacle.gapY + halfGap) { collided = true; pushY = -1; }
            }
          } else {
            const y = obstacleY(obstacle);
            collided = collidesCloud(bounds, sampleX, y, obstacle);
            pushY = sampleY < y ? -1 : 1;
          }
        }
        if (collided) hit(obstacle, pushY);
        if (!obstacle.near && sx < ship.x - (obstacle.w || obstacle.rx || 50) - 22) {
          obstacle.near = true;
          if (!obstacle.hit) {
            failures[obstacle.group || '먹구름'] = 0;
            F.pop(ship.x + 15, shipPopY(), '좋아!', '#fff2a2', 19);
            S.nearMiss();
          }
        }
      }
    }

    function updateCheckpoint() {
      const next = checkpointIndex + 1;
      if (next < level.checkpoints.length && dist >= level.checkpoints[next]) {
        checkpointIndex = next;
        hearts = Math.min(5, hearts + 1);
        F.pop(ship.x + 12, shipPopY(), '숨 돌리자!', '#c7f7df', 21);
        F.sparkle(ship.x, ship.y, '#bcefdc', 13);
        S.athena();
      }
      if (!calmGiven && dist >= 8500) {
        calmGiven = true;
        hearts = Math.min(5, hearts + 1);
      }
    }

    function updateWorld(dt) {
      assist = F.damp(assist, assistTarget, 1.8, dt);
      hitSlow = F.damp(hitSlow, 1, 4.2, dt);
      currentSpeed = F.damp(currentSpeed, targetSpeed(), 2.7, dt);
      const previousDist = dist;
      dist += currentSpeed * dt;
      ship.update(dt, true);
      updateCurrents(dt);
      updateObstacles(previousDist, dt);
      updateCheckpoint();
      updateMusic(false);
      if (dist > level.total) triggerClear();
    }

    ship.onTurn = function (direction, reversed) {
      S.steer(direction);
      F.squash(ship.sq, reversed ? 1.07 : 0.95, reversed ? 0.94 : 1.07);
      for (let i = 0; i < (reversed ? 5 : 3); i++) {
        F.spawn({
          x: ship.x - 48, y: ship.y + 15 + (Math.random() - 0.5) * 12,
          vx: -110 - Math.random() * 90, vy: -direction * (40 + Math.random() * 70),
          g: 85, drag: 1.4, life: 0.35 + Math.random() * 0.2,
          size: 4 + Math.random() * 4, endSize: 0.2,
          color: 'rgba(211,250,248,0.78)', shape: 'circle', layer: -1
        });
      }
    };

    ship.onSpray = function (strength) {
      sprayClock += 0.1;
      if (sprayClock < 0.12) return;
      sprayClock = 0;
      F.spawn({
        x: ship.x - 57, y: ship.y + 20,
        vx: -115 - currentSpeed * 0.35, vy: -25 - Math.random() * 45,
        g: 115, drag: 1.2, life: 0.32 + Math.random() * 0.16,
        size: 4 + strength * 4, endSize: 0.2,
        color: 'rgba(226,253,249,0.74)', shape: 'circle', layer: -1
      });
    };

    function togglePauseKey() {
      if (!E.input.buffered('pause', 0.16)) return;
      E.input.consume('pause');
      if (state === 'paused') resumeFromPause(); else pauseGame();
    }

    function update(dt, dtReal) {
      uiTime += dtReal;
      pauseInputLock = Math.max(0, pauseInputLock - dtReal);
      mute.update(dtReal); pauseButton.update(dtReal);
      const muteChanged = UI.handleMuteKey(mute);
      if (muteChanged && state === 'paused') S.pause();
      togglePauseKey();

      if (state === 'paused') {
        resumeButton.update(dtReal);
        if (pauseInputLock <= 0 &&
            (E.input.buffered('jump', 0.16) || E.input.buffered('ok', 0.16))) {
          E.input.consume('jump'); E.input.consume('ok'); resumeButton.activate();
        }
        return;
      }
      if (state === 'rescue') {
        stateTime += dtReal; rescueButton.update(dtReal);
        if (stateTime > 0.55 &&
            (E.input.buffered('jump', 0.16) || E.input.buffered('ok', 0.16))) {
          E.input.consume('jump'); E.input.consume('ok'); rescueButton.activate();
        }
        return;
      }

      simTime += dt; stateTime += dt;
      hintTime = Math.max(0, hintTime - dt);
      comboTime = Math.max(0, comboTime - dt);
      boostTime = Math.max(0, boostTime - dt);
      if (comboTime <= 0) combo = 0;

      if (state === 'intro') {
        const begin = F.ease.inOutSine(F.clamp01((stateTime - 0.6) / 1.05));
        currentSpeed = F.damp(currentSpeed, 225 * begin, 3.2, dt);
        if (stateTime > 0.9) dist += currentSpeed * dt;
        ship.update(dt, stateTime > 1.0);
        if (stateTime > 2.1) { state = 'run'; stateTime = 0; }
      } else if (state === 'return') {
        currentSpeed = F.damp(currentSpeed, targetSpeed(), 2.3, dt);
        dist += currentSpeed * dt;
        ship.update(dt, stateTime > 0.55);
        if (stateTime > 1.05) { state = 'run'; stateTime = 0; }
      } else if (state === 'run') {
        updateWorld(dt);
      } else if (state === 'clear') {
        currentSpeed = F.damp(currentSpeed, 105, 2.6, dt);
        dist += currentSpeed * dt * 0.34;
        ship.update(dt, false);
        if (!clearBurst && stateTime > 0.34) {
          clearBurst = true;
          F.confetti(ship.x + 15, ship.y - 30, 58);
          F.sparkle(ship.x + 80, ship.y, '#ffe878', 22);
        }
        if (stateTime > 1.78 && !finishSent) {
          finishSent = true;
          options.onClear({ stars: currentsGot });
        }
      }
    }

    function makeView() {
      return { time: simTime, dist, speed: currentSpeed, total: level.total, hasSteered: ship.hasSteered };
    }

    function drawHUD(ctx) {
      UI.drawHearts(ctx, 39, 40, hearts, 5);
      ctx.fillStyle = 'rgba(40,36,82,0.56)'; UI.rr(ctx, 28, 69, 132, 44, 22); ctx.fill();
      ctx.strokeStyle = '#8ff0d1'; ctx.lineWidth = 4; ctx.lineCap = 'round';
      ctx.beginPath(); ctx.arc(55, 91, 13, -0.7, 1.4); ctx.stroke();
      ctx.fillStyle = '#fff7df'; ctx.font = '900 21px "Malgun Gothic", sans-serif';
      ctx.textAlign = 'left'; ctx.fillText('× ' + currentsGot, 79, 99);
      UI.drawProgress(ctx, W * 0.5 - 160, 27, 320, dist / level.total);
      pauseButton.draw(ctx); mute.draw(ctx);
      if (E.isTouch && state !== 'paused' && state !== 'rescue') { upButton.draw(ctx); downButton.draw(ctx); }
    }

    function drawIntro(ctx) {
      if (state !== 'intro') return;
      const enter = F.ease.outBack(F.clamp01((stateTime - 0.05) / 0.46));
      const leave = 1 - F.ease.inQuad(F.clamp01((stateTime - 1.38) / 0.62));
      ctx.save(); ctx.globalAlpha = leave; ctx.translate(W * 0.5, 118); ctx.scale(enter, enter);
      UI.panel(ctx, -266, -55, 532, 110, 24, '#fff8e8');
      ctx.textAlign = 'center'; ctx.fillStyle = '#a45850'; ctx.font = '900 18px "Malgun Gothic", sans-serif';
      ctx.fillText('두 번째 모험', 0, -15);
      ctx.fillStyle = '#342442'; ctx.font = '900 31px "Malgun Gothic", sans-serif';
      ctx.fillText('바람 주머니 항해', 0, 25); ctx.restore();
    }

    function drawHint(ctx) {
      if (hintTime <= 0) return;
      const enter = F.ease.outBack(F.clamp01((4.2 - hintTime) / 0.42));
      const leave = F.clamp01(hintTime / 0.42);
      ctx.save(); ctx.globalAlpha = leave; ctx.translate(W * 0.5, 98); ctx.scale(enter, enter);
      UI.panel(ctx, -280, -45, 560, 90, 22, '#fff8e8');
      UI.drawOwl(ctx, -225, 0, 0.47, uiTime, true);
      ctx.fillStyle = '#342442'; ctx.font = '900 20px "Malgun Gothic", sans-serif';
      ctx.textAlign = 'left'; ctx.fillText(hintText, -176, 8); ctx.restore();
    }

    function drawRescue(ctx) {
      ctx.fillStyle = 'rgba(34,31,70,0.68)'; ctx.fillRect(0, 0, W, H);
      const pop = F.ease.outBack(F.clamp01(stateTime / 0.48));
      ctx.save(); ctx.translate(W * 0.5, 238); ctx.scale(pop, pop);
      UI.panel(ctx, -306, -128, 612, 236, 28, '#fff8e8');
      UI.drawOwl(ctx, -213, -62, 0.82, uiTime, true);
      ctx.fillStyle = '#a45850'; ctx.font = '900 22px "Malgun Gothic", sans-serif'; ctx.textAlign = 'left';
      ctx.fillText('아테나가 바람을 살짝 묶었어요.', -135, -58);
      ctx.fillStyle = '#342442'; ctx.font = '900 25px "Malgun Gothic", sans-serif';
      ctx.fillText('포기하지 않으면 집에 갈 수 있어!', -135, -15);
      ctx.font = '700 18px "Malgun Gothic", sans-serif'; ctx.fillStyle = '#796476';
      ctx.fillText('잔잔한 곳에서 다시 출발해요.', -135, 24); ctx.restore();
      if (stateTime > 0.35) rescueButton.draw(ctx, true);
    }

    function drawPause(ctx) {
      ctx.fillStyle = 'rgba(35,31,70,0.64)'; ctx.fillRect(0, 0, W, H);
      UI.panel(ctx, W * 0.5 - 230, 122, 460, 262, 28, '#fff8e8');
      UI.drawOwl(ctx, W * 0.5, 218, 0.72, uiTime, true);
      ctx.fillStyle = '#342442'; ctx.textAlign = 'center'; ctx.font = '900 35px "Malgun Gothic", sans-serif';
      ctx.fillText('잠깐 쉬어요', W * 0.5, 292);
      ctx.font = '700 18px "Malgun Gothic", sans-serif'; ctx.fillStyle = '#796476';
      ctx.fillText('P 또는 Esc로 계속할 수 있어요.', W * 0.5, 326);
      resumeButton.draw(ctx, true);
    }

    function drawClear(ctx) {
      if (state !== 'clear' || stateTime < 0.26) return;
      const pop = F.ease.outBack(F.clamp01((stateTime - 0.26) / 0.48));
      ctx.save(); ctx.translate(W * 0.5, 119); ctx.scale(pop, pop); ctx.textAlign = 'center';
      ctx.font = '900 49px "Malgun Gothic", sans-serif'; ctx.lineWidth = 10; ctx.strokeStyle = '#342442'; ctx.lineJoin = 'round';
      ctx.strokeText('순풍을 찾았다!', 0, 0); ctx.fillStyle = '#fff08a'; ctx.fillText('순풍을 찾았다!', 0, 0);
      ctx.font = '900 22px "Malgun Gothic", sans-serif'; ctx.lineWidth = 6;
      ctx.strokeText('침착하게 길을 골랐어요.', 0, 40); ctx.fillStyle = '#fff8dc'; ctx.fillText('침착하게 길을 골랐어요.', 0, 40);
      ctx.restore();
    }

    function draw(ctx) {
      const view = makeView();
      const shake = E.shake || { x: 0, y: 0 };
      ctx.save(); ctx.translate(shake.x, shake.y);
      Art.drawBackground(ctx, view);
      F.drawParticles(ctx, -1);
      for (const obstacle of level.obstacles) {
        const sx = obstacle.x - dist;
        if (sx < -240 || sx > W + 260) continue;
        Art.drawObstacle(ctx, obstacle, sx, obstacleY(obstacle), gapBonus, simTime);
      }
      for (const current of level.currents) {
        if (current.got) continue;
        const sx = current.x - dist;
        if (sx > -90 && sx < W + 100) Art.drawCurrent(ctx, current, sx, simTime);
      }
      Art.drawSilentGuide(ctx, view, ship);
      Art.drawShip(ctx, ship, simTime, boostTime, shieldHits > 0);
      F.drawParticles(ctx, 0);
      Art.drawForeground(ctx, view);
      ctx.restore();
      drawHUD(ctx); drawIntro(ctx); drawHint(ctx); drawClear(ctx);
      if (state === 'rescue') drawRescue(ctx);
      if (state === 'paused') drawPause(ctx);
    }

    return {
      debug: {
        get state() { return state; }, get dist() { return dist; }, get hearts() { return hearts; },
        get rescues() { return rescues; }, get speed() { return currentSpeed; }, get assist() { return assist; },
        get gapBonus() { return gapBonus; }, get shipY() { return ship.y; }, get currentsGot() { return currentsGot; },
        obstacles: level.obstacles, currents: level.currents, total: level.total
      },
      enter() {
        S.unlock();
        S.startBgm('sea', { intensity: 0.28, fade: 0.75 });
        updateMusic(true);
      },
      exit() { releaseSteering(); if (state !== 'clear') S.stopBgm(); },
      update,
      pointer(type, x, y, pointerId) {
        if (type === 'cancel') {
          upButton.pointer(type, x, y, pointerId);
          downButton.pointer(type, x, y, pointerId);
          return;
        }
        if (mute.pointer(type, x, y)) { if (state === 'paused') S.pause(); return; }
        if (pauseButton.pointer(type, x, y)) return;
        if (state === 'rescue') { rescueButton.pointer(type, x, y); return; }
        if (state === 'paused') { resumeButton.pointer(type, x, y); return; }
        if (E.isTouch) {
          if (upButton.pointer(type, x, y, pointerId)) return;
          downButton.pointer(type, x, y, pointerId);
        }
      },
      draw
    };
  };
})();

// 키르케의 섬 — 즉시 반응하고 벽을 둥글게 미끄러지는 탑다운 이동
(function () {
  'use strict';

  window.ODY = window.ODY || {};

  class TopDownController {
    constructor(options) {
      const o = Object.assign({
        x: 330,
        y: 780,
        speed: 225,
        accel: 32,
        brake: 36,
        turnAccel: 42,
        pressImpulse: 90,
        radius: 20,
        worldWidth: 3600,
        worldHeight: 1500
      }, options);

      this.baseX = o.x;
      this.baseY = o.y;
      this.speed = o.speed;
      this.accel = o.accel;
      this.brake = o.brake;
      this.turnAccel = o.turnAccel;
      this.pressImpulse = o.pressImpulse;
      this.radius = o.radius;
      this.worldWidth = o.worldWidth;
      this.worldHeight = o.worldHeight;

      this.sq = ODY.Feel.makeSquash();
      this.onStep = null;
      this.onTurn = null;
      this.reset(o.x, o.y);
    }

    reset(x, y) {
      this.x = Number.isFinite(x) ? x : this.baseX;
      this.y = Number.isFinite(y) ? y : this.baseY;
      this.prev = { x: this.x, y: this.y };
      this.v = { x: 0, y: 0 };
      this.facingAngle = 0;
      this.facingX = 1;
      this.facingY = 0;
      this.invin = 0;
      this.hurtTime = 0;
      this.runPhase = 0;
      this.moveAmount = 0;
      this.hasMoved = false;
      this.blinkTime = 1.5;
      this.blink = 0;
      this._inputX = 0;
      this._inputY = 0;
      this._stepDistance = 0;
      this._stepIndex = 0;

      this.sq.sx = 1;
      this.sq.sy = 1;
      this.sq.vx = 0;
      this.sq.vy = 0;
    }

    bounds(padding) {
      const r = this.radius + (Number.isFinite(padding) ? padding : 0);
      return {
        left: this.x - r,
        right: this.x + r,
        top: this.y - r,
        bottom: this.y + r
      };
    }

    hurt(pushX, pushY) {
      if (this.invin > 0) return false;

      if (pushX && typeof pushX === 'object') {
        pushY = pushX.y;
        pushX = pushX.x;
      }
      let dx = Number.isFinite(pushX) ? pushX : -this.facingX;
      let dy = Number.isFinite(pushY) ? pushY : -this.facingY;
      let length = Math.hypot(dx, dy);
      if (length < 0.001) {
        dx = -1;
        dy = 0;
        length = 1;
      }
      dx /= length;
      dy /= length;

      this.invin = 1.2;
      this.hurtTime = 0.52;
      this.v.x = dx * 175;
      this.v.y = dy * 175;
      ODY.Feel.squash(this.sq, 1.25, 0.74);
      return true;
    }

    update(dt, canControl) {
      const E = ODY.E;
      const F = ODY.Feel;
      dt = F.clamp(Number.isFinite(dt) ? dt : 0, 0, 0.05);
      canControl = canControl !== false;

      this.prev.x = this.x;
      this.prev.y = this.y;
      this.invin = Math.max(0, this.invin - dt);
      this.hurtTime = Math.max(0, this.hurtTime - dt);

      let inputX = 0;
      let inputY = 0;
      if (canControl) {
        if (E.input.held('left')) inputX -= 1;
        if (E.input.held('right')) inputX += 1;
        if (E.input.held('up')) inputY -= 1;
        if (E.input.held('down')) inputY += 1;
      }

      const inputLength = Math.hypot(inputX, inputY);
      if (inputLength > 0) {
        inputX /= inputLength;
        inputY /= inputLength;
      }

      const oldLength = Math.hypot(this._inputX, this._inputY);
      const dot = oldLength > 0 ? inputX * this._inputX + inputY * this._inputY : -1;
      const beganOrTurned = inputLength > 0 && (oldLength === 0 || dot < 0.86);
      if (beganOrTurned) {
        const reversed = oldLength > 0 && dot < -0.15;
        this.v.x += inputX * this.pressImpulse;
        this.v.y += inputY * this.pressImpulse;
        const kickedSpeed = Math.hypot(this.v.x, this.v.y);
        const cap = this.speed * 1.12;
        if (kickedSpeed > cap) {
          this.v.x = this.v.x / kickedSpeed * cap;
          this.v.y = this.v.y / kickedSpeed * cap;
        }
        F.squash(this.sq, reversed ? 1.1 : 0.94, reversed ? 0.91 : 1.08);
        if (this.onTurn) this.onTurn(inputX, inputY, reversed, this);
      }
      this._inputX = inputX;
      this._inputY = inputY;

      if (inputLength > 0) {
        this.facingX = inputX;
        this.facingY = inputY;
        this.facingAngle = Math.atan2(inputY, inputX);
        this.hasMoved = true;
      }

      const targetX = inputX * this.speed;
      const targetY = inputY * this.speed;
      let response = this.brake;
      if (inputLength > 0) {
        const along = this.v.x * inputX + this.v.y * inputY;
        response = along < -1 ? this.turnAccel : this.accel;
      }
      this.v.x = F.damp(this.v.x, targetX, response, dt);
      this.v.y = F.damp(this.v.y, targetY, response, dt);

      this.x += this.v.x * dt;
      this.y += this.v.y * dt;

      const actualDx = this.x - this.prev.x;
      const actualDy = this.y - this.prev.y;
      const travelled = Math.hypot(actualDx, actualDy);
      this.moveAmount = F.damp(this.moveAmount, F.clamp(travelled / Math.max(0.001, this.speed * dt), 0, 1), 18, dt);
      this.runPhase += travelled * 0.105;
      this._stepDistance += travelled;
      while (this._stepDistance >= 56) {
        this._stepDistance -= 56;
        this._stepIndex++;
        if (this.onStep) this.onStep(this._stepIndex & 1, this);
      }

      this.blinkTime -= dt;
      if (this.blinkTime <= 0 && this.blink <= 0) {
        this.blink = 0.11;
        this.blinkTime = 1.8 + (Math.sin(ODY.E.time * 6.73) + 1) * 0.7;
      }
      this.blink = Math.max(0, this.blink - dt);
      F.updSquash(this.sq, dt);
    }

    resolve(walls, width, height) {
      const F = ODY.Feel;
      const list = Array.isArray(walls) ? walls : [];
      let limits;
      if (width && typeof width === 'object') {
        limits = {
          left: Number.isFinite(width.left) ? width.left : 0,
          top: Number.isFinite(width.top) ? width.top : 0,
          right: Number.isFinite(width.right) ? width.right : this.worldWidth,
          bottom: Number.isFinite(width.bottom) ? width.bottom : this.worldHeight
        };
      } else {
        limits = {
          left: 0,
          top: 0,
          right: Number.isFinite(width) ? width : this.worldWidth,
          bottom: Number.isFinite(height) ? height : this.worldHeight
        };
      }

      let collided = false;
      const r = this.radius;

      function removeIntoVelocity(controller, nx, ny) {
        const into = controller.v.x * nx + controller.v.y * ny;
        if (into < 0) {
          controller.v.x -= nx * into;
          controller.v.y -= ny * into;
        }
      }

      // 모서리 두 개가 동시에 닿아도 한 축에 갇히지 않도록 몇 번만 반복한다.
      for (let pass = 0; pass < 3; pass++) {
        let passCollision = false;
        for (const wall of list) {
          if (!wall || wall.active === false || wall.enabled === false) continue;

          if (wall.kind === 'circle' || wall.type === 'circle') {
            const wr = Math.max(0, Number(wall.radius === undefined ? wall.r : wall.radius) || 0);
            let dx = this.x - wall.x;
            let dy = this.y - wall.y;
            let distance = Math.hypot(dx, dy);
            const target = r + wr;
            if (distance >= target) continue;
            if (distance < 0.0001) {
              dx = this.facingX || 1;
              dy = this.facingY || 0;
              distance = 1;
            }
            const nx = dx / distance;
            const ny = dy / distance;
            const push = target - distance;
            this.x += nx * push;
            this.y += ny * push;
            removeIntoVelocity(this, nx, ny);
            passCollision = collided = true;
            continue;
          }

          const x = Number(wall.x) || 0;
          const y = Number(wall.y) || 0;
          const w = Math.max(0, Number(wall.w) || 0);
          const h = Math.max(0, Number(wall.h) || 0);
          if (w <= 0 || h <= 0) continue;

          // 둥근 사각형의 중심 직사각형과 둥근 모서리에 원 충돌체를 합친다.
          const corner = F.clamp(Number(wall.radius) || 0, 0, Math.min(w, h) * 0.5);
          const cx = x + w * 0.5;
          const cy = y + h * 0.5;
          const coreHalfX = Math.max(0, w * 0.5 - corner);
          const coreHalfY = Math.max(0, h * 0.5 - corner);
          const closestX = F.clamp(this.x, cx - coreHalfX, cx + coreHalfX);
          const closestY = F.clamp(this.y, cy - coreHalfY, cy + coreHalfY);
          let dx = this.x - closestX;
          let dy = this.y - closestY;
          let distance = Math.hypot(dx, dy);
          const target = corner + r;
          if (distance >= target) continue;

          let nx;
          let ny;
          let push;
          if (distance > 0.0001) {
            nx = dx / distance;
            ny = dy / distance;
            push = target - distance;
          } else {
            const leftDepth = this.x - (x - r);
            const rightDepth = (x + w + r) - this.x;
            const topDepth = this.y - (y - r);
            const bottomDepth = (y + h + r) - this.y;
            const minimum = Math.min(leftDepth, rightDepth, topDepth, bottomDepth);
            if (minimum === leftDepth) { nx = -1; ny = 0; push = leftDepth; }
            else if (minimum === rightDepth) { nx = 1; ny = 0; push = rightDepth; }
            else if (minimum === topDepth) { nx = 0; ny = -1; push = topDepth; }
            else { nx = 0; ny = 1; push = bottomDepth; }
          }
          this.x += nx * push;
          this.y += ny * push;
          removeIntoVelocity(this, nx, ny);
          passCollision = collided = true;
        }
        if (!passCollision) break;
      }

      const beforeX = this.x;
      const beforeY = this.y;
      this.x = F.clamp(this.x, limits.left + r, limits.right - r);
      this.y = F.clamp(this.y, limits.top + r, limits.bottom - r);
      if (this.x !== beforeX) {
        if ((this.x > beforeX && this.v.x < 0) || (this.x < beforeX && this.v.x > 0)) this.v.x = 0;
        collided = true;
      }
      if (this.y !== beforeY) {
        if ((this.y > beforeY && this.v.y < 0) || (this.y < beforeY && this.v.y > 0)) this.v.y = 0;
        collided = true;
      }
      return collided;
    }
  }

  ODY.TopDownController = TopDownController;
})();
