  <script>
/* src/stages/underworld.js */
// 스테이지 4 — 별빛 저승
// 등불 파동으로 사라지는 별길을 밝히고, 기억별 다섯 개를 순서대로 찾는다.
(function () {
  'use strict';

  window.ODY = window.ODY || {};
  ODY.Stages = ODY.Stages || {};

  ODY.Stages.underworld = function (options) {
    options = options || {};
    const E = ODY.E;
    const F = ODY.Feel;
    const S = ODY.Snd;
    const UI = ODY.UI;
    const Art = ODY.Art.underworld;
    const W = E.W;
    const H = E.H;
    const level = ODY.Levels.underworld.build();
    const hero = new ODY.TopDownController({
      x: level.start.x,
      y: level.start.y,
      speed: 222,
      worldWidth: level.worldW,
      worldHeight: level.worldH
    });

    let simTime = 0;
    let hazardTime = 0;
    let uiTime = 0;
    let state = 'intro';
    let stateTime = 0;
    let stateBeforePause = 'run';
    let pauseInputLock = 0;
    let hearts = 5;
    let memories = 0;
    let checkpointIndex = 0;
    let rescues = 0;
    let failures = 0;
    let assist = false;
    let pulses = 0;
    let pulseTime = 0;
    let pulseCooldown = 0;
    let lastPulseAt = -99;
    let autoPulseDone = false;
    let darkness = 0;
    let dangerGrace = 0;
    let hintText = '';
    let hintTime = 0;
    let finishSent = false;
    let clearBurst = false;
    let musicBand = -1;
    let cameraX = F.clamp(level.start.x - W * 0.34, 0, level.worldW - W);
    let cameraY = F.clamp(level.start.y - H * 0.5, 0, level.worldH - H);

    const memoryStars = level.memories.map(data => Object.assign({}, data, {
      collected: false,
      revealed: false,
      revealTime: 0,
      collectTime: 0,
      sq: F.makeSquash()
    }));

    const trailStates = level.trails.map((trail, trailIndex) => ({
      trail,
      trailIndex,
      segments: trail.points.slice(0, -1).map((point, index) => ({
        id: trail.id + '-' + index,
        trailId: trail.id,
        trailOrder: trail.order,
        index,
        a: point,
        b: trail.points[index + 1],
        lit: 0,
        revealCount: 0
      }))
    }));

    const shadows = level.hazards.map(data => Object.assign({}, data, {
      path: data.path.map(point => Object.assign({}, point)),
      x: data.x,
      y: data.y,
      vx: 0,
      vy: 0,
      pathIndex: data.path.length > 1 ? 1 : 0,
      stun: 0,
      hitLock: 0,
      alert: 0,
      moving: false,
      repelled: 0,
      sq: F.makeSquash()
    }));

    const pulseWaves = [];
    const mute = UI.makeMuteBtn();
    const resumeButton = new UI.Button({
      x: W * 0.5,
      y: 361,
      w: 244,
      h: 66,
      label: '계속 걷기',
      size: 27,
      color: '#9bcfdc',
      onTap: resumeFromPause
    });
    const rescueButton = new UI.Button({
      x: W * 0.5,
      y: 411,
      w: 260,
      h: 68,
      label: '다시 가자',
      size: 28,
      color: '#a7bde9',
      onTap: resumeFromRescue
    });

    const pauseButton = {
      x: W - 106,
      y: 40,
      r: 25,
      sq: F.makeSquash(),
      pointer(type, x, y) {
        if (type !== 'down') return false;
        if ((x - this.x) ** 2 + (y - this.y) ** 2 > (this.r + 9) ** 2) return false;
        F.squash(this.sq, 0.86, 0.86);
        if (state === 'paused') resumeFromPause();
        else pauseGame();
        if (typeof S.click === 'function') S.click();
        return true;
      },
      update(dt) { F.updSquash(this.sq, dt); },
      draw(ctx) {
        ctx.save(); ctx.translate(this.x, this.y); ctx.scale(this.sq.sx, this.sq.sy);
        ctx.fillStyle = 'rgba(42,37,75,0.64)';
        ctx.beginPath(); ctx.arc(0, 0, this.r, 0, Math.PI * 2); ctx.fill();
        ctx.strokeStyle = 'rgba(255,255,255,0.52)'; ctx.lineWidth = 2; ctx.stroke();
        ctx.fillStyle = '#fff7dc'; ctx.fillRect(-8, -10, 5, 20); ctx.fillRect(3, -10, 5, 20);
        ctx.restore();
      }
    };

    const stick = { x: 110, y: H - 102, r: 70, pointerId: null, knobX: 0, knobY: 0 };
    const actionButton = { x: W - 91, y: H - 104, r: 62, pointerId: null, down: false, sq: F.makeSquash() };

    function callSfx(primary, fallback) {
      const args = Array.prototype.slice.call(arguments, 2);
      const fn = typeof S[primary] === 'function' ? S[primary] : S[fallback];
      if (typeof fn === 'function') fn.apply(S, args);
    }

    function setStick(px, py) {
      let dx = px - stick.x;
      let dy = py - stick.y;
      const length = Math.hypot(dx, dy);
      if (length > stick.r) {
        dx *= stick.r / length;
        dy *= stick.r / length;
      }
      stick.knobX = dx;
      stick.knobY = dy;
      const dead = 13;
      E.input.setHeld('left', dx < -dead);
      E.input.setHeld('right', dx > dead);
      E.input.setHeld('up', dy < -dead);
      E.input.setHeld('down', dy > dead);
    }

    function releaseStick() {
      stick.pointerId = null;
      stick.knobX = 0;
      stick.knobY = 0;
      E.input.setHeld('left', false);
      E.input.setHeld('right', false);
      E.input.setHeld('up', false);
      E.input.setHeld('down', false);
    }

    function releaseAction() {
      actionButton.pointerId = null;
      actionButton.down = false;
      E.input.setHeld('action', false);
    }

    function releaseControls() {
      releaseStick();
      releaseAction();
    }

    function clearInputBuffers() {
      E.input.clearVirtual();
      E.input.clearBuffered();
    }

    function showHint(text) {
      hintText = text;
      hintTime = 4.5;
      callSfx('athena', 'pickup', 1);
      F.sparkle(W * 0.5 - 220, 95, '#d8d1ff', 10);
      UI.announce(text);
    }

    function registerFailure() {
      failures++;
      if (failures >= 3 && !assist) {
        assist = true;
        showHint('아테나의 빛이 별길을 오래 밝혀 줄게.');
        updateMusic(true);
      }
    }

    function pauseGame() {
      if (state === 'paused' || state === 'rescue' || state === 'clear') return;
      stateBeforePause = state;
      state = 'paused';
      stateTime = 0;
      pauseInputLock = 0.22;
      releaseControls();
      clearInputBuffers();
      if (typeof S.pause === 'function') S.pause();
      UI.announce('잠깐 쉬어요. 계속 걷기 버튼을 누르세요.');
    }

    function resumeFromPause() {
      if (state !== 'paused') return;
      state = stateBeforePause === 'intro' ? 'run' : stateBeforePause;
      stateTime = 0;
      pauseInputLock = 0.2;
      clearInputBuffers();
      if (typeof S.resume === 'function') S.resume();
      UI.announce('다시 별길을 걸어요.');
    }

    function checkpointForMemories() {
      for (let i = level.checkpoints.length - 1; i >= 0; i--) {
        if (memories >= level.checkpoints[i].memories) return i;
      }
      return 0;
    }

    function resumeFromRescue() {
      if (state !== 'rescue') return;
      checkpointIndex = checkpointForMemories();
      const checkpoint = level.checkpoints[checkpointIndex];
      hearts = 5;
      darkness = 0;
      dangerGrace = 2.8;
      hero.reset(checkpoint.x, checkpoint.y);
      hero.invin = 1.6;
      cameraX = F.clamp(hero.x - W * 0.34, 0, level.worldW - W);
      cameraY = F.clamp(hero.y - H * 0.5, 0, level.worldH - H);
      state = 'recover';
      stateTime = 0;
      releaseControls();
      clearInputBuffers();
      if (typeof S.setMusicState === 'function') S.setMusicState('play');
      updateMusic(true);
      F.sparkle(W * 0.5, H * 0.5, '#fff0a2', 20);
      pulseLantern(true);
      UI.announce('아테나와 함께 마지막 기억별에서 다시 시작해요.');
    }

    function updateMusic(force) {
      let intensity = 0.25 + memories * 0.055;
      if (memories >= level.memories.length) intensity = 0.58;
      if (assist) intensity = Math.min(intensity, 0.46);
      const band = Math.round(intensity * 100);
      if (force || band !== musicBand) {
        musicBand = band;
        if (typeof S.setMusicIntensity === 'function') S.setMusicIntensity(intensity, 0.85);
      }
    }

    hero.onStep = function () {
      if (state !== 'run' && state !== 'recover') return;
      const sx = hero.x - cameraX;
      const sy = hero.y - cameraY + 20;
      F.dust(sx, sy, 2, 'rgba(205,202,226,0.38)', 48);
      if (typeof S.step === 'function' && Math.floor(simTime * 2) % 2 === 0) S.step();
    };

    function pointSegmentInfo(px, py, a, b) {
      const dx = b.x - a.x;
      const dy = b.y - a.y;
      const denominator = dx * dx + dy * dy;
      const t = denominator > 0 ? F.clamp(((px - a.x) * dx + (py - a.y) * dy) / denominator, 0, 1) : 0;
      const x = a.x + dx * t;
      const y = a.y + dy * t;
      return { x, y, t, distance: Math.hypot(px - x, py - y) };
    }

    function trailIsAvailable(trail) {
      if (trail.returnTrail) return memories >= level.memories.length;
      return trail.order <= memories + 1;
    }

    function nearestAvailablePath(px, py) {
      let best = { x: level.start.x, y: level.start.y, distance: Infinity, segment: null };
      for (const trailState of trailStates) {
        if (!trailIsAvailable(trailState.trail)) continue;
        for (const segment of trailState.segments) {
          const info = pointSegmentInfo(px, py, segment.a, segment.b);
          if (info.distance < best.distance) best = Object.assign(info, { segment });
        }
      }
      return best;
    }

    function pulseProfile() {
      return assist ? {
        radius: level.lantern.assistRadius,
        reveal: level.lantern.assistRevealSeconds,
        cooldown: level.lantern.assistCooldown,
        stun: level.lantern.assistShadowStun
      } : {
        radius: level.lantern.radius,
        reveal: level.lantern.revealSeconds,
        cooldown: level.lantern.cooldown,
        stun: level.lantern.shadowStun
      };
    }

    function pulseLantern(automatic) {
      if (!automatic && state !== 'run' && state !== 'intro' && state !== 'recover') return false;
      if (!automatic && pulseCooldown > 0) return false;
      const profile = pulseProfile();
      pulseCooldown = automatic ? Math.min(0.35, profile.cooldown) : profile.cooldown;
      pulseTime = 0.36;
      lastPulseAt = simTime;
      if (!automatic) pulses++;
      F.squash(hero.sq, 1.22, 0.78);
      F.squash(actionButton.sq, 1.12, 0.9);

      pulseWaves.push({
        x: hero.x,
        y: hero.y,
        age: 0,
        life: 0.72,
        radius: profile.radius,
        automatic: !!automatic
      });

      const sx = hero.x - cameraX;
      const sy = hero.y - cameraY;
      F.ring(sx, sy, '#fff0a2', 24, 0.48);
      for (let i = 0; i < 10; i++) {
        const angle = i * Math.PI * 2 / 10;
        F.spawn({
          x: sx + Math.cos(angle) * 15,
          y: sy + Math.sin(angle) * 15,
          vx: Math.cos(angle) * (95 + i * 5),
          vy: Math.sin(angle) * (95 + i * 5),
          drag: 3,
          life: 0.46,
          size: 4.5,
          endSize: 0.2,
          color: i % 2 ? '#fff0a2' : '#bce7f0',
          shape: i % 3 ? 'diamond' : 'star'
        });
      }

      for (const trailState of trailStates) {
        if (!trailIsAvailable(trailState.trail)) continue;
        for (const segment of trailState.segments) {
          const info = pointSegmentInfo(hero.x, hero.y, segment.a, segment.b);
          if (info.distance <= profile.radius + 84) {
            segment.lit = Math.max(segment.lit, profile.reveal);
            segment.revealCount++;
          }
        }
      }

      const target = memoryStars[memories];
      if (target && Math.hypot(hero.x - target.x, hero.y - target.y) <= profile.radius + 82) {
        target.revealed = true;
        target.revealTime = Math.max(target.revealTime, profile.reveal);
        F.squash(target.sq, 1.2, 0.82);
      }

      let repelled = 0;
      for (const shadow of shadows) {
        const dx = shadow.x - hero.x;
        const dy = shadow.y - hero.y;
        const distance = Math.hypot(dx, dy);
        if (distance > profile.radius + shadow.radius) continue;
        const length = distance || 1;
        shadow.x += dx / length * 28;
        shadow.y += dy / length * 28;
        shadow.stun = Math.max(shadow.stun, profile.stun);
        shadow.repelled++;
        shadow.pathIndex = (shadow.pathIndex + 1) % shadow.path.length;
        F.squash(shadow.sq, 1.28, 0.72);
        repelled++;
      }

      callSfx('lanternPulse', 'shield', automatic ? 0 : 1);
      if (repelled > 0) callSfx('shadowPuff', 'whoosh');
      return true;
    }

    function collectMemory(memory) {
      if (!memory || memory.collected || memory.order !== memories + 1) return;
      memory.collected = true;
      memory.collectTime = simTime;
      memories++;
      failures = 0;
      darkness = 0;
      dangerGrace = 2.5;
      checkpointIndex = checkpointForMemories();
      const checkpoint = level.checkpoints[checkpointIndex];
      if (checkpoint && checkpoint.heal) hearts = Math.min(5, hearts + checkpoint.heal);

      F.squash(memory.sq, 1.34, 0.68);
      F.squash(hero.sq, 1.16, 0.84);
      const sx = memory.x - cameraX;
      const sy = memory.y - cameraY;
      F.doHitstop(0.055);
      F.pulseSlowmo(0.55, 0.08, 0.24);
      F.flash('#fff4b8', 0.13);
      F.sparkle(sx, sy, memory.color, 28);
      F.ring(sx, sy, '#fff5b0', 32, 0.56);
      F.pop(sx, sy - 54, memory.short + '!', '#fff0a2', 22);
      callSfx('memoryStar', 'pickup', Math.min(3, memories));

      if (memories >= memoryStars.length) {
        showHint('기억이 모였어. 테이레시아스에게 돌아가자.');
        // 돌아오는 첫 부분도 즉시 보여 주어 방향 전환이 자연스럽다.
        pulseLantern(true);
      } else {
        UI.announce(memory.title + '을 찾았어요. 다음 별길이 깨어났어요.');
        pulseLantern(true);
      }
      updateMusic(true);
    }

    function tryCollectMemory() {
      const target = memoryStars[memories];
      if (!target || target.collected) return;
      const distance = Math.hypot(hero.x - target.x, hero.y - target.y);
      if (distance < 78 && !target.revealed) {
        // 바로 앞에 선 아이가 길을 잃었다고 느끼지 않게 별의 윤곽은 살짝 반응한다.
        target.revealTime = Math.max(target.revealTime, 0.18);
      }
      if (distance <= hero.radius + target.radius + 8 && target.revealTime > 0.04) collectMemory(target);
    }

    function hurtHero(fromX, fromY) {
      if ((state !== 'run' && state !== 'recover') || hero.invin > 0) return false;
      let dx = hero.x - fromX;
      let dy = hero.y - fromY;
      const length = Math.hypot(dx, dy) || 1;
      dx /= length;
      dy /= length;
      if (!hero.hurt(dx, dy)) return false;
      hearts--;
      darkness = 0;
      dangerGrace = 1.15;
      registerFailure();
      const sx = hero.x - cameraX;
      const sy = hero.y - cameraY;
      F.doHitstop(0.07);
      F.addShake(0.28, dx, dy);
      F.flash('#d9c6ee', 0.12);
      F.debris(sx, sy, '#c8bde1', 9, dx > 0 ? 1 : -1);
      F.pop(sx, sy - 50, '괜찮아!', '#fff0a2', 22);
      callSfx('shadowTouch', 'hit');

      if (hearts <= 0) {
        state = 'rescue';
        stateTime = 0;
        rescues++;
        releaseControls();
        clearInputBuffers();
        F.pulseSlowmo(0.3, 0.12, 0.25);
        if (typeof S.setMusicState === 'function') S.setMusicState('rescue');
        callSfx('athena', 'pickup', 1);
        UI.announce('아테나가 어둠을 걷어 냈어요. 다시 가자 버튼을 누르세요.');
      }
      return true;
    }

    function updateShadow(shadow, dt) {
      F.updSquash(shadow.sq, dt);
      shadow.hitLock = Math.max(0, shadow.hitLock - dt);
      shadow.alert = F.damp(shadow.alert, 0, 5.5, dt);
      shadow.moving = false;
      if (simTime < shadow.minStageTime || simTime < level.tutorial.hazardsEnabledAfter) return;

      if (shadow.stun > 0) {
        shadow.stun = Math.max(0, shadow.stun - dt);
        shadow.vx = F.damp(shadow.vx, 0, 10, dt);
        shadow.vy = F.damp(shadow.vy, 0, 10, dt);
        return;
      }

      const target = shadow.path[shadow.pathIndex];
      let dx = target.x - shadow.x;
      let dy = target.y - shadow.y;
      let distance = Math.hypot(dx, dy);
      if (distance < 14) {
        shadow.pathIndex = (shadow.pathIndex + 1) % shadow.path.length;
        F.squash(shadow.sq, 0.88, 1.12);
        return;
      }
      distance = distance || 1;
      dx /= distance;
      dy /= distance;
      const speed = shadow.speed * (assist ? 0.78 : 1);
      shadow.vx = F.damp(shadow.vx, dx * speed, 7.5, dt);
      shadow.vy = F.damp(shadow.vy, dy * speed, 7.5, dt);
      shadow.x += shadow.vx * dt;
      shadow.y += shadow.vy * dt;
      shadow.moving = true;

      const heroDistance = Math.hypot(hero.x - shadow.x, hero.y - shadow.y);
      if (heroDistance < 150) shadow.alert = F.clamp01((150 - heroDistance) / 90);
      if (dangerGrace <= 0 && heroDistance <= hero.radius + shadow.radius && shadow.hitLock <= 0) {
        shadow.hitLock = 0.9;
        shadow.stun = 0.55;
        hurtHero(shadow.x, shadow.y);
      }
    }

    function updateDarkness(dt) {
      if (simTime < level.tutorial.safeSeconds || dangerGrace > 0 || state !== 'run') {
        darkness = Math.max(0, darkness - level.pathSafety.recoverPerSecond * dt);
        return;
      }
      const nearest = nearestAvailablePath(hero.x, hero.y);
      const safeRadius = assist ? level.pathSafety.assistRadius : level.pathSafety.radius;
      if (nearest.distance <= safeRadius || Math.hypot(hero.x - level.oracle.x, hero.y - level.oracle.y) < 125) {
        darkness = Math.max(0, darkness - level.pathSafety.recoverPerSecond * dt);
        return;
      }
      darkness += dt;
      if (darkness > level.pathSafety.warningSeconds && Math.floor((darkness - dt) * 3) !== Math.floor(darkness * 3)) {
        const sx = hero.x - cameraX;
        const sy = hero.y - cameraY;
        F.ring(sx, sy, '#c9bce4', 18 + darkness * 4, 0.3);
        callSfx('shadowWarning', 'warning', 1);
      }
      if (darkness >= level.pathSafety.hurtSeconds) {
        hurtHero(nearest.x, nearest.y);
      }
    }

    function triggerClear() {
      if (state === 'clear') return;
      state = 'clear';
      stateTime = 0;
      releaseControls();
      clearInputBuffers();
      F.pulseSlowmo(0.26, 0.15, 0.4);
      F.flash('#fff3af', 0.16);
      if (typeof S.startBgm === 'function') S.startBgm('rewardUnderworld', { intensity: 0.4, fade: 0.48 });
      callSfx('clear', 'pickup', 3);
      UI.announce('다섯 기억이 길을 밝혔어요. 지혜로 돌아갈 길을 찾았어요!');
    }

    function checkReturn() {
      if (memories < memoryStars.length) return;
      if (Math.hypot(hero.x - level.oracle.x, hero.y - level.oracle.y) <= level.oracle.radius + hero.radius + 10) {
        triggerClear();
      }
    }

    function updateTrails(dt) {
      for (const trailState of trailStates) {
        for (const segment of trailState.segments) segment.lit = Math.max(0, segment.lit - dt);
      }
      for (const memory of memoryStars) {
        F.updSquash(memory.sq, dt);
        memory.revealTime = Math.max(0, memory.revealTime - dt);
      }
      for (let i = pulseWaves.length - 1; i >= 0; i--) {
        pulseWaves[i].age += dt;
        if (pulseWaves[i].age >= pulseWaves[i].life) pulseWaves.splice(i, 1);
      }
    }

    function updateCamera(dt) {
      const targetX = F.clamp(hero.x - W * 0.42, 0, level.worldW - W);
      const targetY = F.clamp(hero.y - H * 0.5, 0, level.worldH - H);
      cameraX = F.damp(cameraX, targetX, 6.2, dt);
      cameraY = F.damp(cameraY, targetY, 6.2, dt);
    }

    function togglePauseKey() {
      if (!E.input.buffered('pause', 0.16)) return;
      E.input.consume('pause');
      if (state === 'paused') resumeFromPause();
      else pauseGame();
    }

    function updatePlaying(dt) {
      simTime += dt;
      hazardTime += dt * (assist ? 0.82 : 1);
      stateTime += dt;
      hintTime = Math.max(0, hintTime - dt);
      pulseTime = Math.max(0, pulseTime - dt);
      pulseCooldown = Math.max(0, pulseCooldown - dt);
      dangerGrace = Math.max(0, dangerGrace - dt);
      F.updSquash(actionButton.sq, dt);
      updateTrails(dt);

      const canMove = state === 'run' || (state === 'intro' && stateTime > 0.42) ||
        (state === 'recover' && stateTime > 0.34);
      hero.update(dt, canMove);
      hero.resolve(level.walls, level.bounds);

      if (!autoPulseDone && simTime >= level.tutorial.autoPulseAt) {
        autoPulseDone = true;
        pulseLantern(true);
      }

      if (canMove && E.input.buffered('action', 0.22) && pulseCooldown <= 0) {
        E.input.consume('action');
        pulseLantern(false);
      }

      tryCollectMemory();
      for (const shadow of shadows) updateShadow(shadow, dt);
      updateDarkness(dt);
      checkReturn();

      if (state === 'intro' && stateTime > 2.05) {
        state = 'run';
        stateTime = 0;
      } else if (state === 'recover' && stateTime > 1.0) {
        state = 'run';
        stateTime = 0;
      }
      updateMusic(false);
      updateCamera(dt);
    }

    function update(dt, dtReal) {
      dt = Number.isFinite(dt) ? dt : 0;
      dtReal = Number.isFinite(dtReal) ? dtReal : dt;
      uiTime += dtReal;
      pauseInputLock = Math.max(0, pauseInputLock - dtReal);
      mute.update(dtReal);
      pauseButton.update(dtReal);
      const muteChanged = UI.handleMuteKey(mute);
      if (muteChanged && state === 'paused' && typeof S.pause === 'function') S.pause();
      togglePauseKey();

      if (state === 'paused') {
        resumeButton.update(dtReal);
        if (pauseInputLock <= 0 &&
            (E.input.buffered('action', 0.16) || E.input.buffered('ok', 0.16))) {
          E.input.consume('action');
          E.input.consume('ok');
          resumeButton.activate();
        }
        return;
      }

      if (state === 'rescue') {
        stateTime += dtReal;
        rescueButton.update(dtReal);
        if (stateTime > 0.55 &&
            (E.input.buffered('action', 0.16) || E.input.buffered('ok', 0.16))) {
          E.input.consume('action');
          E.input.consume('ok');
          rescueButton.activate();
        }
        return;
      }

      if (state === 'clear') {
        stateTime += dt;
        hero.update(dt, false);
        updateCamera(dt);
        updateTrails(dt);
        if (!clearBurst && stateTime > 0.28) {
          clearBurst = true;
          F.confetti(W * 0.5, H * 0.42, 68);
          F.sparkle(W * 0.5, H * 0.44, '#ffe98e', 30);
        }
        if (stateTime > 1.9 && !finishSent) {
          finishSent = true;
          if (typeof options.onClear === 'function') options.onClear({ stars: memories });
        }
        return;
      }

      updatePlaying(dt);
    }

    function worldToScreen(x, y) {
      return { x: x - cameraX, y: y - cameraY };
    }

    function trailVisibility(trail, segment) {
      if (segment.lit > 0) return F.clamp01(segment.lit / 0.55);
      if (trail.id === level.tutorial.firstTrailId && simTime < level.tutorial.safeSeconds) {
        return 0.1 + (Math.sin(simTime * 2.4 + segment.index) + 1) * 0.035;
      }
      if (!trail.returnTrail && trail.order <= memories) return 0.055;
      return 0;
    }

    function drawTrails(ctx) {
      for (const trailState of trailStates) {
        if (!trailIsAvailable(trailState.trail)) continue;
        for (const segment of trailState.segments) {
          Art.drawTrailSegment(
            ctx,
            segment.a,
            segment.b,
            cameraX,
            cameraY,
            simTime,
            trailVisibility(trailState.trail, segment),
            trailState.trailIndex * 1.7 + segment.index * 0.43
          );
        }
      }
    }

    function drawDecor(ctx) {
      for (const item of level.decor) {
        const point = worldToScreen(item.x, item.y);
        if (point.x < -120 || point.x > W + 120 || point.y < -120 || point.y > H + 120) continue;
        Art.drawDecor(ctx, item, point.x, point.y, simTime);
      }
    }

    function drawWalls(ctx) {
      for (const wall of level.walls) {
        const point = worldToScreen(wall.x, wall.y);
        const radius = wall.radius || 50;
        if (point.x < -radius - 30 || point.x > W + radius + 30 ||
            point.y < -radius - 50 || point.y > H + radius + 50) continue;
        Art.drawWall(ctx, wall, point.x, point.y, simTime);
      }
    }

    function drawMemoryStars(ctx) {
      for (const memory of memoryStars) {
        if (memory.collected) continue;
        const point = worldToScreen(memory.x, memory.y);
        if (point.x < -90 || point.x > W + 90 || point.y < -90 || point.y > H + 90) continue;
        const active = memory.order === memories + 1;
        const reveal = memory.revealTime > 0 ? F.clamp01(memory.revealTime / 0.45) : 0;
        Art.drawMemory(ctx, memory, point.x, point.y, simTime, active, reveal, false);
        if (active && reveal > 0.2 && Math.hypot(hero.x - memory.x, hero.y - memory.y) < 235) {
          ctx.save(); ctx.globalAlpha = reveal;
          ctx.fillStyle = '#fff8df'; ctx.textAlign = 'center';
          ctx.font = '900 18px "Malgun Gothic", sans-serif';
          ctx.strokeStyle = 'rgba(45,35,68,0.7)'; ctx.lineWidth = 5;
          ctx.strokeText(memory.short, point.x, point.y - 48);
          ctx.fillText(memory.short, point.x, point.y - 48); ctx.restore();
        }
      }
    }

    function drawActors(ctx) {
      const actors = shadows.map(shadow => ({ kind: 'shadow', y: shadow.y, shadow }));
      actors.push({ kind: 'oracle', y: level.oracle.y });
      actors.push({ kind: 'hero', y: hero.y });
      actors.sort((a, b) => a.y - b.y);

      for (const actor of actors) {
        if (actor.kind === 'hero') {
          const point = worldToScreen(hero.x, hero.y);
          if (hero.invin <= 0 || Math.floor(uiTime * 14) % 2 === 0) {
            Art.drawHero(ctx, {
              sq: hero.sq,
              angle: hero.facingAngle,
              moving: hero.moveAmount > 0.08,
              runPhase: hero.runPhase,
              blink: hero.blink
            }, point.x, point.y, simTime, F.clamp01(pulseTime / 0.36));
          }
        } else if (actor.kind === 'oracle') {
          const point = worldToScreen(level.oracle.x, level.oracle.y);
          if (point.x > -100 && point.x < W + 100 && point.y > -100 && point.y < H + 100) {
            Art.drawTiresias(ctx, level.oracle, point.x, point.y, simTime, memories >= memoryStars.length);
          }
        } else {
          const shadow = actor.shadow;
          if (simTime < shadow.minStageTime - 0.8) continue;
          const point = worldToScreen(shadow.x, shadow.y);
          if (point.x < -80 || point.x > W + 80 || point.y < -80 || point.y > H + 80) continue;
          Art.drawShadow(ctx, shadow, point.x, point.y, simTime);
        }
      }
    }

    function drawPulseWaves(ctx) {
      for (const pulse of pulseWaves) Art.drawLanternPulse(ctx, pulse, cameraX, cameraY);
    }

    function targetPoint() {
      if (memories >= memoryStars.length) return level.oracle;
      return memoryStars[memories];
    }

    function drawDirectionArrow(ctx, force) {
      const target = targetPoint();
      const dx = target.x - hero.x;
      const dy = target.y - hero.y;
      const distance = Math.hypot(dx, dy);
      if (!force && distance < 330) return;
      const angle = Math.atan2(dy, dx);
      const hx = hero.x - cameraX;
      const hy = hero.y - cameraY;
      const x = hx + Math.cos(angle) * 62;
      const y = hy + Math.sin(angle) * 62;
      ctx.save(); ctx.translate(x, y); ctx.rotate(angle);
      const bounce = 1 + Math.sin(uiTime * 5) * 0.08;
      ctx.scale(bounce, bounce); ctx.globalAlpha = force ? 0.88 : 0.5;
      ctx.fillStyle = '#fff0a2'; ctx.strokeStyle = '#4c4267'; ctx.lineWidth = 2.5;
      ctx.beginPath(); ctx.moveTo(17, 0); ctx.lineTo(-7, -10); ctx.lineTo(-3, 0); ctx.lineTo(-7, 10); ctx.closePath(); ctx.fill(); ctx.stroke();
      ctx.restore();
    }

    function drawSilentGuide(ctx) {
      if (assist) {
        drawDirectionArrow(ctx, true);
        return;
      }
      if (simTime >= level.tutorial.safeSeconds) return;
      if (simTime - lastPulseAt < 2.1) return;
      const hx = hero.x - cameraX;
      const hy = hero.y - cameraY;
      const bob = Math.sin(uiTime * 4.5) * 5;
      ctx.save(); ctx.globalAlpha = 0.74;
      ctx.strokeStyle = '#fff0a2'; ctx.lineWidth = 3;
      ctx.setLineDash([6, 7]); ctx.beginPath(); ctx.arc(hx, hy, 48 + bob * 0.3, 0, Math.PI * 2); ctx.stroke(); ctx.setLineDash([]);
      Art.drawLanternIcon(ctx, hx + 48, hy - 50 + bob, 0.55, uiTime);
      ctx.restore();
    }

    function drawDarkness(ctx) {
      const strength = F.clamp01(darkness / level.pathSafety.hurtSeconds);
      if (strength <= 0.02) return;
      const gradient = ctx.createRadialGradient(W * 0.5, H * 0.5, 120, W * 0.5, H * 0.5, 470);
      gradient.addColorStop(0, 'rgba(61,49,91,0)');
      gradient.addColorStop(1, 'rgba(47,37,76,' + (strength * 0.62).toFixed(3) + ')');
      ctx.fillStyle = gradient; ctx.fillRect(0, 0, W, H);
      if (strength > 0.4) drawDirectionArrow(ctx, strength > 0.7);
    }

    function drawTouchControls(ctx) {
      if (!E.isTouch || state === 'paused' || state === 'rescue' || state === 'clear') return;
      ctx.save(); ctx.globalAlpha = 0.9;
      ctx.fillStyle = 'rgba(45,42,79,0.28)'; ctx.beginPath(); ctx.arc(stick.x, stick.y, stick.r, 0, Math.PI * 2); ctx.fill();
      ctx.strokeStyle = 'rgba(255,255,255,0.6)'; ctx.lineWidth = 4; ctx.stroke();
      ctx.fillStyle = '#cbd6ee'; ctx.beginPath(); ctx.arc(stick.x + stick.knobX, stick.y + stick.knobY, 31, 0, Math.PI * 2); ctx.fill();
      ctx.strokeStyle = '#4e496d'; ctx.lineWidth = 3; ctx.stroke();

      const ready = pulseCooldown <= 0;
      const pressed = actionButton.down ? 0.9 : 1 + Math.sin(uiTime * 3.2) * 0.025;
      ctx.translate(actionButton.x, actionButton.y);
      ctx.scale(actionButton.sq.sx * pressed, actionButton.sq.sy * pressed);
      ctx.globalAlpha = ready ? 1 : 0.58;
      ctx.fillStyle = '#ffe99e'; ctx.beginPath(); ctx.arc(0, 0, actionButton.r, 0, Math.PI * 2); ctx.fill();
      ctx.strokeStyle = '#504665'; ctx.lineWidth = 4; ctx.stroke();
      Art.drawLanternIcon(ctx, 0, -13, 0.58, uiTime);
      ctx.fillStyle = '#403751'; ctx.font = '900 20px "Malgun Gothic", sans-serif'; ctx.textAlign = 'center';
      ctx.fillText('등불', 0, 31); ctx.restore();
    }

    function drawHUD(ctx) {
      UI.drawHearts(ctx, 39, 40, hearts, 5);
      ctx.fillStyle = 'rgba(42,37,75,0.62)'; UI.rr(ctx, 28, 69, 194, 44, 22); ctx.fill();
      Art.drawLanternIcon(ctx, 54, 91, 0.43, uiTime);
      ctx.fillStyle = '#fff8df'; ctx.font = '900 19px "Malgun Gothic", sans-serif'; ctx.textAlign = 'left';
      ctx.fillText(pulseCooldown <= 0 ? '등불 준비!' : '등불 반짝…', 78, 98);
      UI.drawProgress(ctx, W * 0.5 - 154, 27, 308, memories / memoryStars.length);
      ctx.fillStyle = '#fff8df'; ctx.font = '900 16px "Malgun Gothic", sans-serif'; ctx.textAlign = 'center';
      ctx.fillText('기억별 ' + memories + ' / ' + memoryStars.length, W * 0.5, 68);
      pauseButton.draw(ctx);
      mute.draw(ctx);
      drawTouchControls(ctx);
    }

    function drawIntro(ctx) {
      if (state !== 'intro') return;
      const enter = F.ease.outBack(F.clamp01((stateTime - 0.05) / 0.46));
      const leave = 1 - F.ease.inQuad(F.clamp01((stateTime - 1.38) / 0.62));
      ctx.save(); ctx.globalAlpha = leave; ctx.translate(W * 0.5, 118); ctx.scale(enter, enter);
      UI.panel(ctx, -270, -55, 540, 110, 24, '#fff8e8');
      ctx.textAlign = 'center'; ctx.fillStyle = '#71639a'; ctx.font = '900 18px "Malgun Gothic", sans-serif';
      ctx.fillText('네 번째 모험', 0, -15);
      ctx.fillStyle = '#342442'; ctx.font = '900 31px "Malgun Gothic", sans-serif';
      ctx.fillText('별빛 저승의 기억길', 0, 25); ctx.restore();
    }

    function drawHint(ctx) {
      if (hintTime <= 0) return;
      const enter = F.ease.outBack(F.clamp01((4.5 - hintTime) / 0.42));
      const leave = F.clamp01(hintTime / 0.42);
      ctx.save(); ctx.globalAlpha = leave; ctx.translate(W * 0.5, 101); ctx.scale(enter, enter);
      UI.panel(ctx, -305, -45, 610, 90, 22, '#fff8e8');
      UI.drawOwl(ctx, -247, 0, 0.47, uiTime, true);
      ctx.fillStyle = '#342442'; ctx.font = '900 20px "Malgun Gothic", sans-serif';
      ctx.textAlign = 'left'; ctx.fillText(hintText, -194, 8); ctx.restore();
    }

    function drawRescue(ctx) {
      ctx.fillStyle = 'rgba(38,32,69,0.7)'; ctx.fillRect(0, 0, W, H);
      const pop = F.ease.outBack(F.clamp01(stateTime / 0.48));
      ctx.save(); ctx.translate(W * 0.5, 238); ctx.scale(pop, pop);
      UI.panel(ctx, -310, -128, 620, 236, 28, '#fff8e8');
      UI.drawOwl(ctx, -216, -62, 0.82, uiTime, true);
      ctx.fillStyle = '#71639a'; ctx.font = '900 22px "Malgun Gothic", sans-serif'; ctx.textAlign = 'left';
      ctx.fillText('아테나가 어둠을 걷어 냈어요.', -136, -58);
      ctx.fillStyle = '#342442'; ctx.font = '900 25px "Malgun Gothic", sans-serif';
      ctx.fillText('찾은 기억은 그대로 있어!', -136, -15);
      ctx.font = '700 18px "Malgun Gothic", sans-serif'; ctx.fillStyle = '#796476';
      ctx.fillText('마지막 기억별에서 다시 시작해요.', -136, 24); ctx.restore();
      if (stateTime > 0.35) rescueButton.draw(ctx, true);
    }

    function drawPause(ctx) {
      ctx.fillStyle = 'rgba(38,32,69,0.66)'; ctx.fillRect(0, 0, W, H);
      UI.panel(ctx, W * 0.5 - 230, 122, 460, 262, 28, '#fff8e8');
      UI.drawOwl(ctx, W * 0.5, 218, 0.72, uiTime, true);
      ctx.fillStyle = '#342442'; ctx.textAlign = 'center'; ctx.font = '900 35px "Malgun Gothic", sans-serif';
      ctx.fillText('잠깐 쉬어요', W * 0.5, 292);
      ctx.font = '700 18px "Malgun Gothic", sans-serif'; ctx.fillStyle = '#796476';
      ctx.fillText('일시정지 키를 누르면 계속할 수 있어요.', W * 0.5, 326);
      resumeButton.draw(ctx, true);
    }

    function drawClear(ctx) {
      if (state !== 'clear' || stateTime < 0.24) return;
      const pop = F.ease.outBack(F.clamp01((stateTime - 0.24) / 0.5));
      ctx.save(); ctx.translate(W * 0.5, 120); ctx.scale(pop, pop); ctx.textAlign = 'center';
      ctx.font = '900 44px "Malgun Gothic", sans-serif'; ctx.lineWidth = 10;
      ctx.strokeStyle = '#342442'; ctx.lineJoin = 'round';
      ctx.strokeText('기억이 길을 밝혔다!', 0, 0); ctx.fillStyle = '#fff095'; ctx.fillText('기억이 길을 밝혔다!', 0, 0);
      ctx.font = '900 22px "Malgun Gothic", sans-serif'; ctx.lineWidth = 6;
      ctx.strokeText('힘보다 지혜로 길을 찾았어요.', 0, 40); ctx.fillStyle = '#fff8dc';
      ctx.fillText('힘보다 지혜로 길을 찾았어요.', 0, 40); ctx.restore();
    }

    function draw(ctx) {
      const shake = E.shake || { x: 0, y: 0 };
      const view = { camX: cameraX, camY: cameraY, time: simTime };
      ctx.save(); ctx.translate(shake.x, shake.y);
      Art.drawBackground(ctx, view, level, simTime);
      F.drawParticles(ctx, -1);
      drawDecor(ctx);
      drawTrails(ctx);
      drawWalls(ctx);
      drawMemoryStars(ctx);
      drawSilentGuide(ctx);
      drawActors(ctx);
      drawPulseWaves(ctx);
      F.drawParticles(ctx, 0);
      Art.drawForeground(ctx, view, level, simTime);
      ctx.restore();
      drawDarkness(ctx);
      drawHUD(ctx);
      drawIntro(ctx);
      drawHint(ctx);
      drawClear(ctx);
      if (state === 'rescue') drawRescue(ctx);
      if (state === 'paused') drawPause(ctx);
    }

    function pointer(type, x, y, pointerId) {
      if (type === 'cancel') {
        if (stick.pointerId === pointerId || pointerId === undefined) releaseStick();
        if (actionButton.pointerId === pointerId || pointerId === undefined) releaseAction();
        resumeButton.pointer(type, x, y);
        rescueButton.pointer(type, x, y);
        return;
      }
      if (mute.pointer(type, x, y)) {
        if (state === 'paused' && typeof S.pause === 'function') S.pause();
        return;
      }
      if (pauseButton.pointer(type, x, y)) return;
      if (state === 'rescue') {
        rescueButton.pointer(type, x, y);
        return;
      }
      if (state === 'paused') {
        resumeButton.pointer(type, x, y);
        return;
      }
      if (!E.isTouch || state === 'clear') return;

      if (type === 'down') {
        if (stick.pointerId === null && Math.hypot(x - stick.x, y - stick.y) <= stick.r + 18) {
          stick.pointerId = pointerId;
          setStick(x, y);
          return;
        }
        if (actionButton.pointerId === null &&
            Math.hypot(x - actionButton.x, y - actionButton.y) <= actionButton.r + 14) {
          actionButton.pointerId = pointerId;
          actionButton.down = true;
          F.squash(actionButton.sq, 0.9, 0.9);
          E.input.setHeld('action', true);
          return;
        }
      } else if (type === 'move' && stick.pointerId === pointerId) {
        setStick(x, y);
        return;
      } else if (type === 'up') {
        if (stick.pointerId === pointerId) {
          releaseStick();
          return;
        }
        if (actionButton.pointerId === pointerId) {
          releaseAction();
          return;
        }
      }
    }

    return {
      debug: {
        get state() { return state; },
        get time() { return simTime; },
        get hearts() { return hearts; },
        get memories() { return memories; },
        get checkpoint() { return checkpointIndex; },
        get rescues() { return rescues; },
        get assist() { return assist; },
        get heroX() { return hero.x; },
        get heroY() { return hero.y; },
        get pulses() { return pulses; },
        get pulseCooldown() { return pulseCooldown; },
        get darkness() { return darkness; },
        get failures() { return failures; },
        get hazardTime() { return hazardTime; },
        get activeTarget() { return memories < memoryStars.length ? memoryStars[memories].id : 'tiresias'; },
        memoryStars,
        shadows,
        trailStates,
        pulseWaves,
        level
      },
      enter() {
        if (typeof S.unlock === 'function') S.unlock();
        if (typeof S.startBgm === 'function') S.startBgm('underworld', { intensity: 0.25, fade: 0.8 });
        updateMusic(true);
        UI.announce('네 번째 모험. 별빛 저승의 기억길이에요.');
      },
      exit() {
        releaseControls();
        clearInputBuffers();
        if (state !== 'clear' && typeof S.stopBgm === 'function') S.stopBgm();
      },
      update,
      pointer,
      draw
    };
  };
})();

/* src/stages/sirens-level.js */
// 다섯 번째 모험 — 세이렌 바다의 결정적 박자 코스
(function () {
  'use strict';

  window.ODY = window.ODY || {};
  ODY.Levels = ODY.Levels || {};

  const TOP = 132;
  const BOTTOM = 418;
  const TOTAL = 11280;

  // 매번 같은 순서와 위치를 반환한다. 테스트와 아이의 패턴 학습이 모두 쉬워진다.
  const WAVE_BLUEPRINTS = [
    // 0~2,850: 10초가 넘는 안전 수업. 맞아도 하트가 줄지 않는 금빛 메아리다.
    [900, 275, 'safe', '안전 박자', 46],
    [1510, 198, 'safe', '안전 박자', 46],
    [2130, 350, 'safe', '안전 박자', 46],
    [2700, 275, 'safe', '안전 박자', 50],

    // 소개: 큰 간격의 한 음. 높이를 맞춘 뒤 방패를 한 번씩 편다.
    [3290, 205, 'single', '한 음', 48],
    [3860, 345, 'single', '한 음', 48],
    [4380, 275, 'single', '한 음', 50],

    // 연습: 위·아래를 읽을 수 있는 느린 교대 박자.
    [4820, 185, 'single', '교대 노래', 47],
    [5230, 355, 'single', '교대 노래', 47],
    [5670, 210, 'single', '교대 노래', 47],
    [6070, 335, 'single', '교대 노래', 47],

    // 응용: 같은 높이의 짧은 두 음과, 넓게 갈라진 화음.
    [6510, 275, 'double', '두 음', 44],
    [6740, 275, 'double', '두 음', 44],
    [7180, 190, 'single', '갈림 노래', 46],
    [7180, 365, 'single', '갈림 노래', 46],
    [7600, 275, 'double', '두 음', 44],
    [7835, 275, 'double', '두 음', 44],

    // 8,080~9,030: 장애물 없는 짧은 휴식.

    // 절정: 앞에서 본 한 음·두 음·갈림만 읽기 좋은 리듬으로 연결한다.
    [9250, 190, 'single', '마지막 노래', 46],
    [9620, 350, 'single', '마지막 노래', 46],
    [9990, 270, 'double', '마지막 두 음', 44],
    [10210, 270, 'double', '마지막 두 음', 44],
    [10550, 190, 'single', '마지막 화음', 45],
    [10550, 362, 'single', '마지막 화음', 45],
    [10920, 275, 'finale', '마지막 한 음', 54]
  ];

  const STAR_BLUEPRINTS = [
    [1180, 275], [1770, 198], [2380, 350],
    [3500, 205], [4070, 345], [4600, 275],
    [5030, 185], [5450, 355], [5890, 210], [6290, 335],
    [6960, 275], [7390, 275], [8040, 275],
    [8460, 275], [8790, 275],
    [9430, 190], [9800, 350], [10400, 270], [10730, 275], [11100, 275]
  ];

  function sectionFor(x) {
    if (x < 2850) return '소개 전 안전 구간';
    if (x < 4600) return '새 요소 소개';
    if (x < 6300) return '연습';
    if (x < 8080) return '응용';
    if (x < 9030) return '휴식';
    return '절정';
  }

  function build() {
    const waves = WAVE_BLUEPRINTS.map(function (row, index) {
      return {
        id: index,
        x: row[0],
        y: row[1],
        kind: row[2],
        group: row[3],
        radius: row[4],
        safe: row[2] === 'safe',
        section: sectionFor(row[0]),
        hit: false,
        resolved: false,
        warned: false
      };
    });

    const stars = STAR_BLUEPRINTS.map(function (row, index) {
      return { id: index, x: row[0], y: row[1], got: false };
    });

    return {
      top: TOP,
      bottom: BOTTOM,
      total: TOTAL,
      safeUntil: 2850,
      checkpoints: [0, 4620, 9030],
      restZones: [{ from: 8080, to: 9030 }],
      sections: [
        { name: '안전 수업', from: 0, to: 2850 },
        { name: '소개', from: 2850, to: 4600 },
        { name: '연습', from: 4600, to: 6300 },
        { name: '응용', from: 6300, to: 8080 },
        { name: '휴식', from: 8080, to: 9030 },
        { name: '절정', from: 9030, to: TOTAL }
      ],
      waves: waves,
      stars: stars
    };
  }

  ODY.Levels.sirens = { build: build, TOP: TOP, BOTTOM: BOTTOM, TOTAL: TOTAL };
})();

  <script>
/* src/stages/sirens-art.js */
// 세이렌 바다 — 보랏빛 저녁 바다, 둥근 노래 파동, 귀여운 새 세이렌
(function () {
  'use strict';

  window.ODY = window.ODY || {};
  ODY.Art = ODY.Art || {};

  const A = {};
  const TAU = Math.PI * 2;
  const INK = '#342442';

  function wrap(value, span) {
    return ((value % span) + span) % span;
  }

  function rr(ctx, x, y, w, h, r) {
    if (ODY.UI && ODY.UI.rr) return ODY.UI.rr(ctx, x, y, w, h, r);
    r = Math.min(r, w * 0.5, h * 0.5);
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }

  function cloud(ctx, x, y, s, alpha) {
    ctx.save();
    ctx.translate(x, y);
    ctx.scale(s, s);
    ctx.globalAlpha = alpha;
    ctx.fillStyle = '#fff4f0';
    ctx.beginPath();
    ctx.arc(-32, 9, 23, 0, TAU);
    ctx.arc(-9, -5, 30, 0, TAU);
    ctx.arc(22, 2, 27, 0, TAU);
    ctx.arc(43, 12, 18, 0, TAU);
    ctx.rect(-34, 8, 77, 27);
    ctx.fill();
    ctx.restore();
  }

  function seaBand(ctx, y, color, amp, scroll, time, speed) {
    ctx.fillStyle = color;
    ctx.beginPath();
    ctx.moveTo(0, y);
    for (let x = 0; x <= 984; x += 24) {
      ctx.lineTo(x, y + Math.sin((x + scroll) * 0.023 + time * speed) * amp);
    }
    ctx.lineTo(984, 560);
    ctx.lineTo(0, 560);
    ctx.closePath();
    ctx.fill();
  }

  function drawRock(ctx, x, y, scale) {
    ctx.save();
    ctx.translate(x, y);
    ctx.scale(scale, scale);
    ctx.fillStyle = '#62547d';
    ctx.strokeStyle = '#3c3158';
    ctx.lineWidth = 4;
    ctx.beginPath();
    ctx.moveTo(-83, 44);
    ctx.quadraticCurveTo(-74, -20, -35, -12);
    ctx.quadraticCurveTo(-18, -72, 18, -38);
    ctx.quadraticCurveTo(50, -55, 72, 3);
    ctx.quadraticCurveTo(91, 20, 88, 48);
    ctx.closePath();
    ctx.fill(); ctx.stroke();
    ctx.fillStyle = 'rgba(238,207,229,0.22)';
    ctx.beginPath(); ctx.ellipse(-19, -28, 22, 11, -0.35, 0, TAU); ctx.fill();
    ctx.restore();
  }

  function drawSiren(ctx, x, y, scale, time, phase, singing) {
    const bob = Math.sin(time * 2.2 + phase) * 4;
    const wing = Math.sin(time * 4.1 + phase) * 0.18;
    ctx.save();
    ctx.translate(x, y + bob);
    ctx.scale(scale, scale);

    // 둥근 새 몸과 날개. 발톱이나 날카로운 이빨은 없다.
    ctx.fillStyle = '#d98bbc';
    ctx.strokeStyle = INK;
    ctx.lineWidth = 4;
    ctx.beginPath(); ctx.ellipse(0, 18, 34, 42, 0, 0, TAU); ctx.fill(); ctx.stroke();
    ctx.save(); ctx.translate(-29, 12); ctx.rotate(-0.35 + wing);
    ctx.fillStyle = '#f0a8c9';
    ctx.beginPath(); ctx.ellipse(-11, 6, 16, 32, -0.35, 0, TAU); ctx.fill(); ctx.stroke(); ctx.restore();
    ctx.save(); ctx.translate(29, 12); ctx.rotate(0.35 - wing);
    ctx.fillStyle = '#f0a8c9';
    ctx.beginPath(); ctx.ellipse(11, 6, 16, 32, 0.35, 0, TAU); ctx.fill(); ctx.stroke(); ctx.restore();

    // 사람처럼 다정한 얼굴과 월계수 머리띠.
    ctx.fillStyle = '#f6c9aa';
    ctx.beginPath(); ctx.arc(0, -24, 26, 0, TAU); ctx.fill(); ctx.stroke();
    ctx.fillStyle = '#69456f';
    ctx.beginPath();
    ctx.arc(0, -30, 26, Math.PI, TAU);
    ctx.arc(-22, -23, 8, Math.PI * 0.45, Math.PI * 1.55);
    ctx.arc(22, -23, 8, Math.PI * 1.45, Math.PI * 0.55);
    ctx.fill();
    ctx.strokeStyle = '#f6d765'; ctx.lineWidth = 4;
    ctx.beginPath(); ctx.arc(0, -33, 25, Math.PI * 1.05, Math.PI * 1.95); ctx.stroke();

    ctx.fillStyle = INK;
    ctx.beginPath(); ctx.arc(-9, -24, 3.2, 0, TAU); ctx.arc(9, -24, 3.2, 0, TAU); ctx.fill();
    ctx.fillStyle = 'rgba(239,104,133,0.32)';
    ctx.beginPath(); ctx.arc(-17, -13, 6, 0, TAU); ctx.arc(17, -13, 6, 0, TAU); ctx.fill();
    ctx.strokeStyle = INK; ctx.lineWidth = 3; ctx.lineCap = 'round';
    if (singing) {
      const mouth = 4 + Math.sin(time * 7 + phase) * 1.4;
      ctx.fillStyle = '#7d446e';
      ctx.beginPath(); ctx.ellipse(0, -10, 5, mouth, 0, 0, TAU); ctx.fill();
    } else {
      ctx.beginPath(); ctx.arc(0, -12, 8, 0.12 * Math.PI, 0.88 * Math.PI); ctx.stroke();
    }
    ctx.restore();

    if (singing) {
      ctx.save();
      ctx.fillStyle = '#ffe895';
      ctx.font = '900 ' + Math.round(18 * scale) + 'px serif';
      ctx.globalAlpha = 0.65 + Math.sin(time * 5 + phase) * 0.18;
      ctx.fillText(phase > 1 ? '♪' : '♫', x + 35 * scale, y - 44 * scale + bob);
      ctx.restore();
    }
  }

  function drawMastRope(ctx, x, y, scale) {
    ctx.save(); ctx.translate(x, y); ctx.scale(scale, scale);
    ctx.strokeStyle = '#e5be6e'; ctx.lineWidth = 5; ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(-13, -27); ctx.bezierCurveTo(19, -19, -19, -5, 13, 3);
    ctx.bezierCurveTo(20, 10, -14, 18, 11, 27);
    ctx.stroke();
    ctx.restore();
  }

  A.drawBackground = function (ctx, view) {
    const t = view.time || 0;
    const d = view.distance || 0;
    const sky = ctx.createLinearGradient(0, 0, 0, 540);
    sky.addColorStop(0, '#7776ba');
    sky.addColorStop(0.34, '#d59ac1');
    sky.addColorStop(0.57, '#ffc3a9');
    sky.addColorStop(1, '#438fae');
    ctx.fillStyle = sky; ctx.fillRect(0, 0, 960, 540);

    const moonX = wrap(760 - d * 0.018, 1500) - 120;
    const glow = ctx.createRadialGradient(moonX, 95, 6, moonX, 95, 125);
    glow.addColorStop(0, 'rgba(255,244,191,0.78)');
    glow.addColorStop(1, 'rgba(255,244,191,0)');
    ctx.fillStyle = glow; ctx.fillRect(moonX - 130, -35, 260, 260);
    ctx.fillStyle = '#fff2ba'; ctx.beginPath(); ctx.arc(moonX, 95, 37, 0, TAU); ctx.fill();
    ctx.fillStyle = '#a889bf'; ctx.beginPath(); ctx.arc(moonX + 14, 83, 37, 0, TAU); ctx.fill();

    for (let i = 0; i < 7; i++) {
      cloud(ctx, wrap(i * 245 - d * 0.05, 1840) - 210,
        42 + (i % 3) * 35 + Math.sin(t * 0.35 + i) * 3,
        0.55 + (i % 2) * 0.18, 0.3 + (i % 3) * 0.08);
    }

    // 먼 섬, 중간 바다, 가까운 파도 — 세 겹 패럴랙스.
    ctx.fillStyle = '#665d8c';
    for (let i = 0; i < 5; i++) {
      const x = wrap(i * 420 - d * 0.105, 2180) - 250;
      const y = 193 + (i % 2) * 17;
      ctx.beginPath(); ctx.ellipse(x, y, 130, 31, 0, 0, TAU); ctx.fill();
    }
    seaBand(ctx, 190, '#66b6c5', 7, d * 0.16, t, 0.55);
    seaBand(ctx, 278, '#4b9db8', 12, d * 0.35, t, 0.78);
    seaBand(ctx, 386, '#347eaa', 17, d * 0.62, t, 1.02);

    // 화면 오른쪽 멀리서 노래하는 세이렌. 얼굴은 항상 귀엽게 보인다.
    const islandX = 902 + Math.sin(t * 0.35) * 4;
    drawRock(ctx, islandX, 259, 0.73);
    drawSiren(ctx, islandX - 38, 220, 0.52, t, 0.3, true);
    drawSiren(ctx, islandX + 28, 230, 0.45, t, 2.1, true);

    ctx.strokeStyle = 'rgba(236,247,246,0.22)'; ctx.lineWidth = 3; ctx.lineCap = 'round';
    for (let i = 0; i < 11; i++) {
      const x = wrap(i * 125 - d * 0.76, 1510) - 130;
      const y = 238 + (i * 67) % 260 + Math.sin(t * 1.7 + i) * 5;
      ctx.beginPath(); ctx.moveTo(x, y); ctx.quadraticCurveTo(x + 24, y - 5, x + 50, y); ctx.stroke();
    }
  };

  A.drawWarning = function (ctx, wave, sx, shipX, time) {
    if (wave.resolved || sx < shipX + 120 || sx > 900) return;
    const color = wave.safe ? 'rgba(255,232,132,0.48)' : 'rgba(255,190,223,0.48)';
    ctx.save();
    ctx.strokeStyle = color; ctx.lineWidth = 3; ctx.setLineDash([7, 11]);
    ctx.globalAlpha = 0.55 + Math.sin(time * 5 + wave.id) * 0.15;
    ctx.beginPath(); ctx.moveTo(shipX + 66, wave.y); ctx.lineTo(sx - wave.radius - 10, wave.y); ctx.stroke();
    ctx.setLineDash([]);
    for (let i = 1; i <= 3; i++) {
      const x = sx - wave.radius - 35 * i;
      ctx.fillStyle = color;
      ctx.beginPath(); ctx.arc(x, wave.y, 4 + i, 0, TAU); ctx.fill();
    }
    ctx.restore();
  };

  A.drawWave = function (ctx, wave, sx, time) {
    if (wave.resolved) return;
    const r = wave.radius;
    const pulse = 1 + Math.sin(time * 6 + wave.id * 0.71) * 0.045;
    const safe = wave.safe;
    ctx.save();
    ctx.translate(sx, wave.y);
    ctx.scale(pulse, pulse);
    const glow = ctx.createRadialGradient(0, 0, r * 0.1, 0, 0, r * 1.38);
    glow.addColorStop(0, safe ? 'rgba(255,239,142,0.3)' : 'rgba(244,164,222,0.32)');
    glow.addColorStop(1, 'rgba(255,255,255,0)');
    ctx.fillStyle = glow; ctx.fillRect(-r * 1.5, -r * 1.5, r * 3, r * 3);
    ctx.lineCap = 'round';
    for (let i = 0; i < 3; i++) {
      const rradius = r * (0.62 + i * 0.27);
      ctx.globalAlpha = 0.9 - i * 0.22;
      ctx.strokeStyle = safe ? (i === 0 ? '#fff0a1' : '#83e2d3') : (i === 0 ? '#ffd0eb' : '#c28cd4');
      ctx.lineWidth = 6 - i;
      ctx.beginPath();
      ctx.arc(0, 0, rradius, -Math.PI * 0.72, Math.PI * 0.72);
      ctx.stroke();
    }
    ctx.globalAlpha = 1;
    ctx.fillStyle = safe ? '#fff0a1' : '#ffd2ec';
    ctx.font = '900 22px serif'; ctx.textAlign = 'center';
    ctx.fillText(wave.kind === 'double' ? '♫' : '♪', 0, 8);
    ctx.restore();
  };

  A.drawStar = function (ctx, star, sx, time) {
    if (star.got) return;
    const s = 8 + Math.sin(time * 5 + star.id) * 1.2;
    ctx.save(); ctx.translate(sx, star.y); ctx.rotate(time * 0.7 + star.id);
    ctx.fillStyle = '#ffe878'; ctx.strokeStyle = '#fff7cb'; ctx.lineWidth = 2;
    ctx.beginPath();
    for (let i = 0; i < 10; i++) {
      const a = -Math.PI * 0.5 + i * Math.PI / 5;
      const rradius = i % 2 === 0 ? s : s * 0.43;
      ctx.lineTo(Math.cos(a) * rradius, Math.sin(a) * rradius);
    }
    ctx.closePath(); ctx.fill(); ctx.stroke(); ctx.restore();
  };

  A.drawShip = function (ctx, ship, time, shield, shieldPower) {
    ctx.save();
    ctx.translate(ship.x, ship.y);
    ctx.rotate(ship.tilt || 0);
    ctx.scale(ship.sq.sx, ship.sq.sy);

    ctx.strokeStyle = 'rgba(224,252,247,0.72)'; ctx.lineWidth = 5; ctx.lineCap = 'round';
    for (let i = 0; i < 3; i++) {
      ctx.beginPath(); ctx.moveTo(-70 - i * 10, 18 + i * 7);
      ctx.quadraticCurveTo(-108 - i * 9, 7 + Math.sin(time * 6 + i) * 5, -144 - i * 9, 18 + i * 8);
      ctx.stroke();
    }
    ODY.UI.drawShip(ctx, 0, 0, 0.61, time);

    // 돛대에 편안히 기대어 지혜 방패를 드는 작은 오디세우스.
    ctx.fillStyle = '#f5c59e'; ctx.strokeStyle = INK; ctx.lineWidth = 3;

      ctx.strokeStyle = 'rgba(255,255,224,0.72)'; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.ellipse(8, -16, 78 * shieldScale, 57 * shieldScale, 0, 0, TAU); ctx.stroke();
    }
    ctx.restore();
  };

  A.drawSilentGuide = function (ctx, view, ship, shield) {
    if (view.distance < 430 || view.distance > 2750) return;
    const a = Math.min(1, (view.distance - 430) / 220) * Math.min(1, (2750 - view.distance) / 260);
    ctx.save(); ctx.globalAlpha = a * (0.58 + Math.sin(view.time * 4) * 0.14);
    if (!view.hasSteered) {
      ctx.fillStyle = '#fff3b2'; ctx.font = '900 34px "Malgun Gothic", sans-serif'; ctx.textAlign = 'center';
      ctx.fillText(view.distance < 1500 ? '↑' : '↓', ship.x + 118, view.distance < 1500 ? 182 : 362);
    } else if (!view.hasShielded) {
      // 글 대신 방패 모양이 작아졌다 커지며 스페이스/터치 동작을 보여 준다.
      const p = 0.82 + Math.sin(view.time * 5) * 0.12;
      ctx.translate(ship.x + 135, ship.y - 2); ctx.scale(p, p);
      ctx.fillStyle = 'rgba(255,240,134,0.22)'; ctx.strokeStyle = '#fff09b'; ctx.lineWidth = 5;
      ctx.beginPath(); ctx.arc(0, 0, 31, 0, TAU); ctx.fill(); ctx.stroke();
      ctx.fillStyle = '#fff7ce'; ctx.font = '900 25px "Malgun Gothic", sans-serif';
      ctx.textAlign = 'center'; ctx.fillText('✦', 0, 9);
    }
    ctx.restore();
  };

  A.drawForeground = function (ctx, view) {
    ctx.strokeStyle = 'rgba(219,249,248,0.32)'; ctx.lineWidth = 5; ctx.lineCap = 'round';
    for (let i = 0; i < 9; i++) {
      const x = wrap(i * 156 - view.distance * 1.06, 1430) - 140;
      const y = 433 + (i % 3) * 42 + Math.sin(view.time * 2.1 + i) * 6;
      ctx.beginPath(); ctx.moveTo(x, y); ctx.quadraticCurveTo(x + 31, y - 8, x + 67, y); ctx.stroke();
    }
    const vignette = ctx.createRadialGradient(480, 260, 220, 480, 260, 590);
    vignette.addColorStop(0, 'rgba(42,35,78,0)');
    vignette.addColorStop(1, 'rgba(42,35,78,0.28)');
    ctx.fillStyle = vignette; ctx.fillRect(0, 0, 960, 540);
  };

  function drawStorySea(ctx, time) {
    const sky = ctx.createLinearGradient(0, 0, 0, 540);
    sky.addColorStop(0, '#8580bf'); sky.addColorStop(0.52, '#f3b0b7'); sky.addColorStop(1, '#438fab');
    ctx.fillStyle = sky; ctx.fillRect(0, 0, 960, 540);
    cloud(ctx, 170, 84, 0.85, 0.38); cloud(ctx, 700, 116, 0.7, 0.32);
    seaBand(ctx, 300, '#62b4c3', 9, time * 15, time, 0.6);
    seaBand(ctx, 382, '#438eae', 14, time * 25, time, 0.9);
  }

  // story.js에서 쓰는 960×540 그림책 삽화 세 장.
  A.drawStory = function (ctx, scene, time) {
    time = time || 0;
    ctx.save();
    rr(ctx, 78, 76, 804, 260, 22); ctx.clip();
    ctx.translate(78, 76);
    ctx.scale(804 / 960, 260 / 540);
    drawStorySea(ctx, time);

    if (scene === 'sirenIsland') {
      drawRock(ctx, 730, 337, 1.36);
      drawSiren(ctx, 674, 248, 0.92, time, 0.2, true);
      drawSiren(ctx, 785, 270, 0.78, time, 1.7, true);
      ODY.UI.drawShip(ctx, 230, 363 + Math.sin(time * 1.7) * 4, 0.72, time);
      for (let i = 0; i < 4; i++) {
        ctx.strokeStyle = 'rgba(255,214,239,' + (0.65 - i * 0.11) + ')';
        ctx.lineWidth = 6 - i;
        ctx.beginPath(); ctx.arc(700, 270, 105 + i * 48, Math.PI * 0.68, Math.PI * 1.22); ctx.stroke();
      }
    } else if (scene === 'waxAndRope') {
      ODY.UI.drawShip(ctx, 475, 370 + Math.sin(time * 1.5) * 3, 1.1, time);
      // 큰 돛대와 포근한 밧줄, 귀를 막은 선원 둘.
      ctx.strokeStyle = '#6a4934'; ctx.lineWidth = 12; ctx.lineCap = 'round';
      ctx.beginPath(); ctx.moveTo(470, 153); ctx.lineTo(470, 390); ctx.stroke();
      ctx.fillStyle = '#f5c59e'; ctx.strokeStyle = INK; ctx.lineWidth = 4;
      ctx.beginPath(); ctx.arc(470, 250, 24, 0, TAU); ctx.fill(); ctx.stroke();
      ctx.fillStyle = '#75482e'; ctx.beginPath(); ctx.arc(470, 242, 24, Math.PI, TAU); ctx.fill();
      drawMastRope(ctx, 470, 288, 1.25);
      for (const dx of [-130, 135]) {
        ctx.fillStyle = '#f5c59e'; ctx.strokeStyle = INK; ctx.lineWidth = 4;
        ctx.beginPath(); ctx.arc(470 + dx, 330, 20, 0, TAU); ctx.fill(); ctx.stroke();
        ctx.fillStyle = '#ffe77f'; ctx.beginPath(); ctx.arc(470 + dx + (dx < 0 ? 18 : -18), 331, 7, 0, TAU); ctx.fill();
      }
    } else {
      // songWave: 노래 파동을 지혜의 빛으로 튕겨 내는 장면.
      ODY.UI.drawShip(ctx, 365, 370 + Math.sin(time * 1.8) * 3, 0.92, time);
      const pulse = 1 + Math.sin(time * 4) * 0.04;
      ctx.save(); ctx.translate(373, 334); ctx.scale(pulse, pulse);
      ctx.fillStyle = 'rgba(255,239,124,0.14)'; ctx.strokeStyle = '#fff09b'; ctx.lineWidth = 9;
      ctx.beginPath(); ctx.ellipse(0, 0, 132, 102, 0, 0, TAU); ctx.fill(); ctx.stroke(); ctx.restore();
      drawRock(ctx, 800, 347, 1.05);
      drawSiren(ctx, 800, 270, 0.8, time, 0.5, true);
      for (let i = 0; i < 4; i++) {
        ctx.strokeStyle = i < 2 ? 'rgba(241,174,222,0.72)' : 'rgba(255,234,133,0.6)';
        ctx.lineWidth = 7 - i;
        ctx.beginPath(); ctx.arc(735, 292, 85 + i * 66, Math.PI * 0.65, Math.PI * 1.35); ctx.stroke();
      }
      ctx.fillStyle = '#fff1a0'; ctx.font = '900 38px serif'; ctx.fillText('♪', 520, 216); ctx.fillText('♫', 591, 328);
    }

    // 종이결과 둥근 그림책 테두리.
    ctx.globalAlpha = 0.035; ctx.fillStyle = '#392d50';
    for (let i = 0; i < 150; i++) ctx.fillRect((i * 71) % 960, (i * 97) % 540, 2, 1);
    ctx.globalAlpha = 1; ctx.strokeStyle = 'rgba(255,248,231,0.72)'; ctx.lineWidth = 12;
    rr(ctx, 6, 6, 948, 528, 30); ctx.stroke();
    ctx.restore();
  };

  A.drawCardArt = function (ctx, x, y, time) {
    A.drawShip(ctx, {
      x: x - 26, y: y + 18, tilt: Math.sin((time || 0) * 1.8) * 0.025,
      sq: { sx: 0.72, sy: 0.72 }
    }, time || 0, true, 0.8);
    drawSiren(ctx, x + 59, y - 7, 0.48, time || 0, 0.6, true);
  };

  A.drawSiren = drawSiren;
  A.drawRock = drawRock;
  ODY.Art.sirens = A;
})();
