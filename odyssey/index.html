  function showAdventureSelect(returnStage) {
    let time = 0;
    let choice = 0;
    let done = false;
    const W = ODY.E.W, H = ODY.E.H;
    const progress = loadProgress();
    const unlocked = getUnlockedStageIds(progress);
    const definitions = {
      cyclops: {
        label: '1. 키클롭스 동굴', description: '바위를 피해 빛까지 달려요.',
        color: '#9b89c9', story: startCyclopsStory, play: startCyclops
      },
      windVoyage: {
        label: '2. 바람 주머니', description: '순풍을 모아 바다를 건너요.',
        color: '#78cfd0', story: startWindStory, play: startWindVoyage
      },
      circe: {
        label: '3. 키르케의 섬', description: '몰리 약초로 친구를 구해요.',
        color: '#91d6a6', story: startCirceStory, play: startCirce
      },
      underworld: {
        label: '4. 별빛 저승', description: '등불로 기억의 길을 밝혀요.',
        color: '#a99bea', story: startUnderworldStory, play: startUnderworld
      },
      sirens: {
        label: '5. 세이렌 바다', description: '박자에 맞춰 음파를 막아요.',
        color: '#87d4df', story: startSirensStory, play: startSirens
      },
      scylla: {
        label: '6. 좁은 해협', description: '두 위험 사이의 안전한 길을 찾아요.',
        color: '#72bed0', story: startScyllaStory, play: startScylla
      },
      helios: {
        label: '7. 태양신의 목장', description: '친구들을 모닥불로 불러요.',
        color: '#efc65d', story: startHeliosStory, play: startHelios
      }
    };
    // 잠긴 장도 함께 보여 준다. 열린 것만 띄우면 처음에는 카드가 하나뿐이라
    // "장 고르기"라는 말이 무색해지고, 앞으로 무엇이 남았는지도 알 수 없다.
    const slots = [
      [176, 190], [480, 190], [784, 190],
      [176, 286], [480, 286], [784, 286],
      [480, 382]
    ];
    const stageButtons = STAGE_IDS.map((id, index) => {
      const definition = definitions[id];
      const stage = progress.stages[id];
      const cleared = !!(stage && stage.cleared);
      const open = unlocked.includes(id);
      return new ODY.UI.Button({
        x: slots[index][0], y: slots[index][1], w: 282, h: 70,
        label: open ? (cleared ? '✓ ' : '새 길 · ') + definition.label
                    : '🔒 ' + definition.label,
        size: 18, color: open ? definition.color : '#8d84a6',
        locked: !open,
        onTap() {
          if (done) return;
          if (!open) {
            announce(definition.label + '은 아직 잠겨 있어요. 앞의 장을 먼저 끝내요.');
            return;
          }
          done = true;
          (cleared ? definition.play : definition.story)();
        }
      });
    });
    const fromTitle = !returnStage;
    const backButton = new ODY.UI.Button({
      x: W * 0.5, y: 484, w: 245, h: 58,
      label: fromTitle ? '처음으로' : '지도로 돌아가기', size: 22, color: '#ffad61',
      onTap() {
        if (done) return;
        done = true;
        if (fromTitle) showTitle();
        else showJourneyMap(returnStage);
      }
    });
    const buttons = stageButtons.concat(backButton);
    const mute = ODY.UI.makeMuteBtn();

    setCanvasLabel('일곱 개의 장을 고르는 화면. 아직 열리지 않은 장은 자물쇠로 표시돼요.');
    function announceChoice() {
      const button = buttons[choice];
      const description = choice < STAGE_IDS.length
        ? (unlocked.includes(STAGE_IDS[choice])
            ? definitions[STAGE_IDS[choice]].description + ' '
            : '앞의 장을 먼저 끝내면 열려요. ')
        : '';
      announce('현재 선택: ' + button.label + '. ' + description + '화면을 누르거나 엔터로 시작해요.');
    }
    announce('장을 골라요. 열린 장은 ' + unlocked.length + '개예요. 지나온 장은 언제든 다시 할 수 있어요.');

    ODY.E.setScene({
      enter() { ODY.Snd.startBgm('map', { intensity: 0.25, fade: 0.8 }); },
      exit() { ODY.Snd.stopBgm(); },
      update(dt, dtReal) {
        time += dtReal;
        buttons.forEach(button => button.update(dtReal));
        mute.update(dtReal);
        ODY.UI.handleMuteKey(mute);
        const navLeft = ODY.E.input.buffered('left', 0.16);
        const navUp = ODY.E.input.buffered('up', 0.16);
        if (navLeft || navUp) {
          ODY.E.input.consume('left'); ODY.E.input.consume('up');
          // ArrowUp/W는 러너 점프 호환을 위해 jump도 함께 만든다.
          // 장 고르기에서는 그 버퍼가 같은 프레임의 실행으로 새지 않게 비운다.
          if (navUp) ODY.E.input.consume('jump');
          choice = (choice + buttons.length - 1) % buttons.length;
          ODY.Snd.click(); announceChoice();
        }
        if (ODY.E.input.buffered('right', 0.16) || ODY.E.input.buffered('down', 0.16)) {
          ODY.E.input.consume('right'); ODY.E.input.consume('down');
          choice = (choice + 1) % buttons.length;
          ODY.Snd.click(); announceChoice();
        }
        if (time > 0.45 && (ODY.E.input.buffered('jump', 0.16) || ODY.E.input.buffered('ok', 0.16))) {
          ODY.E.input.consume('jump'); ODY.E.input.consume('ok'); buttons[choice].activate();
        }
      },
      pointer(type, x, y) {
        if (mute.pointer(type, x, y)) return;
        buttons.forEach((button, index) => {
          if (button.pointer(type, x, y) && type === 'down' && choice !== index) {
            choice = index;
            announceChoice();
          }
        });
      },
      draw(ctx) {
        const sky = ctx.createLinearGradient(0, 0, 0, H);
        sky.addColorStop(0, '#6f659f'); sky.addColorStop(0.58, '#e8a8a5'); sky.addColorStop(1, '#ffd8a5');
        ctx.fillStyle = sky; ctx.fillRect(0, 0, W, H);
        ctx.fillStyle = '#5598bd'; ctx.beginPath(); ctx.moveTo(0, 410);
        for (let x = 0; x <= W; x += 24) ctx.lineTo(x, 414 + Math.sin(x * 0.02 + time * 1.2) * 7);
        ctx.lineTo(W, H); ctx.lineTo(0, H); ctx.closePath(); ctx.fill();

        const pop = ODY.Feel.ease.outBack(ODY.Feel.clamp01(time / 0.5));
        ctx.save(); ctx.translate(W * 0.5, 88); ctx.scale(pop, pop);
        ODY.UI.panel(ctx, -300, -57, 600, 114, 25, '#fff8e8');
        ctx.textAlign = 'center'; ctx.fillStyle = '#342442';
        ctx.font = '900 34px "Malgun Gothic", sans-serif'; ctx.fillText('어느 모험으로 갈까요?', 0, -7);
        ctx.fillStyle = '#8e5c68'; ctx.font = '800 18px "Malgun Gothic", sans-serif';
        ctx.fillText(choice < STAGE_IDS.length
          ? (unlocked.includes(STAGE_IDS[choice])
              ? definitions[STAGE_IDS[choice]].description
              : '앞의 장을 먼저 끝내면 열려요.')
          : (returnStage ? '바닷길 지도로 돌아가요.' : '처음 화면으로 돌아가요.'), 0, 29);
        ctx.restore();

        buttons.forEach((button, index) => button.draw(ctx, choice === index));
        mute.draw(ctx); ODY.Feel.drawParticles(ctx);
      }
    });
  }

  function showJourneyMap(lastStage) {
    let time = 0;
    let choice = 0;
    let done = false;
    const W = ODY.E.W, H = ODY.E.H;
    const stageIndex = Math.max(0, STAGE_IDS.indexOf(lastStage));
    const mapProgress = loadProgress();
    const reached = id => !!(mapProgress.stages[id] && mapProgress.stages[id].cleared);
    const clearedCount = STAGE_IDS.filter(reached).length;
    const route = {
      cyclops: { nextLabel: '다음 항해', next: startWindStory, nextTitle: '다음은 바람 주머니 항해', sub: '반짝이는 바람길을 따라가요.' },
      windVoyage: { nextLabel: '다음 섬', next: startCirceStory, nextTitle: '다음은 키르케의 섬', sub: '몰리 약초로 친구들을 도와요.' },
      circe: { nextLabel: '별빛 저승', next: startUnderworldStory, nextTitle: '다음은 별빛 저승', sub: '등불로 기억의 길을 밝혀요.' },
      underworld: { nextLabel: '세이렌 바다', next: startSirensStory, nextTitle: '다음은 세이렌 바다', sub: '노래의 박자를 눈으로 살펴요.' },
      sirens: { nextLabel: '좁은 해협', next: startScyllaStory, nextTitle: '다음은 좁은 해협', sub: '두 위험 사이의 길을 찾아요.' },
      scylla: { nextLabel: '햇살 목장', next: startHeliosStory, nextTitle: '다음은 태양신의 목장', sub: '참을성으로 친구들을 지켜요.' },
      helios: { nextLabel: '', next: null, nextTitle: '일곱 모험을 해냈어요!', sub: '포기하지 않으면 집에 갈 수 있어요.' }
    }[lastStage] || null;
    const actions = route && route.next ? [
      { label: route.nextLabel, color: stageIndex >= 3 ? '#8fcfdd' : '#8ee4cf', run: route.next },
      { label: '모험 고르기', color: '#9b89c9', run: () => showAdventureSelect(lastStage) },
      { label: '처음으로', color: '#ffad61', run: showTitle }
    ] : [
      { label: '모험 고르기', color: '#9b89c9', run: () => showAdventureSelect(lastStage) },
      { label: '다시 목장으로', color: '#ffd86a', run: startHelios },
      { label: '처음으로', color: '#ffad61', run: showTitle }
    ];
    const centers = [245, 480, 715];
    const buttons = actions.map((action, i) => new ODY.UI.Button({
      x: centers[i], y: 470, w: 210, h: 60,
      label: action.label, size: 22, color: action.color,
      onTap() {
        if (done) return;
        done = true;
        action.run();
      }
    }));
    const mute = ODY.UI.makeMuteBtn();

    setCanvasLabel('오디세우스의 바닷길 지도와 모험 선택 버튼');
    function announceChoice() {
      announce('현재 선택: ' + actions[choice].label + '. 왼쪽과 오른쪽 화살표로 고르고 엔터로 시작해요.');
    }
    const mapAnnouncement = clearedCount + '개 모험을 마쳤어요. ' +
      actions.map(action => action.label).join(', ') + ' 중에서 골라요. ';
    announce(mapAnnouncement +
      '현재 선택: ' + actions[choice].label + '.');

    function drawCirceMapBadge(ctx, x, y, complete) {
      ctx.save(); ctx.translate(x, y);
      ctx.fillStyle = '#70a87a'; ctx.beginPath(); ctx.ellipse(0, 43, 87, 24, 0, 0, Math.PI * 2); ctx.fill();
      ctx.strokeStyle = '#6c5948'; ctx.lineWidth = 8; ctx.beginPath(); ctx.moveTo(-28, 42); ctx.lineTo(-25, -9); ctx.stroke();
      ctx.fillStyle = '#78b584'; ctx.beginPath(); ctx.arc(-44, -10, 25, 0, Math.PI * 2);
      ctx.arc(-18, -22, 31, 0, Math.PI * 2); ctx.arc(9, -5, 23, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = complete ? '#f5b5bf' : '#f0aab5'; ctx.strokeStyle = '#49384e'; ctx.lineWidth = 2.5;
      ctx.beginPath(); ctx.ellipse(25, 22, 24, 16, 0, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
      ctx.beginPath(); ctx.arc(43, 17, 14, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
      ctx.fillStyle = '#f8d0d5'; ctx.beginPath(); ctx.ellipse(53, 21, 9, 6, 0, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
      ctx.fillStyle = '#49384e'; ctx.beginPath(); ctx.arc(42, 14, 2, 0, Math.PI * 2); ctx.fill();
      if (complete) {
        ODY.UI.drawStar(ctx, 55, -27 + Math.sin(time * 3) * 3, 11, time * 0.4, '#ffe16d');
      }
      ctx.restore();
    }
    ODY.E.setScene({
      enter() { ODY.Snd.startBgm('map', { intensity: 0.25, fade: 0.8 }); },
      exit() { ODY.Snd.stopBgm(); },
      update(dt, dtReal) {
        time += dtReal;
        buttons.forEach(button => button.update(dtReal));
        mute.update(dtReal);
        ODY.UI.handleMuteKey(mute);
        if (ODY.E.input.buffered('left', 0.16)) {
          ODY.E.input.consume('left'); choice = (choice + buttons.length - 1) % buttons.length; ODY.Snd.click(); announceChoice();
        }
        if (ODY.E.input.buffered('right', 0.16)) {
          ODY.E.input.consume('right'); choice = (choice + 1) % buttons.length; ODY.Snd.click(); announceChoice();
        }
        if (time > 0.55 && (ODY.E.input.buffered('jump', 0.16) || ODY.E.input.buffered('ok', 0.16))) {
          ODY.E.input.consume('jump'); ODY.E.input.consume('ok'); buttons[choice].activate();
        }
      },
      pointer(type, x, y) {
        if (mute.pointer(type, x, y)) return;
        buttons.forEach((button, i) => {
          if (button.pointer(type, x, y) && type === 'down' && choice !== i) {
            choice = i;
            announceChoice();
          }
        });
      },
      draw(ctx) {
        const sky = ctx.createLinearGradient(0, 0, 0, H);
        sky.addColorStop(0, '#8575b6'); sky.addColorStop(0.52, '#f1aaa7'); sky.addColorStop(1, '#ffd7a5');
        ctx.fillStyle = sky; ctx.fillRect(0, 0, W, H);
        ctx.fillStyle = '#61a9c6'; ctx.beginPath(); ctx.moveTo(0, 284);
        for (let x = 0; x <= W; x += 22) ctx.lineTo(x, 291 + Math.sin(x * 0.018 + time) * 8);
        ctx.lineTo(W, H); ctx.lineTo(0, H); ctx.closePath(); ctx.fill();
        ctx.fillStyle = '#4b8fb7'; ctx.beginPath(); ctx.moveTo(0, 336);
        for (let x = 0; x <= W; x += 22) ctx.lineTo(x, 342 + Math.sin(x * 0.022 + time * 1.5 + 2) * 7);
        ctx.lineTo(W, H); ctx.lineTo(0, H); ctx.closePath(); ctx.fill();

        const mapNodes = [
          { x: 100, y: 307, c: '#a99bea' }, { x: 225, y: 250, c: '#8ad8d1' },
          { x: 350, y: 303, c: '#91d6a6' }, { x: 475, y: 238, c: '#b6a9ee' },
          { x: 600, y: 297, c: '#87d4df' }, { x: 725, y: 235, c: '#72bed0' },
          { x: 850, y: 287, c: '#efc65d' }
        ];
        ctx.strokeStyle = 'rgba(255,244,190,0.78)'; ctx.lineWidth = 4; ctx.setLineDash([9, 12]);
        ctx.beginPath(); ctx.moveTo(mapNodes[0].x, mapNodes[0].y);
        mapNodes.slice(1).forEach(node => ctx.lineTo(node.x, node.y));
        ctx.stroke(); ctx.setLineDash([]);
        mapNodes.forEach((node, index) => {
          const complete = reached(STAGE_IDS[index]);
          ctx.fillStyle = complete ? node.c : 'rgba(95,83,127,0.72)';
          ctx.strokeStyle = complete ? '#fff1aa' : 'rgba(255,244,214,0.48)';
          ctx.lineWidth = complete ? 4 : 2.5;
          ctx.beginPath(); ctx.ellipse(node.x, node.y + 13, 35, 12, 0, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
          ctx.fillStyle = complete ? '#fff8d8' : '#d9d1df';
          ctx.font = '900 17px "Malgun Gothic", sans-serif'; ctx.textAlign = 'center';
          ctx.fillText(String(index + 1), node.x, node.y + 18);
        });
        const shipNode = mapNodes[stageIndex] || mapNodes[0];
        ODY.UI.drawShip(ctx, shipNode.x + Math.sin(time * 0.7) * 7,
          shipNode.y - 31 + Math.sin(time * 1.6) * 3, 0.34, time);

        const pop = ODY.Feel.ease.outBack(ODY.Feel.clamp01(time / 0.5));
        ctx.save(); ctx.translate(W * 0.5, 99); ctx.scale(pop, pop);
        ODY.UI.panel(ctx, -300, -66, 600, 132, 25, '#fff8e8');
        ctx.textAlign = 'center'; ctx.fillStyle = '#a45850'; ctx.font = '900 19px "Malgun Gothic", sans-serif';
        ctx.fillText('지혜의 별 ' + mapProgress.wisdom + '개!', 0, -25);
        ctx.fillStyle = '#342442'; ctx.font = '900 30px "Malgun Gothic", sans-serif';
        ctx.fillText(route ? route.nextTitle : '별길을 다시 살펴봐요!', 0, 15);
        ctx.font = '700 18px "Malgun Gothic", sans-serif'; ctx.fillStyle = '#796476';
        ctx.fillText(route ? route.sub : '포기하지 않으면 집에 갈 수 있어요.', 0, 47);
        ctx.restore();
        buttons.forEach((button, i) => button.draw(ctx, choice === i));
        mute.draw(ctx); ODY.Feel.drawParticles(ctx);
      }
    });
  }

  // 자동 검증이 저장 정규화와 최초 클리어 규칙을 직접 확인할 수 있게 한다.
  ODY.Progress = {
    normalize: normalizeProgress,
    applyStageResult,
    resumeStage: getResumeStage,
    unlockedStageIds: getUnlockedStageIds,
    startRoute: getStartRoute
  };

  window.addEventListener('DOMContentLoaded', () => {
    ODY.E.init(document.getElementById('game'));
    showTitle();
  });
})();

</script>
</body>
</html>
