/* src/stages/sirens.js */
// 다섯 번째 모험 — 세이렌 바다
// 상하로 항로를 고르고, 짧은 지혜 방패로 둥근 노래 파동을 박자에 맞춰 막는다.
(function () {
  'use strict';

  window.ODY = window.ODY || {};
  ODY.Stages = ODY.Stages || {};

  ODY.Stages.sirens = function (options) {
    options = options || {};
    const E = ODY.E;
    const F = ODY.Feel;
    const S = ODY.Snd;
    const UI = ODY.UI;
    const Art = ODY.Art.sirens;
    const W = E.W, H = E.H;
    const level = ODY.Levels.sirens.build();

    const ship = {
      x: 225, y: 275, prevY: 275, vy: 0, tilt: 0,
      invin: 0, hasSteered: false, sq: F.makeSquash(), inputDir: 0
    };

    let state = 'intro';
    let stateBeforePause = 'run';
    let stateTime = 0;
    let simTime = 0;
    let uiTime = 0;
    let pauseInputLock = 0;
    let distance = 0;
    let speed = 0;
    let hearts = 5;
    let blocked = 0;
    let hits = 0;
    let rescues = 0;
    let stars = 0;
    let assist = 1;
    let assistTarget = 1;
    let shieldWindow = 0;
    let shieldVisible = 0;
    let shieldCooldown = 0;
    let shieldCount = 0;
    let hasShielded = false;
    let checkpointIndex = 0;
    let consecutiveFailures = 0;
    let hintText = '';
    let hintTime = 0;
    let restHeartGiven = false;
    let finishSent = false;
    let clearBurst = false;
    let musicBand = -1;
    let sprayClock = 0;

    const mute = UI.makeMuteBtn();
    const resumeButton = new UI.Button({
      x: W * 0.5, y: 360, w: 244, h: 66,
      label: '계속 항해', size: 27, color: '#8dd6bd', onTap: resumeFromPause
    });
    const rescueButton = new UI.Button({
      x: W * 0.5, y: 414, w: 264, h: 68,
      label: '다시 가자', size: 28, color: '#8fcff0', onTap: resumeFromRescue
    });

    const pauseButton = {
      x: W - 107, y: 40, r: 25, sq: F.makeSquash(),
      pointer(type, x, y) {
        if (type !== 'down') return false;
        if ((x - this.x) ** 2 + (y - this.y) ** 2 <= (this.r + 9) ** 2) {
          F.squash(this.sq, 0.86, 0.86);
          if (state === 'paused') resumeFromPause(); else pauseGame();
          if (typeof S.click === 'function') S.click();
          return true;
        }
        return false;
      },
      update(dt) { F.updSquash(this.sq, dt); },
      draw(ctx) {
        ctx.save(); ctx.translate(this.x, this.y); ctx.scale(this.sq.sx, this.sq.sy);
        ctx.fillStyle = 'rgba(40,35,80,0.6)'; ctx.beginPath(); ctx.arc(0, 0, this.r, 0, Math.PI * 2); ctx.fill();
        ctx.strokeStyle = 'rgba(255,255,255,0.46)'; ctx.lineWidth = 2; ctx.stroke();
        ctx.fillStyle = '#fff7dc'; ctx.fillRect(-8, -10, 5, 20); ctx.fillRect(3, -10, 5, 20);
        ctx.restore();
      }
    };

    function makeHoldButton(action, x, y, r, label, colors) {
      return {
        action: action, x: x, y: y, r: r, label: label,
        pointerId: null, down: false, sq: F.makeSquash(),
        contains(px, py) { return (px - this.x) ** 2 + (py - this.y) ** 2 <= (this.r + 10) ** 2; },
        pointer(type, px, py, pointerId) {
          if (type === 'down' && this.pointerId === null && this.contains(px, py)) {
            this.pointerId = pointerId;
            this.down = true;
            F.squash(this.sq, 0.9, 0.87);
            E.input.setHeld(this.action, true);
            return true;
          }
          if ((type === 'up' || type === 'cancel') && this.pointerId === pointerId) {
            this.release();
            return true;
          }
          return false;
        },
        release() {
          this.pointerId = null;
          this.down = false;
          E.input.setHeld(this.action, false);
        },
        update(dt) { F.updSquash(this.sq, dt); },
        draw(ctx) {
          const pulse = this.down ? 0.94 : 1 + Math.sin(uiTime * 3.2 + this.x * 0.01 + this.y) * 0.018;
          ctx.save(); ctx.translate(this.x, this.y); ctx.scale(this.sq.sx * pulse, this.sq.sy * pulse);
          ctx.fillStyle = 'rgba(39,34,78,0.34)'; ctx.beginPath(); ctx.arc(0, 6, this.r + 3, 0, Math.PI * 2); ctx.fill();
          const grad = ctx.createRadialGradient(-12, -15, 3, 0, 0, this.r);
          grad.addColorStop(0, colors[0]); grad.addColorStop(0.42, colors[1]); grad.addColorStop(1, colors[2]);
          ctx.fillStyle = grad; ctx.beginPath(); ctx.arc(0, 0, this.r, 0, Math.PI * 2); ctx.fill();
          ctx.strokeStyle = '#413557'; ctx.lineWidth = 4; ctx.stroke();
          ctx.fillStyle = '#342442'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
          ctx.font = '900 ' + (this.action === 'action' ? 25 : 32) + 'px "Malgun Gothic", sans-serif';
          ctx.fillText(this.label, 0, this.action === 'action' ? -1 : -2);
          ctx.restore(); ctx.textBaseline = 'alphabetic';
        }
      };
    }

    // 세 손가락을 동시에 써도 각 pointerId가 따로 유지된다.
    const upButton = makeHoldButton('up', W - 77, H - 160, 47, '↑', ['#e0fff4', '#94e3cf', '#5eb4c0']);
    const downButton = makeHoldButton('down', W - 77, H - 56, 47, '↓', ['#e0fff4', '#94e3cf', '#5eb4c0']);
    const shieldButton = makeHoldButton('action', 86, H - 72, 57, '방패', ['#fff7bd', '#f5d66b', '#d99d58']);

    function sound(primary, fallback) {
      const args = Array.prototype.slice.call(arguments, 2);
      if (typeof S[primary] === 'function') return S[primary].apply(S, args);
      if (fallback && typeof S[fallback] === 'function') return S[fallback].apply(S, args);
    }

    function releaseControls() {
      upButton.release(); downButton.release(); shieldButton.release();
      ship.inputDir = 0;
    }

    function resetShip(y) {
      ship.y = F.clamp(Number.isFinite(y) ? y : 275, level.top, level.bottom);
      ship.prevY = ship.y;
      ship.vy = 0; ship.tilt = 0; ship.inputDir = 0;
      ship.sq.sx = 1; ship.sq.sy = 1; ship.sq.vx = 0; ship.sq.vy = 0;
    }

    function showHint(text) {
      hintText = text; hintTime = 4.4;
      sound('athena', 'current', 0);
      F.sparkle(W * 0.5 - 205, 94, '#e1d1ff', 12);
    }

    function targetSpeed() {
      const rise = F.ease.inOutSine(F.clamp01(distance / level.total));
      return (230 + rise * 32) * assist;
    }

    function updateMusic(force) {
      let intensity = 0.28;
      if (distance >= 2850 && distance < 4600) intensity = 0.38;
      else if (distance >= 4600 && distance < 6300) intensity = 0.48;
      else if (distance >= 6300 && distance < 8080) intensity = 0.59;
      else if (distance >= 8080 && distance < 9030) intensity = 0.28;
      else if (distance >= 9030) intensity = 0.7;
      const band = Math.round(intensity * 100);
      if (force || band !== musicBand) {
        musicBand = band;
        if (typeof S.setMusicIntensity === 'function') S.setMusicIntensity(intensity, 0.8);
      }
    }

    function updateShip(dt, canControl) {
      dt = F.clamp(dt, 0, 0.05);
      ship.prevY = ship.y;
      ship.invin = Math.max(0, ship.invin - dt);

      let direction = 0;
      if (canControl) {
        const upHeld = E.input.held('up');
        const downHeld = E.input.held('down');
        if (upHeld !== downHeld) direction = upHeld ? -1 : 1;

        const upPressed = E.input.buffered('up', 0.14);
        const downPressed = E.input.buffered('down', 0.14);
        let pressed = 0;
        if (upPressed !== downPressed) pressed = upPressed ? -1 : 1;
        if (upPressed) E.input.consume('up');
        if (downPressed) E.input.consume('down');
        if (pressed) {
          const reversed = ship.inputDir && ship.inputDir !== pressed;
          ship.vy = F.clamp(ship.vy + pressed * (reversed ? 66 : 45), -285, 285);
          ship.hasSteered = true;
          F.squash(ship.sq, reversed ? 1.08 : 0.94, reversed ? 0.92 : 1.08);
          sound('steer', 'splash', pressed);
        }
      }

      const targetVy = direction * 245;
      const response = direction ? (ship.vy * direction < 0 ? 23 : 18) : 16;
      ship.vy = F.damp(ship.vy, targetVy, response, dt);
      ship.y += ship.vy * dt;
      if (ship.y < level.top) {
        ship.y = level.top; if (ship.vy < 0) ship.vy = 0; F.squash(ship.sq, 1.08, 0.91);
      } else if (ship.y > level.bottom) {
        ship.y = level.bottom; if (ship.vy > 0) ship.vy = 0; F.squash(ship.sq, 1.08, 0.91);
      }
      ship.inputDir = direction;
      ship.tilt = F.damp(ship.tilt, direction * 0.12, direction ? 14 : 10, dt);
      F.updSquash(ship.sq, dt);

      sprayClock -= dt;
      if (sprayClock <= 0) {
        sprayClock = 0.12;
        F.spawn({
          x: ship.x - 57, y: ship.y + 20,
          vx: -120 - speed * 0.28, vy: -25 - Math.random() * 36,
          g: 115, drag: 1.2, life: 0.3 + Math.random() * 0.16,
          size: 4 + Math.random() * 4, endSize: 0.2,
          color: 'rgba(224,252,248,0.72)', shape: 'circle', layer: -1
        });
      }
    }

    function activateShield() {
      if (state !== 'run' && state !== 'intro' && state !== 'return') return;
      if (shieldCooldown > 0.12) return;
      E.input.consume('action');
      const bonus = (1 - assistTarget) * 0.58;
      shieldWindow = 0.47 + bonus; // 보이는 시간 + 25fps 한 프레임의 여유.
      shieldVisible = 0.4 + bonus;
      shieldCooldown = 0.61;
      shieldCount++;
      hasShielded = true;
      F.squash(ship.sq, 1.12, 0.89);
      F.ring(ship.x + 5, ship.y - 12, '#ffe879', 26, 0.33);
      sound('sirenShield', 'shield');
    }

    function updateShield(dt) {
      shieldWindow = Math.max(0, shieldWindow - dt);
      shieldVisible = Math.max(0, shieldVisible - dt);
      shieldCooldown = Math.max(0, shieldCooldown - dt);
      // 재사용 직전 누른 입력은 0.16초 버퍼 안에서 자동으로 이어진다. 홀드는 반복 발동하지 않는다.
      if (E.input.buffered('action', 0.16) && shieldCooldown <= 0.12) activateShield();
    }

    function wavePopY() {
      return F.clamp(ship.y - 78, 129, H - 90);
    }

    function registerFailure() {
      consecutiveFailures++;
      if (consecutiveFailures >= 3 && assistTarget > 0.83) {
        assistTarget = 0.82;
        showHint('노래가 배에 닿을 때 방패를 톡 눌러요.');
        UI.announce('아테나가 노래를 천천히 만들었어요. 파동이 배에 닿을 때 방패를 눌러요.');
      }
    }

    function blockWave(wave, sx) {
      wave.resolved = true;
      blocked++;
      consecutiveFailures = 0;
      ship.invin = Math.max(ship.invin, 0.18);
      F.doHitstop(wave.safe ? 0.025 : 0.045);
      F.flash('#fff3a1', wave.safe ? 0.08 : 0.14);
      F.ring(ship.x + 34, ship.y - 7, '#fff08a', 31, 0.36);
      F.sparkle(Math.max(ship.x + 38, sx), wave.y, '#ffe878', wave.safe ? 9 : 16);
      F.pop(ship.x + 8, wavePopY(), wave.safe ? '좋은 박자!' : '막았다!', '#fff1a0', 22);
      sound('sirenBlock', 'shield', Math.min(3, blocked - 1));
    }

    function hitWave(wave, sx) {
      wave.resolved = true;
      if (wave.safe) {
        F.ring(ship.x + 35, wave.y, '#9fe8d8', 22, 0.3);
        return;
      }
      if (ship.invin > 0 || state !== 'run') return;
      hearts--;
      hits++;
      registerFailure();
      ship.invin = 1.25;
      ship.vy += ship.y < wave.y ? -105 : 105;
      F.squash(ship.sq, 1.25, 0.74);
      F.doHitstop(0.072);
      F.addShake(0.34, -1, ship.y < wave.y ? -0.35 : 0.35);
      F.flash('#ffb9c8', 0.15);
      F.debris(ship.x + 30, ship.y, '#e9a9d0', 11, -1);
      F.pop(ship.x + 5, wavePopY(), '괜찮아!', '#fff0a5', 23);
      sound('sirenHit', 'splash');
      if (hearts <= 0) triggerRescue();
    }

    function sweptWaveCollision(wave, previousDistance, dt) {
      const sx0 = wave.x - previousDistance;
      const sx1 = wave.x - distance;
      if (sx1 < ship.x - 120 || sx0 > ship.x + 150) return false;
      // 25fps뿐 아니라 잠깐 느려진 프레임에서도 파동을 건너뛰지 않는다.
      const samples = dt >= 0.028 ? 7 : 3;
      const rx = wave.radius + 43;
      const ry = wave.radius + 28;
      for (let i = 0; i < samples; i++) {
        const k = samples === 1 ? 1 : i / (samples - 1);
        const sx = F.lerp(sx0, sx1, k);
        const sy = F.lerp(ship.prevY, ship.y, k);
        const dx = (sx - ship.x) / rx;
        const dy = (wave.y - sy) / ry;
        if (dx * dx + dy * dy <= 1) return true;
      }
      return false;
    }

    function updateWaves(previousDistance, dt) {
      for (const wave of level.waves) {
        if (wave.resolved) continue;
        const sx = wave.x - distance;
        if (!wave.warned && sx < W - 55 && sx > ship.x + 330) {
          wave.warned = true;
          sound('sirenWave', 'current', wave.safe ? 0 : 1);
        }
        if (sx < -150) {
          wave.resolved = true;
          // 부딪히지 않고 흘려보낸 것도 성공이다. 세 번의 '연속' 실패만 보조를 켠다.
          if (!wave.safe) consecutiveFailures = 0;
          continue;
        }
        if (sx > W + 180) continue;
        if (sweptWaveCollision(wave, previousDistance, dt)) {
          if (shieldWindow > 0) blockWave(wave, sx); else hitWave(wave, sx);
        }
      }
    }

    function collectStars(dt) {
      for (const star of level.stars) {
        if (star.got) continue;
        const sx = star.x - distance;
        if (sx < -80 || sx > W + 90) continue;
        const dx = sx - ship.x;
        const dy = star.y - ship.y;
        if (dx * dx + dy * dy < 34 * 34) {
          star.got = true; stars++;
          F.sparkle(sx, star.y, '#ffe878', 12);
          F.ring(sx, star.y, '#fff2a1', 12, 0.28);
          sound('star', 'pickup', Math.min(3, stars % 4));
        }
      }
    }

    function updateCheckpoint() {
      const next = checkpointIndex + 1;
      if (next < level.checkpoints.length && distance >= level.checkpoints[next]) {
        checkpointIndex = next;
        hearts = Math.min(5, hearts + 1);
        F.sparkle(ship.x, ship.y, '#c7f3e2', 12);
        F.pop(ship.x, wavePopY(), '숨 돌리자!', '#c9f6e4', 20);
        sound('athena', 'current', 0);
      }
      if (!restHeartGiven && distance >= level.restZones[0].from) {
        restHeartGiven = true;
        hearts = Math.min(5, hearts + 1);
      }
    }

    function triggerRescue() {
      if (state === 'rescue') return;
      releaseControls();
      state = 'rescue'; stateTime = 0;
      F.pulseSlowmo(0.3, 0.12, 0.25);
      if (typeof S.setMusicState === 'function') S.setMusicState('rescue');
      sound('athena', 'current', 0);
      UI.announce('아테나가 노래를 잠재웠어요. 다시 가자 버튼으로 잔잔한 곳에서 시작해요.');
    }

    function resetFromCheckpoint(checkpoint) {
      for (const wave of level.waves) {
        if (wave.x >= checkpoint - 180) {
          wave.hit = false; wave.resolved = false; wave.warned = false;
        }
      }
      for (const star of level.stars) {
        if (star.x >= checkpoint - 120) star.got = false;
      }
    }

    function resumeFromRescue() {
      if (state !== 'rescue') return;
      rescues++;
      if (rescues >= 3) {
        assistTarget = 0.78;
        showHint('아테나의 빛이 방패를 더 오래 밝혀 줘요.');
      }
      hearts = 5;
      const checkpoint = level.checkpoints[checkpointIndex];
      distance = Math.max(0, checkpoint - 120);
      speed = 110;
      shieldWindow = 0; shieldVisible = 0; shieldCooldown = 0;
      resetFromCheckpoint(checkpoint);
      resetShip(checkpointIndex === 1 ? 275 : 280);
      ship.invin = 2;
      releaseControls();
      state = 'return'; stateTime = 0;
      if (typeof S.setMusicState === 'function') S.setMusicState('play');
      updateMusic(true);
      UI.announce('하트 다섯 개로 다시 항해해요.');
    }

    function pauseGame() {
      if (state === 'paused' || state === 'rescue' || state === 'clear') return;
      stateBeforePause = state;
      state = 'paused';
      releaseControls();
      E.input.consume('up'); E.input.consume('down'); E.input.consume('action'); E.input.consume('ok');
      pauseInputLock = 0.2;
      if (typeof S.pause === 'function') S.pause();
      UI.announce('잠깐 쉬어요. P, Esc, 스페이스바로 계속해요.');
    }

    function resumeFromPause() {
      if (state !== 'paused') return;
      state = stateBeforePause;
      E.input.clearAll();
      releaseControls();
      if (typeof S.resume === 'function') S.resume();
      UI.announce('세이렌 바다를 계속 항해해요.');
    }

    function triggerClear() {
      if (state === 'clear') return;
      state = 'clear'; stateTime = 0; clearBurst = false;
      releaseControls();
      S.startBgm('rewardSirens', { intensity: 0.4, fade: 0.48 });
      sound('clear', 'shield');
      F.pulseSlowmo(0.28, 0.22, 0.5);
      F.flash('#fff1a6', 0.24);
      F.addShake(0.27, 0.4, -1);
    }

    function updateWorld(dt) {
      assist = F.damp(assist, assistTarget, 1.7, dt);
      speed = F.damp(speed, targetSpeed(), 2.7, dt);
      const previousDistance = distance;
      distance += speed * dt;
      updateShip(dt, true);
      updateShield(dt);
      collectStars(dt);
      updateWaves(previousDistance, dt);
      updateCheckpoint();
      updateMusic(false);
      if (distance >= level.total) triggerClear();
    }

    function togglePauseKey() {
      if (!E.input.buffered('pause', 0.16)) return;
      E.input.consume('pause');
      if (state === 'paused') resumeFromPause(); else pauseGame();
    }

    function update(dt, dtReal) {
      uiTime += dtReal;
      pauseInputLock = Math.max(0, pauseInputLock - dtReal);
      mute.update(dtReal); pauseButton.update(dtReal);
      upButton.update(dtReal); downButton.update(dtReal); shieldButton.update(dtReal);
      const muteChanged = UI.handleMuteKey ? UI.handleMuteKey(mute) : false;
      if (muteChanged && state === 'paused' && typeof S.pause === 'function') S.pause();
      togglePauseKey();

      if (state === 'paused') {
        resumeButton.update(dtReal);
        if (pauseInputLock <= 0 && (E.input.buffered('action', 0.16) || E.input.buffered('ok', 0.16))) {
          E.input.consume('action'); E.input.consume('ok'); resumeButton.activate();
        }
        return;
      }
      if (state === 'rescue') {
        stateTime += dtReal; rescueButton.update(dtReal);
        if (stateTime > 0.55 && (E.input.buffered('action', 0.16) || E.input.buffered('ok', 0.16))) {
          E.input.consume('action'); E.input.consume('ok'); rescueButton.activate();
        }
        return;
      }

      simTime += dt;
      stateTime += dt;
      hintTime = Math.max(0, hintTime - dt);

      if (state === 'intro') {
        const begin = F.ease.inOutSine(F.clamp01((stateTime - 0.55) / 1.0));
        speed = F.damp(speed, 210 * begin, 3.2, dt);
        if (stateTime > 0.85) distance += speed * dt;
        updateShip(dt, stateTime > 0.9);
        updateShield(dt);
        if (stateTime > 2.05) { state = 'run'; stateTime = 0; }
      } else if (state === 'return') {
        speed = F.damp(speed, targetSpeed(), 2.5, dt);
        distance += speed * dt * 0.55;
        updateShip(dt, stateTime > 0.48);
        updateShield(dt);
        if (stateTime > 1.05) { state = 'run'; stateTime = 0; }
      } else if (state === 'run') {
        updateWorld(dt);
      } else if (state === 'clear') {
        speed = F.damp(speed, 96, 2.5, dt);
        distance += speed * dt * 0.3;
        updateShip(dt, false);
        shieldWindow = Math.max(0, shieldWindow - dt);
        shieldVisible = Math.max(0, shieldVisible - dt);
        if (!clearBurst && stateTime > 0.32) {
          clearBurst = true;
          F.confetti(ship.x + 35, ship.y - 48, 62);
          F.sparkle(ship.x + 76, ship.y - 4, '#ffe878', 24);
        }
        if (stateTime > 1.82 && !finishSent) {
          finishSent = true;
          if (typeof options.onClear === 'function') options.onClear({ stars: stars });
        }
      }
    }

    function view() {
      return {
        time: simTime, distance: distance, total: level.total,
        hasSteered: ship.hasSteered, hasShielded: hasShielded
      };
    }

    function drawHUD(ctx) {
      UI.drawHearts(ctx, 39, 40, hearts, 5);
      ctx.fillStyle = 'rgba(40,35,80,0.58)'; UI.rr(ctx, 28, 69, 142, 44, 22); ctx.fill();
      ctx.strokeStyle = '#ffe681'; ctx.lineWidth = 4;
      ctx.beginPath(); ctx.arc(55, 91, 13, -1.7, 1.7); ctx.stroke();
      ctx.fillStyle = '#fff7df'; ctx.font = '900 20px "Malgun Gothic", sans-serif';
      ctx.textAlign = 'left'; ctx.fillText('막기 ' + blocked, 77, 99);
      UI.drawProgress(ctx, W * 0.5 - 160, 27, 320, distance / level.total);
      pauseButton.draw(ctx); mute.draw(ctx);
      if (E.isTouch && state !== 'paused' && state !== 'rescue' && state !== 'clear') {
        upButton.draw(ctx); downButton.draw(ctx); shieldButton.draw(ctx);
      }
    }

    function drawIntro(ctx) {
      if (state !== 'intro') return;
      const enter = F.ease.outBack(F.clamp01((stateTime - 0.05) / 0.48));
      const leave = 1 - F.ease.inQuad(F.clamp01((stateTime - 1.38) / 0.6));
      ctx.save(); ctx.globalAlpha = leave; ctx.translate(W * 0.5, 118); ctx.scale(enter, enter);
      UI.panel(ctx, -266, -55, 532, 110, 24, '#fff8e8');
      ctx.textAlign = 'center'; ctx.fillStyle = '#9c5d8e'; ctx.font = '900 18px "Malgun Gothic", sans-serif';
      ctx.fillText('다섯 번째 모험', 0, -15);
      ctx.fillStyle = '#342442'; ctx.font = '900 31px "Malgun Gothic", sans-serif';
      ctx.fillText('세이렌 바다', 0, 25); ctx.restore();
    }

    function drawHint(ctx) {
      if (hintTime <= 0) return;
      const enter = F.ease.outBack(F.clamp01((4.4 - hintTime) / 0.42));
      const leave = F.clamp01(hintTime / 0.42);
      ctx.save(); ctx.globalAlpha = leave; ctx.translate(W * 0.5, 98); ctx.scale(enter, enter);
      UI.panel(ctx, -300, -45, 600, 90, 22, '#fff8e8');
      UI.drawOwl(ctx, -244, 0, 0.47, uiTime, true);
      ctx.fillStyle = '#342442'; ctx.font = '900 20px "Malgun Gothic", sans-serif';
      ctx.textAlign = 'left'; ctx.fillText(hintText, -194, 8); ctx.restore();
    }

    function drawRescue(ctx) {
      ctx.fillStyle = 'rgba(34,29,70,0.7)'; ctx.fillRect(0, 0, W, H);
      const pop = F.ease.outBack(F.clamp01(stateTime / 0.48));
      ctx.save(); ctx.translate(W * 0.5, 238); ctx.scale(pop, pop);
      UI.panel(ctx, -310, -128, 620, 236, 28, '#fff8e8');
      UI.drawOwl(ctx, -216, -62, 0.82, uiTime, true);
      ctx.fillStyle = '#9c5d8e'; ctx.font = '900 22px "Malgun Gothic", sans-serif'; ctx.textAlign = 'left';
      ctx.fillText('아테나가 노래를 잠재웠어요.', -139, -58);
      ctx.fillStyle = '#342442'; ctx.font = '900 25px "Malgun Gothic", sans-serif';
      ctx.fillText('힘보다 지혜로 다시 가요!', -139, -15);
      ctx.font = '700 18px "Malgun Gothic", sans-serif'; ctx.fillStyle = '#796476';
      ctx.fillText('잔잔한 바다에서 출발해요.', -139, 24); ctx.restore();
      if (stateTime > 0.35) rescueButton.draw(ctx, true);
    }

    function drawPause(ctx) {
      ctx.fillStyle = 'rgba(34,29,70,0.66)'; ctx.fillRect(0, 0, W, H);
      UI.panel(ctx, W * 0.5 - 230, 122, 460, 262, 28, '#fff8e8');
      UI.drawOwl(ctx, W * 0.5, 218, 0.72, uiTime, true);
      ctx.fillStyle = '#342442'; ctx.textAlign = 'center'; ctx.font = '900 35px "Malgun Gothic", sans-serif';
      ctx.fillText('잠깐 쉬어요', W * 0.5, 292);
      ctx.font = '700 18px "Malgun Gothic", sans-serif'; ctx.fillStyle = '#796476';
      ctx.fillText('P 또는 Esc로 계속할 수 있어요.', W * 0.5, 326);
      resumeButton.draw(ctx, true);
    }

    function drawClear(ctx) {
      if (state !== 'clear' || stateTime < 0.24) return;
      const pop = F.ease.outBack(F.clamp01((stateTime - 0.24) / 0.5));
      ctx.save(); ctx.translate(W * 0.5, 118); ctx.scale(pop, pop); ctx.textAlign = 'center';
      ctx.font = '900 47px "Malgun Gothic", sans-serif'; ctx.lineWidth = 10; ctx.strokeStyle = '#342442'; ctx.lineJoin = 'round';
      ctx.strokeText('노래를 지나왔다!', 0, 0); ctx.fillStyle = '#fff08a'; ctx.fillText('노래를 지나왔다!', 0, 0);
      ctx.font = '900 22px "Malgun Gothic", sans-serif'; ctx.lineWidth = 6;
      ctx.strokeText('지혜로 마음을 지켰어요.', 0, 40); ctx.fillStyle = '#fff8dc'; ctx.fillText('지혜로 마음을 지켰어요.', 0, 40);
      ctx.restore();
    }

    function draw(ctx) {
      const v = view();
      const shake = E.shake || { x: 0, y: 0 };
      ctx.save(); ctx.translate(shake.x, shake.y);
      Art.drawBackground(ctx, v);
      F.drawParticles(ctx, -1);
      for (const wave of level.waves) {
        const sx = wave.x - distance;
        if (sx > -180 && sx < W + 190) Art.drawWarning(ctx, wave, sx, ship.x, simTime);
      }
      for (const star of level.stars) {
        const sx = star.x - distance;
        if (sx > -80 && sx < W + 90) Art.drawStar(ctx, star, sx, simTime);
      }
      for (const wave of level.waves) {
        const sx = wave.x - distance;
        if (sx > -180 && sx < W + 190) Art.drawWave(ctx, wave, sx, simTime);
      }
      Art.drawSilentGuide(ctx, v, ship, shieldWindow > 0);
      Art.drawShip(ctx, ship, simTime, shieldWindow > 0, shieldVisible > 0 ? shieldVisible / 0.4 : 0.18);
      F.drawParticles(ctx, 0);
      Art.drawForeground(ctx, v);
      ctx.restore();
      drawHUD(ctx); drawIntro(ctx); drawHint(ctx); drawClear(ctx);
      if (state === 'rescue') drawRescue(ctx);
      if (state === 'paused') drawPause(ctx);
    }

    return {
      debug: {
        get state() { return state; },
        get time() { return simTime; },
        get distance() { return distance; },
        get hearts() { return hearts; },
        get blocked() { return blocked; },
        get hits() { return hits; },
        get rescues() { return rescues; },
        get assist() { return assist; },
        get shield() { return shieldWindow; },
        get waves() { return level.waves; },
        level: level
      },
      enter() {
        if (typeof S.unlock === 'function') S.unlock();
        S.startBgm('sirens', { intensity: 0.28, fade: 0.75 });
        updateMusic(true);
      },
      exit() {
        releaseControls();
        E.input.consume('up'); E.input.consume('down'); E.input.consume('action');
        if (state !== 'clear' && typeof S.stopBgm === 'function') S.stopBgm();
      },
      update: update,
      pointer(type, x, y, pointerId) {
        if (type === 'cancel') {
          upButton.pointer(type, x, y, pointerId);
          downButton.pointer(type, x, y, pointerId);
          shieldButton.pointer(type, x, y, pointerId);
          return;
        }
        if (mute.pointer(type, x, y)) { if (state === 'paused' && typeof S.pause === 'function') S.pause(); return; }
        if (pauseButton.pointer(type, x, y)) return;
        if (state === 'rescue') { rescueButton.pointer(type, x, y); return; }
        if (state === 'paused') { resumeButton.pointer(type, x, y); return; }
        if (E.isTouch) {
          if (type === 'up') {
            upButton.pointer(type, x, y, pointerId);
            downButton.pointer(type, x, y, pointerId);
            shieldButton.pointer(type, x, y, pointerId);
            return;
          }
          if (upButton.pointer(type, x, y, pointerId)) return;
          if (downButton.pointer(type, x, y, pointerId)) return;
          shieldButton.pointer(type, x, y, pointerId);
        }
      },
      draw: draw
    };
  };
})();

// 스테이지 6 — 스킬라와 카립디스: 결정적인 수제 해협 코스
(function () {
  'use strict';

  window.ODY = window.ODY || {};
  ODY.Levels = ODY.Levels || {};

  const TOP = 142;
  const BOTTOM = 414;
  const TOTAL = 13750;

  function addStars(list, fromX, toX, count, fromY, toY, phase) {
    for (let i = 0; i < count; i++) {
      const k = count === 1 ? 0.5 : i / (count - 1);
      const ease = (1 - Math.cos(Math.PI * k)) * 0.5;
      list.push({
        x: fromX + (toX - fromX) * k,
        y: fromY + (toY - fromY) * ease,
        phase: phase + i * 0.71,
        got: false
      });
    }
  }

  function build() {
    const stars = [];

    // 첫 10초 이상은 완전 안전하다. 반짝이 길만 보고 위·아래 조종을 익힌다.
    addStars(stars, 560, 1180, 5, 276, 276, 0.2);
    addStars(stars, 1390, 2060, 6, 276, 195, 1.3);
    addStars(stars, 2240, 2840, 5, 200, 350, 2.5);

    // 소개: 위 팔, 아래 소용돌이를 하나씩 넉넉하게 보여 준다.
    addStars(stars, 3120, 3550, 4, 350, 350, 3.4);
    addStars(stars, 3900, 4330, 4, 195, 195, 4.3);

    // 연습: 같은 요소를 한 번씩 더, 방향 전환은 느긋하게 한다.

    addStars(stars, 7180, 7610, 4, 205, 205, 7.9);
    addStars(stars, 7900, 8350, 4, 205, 340, 8.8);

    // 휴식: 넓은 중앙 물길과 하트 별 하나.
    addStars(stars, 8720, 9420, 7, 276, 276, 9.8);

    // 절정: 배운 두 위험만 짧은 리듬으로 잇는다.
    addStars(stars, 9760, 10170, 4, 342, 342, 10.8);
    addStars(stars, 10410, 10820, 4, 200, 200, 11.7);
    addStars(stars, 11070, 11490, 4, 340, 340, 12.6);
    addStars(stars, 11740, 12150, 4, 202, 202, 13.5);
    addStars(stars, 12400, 12820, 4, 338, 338, 14.4);

    const hazards = [
      // 첫 충돌 가능 시점은 기본 속도 기준 약 13초 뒤다.
      { type: 'arm', x: 3340, reach: 205, w: 58, warn: 520, group: '첫 팔' },

      { type: 'whirlpool', x: 5750, y: 403, rx: 88, ry: 66, pull: 82, warn: 500, group: '소용돌이 연습' },

      { type: 'arm', x: 6680, reach: 222, w: 64, warn: 490, group: '번갈아 피하기' },
      { type: 'whirlpool', x: 7400, y: 403, rx: 90, ry: 68, pull: 88, warn: 480, group: '번갈아 피하기' },
      { type: 'arm', x: 8120, reach: 226, w: 66, warn: 470, group: '번갈아 피하기' },

      // 8,450~9,650은 의도적인 휴식 구간이다.

      { type: 'arm', x: 9970, reach: 230, w: 68, warn: 460, group: '마지막 해협' },
      { type: 'whirlpool', x: 10620, y: 403, rx: 93, ry: 70, pull: 94, warn: 450, group: '마지막 해협' },
      { type: 'arm', x: 11280, reach: 232, w: 70, warn: 440, group: '마지막 해협' },
      { type: 'whirlpool', x: 11940, y: 403, rx: 94, ry: 71, pull: 98, warn: 430, group: '마지막 해협' },
      { type: 'arm', x: 12610, reach: 234, w: 72, warn: 420, group: '마지막 해협' },
      { type: 'whirlpool', x: 13220, y: 403, rx: 94, ry: 71, pull: 98, warn: 420, group: '마지막 해협' }
    ];

    return {
      top: TOP,
      bottom: BOTTOM,
      total: TOTAL,
      safeUntil: 3000,
      checkpoints: [0, 6200, 9650],
      restZones: [{ from: 8450, to: 9650 }],

  }

  ODY.Levels.scylla = { build, TOP, BOTTOM, TOTAL };
})();

/* src/stages/scylla-art.js */
// 스테이지 6 — 스킬라와 카립디스: 파스텔 해협 캔버스 그림
(function () {
  'use strict';

  window.ODY = window.ODY || {};
  ODY.Art = ODY.Art || {};

  const A = {};
  const TAU = Math.PI * 2;
  const INK = '#342442';

  function wrap(value, span) {
    return ((value % span) + span) % span;
  }

  function rounded(ctx, x, y, w, h, r) {
    const rr = Math.min(r, Math.abs(w) * 0.5, Math.abs(h) * 0.5);
    ctx.beginPath();
    ctx.moveTo(x + rr, y);
    ctx.arcTo(x + w, y, x + w, y + h, rr);
    ctx.arcTo(x + w, y + h, x, y + h, rr);
    ctx.arcTo(x, y + h, x, y, rr);
    ctx.arcTo(x, y, x + w, y, rr);
    ctx.closePath();
  }

  function cloud(ctx, x, y, scale, color, alpha) {
    ctx.save(); ctx.translate(x, y); ctx.scale(scale, scale);
    ctx.globalAlpha = alpha === undefined ? 1 : alpha;
    ctx.fillStyle = color;
    ctx.beginPath();
    ctx.arc(-33, 7, 24, 0, TAU);
    ctx.arc(-8, -7, 31, 0, TAU);
    ctx.arc(23, 1, 27, 0, TAU);
    ctx.arc(43, 12, 18, 0, TAU);
    ctx.rect(-34, 5, 78, 28); ctx.fill();
    ctx.restore();
  }

  function waveBand(ctx, y, color, amp, phase, height) {
    ctx.fillStyle = color;
    ctx.beginPath(); ctx.moveTo(0, y);
    for (let x = 0; x <= 984; x += 24) {
      ctx.lineTo(x, y + Math.sin(x * 0.024 + phase) * amp);
    }
    ctx.lineTo(984, height); ctx.lineTo(0, height); ctx.closePath(); ctx.fill();
  }

  function farCliff(ctx, x, base, scale, color) {
    ctx.save(); ctx.translate(x, base); ctx.scale(scale, scale);
    ctx.fillStyle = color;
    ctx.beginPath();
    ctx.moveTo(-150, 70); ctx.lineTo(-137, 7);
    ctx.quadraticCurveTo(-118, -41, -88, -7);
    ctx.quadraticCurveTo(-63, -74, -26, -27);
    ctx.quadraticCurveTo(8, -91, 45, -32);
    ctx.quadraticCurveTo(85, -64, 112, -12);
    ctx.quadraticCurveTo(145, 2, 158, 70);
    ctx.closePath(); ctx.fill();
    ctx.restore();
  }

  A.drawBackground = function (ctx, view) {
    const t = view.time || 0;
    const d = view.dist || 0;
    const sky = ctx.createLinearGradient(0, 0, 0, 540);
    sky.addColorStop(0, '#b9b1dc');
    sky.addColorStop(0.38, '#ffd2bd');
    sky.addColorStop(0.7, '#74c6d5');
    sky.addColorStop(1, '#397fa9');
    ctx.fillStyle = sky; ctx.fillRect(0, 0, 960, 540);

    // 먼 구름 — 첫 번째 패럴랙스.
    for (let i = 0; i < 7; i++) {
      const x = wrap(i * 248 - d * 0.04, 1820) - 170;
      const y = 45 + (i % 3) * 34 + Math.sin(t * 0.35 + i) * 3;
      cloud(ctx, x, y, 0.62 + (i % 2) * 0.16, '#fff0e9', 0.56);
    }

    // 먼 절벽 — 두 번째 패럴랙스.
    for (let i = 0; i < 6; i++) {
      const x = wrap(i * 355 - d * 0.1, 2200) - 220;
      farCliff(ctx, x, 235 + (i % 2) * 19, 0.78, i % 2 ? '#887da2' : '#9689ab');
    }

    waveBand(ctx, 204, '#70c4d2', 8, d * 0.004 + t * 0.45, 540);
    waveBand(ctx, 284, '#54a8c4', 12, d * 0.009 + t * 0.7, 540);
    waveBand(ctx, 385, '#397eaa', 16, d * 0.016 + t * 0.95, 540);

    // 가까운 물결선 — 세 번째 패럴랙스.
    ctx.strokeStyle = 'rgba(225,254,247,0.28)';
    ctx.lineWidth = 3; ctx.lineCap = 'round';
    for (let i = 0; i < 16; i++) {
      const x = wrap(i * 104 - d * 0.72, 1770) - 100;
      const y = 222 + (i * 53) % 280 + Math.sin(t * 1.7 + i) * 5;
      ctx.beginPath(); ctx.moveTo(x, y);
      ctx.quadraticCurveTo(x + 23, y - 6, x + 49, y); ctx.stroke();
    }

    // 출구의 따뜻한 이타카 빛.
    const exitX = (view.total || 13750) + 300 - d;
    if (exitX < 1500) {
      const glow = ctx.createRadialGradient(exitX, 228, 10, exitX, 228, 360);
      glow.addColorStop(0, 'rgba(255,248,174,0.92)');
      glow.addColorStop(0.3, 'rgba(255,220,137,0.4)');
      glow.addColorStop(1, 'rgba(255,220,137,0)');
      ctx.fillStyle = glow; ctx.fillRect(exitX - 370, 0, 740, 540);
    }
  };

  function drawScyllaFace(ctx, time, warning) {
    const bob = Math.sin(time * 2.1) * 2;
    ctx.save(); ctx.translate(0, bob);
    ctx.fillStyle = '#c59ad5'; ctx.strokeStyle = INK; ctx.lineWidth = 4;
    ctx.beginPath(); ctx.ellipse(0, 0, 37, 30, 0, 0, TAU); ctx.fill(); ctx.stroke();
    ctx.fillStyle = '#ead1f2';
    ctx.beginPath(); ctx.ellipse(-11, -17, 14, 9, -0.3, 0, TAU); ctx.fill();
    const blink = Math.sin(time * 1.45 + 1.2) > 0.94;
    ctx.strokeStyle = INK; ctx.lineWidth = 3; ctx.lineCap = 'round';
    if (blink) {
      ctx.beginPath(); ctx.moveTo(-16, -2); ctx.lineTo(-7, -2);
      ctx.moveTo(8, -2); ctx.lineTo(17, -2); ctx.stroke();
    } else {
      ctx.fillStyle = INK; ctx.beginPath();
      ctx.arc(-11, -2, 3.5, 0, TAU); ctx.arc(12, -2, 3.5, 0, TAU); ctx.fill();
    }
    ctx.fillStyle = 'rgba(255,139,166,0.42)';
    ctx.beginPath(); ctx.arc(-24, 10, 7, 0, TAU); ctx.arc(25, 10, 7, 0, TAU); ctx.fill();
    ctx.strokeStyle = INK;
    ctx.beginPath();
    if (warning) ctx.arc(1, 11, 7, Math.PI, TAU);
    else ctx.arc(1, 7, 9, 0.18 * Math.PI, 0.82 * Math.PI);
    ctx.stroke();
    // 왕관 같은 조개뿔. 날카롭지 않은 둥근 모양이다.
    ctx.fillStyle = '#ffe18f';
    for (let i = -1; i <= 1; i++) {
      ctx.beginPath(); ctx.arc(i * 18, -29 - (i === 0 ? 6 : 0), 7, 0, TAU); ctx.fill(); ctx.stroke();
    }
    ctx.restore();
  }

  function drawArm(ctx, hazard, sx, time, assistScale) {
    const reach = Math.max(170, hazard.reach - (1 - assistScale) * 150);
    const warning = sx > 285 && sx < 760;
    const wiggle = Math.sin(time * 3.1 + hazard.x * 0.001) * 7;

    if (warning) {
      const alpha = 0.22 + Math.sin(time * 7) * 0.08;
      ctx.save(); ctx.globalAlpha = alpha;
      ctx.fillStyle = '#ffe38e';
      rounded(ctx, sx - 50, 128, 100, Math.max(52, reach - 118), 45); ctx.fill();
      ctx.restore();
    }

    ctx.save();
    ctx.strokeStyle = '#543b68'; ctx.lineWidth = hazard.w + 8; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(sx, 67);
    ctx.bezierCurveTo(sx - 34, 103, sx + 34 + wiggle, reach - 55, sx + wiggle, reach); ctx.stroke();
    const grad = ctx.createLinearGradient(sx - 35, 65, sx + 35, reach);
    grad.addColorStop(0, '#b887cb'); grad.addColorStop(1, '#dcabd9');
    ctx.strokeStyle = grad; ctx.lineWidth = hazard.w; ctx.beginPath();
    ctx.moveTo(sx, 67); ctx.bezierCurveTo(sx - 34, 103, sx + 34 + wiggle, reach - 55, sx + wiggle, reach); ctx.stroke();
    ctx.fillStyle = '#ffe2e6';
    for (let i = 0; i < 3; i++) {
      const yy = 112 + i * Math.max(30, (reach - 135) / 3);
      ctx.beginPath(); ctx.arc(sx + (i % 2 ? 13 : -12) + wiggle * i / 5, yy, 7, 0, TAU); ctx.fill();
    }
    ctx.translate(sx + wiggle, reach);
    ctx.fillStyle = '#f1b9df'; ctx.strokeStyle = INK; ctx.lineWidth = 3;
    for (let i = 0; i < 4; i++) {
      ctx.save(); ctx.rotate(i * TAU / 4 + time * 0.12);
      ctx.beginPath(); ctx.ellipse(0, 16, 10, 20, 0, 0, TAU); ctx.fill(); ctx.stroke(); ctx.restore();
    }
    ctx.fillStyle = '#ffe48f'; ctx.beginPath(); ctx.arc(0, 0, 9, 0, TAU); ctx.fill(); ctx.stroke();
    ctx.restore();

    ctx.save(); ctx.translate(sx, 57); drawScyllaFace(ctx, time + hazard.x * 0.0003, warning); ctx.restore();
  }

  function drawWhirlpool(ctx, hazard, sx, time, assistScale) {
    const rx = Math.max(65, hazard.rx - (1 - assistScale) * 105);
    const ry = Math.max(48, hazard.ry - (1 - assistScale) * 80);
    const warning = sx > 285 && sx < 760;
    if (warning) {
      ctx.save(); ctx.globalAlpha = 0.18 + Math.sin(time * 7.2) * 0.06;
      ctx.fillStyle = '#ffe38e';
      ctx.beginPath(); ctx.ellipse(sx, hazard.y - 11, rx + 28, ry + 20, 0, 0, TAU); ctx.fill();
      ctx.restore();
    }
    ctx.save(); ctx.translate(sx, hazard.y);
    ctx.fillStyle = 'rgba(36,91,146,0.34)';
    ctx.beginPath(); ctx.ellipse(0, 5, rx + 25, ry + 14, 0, 0, TAU); ctx.fill();
    for (let i = 0; i < 5; i++) {
      const p = (i + 1) / 5;
      ctx.save(); ctx.rotate(time * (0.55 + i * 0.06) + i * 1.25);
      ctx.strokeStyle = i % 2 ? '#b5f1e5' : '#7bd2d7';
      ctx.globalAlpha = 0.8 - i * 0.09;
      ctx.lineWidth = 7 - i * 0.75; ctx.lineCap = 'round';
      ctx.beginPath(); ctx.ellipse(0, 0, rx * (1 - p * 0.13), ry * (1 - p * 0.15), 0, 0.2, 4.8); ctx.stroke();
      ctx.restore();
    }
    // 카립디스도 심술보다 장난스러운 표정으로 보인다.
    ctx.fillStyle = '#244d79';
    ctx.beginPath(); ctx.arc(-18, -13, 4, 0, TAU); ctx.arc(19, -13, 4, 0, TAU); ctx.fill();
    ctx.strokeStyle = '#244d79'; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.arc(0, -3, 12, 0.18 * Math.PI, 0.82 * Math.PI); ctx.stroke();
    ctx.restore();
  }

  A.drawHazard = function (ctx, hazard, sx, time, assistScale) {
    if (hazard.type === 'arm') drawArm(ctx, hazard, sx, time, assistScale === undefined ? 1 : assistScale);
    else drawWhirlpool(ctx, hazard, sx, time, assistScale === undefined ? 1 : assistScale);
  };

  A.drawStar = function (ctx, star, sx, time) {
    const x = star.drawX === undefined ? sx : star.drawX;
    const y = star.drawY === undefined ? star.y : star.drawY;
    const pulse = 1 + Math.sin(time * 5 + star.phase) * 0.12;
    ctx.save(); ctx.translate(x, y); ctx.scale(pulse, pulse); ctx.rotate(time * 0.35 + star.phase * 0.08);
    const glow = ctx.createRadialGradient(0, 0, 2, 0, 0, 30);
    glow.addColorStop(0, 'rgba(255,246,152,0.8)'); glow.addColorStop(1, 'rgba(255,246,152,0)');
    ctx.fillStyle = glow; ctx.fillRect(-34, -34, 68, 68);
    ctx.fillStyle = '#ffe274'; ctx.strokeStyle = '#7f5a72'; ctx.lineWidth = 2.5;
    ctx.beginPath();
    for (let i = 0; i < 10; i++) {
      const r = i % 2 ? 7 : 15;
      const a = -Math.PI * 0.5 + i * Math.PI / 5;
      ctx.lineTo(Math.cos(a) * r, Math.sin(a) * r);
    }
    ctx.closePath(); ctx.fill(); ctx.stroke(); ctx.restore();
  };

  A.drawShip = function (ctx, ship, time, glow) {
    const bob = Math.sin(time * 4.1) * 2.2;
    ctx.save(); ctx.translate(ship.x, ship.y + bob); ctx.rotate(ship.tilt || 0);
    ctx.scale(ship.sq ? ship.sq.sx : 1, ship.sq ? ship.sq.sy : 1);
    if (ship.invin > 0 && Math.floor(ship.invin * 13) % 2) ctx.globalAlpha = 0.48;
    if (glow) {
      const g = ctx.createRadialGradient(0, 0, 8, 0, 0, 76);
      g.addColorStop(0, 'rgba(255,238,125,0.32)'); g.addColorStop(1, 'rgba(255,238,125,0)');
      ctx.fillStyle = g; ctx.fillRect(-80, -80, 160, 160);
    }
    // 선체
    ctx.fillStyle = '#7b4c69'; ctx.strokeStyle = INK; ctx.lineWidth = 4; ctx.lineJoin = 'round';
    ctx.beginPath(); ctx.moveTo(-55, 11); ctx.quadraticCurveTo(-31, 41, 32, 36);
    ctx.quadraticCurveTo(51, 32, 59, 8); ctx.lineTo(-55, 8); ctx.closePath(); ctx.fill(); ctx.stroke();
    ctx.fillStyle = '#e9a272'; rounded(ctx, -45, 7, 87, 13, 6); ctx.fill();
    // 돛대와 푸른 돛
    ctx.strokeStyle = '#584158'; ctx.lineWidth = 5;
    ctx.beginPath(); ctx.moveTo(-2, 10); ctx.lineTo(-2, -57); ctx.stroke();
    ctx.fillStyle = '#f2df9b'; ctx.strokeStyle = INK; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.moveTo(1, -51); ctx.quadraticCurveTo(40, -38, 44, -2);
    ctx.quadraticCurveTo(21, -12, 1, -7); ctx.closePath(); ctx.fill(); ctx.stroke();
    ctx.fillStyle = '#7fcfd1'; ctx.beginPath(); ctx.arc(20, -25, 7, 0, TAU); ctx.fill();
    // 오디세우스 — 숨 쉬며 통통 움직이는 둥근 실루엣
    const breathe = Math.sin(time * 2.2) * 1.5;
    ctx.fillStyle = '#f4bc83'; ctx.strokeStyle = INK; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.arc(-24, -6 - breathe, 10, 0, TAU); ctx.fill(); ctx.stroke();
    ctx.fillStyle = '#6b4c78'; rounded(ctx, -35, 1 - breathe, 23, 21 + breathe, 8); ctx.fill(); ctx.stroke();
    ctx.fillStyle = INK; ctx.beginPath(); ctx.arc(-27, -7 - breathe, 1.8, 0, TAU); ctx.fill();
    ctx.restore();
  };

  A.drawSilentGuide = function (ctx, view, ship) {
    if ((view.dist || 0) > 2920) return;
    const alpha = Math.max(0.12, 0.72 - (view.dist || 0) / 4700);
    const bounce = Math.sin((view.time || 0) * 4) * 7;
    ctx.save(); ctx.globalAlpha = alpha; ctx.fillStyle = '#fff3a1'; ctx.strokeStyle = '#5a496d'; ctx.lineWidth = 3;
    const x = ship.x + 104;
    for (const s of [-1, 1]) {
      const y = ship.y + s * (67 + bounce * s);
      ctx.beginPath();
      ctx.moveTo(x, y + s * 15); ctx.lineTo(x - 14, y - s * 3); ctx.lineTo(x + 14, y - s * 3); ctx.closePath();
      ctx.fill(); ctx.stroke();
    }
    ctx.restore();
  };

  A.drawForeground = function (ctx, view) {
    const d = view.dist || 0;
    // 화면 가장자리의 가까운 바위가 좁은 해협을 감싼다.
    ctx.save();
    ctx.fillStyle = '#625473'; ctx.strokeStyle = '#44374f'; ctx.lineWidth = 5;
    for (let side = 0; side < 2; side++) {
      const y = side ? 500 : 0;
      ctx.save(); ctx.translate(0, y); if (side) ctx.scale(1, -1);
      ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(960, 0); ctx.lineTo(960, 38);
      for (let x = 960; x >= 0; x -= 80) {
        const depth = 23 + ((Math.floor((x + d * 0.44) / 80) * 17) % 25);
        ctx.lineTo(x, 38 + depth);
      }
      ctx.lineTo(0, 0); ctx.closePath(); ctx.fill(); ctx.stroke(); ctx.restore();
    }
    ctx.restore();
  };

  function storySea(ctx, time) {
    const sky = ctx.createLinearGradient(0, 0, 0, 540);
    sky.addColorStop(0, '#c5bce4'); sky.addColorStop(0.52, '#ffd7bc'); sky.addColorStop(1, '#59aec5');
    ctx.fillStyle = sky; ctx.fillRect(0, 0, 960, 540);
    for (let i = 0; i < 5; i++) cloud(ctx, 110 + i * 205, 74 + (i % 2) * 33, 0.72, '#fff2e9', 0.65);
    waveBand(ctx, 315, '#67bdd0', 10, time * 0.45, 540);
    waveBand(ctx, 395, '#438faf', 15, time * 0.72, 540);
  }

  function storyBoat(ctx, x, y, time, scale) {
    A.drawShip(ctx, {
      x, y, tilt: Math.sin(time * 1.4) * 0.035, invin: 0,
      sq: { sx: scale, sy: scale }
    }, time, true);
  }

  A.drawStory = function (ctx, scene, time) {
    time = Number(time) || 0;
    ctx.save();
    rounded(ctx, 78, 76, 804, 260, 22); ctx.clip();
    ctx.translate(78, 76);
    ctx.scale(804 / 960, 260 / 540);
    storySea(ctx, time);

    if (scene === 'narrowStrait') {
      // 두 절벽 사이의 작지만 따뜻한 배.
      ctx.fillStyle = '#73657e'; ctx.strokeStyle = '#4d405a'; ctx.lineWidth = 7;
      ctx.beginPath(); ctx.moveTo(0, 70); ctx.lineTo(255, 55); ctx.quadraticCurveTo(329, 210, 275, 540); ctx.lineTo(0, 540); ctx.closePath(); ctx.fill(); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(960, 52); ctx.lineTo(724, 72); ctx.quadraticCurveTo(654, 218, 710, 540); ctx.lineTo(960, 540); ctx.closePath(); ctx.fill(); ctx.stroke();
      ctx.fillStyle = '#9ba874';
      for (let i = 0; i < 9; i++) { ctx.beginPath(); ctx.arc(64 + (i * 83) % 830, 87 + (i % 2) * 25, 17, 0, TAU); ctx.fill(); }
      storyBoat(ctx, 480, 346, time, 1.12);
      ctx.fillStyle = 'rgba(255,242,153,0.58)';
      ctx.beginPath(); ctx.ellipse(480, 340, 126, 45, 0, 0, TAU); ctx.fill();
    } else if (scene === 'scyllaPeek') {
      ctx.fillStyle = '#6e5d7d'; ctx.strokeStyle = '#493b56'; ctx.lineWidth = 7;
      ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(410, 0); ctx.quadraticCurveTo(360, 155, 403, 335); ctx.quadraticCurveTo(319, 350, 275, 540); ctx.lineTo(0, 540); ctx.closePath(); ctx.fill(); ctx.stroke();
      ctx.save(); ctx.translate(355, 154); drawScyllaFace(ctx, time, false); ctx.restore();
      // 여러 팔은 멀리서 손을 흔드는 꽃처럼 보인다.
      for (let i = 0; i < 3; i++) {
        ctx.strokeStyle = i % 2 ? '#cf9bd7' : '#b987cb'; ctx.lineWidth = 25; ctx.lineCap = 'round';
        ctx.beginPath(); ctx.moveTo(348, 174); ctx.quadraticCurveTo(440 + i * 35, 202 + i * 30, 442 + i * 50, 270 + i * 10); ctx.stroke();
        ctx.fillStyle = '#ffe18d'; ctx.beginPath(); ctx.arc(442 + i * 50, 270 + i * 10, 11, 0, TAU); ctx.fill();
      }
      storyBoat(ctx, 650, 365, time, 1.02);
    } else {
      // whirlpoolChoice — 아래의 카립디스와 위의 밝은 지혜 길.
      ctx.fillStyle = '#776985'; ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(960, 0); ctx.lineTo(960, 118); ctx.quadraticCurveTo(510, 76, 0, 134); ctx.closePath(); ctx.fill();
      const fake = { x: 0, y: 420, rx: 150, ry: 92, pull: 0 };
      drawWhirlpool(ctx, fake, 565, time, 1);
      ctx.strokeStyle = 'rgba(255,240,139,0.76)'; ctx.lineWidth = 11; ctx.lineCap = 'round'; ctx.setLineDash([18, 20]);
      ctx.beginPath(); ctx.moveTo(160, 245); ctx.quadraticCurveTo(420, 175, 760, 230); ctx.stroke(); ctx.setLineDash([]);
      storyBoat(ctx, 290, 250, time, 1.05);
      ctx.save(); ctx.translate(815, 120); ctx.fillStyle = '#f4e8ff'; ctx.beginPath(); ctx.arc(0, 0, 54, 0, TAU); ctx.fill();
      ctx.strokeStyle = '#b28bd0'; ctx.lineWidth = 4; ctx.stroke();
      ctx.fillStyle = '#ffe17b'; ctx.font = '900 46px sans-serif'; ctx.textAlign = 'center'; ctx.fillText('★', 0, 17); ctx.restore();
    }

    // 그림책 종이결과 둥근 테두리.
    ctx.save(); ctx.globalAlpha = 0.055; ctx.fillStyle = '#513c61';
    for (let i = 0; i < 180; i++) ctx.fillRect((i * 67) % 960, (i * 113) % 540, 1 + i % 2, 1);
    ctx.restore();
    ctx.strokeStyle = 'rgba(255,248,226,0.78)'; ctx.lineWidth = 13;
    rounded(ctx, 9, 9, 942, 522, 27); ctx.stroke();
    ctx.restore();
  };

  A.drawCardArt = function (ctx, x, y, time) {
    A.drawShip(ctx, {
      x: x - 34, y: y + 18, tilt: Math.sin((time || 0) * 1.7) * 0.025,
      invin: 0, sq: { sx: 0.72, sy: 0.72 }
    }, time || 0, true);
    drawWhirlpool(ctx, { y: y + 28, rx: 47, ry: 31, pull: 0 }, x + 62, time || 0, 1);
  };

  ODY.Art.scylla = A;
})();

</script>
  <script>
/* src/stages/scylla.js */
// 스테이지 6 — 스킬라와 카립디스
// 안전한 해협 → 팔과 소용돌이 소개 → 교차 응용 → 휴식 → 짧은 절정
(function () {
  'use strict';

  window.ODY = window.ODY || {};
  ODY.Stages = ODY.Stages || {};

  ODY.Stages.scylla = function (options) {
    options = options || {};
    const E = ODY.E;
    const F = ODY.Feel;
    const S = ODY.Snd;
    const UI = ODY.UI;
    const Art = ODY.Art.scylla;
    const W = E.W, H = E.H;
    const level = ODY.Levels.scylla.build();
    const ship = new ODY.ShipController({
      x: 238, y: 276, top: level.top, bottom: level.bottom,
      maxSpeed: 270, accel: 20, brake: 18, turnAccel: 24, pressImpulse: 46
    });

    let simTime = 0;
    let uiTime = 0;
    let state = 'intro';
    let stateTime = 0;
    let stateBeforePause = 'run';
    let pauseInputLock = 0;
    let distance = 0;
    let speed = 0;
    let hearts = 5;
    let rescues = 0;
    let checkpointIndex = 0;
    let assist = 1;
    let assistTarget = 1;
    let hitSlow = 1;
    let failureStreak = 0;
    let stars = 0;
    let starGlow = 0;
    let hintText = '';
    let hintTime = 0;
    let clearBurst = false;
    let finishSent = false;
    let restHeartGiven = false;
    let musicBand = -1;
    let sprayClock = 0;
    const warned = new Set();

    const mute = UI.makeMuteBtn();
    const resumeButton = new UI.Button({
      x: W * 0.5, y: 365, w: 250, h: 66,
      label: '계속 항해', size: 27, color: '#80d8b2', onTap: resumeFromPause
    });
    const rescueButton = new UI.Button({
      x: W * 0.5, y: 412, w: 264, h: 68,
      label: '다시 가자', size: 28, color: '#7fcbe8', onTap: resumeFromRescue
    });

    function callSfx(name, fallback) {
      const args = Array.prototype.slice.call(arguments, 2);
      if (typeof S[name] === 'function') S[name].apply(S, args);
      else if (fallback && typeof S[fallback] === 'function') S[fallback].apply(S, args);
    }

    const pauseButton = {
      x: W - 106, y: 40, r: 25, sq: F.makeSquash(),
      pointer(type, x, y) {
        if (type !== 'down') return false;
        if ((x - this.x) ** 2 + (y - this.y) ** 2 > (this.r + 10) ** 2) return false;
        F.squash(this.sq, 0.86, 0.86);
        if (state === 'paused') resumeFromPause(); else pauseGame();
        S.click();
        return true;
      },
      update(dt) { F.updSquash(this.sq, dt); },
      draw(ctx) {
        ctx.save(); ctx.translate(this.x, this.y); ctx.scale(this.sq.sx, this.sq.sy);
        ctx.fillStyle = 'rgba(43,36,75,0.6)'; ctx.beginPath(); ctx.arc(0, 0, this.r, 0, Math.PI * 2); ctx.fill();
        ctx.strokeStyle = 'rgba(255,255,255,0.5)'; ctx.lineWidth = 2; ctx.stroke();
        ctx.fillStyle = '#fff6df'; ctx.fillRect(-8, -10, 5, 20); ctx.fillRect(3, -10, 5, 20);
        ctx.restore();
      }
    };

    function makeSteerButton(action, x, y, label) {
      return {
        action, x, y, label, r: 49, pointerId: null, down: false,
        contains(px, py) { return (px - this.x) ** 2 + (py - this.y) ** 2 <= (this.r + 10) ** 2; },
        pointer(type, px, py, id) {
          if (type === 'down' && this.pointerId === null && this.contains(px, py)) {
            this.pointerId = id;
            this.down = true;
            E.input.setHeld(this.action, true);
            return true;
          }
          if (this.pointerId !== id) return false;
          if (type === 'move') return true;
          if (type === 'up' || type === 'cancel') {
            this.release();
            return true;
          }
          return false;
        },
        release() {
          if (this.down) E.input.setHeld(this.action, false);
          this.pointerId = null; this.down = false;
        },
        draw(ctx) {
          const pulse = this.down ? 0.9 : 1 + Math.sin(uiTime * 3.2 + this.y) * 0.018;
          ctx.save(); ctx.translate(this.x, this.y); ctx.scale(pulse, pulse);
          ctx.fillStyle = 'rgba(42,35,77,0.3)'; ctx.beginPath(); ctx.arc(0, 6, this.r + 3, 0, Math.PI * 2); ctx.fill();
          const g = ctx.createRadialGradient(-13, -15, 4, 0, 0, this.r);
          g.addColorStop(0, '#f2f5ca'); g.addColorStop(0.42, '#9be0d1'); g.addColorStop(1, '#62acc2');
          ctx.fillStyle = g; ctx.beginPath(); ctx.arc(0, 0, this.r, 0, Math.PI * 2); ctx.fill();
          ctx.strokeStyle = '#413653'; ctx.lineWidth = 4; ctx.stroke();
          ctx.fillStyle = '#342442'; ctx.font = '900 32px "Malgun Gothic", sans-serif';
          ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText(this.label, 0, -2);
          ctx.restore(); ctx.textBaseline = 'alphabetic';
        }
      };
    }

    const upButton = makeSteerButton('jump', W - 78, H - 159, '↑');
    const downButton = makeSteerButton('down', W - 78, H - 55, '↓');

    function releaseSteering() {
      upButton.release(); downButton.release();
    }

    function targetSpeed() {
      const ramp = F.ease.inOutSine(F.clamp01(distance / level.total));
      return (232 + ramp * 42) * assist * hitSlow;
    }

    function updateMusic(force) {
      let intensity = 0.28;
      if (distance >= 3000 && distance < 6200) intensity = 0.4;
      else if (distance >= 6200 && distance < 8450) intensity = 0.52;
      else if (distance >= 9650) intensity = 0.66;
      if (distance >= 8450 && distance < 9650) intensity = 0.27;
      const band = Math.round(intensity * 100);
      if (force || band !== musicBand) {
        musicBand = band;
        S.setMusicIntensity(intensity, 0.82);
      }
    }

    function effectiveArmReach(hazard) {
      return Math.max(170, hazard.reach - (1 - assist) * 150);
    }

    function effectiveWhirlpool(hazard) {
      return {
        rx: Math.max(65, hazard.rx - (1 - assist) * 105),
        ry: Math.max(48, hazard.ry - (1 - assist) * 80),
        pull: hazard.pull * assist
      };
    }

    function shipPopY() {
      return F.clamp(ship.y - 77, 128, H - 87);
    }

    function showHint(text) {
      hintText = text; hintTime = 4.4;
      S.athena(); F.sparkle(W * 0.5 - 205, 95, '#ded0ff', 13);
    }

    function registerFailure() {
      failureStreak++;
      if (failureStreak >= 3 && assistTarget > 0.82) {
        assistTarget = 0.82;
        showHint('노란 빛을 보고, 반대쪽으로 가자!');
        UI.announce('아테나가 물살을 잔잔하게 했어요. 노란 빛 반대쪽으로 가요.');
      }
    }

    function hit(hazard, pushDirection) {
      if (state !== 'run' || ship.invin > 0 || hazard.hit) return;
      hazard.hit = true;
      hearts--;
      hitSlow = 0.68;
      ship.hurt(pushDirection * 145);
      registerFailure();
      F.doHitstop(0.075);
      F.addShake(0.34, -0.7, pushDirection * 0.4);
      F.flash('#f6b9c6', 0.14);
      F.debris(ship.x + 25, ship.y + 8, '#b8edf0', 12, -1);
      F.ring(ship.x, ship.y, '#fff1a1', 22, 0.28);
      F.pop(ship.x + 6, shipPopY(), '괜찮아!', '#fff1a1', 23);
      callSfx('straitHit', 'splash');

      if (hearts <= 0) {
        releaseSteering();
        state = 'rescue'; stateTime = 0;
        F.pulseSlowmo(0.26, 0.13, 0.28);
        S.setMusicState('rescue');
        S.athena();
        UI.announce('아테나가 배를 안전한 물길로 옮겼어요. 다시 가자 버튼을 눌러요.');
      }
    }

    function resetObjects(checkpoint) {
      for (const hazard of level.hazards) {
        if (hazard.x >= checkpoint - 180) {
          hazard.hit = false; hazard.passed = false;
          warned.delete(hazard.x);
        }
      }
      for (const star of level.stars) {
        if (star.x >= checkpoint - 150) {
          star.got = false;
          delete star.magnet; delete star.drawX; delete star.drawY;
        }
      }
    }

    function resumeFromRescue() {
      if (state !== 'rescue') return;
      rescues++;
      if (rescues >= 3) {
        assistTarget = Math.min(assistTarget, 0.78);
        showHint('천천히 가도 좋아. 빛나는 빈 길만 보자!');
      }
      hearts = 5;
      const checkpoint = level.checkpoints[checkpointIndex];
      distance = Math.max(0, checkpoint - 130);
      speed = 115; hitSlow = 1;
      resetObjects(checkpoint);
      ship.reset(276); ship.invin = 2;
      releaseSteering();
      state = 'return'; stateTime = 0;
      S.setMusicState('play'); updateMusic(true);
      UI.announce('하트 다섯 개로 잔잔한 곳에서 다시 출발해요.');
    }

    function pauseGame() {
      if (state === 'paused' || state === 'rescue' || state === 'clear') return;
      stateBeforePause = state; state = 'paused'; pauseInputLock = 0.2;
      releaseSteering();
      E.input.consume('jump'); E.input.consume('down'); E.input.consume('ok');
      S.pause(); UI.announce('잠깐 쉬어요. P, Esc, 스페이스바로 계속해요.');
    }

    function resumeFromPause() {
      if (state !== 'paused') return;
      state = stateBeforePause; E.input.clearAll(); S.resume();
      UI.announce('해협 항해를 계속해요.');
    }

    function triggerClear() {
      if (state === 'clear') return;
      state = 'clear'; stateTime = 0; clearBurst = false;
      releaseSteering();
      S.startBgm('rewardScylla', { intensity: 0.38, fade: 0.46 });
      callSfx('straitClear', 'clear');
      F.pulseSlowmo(0.28, 0.22, 0.5);
      F.flash('#fff0a2', 0.24); F.addShake(0.25, 0.35, -0.7);
    }

    function collectStar(star) {
      if (star.got) return;
      star.got = true; stars++; starGlow = 0.8;
      const x = star.drawX === undefined ? star.x - distance : star.drawX;
      const y = star.drawY === undefined ? star.y : star.drawY;
      F.sparkle(x, y, '#ffe47d', 14); F.ring(x, y, '#fff5ad', 13, 0.3);
      F.pop(ship.x + 8, shipPopY(), '지혜의 빛!', '#fff2a0', 19);
      callSfx('straitStar', 'pickup', Math.min(3, stars % 4));
    }

    function updateStars(dt) {
      for (const star of level.stars) {
        if (star.got) continue;
        const sx = star.x - distance;
        if (sx < -90 || sx > W + 100) continue;
        const dx = sx - ship.x;
        const dy = star.y - ship.y;
        if (!star.magnet && dx * dx + dy * dy < 55 * 55) {
          star.magnet = true; star.drawX = sx; star.drawY = star.y;
        }
        if (star.magnet) {
          star.drawX -= speed * dt;
          star.drawX = F.damp(star.drawX, ship.x, 16, dt);
          star.drawY = F.damp(star.drawY, ship.y, 16, dt);
          if ((star.drawX - ship.x) ** 2 + (star.drawY - ship.y) ** 2 < 21 * 21) collectStar(star);
        } else if (dx * dx + dy * dy < 23 * 23) {
          star.drawX = sx; star.drawY = star.y; collectStar(star);
        }
      }
    }

    function applyWhirlpoolPull(dt) {
      for (const hazard of level.hazards) {
        if (hazard.type !== 'whirlpool' || hazard.hit) continue;
        const sx = hazard.x - distance;
        const whirl = effectiveWhirlpool(hazard);
        const rangeX = whirl.rx * 2.2;
        if (Math.abs(sx - ship.x) > rangeX || ship.y < 225) continue;
        const nearness = 1 - Math.abs(sx - ship.x) / rangeX;
        const vertical = F.clamp01((ship.y - 215) / 205);
        const pull = whirl.pull * nearness * vertical;
        // 저프레임에도 한 번에 크게 순간이동하지 않도록 이동량을 제한한다.
        const shift = Math.min(4.4, pull * dt);
        ship.y = Math.min(ship.bottom, ship.y + shift);
        ship.vy = Math.min(ship.maxSpeed, ship.vy + pull * dt * 2.1);
      }
    }

    function rectEllipseCollision(bounds, cx, cy, rx, ry) {
      const px = F.clamp(cx, bounds.left, bounds.right);
      const py = F.clamp(cy, bounds.top, bounds.bottom);
      const dx = (px - cx) / rx;
      const dy = (py - cy) / ry;
      return dx * dx + dy * dy < 0.72;
    }

    function updateHazards(previousDistance) {
      for (const hazard of level.hazards) {
        const sx = hazard.x - distance;
        const previousSx = hazard.x - previousDistance;
        if (sx < -170 || sx > W + 190) continue;

        if (!warned.has(hazard.x) && sx < W - 35 && sx > ship.x + 270) {
          warned.add(hazard.x);
          if (hazard.type === 'arm') callSfx('scyllaWarn', 'warning', 1);
          else callSfx('whirlpoolWarn', 'storm');
          F.ring(sx, hazard.type === 'arm' ? 145 : 397, '#ffe58a', 24, 0.42);
        }

        // 가로 이동과 배의 세로 이동을 함께 쪼개 검사해 낮은 FPS에서도 통과하지 않는다.
        const travel = Math.abs(sx - previousSx) + Math.abs(ship.y - ship.prevY);
        const samples = Math.min(12, Math.max(3, Math.ceil(travel / 16)));
        let collided = false;
        let push = hazard.type === 'arm' ? 1 : -1;
        for (let i = 0; i <= samples && !collided; i++) {
          const k = i / samples;
          const sampleX = previousSx + (sx - previousSx) * k;
          const sampleY = ship.prevY + (ship.y - ship.prevY) * k;
          const bounds = {
            left: ship.x - 42, right: ship.x + 44,
            top: sampleY - 38, bottom: sampleY + 21
          };
          if (hazard.type === 'arm') {
            const half = hazard.w * 0.5 + 7;
            collided = bounds.right > sampleX - half && bounds.left < sampleX + half &&
              bounds.top < effectiveArmReach(hazard) + 17;
          } else {
            const whirl = effectiveWhirlpool(hazard);
            collided = rectEllipseCollision(bounds, sampleX, hazard.y, whirl.rx, whirl.ry);
          }
        }
        if (collided) hit(hazard, push);

        if (!hazard.passed && sx < ship.x - Math.max(hazard.w || 0, hazard.rx || 0) - 36) {
          hazard.passed = true;
          if (!hazard.hit) {
            failureStreak = 0;
            F.pop(ship.x + 10, shipPopY(), '지혜롭게 통과!', '#fff1a0', 18);
            callSfx('straitNear', 'nearMiss');
          }
        }
      }
    }

    function updateCheckpoint() {
      const next = checkpointIndex + 1;
      if (next < level.checkpoints.length && distance >= level.checkpoints[next]) {
        checkpointIndex = next;
        hearts = Math.min(5, hearts + 1);
        F.sparkle(ship.x, ship.y, '#c6f3df', 14);
        F.pop(ship.x + 8, shipPopY(), '안전한 물길!', '#c8f5df', 20);
        S.athena();
      }
      if (!restHeartGiven && distance >= level.restZones[0].from) {
        restHeartGiven = true; hearts = Math.min(5, hearts + 1);
      }
    }

    function updateWorld(dt) {
      assist = F.damp(assist, assistTarget, 1.8, dt);
      hitSlow = F.damp(hitSlow, 1, 4.2, dt);
      speed = F.damp(speed, targetSpeed(), 2.8, dt);
      const previousDistance = distance;
      distance += speed * dt;
      ship.update(dt, true);
      applyWhirlpoolPull(dt);
      updateStars(dt);
      updateHazards(previousDistance);
      updateCheckpoint(); updateMusic(false);
      if (distance >= level.total) triggerClear();
    }

    ship.onTurn = function (direction, reversed) {
      S.steer(direction);
      F.squash(ship.sq, reversed ? 1.08 : 0.95, reversed ? 0.93 : 1.08);
      for (let i = 0; i < (reversed ? 5 : 3); i++) {
        F.spawn({
          x: ship.x - 50, y: ship.y + 16 + (Math.random() - 0.5) * 12,
          vx: -115 - Math.random() * 90, vy: -direction * (35 + Math.random() * 65),
          g: 100, drag: 1.4, life: 0.34 + Math.random() * 0.18,
          size: 4 + Math.random() * 4, endSize: 0.2,
          color: 'rgba(218,252,246,0.76)', shape: 'circle', layer: -1
        });
      }
    };

    ship.onSpray = function (strength) {
      sprayClock += 0.1;
      if (sprayClock < 0.12) return;
      sprayClock = 0;
      F.spawn({
        x: ship.x - 56, y: ship.y + 19,
        vx: -115 - speed * 0.34, vy: -24 - Math.random() * 43,
        g: 112, drag: 1.2, life: 0.31 + Math.random() * 0.15,
        size: 4 + strength * 4, endSize: 0.2,
        color: 'rgba(225,253,248,0.76)', shape: 'circle', layer: -1
      });
    };

    function togglePauseKey() {
      if (!E.input.buffered('pause', 0.16)) return;
      E.input.consume('pause');
      if (state === 'paused') resumeFromPause(); else pauseGame();
    }

    function update(dt, dtReal) {
      dtReal = F.clamp(Number.isFinite(dtReal) ? dtReal : dt, 0, 0.08);
      dt = F.clamp(Number.isFinite(dt) ? dt : 0, 0, 0.05);
      uiTime += dtReal;
      pauseInputLock = Math.max(0, pauseInputLock - dtReal);
      mute.update(dtReal); pauseButton.update(dtReal);
      const muteChanged = UI.handleMuteKey(mute);
      if (muteChanged && state === 'paused') S.pause();
      togglePauseKey();

      if (state === 'paused') {
        resumeButton.update(dtReal);
        if (pauseInputLock <= 0 && (E.input.buffered('jump', 0.16) || E.input.buffered('ok', 0.16))) {
          E.input.consume('jump'); E.input.consume('ok'); resumeButton.activate();
        }
        return;
      }
      if (state === 'rescue') {
        stateTime += dtReal; rescueButton.update(dtReal);
        if (stateTime > 0.55 && (E.input.buffered('jump', 0.16) || E.input.buffered('ok', 0.16))) {
          E.input.consume('jump'); E.input.consume('ok'); rescueButton.activate();
        }
        return;
      }

      simTime += dt; stateTime += dt;
      hintTime = Math.max(0, hintTime - dt);
      starGlow = Math.max(0, starGlow - dt);

      if (state === 'intro') {
        const begin = F.ease.inOutSine(F.clamp01((stateTime - 0.58) / 1.05));
        speed = F.damp(speed, 216 * begin, 3.2, dt);
        if (stateTime > 0.9) distance += speed * dt;
        ship.update(dt, stateTime > 1.0);
        if (stateTime > 2.1) { state = 'run'; stateTime = 0; }
      } else if (state === 'return') {
        speed = F.damp(speed, targetSpeed(), 2.4, dt);
        distance += speed * dt;
        ship.update(dt, stateTime > 0.55);
        if (stateTime > 1.05) { state = 'run'; stateTime = 0; }
      } else if (state === 'run') {
        updateWorld(dt);
      } else if (state === 'clear') {
        speed = F.damp(speed, 98, 2.7, dt);
        distance += speed * dt * 0.34;
        ship.update(dt, false);
        if (!clearBurst && stateTime > 0.34) {
          clearBurst = true;
          F.confetti(ship.x + 25, ship.y - 35, 64);
          F.sparkle(ship.x + 92, ship.y - 3, '#ffe878', 24);
        }
        if (stateTime > 1.82 && !finishSent) {
          finishSent = true;
          if (typeof options.onClear === 'function') options.onClear({ stars });
        }
      }
    }

    function drawHUD(ctx) {
      UI.drawHearts(ctx, 39, 40, hearts, 5);
      ctx.fillStyle = 'rgba(42,35,76,0.58)'; UI.rr(ctx, 28, 69, 137, 44, 22); ctx.fill();
      ctx.fillStyle = '#ffe277'; ctx.font = '900 23px "Malgun Gothic", sans-serif'; ctx.textAlign = 'left';
      ctx.fillText('★', 45, 99);
      ctx.fillStyle = '#fff7df'; ctx.font = '900 21px "Malgun Gothic", sans-serif'; ctx.fillText('× ' + stars, 78, 99);
      UI.drawProgress(ctx, W * 0.5 - 160, 27, 320, distance / level.total);
      pauseButton.draw(ctx); mute.draw(ctx);
      if (E.isTouch && state !== 'paused' && state !== 'rescue' && state !== 'clear') { upButton.draw(ctx); downButton.draw(ctx); }
    }

    function drawIntro(ctx) {
      if (state !== 'intro') return;
      const enter = F.ease.outBack(F.clamp01((stateTime - 0.05) / 0.46));
      const leave = 1 - F.ease.inQuad(F.clamp01((stateTime - 1.4) / 0.6));
      ctx.save(); ctx.globalAlpha = leave; ctx.translate(W * 0.5, 118); ctx.scale(enter, enter);
      UI.panel(ctx, -294, -56, 588, 112, 25, '#fff8e8');
      ctx.textAlign = 'center'; ctx.fillStyle = '#a45861'; ctx.font = '900 18px "Malgun Gothic", sans-serif';
      ctx.fillText('여섯 번째 모험', 0, -16);
      ctx.fillStyle = '#342442'; ctx.font = '900 31px "Malgun Gothic", sans-serif';
      ctx.fillText('스킬라와 카립디스', 0, 26); ctx.restore();
    }

    function drawHint(ctx) {
      if (hintTime <= 0) return;
      const enter = F.ease.outBack(F.clamp01((4.4 - hintTime) / 0.42));
      const leave = F.clamp01(hintTime / 0.42);
      ctx.save(); ctx.globalAlpha = leave; ctx.translate(W * 0.5, 98); ctx.scale(enter, enter);
      UI.panel(ctx, -290, -45, 580, 90, 22, '#fff8e8');
      UI.drawOwl(ctx, -234, 0, 0.47, uiTime, true);
      ctx.fillStyle = '#342442'; ctx.font = '900 20px "Malgun Gothic", sans-serif';
      ctx.textAlign = 'left'; ctx.fillText(hintText, -184, 8); ctx.restore();
    }

    function drawRescue(ctx) {
      ctx.fillStyle = 'rgba(35,30,67,0.68)'; ctx.fillRect(0, 0, W, H);
      const pop = F.ease.outBack(F.clamp01(stateTime / 0.48));
      ctx.save(); ctx.translate(W * 0.5, 238); ctx.scale(pop, pop);
      UI.panel(ctx, -310, -130, 620, 238, 28, '#fff8e8');
      UI.drawOwl(ctx, -216, -63, 0.82, uiTime, true);
      ctx.fillStyle = '#a45861'; ctx.font = '900 22px "Malgun Gothic", sans-serif'; ctx.textAlign = 'left';
      ctx.fillText('아테나가 배를 살짝 옮겼어요.', -137, -59);
      ctx.fillStyle = '#342442'; ctx.font = '900 25px "Malgun Gothic", sans-serif';
      ctx.fillText('힘보다 지혜로 길을 찾자!', -137, -16);
      ctx.font = '700 18px "Malgun Gothic", sans-serif'; ctx.fillStyle = '#796476';
      ctx.fillText('안전한 물길에서 다시 출발해요.', -137, 24); ctx.restore();
      if (stateTime > 0.35) rescueButton.draw(ctx, true);
    }

    function drawPause(ctx) {
      ctx.fillStyle = 'rgba(35,30,67,0.65)'; ctx.fillRect(0, 0, W, H);
      UI.panel(ctx, W * 0.5 - 230, 122, 460, 264, 28, '#fff8e8');
      UI.drawOwl(ctx, W * 0.5, 217, 0.72, uiTime, true);
      ctx.fillStyle = '#342442'; ctx.textAlign = 'center'; ctx.font = '900 35px "Malgun Gothic", sans-serif';
      ctx.fillText('잠깐 쉬어요', W * 0.5, 292);
      ctx.font = '700 18px "Malgun Gothic", sans-serif'; ctx.fillStyle = '#796476';
      ctx.fillText('P 또는 Esc로 계속할 수 있어요.', W * 0.5, 326);
      resumeButton.draw(ctx, true);
    }

    function drawClear(ctx) {
      if (state !== 'clear' || stateTime < 0.25) return;
      const pop = F.ease.outBack(F.clamp01((stateTime - 0.25) / 0.5));
      ctx.save(); ctx.translate(W * 0.5, 118); ctx.scale(pop, pop); ctx.textAlign = 'center';
      ctx.font = '900 47px "Malgun Gothic", sans-serif'; ctx.lineWidth = 10; ctx.strokeStyle = '#342442'; ctx.lineJoin = 'round';
      ctx.strokeText('해협을 건넜다!', 0, 0); ctx.fillStyle = '#fff08b'; ctx.fillText('해협을 건넜다!', 0, 0);
      ctx.font = '900 22px "Malgun Gothic", sans-serif'; ctx.lineWidth = 6;
      ctx.strokeText('힘보다 지혜로 길을 골랐어요.', 0, 40); ctx.fillStyle = '#fff8dd'; ctx.fillText('힘보다 지혜로 길을 골랐어요.', 0, 40);
      ctx.restore();
    }

    function draw(ctx) {
      const view = { time: simTime, dist: distance, speed, total: level.total };
      const shake = E.shake || { x: 0, y: 0 };
      ctx.save(); ctx.translate(shake.x, shake.y);
      Art.drawBackground(ctx, view);
      F.drawParticles(ctx, -1);
      for (const hazard of level.hazards) {
        const sx = hazard.x - distance;
        if (sx > -230 && sx < W + 250) Art.drawHazard(ctx, hazard, sx, simTime, assist);
      }
      for (const star of level.stars) {
        if (star.got) continue;
        const sx = star.x - distance;
        if (sx > -90 && sx < W + 100) Art.drawStar(ctx, star, sx, simTime);
      }
      Art.drawSilentGuide(ctx, view, ship);
      Art.drawShip(ctx, ship, simTime, starGlow > 0);
      F.drawParticles(ctx, 0);
      Art.drawForeground(ctx, view);
      ctx.restore();
      drawHUD(ctx); drawIntro(ctx); drawHint(ctx); drawClear(ctx);
      if (state === 'rescue') drawRescue(ctx);
      if (state === 'paused') drawPause(ctx);
    }

    const debug = {
      get state() { return state; },
      get time() { return simTime; },
      get distance() { return distance; },
      get hearts() { return hearts; },
      get rescues() { return rescues; },
      get assist() { return assist; },
      get shipY() { return ship.y; },
      get hazards() { return level.hazards; },
      get stars() { return stars; },
      get level() { return level; },
      get speed() { return speed; }
    };

    return {
      enter() {
        S.unlock();
        S.startBgm('scylla', { intensity: 0.28, fade: 0.75 });
        updateMusic(true);
        UI.announce('스킬라와 카립디스 사이의 지혜로운 항해가 시작돼요.');
      },
      exit() {
        releaseSteering();
        if (state !== 'clear') S.stopBgm();
      },
      update,
      pointer(type, x, y, pointerId) {
        if (type === 'cancel') {
          upButton.pointer(type, x, y, pointerId);
          downButton.pointer(type, x, y, pointerId);
          return;
        }
        if (mute.pointer(type, x, y)) { if (state === 'paused') S.pause(); return; }
        if (pauseButton.pointer(type, x, y)) return;
        if (state === 'rescue') { rescueButton.pointer(type, x, y, pointerId); return; }
        if (state === 'paused') { resumeButton.pointer(type, x, y, pointerId); return; }
        if (E.isTouch) {
          if (upButton.pointer(type, x, y, pointerId)) return;
          downButton.pointer(type, x, y, pointerId);
        }
      },
      draw,
      debug
    };
  };
})();

    { kind: 'restArch', x: 2400, y: 740, phase: 5.2 },
    { kind: 'sunBanner', x: 2650, y: 540, phase: 5.7 },
    { kind: 'sunAltar', x: 3020, y: 280, phase: 6.6 }
  ];

  // 황금 소. 다치게 하지 않고 피해 다니는 "움직이는 벽"이다.
  const HAZARDS = [
    {
      id: 'practice-cow', kind: 'cowLoop', zone: 'practice', minStageTime: 10,
      radius: 30, speed: 74, phase: 0.15,
      path: [{ x: 1280, y: 560 }, { x: 1430, y: 740 }, { x: 1280, y: 900 }, { x: 1080, y: 740 }]
    },
    {
      id: 'cow-lane-upper', kind: 'cowLane', zone: 'apply', minStageTime: 10,
      radius: 32, phase: 0, from: { x: 1600, y: 540 }, to: { x: 2330, y: 540 },
      telegraph: 0.95, active: 4.7, rest: 1.6, speed: 132
    },
    {
      id: 'cow-lane-lower', kind: 'cowLane', zone: 'apply', minStageTime: 10,
      radius: 32, phase: 2.4, from: { x: 2330, y: 950 }, to: { x: 1600, y: 950 },
      telegraph: 0.95, active: 4.7, rest: 1.6, speed: 132
    },
    {
      id: 'golden-herd', kind: 'herdRing', zone: 'climax', minStageTime: 10,
      x: 2940, y: 730, radius: 30, phase: 0,
      order: ['north', 'east', 'south', 'west'], telegraph: 1.2,
      active: 3.95, rest: 1.7, speed: 116, count: 3
    }
  ];

  function build() {
    // clone()을 거쳐 build 호출마다 path/rest를 포함한 완전히 새 객체를 돌려준다.
    return clone({
      worldW: WORLD_W,

      tutorial: {
        safeSeconds: 10,

        gateId: 'pen-gate', firstCrewIds: [1, 2],
        gateRequiresHome: 2, gateMinTime: 9.5,
        hazardsEnabledAfter: 10
      },
      gates: GATES,
      walls: WALLS,
      camps: CAMPS,
      crumbs: CRUMBS,
      decor: DECOR,
      hazards: HAZARDS,
      checkpoints: [
        { id: 'start', home: 0, x: 330, y: 780 },
        { id: 'pen-gate', home: 2, x: 1000, y: 760 },
        { id: 'rest-camp', home: 4, x: 2480, y: 740, heal: 1 }
      ],
      restZones: [
        { id: 'rest-camp', x: 2370, y: 470, w: 450, h: 560, fromHome: 4, hazards: false }
      ],
      crew: CREW
    });
  }

  ODY.Levels.helios = { build, WORLD_W, WORLD_H };
})();
