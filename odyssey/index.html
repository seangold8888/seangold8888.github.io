  // 1·2장은 jump/down을 그대로 쓰고, 탑다운 장은 up/down/action을 읽는다.
  const MAP = {
    Space: ['jump', 'action'],
    ArrowUp: ['jump', 'up'], KeyW: ['jump', 'up'],
    ArrowDown: ['down'], KeyS: ['down'],
    ArrowLeft: ['left'], KeyA: ['left'],
    ArrowRight: ['right'], KeyD: ['right'],
    Enter: ['ok'], NumpadEnter: ['ok'],
    KeyM: ['mute'],
    KeyP: ['pause'], Escape: ['pause']
  };

  function pressAction(action) {
    lastPress[action] = E.time;
  }

  function releaseAction(action) {
    lastRelease[action] = E.time;
  }

  function clearHeld() {
    Object.keys(held).forEach(k => { held[k] = false; });
    Object.keys(virtualHeld).forEach(k => { virtualHeld[k] = false; });
  }

  E.input = {
    held: action => !!held[action] || !!virtualHeld[action],
    press: pressAction,
    release: releaseAction,
    setHeld(action, value) {
      if (value && !virtualHeld[action]) pressAction(action);
      if (!value && virtualHeld[action]) releaseAction(action);
      virtualHeld[action] = !!value;
    },
    buffered(action, windowSeconds) {
      return lastPress[action] !== undefined && E.time - lastPress[action] <= windowSeconds;
    },
    released(action, windowSeconds) {
      return lastRelease[action] !== undefined && E.time - lastRelease[action] <= windowSeconds;
    },
    consume(action) { delete lastPress[action]; },
    consumeRelease(action) { delete lastRelease[action]; },
    clearBuffered() {
      Object.keys(lastPress).forEach(k => delete lastPress[k]);
      Object.keys(lastRelease).forEach(k => delete lastRelease[k]);
    },
    clearVirtual() {
      Object.keys(virtualHeld).forEach(k => {
        if (virtualHeld[k]) releaseAction(k);
        virtualHeld[k] = false;
      });
    },
    clearAll() {
      clearHeld();
      this.clearBuffered();
    }
  };

  function toLogical(e) {
    const r = canvas.getBoundingClientRect();
    return {
      x: (e.clientX - r.left - offX) / scale,
      y: (e.clientY - r.top - offY) / scale
    };
  }

  E.setScene = function (nextScene) {
    if (E.scene && E.scene.exit) E.scene.exit();
    E.input.clearAll();
    if (window.ODY.Feel && ODY.Feel.onSceneChange) ODY.Feel.onSceneChange();
    E.scene = nextScene;
    if (nextScene && nextScene.enter) nextScene.enter();
  };

  E.init = function (targetCanvas) {
    canvas = targetCanvas;
    ctx = canvas.getContext('2d', { alpha: false, desynchronized: true });
    E.canvas = canvas;
    E.ctx = ctx;
    resize();
    portraitQuery = window.matchMedia(
      '(orientation: portrait) and (pointer: coarse), (orientation: portrait) and (max-width: 760px)'
    );
    syncViewportBlock();
    if (portraitQuery.addEventListener) portraitQuery.addEventListener('change', syncViewportBlock);
    else if (portraitQuery.addListener) portraitQuery.addListener(syncViewportBlock);
    window.addEventListener('resize', resize, { passive: true });

    window.addEventListener('keydown', e => {
      const actions = MAP[e.code];
      if (!actions) return;
      e.preventDefault();
      if (E.viewportBlocked) return;
      ODY.Snd.unlock();
      actions.forEach(action => {
        if (!held[action]) pressAction(action);
        held[action] = true;
      });
    }, { passive: false });

    window.addEventListener('keyup', e => {
      const actions = MAP[e.code];
      if (!actions) return;
      e.preventDefault();
      actions.forEach(action => {
        if (held[action]) releaseAction(action);
        held[action] = false;
      });
    }, { passive: false });

    // 아이패드 사파리: 핀치 제스처와 더블탭 확대가 게임을 벗어나게 하지 않도록
    // 아이패드 확대 잠금.
    // iOS 사파리는 iOS 10 부터 user-scalable=no 를 무시한다. 게임 중에 손가락이
    // 스치거나 두 번 두드리면 화면이 확대되고, 전체화면 캔버스라 되돌릴 방법이 없다.
    // dblclick 은 터치 더블탭에서는 뜨지 않으므로 터치 경로도 함께 막는다.
    ['gesturestart', 'gesturechange', 'gestureend'].forEach(ev => {
      document.addEventListener(ev, e => e.preventDefault(), { passive: false });
    });
    document.addEventListener('touchmove', e => {
      if (e.touches && e.touches.length > 1) e.preventDefault();
    }, { passive: false });
    let lastTouchEnd = 0;
    document.addEventListener('touchend', e => {
      const now = Date.now();
      if (now - lastTouchEnd < 320) e.preventDefault();
      lastTouchEnd = now;
    }, { passive: false });
    document.addEventListener('dblclick', e => e.preventDefault(), { passive: false });

    window.addEventListener('blur', () => {
      E.focusBlocked = true;
      E.input.clearAll();
      const pausedNow = !!(ODY.Snd.pause && ODY.Snd.pause());
      resumeAudioAfterFocus = resumeAudioAfterFocus || resumeAudioAfterHidden ||
        resumeAudioAfterViewport || pausedNow;
    });
    window.addEventListener('focus', () => {
      E.focusBlocked = false;
      E.input.clearAll();
      if (!document.hidden && !E.viewportBlocked &&
          (resumeAudioAfterFocus || resumeAudioAfterHidden || resumeAudioAfterViewport) && ODY.Snd.resume) {
        ODY.Snd.resume();
        resumeAudioAfterFocus = false;
        resumeAudioAfterHidden = false;
        resumeAudioAfterViewport = false;
      }
    });
    document.addEventListener('visibilitychange', () => {
      E.input.clearAll();
      if (document.hidden) {
        const pausedNow = !!(ODY.Snd.pause && ODY.Snd.pause());
        resumeAudioAfterHidden = resumeAudioAfterHidden || resumeAudioAfterFocus ||
          resumeAudioAfterViewport || pausedNow;
      } else if (E.viewportBlocked) {
        resumeAudioAfterViewport = resumeAudioAfterViewport || resumeAudioAfterHidden;
        resumeAudioAfterHidden = false;
      } else if (!E.focusBlocked &&
          (resumeAudioAfterHidden || resumeAudioAfterViewport || resumeAudioAfterFocus) && ODY.Snd.resume) {
        ODY.Snd.resume();
        resumeAudioAfterHidden = false;
        resumeAudioAfterViewport = false;
        resumeAudioAfterFocus = false;
      }
    });

    canvas.addEventListener('pointerdown', e => {
      e.preventDefault();
      if (E.viewportBlocked) return;
      ODY.Snd.unlock();
      try { canvas.setPointerCapture(e.pointerId); } catch (_) {}
      const p = toLogical(e);
      if (E.scene && E.scene.pointer) E.scene.pointer('down', p.x, p.y, e.pointerId);
    }, { passive: false });

    canvas.addEventListener('pointerup', e => {
      e.preventDefault();
      if (E.viewportBlocked) return;
      const p = toLogical(e);
      if (E.scene && E.scene.pointer) E.scene.pointer('up', p.x, p.y, e.pointerId);
      try { canvas.releasePointerCapture(e.pointerId); } catch (_) {}
    }, { passive: false });

    canvas.addEventListener('pointercancel', e => {
      const p = toLogical(e);
      if (E.scene && E.scene.pointer) E.scene.pointer('cancel', p.x, p.y, e.pointerId);
    });

    canvas.addEventListener('lostpointercapture', e => {
      if (E.scene && E.scene.pointer) E.scene.pointer('cancel', NaN, NaN, e.pointerId);
    });

    canvas.addEventListener('pointermove', e => {
      if (E.viewportBlocked) return;
      const p = toLogical(e);
      if (E.scene && E.scene.pointer) E.scene.pointer('move', p.x, p.y, e.pointerId);
    }, { passive: true });

    requestAnimationFrame(frame);
  };

  let lastTime = 0;
  let fpsSmooth = 60;

  function frame(nowMs) {
    requestAnimationFrame(frame);
    const rawDt = Math.min(0.04, (nowMs - lastTime) / 1000 || 0);
    lastTime = nowMs;
    const dtReal = (E.viewportBlocked || E.focusBlocked || document.hidden) ? 0 : rawDt;
    E.time += dtReal;
    E.frame++;
    // resize·matchMedia 이벤트를 모두 놓치는 환경까지 대비한 최후 안전망.
    // 변화가 없으면 syncViewportBlock이 즉시 반환하므로 비용은 무시할 수준이다.
    if (E.frame % 20 === 0) syncViewportBlock();
    if (rawDt > 0) {
      fpsSmooth += ((1 / rawDt) - fpsSmooth) * Math.min(1, rawDt * 2.5);
      E.fps = fpsSmooth;
    }

    const F = ODY.Feel;
    let dt = dtReal * F.timescale;
    let frozen = false;
    if (F.hitstop > 0) {
      F.hitstop = Math.max(0, F.hitstop - dtReal);
      dt = 0;
      frozen = true;
    }

    if (E.scene && E.scene.update) E.scene.update(dt, dtReal);
    F.update(frozen ? 0 : dt, dtReal);

    // 레터박스는 게임 팔레트와 이어지는 짙은 남색이다.
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.fillStyle = '#151126';
    ctx.fillRect(0, 0, canvas.width / dpr, canvas.height / dpr);

    const shake = F.shakeOffset();
    E.shake = shake;
    ctx.setTransform(
      scale * dpr, 0, 0, scale * dpr,
      offX * dpr,
      offY * dpr
    );
    ctx.imageSmoothingEnabled = true;
    ctx.save();
    ctx.beginPath();
    ctx.rect(-16, -16, W + 32, H + 32);
    ctx.clip();
    if (E.scene && E.scene.draw) E.scene.draw(ctx);
    F.drawFlash(ctx, W, H);
    ctx.restore();
  }

  ODY.E = E;
})();

</script>
  <script>
/* src/ui.js */
// 오디세이아 — 큰 글씨, 큰 버튼, 그림책처럼 따뜻한 공용 화면
(function () {
  'use strict';
  window.ODY = window.ODY || {};
  const UI = {};
  const TAU = Math.PI * 2;
  const INK = '#342442';
  const PAPER = '#fff8e8';
  const GOLD = '#f4bd4f';
  let announceFlip = false;

  UI.announce = function (text) {
    if (typeof document === 'undefined') return;
    const live = document.getElementById('game-status');
    if (!live) return;
    announceFlip = !announceFlip;
    live.textContent = String(text || '') + (announceFlip ? '\u200b' : '');
  };

  UI.rr = function (ctx, x, y, w, h, r) {
    r = Math.min(r, w * 0.5, h * 0.5);
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  };

  UI.panel = function (ctx, x, y, w, h, r, color) {
    ctx.save();
    ctx.fillStyle = 'rgba(31,20,49,0.23)';
    UI.rr(ctx, x + 5, y + 8, w, h, r);
    ctx.fill();
    ctx.fillStyle = color || PAPER;
    UI.rr(ctx, x, y, w, h, r);
    ctx.fill();
    ctx.strokeStyle = 'rgba(89,58,86,0.26)';
    ctx.lineWidth = 2;
    UI.rr(ctx, x + 2, y + 2, w - 4, h - 4, Math.max(2, r - 2));
    ctx.stroke();
    ctx.restore();
  };

  UI.drawGreekBand = function (ctx, x, y, w, color, alpha) {
    ctx.save();
    ctx.globalAlpha = alpha === undefined ? 0.45 : alpha;
    ctx.strokeStyle = color || GOLD;
    ctx.lineWidth = 3;
    ctx.lineJoin = 'miter';
    const size = 18;
    for (let px = x; px < x + w; px += size * 2) {
      ctx.beginPath();
      ctx.moveTo(px, y);
      ctx.lineTo(px + size, y);
      ctx.lineTo(px + size, y + size * 0.55);
      ctx.lineTo(px + size * 0.45, y + size * 0.55);
      ctx.lineTo(px + size * 0.45, y + size * 0.2);
      ctx.lineTo(px + size * 0.8, y + size * 0.2);
      ctx.stroke();
    }
    ctx.restore();
  };

  // ---- 큰 버튼 ------------------------------------------------------------
  UI.Button = class {
    constructor(options) {
      Object.assign(this, {
        x: 0, y: 0, w: 240, h: 70,
        label: '', size: 27, color: '#ffad61',
        ink: INK, onTap: null
      }, options);
      this.sq = ODY.Feel.makeSquash();
      this.pressed = false;
      this.hovered = false;
      this.glow = 0;
    }

    contains(x, y) {
      return x >= this.x - this.w * 0.5 && x <= this.x + this.w * 0.5 &&
        y >= this.y - this.h * 0.5 && y <= this.y + this.h * 0.5;
    }

    activate() {
      ODY.Feel.squash(this.sq, 1.13, 1.1);
      ODY.Feel.ring(this.x, this.y, '#fff2b1', 18, 0.26);
      ODY.Snd.click();
      if (this.onTap) this.onTap();
    }

    pointer(type, x, y) {
      if (type === 'move') {
        this.hovered = this.contains(x, y);
        return false;
      }
      if (type === 'down' && this.contains(x, y)) {
        this.pressed = true;
        ODY.Feel.squash(this.sq, 0.94, 0.89);
        return true;
      }
      if ((type === 'up' || type === 'cancel') && this.pressed) {
        const inside = this.contains(x, y);
        this.pressed = false;
        if (inside && type === 'up') {
          this.activate();
          return true;
        }
      }
      return false;
    }

    update(dt) {
      ODY.Feel.updSquash(this.sq, dt);
      this.glow = ODY.Feel.damp(this.glow, this.hovered ? 1 : 0, 12, dt);
    }

    draw(ctx, focus) {
      const pulse = 1 + Math.sin(ODY.E.time * 3.2) * 0.012 * (focus ? 1 : 0);
      ctx.save();
      ctx.translate(this.x, this.y);
      ctx.scale(this.sq.sx * pulse, this.sq.sy * pulse);

      if (focus || this.glow > 0.02) {
        ctx.globalAlpha = 0.3 + this.glow * 0.2;
        ctx.fillStyle = '#fff2ac';
        UI.rr(ctx, -this.w * 0.5 - 8, -this.h * 0.5 - 8, this.w + 16, this.h + 16, this.h * 0.5);
        ctx.fill();
        ctx.globalAlpha = 1;
      }

      ctx.fillStyle = 'rgba(39,25,55,0.32)';
      UI.rr(ctx, -this.w * 0.5, -this.h * 0.5 + 8, this.w, this.h, this.h * 0.43);
      ctx.fill();

      const grad = ctx.createLinearGradient(0, -this.h * 0.5, 0, this.h * 0.5);
      grad.addColorStop(0, '#fff0ad');
      grad.addColorStop(0.12, this.color);
      grad.addColorStop(1, this.color);
      ctx.fillStyle = grad;
      UI.rr(ctx, -this.w * 0.5, -this.h * 0.5, this.w, this.h, this.h * 0.43);
      ctx.fill();
      ctx.strokeStyle = INK;
      ctx.lineWidth = 3.5;
      UI.rr(ctx, -this.w * 0.5, -this.h * 0.5, this.w, this.h, this.h * 0.43);
      ctx.stroke();

      ctx.globalAlpha = 0.38;
      ctx.fillStyle = '#fff';
      UI.rr(ctx, -this.w * 0.5 + 12, -this.h * 0.5 + 8, this.w - 24, 12, 7);
      ctx.fill();
      ctx.globalAlpha = 1;

      ctx.fillStyle = this.ink;
      ctx.font = '900 ' + this.size + 'px "Malgun Gothic", sans-serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText(this.label, 0, 1);
      ctx.restore();
      ctx.textBaseline = 'alphabetic';
    }
  };

  // ---- 공용 아이콘 --------------------------------------------------------
  UI.drawStar = function (ctx, x, y, r, rotation, color) {
    ctx.save();
    ctx.translate(x, y);
    ctx.rotate(rotation || 0);
    ctx.beginPath();
    for (let i = 0; i < 10; i++) {
      const rr = i % 2 ? r * 0.46 : r;
      const a = -Math.PI * 0.5 + i * Math.PI / 5;
      if (i === 0) ctx.moveTo(Math.cos(a) * rr, Math.sin(a) * rr);
      else ctx.lineTo(Math.cos(a) * rr, Math.sin(a) * rr);
    }
    ctx.closePath();
    ctx.fillStyle = color || '#ffd85c';
    ctx.fill();
    ctx.strokeStyle = '#8d5b35';
    ctx.lineWidth = Math.max(1.5, r * 0.09);
    ctx.stroke();
    ctx.globalAlpha = 0.72;
    ctx.fillStyle = '#fff7bd';
    ctx.beginPath();
    ctx.arc(-r * 0.22, -r * 0.27, r * 0.13, 0, TAU);
    ctx.fill();
    ctx.restore();
  };

  UI.drawHeart = function (ctx, x, y, size, filled) {
    ctx.save();
    ctx.translate(x, y);
    ctx.beginPath();
    ctx.moveTo(0, size * 0.45);
    ctx.bezierCurveTo(-size * 1.08, -size * 0.25, -size * 0.58, -size, 0, -size * 0.38);
    ctx.bezierCurveTo(size * 0.58, -size, size * 1.08, -size * 0.25, 0, size * 0.45);
    ctx.closePath();
    ctx.fillStyle = filled ? '#ff718d' : 'rgba(255,255,255,0.17)';
    ctx.fill();
    ctx.strokeStyle = filled ? '#7b385d' : 'rgba(255,255,255,0.55)';
    ctx.lineWidth = 2.2;
    ctx.stroke();
    if (filled) {
      ctx.fillStyle = 'rgba(255,255,255,0.65)';
      ctx.beginPath();
      ctx.arc(-size * 0.34, -size * 0.32, size * 0.16, 0, TAU);
      ctx.fill();
    }
    ctx.restore();
  };

  UI.drawHearts = function (ctx, x, y, current, max) {
    ctx.save();
    ctx.fillStyle = 'rgba(28,18,49,0.56)';
    UI.rr(ctx, x - 22, y - 25, max * 35 + 28, 47, 23);
    ctx.fill();
    for (let i = 0; i < max; i++) {
      UI.drawHeart(ctx, x + i * 35, y, 13.5, i < current);
    }
    ctx.restore();
  };

  UI.drawProgress = function (ctx, x, y, width, value) {
    value = ODY.Feel.clamp01(value);
    ctx.save();
    ctx.fillStyle = 'rgba(28,18,49,0.58)';
    UI.rr(ctx, x - 10, y - 10, width + 20, 30, 15);
    ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,0.18)';
    UI.rr(ctx, x, y, width, 10, 5);
    ctx.fill();
    if (value > 0.01) {
      const grad = ctx.createLinearGradient(x, y, x + width, y);
      grad.addColorStop(0, '#77d9be');
      grad.addColorStop(1, '#ffd85c');
      ctx.fillStyle = grad;
      UI.rr(ctx, x, y, Math.max(10, width * value), 10, 5);
      ctx.fill();
    }
    UI.drawStar(ctx, x + width * value, y + 5, 9, ODY.E.time * 1.7, '#fff0a0');
    // 이타카의 작은 집
    ctx.translate(x + width + 13, y + 3);
    ctx.fillStyle = '#fff3c9';
    ctx.beginPath();
    ctx.moveTo(-8, 1); ctx.lineTo(0, -8); ctx.lineTo(8, 1); ctx.closePath();
    ctx.fill();
    ctx.fillRect(-6, 1, 12, 9);
    ctx.restore();
  };

  UI.makeMuteBtn = function () {
    const button = {
      x: ODY.E.W - 42, y: 40, r: 27,
      sq: ODY.Feel.makeSquash(),
      pressed: false,
      toggle() {
        const muted = ODY.Snd.toggleMute();
        ODY.Feel.squash(this.sq, 1.16, 1.16);
        UI.announce(muted ? '소리를 껐어요.' : '소리를 켰어요.');
      },
      pointer(type, x, y) {
        const inside = (x - this.x) ** 2 + (y - this.y) ** 2 <= (this.r + 10) ** 2;
        if (type === 'down' && inside) {
          this.pressed = true;
          ODY.Feel.squash(this.sq, 0.88, 0.88);
          this.toggle();
          return true;
        }
        if (type === 'up' || type === 'cancel') this.pressed = false;
        return false;
      },
      update(dt) { ODY.Feel.updSquash(this.sq, dt); },
      draw(ctx) {
        ctx.save();
        ctx.translate(this.x, this.y);
        ctx.scale(this.sq.sx, this.sq.sy);
        ctx.fillStyle = 'rgba(28,18,49,0.64)';
        ctx.beginPath();
        ctx.arc(0, 0, this.r, 0, TAU);
        ctx.fill();
        ctx.strokeStyle = 'rgba(255,255,255,0.42)';
        ctx.lineWidth = 2;
        ctx.stroke();
        ctx.fillStyle = '#fff6dc';
        ctx.beginPath();
        ctx.moveTo(-12, -6); ctx.lineTo(-5, -6); ctx.lineTo(4, -14);
        ctx.lineTo(4, 14); ctx.lineTo(-5, 6); ctx.lineTo(-12, 6);
        ctx.closePath();
        ctx.fill();
        ctx.strokeStyle = '#fff6dc';
        ctx.lineWidth = 3;
        ctx.lineCap = 'round';
        if (ODY.Snd.muted()) {
          ctx.beginPath(); ctx.moveTo(9, -8); ctx.lineTo(20, 8); ctx.stroke();
          ctx.beginPath(); ctx.moveTo(20, -8); ctx.lineTo(9, 8); ctx.stroke();
        } else {
          ctx.beginPath(); ctx.arc(5, 0, 9, -0.8, 0.8); ctx.stroke();
          ctx.beginPath(); ctx.arc(5, 0, 15, -0.7, 0.7); ctx.stroke();
        }
        ctx.restore();
      }
    };
    return button;
  };

  UI.handleMuteKey = function (muteButton) {
    if (ODY.E.input.buffered('mute', 0.16)) {
      ODY.E.input.consume('mute');
      muteButton.toggle();
      return true;
    }
    return false;
  };

  // ---- 그림책용 캐릭터 조각 ----------------------------------------------
  UI.drawOwl = function (ctx, x, y, scale, time, lookRight) {
    ctx.save();
    ctx.translate(x, y);
    ctx.scale((lookRight === false ? -1 : 1) * scale, scale);
    const flap = Math.sin((time || 0) * 7) * 0.18;
    ctx.fillStyle = '#b8c9ee';
    ctx.strokeStyle = INK;
    ctx.lineWidth = 3;
    ctx.save();
    ctx.rotate(-0.42 + flap);
    ctx.beginPath(); ctx.ellipse(-25, 2, 27, 12, -0.3, 0, TAU); ctx.fill(); ctx.stroke();
    ctx.restore();
    ctx.save();
    ctx.rotate(0.42 - flap);
    ctx.beginPath(); ctx.ellipse(25, 2, 27, 12, 0.3, 0, TAU); ctx.fill(); ctx.stroke();
    ctx.restore();
    const body = ctx.createLinearGradient(0, -30, 0, 28);
    body.addColorStop(0, '#f8f1de');
    body.addColorStop(1, '#d8c7ef');
    ctx.fillStyle = body;
    ctx.beginPath(); ctx.ellipse(0, 0, 27, 32, 0, 0, TAU); ctx.fill(); ctx.stroke();
    ctx.fillStyle = '#6e78ae';
    ctx.beginPath();
    ctx.moveTo(-20, -23); ctx.lineTo(-8, -38); ctx.lineTo(-3, -22);
    ctx.moveTo(20, -23); ctx.lineTo(8, -38); ctx.lineTo(3, -22);
    ctx.fill();
    ctx.fillStyle = '#fff';
    ctx.beginPath(); ctx.arc(-9, -7, 10, 0, TAU); ctx.arc(9, -7, 10, 0, TAU); ctx.fill();
    ctx.fillStyle = INK;
    ctx.beginPath(); ctx.arc(-7, -6, 4, 0, TAU); ctx.arc(11, -6, 4, 0, TAU); ctx.fill();
    ctx.fillStyle = GOLD;
    ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(7, 7); ctx.lineTo(-2, 8); ctx.closePath(); ctx.fill();
    ctx.fillStyle = '#fff0be';
    ctx.beginPath(); ctx.ellipse(0, 13, 15, 13, 0, 0, TAU); ctx.fill();
    ctx.restore();
  };

  UI.drawShip = function (ctx, x, y, scale, time) {
    ctx.save();
    ctx.translate(x, y);
    ctx.scale(scale, scale);
    ctx.rotate(Math.sin((time || 0) * 1.8) * 0.025);
    // 물결과 뱃머리 물보라
    ctx.strokeStyle = 'rgba(255,255,255,0.68)';
    ctx.lineWidth = 4;
    ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(-96, 25); ctx.quadraticCurveTo(-46, 15, 2, 25);
    ctx.moveTo(30, 26); ctx.quadraticCurveTo(80, 15, 116, 25);
    ctx.stroke();
    // 선체
    const hull = ctx.createLinearGradient(0, 2, 0, 42);
    hull.addColorStop(0, '#c57a43');
    hull.addColorStop(1, '#76462f');
    ctx.fillStyle = hull;
    ctx.strokeStyle = INK;
    ctx.lineWidth = 4;
    ctx.beginPath();
    ctx.moveTo(-95, 0); ctx.quadraticCurveTo(-65, 39, -12, 42);
    ctx.quadraticCurveTo(55, 43, 96, -1);
    ctx.quadraticCurveTo(48, 11, -95, 0);
    ctx.closePath();
    ctx.fill(); ctx.stroke();
    // 방패
    for (let i = -2; i <= 2; i++) {
      ctx.fillStyle = i % 2 ? '#7cc9c1' : '#f4bd4f';
      ctx.beginPath(); ctx.arc(i * 28, 14, 10, 0, TAU); ctx.fill();
      ctx.strokeStyle = INK; ctx.lineWidth = 2; ctx.stroke();
      ctx.beginPath(); ctx.arc(i * 28, 14, 3, 0, TAU); ctx.stroke();
    }
    // 돛대와 돛
    ctx.fillStyle = '#64422f';
    ctx.fillRect(-2.5, -105, 5, 108);
    ctx.fillStyle = '#fff5d8';
    ctx.strokeStyle = INK;
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.moveTo(3, -99);
    ctx.quadraticCurveTo(83, -72, 8, -18);
    ctx.closePath();
    ctx.fill(); ctx.stroke();
    ctx.fillStyle = '#e96f72';
    ctx.beginPath();
    ctx.moveTo(11, -83); ctx.quadraticCurveTo(60, -67, 12, -48);
    ctx.lineTo(9, -36); ctx.quadraticCurveTo(55, -51, 10, -65);
    ctx.closePath(); ctx.fill();
    // 깃발
    ctx.fillStyle = '#e96f72';
    ctx.beginPath();
    ctx.moveTo(-1, -104); ctx.lineTo(-38, -96 + Math.sin((time || 0) * 6) * 3);
    ctx.lineTo(-2, -84); ctx.closePath(); ctx.fill();
    ctx.strokeStyle = INK; ctx.lineWidth = 2; ctx.stroke();
    ctx.restore();
  };

  UI.drawCyclopsPortrait = function (ctx, x, y, scale, time) {
    ctx.save();
    ctx.translate(x, y);
    ctx.scale(scale, scale);
    ctx.fillStyle = '#927cb5';
    ctx.strokeStyle = INK;
    ctx.lineWidth = 4;
    ctx.beginPath(); ctx.ellipse(0, 4, 56, 65, 0, 0, TAU); ctx.fill(); ctx.stroke();
    ctx.fillStyle = '#6f5a98';
    ctx.beginPath();
    ctx.moveTo(-42, -40); ctx.quadraticCurveTo(-22, -77, 0, -55);
    ctx.quadraticCurveTo(27, -77, 44, -37);
    ctx.quadraticCurveTo(0, -56, -42, -40);
    ctx.fill(); ctx.stroke();
    ctx.fillStyle = '#fff9dc';
    ctx.beginPath(); ctx.ellipse(5, -7, 24, 19, 0, 0, TAU); ctx.fill(); ctx.stroke();
    ctx.fillStyle = '#5da9b8';
    ctx.beginPath(); ctx.arc(8, -6, 9, 0, TAU); ctx.fill();
    ctx.fillStyle = INK;
    ctx.beginPath(); ctx.arc(10, -6, 4, 0, TAU); ctx.fill();
    ctx.fillStyle = 'rgba(255,126,142,0.35)';
    ctx.beginPath(); ctx.arc(-30, 18, 9, 0, TAU); ctx.arc(36, 18, 9, 0, TAU); ctx.fill();
    ctx.strokeStyle = INK; ctx.lineWidth = 4; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.arc(6, 23, 14, 0.12 * Math.PI, 0.88 * Math.PI); ctx.stroke();
    // 졸린 숨방울
    const b = ((time || 0) * 0.7) % 1;
    ctx.globalAlpha = (1 - b) * 0.55;
    ctx.fillStyle = '#d8efff';
    ctx.beginPath(); ctx.arc(43 + b * 12, -1 - b * 20, 4 + b * 7, 0, TAU); ctx.fill();
    ctx.restore();
  };

  UI.drawWindBag = function (ctx, x, y, scale, time, open) {
    ctx.save();
    ctx.translate(x, y + Math.sin((time || 0) * 2.1) * 3);
    ctx.scale(scale, scale);
    const puff = open ? 1 + Math.sin((time || 0) * 7) * 0.08 : 1;
    ctx.scale(puff, 2 - puff);
    ctx.fillStyle = 'rgba(52,36,66,0.18)';
    ctx.beginPath(); ctx.ellipse(2, 61, 53, 12, 0, 0, TAU); ctx.fill();
    const bag = ctx.createLinearGradient(-40, -58, 44, 58);
    bag.addColorStop(0, '#ffe8b7');
    bag.addColorStop(0.55, '#e9bd7f');
    bag.addColorStop(1, '#bd7d61');
    ctx.fillStyle = bag; ctx.strokeStyle = INK; ctx.lineWidth = 4;
    ctx.beginPath();
    ctx.moveTo(-31, -47);
    ctx.quadraticCurveTo(-61, -9, -44, 42);
    ctx.quadraticCurveTo(0, 77, 47, 41);
    ctx.quadraticCurveTo(62, -8, 31, -47);
    ctx.closePath(); ctx.fill(); ctx.stroke();
    // 묶인 끈과 매듭
    ctx.strokeStyle = '#cf5f63'; ctx.lineWidth = 9; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(-31, -45); ctx.quadraticCurveTo(0, -38, 32, -45); ctx.stroke();
    ctx.fillStyle = '#e66d72'; ctx.strokeStyle = INK; ctx.lineWidth = 2.5;
    ctx.beginPath(); ctx.ellipse(-13, -54, 17, 9, -0.35, 0, TAU); ctx.fill(); ctx.stroke();
    ctx.beginPath(); ctx.ellipse(14, -54, 17, 9, 0.35, 0, TAU); ctx.fill(); ctx.stroke();
    // 바람 무늬
    ctx.strokeStyle = 'rgba(255,248,213,0.82)'; ctx.lineWidth = 5;
    ctx.beginPath(); ctx.arc(-2, 13, 21, -0.8, 1.3); ctx.stroke();
    ctx.beginPath(); ctx.arc(6, 18, 10, 1.2, 3.7); ctx.stroke();
    if (open) {
      ctx.strokeStyle = '#8ee4cf'; ctx.lineWidth = 7;
      for (let i = 0; i < 3; i++) {
        const wave = Math.sin((time || 0) * 6 + i) * 8;
        ctx.beginPath();
        ctx.moveTo(-18 + i * 18, -55);
        ctx.bezierCurveTo(-35 + i * 25 + wave, -86, 20 + i * 13 - wave, -103, 3 + i * 23, -133);
        ctx.stroke();
      }
    }
    ctx.restore();
  };

  // ---- 타이틀 -------------------------------------------------------------
  UI.TitleScene = function (onStart, onChapters) {
    let time = 0;
    let started = false;
    let launchDelay = -1;
    let focus = 0;
    const W = ODY.E.W, H = ODY.E.H;
    const start = new UI.Button({
      x: W * 0.5 - 155, y: 442, w: 282, h: 72,
      label: '모험 시작', size: 30, color: '#ffad61',
      onTap() {
        if (started) return;
        started = true;
        launchDelay = 0.72;
        start.label = '출발!';
        ODY.Snd.depart();
        ODY.Feel.flash('#fff1b0', 0.16);
        UI.announce('별빛 귀향 노래와 함께 출발해요.');
      }
    });
    // 장 고르기 — 예전에는 한 장을 끝내고 여정 지도를 거쳐야만 닿을 수 있었다.
    const chapters = new UI.Button({
      x: W * 0.5 + 155, y: 442, w: 282, h: 72,
      label: '장 고르기', size: 28, color: '#9b89c9',
      onTap() {
        if (started) return;
        started = true;
        if (onChapters) onChapters();
      }
    });
    const menu = [start, chapters];
    const mute = UI.makeMuteBtn();
    let totalStars = 0;
    try { totalStars = parseInt(localStorage.getItem('ody_total_stars') || '0', 10); } catch (_) {}

    return {
      enter() { ODY.Snd.startBgm('title', { intensity: 0.28, fade: 0.9 }); },
      exit() { ODY.Snd.stopBgm(); },
      update(dt, dtReal) {
        time += dtReal;
        menu.forEach(b => b.update(dtReal));
        mute.update(dtReal);
        UI.handleMuteKey(mute);
        if (!started) {
          if (ODY.E.input.buffered('left', 0.16)) { ODY.E.input.consume('left'); if (focus !== 0) { focus = 0; ODY.Snd.click(); } }
          if (ODY.E.input.buffered('right', 0.16)) { ODY.E.input.consume('right'); if (focus !== 1) { focus = 1; ODY.Snd.click(); } }
        }
        if (started && launchDelay >= 0) {
          launchDelay -= dtReal;
          if (launchDelay <= 0) {
            launchDelay = -1;
            onStart();
          }
        }
        if (!started && time > 0.45 &&
            (ODY.E.input.buffered('jump', 0.16) || ODY.E.input.buffered('ok', 0.16))) {
          ODY.E.input.consume('jump');
          ODY.E.input.consume('ok');
          menu[focus].activate();
        }
      },
      pointer(type, x, y) {
        if (mute.pointer(type, x, y)) return;
        if (started) return;
        menu.forEach((b, i) => {
          if (b.pointer(type, x, y) && type === 'down') focus = i;
        });
      },
      draw(ctx) {
        // 파스텔 노을
        const sky = ctx.createLinearGradient(0, 0, 0, H);
        sky.addColorStop(0, '#766db9');
        sky.addColorStop(0.46, '#f1a7aa');
        sky.addColorStop(0.73, '#ffd3a0');
        sky.addColorStop(1, '#79b9d3');
        ctx.fillStyle = sky;
        ctx.fillRect(0, 0, W, H);

        const sunGlow = ctx.createRadialGradient(655, 202, 20, 655, 202, 155);
        sunGlow.addColorStop(0, 'rgba(255,247,196,0.75)');
        sunGlow.addColorStop(1, 'rgba(255,247,196,0)');
        ctx.fillStyle = sunGlow;
        ctx.fillRect(490, 38, 330, 330);
        ctx.fillStyle = '#fff0b6';
        ctx.beginPath(); ctx.arc(655, 202, 61 + Math.sin(time * 1.2) * 2, 0, TAU); ctx.fill();

        // 먼 섬 2겹
        ctx.fillStyle = '#74699a';
        ctx.beginPath();
        ctx.moveTo(0, 324);
        for (let x = 0; x <= W; x += 55) {
          ctx.lineTo(x, 286 + Math.sin(x * 0.012 + 0.8) * 20 + Math.sin(x * 0.026) * 9);
        }
        ctx.lineTo(W, H); ctx.lineTo(0, H); ctx.closePath(); ctx.fill();
        ctx.fillStyle = '#4f6f99';
        ctx.beginPath();
        ctx.moveTo(0, 365);
        for (let x = 0; x <= W; x += 45) {
          ctx.lineTo(x, 340 + Math.sin(x * 0.017 + 2) * 15);
        }
        ctx.lineTo(W, H); ctx.lineTo(0, H); ctx.closePath(); ctx.fill();

        // 바다 3겹
        const colors = ['#62a9c9', '#4d93bb', '#3e79aa'];
        for (let layer = 0; layer < 3; layer++) {
          const base = 346 + layer * 43;
          ctx.beginPath();
          ctx.moveTo(0, H);
          for (let x = 0; x <= W + 20; x += 20) {
            ctx.lineTo(x, base + Math.sin(x * 0.018 + time * (0.7 + layer * 0.42) + layer) * (8 - layer));
          }
          ctx.lineTo(W, H); ctx.closePath();
          ctx.fillStyle = colors[layer]; ctx.fill();
        }

        // 항로의 일곱 불빛
        for (let i = 0; i < 7; i++) {
          const x = 156 + i * 104;
          const y = 330 + Math.sin(i * 1.7) * 12;
          ctx.globalAlpha = 0.35 + 0.28 * Math.sin(time * 2 + i);
          UI.drawStar(ctx, x, y, 5, time + i, '#ffe7a0');
        }
        ctx.globalAlpha = 1;

        UI.drawShip(ctx, 668 + Math.sin(time * 0.7) * 9, 338 + Math.sin(time * 1.7) * 4, 0.78, time);
        UI.drawOwl(ctx, 825, 198 + Math.sin(time * 2) * 7, 0.55, time, false);

        // 종이 띠 위 제목
        const appear = ODY.Feel.ease.outBack(ODY.Feel.clamp01(time / 0.62));
        ctx.save();
        ctx.translate(300, 178);
        ctx.scale(appear, appear);
        ctx.rotate(-0.025);
        ctx.fillStyle = 'rgba(48,31,62,0.25)';
        UI.rr(ctx, -244, -103, 492, 190, 30); ctx.fill();
        const paper = ctx.createLinearGradient(0, -90, 0, 80);
        paper.addColorStop(0, '#fff9e9');
        paper.addColorStop(1, '#f4ddbd');
        ctx.fillStyle = paper;
        UI.rr(ctx, -250, -110, 492, 190, 30); ctx.fill();
        ctx.strokeStyle = INK; ctx.lineWidth = 4;
        UI.rr(ctx, -250, -110, 492, 190, 30); ctx.stroke();
        UI.drawGreekBand(ctx, -218, -84, 430, '#d79c45', 0.55);
        ctx.textAlign = 'center';
        ctx.font = '900 66px "Malgun Gothic", sans-serif';
        ctx.lineWidth = 9; ctx.lineJoin = 'round';
        ctx.strokeStyle = '#fff6da';
        ctx.strokeText('오디세이아', 0, 8);
        ctx.fillStyle = INK;
        ctx.fillText('오디세이아', 0, 8);
        ctx.font = '900 26px "Malgun Gothic", sans-serif';
        ctx.fillStyle = '#a35751';
        ctx.fillText('집으로 가는 길', 0, 52);
        ctx.restore();

        // 짧은 약속
        ctx.textAlign = 'center';
        ctx.font = '800 20px "Malgun Gothic", sans-serif';
        ctx.fillStyle = '#fff9e6';
        ctx.globalAlpha = 0.9;
        ctx.fillText('힘보다 지혜로, 이타카까지!', W * 0.5, 398);
        ctx.globalAlpha = 1;

        menu.forEach((b, i) => b.draw(ctx, focus === i));
        if (totalStars > 0) {
          ctx.fillStyle = 'rgba(28,18,49,0.58)';
          UI.rr(ctx, 28, 26, 145, 45, 22); ctx.fill();
          UI.drawStar(ctx, 54, 48, 13, time, '#ffd85c');
          ctx.font = '900 20px "Malgun Gothic", sans-serif';
          ctx.textAlign = 'left';
          ctx.fillStyle = '#fff7dd';
          ctx.fillText('지혜의 별 ' + totalStars, 76, 56);
        }
        mute.draw(ctx);
        ODY.Feel.drawParticles(ctx);
      }
    };
  };

  // ---- 클리어와 신화 카드 -------------------------------------------------
  UI.ClearScene = function (options, onDone) {
    options = options || {};
    let time = 0;
    let burstA = false;
    let burstB = false;
    let done = false;
    const W = ODY.E.W, H = ODY.E.H;
    const clearTitle = options.title || '동굴 탈출 성공!';
    const rewardText = options.rewardText || '지혜의 별을 찾았어요!';
    const cardTitle = options.cardTitle || '신화 카드 · 키클롭스';
    const facts = options.facts || ['눈은 하나, 힘은 아주 세요.', '하지만 지혜에는 졌답니다!'];
    const button = new UI.Button({
      x: W * 0.5, y: 487, w: 235, h: 64,
      label: '다음으로', size: 27, color: '#7ed9aa',
      onTap() {
        if (done) return;
        done = true;
        onDone();
      }
    });
    const mute = UI.makeMuteBtn();

    return {
      enter() {
        // 출구에서 이미 승리 화음이 울렸다. 카드는 짧은 별 종으로 시작한다.
        ODY.Snd.startBgm(options.music || 'reward', {
          intensity: options.musicIntensity === undefined ? 0.36 : options.musicIntensity,
          fade: 0.7
        });
        ODY.Snd.pickup(3);
        ODY.Feel.flash('#fff3b5', 0.24);
        UI.announce(clearTitle + '. ' + rewardText + ' ' + cardTitle + '. ' +
          facts.join(' ') + ' ' + (options.countLabel || '이번에 모은 작은 별') + ' ' +
          options.starsGained + '개. 다음으로 버튼이 있어요.');
      },
      exit() { ODY.Snd.stopBgm(); },
      update(dt, dtReal) {
        time += dtReal;
        button.update(dtReal);
        mute.update(dtReal);
        UI.handleMuteKey(mute);
        if (!burstA && time > 0.2) {
          burstA = true;
          ODY.Feel.confetti(W * 0.28, 170, 34);
          ODY.Feel.confetti(W * 0.72, 170, 34);
        }
        if (!burstB && time > 1.05) {
          burstB = true;
          ODY.Feel.sparkle(W * 0.5, 137, '#ffe27a', 22);
        }
        if (!done && time > 1.25 &&
            (ODY.E.input.buffered('jump', 0.16) || ODY.E.input.buffered('ok', 0.16))) {
          ODY.E.input.consume('jump');
          ODY.E.input.consume('ok');
          button.activate();
        }
      },
      pointer(type, x, y) {
        if (mute.pointer(type, x, y)) return;
        if (time > 1.1) button.pointer(type, x, y);
      },
      draw(ctx) {
        const night = ctx.createLinearGradient(0, 0, 0, H);
        night.addColorStop(0, '#4d467f');
        night.addColorStop(0.62, '#272344');
        night.addColorStop(1, '#17142b');
        ctx.fillStyle = night; ctx.fillRect(0, 0, W, H);

        // 부드러운 광선
        ctx.save();
        ctx.translate(W * 0.5, 150);
        for (let i = 0; i < 18; i++) {
          ctx.rotate(TAU / 18);
          ctx.fillStyle = i % 2 ? 'rgba(255,225,122,0.055)' : 'rgba(255,255,255,0.035)';
          ctx.beginPath();
          ctx.moveTo(0, 0); ctx.lineTo(-18, -440); ctx.lineTo(18, -440); ctx.closePath(); ctx.fill();
        }
        ctx.restore();

        const titlePop = ODY.Feel.ease.outBack(ODY.Feel.clamp01((time - 0.05) / 0.48));
        ctx.save();
        ctx.translate(W * 0.5, 71);
        ctx.scale(titlePop, titlePop);
        ctx.textAlign = 'center';
        ctx.font = '900 ' + (options.titleSize || 49) + 'px "Malgun Gothic", sans-serif';
        ctx.lineWidth = 9; ctx.strokeStyle = INK; ctx.lineJoin = 'round';
        ctx.strokeText(clearTitle, 0, 0);
        ctx.fillStyle = options.accent || '#ffe47f'; ctx.fillText(clearTitle, 0, 0);
        ctx.restore();

        const starPop = ODY.Feel.ease.outElastic(ODY.Feel.clamp01((time - 0.42) / 0.78));
        if (starPop > 0) {
          UI.drawStar(ctx, W * 0.5, 145, 37 * starPop, Math.sin(time * 1.3) * 0.11, '#ffd85c');
          ctx.globalAlpha = ODY.Feel.clamp01((time - 0.88) / 0.35);
          ctx.font = '900 22px "Malgun Gothic", sans-serif';
          ctx.textAlign = 'center'; ctx.fillStyle = '#fff8de';
          ctx.fillText(rewardText, W * 0.5, 203);
          ctx.globalAlpha = 1;
        }

        // 카드가 아래에서 통통 올라온다.
        const cardT = ODY.Feel.clamp01((time - 0.92) / 0.62);
        if (cardT > 0) {
          const cy = 235 + (1 - ODY.Feel.ease.outBack(cardT)) * 230;
          UI.panel(ctx, 214, cy, 532, 188, 25, PAPER);
          UI.drawGreekBand(ctx, 240, cy + 18, 480, '#d59a49', 0.42);
          if (typeof options.drawArt === 'function') options.drawArt(ctx, 310, cy + 105, time);
          else if (options.portrait === 'windBag') UI.drawWindBag(ctx, 310, cy + 111, 0.68, time, true);
          else UI.drawCyclopsPortrait(ctx, 310, cy + 105, 0.72, time);
          ctx.textAlign = 'left';
          ctx.fillStyle = '#a45850';
          ctx.font = '900 21px "Malgun Gothic", sans-serif';
          ctx.fillText(cardTitle, 390, cy + 65);
          ctx.fillStyle = INK;
          ctx.font = '800 23px "Malgun Gothic", sans-serif';
          ctx.fillText(facts[0], 390, cy + 105);
          ctx.fillText(facts[1], 390, cy + 139);
          ctx.font = '700 17px "Malgun Gothic", sans-serif';
          ctx.fillStyle = '#796476';
          ctx.fillText((options.countLabel || '이번에 모은 작은 별') + '  ' + options.starsGained + '개', 390, cy + 169);
        }

        ODY.Feel.drawParticles(ctx);
        if (time > 1.1) button.draw(ctx, true);
        mute.draw(ctx);
      }
    };
  };

  ODY.UI = UI;
})();

</script>
  <script>
/* src/story.js */
// 오디세이아 — 이모지 대신 캔버스 그림으로 펼치는 짧은 그림책
(function () {
  'use strict';
  window.ODY = window.ODY || {};
  const TAU = Math.PI * 2;
  const INK = '#342442';

  function drawLittleHero(ctx, x, y, scale, time, running) {
    ctx.save();
    ctx.translate(x, y);
    ctx.scale(scale, scale);
    const step = running ? Math.sin(time * 10) : 0;
    const bob = running ? Math.abs(Math.sin(time * 10)) * -3 : Math.sin(time * 2) * 2;
    ctx.translate(0, bob);
    ctx.strokeStyle = INK;
    ctx.lineCap = 'round';
    // 망토
    ctx.fillStyle = '#e66d72';
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.moveTo(-9, -47);
    ctx.quadraticCurveTo(-35 - step * 3, -30, -25, -7);
    ctx.quadraticCurveTo(-12, -15, -5, -25);
    ctx.closePath(); ctx.fill(); ctx.stroke();
    // 다리
    ctx.lineWidth = 9;
    ctx.beginPath(); ctx.moveTo(-5, -15); ctx.lineTo(-7 + step * 10, 0); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(6, -15); ctx.lineTo(8 - step * 10, 0); ctx.stroke();
    ctx.strokeStyle = '#e7aa82'; ctx.lineWidth = 5;
    ctx.beginPath(); ctx.moveTo(-5, -15); ctx.lineTo(-7 + step * 10, 0); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(6, -15); ctx.lineTo(8 - step * 10, 0); ctx.stroke();
    // 몸
    const tunic = ctx.createLinearGradient(0, -49, 0, -13);
    tunic.addColorStop(0, '#79b9da'); tunic.addColorStop(1, '#477eae');
    ctx.fillStyle = tunic; ctx.strokeStyle = INK; ctx.lineWidth = 3;
    ODY.UI.rr(ctx, -16, -48, 32, 36, 10); ctx.fill(); ctx.stroke();
    ctx.fillStyle = '#f2bd4d'; ctx.fillRect(-16, -24, 32, 6);
    // 팔
    ctx.strokeStyle = INK; ctx.lineWidth = 9;
    ctx.beginPath(); ctx.moveTo(9, -40); ctx.lineTo(20 + step * 4, -29); ctx.stroke();
    ctx.strokeStyle = '#f5c59e'; ctx.lineWidth = 5;
    ctx.beginPath(); ctx.moveTo(9, -40); ctx.lineTo(20 + step * 4, -29); ctx.stroke();
    // 머리

  function drawCirceGarden(ctx, time, scene) {
    const x = 78, y = 76, w = 804, h = 260;
    const sky = ctx.createLinearGradient(0, y, 0, y + h);
    sky.addColorStop(0, scene === 'circeIsland' ? '#89a9ca' : '#9d90c9');

    ctx.fillStyle = sky; ODY.UI.rr(ctx, x, y, w, h, 22); ctx.fill();
    ctx.save(); ODY.UI.rr(ctx, x, y, w, h, 22); ctx.clip();

    ctx.fillStyle = '#7fb88a';
    ctx.beginPath(); ctx.moveTo(x, 260);
    for (let px = x; px <= x + w; px += 48) ctx.lineTo(px, 232 + Math.sin(px * 0.018) * 14);
    ctx.lineTo(x + w, y + h); ctx.lineTo(x, y + h); ctx.closePath(); ctx.fill();
    ctx.fillStyle = '#5f9771'; ctx.fillRect(x, 291, w, 65);

    // 궁전은 둥근 탑과 따뜻한 창으로 보여 무섭지 않게 한다.
    ctx.fillStyle = '#efe0c4'; ctx.strokeStyle = '#6d5870'; ctx.lineWidth = 3;
    ctx.fillRect(650, 164, 146, 132); ctx.strokeRect(650, 164, 146, 132);
    [665,716,767].forEach((tx, i) => {
      ctx.fillStyle = i === 1 ? '#d8c1a9' : '#ead5ba';

      ctx.fillStyle = '#ffe889'; ODY.UI.rr(ctx, tx + 10, 188, 12, 20, 5); ctx.fill();
    });

    // 올리브 나무와 꽃밭
    for (let i = 0; i < 5; i++) {
      const tx = 125 + i * 124;
      ctx.strokeStyle = '#6e5a48'; ctx.lineWidth = 9; ctx.beginPath(); ctx.moveTo(tx, 304); ctx.lineTo(tx + 4, 241); ctx.stroke();
      ctx.fillStyle = i % 2 ? '#6eaa77' : '#78b481';
      ctx.beginPath(); ctx.arc(tx - 17, 235, 24, 0, TAU); ctx.arc(tx + 13, 226, 29, 0, TAU); ctx.arc(tx + 31, 246, 22, 0, TAU); ctx.fill();
    }
    for (let i = 0; i < 20; i++) {
      ctx.fillStyle = i % 2 ? '#fff2a8' : '#f6b6ca';
      ctx.beginPath(); ctx.arc(105 + (i * 79) % 735, 316 + (i % 3) * 9, 3.5, 0, TAU); ctx.fill();
    }

    if (scene === 'circeIsland') {
      ctx.fillStyle = '#58a8bf'; ctx.fillRect(78, 304, 300, 52);
      ODY.UI.drawShip(ctx, 210, 307 + Math.sin(time * 2) * 2, 0.42, time);
      drawLittleHero(ctx, 430, 294, 0.62, time, true);
      drawStoryCirce(ctx, 735, 270, 0.7, time);
    } else if (scene === 'pigFriends') {

      drawStoryPig(ctx, 563, 281, 0.78, time, 2.3);
      drawStoryCirce(ctx, 742, 271, 0.72, time);
      for (let i = 0; i < 7; i++) {
        const a = time * 0.8 + i * TAU / 7;
        ctx.fillStyle = '#ead7ff'; ctx.beginPath(); ctx.arc(636 + Math.cos(a) * 34, 193 + Math.sin(a) * 22, 4, 0, TAU); ctx.fill();
      }
    } else {
      drawLittleHero(ctx, 264, 294, 0.72, time, false);
      drawMoly(ctx, 425, 235, 1.15, time);
      drawStoryPig(ctx, 590, 296, 0.72, time, 0.8);
      drawStoryPig(ctx, 710, 286, 0.68, time, 2.0);
      // 헤르메스의 날개 달린 모자
      ctx.fillStyle = '#f2c28f'; ctx.strokeStyle = INK; ctx.lineWidth = 3;
      ctx.beginPath(); ctx.arc(158, 191, 25, 0, TAU); ctx.fill(); ctx.stroke();
      ctx.fillStyle = '#f7eee0'; ctx.beginPath(); ctx.moveTo(133,181); ctx.lineTo(109,166); ctx.lineTo(125,196); ctx.closePath(); ctx.fill(); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(183,181); ctx.lineTo(207,166); ctx.lineTo(191,196); ctx.closePath(); ctx.fill(); ctx.stroke();
      ctx.fillStyle = '#69a8b7'; ctx.beginPath(); ctx.moveTo(126,292); ctx.quadraticCurveTo(158,208,190,292); ctx.closePath(); ctx.fill(); ctx.stroke();
    }

    ctx.strokeStyle = 'rgba(255,255,220,0.55)'; ctx.lineWidth = 4;
    ctx.beginPath(); ctx.moveTo(95, 329); ctx.bezierCurveTo(300, 303, 555, 348, 855, 315); ctx.stroke();
    ctx.restore();
  }

  function drawIllustration(ctx, scene, time) {
    if (scene === 'aeolus') drawAeolus(ctx, time);
    else if (scene === 'fairWind') drawFairWind(ctx, time);
    else if (scene === 'openBag') drawOpenBag(ctx, time);
    else if (scene === 'circeIsland' || scene === 'pigFriends' || scene === 'moly') drawCirceGarden(ctx, time, scene);
    else if ((scene === 'underworldGate' || scene === 'memoryStars' || scene === 'tiresias') &&
      ODY.Art && ODY.Art.underworld && ODY.Art.underworld.drawStory) ODY.Art.underworld.drawStory(ctx, scene, time);
    else if ((scene === 'sirenIsland' || scene === 'waxAndRope' || scene === 'songWave') &&
      ODY.Art && ODY.Art.sirens && ODY.Art.sirens.drawStory) ODY.Art.sirens.drawStory(ctx, scene, time);
    else if ((scene === 'narrowStrait' || scene === 'scyllaPeek' || scene === 'whirlpoolChoice') &&
      ODY.Art && ODY.Art.scylla && ODY.Art.scylla.drawStory) ODY.Art.scylla.drawStory(ctx, scene, time);
    else if ((scene === 'sunPasture' || scene === 'hungryCrew' || scene === 'campfire') &&
      ODY.Art && ODY.Art.helios && ODY.Art.helios.drawStory) ODY.Art.helios.drawStory(ctx, scene, time);
    else if (scene === 'cave') drawCave(ctx, time);
    else if (scene === 'escape') drawEscape(ctx, time);
    else drawTroy(ctx, time);
  }

  ODY.Story = {
    Cutscene(pages, onDone, options) {
      options = options || {};
      let page = 0;
      let shownChars = 0;
      let time = 0;
      let pageTime = 0;
      let turning = 0;
      let pendingPage = -1;
      let done = false;
      const CPS = 28;
      const mute = ODY.UI.makeMuteBtn();

      function length() {
        return pages[page].lines.join('').length;
      }

      function typingDone() {
        return shownChars >= length();
      }

      function announcePage() {
        const item = pages[page];
        ODY.UI.announce('그림책 ' + (page + 1) + '쪽, ' + (pages.length) + '쪽 중. ' +
          (item.chapter || '집으로 가는 길') + '. ' + item.lines.join(' ') +
          ' 스페이스바나 화면으로 다음 장이에요.');
      }

      function finish() {
        if (done) return;
        done = true;
        onDone();
      }

      function next() {
        if (done || turning > 0) return;
        if (!typingDone()) {
          shownChars = length();
          ODY.Snd.click();
          return;
        }
        if (page >= pages.length - 1) {
          ODY.Snd.page();
          finish();
          return;
        }
        pendingPage = page + 1;
        turning = 0.001;
        ODY.Snd.page();
      }

      return {
        enter() {
          ODY.Snd.unlock();
          ODY.Snd.startBgm(options.music || 'storySea', {
            intensity: options.pageIntensities ? options.pageIntensities[0] :
              (options.intensity === undefined ? 0.21 : options.intensity),
            fade: 0.8
          });
          announcePage();
        },
        exit() { ODY.Snd.stopBgm(); },
        update(dt, dtReal) {
          time += dtReal;
          pageTime += dtReal;
          mute.update(dtReal);
          ODY.UI.handleMuteKey(mute);
          if (turning > 0) {
            turning += dtReal;
            if (pendingPage >= 0 && turning >= 0.22) {
              page = pendingPage;
              pendingPage = -1;
              shownChars = 0;
              pageTime = 0;
              if (options.pageIntensities && options.pageIntensities[page] !== undefined) {
                ODY.Snd.setMusicIntensity(options.pageIntensities[page], 0.7);
              }
              announcePage();
            }
            if (turning >= 0.44) turning = 0;
          } else {
            shownChars = Math.min(length(), shownChars + CPS * dtReal);
          }

          if (ODY.E.input.buffered('jump', 0.16) || ODY.E.input.buffered('ok', 0.16)) {
            ODY.E.input.consume('jump');
            ODY.E.input.consume('ok');
            next();
          }
        },
        pointer(type, x, y) {
          if (mute.pointer(type, x, y)) return;
          if (type !== 'down') return;
          if (x > 728 && x < 912 && y > 18 && y < 67) {
            ODY.Snd.click();
            finish();
            return;
          }
          next();
        },
        draw(ctx) {
          const W = ODY.E.W, H = ODY.E.H;
          const bg = ctx.createLinearGradient(0, 0, 0, H);
          bg.addColorStop(0, '#433b70');
          bg.addColorStop(1, '#1d1933');
          ctx.fillStyle = bg; ctx.fillRect(0, 0, W, H);

          // 밤하늘의 종이별
          for (let i = 0; i < 32; i++) {
            const sx = (i * 157) % W;
            const sy = 18 + (i * 83) % 190;
            ctx.globalAlpha = 0.18 + 0.22 * Math.sin(time * 1.7 + i);
            ctx.fillStyle = '#fff2c6';
            ctx.beginPath(); ctx.arc(sx, sy, 1.4 + (i % 3) * 0.55, 0, TAU); ctx.fill();
          }
          ctx.globalAlpha = 1;

          // 책장
          const open = ODY.Feel.ease.outBack(ODY.Feel.clamp01(time / 0.48));
          const turnScale = turning > 0 ? Math.max(0.08, Math.abs(Math.cos(turning / 0.44 * Math.PI))) : 1;
          ctx.save();
          ctx.translate(W * 0.5, H * 0.5 + 8);
          ctx.scale(open * turnScale, open);
          ctx.translate(-W * 0.5, -(H * 0.5 + 8));
          ODY.UI.panel(ctx, 50, 54, 860, 446, 28, '#fff8e8');
          ctx.fillStyle = 'rgba(203,154,91,0.12)';
          ctx.fillRect(477, 66, 6, 420);
          ODY.UI.drawGreekBand(ctx, 82, 68, 794, '#d39a4c', 0.44);

          drawIllustration(ctx, pages[page].scene, pageTime);

          // 삽화 아래 캡션
          ctx.textAlign = 'center';
          ctx.fillStyle = '#9e554e';
          ctx.font = '900 18px "Malgun Gothic", sans-serif';
          ctx.fillText(pages[page].chapter || '집으로 가는 길', W * 0.5, 367);

          ctx.fillStyle = INK;
          ctx.font = '800 25px "Malgun Gothic", sans-serif';
          let remain = Math.floor(shownChars);
          pages[page].lines.forEach((line, index) => {
            const visible = line.slice(0, Math.max(0, remain));
            remain -= line.length;
            ctx.fillText(visible, W * 0.5, 404 + index * 34);
          });

          // 페이지 점과 넘김 표시
          for (let i = 0; i < pages.length; i++) {
            ctx.beginPath();
            ctx.arc(W * 0.5 + (i - (pages.length - 1) * 0.5) * 24, 480, i === page ? 6.5 : 4, 0, TAU);
            ctx.fillStyle = i === page ? '#cc765a' : '#d9c7a5';
            ctx.fill();
          }
          if (typingDone() && turning === 0) {
            ctx.globalAlpha = 0.58 + Math.sin(time * 5) * 0.25;
            ctx.fillStyle = '#9e554e';
            ctx.font = '900 19px "Malgun Gothic", sans-serif';
            ctx.textAlign = 'right';
            ctx.fillText(page === pages.length - 1 ? '모험 시작  ›' : '다음 장  ›', 872, 479);
            ctx.globalAlpha = 1;
          }
          ctx.restore();

          // 충분히 큰 건너뛰기 버튼
          ctx.fillStyle = 'rgba(26,19,45,0.58)';
          ODY.UI.rr(ctx, 728, 18, 184, 49, 24); ctx.fill();
          ctx.strokeStyle = 'rgba(255,255,255,0.35)'; ctx.lineWidth = 2;
          ODY.UI.rr(ctx, 728, 18, 184, 49, 24); ctx.stroke();
          ctx.fillStyle = '#fff7df';
          ctx.font = '800 17px "Malgun Gothic", sans-serif';
          ctx.textAlign = 'center';
          ctx.fillText('이야기 건너뛰기', 820, 49);
          mute.draw(ctx);
        }
      };
    }
  };
})();

// 키클롭스 동굴 — 무작위가 아닌 수제 리듬 코스
(function () {
  'use strict';
  window.ODY = window.ODY || {};
  ODY.Levels = ODY.Levels || {};

  const GROUND = 430;
  const TOTAL = 13000;
  const checkpoints = [0, 5200, 9600];

  function starArc(list, center, options) {
    const o = Object.assign({ count: 5, span: 260, height: 112, base: 52 }, options);
    for (let i = 0; i < o.count; i++) {
      const k = o.count === 1 ? 0.5 : i / (o.count - 1);
      list.push({
        x: center + (k - 0.5) * o.span,
        y: GROUND - o.base - Math.sin(k * Math.PI) * o.height,
        got: false,
        phase: i * 0.7
      });
    }
  }

  function starLine(list, start, count, gap, y) {
    for (let i = 0; i < count; i++) {
      list.push({
        x: start + i * (gap || 58),
        y: y || GROUND - 55,
        got: false,
        phase: i * 0.8
      });
    }
  }

  function build() {
    const hazards = [
      // 소개 뒤 첫 연습: 한 번에 하나씩, 넉넉한 간격
      { x: 3300, type: 'small', w: 28, h: 38, group: '첫 바위' },
      { x: 4080, type: 'small', w: 30, h: 43, group: '첫 바위' },
      { x: 4820, type: 'tall',  w: 34, h: 62, group: '큰 바위' },

      // 낙하 바위를 본 뒤 응용
      { x: 7140, type: 'wide',  w: 43, h: 44, group: '낙하 바위' },
      { x: 7880, type: 'small', w: 28, h: 40, group: '두 바위' },
      { x: 8175, type: 'small', w: 28, h: 43, group: '두 바위' },
      { x: 8840, type: 'tall',  w: 34, h: 65, group: '큰 바위' },

      // 휴식 뒤 절정: 이미 배운 리듬만 짧게 연결
      { x: 10440, type: 'small', w: 29, h: 42, group: '마지막 길' },
      { x: 11010, type: 'wide', w: 46, h: 46, group: '마지막 길' },
      { x: 11720, type: 'small', w: 29, h: 42, group: '마지막 길' },
      { x: 12030, type: 'tall', w: 34, h: 61, group: '마지막 길' }
    ];

    const drops = [
      // 첫 낙하는 앞에서 시범만 보이고 곧 부서진다.
      { x: 6100, demo: true, trigger: 1180, warn: 1.85, fall: 0.52, state: 'waiting', age: 0 },
      { x: 7420, demo: false, trigger: 1050, warn: 1.55, fall: 0.5, state: 'waiting', age: 0 },
      { x: 9160, demo: false, trigger: 1020, warn: 1.5, fall: 0.48, state: 'waiting', age: 0 },
      { x: 11340, demo: false, trigger: 1080, warn: 1.42, fall: 0.46, state: 'waiting', age: 0 }
    ];

    const stars = [];
    // 0~12초: 실패 없는 구간. 낮은 줄 → 완만한 아치 → 높은 아치.
    starLine(stars, 620, 5, 62, GROUND - 54);
    starArc(stars, 1510, { count: 6, span: 330, height: 88, base: 48 });
    starArc(stars, 2490, { count: 7, span: 360, height: 126, base: 50 });

    starArc(stars, 3300, { count: 5, span: 255, height: 104 });
    starArc(stars, 4080, { count: 5, span: 250, height: 108 });
    starArc(stars, 4820, { count: 6, span: 285, height: 132 });

    // 첫 체크포인트: 숨 돌리고 낮은 별을 줍는다.
    starLine(stars, 5350, 7, 60, GROUND - 53);
    starArc(stars, 6100, { count: 6, span: 290, height: 114 });
    starArc(stars, 7140, { count: 5, span: 275, height: 108 });
    starArc(stars, 8025, { count: 7, span: 490, height: 122 });
    starArc(stars, 8840, { count: 6, span: 290, height: 132 });

    // 두 번째 체크포인트와 피날레 직전의 쉼.
    starLine(stars, 9700, 7, 60, GROUND - 54);
    starArc(stars, 10440, { count: 5, span: 250, height: 105 });
    starArc(stars, 11010, { count: 5, span: 275, height: 114 });
    starArc(stars, 11870, { count: 8, span: 560, height: 132 });
    starLine(stars, 12430, 6, 62, GROUND - 58);

    return {
      ground: GROUND,
      total: TOTAL,
      checkpoints: checkpoints.slice(),
      hazards: hazards.map(h => Object.assign({ hit: false, near: false, dead: false }, h)),
      drops: drops.map(d => Object.assign({}, d)),

      restZones: [
        { from: 5200, to: 5850 },
        { from: 9600, to: 10200 }
      ]
    };
  }

  ODY.Levels.cyclops = { build, GROUND, TOTAL };
})();

/* src/stages/runner-controller.js */
// 공용 러너 조작 — 빠른 반응, 코요테 타임, 입력 버퍼, 가변 점프
(function () {
  'use strict';
  window.ODY = window.ODY || {};

  class RunnerController {
    constructor(options) {
      const o = Object.assign({
        x: 245,
        ground: 430,
        jumpVelocity: -780,
        riseGravity: 1850,
        releaseGravity: 4800,
        fallGravity: 2700
      }, options);
      this.baseX = o.x;
      this.ground = o.ground;
      this.jumpVelocity = o.jumpVelocity;
      this.riseGravity = o.riseGravity;
      this.releaseGravity = o.releaseGravity;
      this.fallGravity = o.fallGravity;
      this.sq = ODY.Feel.makeSquash();
      this.onJump = null;
      this.onLand = null;
      this.onStep = null;
      this.reset();
    }

    reset() {
      this.x = this.baseX;
      this.xOffset = 0;
      this.xKick = 0;
      this.y = this.ground;
      this.vy = 0;
      this.grounded = true;
      this.coyote = 0.11;
      this.runPhase = 0;
      this.lastStep = -1;
      this.invin = 0;
      this.hurtTime = 0;
      this.blinkTime = 1.4;
      this.blink = 0;
      this.landTime = 0;
      this.airTime = 0;
      this.sq.sx = 1;
      this.sq.sy = 1;
      this.sq.vx = 0;
      this.sq.vy = 0;
    }

    hurt() {
      this.invin = 1.45;
      this.hurtTime = 0.52;
      this.xKick = -25;
      ODY.Feel.squash(this.sq, 1.28, 0.72);
    }

    update(dt, speed, canControl) {
      const E = ODY.E;
      const F = ODY.Feel;
      canControl = canControl !== false;

      this.invin = Math.max(0, this.invin - dt);
      this.hurtTime = Math.max(0, this.hurtTime - dt);
      this.landTime = Math.max(0, this.landTime - dt);

      // 좌우는 필수가 아닌 작은 위치 보정이다. 누르자마자 반응하고 놓으면 돌아온다.
      let targetOffset = 0;
      if (canControl && E.input.held('left')) targetOffset -= 48;
      if (canControl && E.input.held('right')) targetOffset += 58;
      this.xOffset = F.damp(this.xOffset, targetOffset, 14, dt);
      this.xKick = F.damp(this.xKick, 0, 9, dt);
      this.x = this.baseX + this.xOffset + this.xKick;

      if (this.grounded) {
        this.coyote = 0.11;
        this.airTime = 0;
      } else {
        this.coyote = Math.max(0, this.coyote - dt);
        this.airTime += dt;
      }

      if (canControl && E.input.buffered('jump', 0.16) && this.coyote > 0) {
        E.input.consume('jump');
        this.vy = this.jumpVelocity;
        this.grounded = false;
        this.coyote = 0;
        this.airTime = 0;
        F.squash(this.sq, 0.76, 1.29);
        if (this.onJump) this.onJump();
      }

      let gravity = this.fallGravity;
      if (this.vy < 0) {
        gravity = E.input.held('jump') ? this.riseGravity : this.releaseGravity;
      }
      if (!this.grounded && E.input.held('down')) gravity *= 1.18;

      const beforeVy = this.vy;
      this.vy += gravity * dt;
      this.y += this.vy * dt;

      if (this.y >= this.ground) {
        this.y = this.ground;
        this.vy = 0;
        if (!this.grounded) {
          const strength = ODY.Feel.clamp(Math.abs(beforeVy) / 760, 0.55, 1.25);
          this.grounded = true;
          this.landTime = 0.13;
          F.squash(this.sq, 1.27, 0.73);
          if (this.onLand) this.onLand(strength);
        }
        this.grounded = true;
      }

      if (this.grounded) {
        this.runPhase += dt * (7.2 + speed * 0.012);
        const stepIndex = Math.floor(this.runPhase / Math.PI);
        if (stepIndex !== this.lastStep) {
          this.lastStep = stepIndex;
          if (this.onStep) this.onStep(stepIndex & 1);
        }
      }

      this.blinkTime -= dt;
      if (this.blinkTime <= 0 && this.blink <= 0) {
        this.blink = 0.11;
        this.blinkTime = 1.8 + (Math.sin(ODY.E.time * 7.31) + 1) * 0.7;
      }
      this.blink = Math.max(0, this.blink - dt);
      F.updSquash(this.sq, dt);
    }
  }

  ODY.RunnerController = RunnerController;
})();
