// 키르케의 섬 — 파스텔 정원과 귀여운 술래잡기 캐릭터의 Canvas 그림
(function () {
  'use strict';
  window.ODY = window.ODY || {};
  ODY.Art = ODY.Art || {};

  const A = {};
  const TAU = Math.PI * 2;
  const W = 960;
  const H = 540;
  const INK = '#342442';
  const PAPER = '#fff8e8';
  let paperTexture = null;

  function n(value, fallback) {
    return Number.isFinite(Number(value)) ? Number(value) : (fallback || 0);
  }

  function clamp(value, low, high) {
    return Math.max(low, Math.min(high, value));
  }

  function wrap(value, span) {
    return ((value % span) + span) % span;
  }

  function rr(ctx, x, y, w, h, r) {
    const radius = Math.max(0, Math.min(r, Math.abs(w) * 0.5, Math.abs(h) * 0.5));
    ctx.beginPath();
    ctx.moveTo(x + radius, y);
    ctx.lineTo(x + w - radius, y);
    ctx.quadraticCurveTo(x + w, y, x + w, y + radius);
    ctx.lineTo(x + w, y + h - radius);
    ctx.quadraticCurveTo(x + w, y + h, x + w - radius, y + h);
    ctx.lineTo(x + radius, y + h);
    ctx.quadraticCurveTo(x, y + h, x, y + h - radius);
    ctx.lineTo(x, y + radius);
    ctx.quadraticCurveTo(x, y, x + radius, y);
    ctx.closePath();
  }

  function entityScale(entity, fallback) {
    const scale = n(entity && entity.scale, fallback === undefined ? 1 : fallback);
    return clamp(scale, 0.18, 2.4);
  }

  function entityAngle(entity) {
    if (!entity) return 0;
    if (Number.isFinite(entity.angle)) return entity.angle;
    if (Number.isFinite(entity.facing)) return entity.facing;
    if (typeof entity.facing === 'string') {
      if (entity.facing === 'left') return Math.PI;
      if (entity.facing === 'up') return -Math.PI * 0.5;
      if (entity.facing === 'down') return Math.PI * 0.5;
    }
    const vx = n(entity.vx, 0);
    const vy = n(entity.vy, 0);
    return Math.abs(vx) + Math.abs(vy) > 0.01 ? Math.atan2(vy, vx) : 0;
  }

  function entityPoint(entity, sx, sy) {
    return {
      x: Number.isFinite(sx) ? sx : n(entity && (entity.sx === undefined ? entity.x : entity.sx), 0),
      y: Number.isFinite(sy) ? sy : n(entity && (entity.sy === undefined ? entity.y : entity.sy), 0)
    };
  }

  function moving(entity) {
    if (!entity) return false;
    if (entity.moving !== undefined) return !!entity.moving;
    return Math.abs(n(entity.vx, 0)) + Math.abs(n(entity.vy, 0)) > 3;
  }

  function makeTexture() {
    if (paperTexture || typeof document === 'undefined') return;
    const canvas = document.createElement('canvas');
    canvas.width = 240;
    canvas.height = 135;
    const tx = canvas.getContext('2d');
    let seed = 0xc1ace357;
    function random() {
      seed = (seed * 1664525 + 1013904223) >>> 0;
      return seed / 4294967296;
    }
    for (let i = 0; i < 430; i++) {
      const light = random() > 0.46;
      tx.fillStyle = light ? 'rgba(255,255,255,0.045)' : 'rgba(63,51,86,0.028)';
      tx.beginPath();
      tx.arc(random() * canvas.width, random() * canvas.height, 0.35 + random(), 0, TAU);
      tx.fill();
    }
    paperTexture = canvas;
  }

  function drawPaper(ctx, alpha) {
    makeTexture();
    if (!paperTexture) return;
    ctx.save();
    ctx.globalAlpha = alpha === undefined ? 0.38 : alpha;
    ctx.drawImage(paperTexture, 0, 0, W, H);
    ctx.restore();
  }

  function leaf(ctx, x, y, angle, scale, color) {
    const s = scale === undefined ? 1 : scale;
    ctx.save();
    ctx.translate(x, y);
    ctx.rotate(angle || 0);
    ctx.scale(s, s);
    ctx.fillStyle = color || '#76d4a1';
    ctx.strokeStyle = '#397765';
    ctx.lineWidth = 1.7;
    ctx.beginPath();
    ctx.moveTo(-1, 9);
    ctx.bezierCurveTo(-13, 1, -11, -11, 0, -15);
    ctx.bezierCurveTo(12, -9, 13, 2, -1, 9);
    ctx.closePath();
    ctx.fill();
    ctx.stroke();
    ctx.strokeStyle = 'rgba(255,255,224,0.72)';
    ctx.lineWidth = 1.2;
    ctx.beginPath();
    ctx.moveTo(-1, 7);
    ctx.lineTo(1, -11);
    ctx.stroke();
    ctx.restore();
  }

  function flower(ctx, x, y, scale, color, time, phase) {
    const pulse = 1 + Math.sin((time || 0) * 2.4 + (phase || 0)) * 0.06;
    ctx.save();
    ctx.translate(x, y);
    ctx.scale(scale * pulse, scale * pulse);
    ctx.fillStyle = color;
    for (let i = 0; i < 5; i++) {
      const a = i * TAU / 5;
      ctx.beginPath();
      ctx.ellipse(Math.cos(a) * 6, Math.sin(a) * 6, 4.5, 6.5, a, 0, TAU);
      ctx.fill();
    }
    ctx.fillStyle = '#ffe37e';
    ctx.beginPath();
    ctx.arc(0, 0, 3.8, 0, TAU);
    ctx.fill();
    ctx.restore();
  }

  function shadow(ctx, x, y, rx, ry, alpha) {
    ctx.save();
    ctx.fillStyle = 'rgba(47,35,62,' + (alpha === undefined ? 0.18 : alpha) + ')';
    ctx.beginPath();
    ctx.ellipse(x, y, rx, ry, 0, 0, TAU);
    ctx.fill();
    ctx.restore();
  }

  function star(ctx, x, y, radius, color, rotation) {
    ctx.save();
    ctx.translate(x, y);
    ctx.rotate(rotation || 0);
    ctx.fillStyle = color || '#ffe47f';
    ctx.beginPath();
    for (let i = 0; i < 8; i++) {
      const r = i % 2 ? radius * 0.35 : radius;
      const a = -Math.PI * 0.5 + i * Math.PI * 0.25;
      if (i === 0) ctx.moveTo(Math.cos(a) * r, Math.sin(a) * r);
      else ctx.lineTo(Math.cos(a) * r, Math.sin(a) * r);
    }
    ctx.closePath();
    ctx.fill();
    ctx.restore();
  }

  function faceEyes(ctx, x, y, spread, time, phase) {
    const blink = Math.sin((time || 0) * 1.7 + (phase || 0)) > 0.965;
    ctx.strokeStyle = INK;
    ctx.fillStyle = INK;
    ctx.lineWidth = 2.4;
    ctx.lineCap = 'round';
    if (blink) {
      ctx.beginPath();
      ctx.moveTo(x - spread - 3, y); ctx.lineTo(x - spread + 3, y);
      ctx.moveTo(x + spread - 3, y); ctx.lineTo(x + spread + 3, y);
      ctx.stroke();
    } else {
      ctx.beginPath();
      ctx.arc(x - spread, y, 2.8, 0, TAU);
      ctx.arc(x + spread, y, 2.8, 0, TAU);
      ctx.fill();
      ctx.fillStyle = 'rgba(255,255,255,0.8)';
      ctx.beginPath();
      ctx.arc(x - spread - 0.7, y - 0.8, 0.8, 0, TAU);
      ctx.arc(x + spread - 0.7, y - 0.8, 0.8, 0, TAU);
      ctx.fill();
    }
  }

  // 배경은 정적인 정원 위에 세 속도의 무늬를 움직여 탑다운에서도 깊이를 준다.
  A.drawBackground = function (ctx, view, level, time) {
    view = view || {};
    level = level || {};
    const t = Number.isFinite(time) ? time : n(view.time, 0);
    const camX = n(view.camX, n(view.cameraX, n(view.x, 0)));
    const camY = n(view.camY, n(view.cameraY, n(view.y, 0)));

    const ground = ctx.createLinearGradient(0, 0, 0, H);
    ground.addColorStop(0, '#b8e0c2');
    ground.addColorStop(0.42, '#a9d9ae');
    ground.addColorStop(1, '#8bc89c');
    ctx.fillStyle = ground;
    ctx.fillRect(0, 0, W, H);

    // 가장 먼 바다와 둥근 섬 능선.
    const sea = ctx.createLinearGradient(0, 0, 0, 118);
    sea.addColorStop(0, '#8fcbd7');
    sea.addColorStop(1, '#b9e0d4');
    ctx.fillStyle = sea;
    ctx.fillRect(0, 0, W, 112);
    ctx.fillStyle = '#8bb697';
    ctx.beginPath();
    ctx.moveTo(0, 116);
    for (let x = -80; x <= W + 100; x += 90) {
      const px = x + wrap(-camX * 0.035, 180);
      const py = 91 + Math.sin((x + camX * 0.03) * 0.015) * 12;
      ctx.quadraticCurveTo(px + 42, py - 20, px + 90, 118);
    }
    ctx.lineTo(W, 150); ctx.lineTo(0, 150); ctx.closePath(); ctx.fill();

    // 먼 구름 그림자는 매우 천천히 흘러간다.
    ctx.fillStyle = 'rgba(255,249,226,0.16)';
    for (let i = 0; i < 7; i++) {
      const x = wrap(i * 210 - camX * 0.08 + t * 4, 1570) - 150;
      const y = 126 + wrap(i * 117 - camY * 0.05, 360);
      ctx.beginPath();
      ctx.ellipse(x, y, 92 + (i % 3) * 18, 28 + (i % 2) * 8, -0.2, 0, TAU);
      ctx.fill();
    }

    // 흙길은 정원의 안전한 이동 공간으로 읽히는 넓은 밝은 띠다.
    const pathY = n(level.pathScreenY, 303 + Math.sin(camY * 0.0022) * 27);
    ctx.strokeStyle = 'rgba(247,222,174,0.62)';
    ctx.lineWidth = 82;
    ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(-80, pathY + 36);
    ctx.bezierCurveTo(215, pathY - 46, 480, pathY + 67, 720, pathY - 4);
    ctx.bezierCurveTo(840, pathY - 38, 940, pathY + 12, 1040, pathY - 25);
    ctx.stroke();
    ctx.strokeStyle = 'rgba(255,246,214,0.34)';
    ctx.lineWidth = 4;
    ctx.setLineDash([13, 18]);
    ctx.beginPath();
    ctx.moveTo(-30, pathY + 33);
    ctx.bezierCurveTo(240, pathY - 40, 474, pathY + 57, 720, pathY - 4);
    ctx.stroke();
    ctx.setLineDash([]);

    // 중경의 꽃·잎 무늬는 카메라보다 느리게 움직여 패럴랙스를 만든다.
    const flowerColors = ['#f5a7b7', '#d8b3ec', '#fff0a2', '#9ddbc5'];
    for (let i = 0; i < 24; i++) {
      const x = wrap(i * 149 + 37 - camX * 0.22, W + 220) - 110;
      const y = 126 + wrap(i * 91 + 29 - camY * 0.18, H - 94);
      if (Math.abs(y - pathY) < 58) continue;
      if (i % 3 === 0) leaf(ctx, x, y, i * 1.7, 0.45 + (i % 4) * 0.06, '#72b98c');
      else flower(ctx, x, y, 0.45 + (i % 3) * 0.08, flowerColors[i % flowerColors.length], t, i);
    }

    // 땅의 작은 점은 상호작용 물체보다 훨씬 흐리다.
    ctx.fillStyle = 'rgba(52,94,76,0.12)';
    for (let i = 0; i < 48; i++) {
      const x = wrap(i * 83 - camX * 0.31, W + 80) - 40;
      const y = 116 + wrap(i * 57 - camY * 0.29, H - 92);
      ctx.beginPath();
      ctx.arc(x, y, 1.2 + (i % 3) * 0.45, 0, TAU);
      ctx.fill();
    }

    drawPaper(ctx, 0.34);
  };

  function drawHedge(ctx, wall, x, y, w, h, time) {
    shadow(ctx, x, y + h * 0.42 + 7, w * 0.48, Math.max(8, h * 0.18), 0.2);
    ctx.save();
    ctx.translate(x, y);
    const vertical = h > w;
    const length = vertical ? h : w;
    const count = Math.max(2, Math.ceil(length / 34));
    ctx.strokeStyle = '#3f735c';
    ctx.lineWidth = 3.5;
    for (let i = 0; i < count; i++) {
      const p = count === 1 ? 0 : i / (count - 1) - 0.5;
      const px = vertical ? Math.sin(i * 2.1) * 3 : p * Math.max(0, w - 25);
      const py = vertical ? p * Math.max(0, h - 25) : Math.sin(i * 2.3) * 3;
      const r = 20 + (i % 3) * 2.5;
      const grad = ctx.createRadialGradient(px - 6, py - 8, 2, px, py, r);
      grad.addColorStop(0, '#b5df9f');
      grad.addColorStop(0.58, '#70b985');
      grad.addColorStop(1, '#4d916f');
      ctx.fillStyle = grad;
      ctx.beginPath();
      ctx.arc(px, py, r, 0, TAU);
      ctx.fill();
      ctx.stroke();
      if (i % 2 === 0) leaf(ctx, px + 3, py - 3, i * 1.8 + time * 0.05, 0.42, '#c0e6a5');
    }
    ctx.restore();
  }

  function drawFountain(ctx, wall, x, y, w, h, time) {
    const r = Math.max(24, Math.min(w, h) * 0.48);
    shadow(ctx, x, y + r * 0.55, r * 1.2, r * 0.42, 0.19);
    ctx.save(); ctx.translate(x, y);
    ctx.fillStyle = '#ded6c7'; ctx.strokeStyle = '#675b74'; ctx.lineWidth = 4;
    ctx.beginPath(); ctx.ellipse(0, 0, r * 1.12, r * 0.68, 0, 0, TAU); ctx.fill(); ctx.stroke();
    const water = ctx.createRadialGradient(-r * 0.2, -r * 0.18, 2, 0, 0, r);
    water.addColorStop(0, '#c9f3e3'); water.addColorStop(1, '#76c9cf');
    ctx.fillStyle = water;
    ctx.beginPath(); ctx.ellipse(0, -2, r * 0.86, r * 0.47, 0, 0, TAU); ctx.fill();
    ctx.fillStyle = '#e9dfcb'; ctx.strokeStyle = '#675b74'; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.ellipse(0, -10, r * 0.19, r * 0.35, 0, 0, TAU); ctx.fill(); ctx.stroke();
    ctx.strokeStyle = 'rgba(255,255,238,0.72)'; ctx.lineWidth = 3; ctx.lineCap = 'round';
    for (let i = 0; i < 3; i++) {
      const a = i * TAU / 3 + time * 0.18;
      ctx.beginPath();
      ctx.arc(Math.cos(a) * r * 0.48, Math.sin(a) * r * 0.25 - 2, 5 + i, 0, Math.PI);
      ctx.stroke();
    }
    ctx.restore();
  }

  function drawTree(ctx, wall, x, y, w, h, time) {
    const r = Math.max(23, Math.max(w, h) * 0.4);
    shadow(ctx, x + 8, y + r * 0.65, r * 0.95, r * 0.32, 0.22);
    ctx.save(); ctx.translate(x, y);
    ctx.strokeStyle = '#725450'; ctx.lineWidth = Math.max(7, r * 0.22); ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(0, r * 0.58); ctx.lineTo(-2, 2); ctx.stroke();
    const clusters = [[-r * 0.34,-r * 0.18],[0,-r * 0.36],[r * 0.34,-r * 0.12],[0,r * 0.05]];
    clusters.forEach((p, i) => {
      const grad = ctx.createRadialGradient(p[0] - 7, p[1] - 8, 2, p[0], p[1], r * 0.62);
      grad.addColorStop(0, '#c7dfa2'); grad.addColorStop(1, '#629a74');
      ctx.fillStyle = grad; ctx.strokeStyle = '#426c59'; ctx.lineWidth = 3;
      ctx.beginPath(); ctx.arc(p[0], p[1] + Math.sin(time * 1.2 + i) * 1.5, r * 0.55, 0, TAU); ctx.fill(); ctx.stroke();
    });
    ctx.fillStyle = '#e7b3c0';
    for (let i = 0; i < 4; i++) {
      ctx.beginPath(); ctx.arc(Math.cos(i * 2.1) * r * 0.4, -r * 0.18 + Math.sin(i * 1.7) * r * 0.28, 3.2, 0, TAU); ctx.fill();
    }
    ctx.restore();
  }

  // wall/obstacle 객체의 type에 따라 실루엣이 완전히 달라진다.
  A.drawWall = function (ctx, wall, sx, sy, time) {
    wall = wall || {};
    const p = entityPoint(wall, sx, sy);
    const w = Math.max(18, n(wall.w, n(wall.width, n(wall.r, 34) * 2)));
    const h = Math.max(18, n(wall.h, n(wall.height, n(wall.r, 34) * 2)));
    const t = n(time, n(wall.time, 0));
    const type = wall.type || wall.kind || 'hedge';
    if (type === 'fountain' || type === 'pond' || type === 'water') {
      drawFountain(ctx, wall, p.x, p.y, w, h, t);
      return;
    }
    if (type === 'tree' || type === 'olive') {
      drawTree(ctx, wall, p.x, p.y, w, h, t);
      return;
    }
    if (type === 'flower' || type === 'flowerbed') {
      shadow(ctx, p.x, p.y + h * 0.28, w * 0.45, h * 0.22, 0.12);
      ctx.save();
      ctx.fillStyle = '#739f72'; ctx.strokeStyle = '#4e765d'; ctx.lineWidth = 3;
      ctx.beginPath(); ctx.ellipse(p.x, p.y, w * 0.5, h * 0.5, 0, 0, TAU); ctx.fill(); ctx.stroke();
      const colors = ['#f5a7b7','#d4b0ea','#fff0a2'];
      for (let i = 0; i < 7; i++) flower(ctx, p.x + Math.cos(i * 2.4) * w * 0.28, p.y + Math.sin(i * 1.8) * h * 0.27, 0.55, colors[i % 3], t, i);
      ctx.restore();
      return;
    }
    if (type === 'rock' || type === 'statue' || type === 'pillar') {
      shadow(ctx, p.x + 5, p.y + h * 0.38, w * 0.45, h * 0.17, 0.2);
      ctx.save();
      const grad = ctx.createLinearGradient(p.x - w * 0.5, p.y - h * 0.5, p.x + w * 0.5, p.y + h * 0.5);
      grad.addColorStop(0, '#f0dfcf'); grad.addColorStop(1, '#b9abc0');
      ctx.fillStyle = grad; ctx.strokeStyle = '#655972'; ctx.lineWidth = 4;
      if (type === 'pillar') {
        rr(ctx, p.x - w * 0.34, p.y - h * 0.5, w * 0.68, h, w * 0.18); ctx.fill(); ctx.stroke();
        rr(ctx, p.x - w * 0.5, p.y - h * 0.48, w, h * 0.18, 7); ctx.fill(); ctx.stroke();
      } else {
        ctx.beginPath();
        ctx.moveTo(p.x - w * 0.46, p.y + h * 0.36);
        ctx.quadraticCurveTo(p.x - w * 0.58, p.y - h * 0.12, p.x - w * 0.12, p.y - h * 0.46);
        ctx.quadraticCurveTo(p.x + w * 0.42, p.y - h * 0.5, p.x + w * 0.5, p.y + h * 0.28);
        ctx.closePath(); ctx.fill(); ctx.stroke();
      }
      ctx.restore();
      return;
    }
    drawHedge(ctx, wall, p.x, p.y, w, h, t);
  };

  A.drawObstacle = A.drawWall;

  A.drawPig = function (ctx, pig, sx, sy, time) {
    pig = pig || {};
    const p = entityPoint(pig, sx, sy);
    const t = n(time, 0);
    const phase = n(pig.phase, n(pig.id, 0) * 1.73);
    const walk = moving(pig) ? Math.sin(t * 9 + phase) : Math.sin(t * 2 + phase) * 0.22;
    const bob = -Math.abs(walk) * (moving(pig) ? 3.4 : 1.4);
    const scale = entityScale(pig, 1);
    const sq = pig.sq || {};
    const sxq = n(sq.sx, 1);
    const syq = n(sq.sy, 1);
    const target = clamp(n(pig.targeted, n(pig.herbNear, 0)), 0, 1);
    const scentHits = Math.max(0, n(pig.molyHits, n(pig.scentHits, 0)));
    const scentNeed = Math.max(1, n(pig.molyNeedCurrent, n(pig.molyNeed, n(pig.requiredHits, 1))));
    const scent = clamp(scentHits / scentNeed, 0, 1);

    if (scent > 0.001) {
      ctx.save(); ctx.translate(p.x, p.y - 38 * scale);
      for (let i = 0; i < scentNeed; i++) {
        const a = -Math.PI * 0.82 + (scentNeed === 1 ? 0 : i / (scentNeed - 1)) * Math.PI * 0.64;
        const lx = Math.cos(a) * 32 * scale;
        const ly = Math.sin(a) * 13 * scale;
        ctx.save(); ctx.translate(lx, ly); ctx.rotate(a + Math.PI * 0.5); ctx.scale(0.32 * scale, 0.32 * scale);
        ctx.fillStyle = i < scentHits ? '#9ae2a5' : 'rgba(255,248,219,0.25)';
        ctx.strokeStyle = i < scentHits ? '#3f775b' : 'rgba(52,36,66,0.55)'; ctx.lineWidth = 4;
        ctx.beginPath(); ctx.moveTo(-1,9); ctx.bezierCurveTo(-13,1,-11,-11,0,-15);
        ctx.bezierCurveTo(12,-9,13,2,-1,9); ctx.closePath(); ctx.fill(); ctx.stroke(); ctx.restore();
      }
      ctx.restore();
    }

    if (target > 0.02) {
      ctx.save();
      ctx.globalAlpha = 0.22 + target * 0.35;
      ctx.strokeStyle = '#fff09a'; ctx.lineWidth = 4; ctx.setLineDash([7,7]);
      ctx.beginPath(); ctx.arc(p.x, p.y, (31 + Math.sin(t * 5 + phase) * 3) * scale, 0, TAU); ctx.stroke();
      ctx.setLineDash([]); ctx.restore();
    }
    shadow(ctx, p.x, p.y + 18 * scale, 29 * scale, 10 * scale, 0.21);

    ctx.save();
    ctx.translate(p.x, p.y + bob * scale);
    ctx.rotate(entityAngle(pig));
    if (n(pig.scentFlash, 0) > 0) ctx.rotate(Math.sin(t * 42) * 0.06);
    ctx.scale(scale * sxq, scale * syq);

    // 둥글게 말린 꼬리는 사람 캐릭터와 색 없이도 구분되는 표지다.
    ctx.strokeStyle = '#b65f78'; ctx.lineWidth = 4; ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(-25, 1);
    ctx.bezierCurveTo(-39, -10, -41, 10, -31, 10);
    ctx.bezierCurveTo(-23, 10, -26, 2, -31, 4);
    ctx.stroke();

    ctx.strokeStyle = INK; ctx.lineWidth = 3.5;
    ctx.fillStyle = '#b66d82';
    for (let i = -1; i <= 1; i += 2) {
      ctx.beginPath();
      ctx.ellipse(-8, i * 14 + walk * 2, 8, 5, i * 0.12, 0, TAU);
      ctx.fill(); ctx.stroke();
    }

    const body = ctx.createLinearGradient(-25, -22, 29, 22);
    body.addColorStop(0, '#f6b4bd'); body.addColorStop(1, '#dc8296');
    ctx.fillStyle = body; ctx.strokeStyle = INK; ctx.lineWidth = 4;
    ctx.beginPath(); ctx.ellipse(-3, 0, 31, 23, 0, 0, TAU); ctx.fill(); ctx.stroke();

    // 삼각 귀와 큰 원형 코로 돼지 실루엣을 즉시 읽게 한다.
    ctx.fillStyle = '#e68fa2';
    ctx.beginPath(); ctx.moveTo(14,-15); ctx.lineTo(17,-31); ctx.lineTo(27,-14); ctx.closePath(); ctx.fill(); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(14,15); ctx.lineTo(17,31); ctx.lineTo(27,14); ctx.closePath(); ctx.fill(); ctx.stroke();

    ctx.fillStyle = '#f3aab5';
    ctx.beginPath(); ctx.ellipse(20, 0, 22, 19, 0, 0, TAU); ctx.fill(); ctx.stroke();
    faceEyes(ctx, 22, -6, 7, t, phase);
    ctx.fillStyle = '#f7c2c7'; ctx.strokeStyle = INK; ctx.lineWidth = 2.8;
    ctx.beginPath(); ctx.ellipse(39, 3, 13, 10, 0, 0, TAU); ctx.fill(); ctx.stroke();
    ctx.fillStyle = '#9e586d';
    ctx.beginPath(); ctx.arc(35, 2, 2.2, 0, TAU); ctx.arc(43, 2, 2.2, 0, TAU); ctx.fill();
    ctx.fillStyle = 'rgba(255,114,137,0.38)';
    ctx.beginPath(); ctx.arc(19, 8, 5, 0, TAU); ctx.fill();
    ctx.restore();
  };

  const FRIEND_COLORS = ['#68b9c6', '#e69a76', '#9f8acb', '#76b88d', '#cf7f9a'];

  A.drawFriend = function (ctx, pig, sx, sy, time) {
    pig = pig || {};
    const p = entityPoint(pig, sx, sy);
    const t = n(time, 0);
    const phase = n(pig.phase, n(pig.id, 0) * 1.41);
    const appear = clamp(n(pig.friendT, n(pig.rescueT, n(pig.rescued, 1))), 0, 1);
    const pop = appear < 1 && window.ODY.Feel && ODY.Feel.ease ? ODY.Feel.ease.outBack(appear) : appear;
    const scale = entityScale(pig, 1) * Math.max(0.05, pop);
    const bounce = Math.sin(t * 2.6 + phase) * 1.4;
    const color = pig.tunic || FRIEND_COLORS[Math.abs(n(pig.id, 0)) % FRIEND_COLORS.length];
    shadow(ctx, p.x, p.y + 20 * scale, 20 * scale, 7 * scale, 0.2);

    ctx.save(); ctx.translate(p.x, p.y + bounce); ctx.scale(scale, scale);
    ctx.rotate(Math.sin(t * 2 + phase) * 0.02);
    // 팔다리와 삼각 튜닉이 돼지의 둥근 네발 실루엣과 확실히 다르다.
    ctx.strokeStyle = '#8c634f'; ctx.lineWidth = 5; ctx.lineCap = 'round';
    const wave = pig.celebrate ? Math.sin(t * 6 + phase) * 5 : 0;
    ctx.beginPath(); ctx.moveTo(-11,-1); ctx.lineTo(-23,-11-wave); ctx.moveTo(11,-1); ctx.lineTo(23,-11+wave); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(-7,18); ctx.lineTo(-9,31); ctx.moveTo(7,18); ctx.lineTo(9,31); ctx.stroke();
    ctx.strokeStyle = '#5c4565'; ctx.lineWidth = 4;
    ctx.beginPath(); ctx.moveTo(-13,31); ctx.lineTo(-6,31); ctx.moveTo(5,31); ctx.lineTo(13,31); ctx.stroke();

    const tunic = ctx.createLinearGradient(0,-10,0,25);
    tunic.addColorStop(0, '#fff0cf'); tunic.addColorStop(0.22, color); tunic.addColorStop(1, color);
    ctx.fillStyle = tunic; ctx.strokeStyle = INK; ctx.lineWidth = 3.2;
    ctx.beginPath(); ctx.moveTo(-13,-9); ctx.lineTo(13,-9); ctx.lineTo(19,23); ctx.lineTo(-19,23); ctx.closePath(); ctx.fill(); ctx.stroke();
    ctx.strokeStyle = '#ffe3a0'; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.moveTo(-13,3); ctx.lineTo(14,3); ctx.stroke();

    ctx.fillStyle = '#bf825f'; ctx.strokeStyle = INK; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.arc(0,-22,13,0,TAU); ctx.fill(); ctx.stroke();
    ctx.fillStyle = '#5b4353';
    ctx.beginPath(); ctx.arc(0,-26,12,Math.PI,TAU); ctx.lineTo(11,-21); ctx.quadraticCurveTo(0,-28,-11,-21); ctx.closePath(); ctx.fill();
    faceEyes(ctx, 0, -22, 4.5, t, phase);
    ctx.strokeStyle = INK; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(0,-17,4,0.15,Math.PI-0.15); ctx.stroke();
    ctx.restore();
  };

  A.drawHero = function (ctx, hero, sx, sy, time, casting) {
    hero = hero || {};
    const p = entityPoint(hero, sx, sy);
    const t = n(time, 0);
    const phase = n(hero.phase, 0.4);
    const walk = moving(hero) ? Math.sin(t * 10 + phase) : Math.sin(t * 2.2 + phase) * 0.2;
    const bob = -Math.abs(walk) * (moving(hero) ? 3 : 1.2);
    const scale = entityScale(hero, 1);
    const sq = hero.sq || {};
    const cast = clamp(typeof casting === 'number' ? casting : (casting ? 1 : n(hero.castT, n(hero.casting, 0))), 0, 1);
    shadow(ctx, p.x, p.y + 19 * scale, 23 * scale, 8 * scale, 0.22);

    ctx.save();
    ctx.translate(p.x, p.y + bob * scale);
    ctx.rotate(entityAngle(hero));
    ctx.scale(scale * n(sq.sx, 1), scale * n(sq.sy, 1));

    // 붉은 망토와 잎 주머니가 주인공만의 실루엣을 만든다.
    ctx.fillStyle = '#b85f69'; ctx.strokeStyle = INK; ctx.lineWidth = 3.5;
    ctx.beginPath();
    ctx.moveTo(-18,-14); ctx.quadraticCurveTo(-36,0,-27,25); ctx.quadraticCurveTo(-5,18,5,11); ctx.closePath();
    ctx.fill(); ctx.stroke();

    ctx.strokeStyle = '#b87555'; ctx.lineWidth = 6; ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(-2,-12); ctx.lineTo(-11,-24-walk*2);
    ctx.moveTo(7,-11); ctx.lineTo(20 + cast * 12,-17 - cast * 7);
    ctx.stroke();
    if (cast > 0.05) leaf(ctx, 24 + cast * 11, -19 - cast * 7, 1.15, 0.52 + cast * 0.18, '#82d6a2');

    ctx.strokeStyle = '#75506b'; ctx.lineWidth = 7;
    ctx.beginPath(); ctx.moveTo(-7,14); ctx.lineTo(-10,27+walk*2); ctx.moveTo(7,14); ctx.lineTo(11,27-walk*2); ctx.stroke();
    ctx.fillStyle = '#f2e2c4'; ctx.strokeStyle = INK; ctx.lineWidth = 3.5;
    ctx.beginPath(); ctx.ellipse(0,0,17,22,0,0,TAU); ctx.fill(); ctx.stroke();
    ctx.strokeStyle = '#d19a45'; ctx.lineWidth = 4;
    ctx.beginPath(); ctx.moveTo(-15,1); ctx.lineTo(15,1); ctx.stroke();

    // 약초 주머니.
    ctx.fillStyle = '#8c684d'; ctx.strokeStyle = INK; ctx.lineWidth = 2.5;
    rr(ctx,-20,4,13,16,5); ctx.fill(); ctx.stroke();
    leaf(ctx,-16,4,-0.55,0.34,'#86d39e');

    ctx.fillStyle = '#c88761'; ctx.strokeStyle = INK; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.arc(7,-21,13,0,TAU); ctx.fill(); ctx.stroke();
    // 둥근 여행 모자와 작은 깃털. 칼은 그리지 않는다.
    ctx.fillStyle = '#6e5b88';
    ctx.beginPath(); ctx.arc(7,-25,12,Math.PI,TAU); ctx.lineTo(20,-22); ctx.lineTo(-6,-22); ctx.closePath(); ctx.fill(); ctx.stroke();
    ctx.strokeStyle = '#ffe291'; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.moveTo(8,-35); ctx.quadraticCurveTo(16,-44,21,-37); ctx.stroke();
    faceEyes(ctx, 8, -21, 4.5, t, phase);
    ctx.strokeStyle = INK; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(8,-16,4,0.2,Math.PI-0.2); ctx.stroke();
    ctx.restore();
  };

  // 권장 호출: drawHerbCone(ctx, hero, sx, sy, angle, range, time, strength).
  // 숫자 좌표 호출 drawHerbCone(ctx, x, y, angle, range, time, strength)도 지원한다.
  A.drawHerbCone = function (ctx, source, sx, sy, angle, range, time, strength) {
    let entity = source || {};
    let x;
    let y;
    if (typeof source === 'number') {
      x = source;
      y = n(sx, 0);
      strength = time;
      time = range;
      range = angle;
      angle = sy;
      entity = {};
    } else {
      const p = entityPoint(entity, sx, sy);
      x = p.x; y = p.y;
    }
    const a = Number.isFinite(angle) ? angle : entityAngle(entity);
    const r = Math.max(30, n(range, n(entity.range, 112)));
    const spread = clamp(n(entity.spread, n(entity.cone, Math.PI * 0.62)), Math.PI * 0.22, Math.PI * 0.95);
    const t = n(time, 0);
    const power = clamp(strength === undefined ? n(entity.castT, n(entity.casting, 1)) : strength, 0, 1);
    if (power <= 0.01) return;

    ctx.save();
    ctx.translate(x, y);
    ctx.rotate(a);
    ctx.globalAlpha = power;
    const glow = ctx.createRadialGradient(0, 0, 8, 0, 0, r);
    glow.addColorStop(0, 'rgba(255,246,164,0.36)');
    glow.addColorStop(0.48, 'rgba(128,222,165,0.24)');
    glow.addColorStop(1, 'rgba(128,222,165,0)');
    ctx.fillStyle = glow;
    ctx.beginPath(); ctx.moveTo(0,0); ctx.arc(0,0,r,-spread*0.5,spread*0.5); ctx.closePath(); ctx.fill();
    ctx.strokeStyle = 'rgba(238,255,202,0.76)'; ctx.lineWidth = 3; ctx.setLineDash([8,9]);
    ctx.beginPath(); ctx.moveTo(0,0); ctx.arc(0,0,r,-spread*0.5,spread*0.5); ctx.closePath(); ctx.stroke();
    ctx.setLineDash([]);
    for (let i = 0; i < 5; i++) {
      const k = (i + 1) / 6;
      const aa = -spread * 0.38 + (i % 3) * spread * 0.38 + Math.sin(t * 5 + i) * 0.06;
      leaf(ctx, Math.cos(aa) * r * k, Math.sin(aa) * r * k, aa + t * 0.7 + i, 0.3 + k * 0.18, i % 2 ? '#fff0a3' : '#7ed5a0');
    }
    ctx.restore();
  };

  A.drawMagic = function (ctx, hazard, sx, sy, time) {
    hazard = hazard || {};
    const p = entityPoint(hazard, sx, sy);
    const t = n(time, 0);
    const phase = n(hazard.phase, n(hazard.id, 0) * 1.37);
    const radius = Math.max(18, n(hazard.r, n(hazard.radius, 35)));
    const warn = clamp(n(hazard.warn, n(hazard.warning, 1)), 0, 1);
    const active = clamp(n(hazard.active, 1), 0, 1);
    const pulse = 1 + Math.sin(t * 4 + phase) * 0.07;

    ctx.save(); ctx.translate(p.x, p.y); ctx.scale(pulse, pulse);
    const glow = ctx.createRadialGradient(0,0,2,0,0,radius*1.4);
    glow.addColorStop(0,'rgba(255,235,166,0.42)');
    glow.addColorStop(0.35,'rgba(190,143,218,0.3)');
    glow.addColorStop(1,'rgba(190,143,218,0)');
    ctx.fillStyle = glow; ctx.fillRect(-radius*1.5,-radius*1.5,radius*3,radius*3);

    // 나선 모양이라 약초의 뾰족한 잎과 색 없이도 다르게 보인다.
    ctx.strokeStyle = 'rgba(103,72,137,' + (0.45 + warn * 0.4) + ')';
    ctx.lineWidth = 4; ctx.lineCap = 'round';
    ctx.setLineDash(warn < 0.85 ? [7,7] : []);
    ctx.beginPath();
    for (let i = 0; i <= 34; i++) {
      const k = i / 34;
      const a = k * TAU * 2.15 + t * 1.35 + phase;
      const r = radius * k;
      const x = Math.cos(a) * r;
      const y = Math.sin(a) * r * 0.68;
      if (i === 0) ctx.moveTo(x,y); else ctx.lineTo(x,y);
    }
    ctx.stroke(); ctx.setLineDash([]);
    if (active > 0.05) {
      for (let i = 0; i < 4; i++) {
        const a = t * (0.8 + i * 0.08) + phase + i * TAU / 4;
        star(ctx, Math.cos(a) * radius * 0.78, Math.sin(a) * radius * 0.48, 4 + i % 2, i % 2 ? '#fff0a0' : '#d9b8ef', -a);
      }
    }
    ctx.restore();
  };

  A.drawCirce = function (ctx, circe, sx, sy, time) {
    circe = circe || {};
    const p = entityPoint(circe, sx, sy);
    const t = n(time, 0);
    const phase = n(circe.phase, 1.2);
    const scale = entityScale(circe, 1);
    const bob = Math.sin(t * 2 + phase) * 2.2;
    const cast = clamp(n(circe.castT, n(circe.casting, 0)), 0, 1);
    shadow(ctx, p.x, p.y + 21 * scale, 26 * scale, 9 * scale, 0.2);

    ctx.save(); ctx.translate(p.x, p.y + bob); ctx.scale(scale, scale);
    // 별 끝 지팡이는 무기가 아니라 마법 안내 도구로 보인다.
    ctx.strokeStyle = '#9b704d'; ctx.lineWidth = 4; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(19,8); ctx.lineTo(32,-30-cast*6); ctx.stroke();
    star(ctx,34,-35-cast*6,7,'#ffe17d',t*0.7);
    ctx.strokeStyle = 'rgba(197,143,224,0.72)'; ctx.lineWidth = 2.5;
    ctx.beginPath(); ctx.arc(34,-35-cast*6,12+cast*5,t,t+Math.PI*1.5); ctx.stroke();

    // 넓은 종 모양 치마와 큰 곱슬머리로 실루엣을 구분한다.
    const robe = ctx.createLinearGradient(0,-5,0,35);
    robe.addColorStop(0,'#f4cae1'); robe.addColorStop(0.28,'#a57bc4'); robe.addColorStop(1,'#705792');
    ctx.fillStyle = robe; ctx.strokeStyle = INK; ctx.lineWidth = 3.5;
    ctx.beginPath(); ctx.moveTo(-13,-7); ctx.lineTo(14,-7); ctx.quadraticCurveTo(25,15,29,32); ctx.quadraticCurveTo(0,39,-29,32); ctx.quadraticCurveTo(-24,14,-13,-7); ctx.closePath(); ctx.fill(); ctx.stroke();
    ctx.strokeStyle = '#ffe19b'; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.moveTo(-18,11); ctx.quadraticCurveTo(0,18,19,10); ctx.stroke();

    ctx.strokeStyle = '#b97862'; ctx.lineWidth = 5; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(-10,-2); ctx.lineTo(-24,9+Math.sin(t*2)*2); ctx.moveTo(10,-2); ctx.lineTo(20,8); ctx.stroke();

    ctx.fillStyle = '#5b416b'; ctx.strokeStyle = INK; ctx.lineWidth = 3;
    const curls = [[-13,-23],[-9,-34],[0,-39],[11,-34],[15,-22],[-17,-13],[18,-12]];
    curls.forEach((c,i) => { ctx.beginPath(); ctx.arc(c[0],c[1]+Math.sin(t*1.4+i)*0.6,10,0,TAU); ctx.fill(); ctx.stroke(); });
    ctx.fillStyle = '#c88369';
    ctx.beginPath(); ctx.arc(1,-22,14,0,TAU); ctx.fill(); ctx.stroke();
    faceEyes(ctx,1,-22,4.7,t,phase);
    ctx.strokeStyle = INK; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(1,-16,4.5,0.2,Math.PI-0.2); ctx.stroke();
    ctx.fillStyle = 'rgba(243,117,151,0.3)';
    ctx.beginPath(); ctx.arc(-7,-16,4,0,TAU); ctx.arc(9,-16,4,0,TAU); ctx.fill();

    // 월계관 잎 두 장.
    leaf(ctx,-8,-39,-0.8,0.3,'#8bcf91');
    leaf(ctx,8,-40,0.8,0.3,'#8bcf91');
    ctx.restore();
  };

  A.drawForeground = function (ctx, view, level, time) {
    view = view || {};
    const t = Number.isFinite(time) ? time : n(view.time, 0);
    const camX = n(view.camX, n(view.cameraX, 0));
    const camY = n(view.camY, n(view.cameraY, 0));
    ctx.save();
    // 가까운 잎은 가장 빠르게 움직이되 화면 중앙과 터치 영역은 가리지 않는다.
    for (let i = 0; i < 11; i++) {
      const side = i % 2 ? 1 : -1;
      const x = side < 0 ? -12 + (i % 3) * 12 : W + 12 - (i % 3) * 12;
      const y = 96 + wrap(i * 67 - camY * 0.55 + camX * 0.08, H - 126);
      ctx.globalAlpha = 0.22 + (i % 3) * 0.06;
      leaf(ctx, x, y, side < 0 ? 1.25 : -1.25, 1.2 + (i % 2) * 0.25, i % 2 ? '#4e9271' : '#67a77a');
    }
    ctx.globalAlpha = 1;

    // 햇빛 점은 느리고 작아 빠른 점멸로 보이지 않는다.
    ctx.fillStyle = 'rgba(255,249,190,0.2)';
    for (let i = 0; i < 9; i++) {
      const x = wrap(i * 137 + t * 7 - camX * 0.4, W + 100) - 50;
      const y = 120 + wrap(i * 83 - camY * 0.5, H - 150);
      ctx.beginPath(); ctx.arc(x,y,2+(i%3),0,TAU); ctx.fill();
    }
    ctx.restore();
  };

  A.drawCardArt = function (ctx, x, y, time) {
    const t = n(time, 0);
    ctx.save();
    const glow = ctx.createRadialGradient(x,y,4,x,y,76);
    glow.addColorStop(0,'rgba(255,236,146,0.55)');
    glow.addColorStop(1,'rgba(255,236,146,0)');
    ctx.fillStyle = glow; ctx.fillRect(x-80,y-80,160,160);
    ctx.fillStyle = 'rgba(126,194,145,0.34)';
    ctx.beginPath(); ctx.ellipse(x,y+30,70,26,0,0,TAU); ctx.fill();
    A.drawCirce(ctx, { scale:0.58, phase:1.1 }, x-25, y+11, t);
    A.drawPig(ctx, { scale:0.5, phase:2.7, targeted:0 }, x+39, y+21, t);
    leaf(ctx,x+7,y-21,-0.28,0.7,'#83d69f');
    star(ctx,x+11,y-45,7,'#ffe47f',t*0.7);
    ctx.restore();
  };

  ODY.Art.circe = A;
})();

</script>
  <script>
/* src/stages/circe.js */
// 스테이지 3 — 키르케의 섬
// 몰리 약초로 돼지가 된 친구들을 되돌리는 탑다운 술래잡기.
(function () {
  'use strict';
  window.ODY = window.ODY || {};
  ODY.Stages = ODY.Stages || {};

  ODY.Stages.circe = function (options) {
    const E = ODY.E;
    const F = ODY.Feel;
    const S = ODY.Snd;
    const UI = ODY.UI;
    const Art = ODY.Art.circe;
    const W = E.W, H = E.H;
    const level = ODY.Levels.circe.build();
    const hero = new ODY.TopDownController({
      x: level.start.x, y: level.start.y,
      worldWidth: level.worldW, worldHeight: level.worldH
    });

    let simTime = 0;
    let hazardTime = 0;
    let uiTime = 0;
    let state = 'intro';
    let stateTime = 0;
    let stateBeforePause = 'run';
    let pauseInputLock = 0;
    let hearts = 5;
    let cured = 0;
    let molyLeaves = 0;
    let checkpointIndex = 0;
    let rescues = 0;
    let failures = 0;
    let assist = false;
    let castTime = 0;
    let castCooldown = 0;
    let castAngle = 0;
    let finishSent = false;
    let clearBurst = false;
    let gateOpened = false;
    let hintText = '';
    let hintTime = 0;
    let musicBand = -1;
    let molyHinted = false;
    let landedCasts = 0;
    let missedCasts = 0;
    let cameraX = F.clamp(level.start.x - W * 0.34, 0, level.worldW - W);
    let cameraY = F.clamp(level.start.y - H * 0.5, 0, level.worldH - H);

    const pigs = level.pigs.map(data => Object.assign({}, data, {
      path: data.path.map(p => Object.assign({}, p)),
      x: data.x, y: data.y, vx: 0, vy: 0, angle: 0,
      pathIndex: data.path.length > 1 ? 1 : 0,
      moveClock: data.phase || 0, restTimer: 0, dashTime: 0,
      cured: false, friendT: 0, targeted: 0,
      molyHits: 0, scentFlash: 0,
      sq: F.makeSquash()
    }));
    const herbs = level.herbs.map(data => Object.assign({}, data, { got: false, pulse: 0 }));
    const hazards = level.hazards.map(data => Object.assign({}, data, {
      path: data.path ? data.path.map(p => Object.assign({}, p)) : null,
      x: data.x || (data.from && data.from.x) || 0,
      y: data.y || (data.from && data.from.y) || 0,
      activeNow: false, warn: 0, hitLock: 0, soundedCycle: -1,
      bodies: []
    }));

    const mute = UI.makeMuteBtn();
    const resumeButton = new UI.Button({
      x: W * 0.5, y: 361, w: 244, h: 66,
      label: '계속 찾기', size: 27, color: '#82d7aa',
      onTap: resumeFromPause
    });
    const rescueButton = new UI.Button({
      x: W * 0.5, y: 411, w: 260, h: 68,
      label: '다시 가자', size: 28, color: '#8ecfe8',
      onTap: resumeFromRescue
    });

    const pauseButton = {
      x: W - 106, y: 40, r: 25, sq: F.makeSquash(),
      pointer(type, x, y) {
        if (type !== 'down') return false;
        if ((x - this.x) ** 2 + (y - this.y) ** 2 > (this.r + 9) ** 2) return false;
        F.squash(this.sq, 0.86, 0.86);
        if (state === 'paused') resumeFromPause(); else pauseGame();
        S.click();
        return true;
      },
      update(dt) { F.updSquash(this.sq, dt); },
      draw(ctx) {
        ctx.save(); ctx.translate(this.x, this.y); ctx.scale(this.sq.sx, this.sq.sy);
        ctx.fillStyle = 'rgba(42,37,75,0.6)';
        ctx.beginPath(); ctx.arc(0, 0, this.r, 0, Math.PI * 2); ctx.fill();
        ctx.strokeStyle = 'rgba(255,255,255,0.5)'; ctx.lineWidth = 2; ctx.stroke();
        ctx.fillStyle = '#fff7dc'; ctx.fillRect(-8, -10, 5, 20); ctx.fillRect(3, -10, 5, 20);
        ctx.restore();
      }
    };

    const stick = { x: 110, y: H - 102, r: 70, pointerId: null, knobX: 0, knobY: 0 };
    const actionButton = { x: W - 91, y: H - 104, r: 60, pointerId: null, down: false };

    function setStick(px, py) {
      let dx = px - stick.x, dy = py - stick.y;
      const len = Math.hypot(dx, dy);
      if (len > stick.r) { dx *= stick.r / len; dy *= stick.r / len; }
      stick.knobX = dx; stick.knobY = dy;
      const dead = 13;
      E.input.setHeld('left', dx < -dead);
      E.input.setHeld('right', dx > dead);
      E.input.setHeld('up', dy < -dead);
      E.input.setHeld('down', dy > dead);
    }

    function releaseStick() {
      stick.pointerId = null; stick.knobX = 0; stick.knobY = 0;
      E.input.setHeld('left', false); E.input.setHeld('right', false);
      E.input.setHeld('up', false); E.input.setHeld('down', false);
    }

    function releaseAction() {
      actionButton.pointerId = null; actionButton.down = false;
      E.input.setHeld('action', false);
    }

    function releaseControls() { releaseStick(); releaseAction(); }

    function showHint(text) {
      hintText = text; hintTime = 4.4;
      S.athena();
      F.sparkle(W * 0.5 - 210, 92, '#d9c9ff', 10);
      UI.announce(text);
    }

    function activeWalls() { return level.walls.filter(w => w.active !== false); }

    function checkpointForCured() {
      for (let i = level.checkpoints.length - 1; i >= 0; i--) {
        if (cured >= level.checkpoints[i].cured) return i;
      }
      return 0;
    }

    function clearInputBuffers() {
      E.input.clearVirtual();
      E.input.clearBuffered();
    }

    function pauseGame() {
      if (state === 'paused' || state === 'rescue' || state === 'clear') return;
      stateBeforePause = state;
      state = 'paused'; stateTime = 0; pauseInputLock = 0.22;
      releaseControls(); clearInputBuffers(); S.pause();
      UI.announce('잠깐 쉬어요. 계속 찾기 버튼을 누르세요.');
    }

    function resumeFromPause() {
      if (state !== 'paused') return;
      state = stateBeforePause === 'intro' ? 'run' : stateBeforePause;
      stateTime = 0; pauseInputLock = 0.2;
      clearInputBuffers(); S.resume();
      UI.announce('다시 친구를 찾아요.');
    }

    function resumeFromRescue() {
      if (state !== 'rescue') return;
      const cp = level.checkpoints[checkpointIndex];
      hearts = 5;
      hero.reset(cp.x, cp.y);
      hero.invin = 1.55;
      cameraX = F.clamp(hero.x - W * 0.34, 0, level.worldW - W);
      cameraY = F.clamp(hero.y - H * 0.5, 0, level.worldH - H);
      state = 'return'; stateTime = 0;
      releaseControls(); clearInputBuffers();
      S.setMusicState('play'); updateMusic(true);
      F.sparkle(W * 0.5, H * 0.5, '#fff09a', 20);
      UI.announce('아테나와 함께 안전한 꽃밭에서 다시 시작해요.');
    }

    function updateMusic(force) {
      let intensity = 0.27;
      if (cured >= 1) intensity = 0.35;
      if (cured >= 2) intensity = 0.44;
      if (hero.x >= 1580) intensity = 0.51;
      if (hero.x >= 2400 && hero.x < 2870) intensity = 0.29;
      if (hero.x >= 2870) intensity = 0.62;
      const band = Math.round(intensity * 100);
      if (force || band !== musicBand) {
        musicBand = band;
        S.setMusicIntensity(intensity, 0.8);
      }
    }

    hero.onStep = function () {
      if (state !== 'run') return;
      const sx = hero.x - cameraX, sy = hero.y - cameraY + 19;
      F.dust(sx, sy, 2, 'rgba(232,219,172,0.5)', 65);
    };

    function angleDelta(a, b) {
      let d = a - b;
      while (d > Math.PI) d -= Math.PI * 2;
      while (d < -Math.PI) d += Math.PI * 2;
      return d;
    }

    function molyNeed(pig) {
      const base = Math.max(1, Number(pig.molyNeed) || 1);
      return assist && pig.id >= 3 ? Math.max(1, base - 1) : base;
    }

    function castProfile() {
      return assist
        ? { range: 180, spread: Math.PI * 0.7, near: 48, buffer: 0.22, repeat: false }
        : { range: 146, spread: Math.PI * 0.46, near: 48, buffer: 0.22, repeat: false };
    }

    function updatePig(pig, dt) {
      F.updSquash(pig.sq, dt);
      pig.targeted = F.damp(pig.targeted, 0, 7, dt);
      pig.scentFlash = Math.max(0, pig.scentFlash - dt);
      pig.dashTime = Math.max(0, pig.dashTime - dt);
      pig.moving = false;
      if (pig.cured) {
        pig.friendT = F.damp(pig.friendT, 1, 5.4, dt);
        pig.vx = F.damp(pig.vx, 0, 14, dt);
        pig.vy = F.damp(pig.vy, 0, 14, dt);
        return;
      }

      pig.moveClock += dt;
      if (pig.restTimer > 0) {
        pig.restTimer -= dt;
        pig.vx = F.damp(pig.vx, 0, 15, dt);
        pig.vy = F.damp(pig.vy, 0, 15, dt);
        return;
      }
      if (pig.rest && pig.moveClock >= pig.rest.every) {
        pig.moveClock -= pig.rest.every;
        pig.restTimer = pig.rest.duration;
        F.squash(pig.sq, 1.14, 0.84);
        return;
      }

      const target = pig.path[pig.pathIndex];
      let dx = target.x - pig.x, dy = target.y - pig.y;
      const distance = Math.hypot(dx, dy);
      if (distance < 12) {
        pig.pathIndex = (pig.pathIndex + 1) % pig.path.length;
        F.squash(pig.sq, 0.9, 1.1);
        return;
      }
      dx /= distance; dy /= distance;
      const speed = pig.speed * (assist ? 0.88 : 1) * (pig.dashTime > 0 ? 1.28 : 1);
      const oldX = pig.x, oldY = pig.y;
      pig.vx = F.damp(pig.vx, dx * speed, 10, dt);
      pig.vy = F.damp(pig.vy, dy * speed, 10, dt);
      pig.x += pig.vx * dt;
      pig.y += pig.vy * dt;
      pig.angle = Math.atan2(pig.vy, pig.vx);
      if (Math.hypot(pig.x - oldX, pig.y - oldY) > 0.2) pig.moving = true;
    }

    function openGateIfReady() {
      if (gateOpened) return;
      const firstTwo = pigs.filter(p => p.id === 1 || p.id === 2).every(p => p.cured);
      if (!firstTwo || simTime < level.tutorial.gateMinTime) return;
      gateOpened = true;
      const wall = level.walls.find(w => w.id === 'meadow-gate-wall');
      if (wall) wall.active = false;
      const sx = 900 - cameraX, sy = 770 - cameraY;
      F.sparkle(sx, sy, '#fff08a', 24);
      F.confetti(sx, sy, 22);
      F.pop(sx, sy - 68, '꽃문이 열렸어요!', '#fff3a4', 23);
      S.pigCheer();
      UI.announce('두 친구를 구했어요. 꽃문이 열렸어요!');
    }

    function updateCheckpoint() {
      const next = checkpointForCured();
      if (next <= checkpointIndex) return;
      checkpointIndex = next;
      const cp = level.checkpoints[next];
      if (cp.heal) hearts = Math.min(5, hearts + cp.heal);
      F.sparkle(hero.x - cameraX, hero.y - cameraY, '#fff0a0', 15);
      F.pop(hero.x - cameraX, hero.y - cameraY - 54, '안전한 꽃밭!', '#fff1a8', 21);
    }

    function curePig(pig) {
      if (!pig || pig.cured || (state !== 'run' && state !== 'intro' && state !== 'return')) return;
      pig.cured = true;
      pig.friendT = 0.02;
      pig.vx = 0; pig.vy = 0;
      F.squash(pig.sq, 1.28, 0.72);
      cured++;
      failures = 0;
      const sx = pig.x - cameraX, sy = pig.y - cameraY;
      F.doHitstop(0.055);
      F.pulseSlowmo(0.62, 0.08, 0.22);
      F.flash('#fff8c7', 0.11);
      F.sparkle(sx, sy, '#ffe879', 24);
      F.confetti(sx, sy - 8, 18);
      F.ring(sx, sy, '#8ff0b8', 24, 0.5);
      F.pop(sx, sy - 60, '친구를 구했어요!', '#fff3a3', 23);
      S.cure(cured);
      S.pigCheer();
      const left = pigs.length - cured;
      UI.announce(left > 0 ? '친구 한 명을 구했어요. ' + left + '명 남았어요.' : '친구들을 모두 구했어요!');
      updateCheckpoint();
      openGateIfReady();
      updateMusic(true);
      if (cured >= pigs.length) triggerClear();
    }

    function soakPig(pig) {
      if (!pig || pig.cured) return;
      landedCasts++;
      failures = 0;
      pig.molyHits++;
      pig.scentFlash = 0.34;
      pig.targeted = 1;
      const need = molyNeed(pig);
      if (pig.molyHits >= need) {
        curePig(pig);
        return;
      }

      pig.dashTime = 0.78;
      pig.restTimer = 0;
      pig.moveClock = 0;
      pig.pathIndex = (pig.pathIndex + 1) % pig.path.length;
      F.squash(pig.sq, 0.78, 1.26);
      const sx = pig.x - cameraX, sy = pig.y - cameraY;
      F.doHitstop(0.025);
      F.ring(sx, sy, '#b9f1ac', 19, 0.34);
      F.sparkle(sx, sy, '#d9f3a8', 9);
      F.pop(sx, sy - 58, '향기 ' + pig.molyHits + ' / ' + need, '#fff3a3', 19);
      S.herbHit(pig.molyHits);
      const left = need - pig.molyHits;
      UI.announce('몰리 향기가 스며들었어요. ' + left + '번 더 맞혀요.');
    }

    function tryCast() {
      if ((state !== 'run' && state !== 'intro' && state !== 'return') || castCooldown > 0) return false;
      if (molyLeaves <= 0) {
        if (!molyHinted) {
          molyHinted = true;
          showHint('먼저 반짝이는 몰리 약초를 찾아보자.');
        }
        castCooldown = 0.25;
        return false;
      }
      castCooldown = assist ? 0.4 : 0.52;
      castTime = 0.24;
      castAngle = hero.facingAngle;
      F.squash(hero.sq, 1.17, 0.83);
      S.herbThrow();
      const hx = hero.x - cameraX, hy = hero.y - cameraY;
      const profile = castProfile();
      const range = profile.range;
      const spread = profile.spread;
      for (let i = 0; i < 7; i++) {
        const a = castAngle + (i - 3) * spread / 8;
        F.spawn({
          x: hx + Math.cos(a) * 16, y: hy + Math.sin(a) * 16,
          vx: Math.cos(a) * (150 + i * 7), vy: Math.sin(a) * (150 + i * 7) - 12,
          drag: 4.2, life: 0.3, size: 7, endSize: 0.3,
          color: i % 2 ? '#8fdda8' : '#fff0a0', shape: 'diamond'
        });
      }

      let best = null, bestScore = Infinity;
      for (const pig of pigs) {
        if (pig.cured) continue;
        const dx = pig.x - hero.x, dy = pig.y - hero.y;
        const distance = Math.hypot(dx, dy);
        const diff = Math.abs(angleDelta(Math.atan2(dy, dx), castAngle));
        if (distance <= range + pig.radius && (distance <= profile.near || diff <= spread * 0.5) && distance < bestScore) {
          best = pig; bestScore = distance;
        }
      }
      if (best) soakPig(best);
      else { missedCasts++; registerFailure(); }
      return true;
    }

    function updateTargeting() {
      const profile = castProfile();
      const range = profile.range + 12;
      const spread = profile.spread + 0.08;
      for (const pig of pigs) {
        if (pig.cured) continue;
        const dx = pig.x - hero.x, dy = pig.y - hero.y;
        const distance = Math.hypot(dx, dy);
        const diff = Math.abs(angleDelta(Math.atan2(dy, dx), hero.facingAngle));
        if (distance <= range && diff <= spread * 0.5) pig.targeted = 1;
      }
    }

    function updateHerbs(dt) {
      for (const herb of herbs) {
        herb.pulse = Math.max(0, herb.pulse - dt);
        if (herb.got) continue;
        if (Math.hypot(hero.x - herb.x, hero.y - herb.y) <= hero.radius + herb.radius * 0.72) {
          herb.got = true;
          molyLeaves++;
          const sx = herb.x - cameraX, sy = herb.y - cameraY;
          F.sparkle(sx, sy, '#b5f0aa', 16);
          F.ring(sx, sy, '#fff0a0', 18, 0.42);
          F.pop(sx, sy - 40, '몰리 향기!', '#fff2a5', 19);
          S.pickup(Math.min(3, molyLeaves));
          UI.announce('몰리 약초를 찾았어요. 약초는 계속 쓸 수 있어요.');
        }
      }
    }

    function registerFailure() {
      failures++;
      if (failures >= 3 && !assist) {
        assist = true;
        showHint('돼지가 쉬면 가까이 가서 약초를 뿌리자.');
      }
    }

    function hurtHero(fromX, fromY) {
      if (state !== 'run' || hero.invin > 0) return;
      let dx = hero.x - fromX, dy = hero.y - fromY;
      const len = Math.hypot(dx, dy) || 1;
      if (!hero.hurt(dx / len, dy / len)) return;
      hearts--;
      registerFailure();
      const sx = hero.x - cameraX, sy = hero.y - cameraY;
      F.doHitstop(0.07);
      F.addShake(0.33, dx, dy);
      F.flash('#ffc0be', 0.13);
      F.debris(sx, sy, '#d6b4e8', 10, dx > 0 ? 1 : -1);
      F.pop(sx, sy - 52, '괜찮아!', '#fff0a0', 22);
      S.hit();
      if (hearts <= 0) {
        state = 'rescue'; stateTime = 0; rescues++;
        releaseControls(); clearInputBuffers();
        F.pulseSlowmo(0.3, 0.12, 0.25);
        S.setMusicState('rescue'); S.athena();
        UI.announce('아테나가 마법을 잠재웠어요. 다시 가자 버튼을 누르세요.');
      }
    }

    function triggerClear() {
      if (state === 'clear') return;
      state = 'clear'; stateTime = 0;
      releaseControls(); clearInputBuffers();
      F.pulseSlowmo(0.28, 0.14, 0.38);
      F.flash('#fff6b8', 0.14);
      S.startBgm('rewardCirce', { intensity: 0.38, fade: 0.48 });
      S.clear();
      UI.announce('친구들을 모두 구했어요. 힘보다 지혜가 빛났어요!');
    }

    function updateOrb(hazard) {
      const path = hazard.path;
      const travel = hazardTime * hazard.speed / 180 + hazard.phase;
      const index = Math.floor(travel) % path.length;
      const next = (index + 1) % path.length;
      const t = F.ease.inOutSine(travel - Math.floor(travel));
      hazard.x = F.lerp(path[index].x, path[next].x, t);
      hazard.y = F.lerp(path[index].y, path[next].y, t);
      hazard.warn = 0.35;
      const ready = simTime >= hazard.minStageTime + 0.8;
      hazard.activeNow = ready;
      hazard.warn = ready ? 0.35 : F.clamp01((simTime - hazard.minStageTime) / 0.8);
      hazard.bodies = [{ x: hazard.x, y: hazard.y, r: hazard.radius, warn: hazard.warn, active: ready ? 1 : 0 }];
    }

    function soundHazardCycle(hazard, cycle) {
      if (hazard.soundedCycle === cycle) return;
      hazard.soundedCycle = cycle;
      S.circeCharm();
    }

    function updateBroom(hazard) {
      const distance = Math.hypot(hazard.to.x - hazard.from.x, hazard.to.y - hazard.from.y);
      const travelDuration = Math.max(0.1, Number(hazard.active) || distance / Math.max(80, hazard.speed));
      const period = hazard.telegraph + travelDuration + hazard.rest;
      const absolute = hazardTime + hazard.phase;
      const cycle = Math.floor(absolute / period);
      const local = absolute - cycle * period;
      hazard.bodies.length = 0;
      hazard.activeNow = false;
      hazard.warn = 0;
      if (local < hazard.telegraph) {
        hazard.warn = F.ease.outQuad(local / hazard.telegraph);
        hazard.x = hazard.from.x; hazard.y = hazard.from.y;
        hazard.bodies.push({ x: hazard.x, y: hazard.y, r: hazard.radius, warn: hazard.warn, active: 0 });
        soundHazardCycle(hazard, cycle);
      } else if (local < hazard.telegraph + travelDuration) {
        const p = F.ease.inOutSine((local - hazard.telegraph) / travelDuration);
        hazard.activeNow = true; hazard.warn = 1;
        hazard.x = F.lerp(hazard.from.x, hazard.to.x, p);
        hazard.y = F.lerp(hazard.from.y, hazard.to.y, p);
        hazard.bodies.push({ x: hazard.x, y: hazard.y, r: hazard.radius, warn: 1, active: 1 });
      }
    }

    function directionVector(name) {
      if (name === 'north') return { x: 0, y: -1 };
      if (name === 'south') return { x: 0, y: 1 };
      if (name === 'west') return { x: -1, y: 0 };
      return { x: 1, y: 0 };
    }

    function updateWaves(hazard) {
      const travelDistance = 500;
      const travelDuration = Math.max(0.1, Number(hazard.active) || travelDistance / Math.max(70, hazard.speed));
      const period = hazard.telegraph + travelDuration + hazard.rest;
      const absolute = hazardTime + hazard.phase;
      const cycle = Math.floor(absolute / period);
      const local = absolute - cycle * period;
      const direction = directionVector(hazard.order[cycle % hazard.order.length]);
      const side = { x: -direction.y, y: direction.x };
      hazard.bodies.length = 0;
      hazard.activeNow = false;
      hazard.warn = 0;
      if (local < hazard.telegraph) {
        hazard.warn = F.ease.outQuad(local / hazard.telegraph);
        soundHazardCycle(hazard, cycle);
        const count = Math.max(1, Number(hazard.count) | 0);
        for (let i = 0; i < count; i++) {
          const offset = i - (count - 1) * 0.5;
          hazard.bodies.push({
            x: hazard.x + direction.x * 48 + side.x * offset * 72,
            y: hazard.y + direction.y * 48 + side.y * offset * 72,
            r: hazard.radius + 7, warn: hazard.warn, active: 0
          });
        }
      } else if (local < hazard.telegraph + travelDuration) {
        const p = (local - hazard.telegraph) / travelDuration;
        const distance = 42 + F.ease.outQuad(p) * travelDistance;
        hazard.activeNow = true; hazard.warn = 1;
        const count = Math.max(1, Number(hazard.count) | 0);
        for (let i = 0; i < count; i++) {
          const offset = i - (count - 1) * 0.5;
          hazard.bodies.push({
            x: hazard.x + direction.x * distance + side.x * offset * 72,
            y: hazard.y + direction.y * distance + side.y * offset * 72,
            r: hazard.radius, warn: 1, active: 1
          });
        }
      }
    }

    function inRestGarden() {
      return level.restZones.some(zone =>
        hero.x >= zone.x && hero.x <= zone.x + zone.w &&
        hero.y >= zone.y && hero.y <= zone.y + zone.h
      );
    }

    function updateHazards(dt) {
      hazardTime += dt * (assist ? 0.86 : 1);
      if (simTime < level.tutorial.hazardsEnabledAfter || inRestGarden()) {
        hazards.forEach(h => { h.bodies.length = 0; h.activeNow = false; h.warn = 0; });
        return;
      }
      for (const hazard of hazards) {
        hazard.hitLock = Math.max(0, hazard.hitLock - dt);
        if (simTime < hazard.minStageTime) continue;
        if (hazard.kind === 'orbLoop') updateOrb(hazard);
        else if (hazard.kind === 'broomLane') updateBroom(hazard);
        else if (hazard.kind === 'cardinalWaves') updateWaves(hazard);
        for (const body of hazard.bodies) {
          if (!body.active || hazard.hitLock > 0) continue;
          if (Math.hypot(hero.x - body.x, hero.y - body.y) <= hero.radius + body.r) {
            hazard.hitLock = 0.85;
            hurtHero(body.x, body.y);
            break;
          }
        }
      }
    }

    function updateCamera(dt) {
      const targetX = F.clamp(hero.x - W * 0.38, 0, level.worldW - W);
      const targetY = F.clamp(hero.y - H * 0.5, 0, level.worldH - H);
      cameraX = F.damp(cameraX, targetX, 6.5, dt);
      cameraY = F.damp(cameraY, targetY, 6.5, dt);
    }

    function togglePauseKey() {
      if (!E.input.buffered('pause', 0.16)) return;
      E.input.consume('pause');
      if (state === 'paused') resumeFromPause(); else pauseGame();
    }

    function updatePlaying(dt) {
      simTime += dt;
      stateTime += dt;
      hintTime = Math.max(0, hintTime - dt);
      castTime = Math.max(0, castTime - dt);
      castCooldown = Math.max(0, castCooldown - dt);

      const canMove = state === 'run' || (state === 'intro' && stateTime > 0.48) ||
        (state === 'return' && stateTime > 0.36);
      hero.update(dt, canMove);
      hero.resolve(activeWalls(), level.bounds);
      for (const pig of pigs) updatePig(pig, dt);
      openGateIfReady();
      updateHerbs(dt);
      updateTargeting();

      if (canMove && E.input.buffered('action', castProfile().buffer) && castCooldown <= 0) {
        E.input.consume('action');
        tryCast();
      }
      if (state === 'run') updateHazards(dt);
      else hazards.forEach(h => { h.bodies.length = 0; h.activeNow = false; });

      if (state === 'intro' && stateTime > 2.05) {
        state = 'run'; stateTime = 0;
      } else if (state === 'return' && stateTime > 1.0) {
        state = 'run'; stateTime = 0;
      }
      updateMusic(false);
      updateCamera(dt);
    }

    function update(dt, dtReal) {
      uiTime += dtReal;
      pauseInputLock = Math.max(0, pauseInputLock - dtReal);
      mute.update(dtReal); pauseButton.update(dtReal);
      const muteChanged = UI.handleMuteKey(mute);
      if (muteChanged && state === 'paused') S.pause();
      togglePauseKey();

      if (state === 'paused') {
        resumeButton.update(dtReal);
        if (pauseInputLock <= 0 &&
            (E.input.buffered('action', 0.16) || E.input.buffered('ok', 0.16))) {
          E.input.consume('action'); E.input.consume('ok'); resumeButton.activate();
        }
        return;
      }
      if (state === 'rescue') {
        stateTime += dtReal;
        rescueButton.update(dtReal);
        if (stateTime > 0.55 &&
            (E.input.buffered('action', 0.16) || E.input.buffered('ok', 0.16))) {
          E.input.consume('action'); E.input.consume('ok'); rescueButton.activate();
        }
        return;
      }
      if (state === 'clear') {
        stateTime += dt;
        for (const pig of pigs) updatePig(pig, dt);
        updateCamera(dt);
        if (!clearBurst && stateTime > 0.28) {
          clearBurst = true;
          F.confetti(W * 0.5, H * 0.42, 64);
          F.sparkle(W * 0.5, H * 0.45, '#ffe878', 28);
        }
        if (stateTime > 1.86 && !finishSent) {
          finishSent = true;
          options.onClear({ stars: molyLeaves });
        }
        return;
      }
      updatePlaying(dt);
    }

    function worldToScreen(x, y) { return { x: x - cameraX, y: y - cameraY }; }

    function drawLeaf(ctx, x, y, scale, angle, color) {
      ctx.save(); ctx.translate(x, y); ctx.rotate(angle || 0); ctx.scale(scale || 1, scale || 1);
      ctx.fillStyle = color || '#77c990'; ctx.strokeStyle = '#426c59'; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.moveTo(-1, 12); ctx.quadraticCurveTo(-18, 0, 0, -18);
      ctx.quadraticCurveTo(18, 0, -1, 12); ctx.closePath(); ctx.fill(); ctx.stroke();
      ctx.strokeStyle = '#f6edab'; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.moveTo(0, 9); ctx.lineTo(0, -12); ctx.stroke();
      ctx.restore();
    }

    function drawHerbs(ctx) {
      for (const herb of herbs) {
        if (herb.got) continue;
        const p = worldToScreen(herb.x, herb.y);
        if (p.x < -80 || p.x > W + 80 || p.y < -80 || p.y > H + 80) continue;
        const pulse = 1 + Math.sin(simTime * 3 + herb.phase) * 0.07;
        ctx.save(); ctx.globalAlpha = 0.22;
        ctx.fillStyle = '#fff2a1'; ctx.beginPath(); ctx.arc(p.x, p.y, 35 * pulse, 0, Math.PI * 2); ctx.fill();
        ctx.restore();
        drawLeaf(ctx, p.x - 10, p.y + 2, 0.82 * pulse, -0.6, '#87d5a0');
        drawLeaf(ctx, p.x + 11, p.y + 3, 0.78 * pulse, 0.6, '#b0e4a1');
        UI.drawStar(ctx, p.x, p.y - 27, 7, simTime * 1.6 + herb.phase, '#fff0a0');
      }
    }

    function decorType(item) {
      if (item.kind === 'olive' || item.kind === 'bush') return 'tree';
      if (item.kind === 'flowerPatch') return 'flowerbed';
      if (item.kind === 'fountain') return 'fountain';
      if (item.kind === 'circeDais') return 'pillar';
      return null;
    }

    function drawDecor(ctx, item) {
      // 충돌용 나무가 같은 좌표에서 이미 그려지므로 장식 사본은 생략한다.
      if (item.kind === 'olive') return;
      const p = worldToScreen(item.x, item.y);
      if (p.x < -120 || p.x > W + 120 || p.y < -120 || p.y > H + 120) return;
      const type = decorType(item);
      if (type) {
        Art.drawWall(ctx, { type, w: type === 'flowerbed' ? 78 : 78, h: type === 'pillar' ? 88 : 72, r: 36 }, p.x, p.y, simTime);
        return;
      }
      if (item.kind === 'sign') {
        ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(-0.04);
        ctx.strokeStyle = '#765640'; ctx.lineWidth = 7; ctx.beginPath(); ctx.moveTo(0, 8); ctx.lineTo(0, -33); ctx.stroke();
        ctx.fillStyle = '#fff0c7'; ctx.strokeStyle = '#654a45'; ctx.lineWidth = 3;
        UI.rr(ctx, -42, -49, 84, 32, 9); ctx.fill(); ctx.stroke();
        drawLeaf(ctx, 0, -33, 0.42, 0, '#77c990'); ctx.restore();
      } else if (item.kind === 'restArch' || item.kind === 'molyBanner') {
        ctx.save(); ctx.translate(p.x, p.y);
        ctx.strokeStyle = '#6a9a71'; ctx.lineWidth = 10;
        ctx.beginPath(); ctx.arc(0, 18, 48, Math.PI, Math.PI * 2); ctx.stroke();
        drawLeaf(ctx, -29, -22, 0.42, -0.5, '#91d59e');
        drawLeaf(ctx, 27, -23, 0.42, 0.5, '#91d59e'); ctx.restore();
      }
    }

    function drawWalls(ctx) {
      for (const wall of level.walls) {
        if (wall.active === false) continue;
        const circle = wall.kind === 'circle';
        const cx = circle ? wall.x : wall.x + wall.w * 0.5;
        const cy = circle ? wall.y : wall.y + wall.h * 0.5;
        const p = worldToScreen(cx, cy);
        const type = wall.id.indexOf('court-column') === 0 ? 'pillar' :
          (wall.id.indexOf('olive') === 0 || wall.id.indexOf('citrus-tree') === 0 ? 'tree' : 'hedge');
        const proxy = Object.assign({}, wall, { type });
        if (circle) { proxy.r = wall.radius; proxy.w = wall.radius * 2; proxy.h = wall.radius * 2; }
        const halfW = circle ? wall.radius : wall.w * 0.5;
        const halfH = circle ? wall.radius : wall.h * 0.5;
        if (p.x + halfW < -24 || p.x - halfW > W + 24 ||
            p.y + halfH < -24 || p.y - halfH > H + 24) continue;
        Art.drawWall(ctx, proxy, p.x, p.y, simTime);
      }
    }

    function drawHazards(ctx) {
      for (const hazard of hazards) {
        if (hazard.kind === 'broomLane' && hazard.warn > 0 && hazard.from && hazard.to) {
          const from = worldToScreen(hazard.from.x, hazard.from.y);
          const to = worldToScreen(hazard.to.x, hazard.to.y);
          ctx.save(); ctx.globalAlpha = 0.32 + hazard.warn * 0.4;
          ctx.strokeStyle = '#684f86'; ctx.lineWidth = 18; ctx.lineCap = 'round';
          ctx.setLineDash([18, 16]); ctx.beginPath(); ctx.moveTo(from.x, from.y); ctx.lineTo(to.x, to.y); ctx.stroke();
          ctx.setLineDash([]);
          const a = Math.atan2(to.y - from.y, to.x - from.x);
          for (let k = 0.28; k < 0.9; k += 0.27) {
            const x = F.lerp(from.x, to.x, k), y = F.lerp(from.y, to.y, k);
            ctx.save(); ctx.translate(x, y); ctx.rotate(a); ctx.fillStyle = '#fff1a8';
            ctx.beginPath(); ctx.moveTo(13, 0); ctx.lineTo(-8, -8); ctx.lineTo(-8, 8); ctx.closePath(); ctx.fill(); ctx.restore();
          }
          ctx.restore();
        }
        for (const body of hazard.bodies) {
          const p = worldToScreen(body.x, body.y);
          if (p.x < -80 || p.x > W + 80 || p.y < -80 || p.y > H + 80) continue;
          Art.drawMagic(ctx, {
            id: hazard.id, phase: hazard.phase, r: body.r,
            warn: body.warn, active: body.active
          }, p.x, p.y, simTime);
        }
      }
    }

    function drawActors(ctx) {
      const actors = pigs.map(pig => ({ kind: pig.cured ? 'friend' : 'pig', y: pig.y, pig }));
      actors.push({ kind: 'hero', y: hero.y });
      actors.push({ kind: 'circe', y: 285 });
      actors.sort((a, b) => a.y - b.y);
      for (const actor of actors) {
        if (actor.kind === 'hero') {
          const p = worldToScreen(hero.x, hero.y);
          const proxy = {
            sq: hero.sq, angle: hero.facingAngle,
            vx: hero.v.x, vy: hero.v.y, moving: hero.moveAmount > 0.08,
            blink: hero.blink, invin: hero.invin
          };
          if (hero.invin <= 0 || Math.floor(uiTime * 14) % 2 === 0) {
            Art.drawHero(ctx, proxy, p.x, p.y, simTime, F.clamp01(castTime / 0.24));
          }
        } else if (actor.kind === 'circe') {
          const p = worldToScreen(3200, 285);
          if (p.x > -90 && p.x < W + 90) Art.drawCirce(ctx, { casting: hazards.some(h => h.warn > 0) ? 1 : 0 }, p.x, p.y, simTime);
        } else {
          const pig = actor.pig;
          const p = worldToScreen(pig.x, pig.y);
          if (p.x < -90 || p.x > W + 90 || p.y < -90 || p.y > H + 90) continue;
          if (actor.kind === 'friend') {
            Art.drawFriend(ctx, Object.assign({}, pig, { celebrate: state === 'clear' }), p.x, p.y, simTime);
          } else {
            Art.drawPig(ctx, Object.assign({}, pig, { molyNeedCurrent: molyNeed(pig) }), p.x, p.y, simTime);
          }
        }
      }
    }

    function drawSilentGuide(ctx) {
      if (molyLeaves <= 0) {
        const herb = herbs.find(h => !h.got);
        if (herb) {
          const p = worldToScreen(herb.x, herb.y);
          const a = Math.atan2(p.y - (hero.y - cameraY), p.x - (hero.x - cameraX));
          const x = hero.x - cameraX + Math.cos(a) * 48;
          const y = hero.y - cameraY + Math.sin(a) * 48;
          ctx.save(); ctx.translate(x, y); ctx.rotate(a);
          ctx.fillStyle = 'rgba(255,246,170,0.9)';
          ctx.beginPath(); ctx.moveTo(16, 0); ctx.lineTo(-6, -9); ctx.lineTo(-6, 9); ctx.closePath(); ctx.fill(); ctx.restore();
        }
      } else if (simTime < 10) {
        const nearest = pigs.filter(p => !p.cured).sort((a, b) =>
          Math.hypot(a.x - hero.x, a.y - hero.y) - Math.hypot(b.x - hero.x, b.y - hero.y))[0];
        if (nearest) {
          const p = worldToScreen(nearest.x, nearest.y);
          ctx.save(); ctx.strokeStyle = 'rgba(255,246,164,0.8)'; ctx.lineWidth = 4; ctx.setLineDash([7, 8]);
          ctx.beginPath(); ctx.arc(p.x, p.y, 40 + Math.sin(simTime * 4) * 3, 0, Math.PI * 2); ctx.stroke(); ctx.restore();
        }
      }
    }

    function drawTouchControls(ctx) {
      if (!E.isTouch || state === 'paused' || state === 'rescue' || state === 'clear') return;
      ctx.save(); ctx.globalAlpha = 0.88;
      ctx.fillStyle = 'rgba(45,42,79,0.26)'; ctx.beginPath(); ctx.arc(stick.x, stick.y, stick.r, 0, Math.PI * 2); ctx.fill();
      ctx.strokeStyle = 'rgba(255,255,255,0.58)'; ctx.lineWidth = 4; ctx.stroke();
      ctx.fillStyle = '#c8efd2'; ctx.beginPath(); ctx.arc(stick.x + stick.knobX, stick.y + stick.knobY, 31, 0, Math.PI * 2); ctx.fill();
      ctx.strokeStyle = '#4e6a62'; ctx.lineWidth = 3; ctx.stroke();

      const pulse = actionButton.down ? 0.9 : 1 + Math.sin(uiTime * 3.2) * 0.025;
      ctx.translate(actionButton.x, actionButton.y); ctx.scale(pulse, pulse);
      ctx.fillStyle = '#fff0a6'; ctx.beginPath(); ctx.arc(0, 0, actionButton.r, 0, Math.PI * 2); ctx.fill();
      ctx.strokeStyle = '#5a526b'; ctx.lineWidth = 4; ctx.stroke();
      drawLeaf(ctx, 0, -12, 0.54, 0, '#7ed39b');
      ctx.fillStyle = '#403751'; ctx.font = '900 20px "Malgun Gothic", sans-serif'; ctx.textAlign = 'center';
      ctx.fillText('약초', 0, 29); ctx.restore();
    }

    function drawHUD(ctx) {
      UI.drawHearts(ctx, 39, 40, hearts, 5);
      ctx.fillStyle = 'rgba(42,37,75,0.58)'; UI.rr(ctx, 28, 69, 174, 44, 22); ctx.fill();
      drawLeaf(ctx, 54, 91, 0.46, -0.15, '#87d5a0');
      ctx.fillStyle = '#fff8df'; ctx.font = '900 20px "Malgun Gothic", sans-serif'; ctx.textAlign = 'left';
      ctx.fillText('찾은 잎 ' + molyLeaves, 76, 98);
      UI.drawProgress(ctx, W * 0.5 - 154, 27, 308, cured / pigs.length);
      ctx.fillStyle = '#fff8df'; ctx.font = '900 16px "Malgun Gothic", sans-serif'; ctx.textAlign = 'center';
      ctx.fillText('친구 ' + cured + ' / ' + pigs.length, W * 0.5, 68);
      pauseButton.draw(ctx); mute.draw(ctx); drawTouchControls(ctx);
    }

    function drawIntro(ctx) {
      if (state !== 'intro') return;
      const enter = F.ease.outBack(F.clamp01((stateTime - 0.05) / 0.46));
      const leave = 1 - F.ease.inQuad(F.clamp01((stateTime - 1.38) / 0.62));
      ctx.save(); ctx.globalAlpha = leave; ctx.translate(W * 0.5, 118); ctx.scale(enter, enter);
      UI.panel(ctx, -270, -55, 540, 110, 24, '#fff8e8');
      ctx.textAlign = 'center'; ctx.fillStyle = '#a45868'; ctx.font = '900 18px "Malgun Gothic", sans-serif';
      ctx.fillText('세 번째 모험', 0, -15);
      ctx.fillStyle = '#342442'; ctx.font = '900 31px "Malgun Gothic", sans-serif';
      ctx.fillText('키르케의 마법 정원', 0, 25); ctx.restore();
    }

    function drawHint(ctx) {
      if (hintTime <= 0) return;
      const enter = F.ease.outBack(F.clamp01((4.4 - hintTime) / 0.42));
      const leave = F.clamp01(hintTime / 0.42);
      ctx.save(); ctx.globalAlpha = leave; ctx.translate(W * 0.5, 101); ctx.scale(enter, enter);
      UI.panel(ctx, -290, -45, 580, 90, 22, '#fff8e8');
      UI.drawOwl(ctx, -235, 0, 0.47, uiTime, true);
      ctx.fillStyle = '#342442'; ctx.font = '900 20px "Malgun Gothic", sans-serif';
      ctx.textAlign = 'left'; ctx.fillText(hintText, -184, 8); ctx.restore();
    }

    function drawRescue(ctx) {
      ctx.fillStyle = 'rgba(38,32,69,0.68)'; ctx.fillRect(0, 0, W, H);
      const pop = F.ease.outBack(F.clamp01(stateTime / 0.48));
      ctx.save(); ctx.translate(W * 0.5, 238); ctx.scale(pop, pop);
      UI.panel(ctx, -310, -128, 620, 236, 28, '#fff8e8');
      UI.drawOwl(ctx, -216, -62, 0.82, uiTime, true);
      ctx.fillStyle = '#a45868'; ctx.font = '900 22px "Malgun Gothic", sans-serif'; ctx.textAlign = 'left';
      ctx.fillText('아테나가 마법을 잠재웠어요.', -136, -58);
      ctx.fillStyle = '#342442'; ctx.font = '900 25px "Malgun Gothic", sans-serif';
      ctx.fillText('구한 친구들은 기다리고 있어!', -136, -15);
      ctx.font = '700 18px "Malgun Gothic", sans-serif'; ctx.fillStyle = '#796476';
      ctx.fillText('안전한 꽃밭에서 다시 시작해요.', -136, 24); ctx.restore();
      if (stateTime > 0.35) rescueButton.draw(ctx, true);
    }

    function drawPause(ctx) {
      ctx.fillStyle = 'rgba(38,32,69,0.64)'; ctx.fillRect(0, 0, W, H);
      UI.panel(ctx, W * 0.5 - 230, 122, 460, 262, 28, '#fff8e8');

    function drawClear(ctx) {
      if (state !== 'clear' || stateTime < 0.24) return;
      const pop = F.ease.outBack(F.clamp01((stateTime - 0.24) / 0.5));

      ctx.strokeText('힘보다 지혜가 빛났어요.', 0, 40); ctx.fillStyle = '#fff8dc';

    function draw(ctx) {
      const shake = E.shake || { x: 0, y: 0 };
      const view = { camX: cameraX, camY: cameraY, time: simTime };
      ctx.save(); ctx.translate(shake.x, shake.y);
      Art.drawBackground(ctx, view, level, simTime);
      F.drawParticles(ctx, -1);
      for (const item of level.decor) drawDecor(ctx, item);
      drawHerbs(ctx);
      drawWalls(ctx);
      drawHazards(ctx);
      drawSilentGuide(ctx);
      if (castTime > 0) {
        const hp = worldToScreen(hero.x, hero.y);
        const profile = castProfile();
        Art.drawHerbCone(ctx, { spread: profile.spread },
          hp.x, hp.y, castAngle, profile.range, simTime, F.clamp01(castTime / 0.24));
      }
      drawActors(ctx);
      F.drawParticles(ctx, 0);
      Art.drawForeground(ctx, view, level, simTime);
      ctx.restore();
      drawHUD(ctx); drawIntro(ctx); drawHint(ctx); drawClear(ctx);
      if (state === 'rescue') drawRescue(ctx);
      if (state === 'paused') drawPause(ctx);
    }

    function pointer(type, x, y, pointerId) {
      if (type === 'cancel') {
        if (stick.pointerId === pointerId || pointerId === undefined) releaseStick();
        if (actionButton.pointerId === pointerId || pointerId === undefined) releaseAction();
        return;
      }
      if (mute.pointer(type, x, y)) { if (state === 'paused') S.pause(); return; }
      if (pauseButton.pointer(type, x, y)) return;
      if (state === 'rescue') { rescueButton.pointer(type, x, y); return; }
      if (state === 'paused') { resumeButton.pointer(type, x, y); return; }
      if (!E.isTouch || state === 'clear') return;

      if (type === 'down') {
        if (stick.pointerId === null && Math.hypot(x - stick.x, y - stick.y) <= stick.r + 18) {
          stick.pointerId = pointerId; setStick(x, y); return;
        }
        if (actionButton.pointerId === null &&
            Math.hypot(x - actionButton.x, y - actionButton.y) <= actionButton.r + 12) {
          actionButton.pointerId = pointerId; actionButton.down = true;
          E.input.setHeld('action', true); return;
        }
      } else if (type === 'move' && stick.pointerId === pointerId) {
        setStick(x, y); return;
      } else if (type === 'up') {
        if (stick.pointerId === pointerId) { releaseStick(); return; }
        if (actionButton.pointerId === pointerId) { releaseAction(); return; }
      }
    }

    return {
      debug: {
        get state() { return state; }, get time() { return simTime; }, get hearts() { return hearts; },
        get cured() { return cured; }, get leaves() { return molyLeaves; }, get checkpoint() { return checkpointIndex; },
        get rescues() { return rescues; }, get assist() { return assist; }, get gateOpen() { return gateOpened; },
        get heroX() { return hero.x; }, get heroY() { return hero.y; }, get castCooldown() { return castCooldown; },
        get hazardTime() { return hazardTime; }, get failures() { return failures; },
        get landedCasts() { return landedCasts; }, get missedCasts() { return missedCasts; },
        get castProfile() { return castProfile(); },
        pigs, herbs, hazards, level
      },
      enter() {
        S.unlock();
        S.startBgm('circe', { intensity: 0.27, fade: 0.75 });
        updateMusic(true);
        UI.announce('세 번째 모험. 방향키로 움직이고 스페이스바로 몰리 약초를 뿌려요.');
      },
      exit() {
        releaseControls(); clearInputBuffers();
        if (state !== 'clear') S.stopBgm();
      },
      update,
      pointer,
      draw
    };
  };
})();

(function () {

  window.ODY = window.ODY || {};

  const A = {};
  const TAU = Math.PI * 2;
  const W = 960;
  const H = 540;

  function n(value, fallback) {
    return Number.isFinite(Number(value)) ? Number(value) : (fallback || 0);
  }

  function clamp(value, low, high) {
    return Math.max(low, Math.min(high, value));
  }

  function wrap(value, span) {
    return ((value % span) + span) % span;
  }

      if (window.ODY.UI && ODY.UI.drawOwl) ODY.UI.drawOwl(ctx, 290, 105 + Math.sin((time || 0) * 3.4) * 5, 0.4, time, true);
    }
    ctx.restore();
  };

  A.drawCardArt = function (ctx, x, y, time) {
    A.drawMemory(ctx, { order: 1, color: '#ffe89a' }, x - 27, y + 3, time, true, 1, false);
    drawLantern(ctx, x + 36, y + 17, 1.05, time, true);
  };

  ODY.Art.underworld = A;
})();
