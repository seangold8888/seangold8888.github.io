<!doctype html>
<html lang="ko">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#17122f">
<title>최신 카드 화면 열기</title>
<style>body{margin:0;min-height:100svh;display:grid;place-content:center;gap:16px;padding:24px;box-sizing:border-box;background:#17122f;color:#fff;font:18px/1.6 system-ui;text-align:center}button{padding:14px;border:0;border-radius:14px;background:#ffdb79;color:#241835;font:inherit}p{max-width:28em;margin:0}</style>
<h1>최신 카드 화면 열기</h1>
<p id="status" role="status">새 화면을 준비하고 있어요. 학습 기록과 카드는 그대로 유지돼요.</p>
<button id="retry" hidden>다시 열기</button>
<script>
(function(){
  const status=document.getElementById("status"),retry=document.getElementById("retry");
  const target=new URL("./?v=history-eight",location.href);
  async function openLatest(){
    retry.hidden=true;
    try{
      if("serviceWorker" in navigator){
        // A separate navigation path bypasses old canonical /cards/ HTML caches.
        // Updating the worker preserves localStorage, IndexedDB and saved progress.
        const registration=await navigator.serviceWorker.register(new URL("../sw.js?v=96",location.href),{
          scope:new URL("../",location.href).href,updateViaCache:"none"
        });
        await registration.update();
        const worker=registration.installing||registration.waiting||registration.active;
        if(!worker)throw Error("worker unavailable");
        if(worker.state!=="activated")await new Promise((resolve,reject)=>{
          const timeout=setTimeout(()=>finish(Error("update timeout")),45000);
          function finish(error){clearTimeout(timeout);worker.removeEventListener("statechange",check);error?reject(error):resolve();}
          function check(){if(worker.state==="activated")finish();else if(worker.state==="redundant")finish(Error("update interrupted"));}
          worker.addEventListener("statechange",check);check();
        });
      }
      location.replace(target.href);
    }catch(error){status.textContent="새 화면을 준비하지 못했어요. 인터넷 연결을 확인하고 다시 눌러 주세요. 저장 기록은 그대로예요.";retry.hidden=false;}
  }
  retry.addEventListener("click",openLatest);openLatest();
}());
</script>
</html>
