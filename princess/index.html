<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<style id="no-zoom-style">*{touch-action:manipulation}</style>
<script id="no-zoom-guard">/* 게임 중 화면이 갑자기 확대되는 것 방지: 핀치·더블탭 줌 차단 */
(function(){var s=function(e){e.preventDefault()};
document.addEventListener('gesturestart',s,{passive:false});
document.addEventListener('gesturechange',s,{passive:false});
document.addEventListener('gestureend',s,{passive:false});
document.addEventListener('dblclick',s,{passive:false});})();</script>
<meta name="theme-color" content="#f7d6ea">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="공주 옷장">
<link rel="apple-touch-icon" href="../icon.png">
<title>공주 옷장: 마음대로 꾸며요!</title>
<style>
  :root{
    --rose:#ff74b8; --rose-deep:#d83e8a; --lilac:#a88cff; --cream:#fff8fc; --ink:#432449; --ink-soft:#806484;
    --gold:#ffd86a; --gold-deep:#e5a82f; --mint:#8ee8d3; --sky:#bfe6ff;
    --panel:#fff; --shadow:0 5px 0 rgba(83,40,91,.13),0 10px 24px rgba(83,40,91,.08);
    --tab-h: 64px;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;height:100dvh}
  html{background:#f7d6ea;overscroll-behavior:none;-webkit-text-size-adjust:100%}
  body{
    font-family:"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif;
    color:var(--ink);
    background:
      radial-gradient(circle at 14% 13%,rgba(255,255,255,.9) 0 4px,transparent 5px),
      radial-gradient(circle at 86% 22%,rgba(255,255,255,.75) 0 3px,transparent 4px),
      radial-gradient(circle at 8% 80%,#ffd8eb 0 12%,transparent 28%),
      radial-gradient(circle at 92% 82%,#d8d0ff 0 13%,transparent 30%),
      linear-gradient(145deg,#ffdcec 0%,#f1ddff 48%,#d7efff 100%);
    -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;
    overflow:hidden;
    display:flex;flex-direction:column;
    padding-top:env(safe-area-inset-top,0px);
  }
  header{
    display:flex;align-items:center;gap:8px;padding:9px 12px 10px;
    background:linear-gradient(180deg,rgba(255,255,255,.64),rgba(255,255,255,.18));
    border-bottom:1px solid rgba(255,255,255,.62);
    box-shadow:0 8px 24px rgba(101,51,108,.07);
    backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
    flex:0 0 auto;
  }
  header h1{font-size:clamp(17px,3vw,27px);font-weight:900;letter-spacing:-.025em;color:var(--ink);flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-shadow:0 2px 0 #fff,0 4px 12px rgba(216,62,138,.13)}
  header h1 span{background:linear-gradient(135deg,#d73386,#8d55d9);background-clip:text;-webkit-background-clip:text;color:transparent}
  .btn{
    border:1px solid rgba(255,255,255,.95);border-radius:16px;background:linear-gradient(160deg,#fff,#fff8fc);color:var(--ink);font-weight:900;
    font-size:clamp(14px,2.4vw,16px);padding:10px 12px;min-height:44px;box-shadow:var(--shadow);cursor:pointer;
    display:inline-flex;align-items:center;gap:6px;line-height:1;font-family:inherit;
    transition:transform .16s,box-shadow .16s,filter .16s;
  }
  .btn:focus-visible,.tab:focus-visible,.item:focus-visible,.sw:focus-visible{outline:4px solid rgba(109,74,205,.45);outline-offset:2px}
  .btn:active{transform:translateY(3px);box-shadow:0 2px 0 rgba(74,44,79,.12)}
  .btn.rose{background:linear-gradient(145deg,#ff9dcd,#ef5aa8 58%,#d63e89);color:#fff;text-shadow:0 1px 0 rgba(0,0,0,.15);box-shadow:0 5px 0 #b83775,0 10px 22px rgba(216,62,138,.2)}
  .btn.gold{background:linear-gradient(145deg,#fff0a5,#ffd05a 58%,#efb63e);color:#654000;box-shadow:0 5px 0 #d19a28,0 10px 22px rgba(193,132,22,.16)}
  .btn .ic{font-size:1.25em}
  main{
    flex:1 1 auto;min-height:0;
    display:grid;grid-template-columns:minmax(0,46%) minmax(0,1fr);
    gap:10px;padding:0 12px calc(10px + env(safe-area-inset-bottom,0px));
  }
  #stageWrap{
    position:relative;min-height:0;display:flex;align-items:center;justify-content:center;isolation:isolate;
  }
  #stageWrap::before{content:"";position:absolute;width:min(96%,520px);aspect-ratio:1;border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,.75),rgba(255,255,255,.08) 54%,transparent 72%);filter:blur(2px);z-index:-1;pointer-events:none}
  #stageCard{height:100%;max-height:100%;aspect-ratio:420/680;max-width:100%;position:relative}
  #stage{
    width:100%;height:100%;
    border-radius:30px;border:5px solid rgba(255,255,255,.98);outline:2px solid rgba(255,205,100,.58);outline-offset:-9px;
    box-shadow:0 24px 48px rgba(91,45,99,.24),0 8px 0 rgba(105,55,112,.1),inset 0 0 0 1px rgba(255,255,255,.8);
    overflow:hidden;background:#fff;position:relative;
    transition:transform .25s;
  }
  #stage.pop{animation:pop .45s ease}
  @keyframes pop{0%{transform:scale(1)}35%{transform:scale(1.04) rotate(-1deg)}70%{transform:scale(.99) rotate(1deg)}100%{transform:scale(1)}}
  #stage svg{display:block;width:100%;height:100%}
  #stage svg .twinkle{transform-box:fill-box;transform-origin:center;animation:twinkle 2.8s ease-in-out infinite}
  #stage svg .twinkle:nth-of-type(2n){animation-delay:-1.1s}
  #stage svg .twinkle:nth-of-type(3n){animation-delay:-2s}
  @keyframes twinkle{0%,100%{opacity:.38;transform:scale(.72)}50%{opacity:1;transform:scale(1.18)}}
  #nameTag{
    position:absolute;left:14px;top:14px;
    background:linear-gradient(160deg,rgba(255,255,255,.97),rgba(255,244,251,.95));border:2px solid rgba(255,216,106,.9);border-radius:999px;padding:8px 17px;font-weight:900;
    font-size:clamp(14px,2.2vw,17px);box-shadow:0 5px 0 rgba(111,61,117,.12),0 10px 22px rgba(74,44,79,.16);white-space:nowrap;pointer-events:none;
  }
  #nameTag small{color:var(--ink-soft);font-weight:800;margin-left:6px}
  #panel{
    min-height:0;display:flex;flex-direction:column;gap:8px;
    background:linear-gradient(155deg,rgba(255,255,255,.9),rgba(255,247,252,.69));border-radius:26px;padding:11px;
    border:1px solid rgba(255,255,255,.86);box-shadow:inset 0 0 0 2px rgba(255,255,255,.7),0 18px 38px rgba(91,45,99,.14);
    backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  }
  #tabs{
    display:flex;gap:6px;overflow-x:auto;flex:0 0 auto;padding-bottom:4px;scrollbar-width:none;
  }
  #tabs::-webkit-scrollbar{display:none}
  .tab{
    flex:0 0 auto;border:1px solid rgba(255,255,255,.95);border-radius:18px;background:linear-gradient(160deg,#fff,#fff7fc);color:var(--ink-soft);font-weight:900;
    padding:8px 12px;font-size:clamp(13px,2vw,14px);display:flex;flex-direction:column;align-items:center;gap:3px;
    box-shadow:var(--shadow);cursor:pointer;min-width:62px;font-family:inherit;
    transition:transform .16s,box-shadow .16s,background .16s;
  }
  .tab:active{transform:translateY(3px)}
  .tab .ic{font-size:clamp(20px,3.4vw,26px);line-height:1}
  .tab.on{background:linear-gradient(145deg,#ff9fd0,#ef62ac 58%,#d74691);color:#fff;text-shadow:0 1px 0 rgba(0,0,0,.15);box-shadow:0 5px 0 #b83b79,0 10px 20px rgba(216,62,138,.18)}
  #swatches{
    display:flex;gap:9px;flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;flex:0 0 auto;padding:9px 8px;align-items:center;
    background:rgba(255,255,255,.5);border-radius:17px;border:1px solid rgba(255,255,255,.76);-webkit-overflow-scrolling:touch;
  }
  #swatches::-webkit-scrollbar{display:none}
  #swatches:empty{display:none}
  #swatches .lbl{font-size:14px;font-weight:900;color:var(--ink-soft);margin-right:2px;white-space:nowrap}
  .sw{
    width:44px;height:44px;min-width:44px;border-radius:50%;border:3px solid #fff;box-shadow:inset 5px 6px 8px rgba(255,255,255,.38),inset -4px -5px 7px rgba(49,24,54,.16),0 3px 8px rgba(74,44,79,.22);cursor:pointer;
    transition:transform .12s;flex:0 0 auto;
  }
  .sw.on{transform:scale(1.12);box-shadow:inset 5px 6px 8px rgba(255,255,255,.36),0 0 0 3px var(--ink),0 4px 10px rgba(74,44,79,.28)}
  #items{
    flex:1 1 auto;min-height:0;overflow-y:auto;
    display:grid;grid-template-columns:repeat(auto-fill,minmax(88px,1fr));gap:8px;align-content:start;
    padding:4px 2px 12px;-webkit-overflow-scrolling:touch;
  }
  .item{
    border:1px solid rgba(255,255,255,.96);border-radius:19px;background:linear-gradient(165deg,#fff,#fff8fc);padding:7px 5px 9px;display:flex;flex-direction:column;align-items:center;gap:5px;
    box-shadow:var(--shadow);cursor:pointer;font-family:inherit;color:var(--ink);font-weight:900;font-size:13px;min-height:44px;
    position:relative;transition:transform .15s,box-shadow .15s,background .15s;
  }
  .item:active{transform:scale(.95)}
  .item.on{box-shadow:0 0 0 4px var(--rose),0 7px 0 rgba(154,46,106,.16),0 14px 24px rgba(216,62,138,.16);background:linear-gradient(160deg,#fff,#fff0f8)}
  .item.on::after{content:"✓";position:absolute;top:5px;right:6px;width:22px;height:22px;border-radius:50%;background:linear-gradient(145deg,#f25baa,#c93480);color:#fff;font-size:14px;display:grid;place-items:center;border:2px solid #fff;box-shadow:0 3px 8px rgba(94,33,75,.28)}
  .item svg{width:100%;aspect-ratio:1;display:block;border-radius:13px;background:radial-gradient(circle at 35% 25%,#fff 0 9%,transparent 10%),linear-gradient(160deg,#fff3fa,#e9f1ff);box-shadow:inset 0 0 0 1px rgba(131,91,144,.08)}
  .item.pr svg{background:radial-gradient(circle at 30% 20%,#fff 0 8%,transparent 9%),linear-gradient(160deg,#ffe7f3,#ded8ff)}
  @media (hover:hover){
    .btn:hover{filter:brightness(1.035);transform:translateY(-1px)}
    .item:hover{transform:translateY(-2px);box-shadow:0 7px 0 rgba(83,40,91,.11),0 14px 24px rgba(83,40,91,.12)}
  }
  .item .nm{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
  #intro{
    flex:0 0 auto;font-size:clamp(14px,2vw,15px);font-weight:800;color:var(--ink-soft);padding:3px 7px;line-height:1.45;
  }
  #intro:empty{display:none}
  /* 세로 화면(아이패드 세로·폰) */
  @media (orientation:portrait){
    main{grid-template-columns:1fr;grid-template-rows:minmax(0,50%) minmax(0,1fr)}
    #stageCard{height:100%}
  }
  @media (max-width:720px){
    header{gap:6px;padding-inline:8px}
    header .btn{padding:9px 10px}
    header h1{font-size:16px}
    main{padding-inline:8px;gap:8px}
  }
  @media (max-width:540px){
    header h1{font-size:0}
    header h1::after{content:"공주 옷장";font-size:16px}
    header .btn-label{display:none}
    header .btn{width:44px;justify-content:center;padding-inline:0}
  }
  /* 오버레이(사진·앨범) */
  .overlay{position:fixed;inset:0;background:rgba(52,27,58,.62);display:none;align-items:center;justify-content:center;z-index:20;padding:16px;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
  .overlay.show{display:flex}
  .sheet{
    background:linear-gradient(160deg,#fff,#fff6fb);border:2px solid rgba(255,255,255,.95);border-radius:28px;padding:16px;max-width:min(92vw,560px);max-height:92vh;max-height:92dvh;display:flex;flex-direction:column;gap:12px;
    box-shadow:0 24px 70px rgba(50,24,56,.34),inset 0 0 0 2px rgba(255,216,106,.24);overflow:hidden;
  }
  .sheet h2{font-size:20px;font-weight:900;display:flex;align-items:center;gap:8px}
  .sheet h2 .sp{flex:1}
  .sheet .row{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
  #photoImg{max-height:58vh;max-height:58dvh;max-width:100%;border-radius:18px;border:4px solid #ffe0f0;outline:2px solid rgba(255,216,106,.45);display:block;margin:0 auto;box-shadow:0 12px 30px rgba(83,40,91,.16);-webkit-touch-callout:default;user-select:auto;-webkit-user-select:auto}
  .hint{font-size:14px;font-weight:800;color:var(--ink-soft);text-align:center}
  #albumGrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:10px;overflow-y:auto;min-height:0;padding:4px}
  #albumGrid .shot{position:relative;border-radius:16px;overflow:hidden;border:3px solid #ffe0f0;background:#fdf3f8;box-shadow:0 8px 18px rgba(83,40,91,.13)}
  #albumGrid .shot img{display:block;width:100%;aspect-ratio:420/680;object-fit:cover}
  #albumGrid .shot button{position:absolute;top:4px;right:4px;border:2px solid #fff;border-radius:50%;width:44px;height:44px;background:rgba(255,255,255,.94);font-weight:900;cursor:pointer;color:#c33;box-shadow:0 3px 10px rgba(60,30,65,.18)}
  #albumGrid .shot .cap{font-size:13px;font-weight:900;text-align:center;padding:5px}
  #albumEmpty{padding:30px;text-align:center;color:var(--ink-soft);font-weight:800}
  #toast{position:fixed;left:50%;top:14px;transform:translateX(-50%) translateY(-80px);background:var(--ink);color:#fff;font-weight:900;padding:10px 18px;border-radius:999px;transition:transform .3s;z-index:30;font-size:14px;pointer-events:none}
  #toast.show{transform:translateX(-50%) translateY(0)}
  .sparkle{position:absolute;pointer-events:none;font-size:26px;animation:spark .8s ease-out forwards;z-index:5}
  @keyframes spark{0%{transform:translate(-50%,-50%) scale(.3);opacity:1}100%{transform:translate(-50%,-50%) translateY(-40px) scale(1.3);opacity:0}}
  @media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}
</style>
</head>
<body>
<header>
  <h1>👑 <span>공주 옷장</span> · 마음대로 꾸며요</h1>
  <button class="btn gold" id="btnRandom"><span class="ic">🎲</span><span class="btn-label">뽑기</span></button>
  <button class="btn rose" id="btnPhoto"><span class="ic">📸</span><span class="btn-label">사진</span></button>
  <button class="btn" id="btnAlbum"><span class="ic">📚</span><span class="btn-label">앨범</span></button>
  <button class="btn" id="btnSound" aria-label="소리 켜기 또는 끄기"><span class="ic" id="soundIc">🔊</span></button>
  <a class="btn" href="../" id="btnHome" aria-label="모험 보드로 돌아가기"><span class="ic">🏠</span></a>
</header>
<main>
  <div id="stageWrap">
    <div id="stageCard">
      <div id="stage"></div>
      <div id="nameTag"></div>
    </div>
  </div>
  <section id="panel">
    <div id="tabs"></div>
    <div id="intro"></div>
    <div id="swatches"></div>
    <div id="items"></div>
  </section>
</main>

<div class="overlay" id="photoOverlay">
  <div class="sheet">
    <h2>📸 찰칵! <span class="sp"></span><button class="btn" id="photoClose">닫기</button></h2>
    <img id="photoImg" alt="공주 사진">
    <p class="hint">사진을 꾹 누르면 저장할 수 있어요</p>
    <div class="row"><button class="btn rose" id="photoSave"><span class="ic">📚</span>앨범에 넣기</button></div>
  </div>
</div>
<div class="overlay" id="albumOverlay">
  <div class="sheet" style="width:min(92vw,720px)">
    <h2>📚 공주 앨범 <span class="sp"></span><button class="btn" id="albumClose">닫기</button></h2>
    <div id="albumGrid"></div>
    <p class="hint">사진은 12장까지 모을 수 있어요</p>
  </div>
</div>
<div id="toast"></div>

<script>
'use strict';
/* =========================================================
   공주 옷장 — 저작권 걱정 없는 옛이야기 공주들(그림·의상 전부 자체 제작 SVG)
   ========================================================= */

// ---------- 색 도우미 ----------
function hexToRgb(h){h=h.replace('#','');if(h.length===3)h=h.split('').map(c=>c+c).join('');const n=parseInt(h,16);return[n>>16&255,n>>8&255,n&255]}
function rgbToHex(r,g,b){return '#'+[r,g,b].map(v=>Math.max(0,Math.min(255,Math.round(v))).toString(16).padStart(2,'0')).join('')}
function mix(a,b,t){const A=hexToRgb(a),B=hexToRgb(b);return rgbToHex(A[0]+(B[0]-A[0])*t,A[1]+(B[1]-A[1])*t,A[2]+(B[2]-A[2])*t)}
const dk=(c,t=.22)=>mix(c,'#3a1f3d',t);
const lt=(c,t=.35)=>mix(c,'#ffffff',t);

const PALETTE=['#ff8fc1','#ff5a6e','#ff9a4d','#ffd93d','#7ad97a','#5fd9c9','#6fc3ff','#8a7dff','#c98bff','#ffffff','#3b3f7a','#8b5a3c'];
const HAIR_PALETTE=['#2b2230','#6b4226','#b07a4a','#f3cc6a','#e0553d','#ff8fc1','#9b6bff','#5fa8ff','#5fd9c9','#e9e4f5'];

// ---------- 인체 좌표(도화지 420×680) ----------
const HEAD={cx:210,cy:125,rx:54,ry:60};
const HANDS={L:[128,345],R:[292,345]};
const FEET={L:[184,572],R:[236,572]};

// ---------- 공주 ----------
const PRINCESSES=[
  {id:'snow',   name:'백설공주',  hair:'bob',     hairColor:'#2b2230', skin:'#fff0e6', eye:'#4a3a2e', intro:'눈처럼 하얀 피부, 숲속 친구들과 사는 공주예요.', def:{dress:['aline','#ffd93d'],shoes:['pumps','#ff5a6e'],crown:['bow','#ff5a6e'],pet:['bird','#6fc3ff'],bg:'forest'}},
  {id:'cinder', name:'신데렐라',  hair:'bun',     hairColor:'#f3cc6a', skin:'#ffdfcc', eye:'#4a7dc2', intro:'유리 구두를 남기고 무도회를 떠난 공주예요.', def:{dress:['ballgown','#6fc3ff'],shoes:['glass','#6fc3ff'],crown:['tiara','#6fc3ff'],neck:['pearls','#ffffff'],pet:['mouse','#c9c9d9'],bg:'ballroom'}},
  {id:'rapunzel',name:'라푼젤',   hair:'braid',   hairColor:'#f3cc6a', skin:'#ffdfcc', eye:'#5fa872', intro:'긴 머리카락을 탑 아래로 내려 주는 공주예요.', def:{dress:['party','#c98bff'],shoes:['sandals','#ffd93d'],crown:['flowers','#ff8fc1'],hand:['bouquet','#ff8fc1'],pet:['frog','#7ad97a'],bg:'tower'}},
  {id:'mermaid',name:'인어공주',  hair:'wavy',    hairColor:'#5fd9c9', skin:'#ffe4d6', eye:'#2f8fb0', intro:'바다 깊은 궁전에서 노래하는 공주예요.', def:{dress:['tail','#5fd9c9'],crown:['pearls','#ffffff'],neck:['gem','#8a7dff'],pet:['fish','#ff9a4d'],bg:'sea'}},
  {id:'thumb',  name:'엄지공주',  hair:'pigtails',hairColor:'#b07a4a', skin:'#ffe4d6', eye:'#7a5230', intro:'꽃잎 속에서 태어난 아주 작은 공주예요.', def:{dress:['summer','#7ad97a'],shoes:['ballet','#ff8fc1'],crown:['flowers','#ff8fc1'],back:['butterfly','#ffd93d'],pet:['butterfly','#c98bff'],bg:'meadow'}},

    '<path d="M258 108 Q265 142 258 170" stroke="'+lo+'" stroke-width="4" fill="none" opacity=".38" stroke-linecap="round"/>';
  const detail={

    wavy:'<path d="M164 164 C150 230 158 300 166 352 M250 170 C266 230 258 302 252 356" stroke="'+hi+'" stroke-width="6" fill="none" opacity=".38" stroke-linecap="round"/>',
    pigtails:'<path d="M137 164 Q146 148 158 165 M261 165 Q272 149 281 166" stroke="'+hi+'" stroke-width="5" fill="none" opacity=".5" stroke-linecap="round"/>',
    daenggi:'<path d="M145 174 Q126 260 132 356" stroke="'+hi+'" stroke-width="5" fill="none" opacity=".38" stroke-linecap="round"/>',

function dressFinishSVG(dress,c){
  if(!dress)return '';
  const hi=lt(c,.62),soft=lt(c,.36),sh=dk(c,.28);
  const bodice=dress.id==='tail'
    ?`<path d="M184 216 Q192 225 200 216 M220 216 Q228 225 236 216" stroke="${hi}" stroke-width="3" fill="none" opacity=".62" stroke-linecap="round"/>`
    :`<path d="M174 216 Q210 202 246 216" stroke="${hi}" stroke-width="4" fill="none" opacity=".55" stroke-linecap="round"/>
      <path d="M170 224 Q174 266 176 292" stroke="${sh}" stroke-width="4" fill="none" opacity=".22" stroke-linecap="round"/>
      <path d="M244 224 Q240 258 242 290" stroke="${hi}" stroke-width="3" fill="none" opacity=".34" stroke-linecap="round"/>`;
  let skirt='';
  if(['ballgown','star','rose','rainbow'].includes(dress.id)){
    skirt=`<path d="M168 312 C138 382 111 468 100 539" stroke="${sh}" stroke-width="9" fill="none" opacity=".22" stroke-linecap="round"/>
      <path d="M230 316 C248 386 274 468 289 536" stroke="${hi}" stroke-width="10" fill="none" opacity=".34" stroke-linecap="round"/>
      <path d="M151 324 Q210 342 269 324" stroke="${soft}" stroke-width="5" fill="none" opacity=".46"/>`;
  }else if(['aline','winter'].includes(dress.id)){
    skirt=`<path d="M165 316 Q142 399 132 490" stroke="${sh}" stroke-width="7" fill="none" opacity=".2" stroke-linecap="round"/>
      <path d="M230 319 Q255 402 271 487" stroke="${hi}" stroke-width="8" fill="none" opacity=".32" stroke-linecap="round"/>`;
  }else if(dress.id==='mermaidline'){
    skirt=`<path d="M176 316 Q172 405 180 487" stroke="${sh}" stroke-width="6" fill="none" opacity=".23" stroke-linecap="round"/>
      <path d="M234 318 Q241 406 232 480" stroke="${hi}" stroke-width="7" fill="none" opacity=".34" stroke-linecap="round"/>`;
  }else if(dress.id==='hanbok'){
    skirt=`<path d="M154 280 C124 366 106 470 96 540" stroke="${sh}" stroke-width="9" fill="none" opacity=".18" stroke-linecap="round"/>
      <path d="M242 282 C270 366 294 468 310 538" stroke="${hi}" stroke-width="10" fill="none" opacity=".3" stroke-linecap="round"/>
      <path d="M192 292 Q210 304 228 292" stroke="#ffd86a" stroke-width="4" fill="none" opacity=".78"/>`;
  }else if(dress.id==='tail'){
    skirt=`<path d="M176 354 Q166 430 190 508" stroke="${sh}" stroke-width="7" fill="none" opacity=".22" stroke-linecap="round"/>
      <path d="M236 354 Q250 426 225 510" stroke="${hi}" stroke-width="8" fill="none" opacity=".38" stroke-linecap="round"/>
      <path d="M112 586 Q158 570 191 540 M308 586 Q262 570 229 540" stroke="${hi}" stroke-width="4" fill="none" opacity=".46"/>`;
  }else if(['party','summer'].includes(dress.id)){
    skirt=`<path d="M170 314 Q151 360 143 416" stroke="${sh}" stroke-width="6" fill="none" opacity=".2" stroke-linecap="round"/>
      <path d="M233 314 Q253 360 271 414" stroke="${hi}" stroke-width="7" fill="none" opacity=".34" stroke-linecap="round"/>`;
  }else if(dress.id==='tutu'){
    skirt=`<path d="M120 330 Q210 350 300 330" stroke="${hi}" stroke-width="5" fill="none" opacity=".45"/>
      <path d="M126 345 Q210 366 294 345" stroke="${sh}" stroke-width="4" fill="none" opacity=".2"/>`;
  }else if(dress.id==='adventure'){
    skirt=`<path d="M176 218 L210 246 L244 218 M210 246 V350" stroke="${hi}" stroke-width="4" fill="none" opacity=".48" stroke-linecap="round"/>
      <path d="M168 365 Q210 378 252 365" stroke="${sh}" stroke-width="3" fill="none" opacity=".36"/>`;
  }
  const glint=['ballgown','star','rose','hanbok'].includes(dress.id)?`<path d="M268 370 l3 7 7 3 -7 3 -3 7 -3 -7 -7 -3 7 -3Z" fill="#fff" opacity=".72"/>
    <circle cx="156" cy="402" r="3" fill="#fff" opacity=".66"/>`:'';
  return `<g id="dressFinish" aria-hidden="true">${bodice}${skirt}${glint}</g>`;
}

const SLOTS=['dress','shoes','crown','neck','hand','back','pet'];

// ---------- 상태 ----------
const SAVE_KEY='princess:outfits', ALBUM_KEY='princess:album', MUTE_KEY='princess:mute';
let outfits={};
try{outfits=JSON.parse(localStorage.getItem(SAVE_KEY)||'{}')||{}}catch(e){outfits={}}
let cur=null; // 현재 공주 id
let state=null; // {hairColor, dress:{id,color}|null, ..., bg}
let tab='princess';
let muted=false; try{muted=localStorage.getItem(MUTE_KEY)==='1'}catch(e){}

function defaultState(p){
  const s={hairColor:p.hairColor,bg:p.def.bg||'plain'};
  for(const k of SLOTS){ const d=p.def[k]; s[k]=d?{id:d[0],color:d[1]}:null; }
  return s;
}
function loadPrincess(id){
  cur=id;
  const p=PRINCESSES.find(x=>x.id===id);
  const base=defaultState(p);
  state=outfits[id]?Object.assign({},base,outfits[id]):base;
  if(!BGS.some(bg=>bg.id===state.bg))state.bg=base.bg;
  for(const k of SLOTS){
    if(state[k]&&!itemOf(k,state[k].id))state[k]=base[k];
  }
  persist();
}
function persist(){
  outfits[cur]=state;
  try{localStorage.setItem(SAVE_KEY,JSON.stringify(outfits));localStorage.setItem('princess:last',cur)}catch(e){}
}
function princess(){return PRINCESSES.find(x=>x.id===cur)}
function itemOf(key,id){const c=CATS.find(x=>x.key===key);return c.list.find(i=>i.id===id)}
function scopeSvgIds(svg,scope){
  return svg
    .replace(/\bid="([^"]+)"/g,(m,id)=>'id="'+scope+'-'+id+'"')
    .replace(/url\(#([^)]+)\)/g,(m,id)=>'url(#'+scope+'-'+id+')');
}

function sceneFloorSVG(tail,bgId){
  const ink=bgId==='night'?'#171337':bgId==='sea'?'#155d78':'#4b3156';
  const y=tail?601:584,rx=tail?132:88;
  return `<g id="groundShadow" aria-hidden="true">
    <ellipse cx="210" cy="${y}" rx="${rx}" ry="20" fill="${ink}" opacity=".13"/>
    <ellipse cx="210" cy="${y-4}" rx="${Math.round(rx*.7)}" ry="10" fill="#fff" opacity=".13"/>
  </g>`;
}
function sceneFinishSVG(bgId){
  const gold=bgId==='night'||bgId==='sea'?'#fff1a6':'#ffd86a';
  const glints=[[34,74,6],[375,118,5],[48,340,4],[365,410,6],[72,535,4],[344,585,4]];
  const star=([x,y,r])=>{const a=+(r*.3).toFixed(1),b=+(r*.7).toFixed(1);return `<path class="twinkle" d="M${x} ${y-r} l${a} ${b} ${b} ${a} -${b} ${a} -${a} ${b} -${a} -${b} -${b} -${a} ${b} -${a}Z" fill="${gold}" opacity=".72"/>`};
  return `<g id="sceneFX" aria-hidden="true">

function dollSVG(st,p){
  const bg=BGS.find(b=>b.id===st.bg)||BGS[0];
  const dress=st.dress?itemOf('dress',st.dress.id):null;
  const tail=!!(dress&&dress.tail);
  const hair=HAIR[p.hair];
  const part=(key)=>{const v=st[key];if(!v)return '';const it=itemOf(key,v.id);return it?it.svg(v.color):''};
  const bgArt=scopeSvgIds(bg.svg(),'stage-bg');
  const dressArt=dress?scopeSvgIds(dress.svg(st.dress.color),'stage-dress'):'';
  return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 680" width="420" height="680" role="img" aria-label="${p.name} 꾸미기">
    <g id="bg">${bgArt}</g>
    ${backgroundDepthSVG(bg.id)}
    ${sceneFloorSVG(tail,bg.id)}
    <g id="doll">
      <g id="back">${part('back')}</g>
      <g id="hairBack">${hair.back(st.hairColor)}${hairDetailSVG(p.hair,st.hairColor,'back')}</g>
      ${bodySVG(p,tail)}
      ${faceSVG(p)}
      <g id="dress">${dressArt}${dress?dressFinishSVG(dress,st.dress.color):''}</g>
      <g id="shoes">${tail?'':part('shoes')}</g>
      <g id="hairFront">${hair.front(st.hairColor)}${hairDetailSVG(p.hair,st.hairColor)}</g>
      <g id="neck">${part('neck')}</g>
      <g id="crown">${part('crown')}</g>
      <g id="hand">${part('hand')}</g>
      <g id="pet">${part('pet')}</g>
    </g>
    ${sceneFinishSVG(bg.id)}
  </svg>`;
}

function thumbSVG(key,item,color){
  const cat=CATS.find(c=>c.key===key);
  let vb=item.vb||cat.vb;
  let inner=scopeSvgIds(item.svg(color),'thumb-'+key+'-'+item.id);
  if(cat.petVb){
    // 펫은 그려지는 위치가 제각각 → transform 좌표를 읽어 주변을 자른다
    const m=inner.match(/translate\((-?\d+\.?\d*) (-?\d+\.?\d*)\)/);
    const x=m?+m[1]:340,y=m?+m[2]:560;
    vb=`${x-60} ${y-62} 120 120`;
  }
  return `<svg viewBox="${vb}" preserveAspectRatio="xMidYMid meet">${inner}</svg>`;
}

function rerenderPanelKeepingPosition(){
  const oldSw=document.getElementById('swatches'),oldItems=document.getElementById('items');
  const swLeft=oldSw.scrollLeft,itemTop=oldItems.scrollTop;
  renderPanel();
  const restore=()=>{
    document.getElementById('swatches').scrollLeft=swLeft;
    document.getElementById('items').scrollTop=itemTop;
  };
  restore();
  requestAnimationFrame(restore);
}

  if(tab==='princess'){
    intro.textContent=`${p.name} — ${p.intro}`;
    sw.innerHTML=`<span class="lbl">머리 색</span>`+HAIR_PALETTE.map(c=>`<button class="sw ${c===state.hairColor?'on':''}" style="background:${c}" data-c="${c}" aria-label="머리색"></button>`).join('');
    sw.querySelectorAll('.sw').forEach(b=>b.addEventListener('click',()=>{state.hairColor=b.dataset.c;persist();click();renderStage();rerenderPanelKeepingPosition();}));
    items.innerHTML=PRINCESSES.map(q=>`<button class="item pr ${q.id===cur?'on':''}" data-id="${q.id}">${princessThumb(q,(outfits[q.id]&&outfits[q.id].hairColor)||q.hairColor)}<span class="nm">${q.name}</span></button>`).join('');
    items.querySelectorAll('.item').forEach(b=>b.addEventListener('click',()=>{loadPrincess(b.dataset.id);tada();renderStage();renderPanel();popStage();}));
    return;
  }
  intro.textContent='';
  const cat=CATS.find(c=>c.key===tab);
  if(tab==='bg'){
    sw.innerHTML='';
    items.innerHTML=cat.list.map(it=>`<button class="item ${it.id===state.bg?'on':''}" data-id="${it.id}"><svg viewBox="0 0 420 680" preserveAspectRatio="xMidYMid slice">${scopeSvgIds(it.svg(),'thumb-bg-'+it.id)}${backgroundDepthSVG(it.id)}</svg><span class="nm">${it.name}</span></button>`).join('');
    items.querySelectorAll('.item').forEach(b=>b.addEventListener('click',()=>{state.bg=b.dataset.id;persist();click();renderStage();renderPanel();}));
    return;
  }
  const curSel=state[tab];
  const curColor=curSel?curSel.color:PALETTE[0];
  sw.innerHTML=`<span class="lbl">색깔</span>`+PALETTE.map(c=>`<button class="sw ${c===curColor?'on':''}" style="background:${c}" data-c="${c}" aria-label="색"></button>`).join('');
  sw.querySelectorAll('.sw').forEach(b=>b.addEventListener('click',()=>{
    const c=b.dataset.c;
    if(state[tab]) state[tab].color=c; else state[tab]={id:cat.list[0].id,color:c};
    persist();click();renderStage();rerenderPanelKeepingPosition();
  }));
  const none=`<button class="item ${!curSel?'on':''}" data-id=""><svg viewBox="0 0 100 100"><text x="50" y="62" text-anchor="middle" font-size="40">🚫</text></svg><span class="nm">없음</span></button>`;
  items.innerHTML=none+cat.list.map(it=>`<button class="item ${curSel&&curSel.id===it.id?'on':''}" data-id="${it.id}">${thumbSVG(tab,it,curColor)}<span class="nm">${it.name}</span></button>`).join('');
  items.querySelectorAll('.item').forEach(b=>b.addEventListener('click',()=>{
    const id=b.dataset.id;
    if(!id){state[tab]=null;}
    else{state[tab]={id,color:curColor};}
    persist();click();renderStage();renderPanel();sparkleAt(b);
  }));
}
function popStage(){const s=document.getElementById('stage');s.classList.remove('pop');void s.offsetWidth;s.classList.add('pop');}
function sparkleAt(el){
  const r=el.getBoundingClientRect();
  ['✨','💖','⭐'].forEach((ch,i)=>{const d=document.createElement('div');d.className='sparkle';d.textContent=ch;d.style.left=(r.left+r.width/2+(i-1)*22)+'px';d.style.top=(r.top+r.height/2)+'px';document.body.appendChild(d);setTimeout(()=>d.remove(),900);});
}

// ---------- 뽑기 ----------
const rnd=a=>a[Math.floor(Math.random()*a.length)];
function randomize(){
  for(const k of SLOTS){
    const cat=CATS.find(c=>c.key===k);
    const chance = k==='dress'?1 : k==='shoes'?.9 : k==='pet'?.8 : .6;
    state[k]=Math.random()<chance?{id:rnd(cat.list).id,color:rnd(PALETTE)}:null;
  }
  if(state.dress&&itemOf('dress',state.dress.id).tail) state.shoes=null;
  state.bg=rnd(BGS).id;
  persist();tada();renderStage();renderPanel();popStage();
  sparkleAt(document.getElementById('stage'));
}

// ---------- 소리 ----------
let actx=null;
function ac(){if(!actx){try{actx=new (window.AudioContext||window.webkitAudioContext)()}catch(e){}}if(actx&&actx.state==='suspended')actx.resume();return actx}
function tone(f,t0,dur,type='sine',vol=.18){const a=ac();if(!a||muted)return;const o=a.createOscillator(),g=a.createGain();o.type=type;o.frequency.value=f;g.gain.setValueAtTime(0,a.currentTime+t0);g.gain.linearRampToValueAtTime(vol,a.currentTime+t0+.01);g.gain.exponentialRampToValueAtTime(.0001,a.currentTime+t0+dur);o.connect(g);g.connect(a.destination);o.start(a.currentTime+t0);o.stop(a.currentTime+t0+dur+.02)}
function click(){tone(880,0,.08,'triangle',.12)}
function tada(){[523,659,784,1047].forEach((f,i)=>tone(f,i*.08,.25,'triangle',.16))}
function shutter(){tone(1200,0,.05,'square',.1);tone(600,.06,.1,'square',.1)}

// ---------- 사진·앨범 ----------
function svgToPng(svgText,w,h){
  return new Promise((res,rej)=>{
    const blob=new Blob([svgText],{type:'image/svg+xml;charset=utf-8'});
    const url=URL.createObjectURL(blob);
    const img=new Image();
    img.onload=()=>{const cv=document.createElement('canvas');cv.width=w;cv.height=h;const ctx=cv.getContext('2d');ctx.drawImage(img,0,0,w,h);URL.revokeObjectURL(url);try{res(cv.toDataURL('image/png'))}catch(e){rej(e)}};
    img.onerror=e=>{URL.revokeObjectURL(url);rej(e)};
    img.src=url;
  });
}
let lastPhoto=null;
async function takePhoto(){
  shutter();
  const st=document.getElementById('stage');
  st.style.filter='brightness(2)';setTimeout(()=>st.style.filter='',120);
  try{
    lastPhoto=await svgToPng(dollSVG(state,princess()),840,1360);
    document.getElementById('photoImg').src=lastPhoto;
    document.getElementById('photoOverlay').classList.add('show');
  }catch(e){toast('사진을 만들지 못했어요');}
}
function album(){try{return JSON.parse(localStorage.getItem(ALBUM_KEY)||'[]')||[]}catch(e){return []}}
function saveAlbum(list){try{localStorage.setItem(ALBUM_KEY,JSON.stringify(list));return true}catch(e){return false}}
async function addToAlbum(){
  if(!lastPhoto)return;
  let list=album();
  // 앨범용은 작게 저장(용량 절약)
  let small=lastPhoto;
  try{small=await svgToPng(dollSVG(state,princess()),420,680)}catch(e){}
  list.unshift({src:small,name:princess().name,t:Date.now()});
  while(list.length>12)list.pop();
  while(list.length&&!saveAlbum(list))list.pop();
  tada();toast('앨범에 넣었어요! 📚');
  document.getElementById('photoOverlay').classList.remove('show');
}
function openAlbum(){
  const list=album();
  const g=document.getElementById('albumGrid');
  g.innerHTML=list.length?list.map((s,i)=>`<div class="shot"><img src="${s.src}" alt="${s.name}"><button data-i="${i}" aria-label="지우기">✕</button><div class="cap">${s.name}</div></div>`).join(''):`<div id="albumEmpty">아직 사진이 없어요.<br>📸 사진을 찍고 앨범에 넣어 보세요!</div>`;
  g.querySelectorAll('button').forEach(b=>b.addEventListener('click',()=>{const l=album();l.splice(+b.dataset.i,1);saveAlbum(l);click();openAlbum();}));
  document.getElementById('albumOverlay').classList.add('show');
}
let toastT=null;
function toast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove('show'),1600);}

// ---------- 시작 ----------
document.getElementById('btnRandom').addEventListener('click',randomize);
document.getElementById('btnPhoto').addEventListener('click',takePhoto);
document.getElementById('btnAlbum').addEventListener('click',()=>{click();openAlbum();});
document.getElementById('btnSound').addEventListener('click',()=>{muted=!muted;try{localStorage.setItem(MUTE_KEY,muted?'1':'0')}catch(e){}document.getElementById('soundIc').textContent=muted?'🔇':'🔊';if(!muted)click();});
document.getElementById('photoClose').addEventListener('click',()=>document.getElementById('photoOverlay').classList.remove('show'));
document.getElementById('photoSave').addEventListener('click',addToAlbum);
document.getElementById('albumClose').addEventListener('click',()=>document.getElementById('albumOverlay').classList.remove('show'));
document.getElementById('soundIc').textContent=muted?'🔇':'🔊';
document.getElementById('stage').addEventListener('click',()=>{popStage();tone(660,0,.12,'sine',.1);});

let last='snow';try{last=localStorage.getItem('princess:last')||'snow'}catch(e){}
if(!PRINCESSES.some(p=>p.id===last))last='snow';
loadPrincess(last);
renderTabs();renderStage();renderPanel();
</script>
