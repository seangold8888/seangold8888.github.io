      <stop offset=".34" stop-color="#fff" stop-opacity=".12"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
    <filter id="fabricPhotoFx" x="0" y="0" width="100%" height="100%" color-interpolation-filters="sRGB">
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer>
        <feFuncR type="linear" slope=".94" intercept=".03"/>
        <feFuncG type="linear" slope=".94" intercept=".03"/>
        <feFuncB type="linear" slope=".94" intercept=".03"/>
      </feComponentTransfer>
    </filter>
    <filter id="fabricFx" x="-18%" y="-12%" width="136%" height="130%" color-interpolation-filters="sRGB">
      <feTurbulence type="fractalNoise" baseFrequency=".025 .5" numOctaves="2" seed="17" result="weave"/>
      <feColorMatrix in="weave" type="matrix" values="0 0 0 0 .42  0 0 0 0 .36  0 0 0 0 .46  0 0 0 .08 0" result="grain"/>
      <feComposite in="grain" in2="SourceGraphic" operator="in" result="clothGrain"/>
      <feBlend in="SourceGraphic" in2="clothGrain" mode="multiply" result="textured"/>
      <feGaussianBlur in="SourceAlpha" stdDeviation="1.4" result="fabricAlpha"/>
      <feSpecularLighting in="fabricAlpha" surfaceScale="3.2" specularConstant=".28" specularExponent="15" lighting-color="#fff" result="fabricShine">
        <feDistantLight azimuth="225" elevation="55"/>
      </feSpecularLighting>
      <feComposite in="fabricShine" in2="SourceAlpha" operator="in" result="fabricClippedShine"/>
      <feBlend in="textured" in2="fabricClippedShine" mode="screen" result="fabricLit"/>
      <feDropShadow in="fabricLit" dx="0" dy="3.5" stdDeviation="2.5" flood-color="#30192f" flood-opacity=".31"/>
    </filter>
    <filter id="accessoryFx" x="-24%" y="-24%" width="148%" height="156%" color-interpolation-filters="sRGB">
      <feGaussianBlur in="SourceAlpha" stdDeviation="1.2" result="softAlpha"/>
      <feSpecularLighting in="softAlpha" surfaceScale="4" specularConstant=".55" specularExponent="18" lighting-color="#fff" result="shine">
        <feDistantLight azimuth="225" elevation="52"/>
      </feSpecularLighting>
      <feComposite in="shine" in2="SourceAlpha" operator="in" result="clippedShine"/>
      <feBlend in="SourceGraphic" in2="clippedShine" mode="screen" result="lit"/>
      <feDropShadow in="lit" dx="0" dy="2.2" stdDeviation="1.7" flood-color="#24152d" flood-opacity=".3"/>
    </filter>
    <filter id="hairFx" x="-16%" y="-12%" width="132%" height="128%" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="3" stdDeviation="2.4" flood-color="#211328" flood-opacity=".3"/>
    </filter>
