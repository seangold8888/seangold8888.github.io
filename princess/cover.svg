    <linearGradient id="dressVolume" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#24142d" stop-opacity=".42"/>
      <stop offset=".14" stop-color="#fff" stop-opacity=".2"/>
      <stop offset=".32" stop-color="#281731" stop-opacity=".2"/>
      <stop offset=".5" stop-color="#fff" stop-opacity=".28"/>
      <stop offset=".7" stop-color="#24142d" stop-opacity=".2"/>
      <stop offset=".87" stop-color="#fff" stop-opacity=".18"/>
      <stop offset="1" stop-color="#24142d" stop-opacity=".44"/>
    </linearGradient>
    <linearGradient id="dressFalloff" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity=".2"/>
      <stop offset=".42" stop-color="#fff" stop-opacity="0"/>
      <stop offset=".76" stop-color="#2a1732" stop-opacity=".07"/>
      <stop offset="1" stop-color="#1e1026" stop-opacity=".3"/>
    </linearGradient>
    <radialGradient id="dressSheen" cx=".36" cy=".26" r=".68">
