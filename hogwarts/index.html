  <script>
  /* keep the iPad screen awake during play (best effort, silent fallback) */
  (function(){
    let lock=null;
    async function grab(){try{lock=await navigator.wakeLock.request('screen');lock.addEventListener('release',()=>{lock=null})}catch(_){lock=null}}
    if('wakeLock' in navigator){
      addEventListener('pointerdown',()=>{if(!lock)grab()},{passive:true});
      document.addEventListener('visibilitychange',()=>{if(!document.hidden&&!lock)grab()});
    }
  })();

  <script>
/* src/engine.js */
(function(){
  'use strict';
  const WQ=window.WQ=window.WQ||{},E=WQ.E={W:960,H:540,time:0,frame:0,fps:60};
  const held=Object.create(null),pressed=Object.create(null);let canvas,ctx,last=0,dpr=1,scale=1,ox=0,oy=0,scene=null;
  const map={ArrowUp:'up',KeyW:'up',ArrowDown:'down',KeyS:'down',ArrowLeft:'left',KeyA:'left',ArrowRight:'right',KeyD:'right',Space:'cast',Enter:'ok',Escape:'pause',KeyP:'pause'};
  const input=E.input={
    held:a=>!!held[a],buffered:(a,t=.14)=>pressed[a]!=null&&E.time-pressed[a]<=t,
    press(a){if(!held[a])pressed[a]=E.time;held[a]=true},release(a){held[a]=false},consume(a){delete pressed[a]},
    clear(){Object.keys(held).forEach(k=>held[k]=false);Object.keys(pressed).forEach(k=>delete pressed[k])}
  };
  function resize(){const cw=innerWidth,ch=innerHeight;dpr=Math.min(2,devicePixelRatio||1);canvas.width=Math.round(cw*dpr);canvas.height=Math.round(ch*dpr);scale=Math.min(cw/E.W,ch/E.H);ox=(cw-E.W*scale)/2;oy=(ch-E.H*scale)/2}
  function point(e){const r=canvas.getBoundingClientRect();return{x:(e.clientX-r.left-ox)/scale,y:(e.clientY-r.top-oy)/scale}}
  E.setScene=s=>{scene?.exit?.();input.clear();WQ.Feel.reset();scene=s;scene?.enter?.()};
  E.announce=t=>{document.getElementById('live').textContent=t};
  E.init=c=>{canvas=c;ctx=c.getContext('2d',{alpha:false,desynchronized:true});resize();addEventListener('resize',resize,{passive:true});
    addEventListener('keydown',e=>{const a=map[e.code];if(!a)return;e.preventDefault();WQ.Snd.unlock();input.press(a)},{passive:false});
    addEventListener('keyup',e=>{const a=map[e.code];if(a){e.preventDefault();input.release(a)}},{passive:false});
    addEventListener('blur',()=>input.clear());document.addEventListener('visibilitychange',()=>{if(document.hidden){input.clear();WQ.Snd.pause()}});
    c.addEventListener('pointerdown',e=>{e.preventDefault();WQ.Snd.unlock();const p=point(e);scene?.pointer?.('down',p.x,p.y,e.pointerId)},{passive:false});
    c.addEventListener('pointerup',e=>{e.preventDefault();const p=point(e);scene?.pointer?.('up',p.x,p.y,e.pointerId)},{passive:false});
    const cancelPointer=e=>{e.preventDefault();const p=point(e);scene?.pointer?.('up',p.x,p.y,e.pointerId);input.release('cast')};
    c.addEventListener('pointercancel',cancelPointer,{passive:false});c.addEventListener('lostpointercapture',cancelPointer,{passive:false});
    document.querySelectorAll('[data-action]').forEach(b=>{const a=b.dataset.action;b.addEventListener('pointerdown',e=>{e.preventDefault();e.stopPropagation();WQ.Snd.unlock();input.press(a)});['pointerup','pointercancel','pointerleave','lostpointercapture'].forEach(n=>b.addEventListener(n,e=>{e.preventDefault();input.release(a)}))});
    requestAnimationFrame(frame)};
  function frame(now){requestAnimationFrame(frame);const raw=Math.min(.04,Math.max(0,(now-last)/1000||0));last=now;E.time+=raw;E.frame++;if(raw)E.fps+=(1/raw-E.fps)*Math.min(1,raw*2);const F=WQ.Feel;let dt=raw*F.timescale;if(F.hitstop>0){F.hitstop=Math.max(0,F.hitstop-raw);dt=0}scene?.update?.(dt,raw);F.update(dt,raw);
    ctx.setTransform(dpr,0,0,dpr,0,0);ctx.fillStyle='#17142d';ctx.fillRect(0,0,canvas.width/dpr,canvas.height/dpr);ctx.setTransform(scale*dpr,0,0,scale*dpr,ox*dpr,oy*dpr);ctx.save();ctx.beginPath();ctx.rect(0,0,E.W,E.H);ctx.clip();const sh=F.shake();ctx.translate(sh.x,sh.y);scene?.draw?.(ctx);F.draw(ctx);ctx.restore()}
})();

</script>
  <script>
/* src/gamefeel.js */
(function(){
  'use strict';const WQ=window.WQ,F=WQ.Feel={},TAU=Math.PI*2,parts=[],pops=[];let trauma=0,clock=0,flash=0,flashColor='#fff',slow=null;
  F.timescale=1;F.hitstop=0;F.ease={out:t=>1-Math.pow(1-t,3),back:t=>1+2.70158*Math.pow(t-1,3)+1.70158*Math.pow(t-1,2),bounce:t=>{const n=7.5625,d=2.75;if(t<1/d)return n*t*t;if(t<2/d){t-=1.5/d;return n*t*t+.75}if(t<2.5/d){t-=2.25/d;return n*t*t+.9375}t-=2.625/d;return n*t*t+.984375}};
  F.clamp=(v,a,b)=>Math.max(a,Math.min(b,v));F.lerp=(a,b,t)=>a+(b-a)*t;F.damp=(a,b,k,dt)=>F.lerp(a,b,1-Math.exp(-k*dt));
  F.squash=()=>({x:1,y:1,vx:0,vy:0});F.kick=(s,x,y)=>{s.x=x;s.y=y;s.vx=s.vy=0};F.updateSquash=(s,dt)=>{s.vx+=(1-s.x)*180*dt;s.vy+=(1-s.y)*180*dt;s.vx*=Math.exp(-15*dt);s.vy*=Math.exp(-15*dt);s.x=F.clamp(s.x+s.vx*dt,.65,1.4);s.y=F.clamp(s.y+s.vy*dt,.65,1.4)};
  F.stop=s=>F.hitstop=Math.max(F.hitstop,s);F.bump=n=>trauma=Math.min(1,trauma+n);F.blink=(c,a=.18)=>{flashColor=c;flash=Math.max(flash,a)};F.slow=(scale=.3,hold=.18,recover=.45)=>{slow={scale,hold,recover,t:0};F.timescale=scale};
  F.spawn=o=>{if(parts.length>360)parts.shift();parts.push(Object.assign({x:0,y:0,vx:0,vy:0,g:0,drag:0,life:.5,age:0,size:5,end:.1,color:'#fff',shape:'dot',rot:0,vr:0,layer:0},o))};
  F.spark=(x,y,c='#ffe273',n=12)=>{F.ring(x,y,c);for(let i=0;i<n;i++){const a=i/n*TAU+Math.random()*.2,s=90+Math.random()*170;F.spawn({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,g:170,drag:2,life:.45+Math.random()*.25,size:3+Math.random()*4,color:c,shape:i%3?'diamond':'star',vr:(Math.random()-.5)*12})}};
  F.dust=(x,y,c='rgba(237,218,187,.7)')=>{for(let i=0;i<3;i++)F.spawn({x:x+Math.random()*16-8,y,vx:-80-Math.random()*80,vy:-20-Math.random()*45,g:80,drag:1.5,life:.4,size:6+Math.random()*5,end:1.4,color:c,shape:'puff',layer:-1})};
  F.ring=(x,y,c)=>F.spawn({x,y,color:c,life:.32,size:10,end:3.5,shape:'ring'});F.pop=(x,y,text,c='#fff')=>pops.push({x,y,text,c,t:0,life:.75});
  F.confetti=(x,y,n=52)=>{const cs=['#ff7ca8','#ffd85c','#65d9a4','#66b9ff','#a986ff'];for(let i=0;i<n;i++){const a=-Math.PI/2+(Math.random()-.5)*1.7,s=180+Math.random()*350;F.spawn({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,g:480,drag:.7,life:1.1+Math.random()*.7,size:5+Math.random()*6,color:cs[i%cs.length],shape:i%4?'confetti':'star',vr:(Math.random()-.5)*18})}};
  F.update=(dt,real)=>{clock+=real;trauma=Math.max(0,trauma-real*2.7);flash=Math.max(0,flash-real*3);if(slow){slow.t+=real;if(slow.t>slow.hold){const p=Math.min(1,(slow.t-slow.hold)/slow.recover);F.timescale=F.lerp(slow.scale,1,F.ease.out(p));if(p===1)slow=null}}for(let i=parts.length-1;i>=0;i--){const p=parts[i];p.age+=dt;if(p.age>=p.life){parts.splice(i,1);continue}p.vy+=p.g*dt;const d=Math.exp(-p.drag*dt);p.vx*=d;p.vy*=d;p.x+=p.vx*dt;p.y+=p.vy*dt;p.rot+=p.vr*dt}for(let i=pops.length-1;i>=0;i--){pops[i].t+=dt;if(pops[i].t>=pops[i].life)pops.splice(i,1)}};
  function star(ctx,r){ctx.beginPath();for(let i=0;i<8;i++){const a=-Math.PI/2+i*Math.PI/4,rr=i%2?r:r*.42;i?ctx.lineTo(Math.cos(a)*rr,Math.sin(a)*rr):ctx.moveTo(Math.cos(a)*rr,Math.sin(a)*rr)}ctx.closePath()}
  F.drawLayer=(ctx,layer=0)=>{for(const p of parts){if(p.layer!==layer)continue;const t=p.age/p.life,a=Math.min(1,(1-t)*2.5),s=p.size*F.lerp(1,p.end,F.ease.out(t));ctx.save();ctx.globalAlpha=a;ctx.translate(p.x,p.y);ctx.rotate(p.rot);ctx.fillStyle=p.color;ctx.strokeStyle=p.color;if(p.shape==='ring'){ctx.lineWidth=3*(1-t)+1;ctx.beginPath();ctx.arc(0,0,s,0,TAU);ctx.stroke()}else if(p.shape==='star'){star(ctx,s);ctx.fill()}else if(p.shape==='diamond'){ctx.beginPath();ctx.moveTo(0,-s);ctx.lineTo(s*.5,0);ctx.lineTo(0,s);ctx.lineTo(-s*.5,0);ctx.fill()}else if(p.shape==='puff'){ctx.beginPath();ctx.arc(-s*.3,0,s*.65,0,TAU);ctx.arc(s*.3,0,s*.6,0,TAU);ctx.arc(0,-s*.35,s*.55,0,TAU);ctx.fill()}else if(p.shape==='confetti')ctx.fillRect(-s,-s*.4,s*2,s*.8);else{ctx.beginPath();ctx.arc(0,0,s,0,TAU);ctx.fill()}ctx.restore()}};
  F.draw=ctx=>{F.drawLayer(ctx,0);for(const p of pops){const t=p.t/p.life;ctx.save();ctx.globalAlpha=1-t;ctx.translate(p.x,p.y-F.ease.out(t)*45);ctx.font='900 22px Malgun Gothic';ctx.textAlign='center';ctx.lineWidth=5;ctx.strokeStyle='#292040';ctx.strokeText(p.text,0,0);ctx.fillStyle=p.c;ctx.fillText(p.text,0,0);ctx.restore()}if(flash){ctx.save();ctx.globalAlpha=flash;ctx.fillStyle=flashColor;ctx.fillRect(-20,-20,1000,580);ctx.restore()}};
  F.shake=()=>{const a=trauma*trauma;return{x:Math.sin(clock*53)*a*10,y:Math.sin(clock*71+1)*a*7}};F.reset=()=>{parts.length=pops.length=0;trauma=flash=F.hitstop=0;F.timescale=1;slow=null};
})();

</script>
  <script>
/* src/audio.js */
/* Web Audio API로 효과음과 장면별 음악을 직접 합성한다. */
(function(){
  'use strict';
  const WQ=window.WQ,S=WQ.Snd={muted:false};
  const themes={menu:{root:196,notes:[0,3,7,10,12,10,7,3],tempo:470,wave:'sine'},forest:{root:220,notes:[0,2,3,7,9,12,14,15],tempo:420,wave:'triangle'},stairs:{root:196,notes:[0,5,7,10,12,17,15,10,7,3],tempo:350,wave:'triangle'},potion:{root:233,notes:[0,3,7,8,12,8,7,3,5,0],tempo:395,wave:'sine'},quidditch:{root:262,notes:[0,4,7,12,16,12,9,7,4,2],tempo:290,wave:'triangle'},require:{root:311,notes:[0,3,7,12,15,12,7,3,5,2],tempo:460,wave:'sine'},defense:{root:196,notes:[0,7,12,7,0,5,12,16,12,7],tempo:320,wave:'triangle'},clear:{root:220,notes:[0,4,7,12,11,7,4,7],tempo:510,wave:'sine'}};
  let ac,master,musicTimer=0,step=0,unlocked=false,customAudio=null,customUrl='',currentTheme='menu';
  function init(){if(ac)return;ac=new(window.AudioContext||window.webkitAudioContext)();master=ac.createGain();master.gain.value=.42;const comp=ac.createDynamicsCompressor();comp.threshold.value=-18;comp.ratio.value=4;master.connect(comp);comp.connect(ac.destination)}
  function stopMusicClock(){if(musicTimer){clearInterval(musicTimer);musicTimer=0}}
  function tone(freq,dur=.12,type='sine',gain=.07,when=0,slide=1){if(S.muted)return;init();const t=ac.currentTime+when,o=ac.createOscillator(),g=ac.createGain();o.type=type;o.frequency.setValueAtTime(freq,t);o.frequency.exponentialRampToValueAtTime(Math.max(30,freq*slide),t+dur);g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(gain,t+.008);g.gain.exponentialRampToValueAtTime(.0001,t+dur);o.connect(g);g.connect(master);o.start(t);o.stop(t+dur+.03)}

  S.unlock=()=>{init();if(ac.state==='suspended')ac.resume();unlocked=true;if(S.muted)return;if(customAudio){if(customAudio.paused)customAudio.play().catch(()=>{});return}if(!musicTimer)S.music(currentTheme)};
  S.pause=()=>{stopMusicClock();if(ac&&ac.state==='running')ac.suspend();customAudio?.pause()};
  S.cast=()=>{tone(620,.09,'triangle',.07,0,1.7);tone(980,.12,'sine',.04,.035,1.35)};
  S.hit=()=>{noise(.12,.06);tone(150,.16,'sawtooth',.07,0,.45)};S.star=()=>{tone(660,.08,'sine',.065);tone(880,.11,'sine',.055,.07);tone(1320,.16,'triangle',.04,.14)};
  S.shield=()=>{tone(330,.16,'sine',.06);tone(660,.24,'triangle',.05,.04,1.45)};S.clear=()=>[440,554,660,880].forEach((n,i)=>tone(n,.32,'triangle',.065,i*.1,1.02));S.click=()=>tone(520,.06,'sine',.04);
  S.music=themeId=>{if(themes[themeId]){if(currentTheme!==themeId)step=0;currentTheme=themeId}stopMusicClock();if(S.muted||!unlocked)return;if(customAudio){customAudio.volume=.34;customAudio.loop=true;customAudio.play().catch(()=>{});return}const theme=themes[currentTheme],play=()=>{const degree=theme.notes[step%theme.notes.length],freq=theme.root*Math.pow(2,degree/12);tone(freq,.38,theme.wave,.025);if(step%2===0)tone(freq/2,.46,'sine',.018,.02);step++};play();musicTimer=setInterval(play,theme.tempo)};
  S.setCustomMusic=file=>{const valid=file&&(String(file.type).startsWith('audio/')||/\.(mp3|wav|m4a|ogg|flac)$/i.test(file.name||''));if(!valid)return false;stopMusicClock();customAudio?.pause();if(customUrl)URL.revokeObjectURL(customUrl);customUrl=URL.createObjectURL(file);customAudio=new Audio(customUrl);customAudio.loop=true;customAudio.preload='auto';customAudio.volume=.34;if(unlocked&&!S.muted)customAudio.play().catch(()=>{});return true};
  S.toggle=()=>{S.muted=!S.muted;if(master)master.gain.value=S.muted?0:.42;if(S.muted){stopMusicClock();customAudio?.pause()}else S.music(currentTheme);return S.muted};
  document.getElementById('mute').onclick=()=>{const off=S.toggle(),b=document.getElementById('mute');b.textContent=off?'🔇':'🔊';b.setAttribute('aria-label',off?'소리 켜기':'소리 끄기')};

  const idb=()=>new Promise((res,rej)=>{const q=indexedDB.open('wq-audio',1);q.onupgradeneeded=()=>q.result.createObjectStore('handles');q.onsuccess=()=>res(q.result);q.onerror=()=>rej(q.error)});

    try{

      if(h&&await playHandle(h))saveHandle(h);
    }catch(_){}
  }
  pickButton.onclick=async()=>{

    if(window.showOpenFilePicker){pickWithHandles();return}
    picker.value='';picker.click();
  };
  picker.onchange=()=>{const file=picker.files?.[0];if(S.setCustomMusic(file))labelFor(file.name)};

  (async()=>{
    if(!window.showOpenFilePicker)return;

    }catch(_){}
  })();
  /* default soundtrack: any theme.* the family drops into assets/music/

     LAN server streams it, and without the file the synth tunes play. */
  (async()=>{
    if(location.protocol==='file:')return;
    for(const name of ['theme.mp3','theme.m4a','theme.wav','theme.ogg']){
      try{
        const r=await fetch('music/'+name,{method:'HEAD'});
        if(!r.ok)continue;
        if(customAudio)return;                       /* a picked track wins */
        stopMusicClock();
        customAudio=new Audio('music/'+name);customAudio.loop=true;customAudio.preload='auto';customAudio.volume=.34;
        if(unlocked&&!S.muted)customAudio.play().catch(()=>{});
        labelFor(name);
        return;
      }catch(_){}
    }
  })();
})();

      if(gold||tell){ctx.fillStyle='rgba(43,34,75,.82)';rounded(ctx,boss.x-95,boss.y-118,190,34,14);ctx.fill();ctx.fillStyle=gold?'#fff4b1':'#ffd3a0';ctx.font='950 17px Malgun Gothic';ctx.textAlign='center';ctx.fillText(gold?'지금! 주문!':'곧 하품해요…',boss.x,boss.y-95);ctx.textAlign='left'}
    }
    function drawShots(ctx){for(const b of shots){ctx.strokeStyle='rgba(255,235,130,.5)';ctx.lineWidth=7;ctx.beginPath();ctx.moveTo(b.x-b.vx*.02,b.y-b.vy*.02);ctx.lineTo(b.x,b.y);ctx.stroke();ctx.fillStyle=b.ready?'#fff3a0':'#cbb5ef';ctx.beginPath();ctx.arc(b.x,b.y,b.r,0,TAU);ctx.fill()}}
    function drawPlayer(ctx){
      const moving=Math.hypot(p.vx,p.vy)>24,bob=moving?Math.sin(p.walk)*3:Math.sin(totalTime*2.2)*1.4;
      ctx.save();ctx.translate(p.x,p.y+bob);ctx.globalAlpha=p.inv>0&&Math.floor(p.inv*12)%2?.42:1;ctx.scale(p.sq.x,p.sq.y);
      ctx.fillStyle='rgba(25,19,45,.24)';ctx.beginPath();ctx.ellipse(0,32,24,9,0,0,TAU);ctx.fill();
      WQ.Characters.drawHero(ctx,hero,{t:totalTime,walk:p.walk,moving,tool:'ladle'});
      ctx.restore();
    }
    function drawHud(ctx){
      ctx.fillStyle='rgba(25,20,52,.78)';rounded(ctx,18,18,292,62,18);ctx.fill();ctx.fillStyle='#fff';ctx.font='900 17px Malgun Gothic';ctx.fillText('하트  '+('♥'.repeat(p.hp)+'♡'.repeat(p.max-p.hp)),34,44);ctx.fillStyle='#ffe570';ctx.fillText('별  '+p.stars,34,68);
      ctx.fillStyle='rgba(25,20,52,.72)';rounded(ctx,670,19,270,49,17);ctx.fill();ctx.fillStyle='#fff';ctx.font='950 16px Malgun Gothic';ctx.textAlign='center';ctx.fillText((room+1)+'구간  '+roomNames[room],805,49);ctx.textAlign='left';
      if(room<=2){ctx.fillStyle='rgba(25,20,52,.7)';rounded(ctx,720,79,220,37,14);ctx.fill();ctx.fillStyle='#bcefff';ctx.font='900 14px Malgun Gothic';ctx.textAlign='center';ctx.fillText('받은 재료  '+got+' / '+need,830,103);ctx.textAlign='left'}
      if(room===4&&boss){ctx.fillStyle='rgba(25,20,52,.75)';rounded(ctx,350,82,260,42,15);ctx.fill();ctx.fillStyle='#ffe36d';ctx.font='950 19px Malgun Gothic';ctx.textAlign='center';ctx.fillText('솥의 소동  '+('✦'.repeat(boss.hp)+'·'.repeat(3-boss.hp)),480,110);ctx.textAlign='left'}
    }
    function drawPrompt(ctx){
      let text='';if(room===0&&roomTime<9)text=roomTime<4.5?'좌우로 움직여 재료를 받아요':'국자로 반짝 재료를 받아요';
      else if(room===1&&roomTime<7)text='초록 연기가 오면 스페이스바!';
      else if(room===2&&roomTime<7)text='레시피의 빛나는 색만 받아요';
      else if(room===3&&roomTime<6)text='괜찮아. 별을 모으며 쉬어 가요.';
      else if(room===4&&boss?.state==='vulnerable')text='지금! 금빛 솥에 주문!';
      else if(room<4&&objectiveDone()&&roomTime>=minTimes[room])text='문이 열렸어요! 오른쪽 문으로 가요';
      else if(room<4&&objectiveDone())text='조금만 더 연습하고 가요';if(!text)return;
      ctx.fillStyle='rgba(255,248,223,.94)';rounded(ctx,270,478,420,50,19);ctx.fill();ctx.fillStyle='#3c3156';ctx.font='950 18px Malgun Gothic';ctx.textAlign='center';ctx.fillText(text,480,509);ctx.textAlign='left';
    }
    function draw(ctx){
      drawBackdrop(ctx);F.drawLayer(ctx,-1);drawDoor(ctx);drawRecipe(ctx);drawItems(ctx);drawDrops(ctx);
      if(room===4)drawBoss(ctx);drawSmokes(ctx);drawShots(ctx);drawPlayer(ctx);drawHud(ctx);drawPrompt(ctx);
      if(rescue>0){const q=clamp(rescue/1.2,0,1);ctx.fillStyle='rgba(25,20,52,'+(.45+.25*q)+')';ctx.fillRect(0,0,960,540);ctx.fillStyle='#fff8df';ctx.font='950 32px Malgun Gothic';ctx.textAlign='center';ctx.fillText('괜찮아! 다시 해 보자.',480,250);ctx.font='800 19px Malgun Gothic';ctx.fillText(helper.name+'가 연기를 걷어 내고 있어요.',480,286);ctx.textAlign='left'}
      if(transition){const a=1-Math.abs(transition.t-.42)/.42;ctx.fillStyle='rgba(35,29,65,'+clamp(a,0,1)+')';ctx.fillRect(0,0,960,540)}
    }
    function pointer(type,x){if(type==='down'&&x>560){pointerCast=true;E.input.press('cast')}if(type==='up'&&pointerCast){pointerCast=false;E.input.release('cast')}}
    if(WQ.DEBUG)WQ._potion={
      state:()=>({room,roomTime,got,need,hp:p.hp,wisdom:p.wisdom,hits:p.hits,recipeAt,drops:drops.length,smokes:smokes.length,boss:boss&&{hp:boss.hp,state:boss.state}}),
      skip:()=>{got=need;items.forEach(it=>it.got=true);roomTime=Math.max(roomTime,minTimes[room])},
      warp:(x,y)=>{p.x=x;p.y=y},hitBoss:()=>hitBoss(),openBoss:()=>{if(boss){boss.state='vulnerable';boss.t=0;boss.dur=9}},hurt:()=>hurt()
    };
    return{enter,exit,update,draw,pointer};
  }
  WQ.PotionClass=PotionClass;
})();

</script>
  <script>
/* src/stages/quidditch.js */
(function(){
  'use strict';
  const WQ=window.WQ,E=WQ.E,F=WQ.Feel,S=WQ.Snd,TAU=Math.PI*2;
  const clamp=F.clamp,damp=F.damp,lerp=F.lerp;

  function Quidditch(onClear){
    const hero=WQ.Characters?.current?.()||{name:'해리',speed:1,cast:.19,spell:8,hp:5};
    const helper=WQ.Characters?.helper?.()||{name:'헤르미온느'};
    const roomNames=['골대 통과 연습','블러저 피하기','반짝 링 이어 날기','쉬는 구름','황금 스니치'];
    const minTimes=[11,22,32,9,0];
    let room=0,roomTime=0,totalTime=0,rings=[],bludgers=[],items=[],shots=[];
    let bludgerClock=99,bludgerSerial=0,doorGlow=0,rescue=0,failures=0,assist=1,assistShown=false;
    let transition=null,boss=null,done=false,clearDelay=0,delivered=false,castBuffer=0,pointerCast=false;
    const p={x:200,y:280,vx:0,vy:0,r:20,hp:hero.hp,max:hero.hp,inv:1.5,castCd:0,tilt:0,trail:0,
      sq:F.squash(),hits:0,stars:0,wisdom:0};

    function rounded(ctx,x,y,w,h,r){ctx.beginPath();ctx.roundRect?ctx.roundRect(x,y,w,h,r):ctx.rect(x,y,w,h)}
    function ease(t){return F.ease.out(clamp(t,0,1))}
    function addRing(x,y,move=0){rings.push({x,y,base:y,move,r:46,age:Math.random()*TAU,got:false})}
    function addItem(x,y){items.push({x,y,got:false,age:Math.random()*TAU})}
    function announceRoom(){
      const lines=[
        '반짝이는 링을 통과해요.',
        '블러저가 날아와요. 스페이스 주문으로 튕겨 내요.',
        '움직이는 링을 이어서 통과해요.',
        '구름 위에서 별을 모으며 쉬어요.',
        '스니치가 금빛으로 반짝일 때 주문을 써요.'
      ];E.announce(roomNames[room]+'. '+lines[room]);
    }
    function setupRoom(next){
      room=next;roomTime=0;rings=[];bludgers=[];items=[];shots=[];boss=null;doorGlow=0;bludgerClock=99;
      p.x=200;p.y=280;p.vx=p.vy=0;p.inv=Math.max(p.inv,1.2);
      if(room===0){addRing(430,200);addRing(650,330);addRing(820,180)}
      else if(room===1){addRing(400,160);addRing(600,360);addRing(790,200);addRing(560,120);bludgerClock=6}
      else if(room===2){addRing(400,230,64);addRing(590,260,86);addRing(770,230,70);addRing(480,340,52);addRing(680,150,58);bludgerClock=7}
      else if(room===3){
        [[360,180],[480,300],[610,160],[730,300],[540,120]].forEach(q=>addItem(q[0],q[1]));
        p.hp=Math.min(p.max,p.hp+1);F.pop(p.x,p.y-32,'하트 +1','#ff9fb9');S.shield?.();
      }else{
        boss={x:660,y:230,fromX:660,fromY:230,toX:660,toY:230,hp:3,max:3,round:0,state:'recover',t:0,dur:2,
          hops:0,flash:0,wing:0,inv:0};bludgerClock=8;
      }
      announceRoom();
    }
    function enter(){setupRoom(0);S.music?.('quidditch')}
    function exit(){if(pointerCast)E.input.release('cast');pointerCast=false}

    function objectiveDone(){
      if(room===3)return items.length>0&&items.every(it=>it.got);
      if(room<=2)return rings.length>0&&rings.every(r=>r.got);
      return false;
    }
    function noteFailure(){
      failures++;if(failures>=3&&assist===1){assist=.82;if(!assistShown){assistShown=true;E.announce(helper.name+'가 블러저를 느리게 했어요. 천천히 다시 해봐요!')}}
    }
    function hurt(){
      if(p.inv>0||rescue||done)return;p.hp--;p.hits++;p.inv=1.4;noteFailure();
      F.stop(.055);F.bump(.26);F.blink('#ffb08a',.13);F.kick(p.sq,1.26,.75);F.spark(p.x,p.y,'#ffc9a3',12);S.hit?.();
      if(p.hp<=0){p.hp=p.max;rescue=1.2;p.inv=2.4;p.vx=p.vy=0;E.announce(helper.name+'의 도움 마법! 관중석 위에서 다시 날아요.');F.slow(.35,.22,.5)}
    }
    function spawnBludger(){
      const lanes=[130,240,340,430],y=lanes[bludgerSerial++%lanes.length];
      bludgers.push({x:1015,y,base:y,age:0,warn:.8,vx:-(room===2?185:room===4?175:150)*assist,wobble:Math.random()*TAU,dead:false});
    }
    function updateBludgers(dt){
      if((room===1&&roomTime>6)||(room===2&&roomTime>7)||(room===4&&roomTime>8&&boss?.hp<3)){
        bludgerClock-=dt;if(bludgerClock<=0){spawnBludger();bludgerClock=(room===1?4.4:room===2?3.2:3.6)/assist}
      }
      for(const b of bludgers){
        b.age+=dt;if(b.age>b.warn){b.x+=b.vx*dt;b.y=b.base+Math.sin(b.age*2.6+b.wobble)*34}
        if(!b.dead&&b.age>b.warn&&Math.hypot(b.x-p.x,b.y-p.y)<p.r+17)  {b.dead=true;hurt()}
      }
      bludgers=bludgers.filter(b=>!b.dead&&b.x>-70&&b.age<9);
    }
    function passRings(dt){
      for(const r of rings){
        r.age+=dt;if(r.move)r.y=r.base+Math.sin(r.age*1.15)*r.move;
        if(!r.got&&Math.hypot(r.x-p.x,r.y-p.y)<r.r-12){
          r.got=true;p.stars++;p.wisdom++;
          F.stop(.025);F.ring(r.x,r.y,'#ffe98e');F.spark(r.x,r.y,'#ffe98e',16);F.kick(p.sq,1.15,.88);
          F.pop(r.x,r.y-30,'통과!','#fff2a0');S.star?.();
        }
      }
    }
    function collectItems(dt){
      for(const it of items){
        if(it.got)continue;it.age+=dt;
        if(Math.hypot(it.x-p.x,it.y-p.y)<p.r+18){it.got=true;p.stars++;
          F.stop(.025);F.spark(it.x,it.y,'#ffe778',15);F.kick(p.sq,1.14,.88);F.pop(it.x,it.y,'별 +1','#fff2a0');S.star?.()}
      }
    }
    function cast(){
      if(rescue||done)return;p.castCd=Math.max(.72,hero.cast*4.6);F.kick(p.sq,.84,1.18);S.cast?.();
      if(room===4&&boss){
        const dx=boss.x-p.x,dy=boss.y-p.y,d=Math.hypot(dx,dy)||1,sp=720+hero.spell*8;
        shots.push({x:p.x+26,y:p.y-8,vx:dx/d*sp,vy:dy/d*sp,r:7+hero.spell*.22,life:1.45,ready:boss.state==='vulnerable'});
        F.ring(p.x+26,p.y-8,'#fff1a0');return;
      }
      /* a star burst that knocks nearby bludgers away */
      const range=160+hero.spell*6;let popped=0;
      for(const b of bludgers){if(!b.dead&&b.age>b.warn&&Math.hypot(b.x-p.x,b.y-p.y)<range){b.dead=true;popped++;p.wisdom++;
        F.spark(b.x,b.y,'#ffd98a',16);F.pop(b.x,b.y,'튕겨 냈다!','#fff0c9')}}
      F.ring(p.x,p.y,popped?'#ffd98a':'#fff1a0');
      if(!popped&&room>=1&&room<=2)F.pop(p.x,p.y-40,'블러저가 가까이 오면 다시!','#eee4ff');
    }
    function beginSnitchFlight(){
      if(!boss||boss.hp<=0)return;const perches=[[300,150],[760,140],[520,320],[820,330],[380,400],[640,110]];
      let q=perches[(bludgerSerial+boss.hops*2+boss.round)%perches.length];
      if(Math.hypot(q[0]-boss.x,q[1]-boss.y)<110)q=perches[(bludgerSerial+boss.hops*2+boss.round+2)%perches.length];
      boss.fromX=boss.x;boss.fromY=boss.y;boss.toX=q[0];boss.toY=q[1];boss.state='flight';boss.t=0;boss.dur=.95;boss.hops--;
    }
    function startSnitchCycle(){boss.hops=4+boss.round;beginSnitchFlight()}
    function hitBoss(){
      if(!boss||boss.state!=='vulnerable'||boss.inv>0)return;boss.hp--;boss.round++;boss.flash=.2;boss.inv=.25;p.wisdom++;
      F.stop(.075);F.bump(.26);F.blink('#fff2a0',.12);F.spark(boss.x,boss.y,'#ffe06b',22);
      F.pop(boss.x,boss.y-34,boss.hp?'거의 잡았어!':'스니치를 잡았다!','#fff2a0');S.star?.();
      if(boss.hp<=0){finish();return}boss.state='recover';boss.t=0;boss.dur=1.5;
    }
    function updateBoss(dt){
      if(!boss||done)return;boss.t+=dt;boss.flash=Math.max(0,boss.flash-dt);boss.inv=Math.max(0,boss.inv-dt);boss.wing+=dt*(boss.state==='flight'?18:9);
      if(boss.state==='recover'){
        boss.y+=Math.sin(boss.wing)*9*dt;if(boss.t>=boss.dur)startSnitchCycle();
      }else if(boss.state==='flight'){
        const q=ease(boss.t/boss.dur);boss.x=lerp(boss.fromX,boss.toX,q);boss.y=lerp(boss.fromY,boss.toY,q)-Math.sin(q*Math.PI)*60;
        if(boss.t>=boss.dur){boss.x=boss.toX;boss.y=boss.toY;if(boss.hops>0)beginSnitchFlight();else{boss.state='tell';boss.t=0;boss.dur=1.1}}
      }else if(boss.state==='tell'){
        if(boss.t>=boss.dur){boss.state='vulnerable';boss.t=0;boss.dur=[1.55,1.35,1.15][Math.min(2,boss.round)]+(assist<1?.3:0);E.announce('지금이야! 금빛 스니치에 주문을 써요!')}
      }else if(boss.state==='vulnerable'&&boss.t>=boss.dur){
        noteFailure();F.pop(boss.x,boss.y-30,'괜찮아, 다시 쫓자!','#e8dcff');boss.state='recover';boss.t=0;boss.dur=.85;
      }
    }
    function updateShots(dt){
      for(const b of shots){
        b.life-=dt;if(b.ready&&boss&&boss.state==='vulnerable'){
          const dx=boss.x-b.x,dy=boss.y-b.y,d=Math.hypot(dx,dy)||1;b.vx=damp(b.vx,dx/d*790,5,dt);b.vy=damp(b.vy,dy/d*790,5,dt);
        }
        b.x+=b.vx*dt;b.y+=b.vy*dt;
        if(boss&&Math.hypot(b.x-boss.x,b.y-boss.y)<b.r+24){
          b.life=0;if(b.ready&&boss.state==='vulnerable')hitBoss();else{F.spark(b.x,b.y,'#bba5df',7);F.pop(b.x,b.y,'아직이야!','#e8dcff')}
        }
      }shots=shots.filter(b=>b.life>0&&b.x>-30&&b.x<990&&b.y>-30&&b.y<570);
    }
    function finish(){
      if(done)return;done=true;clearDelay=1.05;F.stop(.08);F.slow(.24,.38,.75);F.bump(.35);F.confetti(boss.x,boss.y,76);S.clear?.();
      E.announce('황금 스니치를 잡았어요! 별빛 경기 승리!');
    }
    function beginNext(){if(transition)return;transition={t:0,next:room+1,switched:false};S.clear?.();F.slow(.55,.08,.22)}

    function update(dt,raw=dt){
      if(done){F.updateSquash(p.sq,dt);clearDelay-=dt;if(clearDelay<=0&&!delivered){delivered=true;const rating=p.hits<=1&&p.wisdom>=14?3:p.hits<=4&&p.wisdom>=9?2:1;onClear({stars:rating,wisdom:p.wisdom,hits:p.hits,time:Math.round(totalTime*10)/10,card:'황금 스니치',reward:'별빛 수색꾼 배지'})}return}
      if(transition){transition.t+=dt;if(!transition.switched&&transition.t>=.42){transition.switched=true;setupRoom(transition.next)}if(transition.t>=.84)transition=null;F.updateSquash(p.sq,dt);return}
      totalTime+=dt;roomTime+=dt;p.inv=Math.max(0,p.inv-dt);p.castCd=Math.max(0,p.castCd-dt);castBuffer=Math.max(0,castBuffer-dt);F.updateSquash(p.sq,dt);
      if(rescue>0){rescue=Math.max(0,rescue-(raw||dt));if(rescue===0){p.x=200;p.y=280;p.vx=p.vy=0;castBuffer=0;F.ring(p.x,p.y,'#d8caff');F.kick(p.sq,.82,1.18)}return}
      let ix=(E.input.held('right')?1:0)-(E.input.held('left')?1:0),iy=(E.input.held('down')?1:0)-(E.input.held('up')?1:0),mag=Math.hypot(ix,iy);
      if(mag){ix/=mag;iy/=mag}
      p.vx=damp(p.vx,ix*250*hero.speed,ix?13:8,dt);p.vy=damp(p.vy,iy*250*hero.speed,iy?13:8,dt);
      p.x=clamp(p.x+p.vx*dt,90,880);p.y=clamp(p.y+p.vy*dt,95,462);p.tilt=damp(p.tilt,iy*.28,9,dt);
      if((Math.abs(p.vx)+Math.abs(p.vy)>30)&&!((E.frame+p.trail++)%5))F.dust(p.x-44,p.y+13,'rgba(255,222,150,.3)');
      if(E.input.buffered('cast',.18)){E.input.consume('cast');castBuffer=.18}if(castBuffer>0&&p.castCd<=0){castBuffer=0;cast()}
      passRings(dt);updateBludgers(dt);collectItems(dt);
      if(room===4){updateBoss(dt);updateShots(dt)}
      const ready=objectiveDone()&&roomTime>=minTimes[room];doorGlow=damp(doorGlow,ready?1:0,6,dt);
      if(room<4&&ready&&p.x>820&&p.y<160)beginNext();
    }

    function drawBackdrop(ctx){
      const sky=ctx.createLinearGradient(0,0,0,540);sky.addColorStop(0,'#5a4f9e');sky.addColorStop(.55,'#8b6fc0');sky.addColorStop(1,'#f0b68f');ctx.fillStyle=sky;ctx.fillRect(0,0,960,540);
      ctx.fillStyle='rgba(255,244,202,.5)';for(let i=0;i<26;i++){const x=(i*89+Math.sin(i*5)*30)%960,y=(i*41)%300;ctx.globalAlpha=.3+.3*Math.sin(totalTime*2+i);ctx.beginPath();ctx.arc(x,y,1.2+(i%3)*.7,0,TAU);ctx.fill()}ctx.globalAlpha=1;
      /* stands ringing the pitch */
      ctx.fillStyle='#3d3061';ctx.beginPath();ctx.moveTo(0,470);for(let x=0;x<=960;x+=60)ctx.lineTo(x,470-Math.sin(x*.011+.6)*26);ctx.lineTo(960,540);ctx.lineTo(0,540);ctx.fill();
      ctx.fillStyle='#514285';for(let i=0;i<12;i++){const x=30+i*82;rounded(ctx,x,486+((i%2)*7),52,40,9);ctx.fill()}
      /* cheering dots in the stands */
      for(let i=0;i<22;i++){const x=42+i*42,y=498+Math.sin(totalTime*3+i)*4;ctx.fillStyle=['#ffd66f','#ff8fb5','#66c8ff','#8ee0ad'][i%4];ctx.beginPath();ctx.arc(x,y,4,0,TAU);ctx.fill()}
      /* banner towers */
      ctx.fillStyle='#2c2450';[70,890].forEach(x=>{rounded(ctx,x-16,300,32,190,10);ctx.fill()});
      [70,890].forEach((x,i)=>{const wave=Math.sin(totalTime*3+i*2)*7;ctx.fillStyle=i?'#66c8ff':'#ff8fb5';ctx.beginPath();ctx.moveTo(x-14,300);ctx.quadraticCurveTo(x+18+wave,316,x-14,338);ctx.closePath();ctx.fill()});
      /* goal hoops far side */
      ctx.strokeStyle='rgba(255,240,190,.4)';ctx.lineWidth=6;
      [[180,120],[480,90],[780,120]].forEach(q=>{ctx.beginPath();ctx.arc(q[0],q[1]-40,26,0,TAU);ctx.stroke();ctx.beginPath();ctx.moveTo(q[0],q[1]-14);ctx.lineTo(q[0],q[1]+40);ctx.stroke()});
    }
    function drawDoor(ctx){
      if(room>=4)return;const ready=objectiveDone()&&roomTime>=minTimes[room],pulse=1+Math.sin(roomTime*5)*.05*doorGlow;
      ctx.save();ctx.translate(868,112);ctx.scale(pulse,pulse);
      ctx.strokeStyle=ready?'#ffe584':'#5a5080';ctx.shadowColor=ready?'#ffe584':'transparent';ctx.shadowBlur=24*doorGlow;ctx.lineWidth=9;
      ctx.beginPath();ctx.arc(0,0,42,0,TAU);ctx.stroke();ctx.shadowBlur=0;
      ctx.fillStyle=ready?'rgba(255,229,132,.25)':'rgba(90,80,128,.15)';ctx.beginPath();ctx.arc(0,0,38,0,TAU);ctx.fill();
      ctx.fillStyle=ready?'#fff5b5':'#8b81ad';ctx.font='950 17px Malgun Gothic';ctx.textAlign='center';ctx.fillText(ready?'통과!':'잠김',0,6);ctx.textAlign='left';ctx.restore();
    }
    function drawRings(ctx){
      for(const r of rings){
        const pulse=1+Math.sin(r.age*4)*.05;
        ctx.save();ctx.translate(r.x,r.y);ctx.scale(pulse,pulse);
        ctx.strokeStyle=r.got?'rgba(255,233,142,.25)':'#ffe98e';ctx.shadowColor=r.got?'transparent':'#ffe98e';ctx.shadowBlur=r.got?0:20;
        ctx.lineWidth=10;ctx.beginPath();ctx.arc(0,0,r.r,0,TAU);ctx.stroke();ctx.shadowBlur=0;
        if(!r.got){ctx.strokeStyle='rgba(255,255,255,.5)';ctx.lineWidth=3;ctx.beginPath();ctx.arc(0,0,r.r-9,0,TAU);ctx.stroke()}
        ctx.restore();
      }
    }
    function drawBludgers(ctx){
      for(const b of bludgers){
        if(b.age<b.warn){const a=.22+.2*Math.sin(b.age*18);ctx.save();ctx.globalAlpha=a;ctx.strokeStyle='#ffb08a';ctx.lineWidth=4;ctx.setLineDash([15,14]);ctx.beginPath();ctx.moveTo(38,b.base);ctx.lineTo(922,b.base);ctx.stroke();ctx.setLineDash([]);ctx.fillStyle='#ffd0b0';ctx.font='900 22px serif';ctx.fillText('›',900,b.base+7);ctx.restore();continue}
        ctx.save();ctx.translate(b.x,b.y);ctx.rotate(b.age*4);
        ctx.fillStyle='#4b4557';ctx.beginPath();ctx.arc(0,0,16,0,TAU);ctx.fill();
        ctx.strokeStyle='#6e6880';ctx.lineWidth=3;ctx.beginPath();ctx.arc(0,0,16,.3,2.4);ctx.stroke();
        ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(-5,-3,3.4,0,TAU);ctx.arc(5,-3,3.4,0,TAU);ctx.fill();
        ctx.fillStyle='#2c2838';ctx.beginPath();ctx.arc(-5,-3,1.6,0,TAU);ctx.arc(5,-3,1.6,0,TAU);ctx.fill();
        ctx.strokeStyle='#2c2838';ctx.lineWidth=2.2;ctx.beginPath();ctx.arc(0,5,5,.15*Math.PI,.85*Math.PI);ctx.stroke();
        ctx.restore();
      }
    }
    function drawItems(ctx){
      for(const it of items){if(it.got)continue;const pulse=1+Math.sin(it.age*7)*.13;
        ctx.save();ctx.globalAlpha=.85;ctx.fillStyle='#f4ecff';ctx.beginPath();ctx.ellipse(it.x,it.y+22,30,10,0,0,TAU);ctx.ellipse(it.x-18,it.y+25,18,8,0,0,TAU);ctx.ellipse(it.x+18,it.y+25,18,8,0,0,TAU);ctx.fill();ctx.restore();
        ctx.save();ctx.translate(it.x,it.y);ctx.scale(pulse,pulse);ctx.rotate(it.age*.4);ctx.fillStyle='#ffe36d';ctx.shadowColor=ctx.fillStyle;ctx.shadowBlur=18;ctx.beginPath();for(let i=0;i<10;i++){const a=-Math.PI/2+i*Math.PI/5,r=i%2?6:15;i?ctx.lineTo(Math.cos(a)*r,Math.sin(a)*r):ctx.moveTo(Math.cos(a)*r,Math.sin(a)*r)}ctx.closePath();ctx.fill();ctx.restore()}
    }
    function drawBoss(ctx){
      if(!boss)return;const gold=boss.state==='vulnerable',tell=boss.state==='tell',flap=Math.sin(boss.wing)*.5;
      ctx.save();ctx.translate(boss.x,boss.y);ctx.scale(1+(boss.flash>0?.2:0),1-(boss.flash>0?.14:0));
      ctx.shadowColor=gold?'#ffe36d':tell?'#ffb366':'#e8dcb8';ctx.shadowBlur=gold?34:tell?22:14;
      /* wings */
      ctx.fillStyle=gold?'#fff4c9':'rgba(255,250,230,.92)';
      ctx.save();ctx.rotate(-.4+flap);ctx.beginPath();ctx.ellipse(-22,-4,22,8,-.3,0,TAU);ctx.fill();ctx.restore();
      ctx.save();ctx.rotate(.4-flap);ctx.beginPath();ctx.ellipse(22,-4,22,8,.3,0,TAU);ctx.fill();ctx.restore();
      /* body */
      ctx.fillStyle=gold?'#ffdf70':tell?'#f0b45c':'#d8c268';ctx.beginPath();ctx.arc(0,0,13,0,TAU);ctx.fill();ctx.shadowBlur=0;
      ctx.strokeStyle='rgba(120,90,20,.5)';ctx.lineWidth=2;ctx.beginPath();ctx.arc(0,0,13,0,TAU);ctx.stroke();
      ctx.beginPath();ctx.moveTo(-9,-3);ctx.quadraticCurveTo(0,3,9,-3);ctx.stroke();
      ctx.fillStyle='rgba(255,255,255,.8)';ctx.beginPath();ctx.arc(-4,-5,3,0,TAU);ctx.fill();
      ctx.restore();
      if(gold||tell){ctx.fillStyle='rgba(43,34,75,.82)';rounded(ctx,boss.x-95,boss.y-72,190,34,14);ctx.fill();ctx.fillStyle=gold?'#fff4b1':'#ffd3a0';ctx.font='950 17px Malgun Gothic';ctx.textAlign='center';ctx.fillText(gold?'지금! 주문!':'곧 반짝여요…',boss.x,boss.y-49);ctx.textAlign='left'}
    }
    function drawShots(ctx){for(const b of shots){ctx.strokeStyle='rgba(255,235,130,.5)';ctx.lineWidth=7;ctx.beginPath();ctx.moveTo(b.x-b.vx*.02,b.y-b.vy*.02);ctx.lineTo(b.x,b.y);ctx.stroke();ctx.fillStyle=b.ready?'#fff3a0':'#cbb5ef';ctx.beginPath();ctx.arc(b.x,b.y,b.r,0,TAU);ctx.fill()}}
    function drawRider(ctx){
      ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.tilt);ctx.globalAlpha=p.inv>0&&Math.floor(p.inv*12)%2?.42:1;ctx.scale(p.sq.x,p.sq.y);ctx.translate(0,Math.sin(totalTime*7)*2);
      ctx.strokeStyle='#8f552e';ctx.lineWidth=7;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(-52,26);ctx.lineTo(58,26);ctx.stroke();
      ctx.fillStyle='#b87b42';ctx.beginPath();ctx.moveTo(-46,18);ctx.lineTo(-82,13);ctx.lineTo(-73,27);ctx.lineTo(-84,38);ctx.lineTo(-44,33);ctx.closePath();ctx.fill();
      ctx.save();ctx.translate(0,-4);WQ.Characters.drawHero(ctx,hero,{t:totalTime,pose:'fly',tool:'grip'});ctx.restore();
      ctx.strokeStyle='#463224';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(16,2);ctx.lineTo(37,-17);ctx.stroke();ctx.fillStyle='#fff1a6';ctx.shadowColor='#ffe16e';ctx.shadowBlur=15;ctx.beginPath();ctx.arc(38,-18,4,0,TAU);ctx.fill();ctx.restore();
    }
    function drawHud(ctx){
      ctx.fillStyle='rgba(25,20,52,.78)';rounded(ctx,18,18,292,62,18);ctx.fill();ctx.fillStyle='#fff';ctx.font='900 17px Malgun Gothic';ctx.fillText('하트  '+('♥'.repeat(p.hp)+'♡'.repeat(p.max-p.hp)),34,44);ctx.fillStyle='#ffe570';ctx.fillText('별  '+p.stars,34,68);
      ctx.fillStyle='rgba(25,20,52,.72)';rounded(ctx,670,19,270,49,17);ctx.fill();ctx.fillStyle='#fff';ctx.font='950 16px Malgun Gothic';ctx.textAlign='center';ctx.fillText((room+1)+'구간  '+roomNames[room],805,49);ctx.textAlign='left';
      if(room<=2){const got=rings.filter(r=>r.got).length;ctx.fillStyle='rgba(25,20,52,.7)';rounded(ctx,720,79,220,37,14);ctx.fill();ctx.fillStyle='#ffe9b0';ctx.font='900 14px Malgun Gothic';ctx.textAlign='center';ctx.fillText('통과한 링  '+got+' / '+rings.length,830,103);ctx.textAlign='left'}
      if(room===4&&boss){ctx.fillStyle='rgba(25,20,52,.75)';rounded(ctx,350,82,260,42,15);ctx.fill();ctx.fillStyle='#ffe36d';ctx.font='950 19px Malgun Gothic';ctx.textAlign='center';ctx.fillText('스니치 잡기  '+('✦'.repeat(boss.hp)+'·'.repeat(3-boss.hp)),480,110);ctx.textAlign='left'}
    }
    function drawPrompt(ctx){
      let text='';if(room===0&&roomTime<9)text=roomTime<4.5?'방향키로 하늘을 날아요':'반짝이는 링을 통과해요';
      else if(room===1&&roomTime<7)text='블러저가 오면 스페이스바!';
      else if(room===2&&roomTime<7)text='링이 위아래로 움직여요';
      else if(room===3&&roomTime<6)text='괜찮아. 구름 위에서 쉬어 가요.';
      else if(room===4&&boss?.state==='vulnerable')text='지금! 금빛 스니치에 주문!';
      else if(room<4&&objectiveDone()&&roomTime>=minTimes[room])text='금빛 링이 열렸어요! 오른쪽 위로!';
      else if(room<4&&objectiveDone())text='바람을 한 번 더 느껴 봐요';if(!text)return;
      ctx.fillStyle='rgba(255,248,223,.94)';rounded(ctx,270,478,420,50,19);ctx.fill();ctx.fillStyle='#3c3156';ctx.font='950 18px Malgun Gothic';ctx.textAlign='center';ctx.fillText(text,480,509);ctx.textAlign='left';
    }
    function draw(ctx){
      drawBackdrop(ctx);F.drawLayer(ctx,-1);drawDoor(ctx);drawRings(ctx);drawItems(ctx);drawBludgers(ctx);
      if(room===4)drawBoss(ctx);drawShots(ctx);drawRider(ctx);drawHud(ctx);drawPrompt(ctx);
      if(rescue>0){const q=clamp(rescue/1.2,0,1);ctx.fillStyle='rgba(25,20,52,'+(.45+.25*q)+')';ctx.fillRect(0,0,960,540);ctx.fillStyle='#fff8df';ctx.font='950 32px Malgun Gothic';ctx.textAlign='center';ctx.fillText('괜찮아! 다시 날아 보자.',480,250);ctx.font='800 19px Malgun Gothic';ctx.fillText(helper.name+'가 바람을 잔잔하게 했어요.',480,286);ctx.textAlign='left'}
      if(transition){const a=1-Math.abs(transition.t-.42)/.42;ctx.fillStyle='rgba(35,29,65,'+clamp(a,0,1)+')';ctx.fillRect(0,0,960,540)}
    }
    function pointer(type,x){if(type==='down'&&x>560){pointerCast=true;E.input.press('cast')}if(type==='up'&&pointerCast){pointerCast=false;E.input.release('cast')}}
    if(WQ.DEBUG)WQ._quidditch={
      state:()=>({room,roomTime,rings:rings.filter(r=>r.got).length+'/'+rings.length,hp:p.hp,wisdom:p.wisdom,hits:p.hits,boss:boss&&{hp:boss.hp,state:boss.state}}),
      skip:()=>{rings.forEach(r=>r.got=true);items.forEach(it=>it.got=true);roomTime=Math.max(roomTime,minTimes[room])},
      warp:(x,y)=>{p.x=x;p.y=y},hitBoss:()=>hitBoss(),openBoss:()=>{if(boss){boss.state='vulnerable';boss.t=0;boss.dur=9}},hurt:()=>hurt()
    };
    return{enter,exit,update,draw,pointer};
  }
  WQ.Quidditch=Quidditch;
})();

</script>
  <script>
/* src/stages/require-room.js */
(function(){
  'use strict';
  const WQ=window.WQ,E=WQ.E,F=WQ.Feel,S=WQ.Snd,TAU=Math.PI*2;
  const clamp=F.clamp,damp=F.damp,lerp=F.lerp;

  function RequireRoom(onClear){
    const hero=WQ.Characters?.current?.()||{name:'해리',speed:1,cast:.19,spell:8,hp:5};
    const helper=WQ.Characters?.helper?.()||{name:'헤르미온느'};
    const roomNames=['불빛 익히기','먼지 유령 조심','숨은 보물 찾기','포근한 쉼터','숨바꼭질 장롱'];
    const minTimes=[10,22,32,9,0];
    const TREASURE=[{name:'은빛 왕관',icon:'♛',color:'#cfe4ff'},{name:'노래하는 거울',icon:'◍',color:'#ffc9e8'},
      {name:'날개 달린 책',icon:'❐',color:'#ffe2a8'},{name:'별빛 새장',icon:'◫',color:'#c9f2d8'},
      {name:'수다쟁이 모자',icon:'♠',color:'#e2c9ff'},{name:'반딧불 램프',icon:'◉',color:'#fff0b0'}];
    let room=0,roomTime=0,totalTime=0,treasures=[],dusts=[],items=[],piles=[];
    let dustClock=99,doorGlow=0,rescue=0,failures=0,assist=1,assistShown=false,lightR=170;
    let transition=null,boss=null,done=false,clearDelay=0,delivered=false,castBuffer=0,pointerCast=false;
    const p={x:200,y:400,vx:0,vy:0,r:18,hp:hero.hp,max:hero.hp,inv:1.5,castCd:0,
      sq:F.squash(),walk:0,hits:0,stars:0,wisdom:0};

    function rounded(ctx,x,y,w,h,r){ctx.beginPath();ctx.roundRect?ctx.roundRect(x,y,w,h,r):ctx.rect(x,y,w,h)}
    function rnd(a,b){return a+Math.random()*(b-a)}
    function addTreasure(x,y,kind){treasures.push({x,y,kind,found:false,glow:0,age:rnd(0,TAU)})}
    function addItem(x,y){items.push({x,y,got:false,age:rnd(0,TAU)})}
    function announceRoom(){
      const lines=[
        '랜턴 불빛으로 반짝이는 보물을 찾아요. 가까이 가서 스페이스!',
        '먼지 유령이 떠다녀요. 스페이스 주문으로 후 불어요.',
        '보물이 더 깊이 숨었어요. 불빛을 천천히 비춰 봐요.',
        '방이 환해졌어요. 별을 모으며 쉬어요.',
        '장롱이 숨은 이불 더미를 잘 기억했다가 불빛을 비춰요.'
      ];E.announce(roomNames[room]+'. '+lines[room]);
    }
    function scatter(count){
      const spots=[[190,300],[420,260],[650,300],[820,270],[300,430],[560,420],[770,430],[140,260]].sort(()=>Math.random()-.5);
      for(let i=0;i<count;i++)addTreasure(spots[i][0],spots[i][1],i%TREASURE.length);
    }
    function setupRoom(next){
      room=next;roomTime=0;treasures=[];dusts=[];items=[];piles=[];boss=null;doorGlow=0;dustClock=99;
      p.x=200;p.y=400;p.vx=p.vy=0;p.inv=Math.max(p.inv,1.2);
      lightR=room===3?900:room===0?190:room===2?150:170;
      if(room===0)scatter(3);
      else if(room===1){scatter(4);dustClock=6}
      else if(room===2){scatter(5);dustClock=5}
      else if(room===3){
        [[320,300],[460,250],[600,320],[740,260],[520,410]].forEach(q=>addItem(q[0],q[1]));
        p.hp=Math.min(p.max,p.hp+1);F.pop(p.x,p.y-32,'하트 +1','#ff9fb9');S.shield?.();
      }else{
        piles=[{x:270,y:330},{x:520,y:300},{x:770,y:330}].map(q=>({...q,glow:0,wob:rnd(0,TAU)}));
        boss={hp:3,max:3,round:0,state:'dance',t:0,dur:2.2,at:1,target:1,x:520,y:300,flash:0};
        lightR=200;
      }
      announceRoom();
    }
    function enter(){setupRoom(0);S.music?.('require')}
    function exit(){if(pointerCast)E.input.release('cast');pointerCast=false}

    function objectiveDone(){
      if(room===3)return items.length>0&&items.every(it=>it.got);
      if(room<=2)return treasures.length>0&&treasures.every(t=>t.found);
      return false;
    }
    function noteFailure(){
      failures++;if(failures>=3&&assist===1){assist=.82;if(!assistShown){assistShown=true;E.announce(helper.name+'가 랜턴을 더 밝게 켰어요. 천천히 다시 찾아봐요!');lightR+=40}}
    }
    function hurt(){
      if(p.inv>0||rescue||done)return;p.hp--;p.hits++;p.inv=1.4;noteFailure();
      F.stop(.055);F.bump(.24);F.blink('#cfc2e8',.13);F.kick(p.sq,1.25,.76);F.spark(p.x,p.y,'#d9cdf0',12);S.hit?.();
      if(p.hp<=0){p.hp=p.max;rescue=1.2;p.inv=2.4;E.announce(helper.name+'의 도움 마법! 먼지를 걷어 냈어요.');F.slow(.35,.22,.5)}
    }
    function spawnDust(){
      const fromLeft=Math.random()<.5;
      dusts.push({x:fromLeft?-40:1000,y:rnd(260,440),vx:(fromLeft?1:-1)*rnd(40,66)*assist,
        age:0,r:26,puff:rnd(0,TAU),dead:false});
    }
    function updateDusts(dt){
      if((room===1&&roomTime>6)||(room===2&&roomTime>5)){
        dustClock-=dt;if(dustClock<=0){spawnDust();dustClock=(room===1?4.8:3.8)/assist}
      }
      for(const s of dusts){
        s.age+=dt;s.x+=s.vx*dt;s.y+=Math.sin(s.age*1.8+s.puff)*16*dt;
        if(!s.dead&&Math.hypot(s.x-p.x,s.y-p.y)<s.r+p.r-6)hurt();
      }
      dusts=dusts.filter(s=>!s.dead&&s.x>-90&&s.x<1050&&s.age<20);
    }
    function updateTreasures(dt){
      for(const t of treasures){
        if(t.found)continue;t.age+=dt;
        const lit=Math.hypot(t.x-p.x,t.y-p.y)<lightR;
        t.glow=damp(t.glow,lit?1:0,5,dt);
      }
    }
    function collectItems(dt){
      for(const it of items){
        if(it.got)continue;it.age+=dt;
        if(Math.hypot(it.x-p.x,it.y-p.y)<p.r+18){it.got=true;p.stars++;
          F.stop(.025);F.spark(it.x,it.y,'#ffe778',15);F.kick(p.sq,1.14,.88);F.pop(it.x,it.y,'별 +1','#fff2a0');S.star?.()}
      }
    }
    function cast(){
      if(rescue||done)return;p.castCd=Math.max(.7,hero.cast*4.4);F.kick(p.sq,.84,1.18);S.cast?.();
      const range=120+hero.spell*5;let didSomething=false;
      /* reveal treasures in reach */
      for(const t of treasures){
        if(!t.found&&Math.hypot(t.x-p.x,t.y-p.y)<range){
          t.found=true;didSomething=true;p.stars++;p.wisdom++;
          F.stop(.03);F.spark(t.x,t.y,TREASURE[t.kind].color,18);F.kick(p.sq,1.16,.87);
          F.pop(t.x,t.y-14,TREASURE[t.kind].name+'!','#fff2a0');S.star?.();
        }
      }
      /* puff dust */
      for(const s of dusts){
        if(!s.dead&&Math.hypot(s.x-p.x,s.y-p.y)<range+30){s.dead=true;didSomething=true;p.wisdom++;
          F.spark(s.x,s.y,'#e8def8',14);F.pop(s.x,s.y,'후~ 싹!','#efe6ff')}
      }
      /* the hide-and-seek wardrobe */
      if(room===4&&boss&&boss.state==='vulnerable'){
        let best=-1,bd=1e9;
        piles.forEach((q,i)=>{const d=Math.hypot(q.x-p.x,q.y-p.y);if(d<bd){bd=d;best=i}});
        if(bd<range+40){
          didSomething=true;
          if(best===boss.target)hitBoss();
          else{noteFailure();F.pop(piles[best].x,piles[best].y-46,'여긴 아니야! 다시 보자','#e8dcff');S.click?.();
            boss.state='dance';boss.t=0;boss.dur=1.6}
        }
      }
      F.ring(p.x,p.y-8,didSomething?'#ffe98e':'#cbb8f0');
      if(!didSomething&&room<=2)F.pop(p.x,p.y-40,'반짝이는 곳 가까이에서!','#eee4ff');
    }
    function hitBoss(){
      if(!boss)return;boss.hp--;boss.round++;boss.flash=.25;p.wisdom+=2;
      F.stop(.075);F.bump(.26);F.blink('#fff2a0',.12);F.spark(piles[boss.target].x,piles[boss.target].y-20,'#ffe06b',22);
      F.pop(piles[boss.target].x,piles[boss.target].y-52,boss.hp?'찾았다!':'술래잡기 끝!','#fff2a0');S.star?.();
      if(boss.hp<=0){finish();return}
      boss.state='dance';boss.t=0;boss.dur=1.8;
    }
    function updateBoss(dt){
      if(!boss||done)return;boss.t+=dt;boss.flash=Math.max(0,boss.flash-dt);
      piles.forEach(q=>{q.glow=Math.max(0,q.glow-dt*2)});
      if(boss.state==='dance'){
        /* the wardrobe hops between piles so you can watch where it settles */
        const hop=Math.floor(boss.t/.55)%piles.length;
        boss.at=hop;boss.x=piles[hop].x;boss.y=piles[hop].y-46+Math.abs(Math.sin(boss.t*6))*-14;
        if(boss.t>=boss.dur){
          boss.target=Math.floor(rnd(0,piles.length))%piles.length;
          boss.at=boss.target;boss.x=piles[boss.target].x;boss.y=piles[boss.target].y-40;
          boss.state='dive';boss.t=0;boss.dur=.9;
          E.announce('장롱이 숨었어요! 어느 이불 더미인지 봤나요?');
        }
      }else if(boss.state==='dive'){
        boss.y=lerp(piles[boss.target].y-40,piles[boss.target].y+8,F.ease.out(clamp(boss.t/boss.dur,0,1)));
        if(boss.t>=boss.dur){boss.state='tell';boss.t=0;boss.dur=[2.6,2.2,1.8][Math.min(2,boss.round)]+(assist<1?.6:0)}
      }else if(boss.state==='tell'){
        piles[boss.target].glow=Math.min(1,piles[boss.target].glow+dt*.55);   /* the hiding pile breathes faintly */
        if(boss.t>=boss.dur){boss.state='vulnerable';boss.t=0;boss.dur=3+(assist<1?.8:0);
          E.announce('지금! 장롱이 숨은 더미에 가까이 가서 주문!')}
      }else if(boss.state==='vulnerable'){
        piles.forEach(q=>{q.glow=.4+.3*Math.sin(totalTime*6+q.wob)});
        if(boss.t>=boss.dur){noteFailure();F.pop(480,250,'괜찮아, 한 번 더 보자!','#e8dcff');boss.state='dance';boss.t=0;boss.dur=1.8}
      }
    }
    function finish(){
      if(done)return;done=true;clearDelay=1.05;F.stop(.08);F.slow(.24,.38,.75);F.bump(.35);F.confetti(520,300,76);S.clear?.();
      E.announce('숨바꼭질 장롱이 보물 방을 열어 주었어요!');
    }
    function beginNext(){if(transition)return;transition={t:0,next:room+1,switched:false};S.clear?.();F.slow(.55,.08,.22)}

    function update(dt,raw=dt){
      if(done){F.updateSquash(p.sq,dt);clearDelay-=dt;if(clearDelay<=0&&!delivered){delivered=true;const rating=p.hits<=1&&p.wisdom>=14?3:p.hits<=4&&p.wisdom>=9?2:1;onClear({stars:rating,wisdom:p.wisdom,hits:p.hits,time:Math.round(totalTime*10)/10,card:'숨바꼭질 장롱',reward:'반딧불 랜턴 고리'})}return}
      if(transition){transition.t+=dt;if(!transition.switched&&transition.t>=.42){transition.switched=true;setupRoom(transition.next)}if(transition.t>=.84)transition=null;F.updateSquash(p.sq,dt);return}
      totalTime+=dt;roomTime+=dt;p.inv=Math.max(0,p.inv-dt);p.castCd=Math.max(0,p.castCd-dt);castBuffer=Math.max(0,castBuffer-dt);F.updateSquash(p.sq,dt);
      if(rescue>0){rescue=Math.max(0,rescue-(raw||dt));if(rescue===0){dusts=dusts.filter(s=>Math.hypot(s.x-p.x,s.y-p.y)>190);p.inv=Math.max(p.inv,1.4);F.ring(p.x,p.y,'#d8caff');F.kick(p.sq,.82,1.18)}return}
      let ix=(E.input.held('right')?1:0)-(E.input.held('left')?1:0),iy=(E.input.held('down')?1:0)-(E.input.held('up')?1:0),mag=Math.hypot(ix,iy);
      if(mag){ix/=mag;iy/=mag}const move=222*hero.speed;
      p.vx=damp(p.vx,ix*move,ix?16:22,dt);p.vy=damp(p.vy,iy*move*.85,iy?16:22,dt);
      p.x=clamp(p.x+p.vx*dt,80,880);p.y=clamp(p.y+p.vy*dt,240,462);
      p.walk+=Math.hypot(p.vx,p.vy)*dt*.038;
      if(E.input.buffered('cast',.18)){E.input.consume('cast');castBuffer=.18}if(castBuffer>0&&p.castCd<=0){castBuffer=0;cast()}
      updateTreasures(dt);updateDusts(dt);collectItems(dt);
      if(room===4)updateBoss(dt);
      const ready=objectiveDone()&&roomTime>=minTimes[room];doorGlow=damp(doorGlow,ready?1:0,6,dt);
      if(room<4&&ready&&p.x>815&&p.y<370)beginNext();
    }

    function drawBackdrop(ctx){
      const g=ctx.createLinearGradient(0,0,0,540);g.addColorStop(0,'#201a38');g.addColorStop(.6,'#332a50');g.addColorStop(1,'#1d1834');ctx.fillStyle=g;ctx.fillRect(0,0,960,540);
      /* towering stacks of forgotten things */
      ctx.fillStyle='#2a2344';
      [[120,90],[330,60],[560,84],[790,66]].forEach(q=>{
        rounded(ctx,q[0]-60,q[1],120,180,14);ctx.fill();
        rounded(ctx,q[0]-42,q[1]-34,84,42,10);ctx.fill();
        rounded(ctx,q[0]-26,q[1]-58,52,30,8);ctx.fill();
      });
      ctx.fillStyle='#382e58';
      [[230,170],[470,150],[690,175],[880,150]].forEach(q=>{rounded(ctx,q[0]-34,q[1],68,110,10);ctx.fill()});
      /* faint high window with moonlight */
      ctx.fillStyle='rgba(190,200,255,.13)';rounded(ctx,430,26,100,66,12);ctx.fill();
      ctx.strokeStyle='rgba(190,200,255,.2)';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(480,26);ctx.lineTo(480,92);ctx.moveTo(430,59);ctx.lineTo(530,59);ctx.stroke();
      /* floor boards */
      const f=ctx.createLinearGradient(0,250,0,540);f.addColorStop(0,'#453a66');f.addColorStop(1,'#241e3e');ctx.fillStyle=f;ctx.fillRect(0,250,960,290);
      ctx.strokeStyle='rgba(255,255,255,.05)';ctx.lineWidth=2;for(let i=0;i<8;i++){const y=272+i*34;ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(960,y);ctx.stroke()}
    }
    function drawDoor(ctx){
      if(room>=4)return;const ready=objectiveDone()&&roomTime>=minTimes[room],pulse=1+Math.sin(roomTime*5)*.04*doorGlow;
      ctx.save();ctx.translate(858,300);ctx.scale(pulse,pulse);
      ctx.fillStyle=ready?'#ffe584':'#403b5c';ctx.shadowColor=ready?'#ffe584':'transparent';ctx.shadowBlur=22*doorGlow;
      rounded(ctx,-42,-62,84,112,20);ctx.fill();ctx.fillStyle=ready?'#6b4b71':'#28253e';rounded(ctx,-31,-50,62,94,15);ctx.fill();
      ctx.fillStyle=ready?'#fff5b5':'#77718d';ctx.beginPath();ctx.arc(17,-2,5,0,TAU);ctx.fill();ctx.restore();
    }
    function drawTreasures(ctx){
      for(const t of treasures){
        const spec=TREASURE[t.kind];
        if(t.found){
          ctx.save();ctx.translate(t.x,t.y);ctx.globalAlpha=.9;
          ctx.fillStyle=spec.color;ctx.shadowColor=spec.color;ctx.shadowBlur=16;
          ctx.font='950 30px serif';ctx.textAlign='center';ctx.fillText(spec.icon,0,10);ctx.restore();continue;
        }
        /* unfound: a soft lump with a sparkle that grows when lit */
        ctx.save();ctx.translate(t.x,t.y);
        ctx.fillStyle='#3c3260';ctx.beginPath();ctx.ellipse(0,8,26,16,0,0,TAU);ctx.fill();
        if(t.glow>0.05){
          const tw=(.5+.5*Math.sin(t.age*6))*t.glow;
          ctx.globalAlpha=tw;ctx.fillStyle=spec.color;ctx.shadowColor=spec.color;ctx.shadowBlur=18;
          ctx.font='950 20px serif';ctx.textAlign='center';ctx.fillText('✦',0,0);
        }
        ctx.restore();
      }
    }
    function drawDusts(ctx){
      for(const s of dusts){
        ctx.save();ctx.translate(s.x,s.y);const wob=1+Math.sin(s.age*4+s.puff)*.12;ctx.scale(wob,2-wob);
        ctx.fillStyle='rgba(196,186,224,.72)';
        ctx.beginPath();ctx.arc(0,0,s.r,0,TAU);ctx.arc(-s.r*.6,s.r*.3,s.r*.55,0,TAU);ctx.arc(s.r*.6,s.r*.3,s.r*.55,0,TAU);ctx.fill();
        ctx.fillStyle='#3a3354';ctx.beginPath();ctx.arc(-6,-4,2.8,0,TAU);ctx.arc(6,-4,2.8,0,TAU);ctx.fill();
        ctx.strokeStyle='#3a3354';ctx.lineWidth=2.2;ctx.beginPath();ctx.arc(0,5,5,.15*Math.PI,.85*Math.PI);ctx.stroke();ctx.restore();
      }
    }
    function drawItems(ctx){
      for(const it of items){if(it.got)continue;const pulse=1+Math.sin(it.age*7)*.13;ctx.save();ctx.translate(it.x,it.y);ctx.scale(pulse,pulse);ctx.rotate(it.age*.4);ctx.fillStyle='#ffe36d';ctx.shadowColor=ctx.fillStyle;ctx.shadowBlur=18;ctx.beginPath();for(let i=0;i<10;i++){const a=-Math.PI/2+i*Math.PI/5,r=i%2?6:15;i?ctx.lineTo(Math.cos(a)*r,Math.sin(a)*r):ctx.moveTo(Math.cos(a)*r,Math.sin(a)*r)}ctx.closePath();ctx.fill();ctx.restore()}
    }
    function drawPiles(ctx){
      for(const q of piles){
        ctx.save();ctx.translate(q.x,q.y);
        ctx.fillStyle='#4a3f70';ctx.beginPath();ctx.ellipse(0,10,58,30,0,0,TAU);ctx.fill();
        ctx.fillStyle='#5c4f88';ctx.beginPath();ctx.ellipse(-14,-4,34,22,-.2,0,TAU);ctx.ellipse(18,0,30,20,.2,0,TAU);ctx.fill();
        ctx.strokeStyle='rgba(255,255,255,.12)';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(-40,14);ctx.quadraticCurveTo(0,26,40,14);ctx.stroke();
        if(q.glow>0.04){ctx.globalAlpha=q.glow;ctx.fillStyle='#ffe98e';ctx.shadowColor='#ffe98e';ctx.shadowBlur=22;
          ctx.font='950 22px serif';ctx.textAlign='center';ctx.fillText('✦',0,-24)}
        ctx.restore();
      }
    }
    function drawBoss(ctx){
      if(!boss||boss.state==='tell'||boss.state==='vulnerable')return;   /* hidden while under a pile */
      ctx.save();ctx.translate(boss.x,boss.y);ctx.scale(1+(boss.flash>0?.15:0),1-(boss.flash>0?.1:0));
      ctx.fillStyle='#6e5a3c';rounded(ctx,-30,-46,60,80,10);ctx.fill();
      ctx.fillStyle='#84704e';rounded(ctx,-24,-40,21,68,7);ctx.fill();rounded(ctx,3,-40,21,68,7);ctx.fill();
      ctx.fillStyle='#ffd66f';ctx.beginPath();ctx.arc(-3,-4,3,0,TAU);ctx.arc(6,-4,3,0,TAU);ctx.fill();
      /* little feet */
      ctx.fillStyle='#4e3e28';ctx.beginPath();ctx.ellipse(-16,38,8,5,0,0,TAU);ctx.ellipse(16,38,8,5,0,0,TAU);ctx.fill();
      /* peeking eyes */
      ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(-8,-18,5,0,TAU);ctx.arc(8,-18,5,0,TAU);ctx.fill();
      ctx.fillStyle='#2c2440';ctx.beginPath();ctx.arc(-8,-18,2.4,0,TAU);ctx.arc(8,-18,2.4,0,TAU);ctx.fill();
      ctx.restore();
    }
    function drawLight(ctx){
      if(room===3)return;
      const grad=ctx.createRadialGradient(p.x,p.y-8,lightR*.45,p.x,p.y-8,lightR);
      grad.addColorStop(0,'rgba(12,9,26,0)');grad.addColorStop(1,'rgba(12,9,26,.82)');
      ctx.fillStyle=grad;ctx.fillRect(0,0,960,540);
      /* warm rim right at the lantern edge */
      ctx.strokeStyle='rgba(255,225,150,.1)';ctx.lineWidth=14;ctx.beginPath();ctx.arc(p.x,p.y-8,lightR*.72,0,TAU);ctx.stroke();
    }
    function drawPlayer(ctx){
      const moving=Math.hypot(p.vx,p.vy)>24,bob=moving?Math.sin(p.walk)*3:Math.sin(totalTime*2.2)*1.4;
      ctx.save();ctx.translate(p.x,p.y+bob);ctx.globalAlpha=p.inv>0&&Math.floor(p.inv*12)%2?.42:1;ctx.scale(p.sq.x,p.sq.y);
      ctx.fillStyle='rgba(10,7,22,.32)';ctx.beginPath();ctx.ellipse(0,32,24,9,0,0,TAU);ctx.fill();
      WQ.Characters.drawHero(ctx,hero,{t:totalTime,walk:p.walk,moving,tool:'wand',aimA:-.5});
      /* the lantern floats beside, bobbing */
      const lx=-30,ly=-26+Math.sin(totalTime*2.6)*3;
      ctx.strokeStyle='#8a7346';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(lx,ly-10);ctx.quadraticCurveTo(lx+4,ly-16,lx+8,ly-12);ctx.stroke();
      ctx.fillStyle='#c9a86a';rounded(ctx,lx-8,ly-8,16,20,5);ctx.fill();
      ctx.fillStyle='#fff1a6';ctx.shadowColor='#ffe16e';ctx.shadowBlur=18;rounded(ctx,lx-5,ly-4,10,12,3);ctx.fill();
      ctx.restore();
    }
    function drawHud(ctx){
      ctx.fillStyle='rgba(25,20,52,.78)';rounded(ctx,18,18,292,62,18);ctx.fill();ctx.fillStyle='#fff';ctx.font='900 17px Malgun Gothic';ctx.fillText('하트  '+('♥'.repeat(p.hp)+'♡'.repeat(p.max-p.hp)),34,44);ctx.fillStyle='#ffe570';ctx.fillText('별  '+p.stars,34,68);
      ctx.fillStyle='rgba(25,20,52,.72)';rounded(ctx,670,19,270,49,17);ctx.fill();ctx.fillStyle='#fff';ctx.font='950 16px Malgun Gothic';ctx.textAlign='center';ctx.fillText((room+1)+'구간  '+roomNames[room],805,49);ctx.textAlign='left';
      if(room<=2){const got=treasures.filter(t=>t.found).length;ctx.fillStyle='rgba(25,20,52,.7)';rounded(ctx,720,79,220,37,14);ctx.fill();ctx.fillStyle='#e8dcff';ctx.font='900 14px Malgun Gothic';ctx.textAlign='center';ctx.fillText('찾은 보물  '+got+' / '+treasures.length,830,103);ctx.textAlign='left'}
      if(room===4&&boss){ctx.fillStyle='rgba(25,20,52,.75)';rounded(ctx,350,82,260,42,15);ctx.fill();ctx.fillStyle='#ffe36d';ctx.font='950 19px Malgun Gothic';ctx.textAlign='center';ctx.fillText('숨바꼭질  '+('✦'.repeat(boss.hp)+'·'.repeat(3-boss.hp)),480,110);ctx.textAlign='left'}
    }
    function drawPrompt(ctx){
      let text='';if(room===0&&roomTime<9)text=roomTime<4.5?'랜턴 불빛으로 방을 살펴봐요':'반짝임 가까이에서 스페이스바!';
      else if(room===1&&roomTime<7)text='먼지 유령이 오면 스페이스바!';
      else if(room===2&&roomTime<7)text='깊이 숨은 보물은 천천히 비춰요';
      else if(room===3&&roomTime<6)text='괜찮아. 환한 방에서 쉬어 가요.';
      else if(room===4&&boss?.state==='dive')text='장롱이 어디로 숨는지 잘 봐요!';
      else if(room===4&&boss?.state==='vulnerable')text='기억한 이불 더미로 가서 주문!';
      else if(room<4&&objectiveDone()&&roomTime>=minTimes[room])text='문이 열렸어요! 오른쪽 문으로!';
      else if(room<4&&objectiveDone())text='방을 한 번 더 둘러봐요';if(!text)return;
      ctx.fillStyle='rgba(255,248,223,.94)';rounded(ctx,270,478,420,50,19);ctx.fill();ctx.fillStyle='#3c3156';ctx.font='950 18px Malgun Gothic';ctx.textAlign='center';ctx.fillText(text,480,509);ctx.textAlign='left';
    }
    function draw(ctx){
      drawBackdrop(ctx);F.drawLayer(ctx,-1);drawDoor(ctx);if(room===4)drawPiles(ctx);drawTreasures(ctx);drawItems(ctx);
      if(room===4)drawBoss(ctx);drawDusts(ctx);drawPlayer(ctx);drawLight(ctx);drawHud(ctx);drawPrompt(ctx);
      if(rescue>0){const q=clamp(rescue/1.2,0,1);ctx.fillStyle='rgba(25,20,52,'+(.45+.25*q)+')';ctx.fillRect(0,0,960,540);ctx.fillStyle='#fff8df';ctx.font='950 32px Malgun Gothic';ctx.textAlign='center';ctx.fillText('괜찮아! 다시 찾아 보자.',480,250);ctx.font='800 19px Malgun Gothic';ctx.fillText(helper.name+'가 랜턴을 다시 밝혔어요.',480,286);ctx.textAlign='left'}
      if(transition){const a=1-Math.abs(transition.t-.42)/.42;ctx.fillStyle='rgba(35,29,65,'+clamp(a,0,1)+')';ctx.fillRect(0,0,960,540)}
    }
    function pointer(type,x){if(type==='down'&&x>560){pointerCast=true;E.input.press('cast')}if(type==='up'&&pointerCast){pointerCast=false;E.input.release('cast')}}
    if(WQ.DEBUG)WQ._require={
      state:()=>({room,roomTime,found:treasures.filter(t=>t.found).length+'/'+treasures.length,hp:p.hp,wisdom:p.wisdom,hits:p.hits,boss:boss&&{hp:boss.hp,state:boss.state,target:boss.target}}),
      skip:()=>{treasures.forEach(t=>t.found=true);items.forEach(it=>it.got=true);roomTime=Math.max(roomTime,minTimes[room])},
      warp:(x,y)=>{p.x=x;p.y=y},hitBoss:()=>hitBoss(),
      openBoss:()=>{if(boss){boss.state='vulnerable';boss.t=0;boss.dur=9;if(piles[boss.target]){p.x=piles[boss.target].x;p.y=piles[boss.target].y+40}}},
      hurt:()=>hurt()
    };
    return{enter,exit,update,draw,pointer};
  }
  WQ.RequireRoom=RequireRoom;
})();

  <script>
/* src/stages/castle-defense.js */
(function(){
  'use strict';
  const WQ=window.WQ,E=WQ.E,F=WQ.Feel,S=WQ.Snd,TAU=Math.PI*2;
  const clamp=F.clamp,damp=F.damp,lerp=F.lerp;

  function CastleDefense(onClear){
    const hero=WQ.Characters?.current?.()||{name:'해리',speed:1,cast:.19,spell:8,hp:5};
    const helper=WQ.Characters?.helper?.()||{name:'헤르미온느'};
    const roomNames=['성벽 지키기 연습','첫 번째 구름 파도','두 번째 구름 파도','별빛 쉼터','심술 구름 대왕'];
    const minTimes=[10,20,30,9,0];
    let room=0,roomTime=0,totalTime=0,clouds=[],items=[],shots=[],fireworks=[];
    let cloudClock=99,need=0,got=0,doorGlow=0,rescue=0,failures=0,assist=1,assistShown=false;
    let transition=null,boss=null,done=false,clearDelay=0,delivered=false,castBuffer=0,pointerCast=false;
    const p={x:200,y:410,vx:0,vy:0,r:18,hp:hero.hp,max:hero.hp,inv:1.5,castCd:0,
      sq:F.squash(),walk:0,hits:0,stars:0,wisdom:0};

    function rounded(ctx,x,y,w,h,r){ctx.beginPath();ctx.roundRect?ctx.roundRect(x,y,w,h,r):ctx.rect(x,y,w,h)}
    function rnd(a,b){return a+Math.random()*(b-a)}
    function addItem(x,y){items.push({x,y,got:false,age:rnd(0,TAU)})}
    function announceRoom(){
      const lines=[
        '내려오는 심술 구름을 별빛 주문으로 펑 터뜨려요.',
        '구름이 더 많이 와요. 성벽을 지켜요!',
        '구름이 빨라졌어요. 침착하게 하나씩!',
        '친구들과 별을 모으며 쉬어요.',
        '구름 대왕이 금빛 하품을 할 때 주문을 써요.'
      ];E.announce(roomNames[room]+'. '+lines[room]);
    }
    function setupRoom(next){
      room=next;roomTime=0;clouds=[];items=[];shots=[];boss=null;doorGlow=0;cloudClock=99;got=0;
      p.x=200;p.y=410;p.vx=p.vy=0;p.inv=Math.max(p.inv,1.2);
      if(room===0){need=5;cloudClock=1.4}
      else if(room===1){need=8;cloudClock=1.2}
      else if(room===2){need=10;cloudClock=1}
      else if(room===3){
        need=0;[[300,300],[440,250],[590,300],[720,250],[520,380]].forEach(q=>addItem(q[0],q[1]));
        p.hp=Math.min(p.max,p.hp+1);F.pop(p.x,p.y-32,'하트 +1','#ff9fb9');S.shield?.();
      }else{
        need=0;boss={x:480,y:150,hp:3,max:3,round:0,state:'recover',t:0,dur:2,flash:0,inv:0,drift:0,spits:0};
        cloudClock=99;
      }
      announceRoom();
    }
    function enter(){setupRoom(0);S.music?.('defense')}
    function exit(){if(pointerCast)E.input.release('cast');pointerCast=false}

    function objectiveDone(){
      if(room===3)return items.length>0&&items.every(it=>it.got);
      if(room<=2)return got>=need;
      return false;
    }
    function noteFailure(){
      failures++;if(failures>=3&&assist===1){assist=.82;if(!assistShown){assistShown=true;E.announce(helper.name+'가 구름을 느리게 했어요. 하나씩 천천히!')}}
    }
    function hurt(){
      if(p.inv>0||rescue||done)return;p.hp--;p.hits++;p.inv=1.4;noteFailure();
      F.stop(.055);F.bump(.24);F.blink('#b8c9f0',.13);F.kick(p.sq,1.25,.76);F.spark(p.x,p.y,'#c9d8f4',12);S.hit?.();
      if(p.hp<=0){p.hp=p.max;rescue=1.2;p.inv=2.4;E.announce(helper.name+'의 도움 마법! 별빛 방패가 지켜 줬어요.');F.slow(.35,.22,.5)}
    }
    function spawnCloud(fromBoss){
      const x=fromBoss?boss.x+rnd(-40,40):rnd(120,840);
      clouds.push({x,y:fromBoss?boss.y+30:-30,vy:(fromBoss?95:room===2?80:room===1?66:52)*assist,
        vx:rnd(-16,16),age:0,r:26,puff:rnd(0,TAU),dead:false,low:false});
    }
    function updateClouds(dt){
      if(room<=2){cloudClock-=dt;if(cloudClock<=0){spawnCloud(false);cloudClock=(room===0?2.6:room===1?2.1:1.7)/assist}}
      for(const c of clouds){
        c.age+=dt;c.x=clamp(c.x+c.vx*dt,60,900);
        if(!c.low){c.y+=c.vy*dt;if(c.y>430){c.low=true;c.vy=-40;F.pop(c.x,440,'까르르!','#d8e2ff')}}
        else{c.y+=c.vy*dt;if(c.y<330)c.vy=40;if(c.y>430)c.vy=-40}   /* giggles and bobs above the wall until popped */
        if(!c.dead&&Math.hypot(c.x-p.x,c.y-p.y)<c.r+p.r-6)hurt();
      }
      clouds=clouds.filter(c=>!c.dead&&c.age<30);
    }
    function collectItems(dt){
      for(const it of items){
        if(it.got)continue;it.age+=dt;
        if(Math.hypot(it.x-p.x,it.y-p.y)<p.r+18){it.got=true;p.stars++;
          F.stop(.025);F.spark(it.x,it.y,'#ffe778',15);F.kick(p.sq,1.14,.88);F.pop(it.x,it.y,'별 +1','#fff2a0');S.star?.()}
      }
    }
    function cast(){
      if(rescue||done)return;p.castCd=Math.max(.68,hero.cast*4.2);F.kick(p.sq,.84,1.18);S.cast?.();
      if(room===4&&boss){
        const dx=boss.x-p.x,dy=boss.y-p.y,d=Math.hypot(dx,dy)||1,sp=720+hero.spell*8;
        shots.push({x:p.x,y:p.y-14,vx:dx/d*sp,vy:dy/d*sp,r:7+hero.spell*.22,life:1.45,ready:boss.state==='vulnerable'});
        F.ring(p.x,p.y-14,'#fff1a0');
      }
      const range=150+hero.spell*6;let popped=0;
      for(const c of clouds){
        if(!c.dead&&Math.hypot(c.x-p.x,c.y-p.y)<range){c.dead=true;popped++;
          if(room<=2){got++;p.wisdom++}else p.wisdom++;
          F.spark(c.x,c.y,'#bfe0ff',16);F.pop(c.x,c.y,'펑!','#e2efff');p.stars++}
      }

    function hitBoss(){
      if(!boss||boss.state!=='vulnerable'||boss.inv>0)return;boss.hp--;boss.round++;boss.flash=.2;boss.inv=.25;p.wisdom+=2;
      F.stop(.075);F.bump(.26);F.blink('#fff2a0',.12);F.spark(boss.x,boss.y,'#ffe06b',24);
      F.pop(boss.x,boss.y-56,boss.hp?'구름이 옅어졌어!':'하늘이 맑아졌다!','#fff2a0');S.star?.();
      if(boss.hp<=0){finish();return}boss.state='recover';boss.t=0;boss.dur=1.4;
    }
    function updateBoss(dt){
      if(!boss||done)return;boss.t+=dt;boss.flash=Math.max(0,boss.flash-dt);boss.inv=Math.max(0,boss.inv-dt);
      boss.drift+=dt;boss.x=480+Math.sin(boss.drift*.7)*180;boss.y=150+Math.sin(boss.drift*1.3)*24;
      if(boss.state==='recover'){
        if(boss.t>=boss.dur){boss.state='storm';boss.t=0;boss.dur=3.4;boss.spits=2+Math.min(2,boss.round)}
      }else if(boss.state==='storm'){
        if(boss.spits>0&&boss.t>boss.dur/(3+Math.min(2,boss.round))*(3+Math.min(2,boss.round)-boss.spits)){
          spawnCloud(true);boss.spits--;S.hit?.();F.bump(.1);
        }
        if(boss.t>=boss.dur){boss.state='tell';boss.t=0;boss.dur=1.1}
      }else if(boss.state==='tell'){
        if(boss.t>=boss.dur){boss.state='vulnerable';boss.t=0;boss.dur=[1.6,1.35,1.15][Math.min(2,boss.round)]+(assist<1?.3:0);E.announce('지금이야! 금빛 하품에 주문을 써요!')}
      }else if(boss.state==='vulnerable'&&boss.t>=boss.dur){
        noteFailure();F.pop(boss.x,boss.y-56,'괜찮아, 다시 보자!','#e8dcff');boss.state='recover';boss.t=0;boss.dur=.9;
      }
    }
    function updateShots(dt){
      for(const b of shots){
        b.life-=dt;if(b.ready&&boss&&boss.state==='vulnerable'){
          const dx=boss.x-b.x,dy=boss.y-b.y,d=Math.hypot(dx,dy)||1;b.vx=damp(b.vx,dx/d*790,5,dt);b.vy=damp(b.vy,dy/d*790,5,dt);
        }
        b.x+=b.vx*dt;b.y+=b.vy*dt;
        if(boss&&Math.hypot(b.x-boss.x,b.y-boss.y)<b.r+40){
          b.life=0;if(b.ready&&boss.state==='vulnerable')hitBoss();else{F.spark(b.x,b.y,'#bba5df',7);F.pop(b.x,b.y,'아직이야!','#e8dcff')}
        }
      }shots=shots.filter(b=>b.life>0&&b.x>-30&&b.x<990&&b.y>-30&&b.y<570);
    }
    function updateFireworks(dt){
      if(done&&Math.random()<dt*6)fireworks.push({x:rnd(120,840),y:rnd(80,260),t:0,hue:Math.floor(rnd(0,4))});
      for(const f of fireworks)f.t+=dt;
      fireworks=fireworks.filter(f=>f.t<1.2);
    }
    function finish(){
      if(done)return;done=true;clearDelay=2.2;F.stop(.08);F.slow(.24,.38,.75);F.bump(.35);F.confetti(boss.x,boss.y,90);S.clear?.();
      E.announce('심술 구름이 걷히고 호그와트에 별빛이 돌아왔어요! 모든 이야기를 지켜 냈어요!');
    }
    function beginNext(){if(transition)return;transition={t:0,next:room+1,switched:false};S.clear?.();F.slow(.55,.08,.22)}

    function update(dt,raw=dt){
      if(done){F.updateSquash(p.sq,dt);updateFireworks(dt);clearDelay-=dt;if(clearDelay<=0&&!delivered){delivered=true;const rating=p.hits<=1&&p.wisdom>=18?3:p.hits<=4&&p.wisdom>=12?2:1;onClear({stars:rating,wisdom:p.wisdom,hits:p.hits,time:Math.round(totalTime*10)/10,card:'별빛 방패',reward:'호그와트 수호 훈장'})}return}
      if(transition){transition.t+=dt;if(!transition.switched&&transition.t>=.42){transition.switched=true;setupRoom(transition.next)}if(transition.t>=.84)transition=null;F.updateSquash(p.sq,dt);return}
      totalTime+=dt;roomTime+=dt;p.inv=Math.max(0,p.inv-dt);p.castCd=Math.max(0,p.castCd-dt);castBuffer=Math.max(0,castBuffer-dt);F.updateSquash(p.sq,dt);
      if(rescue>0){rescue=Math.max(0,rescue-(raw||dt));if(rescue===0){clouds=clouds.filter(c=>Math.hypot(c.x-p.x,c.y-p.y)>190);p.inv=Math.max(p.inv,1.4);F.ring(p.x,p.y,'#d8caff');F.kick(p.sq,.82,1.18)}return}
      let ix=(E.input.held('right')?1:0)-(E.input.held('left')?1:0),iy=(E.input.held('down')?1:0)-(E.input.held('up')?1:0),mag=Math.hypot(ix,iy);
      if(mag){ix/=mag;iy/=mag}const move=226*hero.speed;
      p.vx=damp(p.vx,ix*move,ix?16:22,dt);p.vy=damp(p.vy,iy*move*.8,iy?16:22,dt);
      p.x=clamp(p.x+p.vx*dt,80,880);p.y=clamp(p.y+p.vy*dt,room===3?250:330,462);
      p.walk+=Math.hypot(p.vx,p.vy)*dt*.038;
      if(E.input.buffered('cast',.18)){E.input.consume('cast');castBuffer=.18}if(castBuffer>0&&p.castCd<=0){castBuffer=0;cast()}
      updateClouds(dt);collectItems(dt);
      if(room===4){updateBoss(dt);updateShots(dt)}
      const ready=objectiveDone()&&roomTime>=minTimes[room];doorGlow=damp(doorGlow,ready?1:0,6,dt);
      if(room<4&&ready&&p.x>815&&p.y<370)beginNext();
    }

    function drawBackdrop(ctx){
      const sky=ctx.createLinearGradient(0,0,0,540);sky.addColorStop(0,'#1d1a3e');sky.addColorStop(.6,'#3b3068');sky.addColorStop(1,'#57457e');ctx.fillStyle=sky;ctx.fillRect(0,0,960,540);
      ctx.fillStyle='rgba(255,244,202,.6)';for(let i=0;i<30;i++){const x=(i*83+Math.sin(i*5)*30)%960,y=(i*37)%260;ctx.globalAlpha=.3+.35*Math.sin(totalTime*2+i);ctx.beginPath();ctx.arc(x,y,1.2+(i%3)*.7,0,TAU);ctx.fill()}ctx.globalAlpha=1;

      ctx.fillStyle='#241f45';
      [[160,120,54],[320,80,64],[480,110,58],[650,70,66],[820,130,50]].forEach(q=>{
        rounded(ctx,q[0]-q[2]/2,q[1],q[2],320,8);ctx.fill();
        ctx.beginPath();ctx.moveTo(q[0]-q[2]/2-8,q[1]+6);ctx.lineTo(q[0],q[1]-46);ctx.lineTo(q[0]+q[2]/2+8,q[1]+6);ctx.fill();
      });

      ctx.fillStyle='#ffd66f';
      [[160,190],[320,150],[320,220],[480,180],[650,140],[650,210],[820,200],[480,250]].forEach((q,i)=>{
        ctx.globalAlpha=.55+.4*Math.sin(totalTime*1.6+i*1.8);rounded(ctx,q[0]-6,q[1],12,18,4);ctx.fill()});
      ctx.globalAlpha=1;

      ctx.strokeStyle='rgba(255,255,255,.06)';ctx.lineWidth=2;for(let i=0;i<3;i++){const y=470+i*24;ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(960,y);ctx.stroke()}
      /* friends cheering at both ends of the wall */
      [[60,470,'#66c8ff'],[900,470,'#ff8fb5']].forEach(q=>{
        ctx.fillStyle=q[2];ctx.beginPath();ctx.arc(q[0],q[1]-22+Math.sin(totalTime*4)*2,9,0,TAU);ctx.fill();
        ctx.fillStyle='#3a3157';rounded(ctx,q[0]-10,q[1]-14,20,26,7);ctx.fill();
      });
    }
    function drawDoor(ctx){
      if(room>=4)return;const ready=objectiveDone()&&roomTime>=minTimes[room],pulse=1+Math.sin(roomTime*5)*.04*doorGlow;
      ctx.save();ctx.translate(858,300);ctx.scale(pulse,pulse);
      ctx.fillStyle=ready?'#ffe584':'#403b5c';ctx.shadowColor=ready?'#ffe584':'transparent';ctx.shadowBlur=22*doorGlow;
      rounded(ctx,-42,-62,84,112,20);ctx.fill();ctx.fillStyle=ready?'#6b4b71':'#28253e';rounded(ctx,-31,-50,62,94,15);ctx.fill();
      ctx.fillStyle=ready?'#fff5b5':'#77718d';ctx.beginPath();ctx.arc(17,-2,5,0,TAU);ctx.fill();ctx.restore();
    }
    function drawClouds(ctx){
      for(const c of clouds){
        ctx.save();ctx.translate(c.x,c.y);const wob=1+Math.sin(c.age*4+c.puff)*.1;ctx.scale(wob,2-wob);

        ctx.fillStyle='#2d3654';ctx.beginPath();ctx.arc(-6,-4,2.8,0,TAU);ctx.arc(6,-4,2.8,0,TAU);ctx.fill();
        ctx.strokeStyle='#2d3654';ctx.lineWidth=2.4;
        ctx.beginPath();if(c.low){ctx.arc(0,6,5.5,.15*Math.PI,.85*Math.PI)}else{ctx.moveTo(-5,7);ctx.lineTo(5,7)}ctx.stroke();
        ctx.restore();
      }
    }
    function drawItems(ctx){
      for(const it of items){if(it.got)continue;const pulse=1+Math.sin(it.age*7)*.13;ctx.save();ctx.translate(it.x,it.y);ctx.scale(pulse,pulse);ctx.rotate(it.age*.4);ctx.fillStyle='#ffe36d';ctx.shadowColor=ctx.fillStyle;ctx.shadowBlur=18;ctx.beginPath();for(let i=0;i<10;i++){const a=-Math.PI/2+i*Math.PI/5,r=i%2?6:15;i?ctx.lineTo(Math.cos(a)*r,Math.sin(a)*r):ctx.moveTo(Math.cos(a)*r,Math.sin(a)*r)}ctx.closePath();ctx.fill();ctx.restore()}
    }
    function drawBoss(ctx){
      if(!boss)return;const gold=boss.state==='vulnerable',tell=boss.state==='tell';
      ctx.save();ctx.translate(boss.x,boss.y);ctx.scale(1+(boss.flash>0?.14:0),1-(boss.flash>0?.1:0));

      ctx.fillStyle=gold?'#f2e3b8':tell?'#d8c2b0':'rgba(126,146,198,.95)';
      ctx.beginPath();ctx.arc(0,0,52,0,TAU);ctx.arc(-52,14,40,0,TAU);ctx.arc(52,14,40,0,TAU);ctx.arc(-20,-30,34,0,TAU);ctx.arc(24,-26,30,0,TAU);ctx.fill();ctx.shadowBlur=0;

      ctx.beginPath();ctx.ellipse(-18,-4,6,6*blink,0,0,TAU);ctx.ellipse(18,-4,6,6*blink,0,0,TAU);ctx.fill();

      if(gold){ctx.fillStyle='rgba(255,227,109,.4)';ctx.beginPath();ctx.arc(0,16,13,0,TAU);ctx.fill()}
      ctx.restore();
      if(gold||tell){ctx.fillStyle='rgba(43,34,75,.82)';rounded(ctx,boss.x-95,boss.y-104,190,34,14);ctx.fill();ctx.fillStyle=gold?'#fff4b1':'#ffd3a0';ctx.font='950 17px Malgun Gothic';ctx.textAlign='center';ctx.fillText(gold?'지금! 주문!':'곧 하품해요…',boss.x,boss.y-81);ctx.textAlign='left'}
    }
    function drawShots(ctx){for(const b of shots){ctx.strokeStyle='rgba(255,235,130,.5)';ctx.lineWidth=7;ctx.beginPath();ctx.moveTo(b.x-b.vx*.02,b.y-b.vy*.02);ctx.lineTo(b.x,b.y);ctx.stroke();ctx.fillStyle=b.ready?'#fff3a0':'#cbb5ef';ctx.beginPath();ctx.arc(b.x,b.y,b.r,0,TAU);ctx.fill()}}
    function drawFireworks(ctx){
      for(const f of fireworks){
        const cols=['#ffd66f','#ff8fb5','#66c8ff','#8ee0ad'],q=F.ease.out(clamp(f.t/1.1,0,1));

        ctx.restore();
      }

    function drawPlayer(ctx){
      const moving=Math.hypot(p.vx,p.vy)>24,bob=moving?Math.sin(p.walk)*3:Math.sin(totalTime*2.2)*1.4;

      ctx.fillStyle='rgba(12,9,26,.3)';ctx.beginPath();ctx.ellipse(0,32,24,9,0,0,TAU);ctx.fill();

      ctx.restore();
    }
    function drawHud(ctx){
      ctx.fillStyle='rgba(25,20,52,.78)';rounded(ctx,18,18,292,62,18);ctx.fill();ctx.fillStyle='#fff';ctx.font='900 17px Malgun Gothic';ctx.fillText('하트  '+('♥'.repeat(p.hp)+'♡'.repeat(p.max-p.hp)),34,44);ctx.fillStyle='#ffe570';ctx.fillText('별  '+p.stars,34,68);
      ctx.fillStyle='rgba(25,20,52,.72)';rounded(ctx,670,19,270,49,17);ctx.fill();ctx.fillStyle='#fff';ctx.font='950 16px Malgun Gothic';ctx.textAlign='center';ctx.fillText((room+1)+'구간  '+roomNames[room],805,49);ctx.textAlign='left';
      if(room<=2){ctx.fillStyle='rgba(25,20,52,.7)';rounded(ctx,720,79,220,37,14);ctx.fill();ctx.fillStyle='#cfe0ff';ctx.font='900 14px Malgun Gothic';ctx.textAlign='center';ctx.fillText('터뜨린 구름  '+got+' / '+need,830,103);ctx.textAlign='left'}

    }
    function drawPrompt(ctx){
      let text='';if(room===0&&roomTime<9)text=roomTime<4.5?'성벽 위를 달려 봐요':'구름 가까이에서 스페이스바!';

      ctx.fillStyle='rgba(255,248,223,.94)';rounded(ctx,270,478,420,50,19);ctx.fill();ctx.fillStyle='#3c3156';ctx.font='950 18px Malgun Gothic';ctx.textAlign='center';ctx.fillText(text,480,509);ctx.textAlign='left';
    }
    function draw(ctx){
      drawBackdrop(ctx);F.drawLayer(ctx,-1);drawDoor(ctx);drawItems(ctx);

      if(rescue>0){const q=clamp(rescue/1.2,0,1);ctx.fillStyle='rgba(25,20,52,'+(.45+.25*q)+')';ctx.fillRect(0,0,960,540);ctx.fillStyle='#fff8df';ctx.font='950 32px Malgun Gothic';ctx.textAlign='center';ctx.fillText('괜찮아! 다시 지켜 보자.',480,250);ctx.font='800 19px Malgun Gothic';ctx.fillText(helper.name+'가 별빛 방패를 켰어요.',480,286);ctx.textAlign='left'}
      if(transition){const a=1-Math.abs(transition.t-.42)/.42;ctx.fillStyle='rgba(35,29,65,'+clamp(a,0,1)+')';ctx.fillRect(0,0,960,540)}
    }
    function pointer(type,x){if(type==='down'&&x>560){pointerCast=true;E.input.press('cast')}if(type==='up'&&pointerCast){pointerCast=false;E.input.release('cast')}}
    if(WQ.DEBUG)WQ._defense={
      state:()=>({room,roomTime,got,need,hp:p.hp,wisdom:p.wisdom,hits:p.hits,clouds:clouds.length,boss:boss&&{hp:boss.hp,state:boss.state}}),
      skip:()=>{got=Math.max(got,need);items.forEach(it=>it.got=true);roomTime=Math.max(roomTime,minTimes[room])},
      warp:(x,y)=>{p.x=x;p.y=y},hitBoss:()=>hitBoss(),openBoss:()=>{if(boss){boss.state='vulnerable';boss.t=0;boss.dur=9}},hurt:()=>hurt()
    };

  }
  WQ.CastleDefense=CastleDefense;
})();

    {id:'forest',number:1,year:'1학년 · 입학의 해',title:'금지된 숲의 별빛 구조대',short:'픽시에게 빼앗긴 별을 찾아요',theme:'forest',accent:'#8f73d9',icon:'✦',nextId:'stairs',stage:onClear=>WQ.BroomRescue(onClear),story:(hero,helper)=>[

          ctx.fillStyle=chapter.accent;rr(ctx,x+12,y+12,w-24,34,12);ctx.fill();
          ctx.fillStyle='#fff';ctx.font='950 16px Malgun Gothic';ctx.fillText(chapter.card.title,x+w/2,y+35);
          ctx.fillStyle='#5d4d7d';ctx.font='800 12px Malgun Gothic';
          chapter.card.lines.forEach((line,k)=>ctx.fillText(line,x+w/2,y+68+k*20));
          ctx.fillStyle='#e8a82f';ctx.font='950 15px serif';ctx.fillText(starsText(st.bestStars),x+w/2,y+118);
          ctx.fillStyle=chapter.accent;ctx.font='900 12px Malgun Gothic';ctx.fillText('보상 · '+chapter.reward,x+w/2,y+146);
        }else{
          ctx.globalAlpha=.55;ctx.fillStyle='#d5cbe4';rr(ctx,x,y,w,h,20);ctx.fill();
          ctx.fillStyle='#8b7da8';ctx.font='950 34px serif';ctx.fillText('?',x+w/2,y+78);
          ctx.font='800 13px Malgun Gothic';ctx.fillText(chapter.number+'장을 완성하면 열려요',x+w/2,y+118);
        }
        ctx.restore()});
      button(ctx,370,455,220,44,'돌아가기');ctx.textAlign='left'},
    pointer(type,x,y){if(type==='down'&&y>445)back()}}}

  /* ---- grand finale: shown once every chapter is cleared ---- */
  function Finale(){let age=0,sparks=[];const hero=WQ.Characters.current();
    function leave(to){S.click();E.setScene(to)}
    return{enter(){S.music('clear');E.announce('모든 이야기 완성! '+hero.name+'는 호그와트 수호 마법사가 되었어요. 축하해요!')},
    update(dt){age+=dt;
      if(Math.random()<dt*4)sparks.push({x:120+Math.random()*720,y:60+Math.random()*180,t:0,hue:Math.floor(Math.random()*4)});
      for(const f of sparks)f.t+=dt;sparks=sparks.filter(f=>f.t<1.2);
      if(age>1&&(E.input.buffered('ok')||E.input.buffered('cast'))){consumeConfirm();leave(Title())}},
    draw(ctx){bg(ctx,age);
      for(const f of sparks){const cols=['#ffd66f','#ff8fb5','#66c8ff','#8ee0ad'],q=F.ease.out(clamp(f.t/1.1,0,1));
        ctx.save();ctx.translate(f.x,f.y);ctx.globalAlpha=1-q;ctx.strokeStyle=cols[f.hue];ctx.lineWidth=3;
        for(let i=0;i<10;i++){const a=i/10*TAU,r1=q*40,r2=q*54;ctx.beginPath();ctx.moveTo(Math.cos(a)*r1,Math.sin(a)*r1);ctx.lineTo(Math.cos(a)*r2,Math.sin(a)*r2);ctx.stroke()}ctx.restore()}
      ctx.fillStyle='rgba(255,248,223,.96)';rr(ctx,120,120,720,352,34);ctx.fill();
      crest(ctx,480,168,.72);
      ctx.fillStyle='#34254b';ctx.textAlign='center';ctx.font='950 40px Malgun Gothic';ctx.fillText('모든 이야기 완성!',480,262);
      ctx.fillStyle='#5a426f';ctx.font='900 20px Malgun Gothic';ctx.fillText(hero.name+'는 이제 호그와트 수호 마법사!',480,300);
      ctx.fillStyle='#e8a82f';ctx.font='950 26px serif';ctx.fillText('★ '.repeat(Math.min(9,totalStars())).trim()||'★',480,342);
      ctx.fillStyle='#78678e';ctx.font='800 15px Malgun Gothic';ctx.fillText('모은 지혜의 별 '+totalStars()+'개 · 마법 카드 '+chapters.length+'장',480,374);
      WQ.Characters.list.forEach((c,i)=>{const x=384+i*96;ctx.save();ctx.translate(x,432);ctx.scale(.62,.62);WQ.Characters.drawHero(ctx,c,{t:age+i,tool:'wand',aimA:-.6});ctx.restore()});
      button(ctx,190,430,170,46,'처음으로');button(ctx,600,430,190,46,'카드 보관함');ctx.textAlign='left'},
    pointer(type,x,y){if(type!=='down'||y<420)return;if(x<400)leave(Title());else if(x>560)E.setScene(Album())}}}

  WQ.App={chapters,save,store,openChapters:()=>E.setScene(ChapterSelect()),openAlbum:()=>E.setScene(Album()),openFinale:()=>E.setScene(Finale())};
  const canvas=document.getElementById('game');E.init(canvas);E.setScene(Title());
})();

</script>
</body>
