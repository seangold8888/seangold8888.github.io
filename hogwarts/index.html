<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#11102b">
<meta name="description" content="입학 편지부터 호그와트 최종 결전까지 이어지는 7년 마법 연대기 어드벤처">
<title>호그와트 연대기 | 7년의 마법 어드벤처</title>
<link rel="preload" as="image" href="hogwarts.jpg" fetchpriority="low">
<link rel="preload" as="image" href="assets/characters/harry.jpg">
<style>
  *, *::before, *::after { box-sizing: border-box; }
  :root{
    --cream:#FFF8EC;
    --lav:#EDE4FB;
    --pink:#FFE3EF;
    --mint:#DFF6EE;
    --gold:#D9A441;
    --gold-lt:#F3D89A;
    --ink:#4A3C63;
    --ink-soft:#7B6C95;
    --card:#FFFFFF;
    --shadow:0 8px 24px rgba(120,100,160,.18);
    --r:26px;
    --page:linear-gradient(160deg,#F6EEFF 0%,#FFF8EC 55%,#FFF1F6 100%);
    /* castle scene — layered silhouettes fading into haze */
    --sky-a:#D3EEEE; --sky-b:#A6D6DC; --fog:#D3EEEE;
    --l1:#8CC0C9; --l2:#67A2B0; --l3:#457C90; --l4:#2B5A6E; --l5:#193F52; --fg:#0B2532;
    --win:#FFD98A; --moon:#FFFFFF;
  }
  body.dark{
    --sky-a:#0C1A22; --sky-b:#17333F; --fog:#12252F;
    --l1:#1D3E4C; --l2:#163241; --l3:#102734; --l4:#0B1C26; --l5:#06131A; --fg:#02080B;
    --win:#F2C14E; --moon:#E6F6F4;
  }
  #castle,#castlePhoto{width:100%;max-width:430px;height:auto;display:block;border-radius:var(--r);
          box-shadow:0 12px 30px rgba(90,70,130,.22);}
  #castlePhoto{aspect-ratio:16/10;object-fit:cover;}
  #castlePhoto[hidden]{display:none;}
  #castle .win{animation:flick 4s ease-in-out infinite;}
  @keyframes flick{0%,100%{opacity:1}45%{opacity:.55}70%{opacity:.9}}
  @media (prefers-reduced-motion:reduce){ #castle .win{animation:none;} .star{animation:none;} }
  html,body{height:100%;background:var(--page);}
  body{
    margin:0;
    font-family:'Pretendard','Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',system-ui,sans-serif;
    color:var(--ink);
    -webkit-tap-highlight-color:transparent;
    -webkit-user-select:none; user-select:none;
    overflow:hidden;
    touch-action:manipulation;
  }
  #stars{position:fixed;inset:0;pointer-events:none;z-index:0;}
  .star{position:absolute;border-radius:50%;background:#fff;box-shadow:0 0 8px #FFE9B0;opacity:.0;animation:tw 4s ease-in-out infinite;}
  @keyframes tw{0%,100%{opacity:.15;transform:scale(.7)}50%{opacity:.85;transform:scale(1.15)}}

  /* fixed to the viewport so the game fills the screen no matter what wraps it */
  #app{position:fixed;inset:0;z-index:1;overflow-y:auto;-webkit-overflow-scrolling:touch;background:var(--page);}
  .screen{
    display:none;
    min-height:100%;
    padding:24px 20px 40px;
    max-width:820px;margin:0 auto;
    flex-direction:column;justify-content:center;align-items:center;gap:18px;
    text-align:center;
  }
  .screen.on{display:flex;animation:fade .45s ease;}
  @keyframes fade{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}

  h1{font-size:clamp(30px,7vw,48px);margin:0;line-height:1.25;letter-spacing:-.5px;}
  h2{font-size:clamp(22px,5vw,32px);margin:0;line-height:1.35;}
  p.lead{font-size:clamp(17px,3.6vw,21px);color:var(--ink-soft);margin:0;line-height:1.6;}

  .btn{
    display:flex;align-items:center;justify-content:center;gap:10px;
    min-height:68px;padding:16px 26px;width:100%;max-width:520px;
    font-size:clamp(18px,3.8vw,22px);font-weight:700;font-family:inherit;
    color:var(--ink);background:var(--card);border:3px solid #F0E6FA;border-radius:var(--r);
    box-shadow:var(--shadow);cursor:pointer;transition:transform .12s ease, border-color .15s;
  }
  .btn:active{transform:scale(.965);border-color:var(--gold-lt);}
  .btn.primary{background:linear-gradient(135deg,#FFD98A,#FFB9D6);border-color:#fff;color:#5A4276;}
  .btn.ghost{background:transparent;box-shadow:none;border-color:#E4D8F5;min-height:56px;font-size:17px;}
  .btn.big{font-size:clamp(20px,4.5vw,26px);min-height:82px;}

  .card{background:var(--card);border-radius:var(--r);padding:22px;box-shadow:var(--shadow);width:100%;max-width:560px;}

  input[type=text]{
    font-family:inherit;font-size:22px;text-align:center;padding:16px;width:100%;max-width:420px;
    border:3px solid #EDE2FA;border-radius:20px;color:var(--ink);background:#fff;outline:none;
  }
  input[type=text]:focus{border-color:var(--gold-lt);}

  /* top bar */
  #bar{position:fixed;top:0;left:0;right:0;height:56px;display:flex;align-items:center;justify-content:space-between;padding:0 14px;z-index:5;pointer-events:none;}
  #bar button{pointer-events:auto;border:none;background:rgba(255,255,255,.8);backdrop-filter:blur(6px);border-radius:20px;
    min-width:56px;height:44px;font-size:16px;font-weight:800;color:var(--ink);font-family:inherit;box-shadow:0 3px 10px rgba(120,100,160,.15);cursor:pointer;}
  #bar button:active{transform:scale(.94);}
  body.hasbar .screen{padding-top:70px;}

  /* progress dots */
  .dots{display:flex;gap:9px;justify-content:center;}
  .dots i{width:11px;height:11px;border-radius:50%;background:#E7DBF7;display:block;}
  .dots i.done{background:var(--gold);}

  /* house colors */
  .crest{width:132px;height:154px;display:flex;align-items:center;justify-content:center;margin:0 auto;
         filter:drop-shadow(0 8px 18px rgba(120,100,160,.3));animation:crestIn .6s cubic-bezier(.2,1.3,.4,1) both;}
  @keyframes crestIn{from{transform:scale(.6) rotate(-6deg);opacity:0}to{transform:none;opacity:1}}

  /* wand picker */
  .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;width:100%;max-width:560px;}
  .opt{background:#fff;border:3px solid #F0E6FA;border-radius:22px;padding:14px 8px;font-size:15px;font-weight:700;
       display:flex;flex-direction:column;align-items:center;gap:8px;cursor:pointer;box-shadow:var(--shadow);min-height:110px;justify-content:center;}
  .opt .ic{font-size:32px;}
  .opt.sel{border-color:var(--gold);background:linear-gradient(135deg,#FFF6E2,#FFEFF6);}
  .opt:active{transform:scale(.96);}

  /* spell stage */
  .stagebg{position:absolute;inset:0;width:100%;height:100%;display:block;}
  .stagetint{position:absolute;inset:0;background:var(--fg);pointer-events:none;}
  #stage{position:relative;width:100%;max-width:560px;height:min(52vh,420px);border-radius:var(--r);
         background:linear-gradient(180deg,#F7F1FF,#FFF9F0);box-shadow:var(--shadow);overflow:hidden;touch-action:none;}
  .node{position:absolute;width:64px;height:64px;margin:-32px 0 0 -32px;border-radius:50%;
        background:radial-gradient(circle,#FFF3CF,#FFD98A);border:4px solid #fff;box-shadow:0 0 18px #FFD98A;
        display:flex;align-items:center;justify-content:center;font-size:26px;transition:transform .2s, opacity .2s;}
  .node.hit{background:radial-gradient(circle,#EAFBF3,#8FE3C4);box-shadow:0 0 24px #8FE3C4;transform:scale(1.18);}
  #feather{position:absolute;left:50%;bottom:18px;transform:translateX(-50%);font-size:56px;transition:bottom 1.4s cubic-bezier(.2,.8,.3,1), transform 1.4s;}
  #dim{position:absolute;inset:0;background:#3A3560;opacity:.55;transition:opacity .15s;}
  #glow{position:absolute;left:50%;top:50%;width:0;height:0;margin:0;border-radius:50%;transform:translate(-50%,-50%);
        background:radial-gradient(circle,rgba(255,246,214,.95),rgba(255,246,214,0) 70%);transition:width .15s,height .15s;pointer-events:none;}
  #lock{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);font-size:74px;transition:transform .5s,opacity .5s;}
  #ring{position:absolute;left:50%;top:50%;width:200px;height:200px;margin:0;border-radius:50%;
        transform:translate(-50%,-50%);border:8px dashed #E2D4F7;transition:border-color .2s;}
  .spark{position:absolute;font-size:24px;pointer-events:none;animation:pop 1s ease forwards;}
  @keyframes pop{0%{opacity:1;transform:scale(.4)}100%{opacity:0;transform:scale(1.8) translateY(-40px)}}
  @keyframes fall{to{top:106%;transform:rotate(540deg);opacity:.15}}
  @keyframes float{0%,100%{transform:translateY(0) rotate(-4deg)}50%{transform:translateY(-14px) rotate(4deg)}}

  /* ---- level 4 dark skin ---- */
  body.dark{--ink:#E8EEF3;--ink-soft:#9FB2C0;--card:#1F2A33;--gold:#F2C14E;--gold-lt:#7A6636;}
  body.dark .btn{background:#1F2A33;border-color:#31414E;color:#E8EEF3;}
  body.dark .btn.primary{background:linear-gradient(135deg,#3E5B6B,#5B4470);border-color:#6C8496;color:#F3F8FB;}
  body.dark .btn.ghost{background:transparent;border-color:#374856;}
  body.dark .opt{background:#1F2A33;border-color:#31414E;color:#E8EEF3;}
  body.dark .opt.sel{background:linear-gradient(135deg,#2C3B47,#3A2F47);border-color:var(--gold);}
  body.dark input[type=text]{background:#16202A;border-color:#31414E;color:#E8EEF3;}
  body.dark #bar button{background:rgba(31,42,51,.85);color:#E8EEF3;}
  body.dark .dots i{background:#31414E;}

  /* ---- passcode keypad ---- */
  #pad{position:fixed;inset:0;z-index:40;display:none;align-items:center;justify-content:center;
       background:rgba(24,20,38,.72);backdrop-filter:blur(5px);padding:20px;}
  #pad.on{display:flex;}
  #padBox{background:#1F2A33;color:#E8EEF3;border-radius:var(--r);padding:24px;width:100%;max-width:340px;text-align:center;box-shadow:0 20px 50px rgba(0,0,0,.5);}
  #padDots{font-size:34px;letter-spacing:12px;height:46px;color:#F2C14E;}
  #padMsg{min-height:22px;font-size:15px;color:#FF9AA2;margin-bottom:6px;}
  #padKeys{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;}
  #padKeys button{min-height:58px;font-size:22px;font-weight:800;font-family:inherit;border-radius:16px;
      border:2px solid #31414E;background:#16202A;color:#E8EEF3;cursor:pointer;}
  #padKeys button:active{transform:scale(.94);background:#26333E;}

  /* ---- boss duel ---- */
  #bossUI{position:absolute;inset:0;pointer-events:none;z-index:4;padding:10px 12px;
          display:flex;flex-direction:column;gap:6px;font-size:13px;font-weight:800;color:#DCE7EE;}
  .hpline{display:flex;align-items:center;gap:8px;}
  .hpbar{flex:1;height:12px;border-radius:8px;background:rgba(255,255,255,.14);overflow:hidden;}
  .hpbar i{display:block;height:100%;width:100%;transition:width .35s;}
  .hpbar.me i{background:linear-gradient(90deg,#68E0A0,#B7F5A0);}
  .hpbar.foe i{background:linear-gradient(90deg,#8E5BD0,#E0567A);}
  #tbar{height:8px;border-radius:8px;background:rgba(255,255,255,.12);overflow:hidden;margin-top:2px;}
  #tbar i{display:block;height:100%;width:100%;background:linear-gradient(90deg,#F2C14E,#FF8A6B);}
  #trees{position:absolute;inset:0;z-index:0;pointer-events:none;overflow:hidden;background:
      linear-gradient(180deg,rgba(9,13,27,.12),rgba(5,6,16,.78)),
      linear-gradient(90deg,#17152d 0 7%,transparent 7% 93%,#17152d 93%),
      radial-gradient(ellipse at 50% 25%,#354568 0,#1b223d 48%,#090b18 100%)}
  #trees::before{content:'';position:absolute;inset:6% 4% 30%;background:
      radial-gradient(ellipse at 12% 35%,rgba(242,193,78,.75) 0 2%,transparent 2.5%),
      radial-gradient(ellipse at 30% 20%,rgba(242,193,78,.7) 0 1.7%,transparent 2.2%),
      radial-gradient(ellipse at 70% 20%,rgba(242,193,78,.7) 0 1.7%,transparent 2.2%),
      radial-gradient(ellipse at 88% 35%,rgba(242,193,78,.75) 0 2%,transparent 2.5%),
      repeating-linear-gradient(90deg,transparent 0 9%,rgba(128,141,174,.2) 9% 11%,transparent 11% 20%);
      filter:drop-shadow(0 0 10px rgba(242,193,78,.55))}
  #trees::after{content:'';position:absolute;left:-10%;right:-10%;bottom:-10%;height:44%;transform:perspective(260px) rotateX(58deg);transform-origin:bottom;background:
      repeating-linear-gradient(90deg,rgba(120,123,151,.2) 0 2px,transparent 2px 54px),
      repeating-linear-gradient(0deg,rgba(120,123,151,.14) 0 2px,transparent 2px 42px),
      linear-gradient(180deg,#15182a,#080a13)}
  #stage[data-boss-phase="2"] #trees{filter:hue-rotate(18deg) brightness(.9)}
  #stage[data-boss-phase="3"] #trees{filter:sepia(.2) brightness(.82)}
  #stage[data-boss-phase="4"] #trees{filter:hue-rotate(-16deg) contrast(1.12)}
  #stage[data-boss-phase="5"] #trees{filter:saturate(.65) brightness(.72)}
  #stage[data-boss-phase="6"] #trees{filter:hue-rotate(28deg) brightness(.62) contrast(1.2)}  #foe{position:absolute;left:50%;top:36%;transform:translate(-50%,-50%);width:118px;height:150px;border:3px solid rgba(196,162,232,.72);
       border-radius:54px 54px 34px 34px;background:linear-gradient(180deg,rgba(10,16,20,.05),rgba(10,16,20,.96)),url('assets/characters/voldemort.jpg') center 18%/cover;
       box-shadow:0 0 0 6px rgba(120,60,180,.13),0 0 44px rgba(120,60,180,.72);transition:transform .25s,opacity .3s;overflow:hidden;filter:saturate(.62) contrast(1.08)}
  #foe::before{content:'';position:absolute;inset:0;background:radial-gradient(circle at 50% 30%,transparent 0 28%,rgba(8,6,18,.42) 72%);box-shadow:inset 0 -35px 38px rgba(4,2,12,.88)}
  #foe::after{content:'⚡';position:absolute;right:8px;bottom:8px;color:#d9b8ff;font-size:18px;text-shadow:0 0 12px #8f4dcc}
  #foe.cast{transform:translate(-50%,-50%) scale(1.12);filter:saturate(.35) contrast(1.2)}  #shadow{position:absolute;left:0;right:0;bottom:0;height:0;pointer-events:none;
       background:linear-gradient(0deg,rgba(90,30,120,.75),rgba(90,30,120,0));transition:height .25s;}
  @keyframes shake{0%,100%{transform:translate(0,0)}25%{transform:translate(-7px,3px)}75%{transform:translate(7px,-3px)}}
  .shaking{animation:shake .3s;}

  /* ---- sticker album ---- */
  #stickers{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:18px;}
  .stk{aspect-ratio:1;border-radius:20px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;
       background:#F6F0FF;border:2px dashed #E0D2F3;font-size:26px;color:#C9B8E4;}
  .stk .lbl{font-size:9px;font-weight:800;letter-spacing:-.2px;color:var(--ink-soft);opacity:.75;line-height:1.1;padding:0 3px;text-align:center;}
  .stk.got{background:linear-gradient(135deg,#FFF7E4,#FFEFF7);border:2px solid var(--gold-lt);
           box-shadow:0 4px 12px rgba(180,150,110,.22);animation:stampIn .5s cubic-bezier(.2,1.4,.4,1) both;}
  .stk.got .lbl{opacity:1;color:var(--ink);}
  @keyframes stampIn{from{transform:scale(1.5) rotate(-8deg);opacity:0}to{transform:none;opacity:1}}
  body.dark .stk{background:#1A242C;border-color:#2E3C48;color:#3E4E5C;}
  body.dark .stk.got{background:linear-gradient(135deg,#2A2416,#2A1F28);}

  /* ---- expelliarmus track ---- */
  #track{position:absolute;left:6%;right:6%;top:50%;height:74px;margin-top:-37px;border-radius:22px;
         background:rgba(140,110,190,.12);overflow:hidden;}
  #zone{position:absolute;top:0;bottom:0;border-radius:16px;
        background:linear-gradient(180deg,#FFE9A8,#FFC978);box-shadow:0 0 20px #FFD98A;}
  #flyer{position:absolute;top:50%;font-size:40px;transform:translate(-50%,-50%);will-change:left;}
  #hits{position:absolute;left:0;right:0;bottom:8px;text-align:center;font-weight:800;color:var(--ink-soft);
        text-shadow:0 1px 3px rgba(255,255,255,.7);z-index:5;}

  /* ---- boggart ---- */
  #bog{position:absolute;left:50%;top:48%;width:150px;height:150px;margin:-75px 0 0 -75px;border-radius:50% 50% 46% 54%/54% 50% 50% 46%;
       background:radial-gradient(circle at 38% 34%, #B9AECB, #7E7391);box-shadow:0 10px 30px rgba(80,60,120,.3);
       animation:wob 2.6s ease-in-out infinite;display:flex;align-items:center;justify-content:center;font-size:56px;
       transition:transform .35s, background .35s, border-radius .35s;}
  @keyframes wob{0%,100%{transform:translate(0,0) scale(1)}33%{transform:translate(-6px,-8px) scale(1.04)}66%{transform:translate(7px,5px) scale(.97)}}
  #bog .face{font-size:44px;filter:grayscale(.2);}
  #bog.silly{background:radial-gradient(circle at 38% 34%, #FFF0B8, #FFC7DC);animation:none;transform:scale(1.12) rotate(6deg);}
  #bogSay{position:absolute;left:0;right:0;top:8px;text-align:center;font-weight:800;color:var(--ink-soft);font-size:15px;}
  #bogCount{position:absolute;left:0;right:0;bottom:10px;text-align:center;font-size:22px;letter-spacing:5px;}

  /* ---- wand ---- */
  #wandArt{width:100%;max-width:340px;filter:drop-shadow(0 8px 18px rgba(120,100,160,.28));}
  @keyframes wandIn{from{transform:rotate(-18deg) scale(.6);opacity:0}to{transform:none;opacity:1}}
  .optWand{width:100%;height:auto;display:block;}

  /* ---- sorting hat ---- */
  #hatWrap{width:min(62vw,240px);}
  #hatSvg{width:100%;height:auto;display:block;transform-origin:50% 90%;}
  #hatSvg.drop{animation:hatDrop .9s cubic-bezier(.3,1.5,.5,1) both;}
  #hatSvg.think{animation:hatThink 1.5s ease-in-out infinite;}
  @keyframes hatDrop{from{transform:translateY(-120%) rotate(-12deg);opacity:0}to{transform:none;opacity:1}}
  @keyframes hatThink{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(3deg) translateY(-5px)}}
  #hatLine{min-height:2.2em;}

  /* ---- exploding snap cards ---- */
  .snapCard{position:relative;border:none;padding:0;background:none;cursor:pointer;
            aspect-ratio:3/4;min-height:0;perspective:600px;font-family:inherit;}
  .snapCard .back,.snapCard .front{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
            border-radius:12px;transition:transform .35s;backface-visibility:hidden;}
  .snapCard .back{background:linear-gradient(135deg,#7C5BA6,#4A3670);color:#FFE9A8;font-size:22px;
            box-shadow:0 4px 10px rgba(50,30,80,.35);}
  .snapCard .front{background:linear-gradient(135deg,#FFF6E2,#FFE6F0);font-size:clamp(20px,6vw,34px);
            transform:rotateY(180deg);box-shadow:0 4px 10px rgba(50,30,80,.25);}
  .snapCard.up .back{transform:rotateY(180deg);}
  .snapCard.up .front{transform:rotateY(0);}
  .snapCard.done{opacity:.45;}
  .snapCard.boom .front{background:linear-gradient(135deg,#FFC7A8,#FF8E8E);animation:boom .5s;}
  @keyframes boom{0%{transform:scale(1)}35%{transform:scale(1.22) rotate(4deg)}100%{transform:scale(1)}}

  /* ---- teacher intro ---- */
  #teach{display:flex;align-items:center;gap:10px;max-width:560px;width:100%;
         background:var(--card);border-radius:20px;padding:10px 14px;box-shadow:var(--shadow);
         animation:fadeUp .45s both;}
  #teach .who{font-size:12px;font-weight:800;color:var(--gold);}
  #teach .line{font-size:14px;line-height:1.4;color:var(--ink);}
  #teach svg{flex:0 0 auto;}
  .menu-item .face{flex:0 0 auto;margin-right:2px;}

  /* ---- star award ---- */
  .starPop{position:absolute;left:0;right:0;top:50%;transform:translateY(-50%);text-align:center;z-index:8;pointer-events:none;}
  .starPop .row{display:flex;gap:10px;justify-content:center;}
  .starPop .s{font-size:52px;color:rgba(255,255,255,.32);text-shadow:0 3px 10px rgba(60,40,90,.35);
              transform:scale(.2);opacity:0;}
  .starPop .s.lit{color:#FFD24A;animation:starPop .5s cubic-bezier(.2,1.6,.4,1) both;}
  @keyframes starPop{from{transform:scale(2.2) rotate(-25deg);opacity:0}to{transform:none;opacity:1}}
  .starPop .best{margin-top:8px;font-weight:900;font-size:17px;color:#fff;
                 text-shadow:0 2px 8px rgba(60,40,90,.6);animation:fadeUp .5s 1.2s both;}
  @keyframes fadeUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
  .menu-item .stars{margin-left:auto;font-size:15px;color:var(--gold);letter-spacing:1px;white-space:nowrap;}

  .spellword{font-size:clamp(24px,5.5vw,34px);font-weight:900;color:var(--gold);letter-spacing:1px;}
  .hint{font-size:clamp(15px,3.4vw,18px);color:var(--ink-soft);min-height:1.6em;}

  .menu-item{display:flex;align-items:center;gap:14px;justify-content:flex-start;text-align:left;}
  .menu-item .ic{font-size:30px;}
  .menu-item .sub{font-size:14px;font-weight:500;color:var(--ink-soft);}
  .lockicon{margin-left:auto;font-size:22px;opacity:.5;}
  .btn.doneitem{border-color:#9FE3C6;background:linear-gradient(135deg,#F2FFFA,#FFFDF3);}

  #diploma{background:linear-gradient(160deg,#FFFDF6,#FFF3F8);border:6px double var(--gold-lt);}

/* ENCHANTED EDITION — premium visual system */

.story-timeline{display:flex;align-items:center;gap:4px;width:100%;margin:13px 0 2px}.story-timeline i{position:relative;flex:1;height:5px;border-radius:999px;background:rgba(255,255,255,.18);box-shadow:inset 0 0 0 1px rgba(255,255,255,.07)}.story-timeline i.done{background:#f4c75d}.story-timeline i.current{height:8px;background:#fff;box-shadow:0 0 16px rgba(244,199,93,.85)}.story-dialogue{display:grid;grid-template-columns:42px 1fr;gap:10px;align-items:center;margin:-2px 0 6px;padding:10px 12px;border-radius:16px;background:rgba(12,10,30,.52);border:1px solid rgba(255,255,255,.13)}.story-dialogue .char-photo{border-radius:50%;overflow:hidden}.story-dialogue strong{display:block;font-size:11px;color:#f4c75d;margin-bottom:3px}.story-dialogue q{display:block;font-size:13px;line-height:1.45;color:rgba(255,255,255,.88)}.boss-mini{width:30px;height:30px;object-fit:cover;border-radius:50%;border:2px solid rgba(255,255,255,.65);vertical-align:middle;margin-right:5px}.boss-label{display:flex;align-items:center;min-width:118px}.boss-thumb{width:48px;height:48px;object-fit:cover;object-position:center 20%;border-radius:50%;border:2px solid rgba(244,199,93,.7);filter:saturate(.72) contrast(1.05)}

#vsHud{max-width:560px;white-space:normal;line-height:1.35;text-wrap:balance}

@media(forced-colors:active){#pauseLayer,.pause-card{background:Canvas;color:CanvasText;border:2px solid CanvasText}}
.story-dialogue{grid-template-columns:42px 1fr auto}.story-dialogue #storyVoiceBtn{width:40px;height:40px;padding:0;border:1px solid rgba(244,199,93,.45);border-radius:50%;background:rgba(244,199,93,.12);color:#ffe6a4;font-size:18px;cursor:pointer}.story-dialogue #storyVoiceBtn:hover,.story-dialogue #storyVoiceBtn:focus-visible{background:rgba(244,199,93,.24);box-shadow:0 0 16px rgba(244,199,93,.24)}.story-dialogue #storyVoiceBtn.playing{animation:voicePulse 1s ease-in-out infinite}@keyframes voicePulse{50%{transform:scale(1.08);box-shadow:0 0 20px rgba(244,199,93,.5)}}@media(max-width:480px){.story-dialogue{grid-template-columns:36px 1fr auto}.story-dialogue #storyVoiceBtn{width:36px;height:36px}}

/* ---- potions class ---- */
#recipeCard{position:absolute;top:10px;left:50%;transform:translateX(-50%);z-index:5;display:flex;align-items:center;gap:5px;
  padding:8px 14px;border-radius:999px;background:rgba(255,251,238,.92);border:2px solid rgba(217,164,65,.5);
  box-shadow:0 6px 18px rgba(40,30,60,.25);font-size:20px}
body.dark #recipeCard{background:rgba(24,30,40,.92);border-color:rgba(242,193,78,.4)}
.rc-item{opacity:.4;filter:grayscale(.6);transition:.25s}
.rc-item.done{opacity:1;filter:none}
.rc-item.now{opacity:1;filter:none;transform:scale(1.28);text-shadow:0 0 12px #FFD98A}
.rc-arrow{font-size:12px;opacity:.4;color:var(--ink-soft)}
#cauldron{position:absolute;left:50%;top:52%;width:132px;height:104px;transform:translate(-50%,-50%);
  background:radial-gradient(ellipse 90% 100% at 50% 12%,#3A4254,#181D28 68%);border-radius:22px 22px 60px 60px;
  box-shadow:inset 0 8px 14px rgba(255,255,255,.09),0 14px 30px rgba(8,10,16,.5);z-index:3}
#cauldron::before{content:'';position:absolute;left:-9px;right:-9px;top:-3px;height:22px;border-radius:999px;
  background:linear-gradient(180deg,#4A5468,#232A38);box-shadow:0 3px 8px rgba(0,0,0,.4)}
#brew{position:absolute;left:11px;right:11px;top:5px;height:26px;border-radius:999px;background:#7FD4E8;
  transition:background .5s;box-shadow:inset 0 4px 9px rgba(0,0,0,.32);z-index:2}
#brew.shine{animation:brewShine 1s ease-in-out infinite;box-shadow:0 0 26px #FFE9A8,inset 0 4px 9px rgba(0,0,0,.2)}
@keyframes brewShine{50%{filter:brightness(1.45) saturate(1.3)}}
#bubbles{position:absolute;inset:0;overflow:visible;pointer-events:none}
.pot-bubble{position:absolute;bottom:52%;width:9px;height:9px;border-radius:50%;
  background:rgba(255,255,255,.5);animation:bubbleUp 1.6s ease-in forwards;pointer-events:none}
@keyframes bubbleUp{to{transform:translateY(-56px) scale(.4);opacity:0}}
#cauldron.plop{animation:potPlop .4s}
@keyframes potPlop{35%{transform:translate(-50%,-50%) scale(1.07,.94)}}
#cauldron.fizzle{animation:potFizzle .5s}
@keyframes potFizzle{25%,75%{transform:translate(-52%,-50%)}50%{transform:translate(-48%,-50%)}}
#shelfRow{position:absolute;left:8px;right:8px;bottom:34px;display:flex;justify-content:center;gap:9px;z-index:4;flex-wrap:wrap}
.ingr{display:grid;place-items:center;gap:2px;min-width:64px;min-height:64px;padding:7px 9px;border-radius:18px;
  border:2px solid rgba(255,255,255,.5);background:rgba(255,252,244,.88);cursor:grab;font:inherit;transition:.2s;touch-action:none}
body.dark .ingr{background:rgba(28,34,46,.88);border-color:rgba(255,255,255,.14)}
.ingr .ie{font-size:24px}.ingr .il{font-size:10px;font-weight:850;color:var(--ink-soft)}
.ingr.glow{border-color:var(--gold);box-shadow:0 0 0 3px rgba(219,168,75,.25),0 0 18px rgba(255,217,138,.65);transform:translateY(-4px)}
.ingr-ghost{position:absolute;z-index:9;font-size:34px;transform:translate(-50%,-58%);pointer-events:none;
  filter:drop-shadow(0 6px 10px rgba(0,0,0,.35))}
/* ---- patronus ---- */
#darkVeil{position:absolute;inset:0;z-index:2;pointer-events:none;transition:opacity .7s;
  background:radial-gradient(ellipse at 50% 118%,rgba(4,6,16,.94),rgba(4,6,16,.55) 44%,transparent 74%)}
.sigil-line{stroke:#DFE9FF;stroke-width:3.4;stroke-linecap:round;filter:drop-shadow(0 0 7px #9FB8FF);
  animation:sigilIn .45s ease-out both}
@keyframes sigilIn{from{opacity:0;stroke-width:9}to{opacity:1}}
#sigil{z-index:3}
#sigil.sigil-flash{animation:sigilFlash 1.2s ease-out}
@keyframes sigilFlash{18%{filter:brightness(2.6) drop-shadow(0 0 30px #CFE0FF)}100%{filter:none}}
#patronus{position:absolute;left:-90px;top:44%;z-index:4;font-size:76px;pointer-events:none;
  filter:drop-shadow(0 0 22px #BFD4FF) drop-shadow(0 0 44px #7E9EF0) saturate(0) brightness(2.2);
  animation:patronusRun 2.6s cubic-bezier(.3,.6,.4,1) forwards}
@keyframes patronusRun{
  0%{transform:translateX(0) scale(.5);opacity:0}
  18%{opacity:1;transform:translateX(24vw) scale(1) rotate(-4deg)}
  55%{transform:translateX(58vw) translateY(-26px) scale(1.12) rotate(3deg)}
  100%{transform:translateX(120vw) translateY(-8px) scale(1);opacity:.9}}
@media(prefers-reduced-motion:reduce){#patronus{animation:patronusFade 1.8s ease forwards;left:50%;transform:translateX(-50%)}
  @keyframes patronusFade{from{opacity:0}30%,80%{opacity:1}to{opacity:0}}}
/* ---- screen transition polish ---- */
.screen.on{animation:screenIn .42s cubic-bezier(.22,.9,.32,1)}
@keyframes screenIn{from{opacity:0;transform:translateY(16px) scale(.985)}to{opacity:1;transform:none}}
#s-menu.on .menu-item{animation:menuPop .5s cubic-bezier(.2,1.1,.4,1) both}
#s-menu.on .menu-item:nth-child(3){animation-delay:.03s}#s-menu.on .menu-item:nth-child(4){animation-delay:.06s}
#s-menu.on .menu-item:nth-child(5){animation-delay:.09s}#s-menu.on .menu-item:nth-child(6){animation-delay:.12s}
#s-menu.on .menu-item:nth-child(7){animation-delay:.15s}#s-menu.on .menu-item:nth-child(8){animation-delay:.18s}
#s-menu.on .menu-item:nth-child(9){animation-delay:.21s}#s-menu.on .menu-item:nth-child(10){animation-delay:.24s}
#s-menu.on .menu-item:nth-child(11){animation-delay:.27s}#s-menu.on .menu-item:nth-child(12){animation-delay:.3s}
@keyframes menuPop{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
@media(prefers-reduced-motion:reduce){.screen.on,#s-menu.on .menu-item{animation:none}}
@media(forced-colors:active){#recipeCard,.ingr,#cauldron{background:Canvas;color:CanvasText;border:2px solid CanvasText}}

<div id="app">

  <!-- HOME -->
  <section class="screen on" id="s-home">
    <!-- Drop a file named hogwarts.jpg / .png / .webp into this folder and it is used
         instead of the drawing below. Nothing is bundled, so the published link keeps the art. -->
    <img id="castlePhoto" alt="" hidden decoding="async" fetchpriority="high">
    <svg id="castle" viewBox="0 0 400 250" role="img" aria-label="Hogwarts">
      <defs>
        <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="var(--sky-a)"/><stop offset="1" stop-color="var(--sky-b)"/>
        </linearGradient>
        <radialGradient id="halo">
          <stop offset="0" stop-color="var(--moon)" stop-opacity=".55"/>
          <stop offset=".4" stop-color="var(--moon)" stop-opacity=".12"/>
          <stop offset="1" stop-color="var(--moon)" stop-opacity="0"/>
        </radialGradient>
        <linearGradient id="hazeG" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="var(--fog)" stop-opacity="0"/>
          <stop offset=".55" stop-color="var(--fog)" stop-opacity=".9"/>
          <stop offset="1" stop-color="var(--fog)" stop-opacity="0"/>
        </linearGradient>

        <!-- one conifer, reused at many scales to build the forest layers -->
        <g id="fir">
          <path d="M0,0 L-9,0 L-5.5,-7 L-8,-7 L-4.5,-15 L-6.5,-15 L-2.5,-23 L-4,-23 L0,-34
                   L4,-23 L2.5,-23 L6.5,-15 L4.5,-15 L8,-7 L5.5,-7 L9,0 Z"/>
          <rect x="-1" y="0" width="2" height="4"/>
        </g>

        <!-- Hogwarts: one silhouette, no interior detail, as in the reference -->
        <g id="keep">
          <path d="M222,190 L228,166 L238,152 L256,144 L296,142 L318,154 L330,190 Z"/>
          <rect x="232" y="150" width="74" height="40"/>
          <rect x="258" y="92" width="17" height="60"/>
          <path d="M253,94 L266.5,48 L280,94 Z"/>
          <rect x="265.7" y="38" width="1.6" height="11"/>
          <rect x="238" y="116" width="12" height="36"/>
          <path d="M234,118 L244,94 L254,118 Z"/>
          <rect x="286" y="108" width="13" height="44"/>
          <path d="M282,110 L292.5,84 L303,110 Z"/>
          <rect x="304" y="130" width="10" height="22"/>
          <path d="M301,132 L309,114 L317,132 Z"/>
          <rect x="222" y="132" width="10" height="20"/>
          <path d="M219,134 L227,116 L235,134 Z"/>
          <rect x="248" y="128" width="9" height="24"/>
          <path d="M245,130 L252.5,112 L260,130 Z"/>
          <!-- viaduct running off to the right -->
          <rect x="306" y="150" width="72" height="7"/>
          <rect x="313" y="157" width="4" height="26"/>
          <rect x="329" y="157" width="4" height="26"/>
          <rect x="345" y="157" width="4" height="26"/>
          <rect x="361" y="157" width="4" height="26"/>
        </g>

        <!-- the far-off second castle on the left ridge -->
        <g id="keepFar">
          <rect x="112" y="118" width="30" height="16"/>
          <rect x="118" y="104" width="7" height="15"/>
          <path d="M115,106 L121.5,90 L128,106 Z"/>

      <rect width="400" height="250" fill="url(#sky)"/>

      <circle cx="196" cy="60" r="42" fill="url(#halo)"/>
      <circle cx="196" cy="60" r="19" fill="var(--moon)"/>

      <!-- depth layer 1 — farthest ridges, almost dissolved in haze -->

        <path d="M0,140 L34,116 L68,136 L104,110 L142,134 L180,120 L214,138 L252,112
                 L290,136 L328,110 L368,134 L400,120 L400,250 L0,250 Z"/>

      </g>
      <rect x="0" y="112" width="400" height="46" fill="url(#hazeG)" opacity=".55"/>

      <!-- depth layer 2 -->

        <path d="M0,158 Q46,138 96,156 Q146,174 196,152 Q248,130 300,154 Q352,176 400,152

    audioBus();const start=opts.start??ac.currentTime,dur=opts.dur??.24,gain=opts.gain??.08,wet=opts.wet??.2,pan=opts.pan||0;
    const src=ac.createBufferSource();src.buffer=getNoiseBuffer();
    const filt=ac.createBiquadFilter();filt.type=opts.type||'bandpass';filt.Q.value=opts.q??.8;
    const from=Math.max(40,opts.from??3200),to=Math.max(40,opts.to??500);
    filt.frequency.setValueAtTime(from,start);filt.frequency.exponentialRampToValueAtTime(to,start+dur);
    const env=ac.createGain();env.gain.setValueAtTime(.0001,start);env.gain.linearRampToValueAtTime(gain,start+.012);env.gain.exponentialRampToValueAtTime(.0001,start+dur);
    const p=ac.createStereoPanner?ac.createStereoPanner():null;if(p)p.pan.value=pan;
    src.connect(filt);const tail=p?(filt.connect(p),p):filt;tail.connect(env);env.connect(dryBus);
    const wg=ac.createGain();wg.gain.value=wet;env.connect(wg);wg.connect(reverbSend);
    src.start(start);src.stop(start+dur+.05);src.onended=()=>{try{src.disconnect();filt.disconnect();p?.disconnect();env.disconnect();wg.disconnect();}catch(e){}};
  }catch(e){}
}

function musicPad(root,master,t0){
  const filt=ac.createBiquadFilter();filt.type='lowpass';filt.Q.value=.55;filt.frequency.setValueAtTime(340,t0);filt.frequency.linearRampToValueAtTime(1550,t0+2.3);filt.frequency.linearRampToValueAtTime(260,t0+4.05);

  const wet=ac.createGain();wet.gain.value=.42;filt.connect(pg);pg.connect(master);pg.connect(wet);wet.connect(reverbSend);
  [1,1.5,2.002].forEach((mul,i)=>{const o=ac.createOscillator();o.type=i===0?'sine':'triangle';o.detune.value=i===2?4:-3;o.frequency.value=root*mul;o.connect(filt);o.start(t0);o.stop(t0+4.2);o.onended=()=>{try{o.disconnect();}catch(e){}};});

function musicOn(){
  if(musicNodes||!S.music)return;try{
    audioBus();const master=ac.createGain();master.gain.value=.0001;master.connect(dryBus);master.gain.exponentialRampToValueAtTime(.14,ac.currentTime+2.2);

      notes.forEach((f,k)=>playNote(f,t0+.34+k*.72,.42,{gain:.072,shimmer:.38,wet:.5,pan:k%2?.34:-.34,bus:master,attack:.008,release:.65,brightness:f*11}));

  try{const list=speechSynthesis.getVoices();if(!list.length)return;

function fallbackSpeak(text){
  if(!S.music||!window.speechSynthesis)return;try{
    speechSynthesis.cancel();const serial=++voiceSerial,u=new SpeechSynthesisUtterance(text),voice=voiceCache[lang==='ko'?'ko':'en'];
    if(voice)u.voice=voice;u.lang=lang==='ko'?'ko-KR':'en-US';u.rate=lang==='ko'?.91:.94;u.pitch=1;u.volume=(S.settings?.voiceVol??100)/100;duckMusic(true);markVoicePlaying(true);

function playVoice(kind,id,fallbackText){
  if(!S.music)return;stopVoice();const serial=++voiceSerial,key=lang+'/'+kind+'-'+id,
  /* the published single-file build carries recordings inline as data URIs */
  src=(window.__VOICE_DATA&&window.__VOICE_DATA[key])||'assets/audio/'+key+'.mp3',a=new Audio(src);voiceAudio=a;a.preload='auto';a.volume=.96;
  duckMusic(true);markVoicePlaying(kind==='story');

  a.onended=()=>finish(false);a.onerror=()=>finish(true);

/* ---------------- passcode gate for level 4 ----------------
   asked EVERY time the dark level is chosen, so it can't be stumbled into. */
let padBuf='', padCb=null, padReturnFocus=null;
function askCode(cb){
  padBuf=''; padCb=cb; padReturnFocus=document.activeElement;
  document.getElementById('padMsg').textContent='';
  drawPad();
  document.getElementById('pad').classList.add('on');
  document.getElementById('app').inert=true;document.getElementById('bar').inert=true;
  setTimeout(()=>document.getElementById('padBox').focus(),40);
}
function closePad(){
  document.getElementById('pad').classList.remove('on');document.getElementById('app').inert=false;document.getElementById('bar').inert=false;
  padCb=null;const back=padReturnFocus;padReturnFocus=null;
  setTimeout(()=>{if(back&&back.isConnected)back.focus();else document.querySelector('#lvList .doneitem,#s-vs .opt.sel,#lvList button')?.focus();},0);
}
function padPress(k){
  sTap();
  if(k==='✕'){closePad();return;}
  if(k==='⌫'){padBuf=padBuf.slice(0,-1);drawPad();return;}
  if(!/^\d$/.test(k)||padBuf.length>=DARK_CODE.length)return;
  padBuf+=k;drawPad();
  if(padBuf.length===DARK_CODE.length){
    if(padBuf===DARK_CODE){const cb=padCb;closePad();chime([220,175,146]);cb&&cb();}
    else{document.getElementById('padMsg').textContent=t().codeBad;chime([200,150]);padBuf='';setTimeout(drawPad,60);}
  }
}
document.addEventListener('keydown',e=>{
  if(!document.getElementById('pad').classList.contains('on'))return;
  if(e.key==='Tab'){
    const box=document.getElementById('padBox'),items=[...document.querySelectorAll('#padKeys button')],first=items[0],last=items.at(-1);
    if(e.shiftKey&&(document.activeElement===first||document.activeElement===box)){e.preventDefault();last?.focus();}
    else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first?.focus();}
    return;
  }  const k=/^\d$/.test(e.key)?e.key:e.key==='Backspace'?'⌫':e.key==='Escape'?'✕':null;
  if(k){e.preventDefault();padPress(k);}
});
function drawPad(){
  const dots=document.getElementById('padDots');
  dots.textContent='•'.repeat(padBuf.length)+'_'.repeat(Math.max(0,DARK_CODE.length-padBuf.length));
  dots.setAttribute('aria-label',lang==='ko'?DARK_CODE.length+'자리 중 '+padBuf.length+'자리 입력':padBuf.length+' of '+DARK_CODE.length+' digits entered');
  const keys=document.getElementById('padKeys');
  const labelKey=(b,k)=>b.setAttribute('aria-label',k==='⌫'?(lang==='ko'?'한 글자 지우기':'Delete one digit'):k==='✕'?(lang==='ko'?'취소하고 닫기':'Cancel and close'):k);
  if(keys.childElementCount){[...keys.children].forEach(b=>labelKey(b,b.textContent));return;}
  ['1','2','3','4','5','6','7','8','9','⌫','0','✕'].forEach(k=>{
    const b=document.createElement('button');
    b.textContent=k;labelKey(b,k);
    b.onclick=()=>padPress(k);
    keys.appendChild(b);
  });
}

/* The sorting hat: drops on, mutters to itself, then announces the house.

let hatTimers=[];

function sortingHat(){
  stopHat();
  const svg=document.getElementById('hatSvg');
  const line=document.getElementById('hatLine');
  const mouth=document.getElementById('hatMouth');
  line.textContent='';
  svg.classList.remove('think'); svg.classList.remove('drop');

  svg.classList.add('drop');
  go('s-hat'); if(hist.length)hist[hist.length-1]='s-level';
  chime([392,330]);

  const think=t().hatThink;
  hatTimers.push(setTimeout(()=>{ svg.classList.add('think'); },900));

    hatTimers.push(setTimeout(()=>{
      line.textContent=txt; playVoice('ui','hat-think-'+k,txt); chime([294+k*40]);

    }, 1200+k*1250));
  });
  const end=1200+think.length*1250;
  hatTimers.push(setTimeout(()=>{
    svg.classList.remove('think');
    line.textContent=t().hatSay;
    mouth.setAttribute('d','M78,146 Q100,172 124,144');
    playVoice('ui','hat-say',t().hatSay); sWin();

  hatTimers.push(setTimeout(()=>{
    renderHouse(); go('s-house',false);

}

function playDelay(fn,ms){
  const token=playToken;
  return setTimeout(()=>{if(token===playToken)fn();},ms);
}
function clearResultReturn(){
  clearTimeout(resultReturnTimer);resultReturnTimer=null;resultReturnRemaining=0;resultReturnStarted=0;resultReturnAction=null;
}
function armResultReturn(){
  if(!resultReturnAction||resultReturnRemaining<=0)return;
  resultReturnStarted=Date.now();
  resultReturnTimer=setTimeout(()=>{
    const action=resultReturnAction;resultReturnTimer=null;resultReturnRemaining=0;resultReturnStarted=0;resultReturnAction=null;action?.();
  },resultReturnRemaining);
}
function scheduleResultReturn(fn,ms){
  clearResultReturn();const token=playToken;resultReturnRemaining=ms;resultReturnAction=()=>{if(token===playToken)fn();};armResultReturn();
}
function pauseResultReturn(){
  if(!resultReturnTimer)return;clearTimeout(resultReturnTimer);resultReturnTimer=null;resultReturnRemaining=Math.max(0,resultReturnRemaining-(Date.now()-resultReturnStarted));
}
function resumeResultReturn(){if(resultReturnAction&&!resultReturnTimer)armResultReturn();}

function win(i,msg){
  if(curSpell!==i||spellResolved)return;spellResolved=true;
  if(V.hud){clearInterval(V.hud);V.hud=null;}
  sWin();
  setHint(msg);
  const r=stage.getBoundingClientRect();
  sparkle(r.width/2, r.height/2, 14);
  confetti();
  if(mode==='versus'){
    if(V.hud){clearInterval(V.hud);V.hud=null;}
    playDelay(()=>vsScored(),900);
    playDelay(()=>{ if(curSpell===i){ stopPlay(); vsAdvance(); } }, 2400);
    return;
  }
  const rawSecs=elapsedFrom(spellT0);
  const secs=rawSecs+spellPenalty;
  const got=starsFor(i,secs), level=lvIdx();
  const globalBest=Math.max(S.stars[i]||0,got);
  const levelStarBest=Math.max(S.levelStars[level][i]||0,got);
  const isNewBest=got>(S.levelStars[level][i]||0);
  const previousLevelTime=Number.isFinite(S.levelBest[level][i])?S.levelBest[level][i]:Infinity;
  const previousGlobalTime=Number.isFinite(S.bestTimes[i])?S.bestTimes[i]:Infinity;
  const isTimeBest=secs<previousLevelTime;
  const beforeAchievements=achievementDefs().map(a=>a[3]);
  S.done[i]=true;S.stars[i]=globalBest;S.levelStars[level][i]=levelStarBest;
  S.levelBest[level][i]=Math.min(previousLevelTime,secs);S.bestTimes[i]=Math.min(previousGlobalTime,secs);
  S.totalCasts++;
  const achievements=achievementDefs(),unlockedIndices=achievements.reduce((out,a,j)=>{if(a[3]&&!beforeAchievements[j])out.push(j);return out;},[]);
  save();
  const resultDelay=unlockedIndices.length?10000:8000;
  showStars(got,isNewBest,secs,isTimeBest,S.levelBest[level][i],spellPenalty,unlockedIndices,resultDelay,i);
  scheduleResultReturn(()=>advanceStoryAfter(i),resultDelay);
}

/* --- spell 0 : trace stars --- */
function spell0(){
  let w=stage.clientWidth, h=stage.clientHeight;
  const f=document.createElement('div'); f.id='feather'; f.textContent='🪶'; stage.appendChild(f);
  const N=lv().nodes, pts=[];
  for(let i=0;i<N;i++){
    const f=i/(N-1);                                   /* swish-and-flick: rise with a gentle wave */
    const x=0.14+0.72*f;
    const y=0.74-0.52*f + 0.09*Math.sin(f*Math.PI*2);
    pts.push([w*x, h*y]);
  }
  /* distance from point to the segment the finger just travelled — fast swipes can't skip a star */
  const segDist=(ax,ay,bx,by,px,py)=>{
    const dx=bx-ax, dy=by-ay, L=dx*dx+dy*dy;
    let u = L ? ((px-ax)*dx+(py-ay)*dy)/L : 0;
    u = Math.max(0, Math.min(1, u));
    return Math.hypot(ax+u*dx-px, ay+u*dy-py);
  };
  const lines=[];
  const nodes=pts.map((p,idx)=>{
    const n=document.createElement('div');
    n.className='node'; n.textContent=idx+1;
    n.style.left=p[0]+'px'; n.style.top=p[1]+'px';
    stage.appendChild(n); return n;
  });
  let next=0, down=false, prev=null;
  const placeLine=(line,idx)=>{
    const [ax,ay]=pts[idx],[bx,by]=pts[idx+1],dx=bx-ax,dy=by-ay;
    line.style.left=ax+'px';line.style.top=ay+'px';line.style.width=Math.hypot(dx,dy)+'px';line.style.transform='rotate('+Math.atan2(dy,dx)+'rad)';
  };
  const relayout=()=>{
    const nw=stage.clientWidth,nh=stage.clientHeight;if(!nw||!nh||(nw===w&&nh===h))return;
    w=nw;h=nh;
    pts.forEach((p,i)=>{const q=i/(N-1);p[0]=w*(.14+.72*q);p[1]=h*(.74-.52*q+.09*Math.sin(q*Math.PI*2));nodes[i].style.left=p[0]+'px';nodes[i].style.top=p[1]+'px';});
    lines.forEach((line,i)=>placeLine(line,i));
    if(f.dataset.up)f.style.bottom=(h-70)+'px';
    down=false;prev=null;
  };
  const resizeObserver=typeof ResizeObserver!=='undefined'?new ResizeObserver(relayout):null;resizeObserver?.observe(stage);
  const R=[62,52,44,38][lvIdx()];
  const hitTest=(x,y)=>{
    /* one fast swipe may cross several stars — keep consuming while the segment reaches them */
    while(next<pts.length){
      const [px,py]=pts[next];
      const d = prev ? segDist(prev[0],prev[1],x,y,px,py) : Math.hypot(x-px,y-py);
      if(d>=R) break;
      nodes[next].classList.add('hit');
      if(next>0){
        const [ax,ay]=pts[next-1],dx=px-ax,dy=py-ay,line=document.createElement('i');
        line.className='trace-line';placeLine(line,next-1);
        stage.appendChild(line);lines.push(line);
      }
      sparkle(px,py,4); chime([700+next*160]);
      next++;
    }
    prev=[x,y];
    if(next===pts.length && !f.dataset.up){
      f.dataset.up='1';
      f.style.bottom = (h-70)+'px';
      f.style.transform='translateX(-50%) rotate(18deg) scale(1.2)';
      playDelay(()=>{if(curSpell===0)win(0,t().good0);},700);
    }
  };
  const pos=e=>{const r=stage.getBoundingClientRect();return [e.clientX-r.left, e.clientY-r.top];};
  const d=e=>{if(!primary(e))return;down=true;prev=null;try{stage.setPointerCapture(e.pointerId);}catch(_){}hitTest(...pos(e));};
  const m=e=>{ if(primary(e)&&down) hitTest(...pos(e)); };
  const u=e=>{ if(!primary(e))return;down=false;
    if(lv().forgive && next>0 && next<pts.length){
      playDelay(()=>{ if(curSpell===0 && next<pts.length){ addPenalty(1); next=0; prev=null; nodes.forEach(n=>n.classList.remove('hit')); lines.splice(0).forEach(l=>l.remove()); setHint(t().again); } },500);
    }
  };
  inputCancel=()=>{down=false;prev=null;};
  const key=e=>{ if(e.repeat||!['Enter',' ','ArrowRight'].includes(e.key))return; e.preventDefault(); if(next<pts.length){prev=null;hitTest(...pts[next]);} };
  stage.addEventListener('pointerdown',d); stage.addEventListener('pointermove',m);
  stage.addEventListener('pointerup',u); stage.addEventListener('pointercancel',u); stage.addEventListener('keydown',key);
  cleanup=()=>{resizeObserver?.disconnect();stage.removeEventListener('pointerdown',d);stage.removeEventListener('pointermove',m);
               stage.removeEventListener('pointerup',u);stage.removeEventListener('pointercancel',u);stage.removeEventListener('keydown',key);};
}

/* --- spell 1 : hold to light --- */
function spell1(){
  const w=stage.clientWidth,h=stage.clientHeight;
  stage.insertAdjacentHTML('beforeend',
    '<div style="position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);font-size:70px">🪄</div>'+
    '<div id="dim"></div><div id="glow"></div><div id="charge"><i></i><span>0%</span></div>');
  const dim=stage.querySelector('#dim'), glow=stage.querySelector('#glow'), charge=stage.querySelector('#charge');
  const D=lv().dim;
  let p=0, timer=null, won=false;
  dim.style.opacity=D;
  const tick=()=>{
    p=Math.min(1,p+lv().hold);
    charge.style.setProperty('--charge',p); charge.querySelector('span').textContent=Math.round(p*100)+'%';
    dim.style.opacity=(D*(1-p)).toFixed(3);
    const sz=Math.max(w,h)*1.6*p;
    glow.style.width=sz+'px'; glow.style.height=sz+'px';
    if(p>=1 && !won){ won=true; clearInterval(timer); win(1,t().good1); }
  };
  const start=e=>{if(!primary(e)||won)return;try{if(e?.pointerId!=null)stage.setPointerCapture(e.pointerId);}catch(_){}if(timer)clearInterval(timer);timer=setInterval(tick,28);chime([520]);};
  const stop =e=>{ if(!primary(e)||won)return; clearInterval(timer); timer=setInterval(()=>{
      p=Math.max(0,p-(lv().forgive?0.05:0.02));
      charge.style.setProperty('--charge',p); charge.querySelector('span').textContent=Math.round(p*100)+'%';

/* --- game 7 : broomstick flight — a gentle side-scroller ---

  const ctx=cv.getContext('2d');

  const rnd=(a,b)=>a+Math.random()*(b-a);

  const collectibles=[];// {x, y, got}

  rescaleCourse=()=>{

  const pos=e=>{const r=stage.getBoundingClientRect();return Math.max(26,Math.min(r.height-26,e.clientY-r.top));};
  const down=e=>{if(!primary(e))return;try{stage.setPointerCapture(e.pointerId);}catch(_){}pointerY=pos(e);};
  const move=e=>{ if(primary(e)&&pointerY!=null) pointerY=pos(e); };
  const up=e=>{ if(primary(e))pointerY=null; };
  inputCancel=up;
  const key=e=>{if(!['ArrowUp','ArrowDown','w','W','s','S'].includes(e.key))return;e.preventDefault();targetY=Math.max(26,Math.min(cssH()-26,targetY+(['ArrowUp','w','W'].includes(e.key)?-42:42)));};
  stage.addEventListener('pointerdown',down);
  stage.addEventListener('pointermove',move);
  stage.addEventListener('pointerup',up);
  stage.addEventListener('pointercancel',up);
  stage.addEventListener('keydown',key);

  function drawScene(w,h){
    if(flightBackdrop.complete&&flightBackdrop.naturalWidth){
      const iw=flightBackdrop.naturalWidth,ih=flightBackdrop.naturalHeight,scale=Math.max(w/iw,h/ih);
      const sw=w/scale,sh=h/scale,maxX=Math.max(0,iw-sw),maxY=Math.max(0,ih-sh);
      const sx=Math.max(0,Math.min(maxX,maxX*.28+Math.sin(dist*.00045)*maxX*.12)),sy=maxY*.46;
      ctx.drawImage(flightBackdrop,sx,sy,sw,sh,0,0,w,h);
      const veil=ctx.createLinearGradient(0,0,0,h);veil.addColorStop(0,'rgba(15,35,58,.08)');veil.addColorStop(.7,'rgba(10,25,39,.18)');veil.addColorStop(1,'rgba(4,16,24,.34)');ctx.fillStyle=veil;ctx.fillRect(0,0,w,h);
      ctx.fillStyle='rgba(215,231,237,.11)';ctx.fillRect(0,h*.78,w,h*.22);
    }else{
      const g=ctx.createLinearGradient(0,0,0,h);g.addColorStop(0,getCss('--sky-a'));g.addColorStop(1,getCss('--sky-b'));ctx.fillStyle=g;ctx.fillRect(0,0,w,h);
      ctx.fillStyle=getCss('--l1');ctx.globalAlpha=.5;ctx.beginPath();ctx.moveTo(0,h*.55);
      for(let x=0;x<=w;x+=40)ctx.lineTo(x,h*.55-Math.sin((x+dist*.15)*.01)*14);
      ctx.lineTo(w,h);ctx.lineTo(0,h);ctx.fill();ctx.globalAlpha=1;
    }
  }
  /* dark-mode overrides live on body.dark, a child of documentElement, so they
     must be read from body — reading documentElement would silently miss them */
  const getCss = v => getComputedStyle(document.body).getPropertyValue(v).trim() || '#8CC0C9';

  function drawTree(sx, gapY, gapH, h){
    ctx.fillStyle=getCss('--l5');
    ctx.beginPath(); ctx.moveTo(sx-26,gapY); ctx.lineTo(sx,gapY-70); ctx.lineTo(sx+26,gapY);
    ctx.lineTo(sx+16,gapY); ctx.lineTo(sx+16,0); ctx.lineTo(sx-16,0); ctx.lineTo(sx-16,gapY); ctx.fill();
    const by=gapY+gapH;
    ctx.beginPath(); ctx.moveTo(sx-26,by); ctx.lineTo(sx,by+70); ctx.lineTo(sx+26,by);
    ctx.lineTo(sx+16,by); ctx.lineTo(sx+16,h); ctx.lineTo(sx-16,h); ctx.lineTo(sx-16,by); ctx.fill();
  }

  const flightReducedMotion=matchMedia('(prefers-reduced-motion:reduce)').matches||S.settings?.reduceMotion;
  function drawMagicTrail(x,y){
    const color=AURA_COLORS[S.aura]||AURA_COLORS.gold,trail=S.trail||'spark',count=flightReducedMotion?2:7;
    ctx.save();ctx.globalCompositeOperation='screen';
    if(trail==='mist'){
      const g=ctx.createLinearGradient(x-125,y,x-18,y);g.addColorStop(0,color+'00');g.addColorStop(1,color+'88');ctx.fillStyle=g;
      for(let k=0;k<count;k++){ctx.globalAlpha=.13+k/count*.18;ctx.beginPath();ctx.ellipse(x-105+k*13,y+Math.sin(phase*2+k)*9,30,7,0,0,Math.PI*2);ctx.fill();}
    }else if(trail==='stars'){
      ctx.fillStyle=color;ctx.textAlign='center';ctx.textBaseline='middle';ctx.font='bold 13px Georgia';
      for(let k=0;k<count;k++){ctx.globalAlpha=.2+k/count*.65;ctx.fillText(k%2?'✦':'★',x-112+k*14,y+Math.sin(phase*3+k*1.7)*12);}
    }else{
      ctx.fillStyle=color;
      for(let k=0;k<count;k++){const r=2+(k%3);ctx.globalAlpha=.18+k/count*.65;ctx.beginPath();ctx.arc(x-112+k*14,y+Math.sin(phase*4+k)*8,r,0,Math.PI*2);ctx.fill();}
    }
    ctx.restore();
  }

  function drawBroom(x,y,ang){
    ctx.save(); ctx.translate(x,y); ctx.rotate(ang);
    const rider=selectedRiderSprite(),aura=AURA_COLORS[S.aura]||AURA_COLORS.gold;
    if(rider.complete&&rider.naturalWidth){
      const glow=ctx.createRadialGradient(0,-4,4,0,-4,62);glow.addColorStop(0,aura+'55');glow.addColorStop(1,aura+'00');ctx.fillStyle=glow;ctx.fillRect(-72,-58,144,116);
      ctx.save();ctx.shadowColor=aura;ctx.shadowBlur=14;ctx.shadowOffsetY=4;ctx.drawImage(rider,-68,-48,136,91);ctx.restore();ctx.restore();return;
    }
    if(broomSprite.complete&&broomSprite.naturalWidth){
      ctx.save();ctx.shadowColor='rgba(20,12,8,.32)';ctx.shadowBlur=7;ctx.shadowOffsetY=3;
      ctx.drawImage(broomSprite,-62,-41,124,83);ctx.restore();
    }else{
      ctx.strokeStyle='#6E5535';ctx.lineWidth=5;ctx.lineCap='round';
      ctx.beginPath();ctx.moveTo(-26,4);ctx.lineTo(42,-2);ctx.stroke();
      ctx.strokeStyle='#B4915B';ctx.lineWidth=8;
      ctx.beginPath();ctx.moveTo(-34,10);ctx.lineTo(-22,-6);ctx.stroke();
    }
    ctx.fillStyle=getCss('--fg');
    ctx.beginPath(); ctx.arc(16,-4,8,0,7); ctx.fill();
    ctx.fillStyle='#3B3A5C';
    ctx.beginPath(); ctx.moveTo(10,2); ctx.lineTo(24,2); ctx.lineTo(20,16); ctx.lineTo(14,16); ctx.fill();
    ctx.restore();
  }

  function frame(now){
    if(gamePaused){last=now;raf=requestAnimationFrame(frame);return;}
    const dt=Math.min(.032,(now-last)/1000); last=now;
    phase += dt;
    if(!won){
      dist += LV.speed*dt;
      if(pointerY!=null) targetY=pointerY;
      py += (targetY-py)*Math.min(1,dt*8);
      vy = (targetY-py);
      if(bump>0) bump=Math.max(0,bump-dt*3);
    }
    const w=cssW(), h=cssH();
    ctx.save(); ctx.scale(dpr,dpr);
    drawScene(w,h);

    obstacles.forEach(o=>{
      const sx=o.x-dist+120;
      if(sx<-40||sx>w+40) return;
      drawTree(sx,o.gapY,o.gapH,h);
      if(!o.cleared && sx < 118){
        o.cleared=true;
        const inGap = py > o.gapY+10 && py < o.gapY+o.gapH-10;
        if(!inGap){bump=1;collisions++;show();addPenalty(.8);impactFx(.58);buzz(20);chime([260,200],.1,{gain:.07,wet:.1});}
      }
    });
    collectibles.forEach(c=>{
      const sx=c.x-dist+120;
      if(c.got||c.missed)return;
      if(sx<-30){c.missed=true;addPenalty(.35,true);show();return;}
      if(sx>w+30)return;
      ctx.fillStyle='#FFD24A';
      ctx.save(); ctx.translate(sx,c.y+Math.sin(phase*3+c.x)*4);
      ctx.beginPath();
      for(let k=0;k<5;k++){ const a=-Math.PI/2+k*2.51; ctx.lineTo(Math.cos(a)*10,Math.sin(a)*10);
        const a2=a+1.256; ctx.lineTo(Math.cos(a2)*4,Math.sin(a2)*4); }
      ctx.closePath(); ctx.fill(); ctx.restore();
      if(!won && Math.abs(sx-120)<24 && Math.abs(c.y-py)<28){
        c.got=true; gotStars++; show(); sGood(); sparkle(sx,c.y,5);
      }
    });

    if(!won){
      const finSx=finishX-dist+120;
      if(finSx<w+80){
        ctx.fillStyle=getCss('--l4');
        ctx.font='bold 40px sans-serif'; ctx.textAlign='center';
        ctx.fillText('🏰', Math.min(finSx,w-40), h*0.45);
        if(finSx < 110){ won=true; wonAt=performance.now(); playDelay(()=>{if(curSpell===7)finish();},350); }
      }
    }

    const by=py + Math.sin(phase*2.2)*3 + bump*-18;
    drawMagicTrail(120,by);
    drawBroom(120,by,vy*.02+bump*.5);
    ctx.restore();

    if(!won || performance.now()-wonAt<400) raf=requestAnimationFrame(frame);
  }
  function finish(){
    if(curSpell!==7)return;
    const treeBonus = obstacles.filter(o=>o.cleared).length;   // just for the readout; all clears already gentle
    const secs=elapsedFrom(spellT0);
    win(7, t().good7);
  }
  show();
  raf=requestAnimationFrame(frame);
  cleanup=()=>{
    cancelAnimationFrame(raf);
    stage.removeEventListener('pointerdown',down);
    stage.removeEventListener('pointermove',move);
    stage.removeEventListener('pointerup',up);
    stage.removeEventListener('pointercancel',up);
    stage.removeEventListener('keydown',key);
    resizeObserver?.disconnect();
  };
}

/* --- game 8 : potions class — drag ingredients into the cauldron in
   recipe order, then stir. Wrong picks just fizzle (no fail state). --- */
function spell8(){
  const count=[3,4,5,6][lvIdx()];
  const names=t().potionNames;
  const EMOJI=['💧','🐉','🌸','🔥','⭐','🥚'];
  const COLORS=['#7FD4E8','#7FE3A9','#F3A9D4','#FFB169','#F4E27A','#B9E86F'];
  /* recipe = the first `count` ingredients, but shelf order is shuffled */
  const recipe=[...Array(count).keys()];
  const shelf=[...recipe].sort(()=>Math.random()-0.5);
  let step=0, stirring=false, stirAcc=0, stirPrev=null, done=false;

  const w=stage.clientWidth, h=stage.clientHeight;
  stage.insertAdjacentHTML('beforeend',
    '<div id="recipeCard" role="list"></div>'+
    '<div id="cauldron"><div id="brew"></div><div id="bubbles"></div></div>'+
    '<div id="shelfRow"></div>'+
    '<div id="hits" aria-live="polite"></div>');
  const card=stage.querySelector('#recipeCard'), pot=stage.querySelector('#cauldron'),
        brew=stage.querySelector('#brew'), row=stage.querySelector('#shelfRow'),
        cnt=stage.querySelector('#hits');

  const renderCard=()=>{
    card.innerHTML=recipe.map((ing,i)=>
      `<span class="rc-item${i<step?' done':''}${i===step?' now':''}" role="listitem">${EMOJI[ing]}</span>`
    ).join('<span class="rc-arrow">▸</span>');
  };
  const renderShelf=()=>{
    row.innerHTML='';
    shelf.forEach(ing=>{
      const b=document.createElement('button');
      b.className='ingr'+(ing===recipe[step]&&!stirring?' glow':'');
      b.dataset.ing=ing;
      b.innerHTML=`<span class="ie">${EMOJI[ing]}</span><span class="il">${names[ing]}</span>`;
      b.setAttribute('aria-label',names[ing]);
      row.appendChild(b);
    });
  };
  const show=()=>{ cnt.textContent = stirring ? t().potionStir : t().potionStep(step,count); };

  /* drag an ingredient chip; drop over the cauldron to add it */
  let drag=null;
  const pos=e=>{const r=stage.getBoundingClientRect();return [e.clientX-r.left,e.clientY-r.top];};
  const overPot=(x,y)=>{
    const pr=pot.getBoundingClientRect(), sr=stage.getBoundingClientRect();
    return x>pr.left-sr.left-14 && x<pr.right-sr.left+14 && y>pr.top-sr.top-14 && y<pr.bottom-sr.top+20;
  };
  const down=e=>{
    if(done) return;
    const [x,y]=pos(e);
    if(stirring){ stirPrev=[x,y]; return; }
    const b=e.target.closest('.ingr'); if(!b) return;
    const ghost=document.createElement('div');
    ghost.className='ingr-ghost'; ghost.textContent=EMOJI[+b.dataset.ing];
    ghost.style.left=x+'px'; ghost.style.top=y+'px';
    stage.appendChild(ghost);
    drag={ing:+b.dataset.ing, ghost};
  };
  const move=e=>{
    const [x,y]=pos(e);
    if(drag){ drag.ghost.style.left=x+'px'; drag.ghost.style.top=y+'px'; return; }
    if(stirring && stirPrev && !done){
      const pr=pot.getBoundingClientRect(), sr=stage.getBoundingClientRect();
      const cx=pr.left-sr.left+pr.width/2, cy=pr.top-sr.top+pr.height/2;
      const a1=Math.atan2(stirPrev[1]-cy,stirPrev[0]-cx), a2=Math.atan2(y-cy,x-cx);
      let d=a2-a1; while(d>Math.PI)d-=2*Math.PI; while(d<-Math.PI)d+=2*Math.PI;
      stirAcc+=Math.abs(d); stirPrev=[x,y];
      brew.style.transform=`rotate(${stirAcc*40}deg)`;
      if(stirAcc>Math.PI*2*1.2){
        done=true; brew.classList.add('shine');
        sparkle(cx,cy,14); confetti();
        playDelay(()=>win(8,t().good8),500);
      }
    }
  };
  const up=e=>{
    stirPrev=null;
    if(!drag) return;
    const [x,y]=pos(e);
    const {ing,ghost}=drag; drag=null;
    ghost.remove();
    if(!overPot(x,y)) return;
    if(ing===recipe[step]){
      step++; sGood(); buzz(15);
      brew.style.background=COLORS[ing];
      pot.classList.add('plop'); setTimeout(()=>pot.classList.remove('plop'),400);
      sparkle(x,y,6);
      if(step>=count){ stirring=true; setHint(t().potionStir); }
      renderCard(); renderShelf(); show();
    } else {
      chime([250,190]); buzz(20);
      pot.classList.add('fizzle'); setTimeout(()=>pot.classList.remove('fizzle'),500);
      setHint(t().potionWrong);
      playDelay(()=>{ if(curSpell===8&&!done) setHint(t().hint8); },1600);
    }
  };
  /* gentle ambient bubbles */
  const bubbleTimer=setInterval(()=>{
    if(document.hidden||gamePaused) return;
    const bb=document.createElement('i');
    bb.className='pot-bubble';
    bb.style.left=(34+Math.random()*32)+'%';
    bb.style.animationDuration=(1.2+Math.random()*0.8)+'s';
    stage.querySelector('#bubbles')?.appendChild(bb);
    setTimeout(()=>bb.remove(),2200);
  },560);

  renderCard(); renderShelf(); show();
  stage.addEventListener('pointerdown',down);
  stage.addEventListener('pointermove',move);
  stage.addEventListener('pointerup',up);
  stage.addEventListener('pointercancel',up);
  cleanup=()=>{
    clearInterval(bubbleTimer);
    stage.removeEventListener('pointerdown',down);
    stage.removeEventListener('pointermove',move);
    stage.removeEventListener('pointerup',up);
    stage.removeEventListener('pointercancel',up);
  };
}

/* --- game 9 : expecto patronum — connect the stars of a constellation;
   each link pushes the creeping dark back, and finishing it releases a
   silver guardian that sweeps the screen clean. The anti-fear finale. --- */
function spell9(){
  const N=[4,5,6,7][lvIdx()];
  const w=stage.clientWidth, h=stage.clientHeight;
  stage.insertAdjacentHTML('beforeend',
    '<svg id="sigil" width="100%" height="100%" style="position:absolute;inset:0"></svg>'+
    '<div id="darkVeil"></div><div id="hits" aria-live="polite"></div>');
  const svg=stage.querySelector('#sigil'), veil=stage.querySelector('#darkVeil'),
        cnt=stage.querySelector('#hits');

  /* constellation: a ring of stars with jitter, so the finished sigil
     always reads as a closed figure of light */
  const pts=[];
  const cx=w/2, cy=h*0.5, R=Math.min(w,h)*0.32;
  for(let i=0;i<N;i++){
    const a=-Math.PI/2 + i*(Math.PI*2/N) + (Math.random()-.5)*0.3;
    const r=R*(0.85+Math.random()*0.3);
    pts.push([cx+Math.cos(a)*r, cy+Math.sin(a)*r]);
  }
  const NS='http://www.w3.org/2000/svg';
  const lines=[];
  pts.forEach((p,i)=>{
    const g=document.createElementNS(NS,'g');
    g.innerHTML=`<circle cx="${p[0]}" cy="${p[1]}" r="14" fill="#C9D8FF" opacity=".16"/>
      <circle class="star-core" cx="${p[0]}" cy="${p[1]}" r="5.5" fill="#EAF1FF"/>
      <text x="${p[0]}" y="${p[1]-20}" text-anchor="middle" fill="#AFC2F5" font-size="13" font-weight="900">${i+1}</text>`;
    svg.appendChild(g);
  });
  let next=0, downOn=false, prev=null, done=false;
  veil.style.opacity=.5;
  const show=()=>cnt.textContent=t().patroLeft(next,N);

  const segD=(ax,ay,bx,by,px,py)=>{
    const dx=bx-ax, dy=by-ay, L=dx*dx+dy*dy;
    let u=L?((px-ax)*dx+(py-ay)*dy)/L:0; u=Math.max(0,Math.min(1,u));
    return Math.hypot(ax+u*dx-px, ay+u*dy-py);
  };
  const pos=e=>{const r=stage.getBoundingClientRect();return [e.clientX-r.left,e.clientY-r.top];};
  const link=(a,b)=>{
    const ln=document.createElementNS(NS,'line');
    ln.setAttribute('x1',a[0]);ln.setAttribute('y1',a[1]);
    ln.setAttribute('x2',b[0]);ln.setAttribute('y2',b[1]);
    ln.setAttribute('class','sigil-line');
    svg.appendChild(ln); lines.push(ln);
  };
  const test=(x,y)=>{
    if(done) return;
    while(next<N){
      const [px,py]=pts[next];
      const d=prev?segD(prev[0],prev[1],x,y,px,py):Math.hypot(x-px,y-py);
      if(d>=46) break;
      if(next>0) link(pts[next-1],pts[next]);
      svg.children[next].querySelector('.star-core').setAttribute('r','9');
      sparkle(px,py,5); chime([620+next*90]); buzz(10);
      next++;
      veil.style.opacity=String(0.5*(1-next/N));
      show();
    }
    prev=[x,y];
    if(next===N && !done){
      done=true;
      link(pts[N-1],pts[0]);                       /* close the figure */
      summonPatronus();
    }
  };
  const down=e=>{ downOn=true; prev=null; test(...pos(e)); };
  const move=e=>{ if(downOn) test(...pos(e)); };
  const up=()=>{ downOn=false; prev=null; };

  function summonPatronus(){
    const formIdx=(S.name||'').length % t().patroForm.length;
    const form=t().patroForm[formIdx];
    const beast=document.createElement('div');
    beast.id='patronus';
    beast.textContent=['🦌','🦦','🐕','🐈','🐇','🦉'][(S.name||'').length % 6];
    stage.appendChild(beast);
    veil.style.opacity=0;
    svg.classList.add('sigil-flash');
    sWin(); confetti();
    setHint(t().patroIs(form)); playVoice('ui','patro-'+formIdx,t().patroIs(form));
    playDelay(()=>win(9,t().good9),2400);
  }

  show();
  stage.addEventListener('pointerdown',down);
  stage.addEventListener('pointermove',move);
  stage.addEventListener('pointerup',up);
  stage.addEventListener('pointercancel',up);
  cleanup=()=>{
    stage.removeEventListener('pointerdown',down);
    stage.removeEventListener('pointermove',move);
    stage.removeEventListener('pointerup',up);
    stage.removeEventListener('pointercancel',up);
  };
}

      '<div class="hpline"><span class="boss-label"><img class="boss-mini" src="'+CHAR_PHOTOS.voldemort+'" alt="">'+t().bossName+'</span><span class="hpbar foe"><i id="hpFoe"></i></span></div>'+
      '<div id="tbar"><i id="tfill"></i></div>'+
      '<div id="roundTxt" style="text-align:center;opacity:.75"></div>'+
      '<div id="comboTxt" class="boss-combo" role="status" aria-live="polite"></div>'+
    '</div>';
  B={hpMe:BOSS.hp,hpFoe:BOSS.rounds,round:0,tick:null,t0:0,limit:0,nodes:[],pts:[],norms:[],next:0,prev:null,busy:false,status:'hint',combo:0,shield:false};
  nextRound();
}

function bossBars(){
  document.getElementById('hpMe').style.width  = (100*B.hpMe/BOSS.hp)+'%';
  document.getElementById('hpFoe').style.width = (100*B.hpFoe/BOSS.rounds)+'%';
  document.getElementById('roundTxt').textContent=t().bossRound(B.round,BOSS.rounds)+' · '+bossPhase();
  const combo=document.getElementById('comboTxt');if(combo){combo.textContent=B.shield?'🛡 PROTEGO':('🔥 '+B.combo+' / 3');combo.classList.toggle('charged',B.shield);}
}

function layoutBossNodes(){
  if(!B||!B.norms?.length)return;
  const w=stage.clientWidth,h=stage.clientHeight;
  B.norms.forEach(([x,y],i)=>{B.pts[i]=[w*x,h*y];B.nodes[i].style.left=(w*x)+'px';B.nodes[i].style.top=(h*y)+'px';B.nodes[i].classList.remove('hit');});
  B.next=0;B.prev=null;
}
window.addEventListener('resize',()=>{if(B&&!B.busy)layoutBossNodes();});
function nextRound(){
  if(!B) return;
  B.round++;stage.dataset.bossPhase=String(B.round);
  B.limit = Math.max(6000, 12000 - (B.round-1)*900);   /* timer tightens each round */
  B.t0 = Date.now(); B.next=0; B.prev=null; B.busy=false;B.status='hint';
  setHint(bossPhase());

  stage.querySelectorAll('.node').forEach(n=>n.remove());
  const w=stage.clientWidth,h=stage.clientHeight,pattern=BOSS_SIGILS[(B.round-1)%BOSS_SIGILS.length];
  B.norms=pattern.map(point=>point.slice());B.pts=[];B.nodes=[];
  B.norms.forEach(([x,y],i)=>{
    B.pts.push([w*x,h*y]);
    const n=document.createElement('div');n.className='node';n.textContent=i+1;
    n.style.left=(w*x)+'px';n.style.top=(h*y)+'px';stage.appendChild(n);B.nodes.push(n);
  });  bossBars();

  clearInterval(B.tick);
  B.tick=setInterval(()=>{
    if(!B||document.hidden||gamePaused) return;
    const left = 1 - (Date.now()-B.t0)/B.limit;
    document.getElementById('tfill').style.width = Math.max(0,left*100)+'%';
    document.getElementById('shadow').style.height = Math.round((1-Math.max(0,left))*70)+'%';  /* the chase */
    if(left<=0 && !B.busy){ B.busy=true; bossStrike(); }
  }, 60);
}

function bossStrike(){
  clearInterval(B.tick);
  const foe=stage.querySelector('#foe');foe.classList.add('cast');
  if(B.shield){
    B.shield=false;B.combo=0;B.status='shield';bossBars();setHint(t().bossShield);
    stage.classList.add('shield-flash');chime([523,784,1047,1568]);
    playDelay(()=>{if(foe)foe.classList.remove('cast');stage.classList.remove('shield-flash');},520);
    playDelay(()=>{if(B)nextRound();},950);return;
  }
  stage.classList.add('shaking');impactFx(1.15);chime([150,110],.12,{gain:.09,wet:.16});B.hpMe--;B.combo=0;B.status='miss';bossBars();setHint(t().bossMiss);
  playDelay(()=>{if(foe)foe.classList.remove('cast');stage.classList.remove('shaking');},400);
  playDelay(()=>{if(!B)return;if(B.hpMe<=0)bossEnd(false);else nextRound();},1100);
}

function bossCast(){
  clearInterval(B.tick);B.busy=true;
  const foe=stage.querySelector('#foe');
  sparkle(stage.clientWidth/2,stage.clientHeight*.34,10);whooshFx(true,1.15);chime([880,1175,1568],.1,{gain:.13,wet:.42});
  B.hpFoe--;B.combo++;
  const earned=B.combo>=3;
  if(earned){B.shield=true;B.combo=0;}
  B.status=earned?'earned':'hit';bossBars();setHint(earned?t().bossShieldEarned:t().bossHit);
  foe.style.opacity=.45;
  playDelay(()=>{if(stage.querySelector('#foe'))foe.style.opacity=1;},300);
  playDelay(()=>{if(!B)return;if(B.hpFoe<=0)bossEnd(true);else nextRound();},earned?1150:900);
}
function bossEnd(won){
  lastBossWon=won;if(won){S.storyComplete=true;save();}inputCancel=null;stopBoss(); droneOff();
  renderBossResult();
  if(won)sWin();else{impactFx(.9);chime([300,240,190],.15,{gain:.085,wet:.25});}
  stage.innerHTML=''; stage.classList.remove('stage-good','stage-miss','shaking'); stage.removeAttribute('aria-label'); stage.removeAttribute('role'); stage.removeAttribute('tabindex');stage.removeAttribute('data-boss-phase'); curSpell=-1;
  go('s-boss',false);
}

/* boss pointer handling — same segment-based tracing as the gentle spells */
(function(){
  const segD=(ax,ay,bx,by,px,py)=>{
    const dx=bx-ax, dy=by-ay, L=dx*dx+dy*dy;
    let u=L?((px-ax)*dx+(py-ay)*dy)/L:0; u=Math.max(0,Math.min(1,u));
    return Math.hypot(ax+u*dx-px, ay+u*dy-py);
  };
  let down=false;
  const pos=e=>{const r=stage.getBoundingClientRect();return [e.clientX-r.left, e.clientY-r.top];};
  const test=(x,y)=>{
    if(!B||B.busy) return;
    while(B.next<B.pts.length){
      const [px,py]=B.pts[B.next];
      const d = B.prev ? segD(B.prev[0],B.prev[1],x,y,px,py) : Math.hypot(x-px,y-py);
      if(d>=46) break;
      B.nodes[B.next].classList.add('hit');
      chime([620+B.next*140]);
      B.next++;
    }
    B.prev=[x,y];
    if(B.next===B.pts.length) bossCast();
  };
  const cancel=e=>{if(!primary(e))return;down=false;if(B&&!B.busy){B.next=0;B.prev=null;B.nodes.forEach(n=>n.classList.remove('hit'));}};
  stage.addEventListener('pointerdown',e=>{ if(!primary(e)||curSpell!==3||!B)return; down=true;inputCancel=cancel;try{stage.setPointerCapture(e.pointerId);}catch(_){} B.prev=null; test(...pos(e)); });
  stage.addEventListener('pointermove',e=>{ if(!primary(e)||curSpell!==3||!down)return; test(...pos(e)); });
  stage.addEventListener('pointerup',cancel);
  stage.addEventListener('pointercancel',cancel);
  stage.addEventListener('keydown',e=>{ if(e.repeat||!B||B.busy||!['Enter',' ','ArrowRight'].includes(e.key))return; e.preventDefault(); B.prev=null; test(...B.pts[B.next]); });
})();

/* ---------------- versus (2 players) ---------------- */
const MULT=[1.0,1.5,2.2,3.5];
let mode='solo';
let V={p:[{name:'',level:0,score:0},{name:'',level:1,score:0}],turn:0,spell:0,t0:0,hud:null,count:3};

document.getElementById('vsBtn').onclick=()=>{ sTap(); renderVsSetup(); go('s-vs'); };

function renderVsSetup(){
  [0,1].forEach(k=>{
    const c=document.getElementById('vsCard'+k);
    c.innerHTML='';
    const inp=document.createElement('input');
    inp.type='text'; inp.maxLength=10;
    inp.placeholder = k===0 ? t().p1 : t().p2; inp.setAttribute('aria-label',inp.placeholder); inp.autocomplete='off';
    inp.value = V.p[k].name;
    inp.oninput=()=>{ V.p[k].name=inp.value; };
    c.appendChild(inp);
    const row=document.createElement('div');
    row.className='grid'; row.style.marginTop='14px';
    t().lvs.forEach((L,i)=>{
      const b=document.createElement('button');
      b.type='button'; b.className='opt'+(V.p[k].level===i?' sel':''); b.setAttribute('aria-pressed',V.p[k].level===i);
      b.innerHTML=`<span class="ic">${L.i}</span><span>${L.n}</span>`+
                  `<span style="font-size:12px;color:var(--gold);font-weight:800">×${MULT[i].toFixed(1)}</span>`;
      b.onclick=()=>{
        sTap();
        const pick=()=>{ V.p[k].level=i; renderVsSetup(); };
        if(i===3 && V.p[k].level!==3) askCode(pick); else pick();
      };
      row.appendChild(b);
    });
    c.appendChild(row);
  });
  const lenRow=document.getElementById('vsLenRow');
  lenRow.innerHTML='';
  [[3,t().vsLen3],[5,t().vsLen5]].forEach(([n,label])=>{
    const b=document.createElement('button');
    b.type='button'; b.className='opt'+(V.count===n?' sel':''); b.setAttribute('aria-pressed',V.count===n);
    b.style.minHeight='70px';
    b.innerHTML=`<span style="font-size:15px">${label}</span>`;
    b.onclick=()=>{ V.count=n; sTap(); renderVsSetup(); };
    lenRow.appendChild(b);
  });
}

document.getElementById('vsStart').onclick=()=>{
  V.p[0].name = V.p[0].name.trim() || t().p1;
  V.p[1].name = V.p[1].name.trim() || t().p2;
  V.p[0].score=0; V.p[1].score=0; V.turn=0; V.spell=0;
  mode='versus'; sTap(); showTurn();
};

function renderVsTurn(){
  const p=V.p[V.turn];
  lvOverride=p.level;
  document.getElementById('vsTurnIcon').textContent=t().lvs[p.level].i;
  document.getElementById('vsTurnName').textContent=t().vsTurnT(p.name);
  document.getElementById('vsTurnScore').textContent=V.p[0].name+' '+V.p[0].score+'  ·  '+V.p[1].name+' '+V.p[1].score;
}
function showTurn(){renderVsTurn();go('s-vsturn',false);}
document.getElementById('vsGo').onclick=()=>{
  sTap();
  lvOverride = V.p[V.turn].level;
  startSpell(V.spell);
};

function vsHudTick(){
  const el=document.getElementById('vsHud');
  const p=V.p[V.turn];
  const sec=(elapsedFrom(V.t0)+spellPenalty).toFixed(1);
  el.textContent = `${p.name} · ${t().vsSpellOf(V.spell+1,V.count)} · ⏱ ${sec}s`;
}

function vsScored(){
  const secs=elapsedFrom(V.t0)+spellPenalty;
  const p=V.p[V.turn];
  const pts=Math.max(50, Math.round(1000*MULT[p.level]/(1+secs/6)));
  p.score += pts;
  const pop=document.createElement('div');pop.className='vs-score-pop';pop.textContent='+'+pts;stage.appendChild(pop);
  setHint(t().vsGain(pts));
  return pts;
}

function vsAdvance(){
  V.spell++;
  if(V.spell<V.count){ showTurn(); return; }
  V.spell=0;
  if(V.turn===0){ V.turn=1; showTurn(); return; }
  vsResult();
}

function renderVsResult(){
  const [a,b]=V.p;
  document.getElementById('vsWinTxt').textContent=a.score===b.score?t().vsTie:t().vsWin(a.score>b.score?a.name:b.name);
  const maxScore=Math.max(1,a.score,b.score),tie=a.score===b.score;
  document.getElementById('vsBoard').innerHTML=V.p.map(p=>
    '<div class="vs-score-row'+(!tie&&p.score===maxScore?' winner':'')+'">'+
      '<div class="vs-score-head"><span class="vs-level">'+t().lvs[p.level].i+'</span><strong>'+esc(p.name)+'</strong><b>'+p.score+'</b></div>'+
      '<div class="vs-score-meter"><i style="width:'+Math.max(4,p.score/maxScore*100)+'%"></i></div>'+
    '</div>').join('');
}
function vsResult(){renderVsResult();sWin();go('s-vsres',false);}
document.getElementById('vsAgain').onclick=()=>{ lvOverride=null;sTap(); renderVsSetup(); go('s-vs',false); };

};

function achievementDefs(){
  const totalStars=S.stars.reduce((a,b)=>a+b,0),perfect=S.stars.filter(v=>v===3).length;

  return lang==='ko'
    ? [
      ['📚','연대기 완주','8개 이야기 장 완료',complete],
      ['⭐','별 수집가','별 12개 모으기',totalStars>=12],
      ['✨','완벽주의자','3성 수업 4개',perfect>=4],
      ['🏆','수석 졸업','별 24개 완성',totalStars>=SPELLS*3],
      ['🪄','연습의 달인','주문 16회 성공',S.totalCasts>=16],
      ['⚡','번개 손','8초 기록 달성',fast],
      ['🛡️','호그와트 수호자','볼드모트 최종 결전 승리',S.storyComplete]
    ]
    : [
      ['📚','Chronicle Complete','Finish all 8 story chapters',complete],
      ['⭐','Star Seeker','Collect 12 stars',totalStars>=12],
      ['✨','Perfectionist','Four 3-star classes',perfect>=4],
      ['🏆','Head Graduate','Complete all 24 stars',totalStars>=SPELLS*3],
      ['🪄','Practice Master','Cast 16 successful spells',S.totalCasts>=16],
      ['⚡','Lightning Hand','Set an 8-second record',fast],
      ['🛡️','Hogwarts Defender','Win the final duel against Voldemort',S.storyComplete]
    ];
}
